- id: '037'
  skill: Implement and manage storage
  sub-skill: Configure Azure Files and Azure Blob Storage
  tags:
    - "exam topic: Implement and manage storage"
    - Azure Files
    - SMB
    - Network ports
  question: |
    You create an Azure Storage account named contosostorage.

    You plan to create a file share named data.

    Users need to map a drive to the data file share from home computers
    that run Windows 10.

    Which outbound port should you open between the home computers and
    the data file share?
  choices:
    A: "80"
    B: "443"
    C: "445"
    D: "3389"
  answer: C
  user_answer: C
  user_result: correct
  user_reasoning: Identified port 445 as the SMB port.
  explanation: |
    Correct answer: **C — outbound TCP 445.** The answer and reasoning are correct.

    Mapping \\contosostorage.file.core.windows.net\data as a Windows drive
    uses Server Message Block (SMB), which requires TCP port 445. Permit
    outbound connections from the clients to the Azure Files endpoint.
    Connectivity also depends on any intervening firewall or ISP restrictions,
    storage networking configuration, and supported authentication.

    Why the other options are wrong:

    - A, 80: HTTP, not SMB drive mapping.
    - B, 443: HTTPS for REST access, not direct SMB drive mapping.
    - D, 3389: Remote Desktop Protocol (RDP), not file-share access.

    Remember: Map a file-share drive → SMB → TCP 445.

    Related port question: Which port does an Azure Load Balancer health
    probe use?

    The destination port is configurable, not fixed. TCP probes check whether
    a TCP connection succeeds on the configured port. HTTP and HTTPS probes
    require HTTP 200 OK from the configured path; common ports are 80 and
    443 respectively, but custom ports are supported. The probe port can
    differ from the application's traffic port.

    IPv4 health probes originate from 168.63.129.16. Allow the AzureLoadBalancer
    source service tag in the backend VM's NSG and allow the probe source in
    its local firewall on the configured destination port. The number 65001
    is the priority of the default AllowAzureLoadBalancerInBound NSG rule,
    not a health-probe port. Higher-priority deny rules can block probes.

    [Microsoft Learn: Azure Load Balancer health probes](https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-custom-probe-overview)
    [Microsoft Learn: Azure Load Balancer best practices](https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-best-practices)

    [Microsoft Learn: Mount an SMB Azure file share on Windows](https://learn.microsoft.com/en-us/azure/storage/files/storage-how-to-use-files-windows)
- id: '039'
  skill: Implement and manage storage
  sub-skill: Configure access to storage
  tags:
    - "exam topic: Implement and manage storage"
    - ARM templates
    - Storage network rules
    - Blob access tiers
    - Azure Files authentication
    - Data permissions
  question: |
    HOTSPOT

    You have an Azure subscription that contains an Azure Storage account
    named storageaccount1.

    You export storageaccount1 as an Azure Resource Manager template.
    The template contains the following sections.

    ```json
    {
      "type": "Microsoft.Storage/storageAccount",
      "apiVersion": "2019-06-01",
      "name": "storageaccount1",
      "location": "eastus",
      "sku": {
        "name": "Standard_LRS",
        "tier": "Standard"
      },
      "kind": "StorageV2",
      "properties": {
        "networkAcls": {
          "bypass": "AzureServices",
          "virtualNetworkRules": [],
          "ipRules": [],
          "defaultAction": "Allow"
        },
        "supportsHttpsTrafficOnly": true,
        "encryption": {
          "services": {
            "file": {
              "keyType": "Account",
              "enabled": true
            },
            "blob": {
              "keyType": "Account",
              "enabled": true
            }
          },
          "keySource": "Microsoft.Storage"
        },
        "accessTier": "Hot"
      }
    }
    ```

    For each statement, select Yes if the statement is true. Otherwise,
    select No. Each correct selection is worth one point.
  choices:
    A server that has a public IP address of 131.107.103.10 can access storageaccount1:
      - "Yes"
      - "No"
    Individual blobs in storageaccount1 can be set to use the archive tier:
      - "Yes"
      - "No"
    Global administrators in Azure Active Directory (Azure AD) can access a file share hosted in storageaccount1 by using their Azure AD credentials:
      - "Yes"
      - "No"
  answer:
    A server that has a public IP address of 131.107.103.10 can access storageaccount1: "Yes"
    Individual blobs in storageaccount1 can be set to use the archive tier: "Yes"
    Global administrators in Azure Active Directory (Azure AD) can access a file share hosted in storageaccount1 by using their Azure AD credentials: "No"
  user_answer:
    A server that has a public IP address of 131.107.103.10 can access storageaccount1: "Yes"
    Individual blobs in storageaccount1 can be set to use the archive tier: "Yes"
    Global administrators in Azure Active Directory (Azure AD) can access a file share hosted in storageaccount1 by using their Azure AD credentials: "No"
  user_result: correct
  user_reasoning: Selected Yes for the public-IP statement because default network access is allowed; selected Yes and No for the remaining statements without further reasoning.
  learning_note: |
    Network access being allowed does not grant data permissions. The default
    Hot tier can be overridden for individual eligible blobs. Global
    Administrator does not automatically grant access to Azure Files data.
  explanation: |
    Correct selections: **Yes, Yes, No.** All attempted selections are correct.

    1. **Yes:** networkAcls.defaultAction is Allow, so the storage firewall
       permits traffic from all networks, including 131.107.103.10. Empty
       ipRules and virtualNetworkRules do not deny traffic when the default
       action is Allow. This establishes network eligibility, not anonymous
       read or write permission; appropriate authorization is still required.
       supportsHttpsTrafficOnly also requires secure transfer.

    2. **Yes:** Standard StorageV2 with LRS supports Archive for eligible
       block blobs. accessTier: Hot sets the account default and does not
       prevent explicitly setting an individual block blob to Archive.
       Archive is not a tier for every blob type or for Azure file shares.

    3. **No:** Global Administrator is a directory role, not an automatic
       grant of file-data access. Azure Files identity access requires the
       supported authentication configuration and applicable data permissions.
       The shown template does not configure an Azure Files identity source.
       Encryption being enabled for the file service does not enable identity
       authentication. Azure AD is now named Microsoft Entra ID.

    The exhibit uses a historical API version and shows the resource type
    as Microsoft.Storage/storageAccount. The valid ARM resource type is
    Microsoft.Storage/storageAccounts (plural); this transcription detail
    does not change the intended interpretation of the displayed settings.

    Remember: Network allowed ≠ data authorized; default Hot ≠ Hot only;
    Global Admin ≠ file-data access.

    [Microsoft Learn: Set the default public network access rule](https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security-set-default-access)
    [Microsoft Learn: Access tiers for blob data](https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview)
    [Microsoft Learn: Assign share-level permissions for Azure Files](https://learn.microsoft.com/en-us/azure/storage/files/storage-files-identity-assign-share-level-permissions)
- id: '040'
  skill: Implement and manage storage
  sub-skill: Configure and manage storage accounts
