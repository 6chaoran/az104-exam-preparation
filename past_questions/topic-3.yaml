  skill: Implement and manage storage
  sub-skill: Configure access to storage
  tags:
    - "exam topic: Implement and manage storage"
    - Azure RBAC
    - Azure ABAC
    - Role assignment conditions
    - Azure Queue Storage
  question: |
    You have an Azure subscription that contains a storage account named storage1.

    You plan to use conditions when assigning role-based access control
    (RBAC) roles to storage1.

    Which storage1 services support conditions when assigning roles?
  choices:
    A: containers only
    B: file shares only
    C: tables only
    D: queues only
    E: containers and queues only
    F: file shares and tables only
  answer: E
  user_answer: A
  user_result: incorrect
  learning_note: |
    Current storage data role assignment conditions support both Blob
    Storage and Queue Storage. Containers-only answers miss Queue Storage
    support and may reflect earlier feature availability. These conditions
    refine supported RBAC data permissions using attributes.
  explanation: |
    Correct answer: **E — containers and queues only.** The attempted
    answer A includes Blob Storage but omits Queue Storage.

    Azure attribute-based access control (ABAC) builds on Azure RBAC by
    adding conditions to role assignments. A condition adds an attribute
    check to an otherwise granted permission, such as permitting blob
    reads only when a blob's project tag matches a specified value.

    Current Azure supports these storage conditions on built-in or custom
    role assignments that include supported Blob Storage or Queue Storage
    data actions. Examples include Storage Blob Data Reader and Storage
    Queue Data Contributor. File-share and Table Storage data roles do
    not support these storage data conditions.

    Why the other options are wrong:

    - A: Omits supported Queue Storage conditions.
    - B and C: File shares and tables do not support these conditions.
    - D: Omits supported Blob Storage conditions.
    - F: Includes two unsupported storage services.

    An older answer key that specifies containers only may reflect earlier
    feature support. Use the current Blob-and-Queue support for this
    question. The condition applies to supported data actions, not arbitrary
    storage management operations, and does not grant permissions beyond
    those provided by the assigned role.

    Remember: Storage RBAC data conditions → Blobs + Queues.

    [Microsoft Learn: Azure attribute-based access control overview](https://learn.microsoft.com/en-us/azure/role-based-access-control/conditions-overview)
    [Microsoft Learn: Azure role assignment condition format and syntax](https://learn.microsoft.com/en-us/azure/role-based-access-control/conditions-format)
