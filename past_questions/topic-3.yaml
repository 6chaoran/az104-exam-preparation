  question: |
    You plan to create an Azure Storage account named storage1 that will
    contain a file share named share1.

    You need to ensure that share1 can support SMB Multichannel.
    The solution must minimize costs.

    How should you configure storage?
  choices:
    A: Premium performance with locally-redundant storage (LRS)
    B: Standard performance with zone-redundant storage (ZRS)
    C: Premium performance with geo-redundant storage (GRS)
    D: Standard performance with locally-redundant storage (LRS)
  answer: A
  user_answer: D
  user_result: incorrect
  learning_note: |
    Standard Azure file shares support SMB, but not SMB Multichannel.
    SMB Multichannel requires SSD (premium) file shares. Meet that feature
    requirement first, then minimize cost with LRS rather than ZRS.
  explanation: |
    Correct answer: **A — Premium performance with locally-redundant
    storage (LRS).** The attempted answer D fails the feature requirement.

    SMB Multichannel uses multiple network connections in parallel to
    improve SMB throughput. Azure Files supports it on SSD (premium)
    file shares only, not HDD (standard) shares. Select Premium performance
    for storage1, then choose LRS as the lowest-cost compatible redundancy
    option. Premium file shares support LRS and ZRS, not GRS.

    Why the other choices are wrong:

    - B: Standard performance does not support SMB Multichannel; ZRS
      changes redundancy rather than adding that protocol feature.
    - C: GRS is not a supported redundancy option for premium file shares.
    - D: Standard with LRS reduces cost but cannot meet the SMB Multichannel
      requirement. Supporting ordinary SMB does not imply Multichannel support.

    Remember: Meet the feature requirement first, then minimize cost.
    SMB Multichannel → Premium + LRS for this question.

    [Microsoft Learn: SMB file shares in Azure Files](https://learn.microsoft.com/en-us/azure/storage/files/files-smb-protocol)
    [Microsoft Learn: Improve SMB Azure file share performance](https://learn.microsoft.com/en-us/azure/storage/files/smb-performance)
