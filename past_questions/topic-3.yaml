- id: '020'
  skill: Monitor and maintain Azure resources
  sub-skill: Implement backup and recovery
  tags:
    - "exam topic: Monitor and maintain Azure resources"
    - Recovery Services vault
    - Azure Backup
    - Vault deletion
    - Stop protection
  question: |
    You have a Recovery Services vault that you use to test backups.
    The test backups contain two protected virtual machines.

    You need to delete the Recovery Services vault.

    What should you do first?
  choices:
    A: From the Recovery Services vault, delete the backup data.
    B: Modify the disaster recovery properties of each virtual machine.
    C: Modify the locks of each virtual machine.
    D: From the Recovery Services vault, stop the backup of each backup item.
  answer: D
  user_answer: D
  user_result: correct
  explanation: |
    Correct answer: **D — From the Recovery Services vault, stop the backup
    of each backup item.** The attempted answer is correct.

    The vault contains two actively protected VMs. Start by stopping backup
    protection for each item. In the portal, the Stop backup workflow lets
    you choose Delete backup data, so stopping protection and requesting
    data deletion can be performed together.

    Stopping backup while retaining the data is not enough to delete the
    vault. Remove the backup data and any remaining vault dependencies
    before completing vault deletion. Follow the applicable soft-delete
    and other vault security requirements; requesting data deletion does
    not necessarily make the vault immediately eligible for deletion.

    Why the other options are wrong:

    - A: Removing backup data is also necessary, but for an actively protected
      VM the entry point is Stop backup. Delete Backup Data is available for
      items whose protection has already stopped.
    - B: Disaster recovery properties concern Azure Site Recovery. The
      scenario describes VM backups, not replicated Site Recovery items.
    - C: Changing VM locks does not remove the vault's protected backup items
      or retained recovery points. A lock on the vault itself would be a
      separate dependency, but the question does not specify one.

    Remember: Stop protection → remove backup data and remaining dependencies
    → delete the vault. Stop backup with retained data is insufficient.

    [Microsoft Learn: Delete a Recovery Services vault](https://learn.microsoft.com/en-us/azure/backup/backup-azure-delete-vault)
    [Microsoft Learn: Manage and monitor Azure VM backups](https://learn.microsoft.com/en-us/azure/backup/backup-azure-manage-vms)
- id: '021'
  skill: Monitor and maintain Azure resources
  sub-skill: Implement backup and recovery
  tags:
    - "exam topic: Monitor and maintain Azure resources"
    - must-review
    - Recovery Services vault
    - Backup vault
    - Azure Files backup
    - Backup region requirements
    - Azure SQL Database
  question: |
    HOTSPOT

    You have an Azure subscription named Subscription1 that contains the
    resources shown in the following table.

    | Name | Type | Location | Resource group |
    |------|------|----------|----------------|
    | RG1 | Resource group | West US | Not applicable |
    | RG2 | Resource group | West US | Not applicable |
    | Vault1 | Recovery Services vault | Central US | RG1 |
    | Vault2 | Recovery Services vault | West US | RG2 |
    | VM1 | Virtual machine | Central US | RG2 |
    | storage1 | Storage account | West US | RG1 |
    | SQL1 | Azure SQL database | East US | RG2 |

    In storage1, you create a blob container named blob1 and a file share
    named share1.

    Which resources can be backed up to Vault1 and Vault2? Select the
    appropriate options in the answer area.
    Each correct selection is worth one point.
  choices:
    Can use Vault1 for backups:
      - VM1 only
      - VM1 and share1 only
      - VM1 and SQL1 only
      - VM1, storage1, and SQL1 only
      - VM1, blob1, share1, and SQL1
    Can use Vault2 for backups:
      - storage1 only
      - share1 only
      - VM1 and share1 only
      - blob1 and share1 only
      - storage1 and SQL1 only
  answer:
    Can use Vault1 for backups: VM1 only
    Can use Vault2 for backups: share1 only
  user_answer:
    Can use Vault1 for backups: VM1 only
    Can use Vault2 for backups: storage1 only
  user_result: partially_correct
  learning_note: |
    Vault1 selection was correct. For Azure Files backup, register the storage
    account with the Recovery Services vault, then select individual file
    shares to protect; the storage account is not backed up as a whole.
    Check supported workload and actual resource region, not resource-group
    membership or the resource group's metadata location.
  explanation: |
    Correct selections: **Vault1 — VM1 only; Vault2 — share1 only.**
    The attempted answer gets the Vault1 selection correct.

    Vault1 and VM1 are both in Central US. Azure VM backup requires the VM
    and Recovery Services vault to be in the same region. Their different
    resource groups do not prevent backup.

    Vault2 and storage1 are both in West US. share1 is an Azure file share
    hosted in storage1, so it can be protected by Vault2. During configuration,
    you register storage1 with the vault and then select share1 for backup.
    Registering an account does not back up the entire account or every
    storage service in it. Therefore, select share1 only, not storage1 only.

    Eliminate the other resources:

    - VM1 cannot be backed up to Vault2 because Central US and West US differ.
    - share1 cannot be backed up to Vault1 because its storage account is
      in West US rather than Central US.
    - blob1 is a Blob container. Azure Blob backup uses a Backup vault,
      which is a different resource type from a Recovery Services vault.
      Neither of the specified vaults is a Backup vault.
    - SQL1 is Azure SQL Database, a platform service with built-in backup
      capabilities. Recovery Services vault SQL backup protects SQL Server
      databases running inside Azure VMs, not Azure SQL Database directly.
    - storage1 is not protected as one whole storage account by either
      Recovery Services vault; its supported file-share workload is share1.

    The West US locations of RG1 and RG2 describe where resource-group
    metadata is stored. Resources in a resource group can reside in other
    regions. Use the actual VM, vault, and storage-account locations when
    evaluating backup eligibility. All resources are in Subscription1, so
    cross-subscription configuration is not needed in this scenario.

    Remember: Supported workload + actual resource region. Register the
    storage account; back up the file share. Recovery Services vault and
    Backup vault are different vault types.

    [Microsoft Learn: Support matrix for Azure VM backups](https://learn.microsoft.com/en-us/azure/backup/backup-support-matrix-iaas)
    [Microsoft Learn: Back up Azure Files in the Azure portal](https://learn.microsoft.com/en-us/azure/backup/backup-azure-files)
    [Microsoft Learn: Azure Backup support matrix](https://learn.microsoft.com/en-us/azure/backup/backup-support-matrix)
