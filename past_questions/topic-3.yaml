  question: |
    You have an Azure subscription that contains a storage account named storage1.

    You plan to create a blob container named container1.

    You need to use customer-managed key encryption for container1.

    Which key should you use?
  choices:
    A: an EC key that uses the P-384 curve only
    B: an EC key that uses the P-521 curve only
    C: an EC key that uses the P-384 curve or P-521 curve only
    D: an RSA key with a key size of 4096 only
    E: an RSA key type with a key size of 2048, 3072, or 4096 only
  answer: E
  user_answer: E
  user_result: correct
  explanation: |
    Correct answer: **E — an RSA key type with a key size of 2048, 3072,
    or 4096 only.** The attempted answer is correct.

    Azure Storage customer-managed encryption supports RSA and RSA-HSM
    keys with sizes of 2048, 3072, or 4096 bits. Elliptic-curve (EC) keys
    are not supported for this purpose, even though Azure Key Vault
    supports EC keys for other uses.

    Why the other choices are wrong:

    - A, B, and C specify unsupported elliptic-curve keys.
    - D specifies a valid RSA size, but '4096 only' incorrectly excludes
      the supported 2048-bit and 3072-bit sizes.

    Customer-managed keys are stored in Azure Key Vault or Managed HSM.
    To apply a separate customer-managed key specifically to container1,
    create an encryption scope backed by that key and select the scope
    when creating the container. This connects to Question 048's distinction
    between encryption scopes and storage account access keys.

    Remember: Storage CMK → RSA: 2048 / 3072 / 4096.

