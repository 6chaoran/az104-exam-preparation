  question: |
    HOTSPOT

    You have an Azure subscription that contains the storage accounts shown
    in the following table.

    | Name | Kind | Redundancy |
    |------|------|------------|
    | storage1 | StorageV2 | Geo-zone-redundant storage (GZRS) |
    | storage2 | BlobStorage | Read-access geo-redundant storage (RA-GRS) |
    | storage3 | BlockBlobStorage | Zone-redundant storage (ZRS) |

    You need to identify which storage accounts support lifecycle management,
    and which storage accounts support moving data to the Archive access tier.

    Which storage accounts should you use? Select the appropriate options
    in the answer area. Each correct selection is worth one point.
  choices:
    Lifecycle management:
      - storage1 only
      - storage2 only
      - storage1 and storage3 only
      - storage2 and storage3 only
      - storage1, storage2, and storage3
    The Archive access tier:
      - storage1 only
      - storage2 only
      - storage1 and storage3 only
      - storage2 and storage3 only
      - storage1, storage2, and storage3
  answer:
    Lifecycle management: storage1, storage2, and storage3
    The Archive access tier: storage2 only
  user_answer:
    Lifecycle management: storage1 and storage3 only
    The Archive access tier: storage1 only
  user_result: incorrect
  learning_note: |
    Lifecycle management includes deletion, so premium BlockBlobStorage
    supports it even without tiering. Legacy BlobStorage is also included
    by the lifecycle-specific documentation. Archive eligibility requires
    both a supported account kind and compatible redundancy: GZRS excludes
    storage1; BlobStorage with RA-GRS makes storage2 eligible.
  explanation: |
    Correct selections: **Lifecycle management — storage1, storage2, and
    storage3; Archive access tier — storage2 only.** Both attempted
    selections are incorrect.

    | Account | Lifecycle management | Archive | Reason |
    |---------|----------------------|---------|--------|
    | storage1 — StorageV2, GZRS | Yes | No | GZRS does not support Archive |
    | storage2 — BlobStorage, RA-GRS | Yes | Yes | Supported kind and redundancy |
    | storage3 — BlockBlobStorage, ZRS | Yes, deletion rules | No | Premium block blobs do not support tier changes |

    The lifecycle management overview lists general-purpose v2, premium
    block blob, and BlobStorage accounts as supported. Lifecycle rules
    include deletion as well as tier changes. Premium BlockBlobStorage
    supports deletion rules, even though it does not support tiering to
    Hot, Cool, Cold, or Archive. The attempted lifecycle selection omitted
    the supported legacy BlobStorage account, storage2.

    Archive requires checking account kind and redundancy together.
    Supported Archive redundancy options are LRS, GRS, and RA-GRS;
    ZRS, GZRS, and RA-GZRS do not support Archive. Therefore, storage1's
    StorageV2 kind does not make it eligible while it uses GZRS.
    storage2 uses BlobStorage with RA-GRS and is eligible. storage3 is
    excluded by its premium account kind as well as its ZRS configuration.

    Documentation caveat, checked October 3, 2026: The newer legacy
    BlobStorage retirement FAQ says lifecycle management is only available
    in general-purpose v2 accounts, which conflicts with the lifecycle
    management overview's explicit list. This answer follows the
    lifecycle-specific documentation and the account kinds shown in this
    older question; the inconsistency should not be silently ignored.

    Remember: Lifecycle is not tiering only. Archive needs a compatible
    account kind AND redundancy.

