    [Microsoft Learn: Azure Import/Export service](https://learn.microsoft.com/en-us/azure/import-export/storage-import-export-service)
- id: '027'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  tags:
    - "exam topic: Deploy and manage Azure compute resources"
    - Availability sets
    - Update domains
    - Fault domains
    - Planned maintenance
  question: |
    You have an app named App1 that runs on two Azure virtual machines named
    VM1 and VM2.

    You plan to implement an Azure Availability Set for App1. The solution
    must ensure that App1 is available during planned maintenance of the
    hardware hosting VM1 and VM2.

    What should you include in the Availability Set?
  choices:
    A: one update domain
    B: two fault domains
    C: one fault domain
    D: two update domains
  answer: D
  user_answer: D
  user_result: correct
  explanation: |
    Correct answer: **D — two update domains.** The attempted answer is correct.

    An update domain groups VMs and underlying hardware that can restart
    together during planned maintenance. With two update domains, Azure
    distributes VM1 and VM2 into different maintenance groups. Azure restarts
    only one update domain at a time, allowing the VM in the other domain
    to continue serving App1.

    The application must be configured so either VM can serve requests while
    the other is unavailable; the availability set provides host-maintenance
    separation rather than configuring application routing or failover itself.

    Why the other options are wrong:

    - A: One update domain places both VMs in the same maintenance group,
      so both can be restarted during the same maintenance operation.
    - B: Two fault domains separate shared hardware failure boundaries,
      such as power and networking. This helps with unexpected failures,
      but does not supply the required update-domain separation.
    - C: One fault domain provides no separation from a shared hardware
      failure and does not address planned-maintenance grouping.

    Update domains and fault domains are separate dimensions of an
    availability set. Use the decisive phrase 'planned maintenance' to
    select update domains. These domains govern Azure platform maintenance;
    do not assume they automatically sequence your own guest-OS updates.

    Remember: Update = planned maintenance; fault = unexpected hardware failure.

    [Microsoft Learn: Availability sets overview](https://learn.microsoft.com/en-us/azure/virtual-machines/availability-set-overview)
- id: '029'
  skill: Implement and manage storage
  sub-skill: Configure Azure Files and Azure Blob Storage
  tags:
    - "exam topic: Implement and manage storage"
    - Azure File Sync
    - Storage Sync Service
    - Sync groups
    - must-review
  question: |
    DRAG DROP

    You have an Azure subscription that contains an Azure file share.

    You have an on-premises server named Server1 that runs Windows Server 2016.

    You plan to set up Azure File Sync between Server1 and the Azure file share.

    You need to prepare the subscription for the planned Azure File Sync.

    Which two actions should you perform in the Azure subscription?
    Drag the appropriate actions to the correct targets. Each action may be
    used once, more than once, or not at all.
    Each correct selection is worth one point.
  choices:
    First action:
      - Create a Storage Sync Service
      - Install the Azure File Sync agent
      - Create a sync group
      - Run Server Registration
    Second action:
      - Create a Storage Sync Service
      - Install the Azure File Sync agent
      - Create a sync group
      - Run Server Registration
  answer:
    First action: Create a Storage Sync Service
    Second action: Create a sync group
  user_answer:
    First action: Install the Azure File Sync agent
    Second action: Run Server Registration
  user_result: incorrect
  learning_note: |
    Distinguish preparing the Azure subscription from preparing the server.
    Create the Storage Sync Service and then a sync group in Azure. Installing
    the agent and running server registration are steps performed on Server1.
    The attempted sequence is valid for server preparation, but misses the
    subscription scope explicitly requested by this question.
  explanation: |
    Correct selections: **First — Create a Storage Sync Service;
    Second — Create a sync group.** Both attempted selections are incorrect
    for the scope of this question.

    The decisive phrase is 'in the Azure subscription.' A Storage Sync Service
    is the Azure resource that manages registered servers and sync groups.
    Create it first, then create a sync group within it. The sync group defines
    the synchronization relationship; the existing Azure file share is added
    as its cloud endpoint. A server endpoint later identifies the local folder
    on Server1 to synchronize.

    Why the other actions are not the answers:

    - Install the Azure File Sync agent: This installs synchronization software
      on Server1, rather than creating the requested Azure resources.
    - Run Server Registration: This runs from Server1 after agent installation
      and registers the server with an existing Storage Sync Service.
      Registration establishes the server's relationship with Azure, but does
      not replace creating the service and sync group.

    The learner selected the correct relative order for the server-side steps,
    but answered for the wrong scope. These are necessary deployment steps;
    they are not the two subscription-preparation actions requested here.

    Remember: Azure → service + group; server → agent + registration.

    [Microsoft Learn: Deploy Azure File Sync](https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-deployment-guide)
    [Microsoft Learn: Azure File Sync server registration](https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-server-registration)
- id: '030'
  skill: Implement and manage storage
  sub-skill: Configure Azure Files and Azure Blob Storage
  tags:
    - "exam topic: Implement and manage storage"
    - must-review
    - Azure File Sync
    - Sync groups
    - Cloud endpoints
    - Server endpoints
    - Server registration
  question: |
    HOTSPOT

    You have an Azure subscription that contains the following file shares.

    | Name | Location |
    |------|----------|
    | share1 | West US |
    | share2 | West US |
    | share3 | East US |

    You have the following on-premises file shares.

    | Name | Server | Path |
    |------|--------|------|
    | data1 | Server1 | D:\Folder1 |
    | data2 | Server2 | E:\Folder2 |
    | data3 | Server3 | E:\Folder2 |

    You create an Azure file sync group named Sync1 and perform the following actions:

    - Add share1 as the cloud endpoint for Sync1.
    - Add data1 as a server endpoint for Sync1.
    - Register Server1 and Server2 to Sync1.

    For each statement, select Yes if the statement is true. Otherwise,
    select No. Each correct selection is worth one point.

    1. You can add share3 as an additional cloud endpoint for Sync1.
    2. You can add data2 as an additional server endpoint for Sync1.
    3. You can add data3 as an additional server endpoint for Sync1.
  choices:
    Add share3 as an additional cloud endpoint:
      - "Yes"
      - "No"
    Add data2 as an additional server endpoint:
      - "Yes"
      - "No"
    Add data3 as an additional server endpoint:
      - "Yes"
      - "No"
  answer:
    Add share3 as an additional cloud endpoint: "No"
    Add data2 as an additional server endpoint: "Yes"
    Add data3 as an additional server endpoint: "No"
  user_answer:
    Add share3 as an additional cloud endpoint: "No"
    Add data2 as an additional server endpoint: "No"
    Add data3 as an additional server endpoint: "No"
  user_result: partially_correct
  user_reasoning: Rejected share3 because only one cloud endpoint can be added to a sync group.
  learning_note: |
    The one-cloud-endpoint reasoning was correct. A sync group can have
    multiple server endpoints from different registered servers. Server2
    is registered and can supply data2; Server3 must be registered before
    data3 can be added. Identical folder paths on different servers do not
    conflict. Each group allows one server endpoint per registered server.
  explanation: |
    Correct selections: **No, Yes, No.** The attempted answer gets two of
    the three statements correct.

    1. No. Sync1 already has share1 as its cloud endpoint. A sync group
       supports exactly one cloud endpoint, so share3 cannot be added as
       an additional one. This limit is decisive regardless of share3's region.
    2. Yes. Server2 is registered, and Sync1 has no existing server endpoint
       on Server2. data2 can join as an additional server endpoint. A group
       can synchronize folders on multiple registered servers with its
       single Azure file share.
    3. No. Server3 is not listed as registered. Register Server3 with the
       Storage Sync Service before adding its data3 folder as an endpoint.
       The answer evaluates the stated configuration without assuming that
       an additional registration step has already occurred.

    A sync group supports one cloud endpoint and multiple server endpoints,
    with at most one server endpoint per registered server in that group.
    E:\Folder2 on Server2 and E:\Folder2 on Server3 are distinct locations;
    their identical path strings do not prevent both from participating once
    their servers are registered.

    Wording caveat: The supplied question says 'Register Server1 and Server2
    to Sync1.' Servers actually register with the Storage Sync Service, not
    directly with a sync group. Registration must also occur before creating
    a server endpoint, so the listed actions are not a valid literal
    chronological deployment sequence. The intended scenario assumes that
    Server1 and Server2 are registered and data1 is already configured.

    Remember: One cloud share → many registered servers → one folder per
    server per sync group.

    [Microsoft Learn: Deploy Azure File Sync](https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-deployment-guide)
    [Microsoft Learn: Manage Azure File Sync registered servers](https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-server-registration)
- id: '031'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  tags:
    - "exam topic: Monitor and maintain Azure resources"
    - Azure Backup reports
    - Diagnostic settings
    - Log Analytics
    - Regional requirements
    - must-review
  question: |
    HOTSPOT

    You have an Azure subscription named Subscription1 that contains the
    resources shown in the following table.

    | Name | Type | Location | Resource group |
    |------|------|----------|----------------|
    | RG1 | Resource group | East US | Not applicable |
    | RG2 | Resource group | West US | Not applicable |
    | Vault1 | Recovery Services vault | West Europe | RG1 |
    | storage1 | Storage account | East US | RG2 |
    | storage2 | Storage account | West US | RG1 |
    | storage3 | Storage account | West Europe | RG2 |
    | Analytics1 | Log Analytics workspace | East US | RG1 |
    | Analytics2 | Log Analytics workspace | West US | RG2 |
    | Analytics3 | Log Analytics workspace | West Europe | RG1 |

    You plan to configure Azure Backup reports for Vault1.

    You are configuring the Diagnostics settings for the AzureBackupReports log.

    Which storage accounts and which Log Analytics workspaces can you use
    for the Azure Backup reports of Vault1? Select the appropriate options
    in the answer area. Each correct selection is worth one point.
  choices:
    Storage accounts:
      - storage1 only
      - storage2 only
      - storage3 only
      - storage1, storage2, and storage3
    Log Analytics workspaces:
      - Analytics1 only
      - Analytics2 only
      - Analytics3 only
      - Analytics1, Analytics2, and Analytics3
  answer:
    Storage accounts: storage3 only
    Log Analytics workspaces: Analytics1, Analytics2, and Analytics3
  user_answer:
    Storage accounts: storage3 only
    Log Analytics workspaces: Analytics3 only
  user_result: partially_correct
  learning_note: |
    The same-region requirement for diagnostic storage destinations does not
    apply to Log Analytics workspaces. Vault1 is in West Europe, so storage3
    is eligible, while all three workspaces can receive its logs. Use the
    monitored resource's region, not its resource group's location.
  explanation: |
    Correct selections: **storage3 only; Analytics1, Analytics2, and Analytics3.**
    The attempted storage selection is correct, but the workspace selection
    unnecessarily excludes Analytics1 and Analytics2.

    For a regional monitored resource, an Azure Monitor diagnostic setting's
    destination storage account must be in the same region as that resource.
    Vault1 is in West Europe, so only storage3 qualifies. storage1 is in
    East US and storage2 is in West US.

    Log Analytics workspaces can receive diagnostic logs from resources in
    other regions. Analytics1, Analytics2, and Analytics3 are therefore all
    eligible; matching West Europe is not required for this destination type.

    Resource-group membership does not determine destination eligibility.
    RG1's East US location does not change Vault1's West Europe location.
    A resource group can contain resources deployed in different regions.

    The question uses the legacy AzureBackupReports log category. The tested
    distinction is between diagnostic destination region requirements.

    Remember: Diagnostic storage = same region; Log Analytics = cross-region allowed.

    [Microsoft Learn: Diagnostic settings in Azure Monitor](https://learn.microsoft.com/en-us/azure/azure-monitor/platform/diagnostic-settings)
- id: '032'
  skill: Implement and manage storage
  sub-skill: Configure and manage storage accounts
  tags:
    - "exam topic: Implement and manage storage"
    - Storage account kinds
    - Azure Files
    - Premium file shares
    - Blob access tiers
    - must-review
  question: |
    HOTSPOT

    You have an Azure subscription that contains the storage accounts shown
    in the following exhibit.

    | Name | Type | Kind | Resource group | Location |
    |------|------|------|----------------|----------|
    | contoso101 | Storage account | StorageV2 | RG1 | East US |
    | contoso102 | Storage account | Storage | RG1 | East US |
    | contoso103 | Storage account | BlobStorage | RG1 | East US |
    | contoso104 | Storage account | FileStorage | RG1 | East US |

    Use the drop-down menus to select the answer choice that completes each
    statement based on the information presented in the graphic.
    Each correct selection is worth one point.

    1. You can create a premium file share in [answer choice].
    2. You can use the Archive access tier in [answer choice].
  choices:
    Premium file share:
      - contoso101 only
      - contoso104 only
      - contoso101 or contoso104 only
      - contoso101, contoso102, or contoso104 only
      - contoso101, contoso102, contoso103, or contoso104
    Archive access tier:
      - contoso101 only
      - contoso101 or contoso103 only
      - contoso101, contoso102, and contoso103 only
      - contoso101, contoso102, and contoso104 only
      - contoso101, contoso102, contoso103, and contoso104
  answer:
    Premium file share: contoso104 only
    Archive access tier: contoso101 or contoso103 only
  user_answer:
    Premium file share: contoso101, contoso102, or contoso104 only
    Archive access tier: contoso101 only
  user_result: incorrect
  learning_note: |
    Supporting standard file shares does not imply support for premium file
    shares. Premium file shares require FileStorage. Archive blob tiering
    is supported by StorageV2 and legacy BlobStorage, but not Storage
    (general-purpose v1) or FileStorage. The attempted Archive selection
    omitted the supported BlobStorage account.
  explanation: |
    Correct selections: **Premium file share — contoso104 only;
    Archive access tier — contoso101 or contoso103 only.** Both attempted
    selections are incorrect.

    | Account | Kind | Premium file shares | Archive blob tier |
    |---------|------|---------------------|-------------------|
    | contoso101 | StorageV2 | No | Supported account kind |
    | contoso102 | Storage (general-purpose v1) | No | No |
    | contoso103 | BlobStorage | No | Supported account kind |
    | contoso104 | FileStorage | Yes | No |

    Premium file shares use a FileStorage account with a premium SKU.
    StorageV2 and Storage accounts can support standard file shares, but
    cannot host the premium file shares requested here. BlobStorage
    accounts contain blobs rather than file shares.

    Archive is a Blob storage access tier. Standard general-purpose v2
    (StorageV2) and legacy BlobStorage accounts support archive tiering
    for block blobs. General-purpose v1 (Storage) does not support blob
    access tiering, and FileStorage does not store blobs.

    The exhibit tests account-kind capabilities and does not show SKUs or
    redundancy. Actual Archive eligibility also requires a supported
    configuration: LRS, GRS, or RA-GRS; Archive is not supported with ZRS,
    GZRS, or RA-GZRS. Premium blob accounts do not support Archive tiering.
    BlobStorage is a legacy kind; use standard StorageV2 for new workloads
    requiring blob access tiers.

    Remember: Premium files → FileStorage; Archive blobs → StorageV2 or BlobStorage.

    [Microsoft Learn: Create a classic file share](https://learn.microsoft.com/en-us/azure/storage/files/create-classic-file-share)
    [Microsoft Learn: Storage account overview](https://learn.microsoft.com/en-us/azure/storage/common/storage-account-overview)
    [Microsoft Learn: Azure Storage redundancy](https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy)
- id: '033'
  skill: Implement and manage storage
  sub-skill: Configure access to storage
  tags:
    - "exam topic: Implement and manage storage"
    - SAS
    - Account SAS
    - Azure Files
    - SMB authentication
    - IP restrictions
  question: |
    HOTSPOT

    You have an Azure subscription named Subscription1.
    In Subscription1, you create an Azure file share named share1.

    You create a shared access signature (SAS) named SAS1 as shown in the
    exhibit, with the following settings:

    | Setting | Value |
    |---------|-------|
    | Allowed services | File only |
    | Allowed resource types | Service, Container, Object |
    | Allowed permissions | Read, Write, List |
    | Other permissions | Delete, Add, Create, Update, Process not selected |
    | Start | September 1, 2018, 2:00 PM |
    | End | September 14, 2018, 2:00 PM |
    | Time zone | UTC+02:00 |
    | Allowed IP addresses | 193.77.134.10–193.77.134.50 |
    | Allowed protocols | HTTPS only |
    | Signing key | key1 |

    Select the appropriate option for each statement.
    Each correct selection is worth one point.

    1. If on September 2, 2018, you run Microsoft Azure Storage Explorer
       on a computer that has an IP address of 193.77.134.1, and you use
       SAS1 to connect to the storage account, you [answer choice].
    2. If on September 10, 2018, you run the net use command on a computer
       that has an IP address of 193.77.134.50, and you use SAS1 as the
       password to connect to share1, you [answer choice].
  choices:
    Storage Explorer on September 2:
      - will be prompted for credentials
      - will have no access
      - will have read, write, and list access
      - will have read-only access
    net use on September 10:
      - will be prompted for credentials
      - will have no access
      - will have read, write, and list access
      - will have read-only access
  answer:
    Storage Explorer on September 2: will have no access
    net use on September 10: will have no access
  user_answer:
    Storage Explorer on September 2: will have no access
    net use on September 10: will have read, write, and list access
  user_result: partially_correct
  learning_note: |
    The first selection was correct because 193.77.134.1 is outside the SAS
    IP range. The second request passes the date and inclusive IP-range checks,
    but net use uses SMB, which does not accept SAS tokens as passwords.
    Distinguish Azure Files REST/HTTPS access from SMB drive mounting.
  explanation: |
    Correct selections: **will have no access, will have no access.**
    The attempted answer gets the first statement correct.

    September 2 is within SAS1's validity period, but 193.77.134.1 is outside
    the allowed range 193.77.134.10–193.77.134.50. Therefore, SAS1 does not
    authorize the Storage Explorer request. Its read/write/list permissions
    do not override the source-IP restriction.

    September 10 is also within the validity period, and the IP range is
    inclusive, so 193.77.134.50 is allowed. However, net use mounts an Azure
    file share over SMB. Azure Files does not support SAS authentication
    over SMB, so supplying SAS1 as the password does not grant access.
    SMB requires a supported account-key or configured identity-based
    authentication method. A failed SAS-as-password attempt does not become
    read-only access or automatically switch to another credential.

    Azure Files supports SAS for REST/HTTPS requests, such as those made
    through Storage Explorer or AzCopy. With a compatible HTTPS client on
    September 10 from 193.77.134.50, SAS1 would authorize the configured
    read, write, and list operations, assuming the other access requirements
    are met. Those permissions do not authorize deletion.

    The historical 2018 dates belong to the scenario; evaluate requests
    against those dates rather than against today's date. The start and
    expiry times are displayed in UTC+02:00. Neither scenario is close to
    the validity boundary, so time conversion does not change either answer.

    Remember: Check service/resource scope, time, IP, protocol, and supported
    authentication before permissions. net use uses SMB; SAS is for REST/HTTPS.

    [Microsoft Learn: Create an account SAS — inclusive IP ranges](https://learn.microsoft.com/en-us/rest/api/storageservices/create-account-sas)
    [Microsoft Learn: Authorize requests to Azure Storage](https://learn.microsoft.com/en-us/rest/api/storageservices/authorize-requests-to-azure-storage)
    [Microsoft Learn: Mount an SMB Azure file share on Windows](https://learn.microsoft.com/en-us/azure/storage/files/storage-how-to-use-files-windows)
- id: '034'
  skill: Monitor and maintain Azure resources
  sub-skill: Implement backup and recovery
  tags:
    - "exam topic: Monitor and maintain Azure resources"
    - must-review
    - Azure Backup
    - Recovery Services vault
    - Change backup vault
    - Stop protection
    - Azure Site Recovery
  question: |
    You have two Azure virtual machines named VM1 and VM2. You have two
    Recovery Services vaults named RSV1 and RSV2.

    VM2 is backed up to RSV1.

    You need to back up VM2 to RSV2.

    What should you do first?
  choices:
    A: From the RSV1 blade, click Backup items and stop the VM2 backup.
    B: From the RSV2 blade, click Backup. From the Backup blade, select the backup for the virtual machine, and then click Backup.
    C: From the VM2 blade, click Disaster recovery, click Replication settings, and then select RSV2 as the Recovery Services vault.
    D: From the RSV1 blade, click Backup Jobs and export the VM2 job.
  answer: A
  user_answer: A
  user_result: correct
  explanation: |
    Correct answer: **A — From RSV1, open Backup items and stop VM2's backup.**
    The attempted answer is correct.

    VM2 is already protected by RSV1. Start with its existing backup item:
    RSV1 → Backup items → VM2 → Stop backup. This stops the existing
    protection before configuring backup in RSV2.

    The question asks only for the first action, not a complete migration
    procedure. Stopping protection and handling retained backup data are
    separate choices. Stopping backup while retaining data does not by
    itself establish that the same VM is eligible for protection in another
    vault. Follow the applicable requirements for existing backup items,
    soft delete, and vault security before configuring RSV2. This action
    does not transfer existing recovery points into RSV2.

    Why the other options are wrong:

    - B: It starts configuring the destination while VM2 still has its
      existing protection in RSV1. Remove that protection first.
    - C: Disaster recovery and Replication settings configure Azure Site
      Recovery, which replicates workloads for failover. They do not
      change the Azure Backup vault protecting VM2.
    - D: Exporting a backup job exports job information. It does not stop
      protection or move backup data or recovery points to another vault.

    VM1 is not involved in the requested change.

    Remember: Change backup vault → start with the existing vault.
    Backup protection and disaster-recovery replication are different operations.

    [Microsoft Learn: Manage and monitor Azure VM backups](https://learn.microsoft.com/en-us/azure/backup/backup-azure-manage-vms)
    [Microsoft Learn: Manage recovery points](https://learn.microsoft.com/en-us/azure/backup/manage-recovery-points)
- id: '035'
  skill: Implement and manage storage
  sub-skill: Configure and manage storage accounts
  tags:
    - "exam topic: Implement and manage storage"
    - must-review
    - Storage account upgrade
    - General-purpose v1
    - General-purpose v2
    - ZRS
    - Storage redundancy
  question: |
    You have a general-purpose v1 Azure Storage account named storage1 that
    uses locally-redundant storage (LRS).

    You need to ensure that the data in the storage account is protected
    if a zone fails. The solution must minimize costs and administrative effort.

    What should you do first?
  choices:
    A: Create a new storage account.
    B: Configure object replication rules.
    C: Upgrade the account to general-purpose v2.
    D: Modify the Replication setting of storage1.
  answer: C
  user_answer: C
  user_result: correct
  user_reasoning: Identified ZRS as the target redundancy and asked whether general-purpose v1 supports it.
  learning_note: |
    GPv1 does not support modern ZRS. Upgrade the existing account to Standard
    GPv2 first, then convert LRS to ZRS. Upgrading the account kind alone does
    not change its redundancy. Historical GPv1 ZRS Classic is a different
    design from modern synchronous zone-redundant storage.
  explanation: |
    Correct answer: **C — Upgrade the account to general-purpose v2.**
    The attempted answer is correct.

    ZRS provides synchronous replication across availability zones within
    a region, protecting data against a zone failure. The existing GPv1
    account does not support modern ZRS, so the account-kind upgrade is
    the prerequisite to changing redundancy.

    The intended sequence is:

    1. Upgrade storage1 in place to Standard general-purpose v2 (StorageV2).
    2. Convert its redundancy from LRS to ZRS, assuming the region and
       account features meet the conversion requirements.

    An in-place upgrade avoids creating another storage account and manually
    copying its data, reducing administrative effort. Upgrading alone leaves
    the account on LRS; zone protection requires completing the redundancy
    conversion. GPv2 uses a different pricing model, so the exam's preferred
    migration path should not be interpreted as a guarantee that every
    workload's bill decreases after upgrading.

    Why the other options are wrong:

    - A: Creating a new account and migrating data adds administrative work
      when an in-place account upgrade and supported conversion can be used.
    - B: Object replication copies supported blobs between accounts. It does
      not configure account-wide zone redundancy or remove the GPv1 prerequisite.
    - D: The existing GPv1 account cannot select modern ZRS directly. Change
      the account kind first, then change the redundancy configuration.

    Historical caveat: GPv1 had ZRS Classic for block blobs, but it did not
    provide modern ZRS's synchronous replication across availability zones.
    Do not treat an old GPv1 ZRS label as support for this conversion.
    The question describes a legacy GPv1 account; use its stated starting
    configuration when evaluating the required first step.

    Remember: GPv1 + need modern ZRS → upgrade first, change redundancy second.

    [Microsoft Learn: Change how a storage account is replicated](https://learn.microsoft.com/en-us/azure/storage/common/redundancy-migration)
    [Microsoft Learn: Storage redundancy change FAQs](https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy-change-faq)
    [Microsoft Learn: GPv1 account migration overview](https://learn.microsoft.com/en-us/azure/storage/common/general-purpose-version-1-account-migration-overview)
- id: '036'
  skill: Implement and manage storage
  sub-skill: Configure Azure Files and Azure Blob Storage
  tags:
    - "exam topic: Implement and manage storage"
    - Blob lifecycle management
    - Premium block blobs
    - Blob access tiers
    - Storage account kinds
  question: |
    You have an Azure subscription that contains the storage accounts shown
    in the following table.

    | Name | Type | Performance |
    |------|------|-------------|
    | storage1 | StorageV2 | Standard |
    | storage2 | BlobStorage | Standard |
    | storage3 | BlockBlobStorage | Premium |
    | storage4 | FileStorage | Premium |

    You plan to manage the data stored in the accounts by using lifecycle
    management rules.

    To which storage accounts can you apply lifecycle management rules?
  choices:
    A: storage1 only
    B: storage1 and storage2 only
    C: storage3 and storage4 only
    D: storage1, storage2, and storage3 only
    E: storage1, storage2, storage3, and storage4
  answer: D
  user_answer: B
  user_result: incorrect
  user_reasoning: Selected storage1 and storage2 only; was unsure whether Premium BlockBlobStorage supports access tiers.
  learning_note: |
    Premium BlockBlobStorage does not support tiering to Hot, Cool, Cold,
    or Archive, but it does support lifecycle deletion rules. Lifecycle
    management includes deletion as well as tier changes; lack of access-tier
    support does not mean lack of all lifecycle management support.
  explanation: |
    Correct answer: **D — storage1, storage2, and storage3 only.**
    The attempted answer B incorrectly excludes storage3.

    Azure Blob lifecycle management supports general-purpose v2, premium
    block blob, and legacy BlobStorage accounts. Rules can change eligible
    blobs' access tiers or delete blobs at the end of their lifecycle.

    | Account | Lifecycle rules | Tier changes |
    |---------|-----------------|--------------|
    | storage1 — Standard StorageV2 | Yes | Yes, for eligible block blobs |
    | storage2 — Standard BlobStorage | Yes | Yes, for eligible block blobs |
    | storage3 — Premium BlockBlobStorage | Yes, for deletion | No |
    | storage4 — Premium FileStorage | No | Blob tiering does not apply |

    The learner's concern about premium access tiers identifies a real
    limitation: premium block blobs cannot be moved to Hot, Cool, Cold,
    or Archive using Set Blob Tier or lifecycle management. However,
    deletion rules are supported, so storage3 must still be included.
    FileStorage contains Azure file shares, to which Blob lifecycle
    management policies do not apply.

    Why the other choices are wrong:

    - A excludes supported storage2 and storage3.
    - B excludes storage3 despite its support for lifecycle deletion rules.
    - C includes unsupported storage4 and excludes storage1 and storage2.
    - E includes storage4, which is for Azure Files rather than Blob storage.

    Remember: Premium block blobs → lifecycle deletion yes; lifecycle tiering no.

    [Microsoft Learn: Azure Blob Storage lifecycle management overview](https://learn.microsoft.com/en-us/azure/storage/blobs/lifecycle-management-overview)
    [Microsoft Learn: Access tiers for blob data](https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview)
- id: '038'
