- id: '058'
  skill: Implement and manage storage
  sub-skill: Configure access to storage
  tags:
    - "exam topic: Implement and manage storage"
    - Shared access signatures
    - Storage account access keys
    - Azure RBAC
    - Authorization methods
    - must-review
  question: |
    HOTSPOT

    You have an Azure subscription that contains a user named User1 and a
    storage account named storage1. The account contains these resources.

    | Name | Type |
    |------|------|
    | container1 | Container |
    | folder1 | File share |
    | Table1 | Table |

    User1 is assigned the following roles for storage1:

    - Storage Blob Data Reader
    - Storage Table Data Contributor
    - Storage File Data SMB Share Contributor

    For storage1, you create an account shared access signature named SAS1
    with the following settings.

    | Setting | Value |
    |---------|-------|
    | Allowed services | Table only; Blob, File, and Queue unchecked |
    | Allowed resource types | Service, Container, Object |
    | Allowed permissions | Read, Write, Delete, List, Add, Create, Update |
    | Other permission settings | Process, Immutable storage, deletion of blob versions, and blob index permissions unchecked |
    | Start | January 1, 2022, 12:00 PM |
    | End | January 1, 2030, 12:00 PM |
    | Time zone | UTC+01:00 (Belgrade, Bratislava, Budapest, Ljubljana, Prague) |
    | Allowed IP addresses | No restriction specified |
    | Allowed protocols | HTTPS only |
    | Preferred routing tier | Basic (default) |
    | Signing key | key1 |

    To which resources can User1 write by using SAS1 and key1?
    Select the appropriate option for each credential.
    Each correct selection is worth one point.
  choices:
    key1:
      - Table1 only
      - Table1 and container1 only
      - folder1 and Table1 only
      - folder1 and container1 only
      - Table1, folder1, and container1
    SAS1:
      - Table1 only
      - Table1 and container1 only
      - folder1 and Table1 only
      - folder1 and container1 only
      - Table1, folder1, and container1
  answer:
    key1: Table1, folder1, and container1
    SAS1: Table1 only
  user_answer:
    key1: folder1 and Table1 only
    SAS1: Table1 only
  user_result: partially_correct
  learning_note: |
    Evaluate permissions using the credential presented. User1's Blob Data
    Reader role does not restrict a request authorized with the account key.
    Account keys grant full account-data access; this account SAS grants
    only the services and operations included in the token. Identity roles
    do not add permissions to a request authenticated with SAS1.
  explanation: |
    Correct selections: **key1: Table1, folder1, and container1;
    SAS1: Table1 only.** The attempted answer gets one of two correct.

    Using key1 authorizes requests through Shared Key, rather than through
    User1's Microsoft Entra identity. A storage account access key grants
    full access to the account's data, including writing blobs in
    container1, files in folder1, and entities in Table1. The Storage Blob
    Data Reader assignment does not make account-key access read-only.

    SAS1 is an account SAS signed with key1, but it delegates a restricted
    subset of the key's authority. Only the Table service is selected.
    Service, Container, and Object resource types are enabled, and the
    permissions include the operations needed to modify table data.
    Therefore, SAS1 permits writes to Table1, but not to the Blob or File
    services. Signing with a full-access key does not make the SAS itself
    unrestricted.

    User1's file-share contributor role cannot supplement SAS1's excluded
    File service. The service evaluates the credential used for the request;
    it does not combine unrelated identity roles with an account SAS.
    Here, folder1 is a file share despite its folder-like name.

    The scenario assumes the credentials are available and valid, requests
    satisfy network and protocol restrictions, and Shared Key authorization
    is permitted. Having these data roles does not itself grant permission
    to retrieve key1; the question asks what can be written when using it.
    SAS1 must be used within its stated validity period over HTTPS.

    Remember: Identity → RBAC; account key → full account-data access;
    account SAS → token restrictions.

    [Microsoft Learn: Manage storage account access keys](https://learn.microsoft.com/en-us/azure/storage/common/storage-account-keys-manage)
    [Microsoft Learn: Create an account SAS](https://learn.microsoft.com/en-us/rest/api/storageservices/create-account-sas)
    [Microsoft Learn: Shared access signatures overview](https://learn.microsoft.com/en-us/azure/storage/common/storage-sas-overview)
- id: '059'
  skill: Implement and manage storage
  sub-skill: Configure access to storage
  tags:
    - "exam topic: Implement and manage storage"
    - Stored access policies
    - Immutable Blob Storage
    - Time-based retention
    - Legal holds
    - memorize
  question: |
    HOTSPOT

    You have an Azure subscription that contains the storage account shown
    in the following exhibit.

    The container1 Access policy page shows these stored access policies:

    | Identifier | Start time | Expiry time | Permissions |
    |------------|------------|-------------|-------------|
    | Policy1 | Not specified | Not specified | rcw |
    | Policy2 | Not specified | Not specified | c |

    The Immutable blob storage section shows:

    | Identifier | Scope | Retention interval | State |
    |------------|-------|--------------------|-------|
    | Time-based retention | Container | 14 days | Unlocked |

    Use the drop-down menus to select the answer choice that completes each
    statement based on the information presented in the graphic.
    Each correct selection is worth one point.

    1. The maximum number of additional stored access policies that you can
       create for container1 is [answer choice].
    2. The maximum number of additional immutable blob storage policies that
       you can create for container1 is [answer choice].
  choices:
    Additional stored access policies:
      - "0"
      - "1"
      - "3"
      - "5"
      - "6"
    Additional immutable blob storage policies:
      - "0"
      - "1"
      - "2"
      - "4"
      - "5"
  answer:
    Additional stored access policies: "3"
    Additional immutable blob storage policies: "1"
  user_answer: "I don't know"
  learning_note: |
    No answer was attempted. Memorize the separate limits: five stored
    access policies per container, and one container-level time-based
    retention policy plus one legal hold. Two stored policies leave three
    slots; an existing time-based policy leaves room for one legal hold.
  explanation: |
    Correct selections: **3 additional stored access policies;
    1 additional immutable blob storage policy.** The learner did not
    attempt a selection; this is not recorded as an incorrect answer.

    Stored access policies define permissions and validity periods for
    associated service SAS tokens. A container supports at most five
    stored access policies. Policy1 and Policy2 already occupy two slots,
    leaving 5 - 2 = 3 additional policies. Policy1's rcw permissions mean
    read, create, and write; Policy2's c means create.

    Container-level immutability supports one time-based retention policy
    and one legal hold together. The exhibit already has a 14-day
    time-based retention policy, so one legal hold can still be added.
    Another time-based policy cannot be added alongside the existing one.
    A legal hold protects data until explicitly cleared, rather than
    expiring after a fixed retention interval.

    Unlocked means the time-based retention policy can still be changed
    or removed. It does not create another time-based-policy slot.
    These limits apply to the container-level configuration in the exhibit;
    do not confuse it with version-level immutability policies.

    Blueprint context: The AZ-104 skills measured as of April 17, 2026
    explicitly include Configure stored access policies under Configure
    access to storage. Immutability and legal holds are not explicitly
    listed, but relate to configuring blob containers. Exact policy limits
    are not individually listed; Microsoft states related topics may be
    assessed. Prioritize stored access policies and their relationship to SAS.

    Remember: Stored access = 5 slots; container immutability = 1 time-based
    retention policy + 1 legal hold.

    [Microsoft Learn: Define a stored access policy](https://learn.microsoft.com/en-us/rest/api/storageservices/define-stored-access-policy)
