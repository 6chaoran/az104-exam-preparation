    B: an Azure Cosmos DB database
    C: Azure File Storage
    D: the Azure File Sync Storage Sync Service
  answer: C
  user_answer: C
  user_result: correct
  explanation: |
    Correct answer: **C — Azure File Storage (Azure Files).**
    The attempted answer is correct.

    Azure Import/Export imports large amounts of data into Azure Blob Storage
    or Azure Files by shipping prepared disk drives to an Azure datacenter.
    Of the listed options, only Azure Files is a supported destination.
    The 5 TB size explains the bulk-transfer scenario but does not change
    which destination services are supported.

    Why the other options are wrong:

    - A: A virtual machine is not a direct Import/Export destination. Files
      imported into supported storage could be used by a VM afterward.
    - B: Azure Cosmos DB is not a direct destination for this service.
      Loading imported files into a database requires a separate ingestion step.
    - D: The Storage Sync Service manages Azure File Sync relationships.
      File data resides in the Azure file share, not in the Storage Sync
      Service itself. Importing into an Azure file share is distinct from
      targeting the synchronization management resource.

    Remember: Import/Export delivers imported data to Blob Storage or Azure Files.

