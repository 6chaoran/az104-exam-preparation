- id: '001'
  skill: Implement and manage storage
  sub-skill: Configure and manage storage accounts
  tags:
    - "exam topic: Implement and manage storage"
    - Azure Import/Export
    - Azure Blob Storage
    - must-review
  question: |
    You have an Azure subscription named Subscription1 that contains the storage
    accounts shown in the following table.

    | Name | Account kind | Azure service that contains data |
    |------|--------------|----------------------------------|
    | storage1 | Storage | File |
    | storage2 | StorageV2 (general purpose v2) | File, Table |
    | storage3 | StorageV2 (general purpose v2) | Queue |
    | storage4 | BlobStorage | Blob |

    You plan to use the Azure Import/Export service to export data from Subscription1.

    You need to identify which storage account can be used to export the data.

    What should you identify?
  choices:
    A: storage1
    B: storage2
    C: storage3
    D: storage4
  answer: D
  user_answer: D
  user_result: correct
  learning_note: |
    Azure Import/Export supports importing data into Azure Blob Storage and Azure
    Files, but supports exporting only Blob data. Check the service that actually
    contains the data, rather than only the storage account kind.
  explanation: |
    **D — storage4** is correct.

    Azure Import/Export exports data from Azure Blob Storage by copying it to
    physical disk drives. storage4 is the only listed account with Blob data.

    - **A — storage1:** Its data is in Azure Files, which cannot be exported
      using Azure Import/Export.
    - **B — storage2:** Its data is in Files and Tables. Neither supports export
      using this service. A general-purpose v2 account can support Blob storage,
      but the question does not list any Blob data in this account.
    - **C — storage3:** Its data is in Queues, which this service cannot export.

    Remember: Import → Blobs and Files; Export → Blobs only.

    [Microsoft Learn: Azure Import/Export service](https://learn.microsoft.com/en-us/azure/import-export/storage-import-export-service)
- id: '002'
  skill: Implement and manage storage
  sub-skill: Configure and manage storage accounts
  tags:
    - "exam topic: Implement and manage storage"
    - Storage account kinds
    - Azure Table Storage
    - Azure Blob Storage
    - must-review
  question: |
    HOTSPOT

    You have Azure Storage accounts as shown in the following exhibit.

    | Name | Type | Kind | Resource group | Location | Subscription | Access tier | Replication |
    |------|------|------|----------------|----------|--------------|-------------|-------------|
    | storageaccount1 | Storage account | Storage | ContosoRG1 | East US | Subscription 1 | — | Read-access geo-redundant storage (RA-GRS) |
    | storageaccount2 | Storage account | StorageV2 | ContosoRG1 | Central US | Subscription 1 | Hot | Geo-redundant storage (GRS) |
    | storageaccount3 | Storage account | BlobStorage | ContosoRG1 | East US | Subscription 1 | Hot | Locally redundant storage (LRS) |

    Select the answer choice that completes each statement based on the information
    presented in the exhibit. Each correct selection is worth one point.
  choices:
    You can use these accounts for Azure Table Storage:
      - storageaccount1 only
      - storageaccount2 only
      - storageaccount3 only
      - storageaccount1 and storageaccount2 only
      - storageaccount2 and storageaccount3 only
    You can use these accounts for Azure Blob storage:
      - storageaccount3 only
      - storageaccount2 and storageaccount3 only
      - storageaccount1 and storageaccount3 only
      - all the storage accounts
  answer:
    You can use these accounts for Azure Table Storage: storageaccount1 and storageaccount2 only
    You can use these accounts for Azure Blob storage: all the storage accounts
  user_answer:
    You can use these accounts for Azure Table Storage: storageaccount1 and storageaccount2 only
    You can use these accounts for Azure Blob storage: storageaccount3 only
  user_result: partially_correct
  learning_note: |
    Blob storage is supported by general-purpose v1 (Storage), general-purpose v2
    (StorageV2), and BlobStorage accounts. The BlobStorage account kind is not the
    only kind that supports blobs. General-purpose accounts also support Files,
    Queues, and Tables; BlobStorage accounts do not support those services.
  explanation: |
    Correct selections:

    - **Azure Table Storage:** storageaccount1 and storageaccount2 only.
    - **Azure Blob storage:** all the storage accounts.

    | Account | Account kind | Table storage | Blob storage |
    |---------|--------------|---------------|--------------|
    | storageaccount1 | Storage (general-purpose v1) | Yes | Yes |
    | storageaccount2 | StorageV2 (general-purpose v2) | Yes | Yes |
    | storageaccount3 | BlobStorage | No | Yes |

    Both general-purpose account kinds support Blobs, Files, Queues, and Tables.
    The BlobStorage kind supports blobs only. Therefore, storageaccount3 is excluded
    from the Table selection, but all three accounts are included in the Blob selection.

    The learner's Table selection was correct. The Blob selection omitted the two
    general-purpose accounts. Account location, the listed replication settings,
    and the Hot access tier do not change which services these account kinds support.

    This exhibit uses legacy account kinds. StorageV2 is the modern general-purpose
    account kind; the legacy names still determine the answers for the exhibit shown.

    Remember: General-purpose = multiple services; BlobStorage = blobs only.

    [Microsoft Learn: Storage account overview](https://learn.microsoft.com/en-us/azure/storage/common/storage-account-overview)
- id: '003'
  skill: Implement and manage storage
  sub-skill: Configure and manage storage accounts
  tags:
    - "exam topic: Implement and manage storage"
    - Azure Import/Export
    - Azure Blob Storage
  question: |
    You have an Azure subscription that includes data in the following locations.

    | Name | Type |
    |------|------|
    | container1 | Blob container |
    | share1 | Azure files share |
    | DB1 | SQL database |
    | Table1 | Azure Table |

    You plan to export data by using an Azure import/export job named Export1.

    You need to identify the data that can be exported by using Export1.

    Which data should you identify?
  choices:
    A: DB1
    B: container1
    C: share1
    D: Table1
  answer: B
  user_answer: B
  user_result: correct
  user_reasoning: Azure Import/Export supports exporting Blob data only.
  learning_note: |
    Azure Import/Export can import Blobs and Files, but can export only Blobs.
    A Blob container is therefore the only supported source listed in this question.
  explanation: |
    **B — container1** is correct.

    Azure Import/Export export jobs copy Blob data to physical disk drives.
    container1 contains Blob data, so its data can be exported by Export1.

    - **A — DB1:** SQL database data cannot be exported directly using this service.
    - **C — share1:** Azure Files supports import through Azure Import/Export,
      but does not support export through this service.
    - **D — Table1:** Azure Table data cannot be exported using this service.

    The learner correctly applied the rule: Export → Blobs only.
    Remember: Import → Blobs and Files; Export → Blobs only.

    [Microsoft Learn: Azure Import/Export service](https://learn.microsoft.com/en-us/azure/import-export/storage-import-export-service)
- id: '004'
  skill: Implement and manage storage
  sub-skill: Configure access to storage
  tags:
    - "exam topic: Implement and manage storage"
    - Managed identities
    - Azure RBAC
    - Shared access signatures
    - must-review
  question: |
    HOTSPOT

    You have an Azure Storage account named storage1.

    You have an Azure App Service app named App1 and an app named App2 that runs
    in an Azure container instance. Each app uses a managed identity.

    You need to ensure that App1 and App2 can read blobs from storage1. The
    solution must meet the following requirements:

    - Minimize the number of secrets used.
    - Ensure that App2 can only read from storage1 for the next 30 days.

    What should you configure in storage1 for each app? Select the appropriate
    options in the answer area. Each correct selection is worth one point.
  choices:
    App1:
      - Access keys
      - Advanced security
      - Access control (IAM)
      - Shared access signatures (SAS)
    App2:
      - Access keys
      - Advanced security
      - Access control (IAM)
      - Shared access signatures (SAS)
  answer:
    App1: Access control (IAM)
    App2: Shared access signatures (SAS)
  user_answer:
    App1: Access keys
    App2: Shared access signatures (SAS)
  user_result: partially_correct
  learning_note: |
    A managed identity can read blobs through an Azure RBAC data role without an
    application-managed secret. Use Storage Blob Data Reader rather than an access
    key when minimizing secrets. SAS supports explicit read permissions and an
    expiry time; a normal IAM role assignment does not automatically expire.
  explanation: |
    Correct selections: **App1 — Access control (IAM); App2 — Shared access
    signatures (SAS).**

    **App1:** In storage1's Access control (IAM), assign Storage Blob Data Reader
    to App1's managed identity at the required storage account or container scope.
    App1 authenticates using its managed identity, so no access key or SAS secret
    needs to be stored by the app. An ordinary management-plane Reader role does
    not grant permission to read Blob data.

    **App2:** Configure a SAS with read permission for the required Blob resources
    and an expiry time 30 days from issuance. This supplies the explicit time
    limit required by the question. A normal IAM role assignment has no automatic
    30-day expiry. App2's managed identity should not also receive ongoing Blob
    read access that would bypass the SAS expiry.

    **Why the other choices do not meet the requirements:**

    - Access keys introduce secrets, grant broad access, and do not provide
      an individual application's read-only, 30-day access window.
    - Advanced security detects threats; it does not grant Blob read access.
    - SAS for App1 adds a secret when its managed identity can use IAM instead.

    The learner correctly selected SAS for App2, but selected an unnecessary
    access key for App1 despite its existing managed identity.

    Remember: Managed identity + IAM → secretless access; SAS → scoped,
    time-limited access.

    [Microsoft Learn: Authorize Blob access with Microsoft Entra ID](https://learn.microsoft.com/en-us/azure/storage/blobs/authorize-access-azure-active-directory)
    [Microsoft Learn: Shared access signatures overview](https://learn.microsoft.com/en-us/azure/storage/common/storage-sas-overview)
- id: '005'
  skill: Implement and manage storage
  sub-skill: Configure and manage storage accounts
  tags:
    - "exam topic: Implement and manage storage"
    - Storage account kinds
    - Blob access tiers
    - Geo-redundant storage
  question: |
    HOTSPOT

    You need to create an Azure Storage account that meets the following requirements:

    - Minimizes costs.
    - Supports hot, cool, and archive blob tiers.
    - Provides fault tolerance if a disaster affects the Azure region where the
      account resides.

    How should you complete the command? Select the appropriate options in the
    answer area. Each correct selection is worth one point.

    az storage account create -g RG1 -n storageaccount1 --kind [answer choice] --sku [answer choice]
  choices:
    --kind:
      - FileStorage
      - Storage
      - StorageV2
    --sku:
      - Standard_GRS
      - Standard_LRS
      - Standard_RAGRS
      - Premium_LRS
  answer:
    --kind: StorageV2
    --sku: Standard_GRS
  user_answer:
    --kind: StorageV2
    --sku: Standard_GRS
  user_result: correct
  user_reasoning: Selected StorageV2 as a guess and selected Standard_GRS; no further reasoning was provided for the SKU.
  learning_note: |
    StorageV2 supports hot, cool, and archive Blob tiers. Use it by default for
    standard Blob-only workloads as well as workloads using other storage services;
    BlobStorage is a legacy account kind, not the preferred choice merely because
    only blobs are needed. GRS is the lowest-cost listed option that replicates
    data to another region; RA-GRS adds secondary-region read access.
  explanation: |
    Correct selections: **--kind StorageV2; --sku Standard_GRS.**

    StorageV2 (general-purpose v2) supports the required Blob access tiers.
    Storage (general-purpose v1) does not support Blob tiering, and FileStorage
    is for Azure Files rather than Blob storage. Supporting multiple services
    does not require using them all: StorageV2 is also the default choice for
    most standard Blob-only workloads. BlobStorage is a legacy account kind.

    Standard_GRS replicates data to a geographically separate secondary region,
    satisfying the regional-disaster requirement at the lowest cost among the
    listed qualifying choices. Standard_RAGRS also provides geo-redundancy, but
    adds secondary-region read access that is not required here. Standard_LRS
    and Premium_LRS keep replicas within the primary region and do not meet
    the regional-disaster requirement.

    The completed command is:

    az storage account create -g RG1 -n storageaccount1 --kind StorageV2 --sku Standard_GRS

    GRS replication to the secondary region is asynchronous, so recent writes
    can be lost during a disaster. Access through the secondary region requires
    failover; GRS does not provide direct secondary read access before failover.

    Remember: Blob tiers → StorageV2; regional disaster + minimize cost → GRS.

    [Microsoft Learn: Blob access tiers](https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview)
    [Microsoft Learn: Azure Storage redundancy](https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy)
    [Microsoft Learn: Storage account overview](https://learn.microsoft.com/en-us/azure/storage/common/storage-account-overview)
- id: '006'
  skill: Implement and manage storage
  sub-skill: Configure Azure Files and Azure Blob Storage
  tags:
    - "exam topic: Implement and manage storage"
    - Azure File Sync
    - Sync groups
    - Server registration
  question: |
    You have an Azure subscription that contains the resources in the following table.

    | Name | Type |
    |------|------|
    | RG1 | Resource group |
    | store1 | Azure Storage account |
    | Sync1 | Azure File Sync |

    Store1 contains a file share named data. Data contains 5,000 files.

    You need to synchronize the files in the file share named data to an
    on-premises server named Server1.

    Which three actions should you perform? Each correct answer presents part
    of the solution. Each correct selection is worth one point.
  choices:
    A: Create a container instance
    B: Register Server1
    C: Install the Azure File Sync agent on Server1
    D: Download an automation script
    E: Create a sync group
  answer: BCE
  user_answer: BCE
  user_result: correct
  learning_note: |
    Install the Azure File Sync agent before registering the server with the
    Storage Sync Service. A sync group connects a cloud endpoint (Azure file share)
    with server endpoints (local folders). Selecting the correct actions is separate
    from ordering them; this question does not ask for a sequence.
  explanation: |
    Correct answers: **B, C, and E.**

    - **C:** Install the Azure File Sync agent on Server1 so the Windows Server
      can participate in synchronization.
    - **B:** Register Server1 with Sync1, the Storage Sync Service. Agent
      installation must occur before server registration.
    - **E:** Create a sync group to define which endpoints synchronize together.

    A complete deployment also requires configuring the sync group's cloud
    endpoint to reference store1's data share and creating a server endpoint
    for the local folder on Server1. These necessary endpoint configurations
    are not listed as separate answer choices.

    Creating the sync group can happen independently of installing the agent
    and registering the server. The server must be registered before it can
    be added as a server endpoint. The learner listed E, B, C, but the question
    asks for a set of actions rather than an ordered sequence, so the selections
    are correct.

    **A:** A container instance is not required for Azure File Sync.
    **D:** Downloading an automation script is not a required deployment step.
    The file count does not change the required actions.

    Remember: Agent → register server; sync group → cloud and server endpoints.

    [Microsoft Learn: Deploy Azure File Sync](https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-deployment-guide)
    [Microsoft Learn: Server registration](https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-server-registration)
- id: '007'
  skill: Manage Azure identities and governance
  sub-skill: Manage Azure subscriptions and governance
  tags:
    - "exam topic: Manage Azure identities and governance"
    - Azure Policy
    - Deny effect
    - Resource moves
  question: |
    HOTSPOT

    You have an Azure subscription that contains the following resources.

    | Name | Type | Resource group |
    |------|------|----------------|
    | VNET1 | Virtual network | RG1 |
    | VNET2 | Virtual network | RG2 |
    | VM1 | Virtual machine | RG2 |

    The status of VM1 is Running.

    You assign an Azure policy with the following settings:

    - Scope: Azure Pass/RG2
    - Exclusions: None
    - Policy definition: Not allowed resource types
    - Assignment name: Not allowed resource types
    - Assigned by: First User

    The Not allowed resource types parameter contains:

    - Microsoft.ClassicNetwork/virtualNetworks
    - Microsoft.Network/virtualNetworks
    - Microsoft.Compute/virtualMachines

    For each statement, select Yes if the statement is true. Otherwise, select No.
    Each correct selection is worth one point.
  choices:
    An administrator can move VNET1 to RG2:
      - 'Yes'
      - 'No'
    The state of VM1 changed to deallocated:
      - 'Yes'
      - 'No'
    An administrator can modify the address space of VNET2:
      - 'Yes'
      - 'No'
  answer:
    An administrator can move VNET1 to RG2: 'No'
    The state of VM1 changed to deallocated: 'No'
    An administrator can modify the address space of VNET2: 'No'
  user_answer:
    An administrator can move VNET1 to RG2: 'Yes'
    The state of VM1 changed to deallocated: 'No'
    An administrator can modify the address space of VNET2: 'Yes'
  user_result: partially_correct
  user_reasoning: Selected Yes for moving VNET1 while explaining that the policy blocks it because virtual networks are not allowed in RG2; no reasoning was provided for the other selections.
  learning_note: |
    The first selection conflicts with the learner's correct explanation: if the
    policy blocks the move, the statement that an administrator can move it is false.
    Deny policies also block noncompliant updates to existing resources. Assigning
    a deny policy does not stop existing resources; it marks them noncompliant.
  explanation: |
    Correct answers: **No, No, No.**

    **An administrator can move VNET1 to RG2 — No.** Resource move validation
    checks policies at the destination. RG2 denies virtual networks, so moving
    VNET1 into RG2 is blocked. VNET1's current location in RG1 does not exempt
    it from the destination policy.

    **The state of VM1 changed to deallocated — No.** Assigning the policy does
    not stop, deallocate, or delete existing resources. VM1 remains running and
    is marked noncompliant when evaluated because its resource type is prohibited.

    **An administrator can modify the address space of VNET2 — No.** The deny
    effect evaluates creation and update requests. Changing the address space
    updates a Microsoft.Network/virtualNetworks resource in RG2, so the request
    is denied even though VNET2 existed before the assignment.

    The learner's second selection was correct. The first explanation correctly
    identified that the move is blocked, but the Yes selection contradicted the
    statement's wording. The third selection overlooked enforcement on updates.

    Remember: Deny blocks creation and noncompliant updates; existing resources
    keep running but become noncompliant.

    [Microsoft Learn: Move resources to a new resource group or subscription](https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/move-resource-group-and-subscription)
    [Microsoft Learn: Azure Policy deny effect](https://learn.microsoft.com/en-us/azure/governance/policy/concepts/effect-deny)
- id: '008'
  skill: Implement and manage storage
  sub-skill: Configure and manage storage accounts
  tags:
    - "exam topic: Implement and manage storage"
    - Azure Import/Export
    - Import job workflow
  question: |
    DRAG DROP

    You have an Azure subscription that contains a storage account.

    You have an on-premises server named Server1 that runs Windows Server 2016.
    Server1 has 2 TB of data.

    You need to transfer the data to the storage account by using the Azure
    Import/Export service.

    In which order should you perform the actions? Move all actions from the
    list to the answer area and arrange them in the correct order.

    NOTE: More than one order of answer choices is correct. You will receive
    credit for any of the correct orders you select.
  choices:
    - From the Azure portal, update the import job
    - From the Azure portal, create an import job
    - Attach an external disk to Server1 and then run waimportexport.exe
    - Detach the external disks from Server1 and ship the disks to an Azure data center
  answer:
    - Attach an external disk to Server1 and then run waimportexport.exe
    - From the Azure portal, create an import job
    - Detach the external disks from Server1 and ship the disks to an Azure data center
    - From the Azure portal, update the import job
  user_answer:
    - Attach an external disk to Server1 and then run waimportexport.exe
    - Detach the external disks from Server1 and ship the disks to an Azure data center
    - From the Azure portal, create an import job
    - From the Azure portal, update the import job
  user_result: partially_correct
  learning_note: |
    Create the import job before shipping the disks, because job creation provides
    the Azure datacenter shipping address. After shipping, update the job with
    the carrier and tracking information. The learner reversed job creation and shipping.
  explanation: |
    Correct documented order: **Prepare → Create → Ship → Update.**

    1. Attach an external disk to Server1 and run WAImportExport.exe to prepare
       the data and generate the drive journal file.
    2. Create the import job in the Azure portal using the journal file. Record
       the job name and the Azure datacenter shipping address supplied by the job.
    3. Detach the prepared disks and ship them to the address supplied during
       job creation.
    4. Update the import job with the carrier and shipment tracking information.

    The learner correctly placed preparation first and the job update last,
    but shipped the disks before creating the job. Swap the middle two steps:
    the destination shipping address is obtained during job creation.

    Although the question notes that multiple orders may receive credit, the
    sequence above follows Microsoft's documented import workflow and satisfies
    its dependencies. Do not ship before obtaining the job's shipping address.

    [Microsoft Learn: Import data to Blob Storage with Azure Import/Export](https://learn.microsoft.com/en-us/azure/import-export/storage-import-export-data-to-blobs)
- id: '009'
  skill: Implement and manage storage
  sub-skill: Configure Azure Files and Azure Blob Storage
  tags:
    - "exam topic: Implement and manage storage"
    - Azure File Sync
    - Sync groups
    - Endpoint limits
  question: |
    HOTSPOT

    You have an Azure subscription that includes the following Azure file shares.

    | Name | In storage account | Location |
    |------|--------------------|----------|
    | share1 | storage1 | West US |
    | share2 | storage1 | West US |

    You have the following on-premises servers.

    | Name | Folders |
    |------|---------|
    | Server1 | D:\Folder1, E:\Folder2 |
    | Server2 | D:\Data |

    You create a Storage Sync Service named Sync1 and an Azure File Sync group
    named Group1. Group1 uses share1 as a cloud endpoint.

    You register Server1 and Server2 in Sync1. You add D:\Folder1 on Server1
    as a server endpoint of Group1.

    For each statement, select Yes if the statement is true. Otherwise, select No.
    Each correct selection is worth one point.
  choices:
    share2 can be added as a cloud endpoint for Group1:
      - 'Yes'
      - 'No'
    E:\Folder2 on Server1 can be added as a server endpoint for Group1:
      - 'Yes'
      - 'No'
    D:\Data on Server2 can be added as a server endpoint for Group1:
      - 'Yes'
      - 'No'
  answer:
    share2 can be added as a cloud endpoint for Group1: 'No'
    E:\Folder2 on Server1 can be added as a server endpoint for Group1: 'No'
    D:\Data on Server2 can be added as a server endpoint for Group1: 'Yes'
  user_answer:
    share2 can be added as a cloud endpoint for Group1: 'Yes'
    E:\Folder2 on Server1 can be added as a server endpoint for Group1: 'Yes'
    D:\Data on Server2 can be added as a server endpoint for Group1: 'Yes'
  user_result: partially_correct
  learning_note: |
    A sync group supports one cloud endpoint and only one server endpoint per
    registered server. Multiple registered servers can each contribute an endpoint
    to the same group. A server can have additional endpoints in different groups.
  explanation: |
    Correct answers: **No, No, Yes.**

    **share2 can be added as a cloud endpoint for Group1 — No.** A sync group
    supports only one cloud endpoint, representing an Azure file share. Group1
    already uses share1, so share2 cannot be added as a second cloud endpoint.

    **E:\Folder2 on Server1 can be added as a server endpoint for Group1 — No.**
    A sync group can have only one server endpoint per registered server.
    Server1 already contributes D:\Folder1 to Group1. Using a different volume
    does not allow a second endpoint from Server1 in the same group.

    **D:\Data on Server2 can be added as a server endpoint for Group1 — Yes.**
    Server2 is registered in Sync1 and does not yet have an endpoint in Group1.
    Its local folder can therefore be added and synchronized with share1 and
    Server1's D:\Folder1.

    E:\Folder2 on Server1 could instead participate in a different sync group,
    for example one using share2 as its cloud endpoint. The limits apply per
    sync group rather than limiting each server to one endpoint overall.

    The learner's third selection was correct; the first two overlooked the
    one-cloud-endpoint and one-endpoint-per-server limits within a sync group.

    Remember: One cloud share per group; one folder per server per group;
    multiple servers per group.

    [Microsoft Learn: Deploy Azure File Sync](https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-deployment-guide)
    [Microsoft Learn: Troubleshoot sync group management](https://learn.microsoft.com/en-us/troubleshoot/azure/azure-storage/files/file-sync/file-sync-troubleshoot-sync-group-management)
- id: '010'
  skill: Implement and manage storage
  sub-skill: Configure Azure Files and Azure Blob Storage
  tags:
    - "exam topic: Implement and manage storage"
    - Azure Files
    - UNC paths
  question: |
    DRAG DROP

    You have an Azure subscription named Subscription1.

    You create an Azure Storage account named contosostorage, and then you
    create a file share named data.

    Which UNC path should you include in a script that references files from
    the data file share? Drag the appropriate values to the correct targets.
    Each value may be used once, more than once, or not at all.
    Each correct selection is worth one point.

    Complete the path: \\[storage account].[service endpoint]\[share name]
  choices:
    - blob
    - contosostorage
    - file
    - portal.azure.com
    - blob.core.windows.net
    - data
    - file.core.windows.net
    - subscription1
  answer:
    Storage account: contosostorage
    Service endpoint: file.core.windows.net
    Share name: data
  user_answer:
    Storage account: contosostorage
    Service endpoint: file.core.windows.net
    Share name: data
  user_result: correct
  explanation: |
    Correct UNC path: **\\contosostorage.file.core.windows.net\data**.

    The three blanks are contosostorage, file.core.windows.net, and data.
    Azure Files uses the UNC pattern:

    \\<storage-account>.file.core.windows.net\<share-name>

    contosostorage identifies the storage account, file.core.windows.net is
    the Azure Files service endpoint suffix in Azure public cloud, and data
    identifies the file share. The leading double backslash and the backslash
    before the share name are part of UNC syntax.

    blob.core.windows.net identifies the Blob service rather than Azure Files.
    portal.azure.com is the management portal. The subscription name is not
    part of the file share's UNC path.

    Remember: Azure Files → file.core.windows.net; UNC → two leading backslashes.
- id: '011'
  skill: Implement and manage storage
  sub-skill: Configure Azure Files and Azure Blob Storage
  tags:
    - "exam topic: Implement and manage storage"
    - AzCopy
    - Azure Blob Storage
    - Blob containers
  question: |
    HOTSPOT

    You have an Azure subscription that contains an Azure Storage account.

    You plan to copy an on-premises virtual machine image to a container named vmimages.

    You need to create the container for the planned image.

    Which command should you run? Select the appropriate options in the answer
    area. Each correct selection is worth one point.

    azcopy [command] 'https://mystorageaccount.[service].core.windows.net/vmimages'
  choices:
    Command:
      - make
      - sync
      - copy
    Service:
      - blob
      - dfs
      - queue
      - table
      - images
      - file
  answer:
    Command: make
    Service: blob
  user_answer:
    Command: copy
    Service: file
  user_result: incorrect
  learning_note: |
    Read the requested operation separately from the planned transfer: creating
    a container uses azcopy make, whereas copying data uses azcopy copy.
    A Blob container holds storage objects and uses the blob endpoint. An app
    container, such as Azure Container Instances, runs code and can mount an
    Azure file share; these are different meanings of the word container.
  explanation: |
    Correct selections: **make, blob.**

    azcopy make 'https://mystorageaccount.blob.core.windows.net/vmimages'

    The requested action is to create the destination container, not to upload
    the virtual machine image yet. The make command creates the container.
    copy transfers data and sync synchronizes data, so neither is the requested
    standalone container-creation operation.

    The blob URL component selects Azure Blob Storage. vmimages is the container
    within that service. Azure Files uses the file endpoint and file shares
    rather than Blob containers. A VM image can be a local file and still be
    stored as a blob after upload; its local file format does not imply Azure Files.

    Do not confuse two meanings of container:

    - A Blob container organizes objects in a storage account.
    - An application container runs code. An Azure container instance can mount
      an Azure file share as a filesystem, but that does not make a Blob
      container an Azure file share.

    The dfs endpoint is associated with Data Lake Storage's hierarchical
    namespace; the question gives no requirement for that configuration.
    queue and table address different storage services, and images is not the
    storage service endpoint for VM image objects.

    Remember: Create Blob container → make + blob; upload image later → copy.
    App container runs code; Blob container holds data.

    [Microsoft Learn: Upload blobs with AzCopy and create a container](https://learn.microsoft.com/en-us/azure/storage/common/storage-use-azcopy-blobs-upload)
- id: '012'
  skill: Implement and manage storage
  sub-skill: Configure Azure Files and Azure Blob Storage
  tags:
    - "exam topic: Implement and manage storage"
    - Azure File Sync
    - Cloud tiering
    - Change detection
  question: |
    HOTSPOT

    You have an Azure File Sync group that has the following endpoints.

    | Name | Type |
    |------|------|
    | Endpoint1 | Cloud endpoint |
    | Endpoint2 | Server endpoint |
    | Endpoint3 | Server endpoint |

    Cloud tiering is enabled for Endpoint3.

    You add a file named File1 to Endpoint1 and a file named File2 to Endpoint2.

    On which endpoints will File1 and File2 be available within 24 hours of
    adding the files? Select the appropriate options in the answer area.
    Each correct selection is worth one point.
  choices:
    File1:
      - Endpoint1 only
      - Endpoint3 only
      - Endpoint2 and Endpoint3 only
      - Endpoint1, Endpoint2, and Endpoint3
    File2:
      - Endpoint2 only
      - Endpoint3 only
      - Endpoint2 and Endpoint3 only
      - Endpoint1, Endpoint2, and Endpoint3
  answer:
    File1: Endpoint1, Endpoint2, and Endpoint3
    File2: Endpoint1, Endpoint2, and Endpoint3
  user_answer:
    File1: Endpoint1 only
    File2: Endpoint2 and Endpoint3 only
  user_result: incorrect
  learning_note: |
    Azure File Sync synchronizes changes bidirectionally through the cloud endpoint.
    Files added at either a cloud or server endpoint eventually reach the other
    endpoints in the group. Cloud tiering keeps files accessible through local
    placeholders and on-demand recall. The question simplifies timing: a cloud
    change-detection job runs every 24 hours, but discovery and synchronization
    are not guaranteed to finish within exactly 24 hours.
  explanation: |
    Expected exam selections: **Both File1 and File2 — Endpoint1, Endpoint2,
    and Endpoint3.**

    File1 is already present at Endpoint1. Changes made directly to the Azure
    file share are discovered by a scheduled cloud change-detection job, which
    runs every 24 hours. After discovery, File1 synchronizes to Endpoint2 and
    Endpoint3.

    File2 is already present at Endpoint2. The server agent detects its addition
    and synchronizes it to Endpoint1, the cloud endpoint. It then synchronizes
    to Endpoint3. The cloud endpoint is part of the synchronization relationship,
    not merely a transit point excluded from file availability.

    Cloud tiering on Endpoint3 does not exclude files from availability. The
    namespace can be present locally as placeholders while file content resides
    in Azure. Opening a tiered file recalls its content when connectivity and
    permissions permit.

    Timing caveat: The expected answer assumes normal synchronization and treats
    the 24-hour detection interval as sufficient. Microsoft documents that changes
    made directly to the cloud endpoint can take 24 hours or longer just to be
    discovered, followed by synchronization time. Therefore, availability on all
    endpoints within exactly 24 hours is not a real-world guarantee. Endpoint1
    only for File1 describes its immediately certain location, but is not the
    intended exam selection under this simplified timing assumption.

    Remember: Sync is bidirectional; tiered files remain accessible.

    [Microsoft Learn: Troubleshoot Azure File Sync synchronization](https://learn.microsoft.com/en-us/troubleshoot/azure/azure-storage/files/file-sync/file-sync-troubleshoot-sync-errors)
    [Microsoft Learn: Cloud tiering overview](https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-cloud-tiering-overview)
    [Microsoft Learn: Deploy Azure File Sync](https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-deployment-guide)
- id: '013'
  skill: Implement and manage storage
  sub-skill: Configure access to storage
  tags:
    - "exam topic: Implement and manage storage"
    - Storage firewall
    - Virtual network rules
    - Service endpoints
    - Azure Backup
    - Unmanaged disks
  question: |
    HOTSPOT

    You have several Azure virtual machines on a virtual network named VNet1.
    You configure an Azure Storage account named contoso as shown in the exhibit.

    The exhibit shows the following firewall and virtual network settings:

    - Allow access from: Selected networks.
    - VNet1 address space: 10.2.0.0/16.
    - One allowed subnet: Prod, with address range 10.2.0.0/24.
    - The storage service endpoint is enabled for Prod.
    - No firewall IP address ranges are configured.
    - Allow trusted Microsoft services to access this storage account: unchecked.
    - Allow read access to storage logging from any network: unchecked.
    - Allow read access to storage metrics from any network: unchecked.

    Select the answer choice that completes each statement.
    Each correct selection is worth one point.

    1. The virtual machines on the 10.2.9.0/24 subnet will have network
       connectivity to the file shares in the storage account [answer choice].
    2. Azure Backup will be able to back up the unmanaged hard disks of the
       virtual machines in the storage account [answer choice].
  choices:
    File share connectivity:
      - always
      - during a backup
      - never
    Azure Backup:
      - always
      - during a backup
      - never
  answer:
    File share connectivity: never
    Azure Backup: never
  user_answer:
    File share connectivity: never
    Azure Backup: never
  user_result: correct
  learning_note: |
    Storage virtual network rules authorize individual subnets, not every subnet
    in the displayed VNet address space. Azure Backup needs the trusted-services
    exception for unmanaged disks in a firewall-restricted storage account.
  explanation: |
    Correct selections: **never, never**, under the configuration shown.

    Only Prod (10.2.0.0/24) is allowed by the storage account's virtual network
    rule. Although 10.2.9.0/24 is inside VNet1's 10.2.0.0/16 address space, it is
    a different subnet and is not authorized. The VNet row groups the allowed
    subnet in the portal; it does not grant access to the entire VNet.
    Therefore, those VMs cannot access the Azure file shares through the shown
    configuration. A backup operation does not temporarily open the firewall.

    Azure Backup is a trusted Azure service, but that status does not bypass
    the firewall automatically. Backing up unmanaged VM disks in this storage
    account requires the trusted Microsoft services exception, which is
    unchecked. Consequently, Azure Backup cannot perform those backups.
    Selecting 'during a backup' does not enable the required exception.

    Storage network rules do not block normal VM disk I/O. That distinction
    does not grant Azure Backup the access it needs to back up unmanaged disks.
    This is a legacy unmanaged-disk scenario; do not apply this requirement
    directly to managed-disk backups.

    Remember: Allow the subnet explicitly; enable the exception for trusted
    services that require access.

    [Microsoft Learn: Create a virtual network rule for Azure Storage](https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security-virtual-networks)
    [Microsoft Learn: Trusted Azure services for Azure Storage network security](https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security-trusted-azure-services)
    [Microsoft Learn: Azure Storage firewall guidelines and limitations](https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security-limitations)
- id: '014'
  skill: Implement and manage storage
  sub-skill: Configure Azure Files and Azure Blob Storage
  tags:
    - "exam topic: Implement and manage storage"
    - Azure File Sync
    - Sync groups
    - Initial synchronization
    - File conflicts
  question: |
    HOTSPOT

    You have a sync group named Sync1 that has a cloud endpoint. The cloud
    endpoint includes a file named File1.txt.

    Your on-premises network contains servers that run Windows Server 2016.
    The servers are configured as shown in the following table.

    | Name | Share | Share contents |
    |------|-------|----------------|
    | Server1 | Share1 | File1.txt, File2.txt |
    | Server2 | Share2 | File2.txt, File3.txt |

    You add Share1 as an endpoint for Sync1. One hour later, you add Share2
    as an endpoint for Sync1.

    For each statement, select Yes if the statement is true. Otherwise,
    select No. Each correct selection is worth one point.

    1. On the cloud endpoint, File1.txt is overwritten by File1.txt from Share1.
    2. On Server1, File1.txt is overwritten by File1.txt from the cloud endpoint.
    3. File1.txt from Share1 replicates to Share2.
  choices:
    Cloud File1.txt overwritten by Share1:
      - "Yes"
      - "No"
    Server1 File1.txt overwritten by cloud endpoint:
      - "Yes"
      - "No"
    Share1 File1.txt replicates to Share2:
      - "Yes"
      - "No"
  answer:
    Cloud File1.txt overwritten by Share1: "No"
    Server1 File1.txt overwritten by cloud endpoint: "No"
    Share1 File1.txt replicates to Share2: "Yes"
  user_answer:
    Cloud File1.txt overwritten by Share1: "Yes"
    Server1 File1.txt overwritten by cloud endpoint: "No"
    Share1 File1.txt replicates to Share2: "Yes"
  user_result: partially_correct
  learning_note: |
    Adding a server endpoint normally merges existing files with the sync group;
    it does not automatically make the server's files authoritative over cloud
    files. Conflicting versions are preserved, and endpoint creation order does
    not determine which version keeps the original filename.
  explanation: |
    Correct selections: **No, No, Yes.** The attempted answer, Yes, No, Yes,
    gets two of the three statements correct.

    1. No. Adding Share1 normally merges its existing data with the cloud
       endpoint. If File1.txt differs in size or last modified time between the
       two locations, Azure File Sync creates a conflict file and preserves
       both versions instead of discarding the cloud version.
    2. No. The same conflict-preservation behavior protects the server's version.
       The cloud endpoint does not automatically overwrite and discard it.
    3. Yes. Share1's data synchronizes through the cloud endpoint to Share2.
       If File1.txt conflicts with the cloud copy, Share1's version is still
       preserved and synchronized, potentially under a conflict filename.

    For a conflict, the most recently written version keeps the original
    filename. The older version receives the originating endpoint name and,
    when needed, a conflict number. For example, an older version from Server1
    can become File1-Server1.txt; an older cloud version can become
    File1-Cloud.txt. The question provides no modification timestamps, so it
    does not establish which version keeps the original name.

    The one-hour gap between adding endpoints does not establish file priority
    or guarantee that synchronization finishes within one hour. The third
    statement describes eventual replication under normal synchronization.
    File2.txt can also produce a conflict when Share2 joins if its version
    differs from the version already synchronized from Share1.

    These answers assume normal merge behavior. An explicitly selected
    server-authoritative initial upload mode can overwrite cloud content,
    but the question does not specify that mode.

    Remember: Merge existing data, preserve conflicts, synchronize through
    the cloud. Endpoint creation order does not select the winning version.

    [Microsoft Learn: Azure Files and Azure File Sync FAQ — file conflicts](https://learn.microsoft.com/en-us/azure/storage/files/storage-files-faq)
    [Microsoft Learn: Deploy Azure File Sync](https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-deployment-guide)
- id: '015'
  skill: Implement and manage storage
  sub-skill: Configure and manage storage accounts
  tags:
    - "exam topic: Implement and manage storage"
    - Storage account types
    - Storage redundancy
    - ZRS
    - Live migration
    - Premium page blobs
  question: |
    You have an Azure subscription that contains the storage accounts shown
    in the following table.

    | Name | Kind | Performance | Replication | Access tier |
    |------|------|-------------|-------------|-------------|
    | storage1 | Storage (general purpose v1) | Premium | Geo-redundant storage (GRS) | None |
    | storage2 | StorageV2 (general purpose v2) | Standard | Locally-redundant storage (LRS) | Cool |
    | storage3 | StorageV2 (general purpose v2) | Premium | Read-access geo-redundant storage (RA-GRS) | Hot |
    | storage4 | BlobStorage | Standard | Locally-redundant storage (LRS) | Hot |

    You need to identify which storage account can be converted to
    zone-redundant storage (ZRS) replication by requesting a live migration
    from Azure support.

    What should you identify?
  choices:
    A: storage1
    B: storage2
    C: storage3
    D: storage4
  answer: B
  user_answer: C
  user_result: incorrect
  user_reasoning: Chose storage3 because GRS has higher redundancy than ZRS.
  learning_note: |
    Migration eligibility depends on account kind, performance tier, and the
    supported conversion path. Standard StorageV2 supports ZRS conversion;
    Premium StorageV2 is a premium page-blob account and supports LRS only.
    GRS provides geographic disaster recovery, while ZRS provides synchronous
    zone redundancy and availability during a zone failure. Neither comparison
    determines whether an account supports migration to ZRS.
  explanation: |
    Correct answer: **B — storage2.**

    storage2 is a Standard general-purpose v2 (StorageV2) account using LRS.
    This account type supports ZRS and conversion from LRS to ZRS, assuming
    an eligible region and no feature-specific conversion restrictions.
    Its Cool access tier does not prevent the conversion.

    Why the other options are wrong:

    - A, storage1: It is a Premium general-purpose v1 account, not the supported
      Standard GPv2 account configuration for this conversion.
    - C, storage3: StorageV2 with Premium performance identifies a premium
      page-blob account. That product supports LRS only, so it has no supported
      ZRS target configuration. Premium is a performance category, not a
      guarantee that every Standard feature is available.
    - D, storage4: Legacy BlobStorage must first be upgraded to Standard GPv2
      before following the supported ZRS conversion path. It is not eligible
      as shown without that additional step.

    Read account kind together with performance:

    | Kind and performance | Product | Redundancy options |
    |----------------------|---------|--------------------|
    | StorageV2 + Standard | General-purpose v2 | LRS, ZRS, GRS, RA-GRS, GZRS, RA-GZRS |
    | StorageV2 + Premium | Premium page blobs | LRS only |
    | BlockBlobStorage + Premium | Premium block blobs | LRS or ZRS |
    | FileStorage + Premium | Premium file shares | LRS or ZRS |

    Page blobs allow updates to specific portions of a blob and suit disk-like
    workloads. Their premium account product has different supported features
    from Standard GPv2. Microsoft documents the ZRS limitation; it does not
    establish that page blobs are inherently incapable of zone replication.
    Support for a redundancy option and support for an in-place conversion
    are separate checks, including for other premium storage products.

    Redundancy is not a simple upgrade ladder. ZRS synchronously replicates
    across availability zones in one region and maintains read/write access
    during a single-zone outage. GRS uses local redundancy in the primary
    region and asynchronously replicates to a secondary region. It provides
    recovery from a regional disaster, but plain GRS requires failover to
    access the secondary data, and unreplicated recent writes can be lost.
    RA-GRS additionally permits reads from the secondary endpoint. GZRS
    combines primary-region zone redundancy with geographic replication.
    An availability zone is a physically separate group of one or more
    datacenters within a region, with independent power, cooling, and networking.

    Question-quality caveat: The table is preserved as supplied, but its
    Premium configurations are invalid. storage1 combines Premium with GRS;
    premium page-blob accounts do not support GRS. storage3 combines Premium
    StorageV2 with RA-GRS and Hot, although premium page-blob accounts support
    neither RA-GRS nor Hot/Cool access tiers. B remains the intended answer.

    Currency note: The question uses the older wording 'live migration from
    Azure support.' Current documentation describes redundancy conversion,
    including customer-initiated conversion and support requests where needed.

    Remember: Check kind + performance, then redundancy and conversion support.

    [Microsoft Learn: Change how a storage account is replicated](https://learn.microsoft.com/en-us/azure/storage/common/redundancy-migration)
    [Microsoft Learn: Azure Storage redundancy](https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy)
    [Microsoft Learn: Storage account overview](https://learn.microsoft.com/en-us/azure/storage/common/storage-account-overview)
    [Microsoft Learn: Reliability in Azure Blob Storage](https://learn.microsoft.com/en-us/azure/reliability/reliability-storage-blob)
- id: '016'
  skill: Implement and manage storage
  sub-skill: Configure access to storage
  tags:
    - "exam topic: Implement and manage storage"
    - must-review
    - Storage firewall
    - IP network rules
    - VM disk traffic
    - Unmanaged disks
  question: |
    You have an Azure subscription that contains a storage account named account1.

    You plan to upload the disk files of a virtual machine to account1 from
    your on-premises network. The on-premises network uses a public IP address
    space of 131.107.1.0/24.

    You plan to use the disk files to provision an Azure virtual machine named
    VM1. VM1 will be attached to a virtual network named VNet1. VNet1 uses an
    IP address space of 192.168.0.0/24.

    You need to configure account1 to meet the following requirements:

    - Ensure that you can upload the disk files to account1.
    - Ensure that you can attach the disks to VM1.
    - Prevent all other access to account1.

    Which two actions should you perform? Each correct answer presents part
    of the solution. Each correct selection is worth one point.
  choices:
    A: From the Networking blade of account1, select Selected networks.
    B: From the Networking blade of account1, select Allow trusted Microsoft services to access this storage account.
    C: From the Networking blade of account1, add the 131.107.1.0/24 IP address range.
    D: From the Networking blade of account1, add VNet1.
    E: From the Service endpoints blade of VNet1, add a service endpoint.
  answer: AC
  user_answer: BC
  user_result: partially_correct
  learning_note: |
    Storage firewall rules restrict VHD uploads through the storage data APIs,
    but do not affect VM disk traffic, including mount/unmount and disk I/O.
    Disk attachment does not require the trusted Microsoft services exception.
    Distinguish this from Azure Backup of unmanaged disks, which needs the
    appropriate exception when the storage account is firewall-restricted.
  explanation: |
    Correct answers: **A and C.** The attempted answer, B and C, correctly
    allows the on-premises IP range but omits the required default restriction.

    A selects Selected networks so storage data access is restricted to the
    configured allowed networks. C allows the on-premises public IP range
    131.107.1.0/24, permitting disk-file uploads from that network. The uploader
    still needs valid authentication and authorization; an IP rule does not
    grant permission to the data by itself.

    The decisive exception is that Azure Storage network rules do not affect
    VM disk traffic, including disk mount/unmount operations and disk I/O.
    Therefore, the VM can attach and use the disks without adding its virtual
    network or enabling the trusted Microsoft services exception.

    Why the other options are unnecessary:

    - B: The trusted-services exception is not required for disk attachment.
      It allows additional trusted-service access beyond the requested network
      boundary. B and C alone also do not select the restricted-network mode.
    - D: Allowing a VNet subnet is relevant to ordinary storage data access
      from workloads, such as accessing blobs or Azure file shares. It is not
      required for the VM disk-traffic exception.
    - E: A storage service endpoint enables subnet-based access when paired
      with a storage virtual network rule. It does not provide the required
      on-premises upload permission and is unnecessary for disk attachment.

    Do not confuse VM disk attachment with Azure Backup of unmanaged disks.
    Backup accesses the disk data through a different path and requires the
    appropriate trusted-service exception for a restricted storage account.
    Similarly, REST access to page blobs remains subject to storage network
    rules even though normal VM disk I/O is exempt.

    The wording 'prevent all other access' describes the intended storage
    data-network boundary. Storage firewall rules do not restrict management
    control-plane operations, and the documented disk-traffic exception remains.
    This is a legacy storage-account-backed VM disk scenario.

    Remember: Upload VHD → firewall applies. Attach/use VM disk → disk-traffic
    exception applies. Back up unmanaged disk → appropriate exception required.

    [Microsoft Learn: Azure Storage firewall rules and network access](https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security)
    [Microsoft Learn: Azure Storage firewall guidelines and limitations](https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security-limitations)
- id: '017'
  skill: Implement and manage storage
  sub-skill: Configure Azure Files and Azure Blob Storage
  tags:
    - "exam topic: Implement and manage storage"
    - Azure File Sync
    - Server registration
    - Server endpoints
    - Deployment sequence
  question: |
    DRAG DROP

    You have an on-premises file server named Server1 that runs Windows Server 2016.

    You have an Azure subscription that contains an Azure file share.

    You deploy an Azure File Sync Storage Sync Service, and you create a sync group.

    You need to synchronize files from Server1 to Azure.

    Which three actions should you perform in sequence? Move the appropriate
    actions from the list to the answer area and arrange them in the correct order.
  choices:
    - Install the Azure File Sync agent on Server1
    - Create an Azure on-premises data gateway
    - Create a Recovery Services vault
    - Register Server1
    - Add a server endpoint
    - Install the DFS Replication server role on Server1
  answer:
    - Install the Azure File Sync agent on Server1
    - Register Server1
    - Add a server endpoint
  user_answer:
    - Install the Azure File Sync agent on Server1
    - Register Server1
    - Add a server endpoint
  user_result: correct
  explanation: |
    Correct sequence: **Install the Azure File Sync agent → Register Server1
    → Add a server endpoint.** All three attempted steps are correct.

    1. Install the Azure File Sync agent on Server1. The agent provides the
       software that performs synchronization and the server registration tool.
    2. Register Server1 with the deployed Storage Sync Service. Registration
       makes the server available for use in that service's sync groups.
    3. Add a server endpoint to the sync group. Select the registered server
       and the local folder path, such as D:\Shares, whose files should sync.
       A server endpoint represents a folder on a registered server, rather
       than the entire server.

    The order follows the dependencies: registration requires the installed
    agent, and creating a server endpoint requires a registered server.

    Why the other actions are unnecessary:

    - An on-premises data gateway connects services such as Power BI to
      on-premises data. Azure File Sync uses its own agent.
    - A Recovery Services vault supports backup and recovery; it is not
      required to establish Azure File Sync synchronization.
    - The DFS Replication role provides a separate replication mechanism.
      Azure File Sync does not require DFS-R to be installed.

    Prerequisite caveat: The Azure file share must also be configured as the
    sync group's cloud endpoint. The question implicitly assumes that this
    configuration is complete because it is not offered as an action.
    Creating a sync group alone does not establish its cloud endpoint.

    Remember: Install the software → register the server → select the folder.
    The cloud endpoint identifies the Azure file share; the server endpoint
    identifies the local folder to synchronize with it.

    [Microsoft Learn: Deploy Azure File Sync](https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-deployment-guide)
    [Microsoft Learn: Manage Azure File Sync registered servers](https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-server-registration)
    [Microsoft Learn: Create an Azure File Sync server endpoint](https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-server-endpoint-create)
- id: '018'
  skill: Implement and manage storage
  sub-skill: Configure and manage storage accounts
  tags:
    - "exam topic: Implement and manage storage"
    - must-review
    - Storage redundancy
    - ZRS
    - Storage account types
    - StorageV2
    - ZRS Classic
  question: |
    HOTSPOT

    You plan to create an Azure Storage account in the Azure region of East US 2.

    You need to create a storage account that meets the following requirements:

    - Replicates synchronously.
    - Remains available if a single data center in the region fails.

    How should you configure the storage account? Select the appropriate
    options in the answer area. Each correct selection is worth one point.
  choices:
    Replication:
      - Geo-redundant storage (GRS)
      - Locally-redundant storage (LRS)
      - Read-access geo-redundant storage (RA-GRS)
      - Zone-redundant storage (ZRS)
    Account type:
      - Blob storage
      - Storage (general purpose v1)
      - StorageV2 (general purpose v2)
  answer:
    Replication: Zone-redundant storage (ZRS)
    Account type: StorageV2 (general purpose v2)
  user_answer:
    Replication: Zone-redundant storage (ZRS)
    Account type: StorageV2 (general purpose v2)
  user_result: correct
  learning_note: |
    Both selections were correct. Revisit why account type matters: Standard
    StorageV2 supports modern ZRS, while legacy BlobStorage and GPv1 do not.
    Historical ZRS Classic is not equivalent to modern synchronous ZRS.
    BlobStorage is an account kind; Azure Blob Storage is also a service
    available within StorageV2 accounts.
  explanation: |
    Correct selections: **Zone-redundant storage (ZRS), StorageV2
    (general purpose v2).** Both attempted selections are correct.

    ZRS synchronously replicates data across availability zones in the same
    region and maintains read/write access during a single-zone failure.
    This meets both requirements: synchronous replication and continued
    availability if a single datacenter fails. An availability zone is a
    physically separate group of one or more datacenters within a region,
    with independent power, cooling, and networking.

    Why the other replication options do not fit:

    - LRS replicates synchronously, but does not guarantee availability
      through the loss of a datacenter hosting the storage replicas.
    - GRS uses local redundancy in the primary region and asynchronous
      replication to another region. Access to the secondary requires
      failover, so it does not meet the required synchronous, continuously
      available zone-resilient behavior.
    - RA-GRS permits reads from the secondary endpoint, but geographic
      replication is still asynchronous and secondary writes require failover.

    The second selection must identify an account type that supports modern
    ZRS. Among the listed options, choose Standard general-purpose v2:

    - StorageV2 with Standard performance supports modern ZRS.
    - Storage (general purpose v1) does not support modern ZRS. Historical
      ZRS Classic for GPv1 block blobs did not provide the same synchronous
      replication across availability zones or uninterrupted availability;
      access to replicated data could require Microsoft-initiated failover.
    - Blob storage means the legacy BlobStorage account kind in this list.
      It does not support modern ZRS directly; upgrade to StorageV2 first.

    Do not confuse the BlobStorage account kind with the Azure Blob Storage
    service. Standard StorageV2 supports Azure Blob Storage as well as Azure
    Files, queues, and tables. Selecting StorageV2 still allows storing blobs.
    Also read the performance tier: Premium StorageV2 identifies premium
    page blobs and does not support ZRS. This question assumes Standard GPv2.

    The question uses legacy account-type options. For this exam scenario,
    account-type compatibility is the decisive reason for choosing StorageV2.

    Remember: Synchronous + available through a zone/datacenter failure →
    modern ZRS. Among these account types → Standard StorageV2.

    [Microsoft Learn: Azure Storage redundancy](https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy)
    [Microsoft Learn: Storage account overview](https://learn.microsoft.com/en-us/azure/storage/common/storage-account-overview)
    [Microsoft Learn: Change how a storage account is replicated — ZRS Classic](https://learn.microsoft.com/en-us/azure/storage/common/redundancy-migration)
