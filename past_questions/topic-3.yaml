- id: '023'
  skill: Implement and manage storage
  sub-skill: Configure and manage storage accounts
  tags:
    - "exam topic: Implement and manage storage"
    - Storage redundancy
    - LRS
    - Replica counts
    - Blob access tiers
  question: |
    HOTSPOT

    You have an Azure subscription. You create the Azure Storage account
    shown in the exhibit, with the following settings:

    | Setting | Value |
    |---------|-------|
    | Subscription | Subscription1 |
    | Resource group | RG1 |
    | Location | North Europe |
    | Storage account name | storage16852 |
    | Deployment model | Resource manager |
    | Account kind | StorageV2 (general purpose v2) |
    | Replication | Locally-redundant storage (LRS) |
    | Performance | Standard |
    | Access tier (default) | Hot |
    | Connectivity method | Private endpoint |
    | Private endpoint | New StorageEndpoint1 (blob), privatelink.blob.core.windows.net |
    | Secure transfer required | Enabled |
    | Large file shares | Disabled |
    | Blob soft delete | Disabled |
    | Blob change feed | Disabled |
    | Hierarchical namespace | Disabled |
    | NFS v3 | Disabled |

    Select the answer choice that completes each statement.
    Each correct selection is worth one point.

    1. The minimum number of copies of the storage account will be [answer choice].
    2. To reduce the cost of infrequently accessed data in the storage account,
       you must modify the [answer choice] setting.
  choices:
    Minimum number of copies:
      - "1"
      - "2"
      - "3"
      - "4"
    Setting to modify:
      - Access tier (default)
      - Performance
      - Account kind
      - Replication
  answer:
    Minimum number of copies: "3"
    Setting to modify: Access tier (default)
  user_answer:
    Minimum number of copies: "2"
    Setting to modify: Access tier (default)
  user_result: partially_correct
  learning_note: |
    LRS maintains three copies of data, not two. ZRS also maintains three
    copies, distributed across zones. Geographic options maintain six copies.
    Access tier was correctly identified as the setting for reducing the
    storage cost of infrequently accessed blob data.
  explanation: |
    Correct selections: **3, Access tier (default).** The attempted answer
    gets the access-tier selection correct but undercounts the LRS replicas.

    The account uses LRS, which maintains three synchronously replicated
    copies of its data in the primary region. The question's phrase 'copies
    of the storage account' refers to data replicas, not three separately
    addressable storage-account resources. Its private endpoint changes
    network connectivity, not the redundancy or copy count.

    For infrequently accessed blob data, change the default access tier from
    Hot to Cool. Cool reduces storage capacity costs but increases access
    costs, so it fits the stated access pattern. The default tier applies
    to blobs that inherit the account tier; a blob with an explicitly assigned
    tier must be changed separately or through lifecycle management.
    This account setting does not set the tier for Azure file shares.

    Why the other settings are not the answer:

    - Performance selects Standard versus Premium performance.
    - Account kind determines supported services and features. The account
      is already Standard StorageV2 and supports blob access tiers.
    - Replication determines redundancy and failure protection. It does not
      select a tier based on how often data is accessed, and this account
      already uses LRS.

    Redundancy copy-count comparison for this exam:

    | Replication | Total copies | Distribution |
    |-------------|--------------|--------------|
    | LRS | 3 | Local replicas in the primary region |
    | ZRS | 3 | Across three primary-region availability zones |
    | GRS or RA-GRS | 6 | Three local copies in the primary region and three in the secondary region |
    | GZRS or RA-GZRS | 6 | Three across primary-region zones and three local copies in the secondary region |

    Replication within each region is synchronous; geographic replication
    to the secondary region is asynchronous. RA adds secondary-region read
    access, not additional replicas.

    Remember: Local or zone = 3; geographic = 6. Infrequent blob access = Cool.

    [Microsoft Learn: Azure Storage redundancy](https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy)
    [Microsoft Learn: Access tiers for blob data](https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview)
- id: '024'
  skill: Implement and manage storage
  sub-skill: Configure and manage storage accounts
  tags:
    - "exam topic: Implement and manage storage"
    - AzCopy
    - Azure Blob Storage
    - Azure Files
    - Supported storage services
  question: |
    You have an Azure Storage account named storage1.

    You plan to use AzCopy to copy data to storage1.

    You need to identify the storage services in storage1 to which you can
    copy the data.

    Which storage services should you identify?
  choices:
    A: blob, file, table, and queue
    B: blob and file only
    C: file and table only
    D: file only
    E: blob, table, and queue only
  answer: B
  user_answer: B
  user_result: correct
  explanation: |
    Correct answer: **B — blob and file only.** The attempted answer is correct.

    AzCopy v10 supports copying data to Azure Blob Storage and Azure Files.
    It does not support copying Azure Table Storage entities or Azure Queue
    Storage messages. The fact that a storage account supports these services
    does not mean that every transfer tool supports all of them.

    Why the other options are wrong:

    - A includes both unsupported Table and Queue services.
    - C includes Table Storage and omits supported Blob Storage.
    - D omits supported Blob Storage.
    - E includes Table and Queue services and omits Azure Files.

    Version note: This answer applies to the currently supported AzCopy v10.
    Older AzCopy versions had different capabilities, including legacy Table
    transfer support; do not use old examples to infer v10 support.

    Remember: AzCopy = Blob + Files.

    Blueprint note: Managing data with Azure Storage Explorer and AzCopy is
    explicitly listed in the AZ-104 skills measured as of April 17, 2026.

    [Microsoft Learn: Copy or move data to Azure Storage with AzCopy v10](https://learn.microsoft.com/en-us/azure/storage/common/storage-use-azcopy-v10)
    [Microsoft Learn: Official AZ-104 study guide](https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/az-104)
- id: '025'
  skill: Implement and manage storage
  sub-skill: Configure and manage storage accounts
  tags:
    - "exam topic: Implement and manage storage"
    - AzCopy
    - Authentication
    - Microsoft Entra ID
    - SAS
    - Azure Files
    - outdated-answer-key
  question: |
    HOTSPOT

    You have an Azure Storage account named storage1 that uses Azure Blob
    storage and Azure File storage.

    You need to use AzCopy to copy data to the blob storage and file storage
    in storage1.

    Which authentication method should you use for each type of storage?
    Select the appropriate options in the answer area.
    Each correct selection is worth one point.
  choices:
    Blob storage:
      - Azure Active Directory (Azure AD) only
      - Shared access signatures (SAS) only
      - Access keys and shared access signatures (SAS) only
      - Azure Active Directory (Azure AD) and shared access signatures (SAS) only
      - Azure Active Directory (Azure AD), access keys, and shared access signatures (SAS)
    File storage:
      - Azure Active Directory (Azure AD) only
      - Shared access signatures (SAS) only
      - Access keys and shared access signatures (SAS) only
      - Azure Active Directory (Azure AD) and shared access signatures (SAS) only
      - Azure Active Directory (Azure AD), access keys, and shared access signatures (SAS)
  answer:
    Blob storage: Azure Active Directory (Azure AD) and shared access signatures (SAS) only
    File storage: Azure Active Directory (Azure AD) and shared access signatures (SAS) only
  user_answer:
    Blob storage: Azure Active Directory (Azure AD), access keys, and shared access signatures (SAS)
    File storage: Azure Active Directory (Azure AD), access keys, and shared access signatures (SAS)
  user_result: incorrect
  learning_note: |
    AzCopy v10 accepts Microsoft Entra ID or SAS for these data transfers,
    not raw storage account access keys. An account key can sign a SAS,
    but the SAS is the credential passed to AzCopy. Azure Files now supports
    Entra ID for file/directory operations; older answers saying SAS only
    reflect historical support. Share/account-only operations still require
    SAS according to the current documentation.
  explanation: |
    Current answers, verified October 2, 2026: **Azure AD and SAS only for
    both Blob storage and File storage**, interpreting the question as
    copying blob data and files/directories with current AzCopy v10.
    Azure AD is now named Microsoft Entra ID.

    The attempted selections include access keys for both services, making
    both choices incorrect. AzCopy's supported credentials for these
    transfers are Entra ID authorization or a SAS token appended to the URL.
    Raw storage account keys are not directly supplied as transfer credentials.
    Although an account key can be used to generate a SAS, using that SAS
    with AzCopy is different from authenticating directly with the key.

    Blob transfers support Entra ID with the appropriate data permissions
    or SAS with the required scope, permissions, and validity period.

    Azure Files support has changed. Current AzCopy supports Entra ID for
    commands targeting files and directories. Commands targeting only the
    file share or account, such as creating a share with azcopy make, still
    require SAS according to Microsoft's current transfer documentation.
    Therefore, the question's lack of a version and precise operation scope
    deserves a currency caveat rather than an unconditional historical key.

    Historical expected answers for this older question:

    - Blob storage: Azure AD and SAS only.
    - File storage: SAS only.

    The historical File storage answer predates the Entra ID support now
    documented for file/directory transfers. Do not memorize SAS-only as a
    universal current limitation for Azure Files in AzCopy.

    Why the other choices do not describe the supported methods accurately:

    - Azure AD only omits SAS, which is also supported.
    - SAS only omits Entra ID for current blob and file/directory transfers,
      though SAS remains necessary for the specified share/account operations.
    - Access keys and SAS only includes unsupported direct account-key use
      and omits Entra ID where supported.
    - Azure AD, access keys, and SAS includes unsupported direct account-key use.

    Remember: Storage-service authentication capabilities and a transfer
    tool's accepted credentials are separate checks. For current AzCopy
    data transfers, think Entra ID or SAS; account key can generate SAS.

    [Microsoft Learn: Get started with AzCopy — authorization](https://learn.microsoft.com/en-us/azure/storage/common/storage-use-azcopy-v10)
    [Microsoft Learn: Transfer data to or from Azure Files with AzCopy](https://learn.microsoft.com/en-us/azure/storage/common/storage-use-azcopy-files)
- id: '026'
  skill: Deploy and manage Azure compute resources
  sub-skill: Provision and manage containers in the Azure portal
  tags:
    - "exam topic: Deploy and manage Azure compute resources"
    - Azure Container Instances
    - Azure Files
    - Persistent storage
    - Volume mounts
    - SQL Server containers
  question: |
    You have an Azure subscription that contains an Azure Storage account.

    You plan to create an Azure container instance named container1 that
    will use a Docker image named Image1. Image1 contains a Microsoft SQL
    Server instance that requires persistent storage.

    You need to configure a storage service for container1.

    What should you use?
  choices:
    A: Azure Files
    B: Azure Blob storage
    C: Azure Queue storage
    D: Azure Table storage
  answer: A
  user_answer: A
  user_result: correct
  explanation: |
    Correct answer: **A — Azure Files.** The attempted answer is correct.

    Azure Container Instances can mount an Azure file share as a persistent
    volume. The container accesses the share through a configured mount path,
    and files stored in the share remain independently of the container's
    lifecycle. This meets the question's requirement for persistent mounted
    storage rather than relying on the container's writable filesystem.

    Why the other options are wrong:

    - B: Blob Storage stores objects. It is not the native Azure Files volume
      mount used for this ACI persistent-filesystem scenario.
    - C: Queue Storage stores messages for asynchronous processing, not
      persistent database files in a mounted directory.
    - D: Table Storage stores structured NoSQL entities, not a mounted
      filesystem for SQL Server's files.

    The question tests ACI's persistent-storage integration. Choosing the
    supported volume service does not by itself establish that every SQL
    Server image, permission setup, or database-file configuration is valid;
    those workload details are outside the supplied scenario.

    Remember: ACI + persistent mounted files → Azure Files.

    [Microsoft Learn: Mount an Azure Files volume to a container group](https://learn.microsoft.com/en-us/azure/container-instances/container-instances-volume-azure-files)
