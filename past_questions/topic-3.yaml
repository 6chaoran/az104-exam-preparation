  question: |
    You plan to use the Azure Import/Export service to copy files to a storage account.

    Which two files should you create before you prepare the drives for the
    import job? Each correct answer presents part of the solution.
    Each correct selection is worth one point.
  choices:
    A: an XML manifest file
    B: a dataset CSV file
    C: a JSON configuration file
    D: a PowerShell PS1 file
    E: a driveset CSV file
  answer: BE
  user_answer: AE
  user_result: partially_correct
  learning_note: |
    Before drive preparation, create or edit dataset.csv and driveset.csv.
    The WAImportExport tool generates an XML journal during preparation;
    that journal is an output, not a manifest to create beforehand.
    Import/Export drive preparation is not explicitly listed in the April 17,
    2026 AZ-104 blueprint, so treat this legacy question as low priority.
  explanation: |
    Correct answers: **B and E — a dataset CSV file and a driveset CSV file.**
    The attempted answer, A and E, correctly identifies the driveset CSV but
    substitutes an XML manifest for the required dataset CSV.

    dataset.csv specifies the files or folders to copy and their Azure
    destinations. driveset.csv identifies the drives to prepare and their
    encryption settings. Create or edit these CSV inputs before running
    WAImportExport.exe PrepImport.

    Why the other options are wrong:

    - A: The tool generates an XML journal file during drive preparation.
      Upload that journal when creating the import job. It is not an XML
      manifest that you must create before preparing the drives.
    - C: A JSON configuration file is not a required input for this workflow.
    - D: A PowerShell script is not required; the drive-preparation executable
      consumes the CSV inputs directly.

    Remember: Before preparation → two CSV inputs. After preparation → XML
    journal output.

