    |------|----------------|--------|--------|-------------------------|
    | VNet1 | RG1 | West US | Subnet1 | 10.1.0.0/16 |
    | VNet2 | RG2 | Central US | Subnet2 | 10.2.0.0/24 |
    | VNet3 | RG3 | East US | Subnet3 | 10.3.0.0/24 |

    You plan to deploy the Azure Kubernetes Service (AKS) clusters shown
    in the following table.

    | Name | Resource group | Region | Number of nodes | Network configuration |
    |------|----------------|--------|-----------------|-----------------------|
    | AKS1 | RG1 | West US | 30 | Azure Container Network Interface (CNI) |
    | AKS2 | RG2 | West US | 100 | Azure Container Network Interface (CNI) |
    | AKS3 | RG3 | East US | 50 | Kubenet |

    For each statement, select Yes if the statement is true. Otherwise,
    select No. Each correct selection is worth one point.
  choices:
    You can deploy AKS1 to VNet2:
      - 'Yes'
      - 'No'
    You can deploy AKS2 to VNet1:
      - 'Yes'
      - 'No'
    You can deploy AKS3 to VNet3:
      - 'Yes'
      - 'No'
  answer:
    You can deploy AKS1 to VNet2: 'No'
    You can deploy AKS2 to VNet1: 'Yes'
    You can deploy AKS3 to VNet3: 'Yes'
  user_answer:
    You can deploy AKS1 to VNet2: 'No'
    You can deploy AKS2 to VNet1: 'Yes'
    You can deploy AKS3 to VNet3: 'Yes'
  user_result: correct
  explanation: |
    Correct selections: **No, Yes, Yes.** All three attempted selections
    are correct.

    1. AKS1 to VNet2 — No. AKS1 is in West US, whereas VNet2 is in
       Central US. An existing VNet must be in the same region and
       subscription as the AKS cluster. RG2's West US location does not
       change VNet2's Central US location.
    2. AKS2 to VNet1 — Yes. Both resources are in West US and in the same
       subscription. They can belong to different resource groups. The
       /16 subnet provides 65,531 usable IP addresses, sufficient for
       100 nodes and their pods with the traditional Azure CNI model
       assumed by this question. That model assigns subnet IP addresses
       to both nodes and pods.
    3. AKS3 to VNet3 — Yes. Both are in East US. Kubenet assigns subnet
       IP addresses to nodes, while pods use a separate private address
       range. A /24 subnet has 251 usable IP addresses after Azure's five
       reserved addresses, sufficient for 50 nodes.

    This older question uses traditional Azure CNI node-subnet networking
    and kubenet. Azure CNI Overlay has a different pod IP allocation model.
    Deployment also assumes the cluster identity has the required network
    permissions and the subnet addresses are available.

    Remember: Match the cluster region to the VNet region, not the resource
    group region. Traditional Azure CNI uses subnet IPs for nodes and pods;
    kubenet uses subnet IPs for nodes only.

    [Microsoft Learn: AKS legacy CNI networking](https://learn.microsoft.com/en-us/azure/aks/concepts-network-legacy-cni)
    [Microsoft Learn: Configure kubenet networking](https://learn.microsoft.com/en-us/azure/aks/configure-kubenet)
    [Microsoft Learn: Azure virtual networks and subnets](https://learn.microsoft.com/en-us/azure/networking/design-guide/vnets-subnets)
- id: '070'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  tags:
    - "exam topic: Deploy and manage Azure compute resources"
    - Virtual Machine Scale Sets
    - Desired State Configuration
    - VM extensions
    - ARM templates
    - Application installation
  question: |
    You plan to deploy several Azure virtual machines that will run Windows
    Server 2019 in a virtual machine scale set by using an Azure Resource
    Manager template.

    You need to ensure that NGINX is available on all the virtual machines
    after they are deployed.

    What should you use?
  choices:
    A: the Publish-AzVMDscConfiguration cmdlet
    B: Azure Application Insights
    C: a Desired State Configuration (DSC) extension
    D: Azure AD Application Proxy
  answer: C
  user_answer: C
  user_result: correct
  explanation: |
    Correct answer: **C — a Desired State Configuration (DSC) extension.**
    The attempted answer is correct.

    Add the DSC extension to the scale set's ARM template and provide a
    DSC configuration that installs and configures NGINX. The extension
    applies the configuration inside each Windows VM as it is provisioned,
    including new instances created during scale-out. The extension needs
    an appropriate configuration; merely adding an empty extension does
    not install NGINX automatically.

    Why the other options are wrong:

    - A: Publish-AzVMDscConfiguration packages a configuration and its
      dependent resources and can upload the package to Blob Storage.
      Publishing prepares the package but does not itself apply it to
      every VM. The DSC extension performs that configuration step.
    - B: Application Insights monitors application behavior and performance;
      it does not install NGINX on scale set instances.
    - D: Azure AD Application Proxy, now Microsoft Entra Application Proxy,
      provides remote access to applications rather than installing software
      on the VMs.

    For this question, distinguish deploying VM infrastructure from
    configuring software inside the guest operating system. VM extensions
    provide the required guest configuration after infrastructure deployment.

    Current lifecycle note: Microsoft documents retirement of the DSC
    extension on March 31, 2028 and recommends transitioning to Azure
    Machine Configuration. C remains the correct listed answer for this
    DSC-extension deployment scenario.

    Remember: Publish prepares the configuration; the extension applies it.

    [Microsoft Learn: Use DSC with Virtual Machine Scale Sets](https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/virtual-machine-scale-sets-dsc)
    [Microsoft Learn: Deploy applications to a scale set](https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/virtual-machine-scale-sets-deploy-app)
    [Microsoft Learn: Publish-AzVMDscConfiguration](https://learn.microsoft.com/en-us/powershell/module/az.compute/publish-azvmdscconfiguration)
- id: '071'
  skill: Implement and manage storage
  sub-skill: Configure and manage storage accounts
  tags:
    - "exam topic: Implement and manage storage"
    - Network routing preference
    - Storage encryption
    - Customer-managed keys
    - Premium file shares
  question: |
    HOTSPOT

    You have an Azure subscription that has offices in the East US and
    West US Azure regions.

    You plan to create the storage account shown in the following exhibit.

    | Section | Setting | Value |
    |---------|---------|-------|
    | Basics | Subscription | Azure subscription 1 |
    | Basics | Resource group | RG1 |
    | Basics | Location | eastus |
    | Basics | Storage account name | adatum22 |
    | Basics | Deployment model | Resource manager |
    | Basics | Performance | Premium |
    | Basics | Premium account type | File shares |
    | Basics | Replication | Zone-redundant storage (ZRS) |
    | Advanced | Secure transfer | Enabled |
    | Advanced | Allow storage account key access | Enabled |
    | Advanced | Allow cross-tenant replication | Disabled |
    | Advanced | Default to Azure Active Directory authorization in the Azure portal | Disabled |
    | Advanced | Blob public access | Enabled |
    | Advanced | Minimum TLS version | Version 1.2 |
    | Advanced | Permitted scope for copy operations (preview) | From any storage account |
    | Advanced | Enable hierarchical namespace | Disabled |
    | Advanced | Enable network file system v3 | Disabled |
    | Advanced | Enable SFTP | Disabled |
    | Advanced | Large file shares | Disabled |
    | Networking | Network connectivity | Public endpoint (all networks) |
    | Networking | Default routing tier | Microsoft network routing |
    | Networking | Endpoint type | Standard |
    | Data protection | Point-in-time restore | Disabled |
    | Data protection | Blob soft delete | Disabled |
    | Data protection | Container soft delete | Disabled |
    | Data protection | File share soft delete | Enabled |
    | Data protection | File share retention period in days | 7 |
    | Data protection | Versioning | Disabled |
    | Data protection | Blob change feed | Disabled |
    | Data protection | Version-level immutability support | Disabled |
    | Encryption | Encryption type | Microsoft-managed keys (MMK) |
    | Encryption | Enable support for customer-managed keys | Blobs and files only |
    | Encryption | Enable infrastructure encryption | Disabled |

    Select the answer choice that completes each statement.
    Each correct selection is worth one point.

    1. To minimize the network costs of accessing adatum22, modify the
       [answer choice] setting.
    2. After adatum22 is created, you can modify the [answer choice] setting.
  choices:
    To minimize the network costs of accessing adatum22:
      - Default routing tier
      - Endpoint type
      - Location
      - Network connectivity
      - Performance
    After adatum22 is created:
      - Enable infrastructure encryption
      - Enable support for customer-managed keys
      - Encryption type
      - Premium account type
  answer:
    To minimize the network costs of accessing adatum22: Default routing tier
    After adatum22 is created: Encryption type
  user_answer:
    To minimize the network costs of accessing adatum22: Default routing tier
    After adatum22 is created: null
  user_result: partially_correct
  learning_note: |
    The routing selection was correct; the second selection was unanswered.
    Distinguish Encryption type (Microsoft-managed versus customer-managed
    keys) from the creation-time setting that enables customer-managed key
    support for particular storage services.
  explanation: |
    Correct selections: **Default routing tier; Encryption type.**
    The first attempted selection is correct. No second answer was supplied.

    To minimize network costs, change the default routing tier from Microsoft
    network routing to Internet routing. Internet routing is the cost-optimized
    routing option for traffic using the storage account's public endpoint.
    Microsoft network routing prioritizes use of Microsoft's global backbone.
    Endpoint type and network connectivity control different aspects of access;
    performance selects the storage performance tier rather than network routing.
    Changing the location is not the routing-cost setting tested here.

    After creation, you can change Encryption type between Microsoft-managed
    keys and customer-managed keys, with the required identity and key-vault
    configuration for customer-managed keys. This changes who manages the
    encryption keys; the stored data remains encrypted.

    Why the other second-dropdown options are wrong:

    - Enable infrastructure encryption is a creation-time choice for an extra
      layer of encryption and cannot be toggled on an existing storage account.
    - Enable support for customer-managed keys selects the service scope of
      key support at creation. It is distinct from subsequently selecting
      Microsoft-managed or customer-managed keys under Encryption type.
    - Premium account type cannot be changed from File shares to another
      premium account type after creation.

    The exhibit preserves older portal terminology. Azure Active Directory
    is now Microsoft Entra ID, and routing preference is the current term
    commonly used in the documentation for the routing choice.

    Remember: Routing tier → network cost. Encryption type → who manages keys.

    [Microsoft Learn: Network routing preference](https://learn.microsoft.com/en-us/azure/storage/common/network-routing-preference)
    [Microsoft Learn: Customer-managed keys overview](https://learn.microsoft.com/en-us/azure/storage/common/customer-managed-keys-overview)
    [Microsoft Learn: Infrastructure encryption](https://learn.microsoft.com/en-us/azure/storage/common/infrastructure-encryption-enable)
- id: '072'
  skill: Implement and manage storage
  sub-skill: Configure and manage storage accounts
  tags:
    - "exam topic: Implement and manage storage"
    - Storage encryption
    - Customer-managed keys
    - Azure Key Vault
    - RSA
  question: |
    HOTSPOT

    You have an Azure subscription.

    You plan to deploy a new storage account.

    You need to configure encryption for the account. The solution must meet
    the following requirements:

    - Use a customer-managed key stored in a key vault.
    - Use the maximum supported bit length.

    Which type of key and which bit length should you use?
    Each correct selection is worth one point.
  choices:
    Key:
      - AES
      - 3DES
      - RSA
    Bit length:
      - '2048'
      - '3072'
      - '4096'
      - '8192'
  answer:
    Key: RSA
    Bit length: '4096'
  user_answer:
    Key: RSA
    Bit length: '4096'
  user_result: correct
  learning_note: |
    Azure Storage customer-managed keys support RSA or RSA-HSM keys of
    2048, 3072, or 4096 bits. Distinguish the RSA key that wraps the storage
    encryption key from AES-256 encryption of the actual data.
  explanation: |
    Correct selections: **RSA; 4096 bits.** Both attempted selections are correct.

    Azure Storage supports customer-managed RSA and RSA-HSM keys stored in
    Azure Key Vault. Supported key sizes are 2048, 3072, and 4096 bits, so
    4096 bits meets the maximum-supported-bit-length requirement.

    Why the other options are wrong:

    - AES: Azure Storage uses AES-256 to encrypt the actual data, but the
      customer-managed key in this scenario is an RSA key that wraps
      (protects) the root data encryption key.
    - 3DES: It is not a supported customer-managed key type for this purpose.
    - 2048 and 3072 bits: Both are supported, but neither is the maximum.
    - 8192 bits: Azure Storage does not support this customer-managed key size.

    Remember: Storage data → AES-256; customer-managed wrapping key → RSA,
    up to 4096 bits.

    [Microsoft Learn: Customer-managed keys for Azure Storage encryption](https://learn.microsoft.com/en-us/azure/storage/common/customer-managed-keys-overview)
- id: '073'
  skill: Implement and manage storage
  sub-skill: Configure access to storage
  tags:
    - "exam topic: Implement and manage storage"
    - Azure Blob Storage
    - Blob index tags
    - Azure ABAC
    - Role assignment conditions
  question: |
    You have an Azure Storage account that contains 5,000 blobs accessed
    by multiple users.

    You need to ensure that the users can view only specific blobs based
    on blob index tags.

    What should you include in the solution?
  choices:
    A: a role assignment condition
    B: a stored access policy
    C: just-in-time (JIT) VM access
    D: a shared access signature (SAS)
  answer: A
  user_answer: A
  user_result: correct
  explanation: |
    Correct answer: **A — a role assignment condition.** The attempted
    answer A is correct.

    Azure attribute-based access control (ABAC) adds conditions to Azure
    role assignments. A condition can evaluate a blob's index tags before
    allowing a read operation. For example, assign Storage Blob Data Reader
    with a condition allowing reads only for blobs tagged Project=Alpha.
    This applies a tag-based rule without configuring access individually
    for all 5,000 blobs.

    Why the other choices are wrong:

    - B: A stored access policy manages permissions and validity periods
      for associated service SAS tokens. It does not define blob index
      tag-based authorization conditions.
    - C: Just-in-time VM access temporarily opens permitted network ports
      for virtual machines. It does not control reads of blob data.
    - D: A SAS grants scoped, time-limited access to storage resources, but
      does not itself express the blob index tag-based rule required here.

    Role assignment conditions constrain the permissions in that assignment.
    Ensure users do not have another unconditional assignment or alternative
    access path that independently grants access to the restricted blobs.
    A condition on reading blob content does not automatically filter blob
    names returned by a listing operation.

    Remember: Blob tag-based authorization → role assignment condition (ABAC).

    [Microsoft Learn: Add a role assignment condition to restrict access to blobs](https://learn.microsoft.com/en-us/azure/storage/blobs/storage-auth-abac-portal)
    [Microsoft Learn: Security considerations for role assignment conditions](https://learn.microsoft.com/en-us/azure/storage/blobs/storage-auth-abac-security)
- id: '074'
  skill: Implement and manage storage
  sub-skill: Configure and manage storage accounts
  tags:
    - "exam topic: Implement and manage storage"
    - Storage encryption
    - Encryption scopes
    - Azure Blob Storage
  question: |
    You have an Azure Storage account named storage1.

    For storage1, you create an encryption scope named Scope1.

    Which storage types can you encrypt by using Scope1?
  choices:
    A: file shares only
    B: containers only
    C: file shares and containers only
    D: containers and tables only
    E: file shares, containers, and tables only
    F: file shares, containers, tables, and queues
  answer: B
  user_answer: C
  user_result: incorrect
  learning_note: |
    Distinguish storage account encryption from encryption scopes. Azure Files
    supports encryption, but encryption scopes apply only to Blob Storage
    containers and individual blobs, not file shares, tables, or queues.
  explanation: |
    Correct answer: **B — containers only.** The attempted answer C incorrectly
    includes file shares.

    Encryption scopes let you manage encryption at the level of an individual
    blob or container within an Azure Storage account. A container can have a
    default encryption scope for its blobs. This feature applies to Azure Blob
    Storage, not Azure Files, Table Storage, or Queue Storage.

    Why the other options are wrong:

    - A: File shares do not support encryption scopes.
    - C: Containers are supported, but file shares are not.
    - D: Tables do not support encryption scopes.
    - E: Both file shares and tables are outside the feature's scope.
    - F: File shares, tables, and queues do not support encryption scopes.

    These other storage services still support encryption at rest. The decisive
    requirement is using the named encryption scope, rather than whether the
    service supports encryption in general.

    Remember: Encryption scope → Blob Storage containers and individual blobs.

    [Microsoft Learn: Encryption scopes for Blob Storage](https://learn.microsoft.com/en-us/azure/storage/blobs/encryption-scope-overview)
- id: '075'
  skill: Manage Azure identities and governance
  sub-skill: Manage access to Azure resources
  tags:
    - "exam topic: Manage Azure identities and governance"
    - Azure RBAC
    - Custom roles
    - Least privilege
    - Management plane
    - Storage accounts
    - Virtual networks
  question: |
    HOTSPOT

    You have an Azure subscription.

    You plan to create a role definition to meet the following requirements:

    - Users must be able to view the configuration data of a storage account.
    - Users must be able to perform all actions on a virtual network.
    - The solution must use the principle of least privilege.

    What should you include in the role definition for each requirement?
    Each correct selection is worth one point.
  choices:
    Perform all actions on a virtual network:
      - Microsoft.Network/virtualNetworks/*
      - Microsoft.Network/virtualNetworks/delete
      - Microsoft.Network/virtualNetworks/write
    View the configuration data of a storage account:
      - Microsoft.Storage/StorageAccounts/*
      - Microsoft.Storage/StorageAccounts/read
      - Microsoft.Storage/StorageAccounts/blobServices/containers/blob/read
  answer:
    Perform all actions on a virtual network: Microsoft.Network/virtualNetworks/*
    View the configuration data of a storage account: Microsoft.Storage/StorageAccounts/read
  user_answer:
    Perform all actions on a virtual network: Microsoft.Network/virtualNetworks/*
    View the configuration data of a storage account: Microsoft.Storage/StorageAccounts/read
  user_result: correct
  learning_note: |
    A resource-specific wildcard satisfies an explicit requirement for all
    actions. Reading storage account configuration is a management-plane
    operation, distinct from reading blob content on the data plane.
  explanation: |
    Correct selections: **Microsoft.Network/virtualNetworks/*** and
    **Microsoft.Storage/StorageAccounts/read**. Both attempted selections
    are correct, following the answer area's order.

    Include these permissions in the role definition's Actions array.

    For the virtual network, the wildcard grants all operations under the
    virtualNetworks resource type. It meets the requirement for all actions
    while limiting the permissions to that resource type. The delete action
    permits deletion only, and write permits creation and updates; neither
    alone grants all required operations.

    For the storage account, read retrieves the account's properties and
    configuration. The wildcard grants unnecessary management permissions
    and violates least privilege for a view-only requirement. Reading blob
    content is a data-plane operation and does not provide account configuration.

    The choices preserve the exhibit's spelling. The documented storage
    account action is Microsoft.Storage/storageAccounts/read. The blob data
    read action uses containers/blobs/read (plural), whereas the exhibit
    shows containers/blob/read; it is not the correct selection either way.

    Least privilege also depends on assigning the role at the appropriate
    resource scope. The role definition describes allowed operations; the
    role assignment determines where those operations are allowed.

    Remember: All actions on a resource type → resource-specific /*.
    View account configuration → storageAccounts/read, not blob data read.

    [Microsoft Learn: Azure permissions for Networking](https://learn.microsoft.com/en-us/azure/role-based-access-control/permissions/networking)
    [Microsoft Learn: Azure permissions for Storage](https://learn.microsoft.com/en-us/azure/role-based-access-control/permissions/storage)
- id: '078'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  tags:
    - "exam topic: Deploy and manage Azure compute resources"
    - Azure Disk Encryption
    - Azure Key Vault
    - Key encryption key
    - RSA
  question: |
    You have an Azure virtual machine named VM1 and an Azure key vault
    named Vault1.

    On VM1, you plan to configure Azure Disk Encryption to use a key
    encryption key (KEK).

    You need to prepare Vault1 for Azure Disk Encryption.

    Which two actions should you perform on Vault1? Each correct answer
    presents part of the solution.
    Each correct selection is worth one point.
  choices:
    A: Select Azure Virtual machines for deployment.
    B: Create a new key.
    C: Create a new secret.
    D: Configure a key rotation policy.
    E: Select Azure Disk Encryption for volume encryption.
  answer: BE
  user_answer: BE
  user_result: correct
  learning_note: |
    For Azure Disk Encryption with a KEK, create an RSA key in Key Vault
    and enable Azure Disk Encryption for volume encryption. Distinguish
    this required vault setting from the separate VM deployment setting.
  explanation: |
    Correct answers: **B and E.** Both attempted selections are correct.

    - B: Create an RSA key in Vault1 to serve as the key encryption key
      (KEK). Azure Disk Encryption uses the KEK to wrap (protect) its
      encryption secrets before writing them to Key Vault. Importing an
      existing suitable key is another supported approach, but creating
      a new key is the applicable listed option.
    - E: Select Azure Disk Encryption for volume encryption in the vault's
      access policy settings. This enables enabledForDiskEncryption,
      which is required for Azure Disk Encryption.

    Why the other options are wrong:

    - A: Azure Virtual machines for deployment enables retrieval of vault
      secrets during VM resource creation. It is a separate setting and
      does not replace the required disk encryption setting.
    - C: The KEK is a Key Vault key, not a manually created secret. Azure
      Disk Encryption handles writing its encryption secrets to the vault.
    - D: A key rotation policy is not a prerequisite. Azure Disk Encryption
      continues using the original key version after automatic rotation;
      it does not automatically switch to the newly rotated KEK.

    Remember: ADE with KEK → RSA key + volume encryption access.

    [Microsoft Learn: Create and configure a key vault for Azure Disk Encryption](https://learn.microsoft.com/en-us/azure/virtual-machines/windows/disk-encryption-key-vault)
- id: '077'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  tags:
    - "exam topic: Deploy and manage Azure compute resources"
    - Managed disks
    - Premium SSD
    - Zone-redundant storage
    - Host caching
    - must-review
  question: |
    HOTSPOT

    You have an Azure subscription that contains a virtual machine named VM1.

    To VM1, you plan to add a 1-TB data disk that meets these requirements:

    - Provides data resiliency in the event of a datacenter outage.
    - Provides the lowest latency and the highest performance.
    - Ensures that no data loss occurs if a host fails.

    Recommend which type of storage and host caching to configure for
    the new data disk. Select the appropriate options.
  choices:
    Storage type:
      - Premium SSD that uses locally-redundant storage (LRS)
      - Premium SSD that uses zone-redundant storage (ZRS)
      - Standard SSD that uses locally-redundant storage (LRS)
      - Standard SSD that uses zone-redundant storage (ZRS)
    Host caching:
      - None
      - Read-only
      - Read/Write
  answer:
    Storage type: Premium SSD that uses zone-redundant storage (ZRS)
    Host caching: Read-only
  user_answer:
    Storage type: Standard SSD that uses zone-redundant storage (ZRS)
    Host caching: Read/Write
  user_result: incorrect
  learning_note: |
    ZRS was the correct redundancy choice, but Premium SSD supplies the
    performance required among the listed options. Read-only caching
    accelerates reads without keeping unpersisted writes in the host cache.
    Premium StorageV2 page-blob accounts and Premium SSD managed disks
    have different ZRS support; Premium SSD v2 is another distinct disk type.
  explanation: |
    Correct selections: **Premium SSD with ZRS; Read-only host caching.**
    Neither complete attempted selection is correct, although the ZRS
    component of the storage choice is correct.

    ZRS synchronously replicates managed-disk data across availability
    zones, providing resilience to a datacenter or zone outage. LRS keeps
    replicas within a single datacenter and does not meet that requirement.
    Among the listed SSD choices, Premium SSD supplies the higher
    performance needed by the question rather than Standard SSD.

    Read-only host caching accelerates reads using host memory and local
    SSD while writes go to the persistent disk. Read-only describes the
    cache mode, not a prohibition on writing to the data disk. Losing the
    read cache on host failure does not lose the persistent disk data.

    Read/Write caching can acknowledge writes while they are still in the
    host cache. Without appropriate application flush and persistence
    handling, a host failure can lose those writes. It is therefore not
    the safe choice for this question's unconditional host-failure
    durability requirement. None avoids host write caching but sacrifices
    the read-cache performance benefit. Application or operating-system
    buffers still need proper persistence handling regardless of disk mode.

    The 1-TB disk is below the size limit for Premium SSD host caching.
    Actual performance also depends on VM limits and workload behavior;
    this is the best combination among the listed options, not a promise
    that every workload obtains the lowest possible latency.

    Distinguish these similarly named resources:

    - Premium StorageV2 storage account for page blobs: LRS only in the
      documented storage-account configuration table.
    - Premium SSD managed disk: supports LRS and ZRS.
    - Premium SSD v2 managed disk: does not support ZRS or host caching.

    Thus, remembering that a premium page-blob storage account lacks ZRS
    does not rule out a Premium SSD ZRS managed disk. ZRS protects disk
    data; recovery of an affected VM or application remains a separate task.

    Remember: Premium = performance; ZRS = zone resilience; Read-only
    caching = faster reads without host-cached writes.

    [Microsoft Learn: Managed disk redundancy options](https://learn.microsoft.com/en-us/azure/virtual-machines/disks-redundancy)
    [Microsoft Learn: Premium storage performance and caching](https://learn.microsoft.com/en-us/azure/virtual-machines/premium-storage-performance)
    [Microsoft Learn: Storage account configuration types](https://learn.microsoft.com/en-us/azure/storage/common/storage-account-create)
    [Microsoft Learn: Premium SSD v2 limitations](https://learn.microsoft.com/en-us/azure/virtual-machines/disks-deploy-premium-v2)
- id: '079'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  tags:
    - "exam topic: Deploy and manage Azure compute resources"
    - Azure Disk Encryption
    - Azure Key Vault
    - Encryption at host
    - Customer-managed keys
    - Disk export
  question: |
    You have an Azure subscription that contains a virtual machine named VM1
    and an Azure key vault named KV1.

    You need to configure encryption for VM1. The solution must meet the
    following requirements:

    - Store and use the encryption key in KV1.
    - Maintain encryption if VM1 is downloaded from Azure.
    - Encrypt both the operating system disk and the data disks.

    Which encryption method should you use?
  choices:
    A: customer-managed keys
    B: Confidential disk encryption
    C: Azure Disk Encryption
    D: encryption at host
  answer: C
  user_answer: C
  user_result: correct
  learning_note: |
    Encryption that must persist in downloaded disk images requires volume
    encryption inside the guest OS. Azure Disk Encryption supports both OS
    and data disks and integrates with Key Vault for encryption keys and secrets.
  explanation: |
    Correct answer: **C — Azure Disk Encryption (ADE).** The attempted answer
    is correct.

    ADE encrypts volumes inside the VM using BitLocker on Windows or dm-crypt
    on Linux. It integrates with Azure Key Vault to manage encryption keys
    and secrets and supports encryption of both OS and data disks. Because
    the volumes themselves are encrypted, downloaded disk images retain
    that encryption and require the appropriate keys to unlock them.

    The decisive clue is maintaining encryption after downloading the VM's
    disks from Azure, rather than protecting them only within Azure's storage
    and host infrastructure.

    Why the other options are wrong:

    - A: Customer-managed keys describe key ownership, not a standalone guest
      volume encryption method. Server-side managed disk encryption with
      customer-managed keys can use Key Vault, but its Azure storage encryption
      layer does not persist in exported disk images.
    - B: Confidential disk encryption protects the OS disk of a confidential
      VM; it does not by itself meet the requirement to encrypt the data disks.
    - D: Encryption at host protects data through Azure's host infrastructure,
      including disk caches and temporary disks. That host encryption layer
      does not remain in a downloaded disk image.

    Remember: Remain encrypted after download → guest volume encryption → ADE.

    [Microsoft Learn: Azure Disk Encryption for Windows VMs](https://learn.microsoft.com/en-us/azure/virtual-machines/windows/disk-encryption-overview)
    [Microsoft Learn: Managed disk encryption options](https://learn.microsoft.com/en-us/azure/virtual-machines/disk-encryption-overview)
- id: '080'
  skill: Implement and manage storage
  sub-skill: Configure access to storage
  tags:
    - "exam topic: Implement and manage storage"
    - Shared access signatures
    - Account SAS
    - Blob downloads
    - Blob index tags
  question: |
    HOTSPOT

    You have an Azure subscription that contains a storage account named storage1.

    You need to configure a shared access signature (SAS) to ensure that
    users can only download blobs securely by name.

    Which two settings should you configure? Select the appropriate
    settings in the answer area. Each correct answer is worth one point.

    In the exhibit, Blob is already selected under Allowed services.
    All resource-type and permission checkboxes are initially unchecked.
  choices:
    Allowed resource types:
      - Service
      - Container
      - Object
    Allowed permissions:
      - Read
      - Write
      - Delete
      - List
      - Add
      - Create
      - Update
      - Process
      - Immutable storage
      - Permanent delete
    Blob versioning permissions:
      - Enables deletion of versions
    Allowed blob index permissions:
      - Read/Write
      - Filter
  answer:
    Allowed resource types: Object
    Allowed permissions: Read
  user_answer:
    Allowed permissions: Read
    Allowed blob index permissions: Filter
  user_result: partially_correct
  learning_note: |
    Downloading a known blob requires the Object resource type and Read
    permission. Filter permits searching by blob index tags, not downloading
    by name. Omit List and Filter to avoid granting enumeration or tag search.
  explanation: |
    Correct settings: **Allowed resource types: Object; Allowed permissions:
    Read.** The attempted Read selection is correct; replace Filter with Object.

    The Blob service is already selected. An account SAS must additionally
    permit the resource type and operation being requested. Get Blob is an
    object-level operation requiring Read permission. Object plus Read
    therefore allows a user to download a blob using its known name or URL.

    Leave List unchecked: listing blobs requires Container resource access
    and List permission, which are unnecessary for downloading by name.
    Service and Container resource types are not needed for Get Blob.
    Write, Create, Delete, and other modifying permissions exceed the
    download-only requirement.

    Filter permits Find Blobs by Tags operations. It does not identify a
    blob by its ordinary name and is not required to download its contents.
    The blob index Read/Write setting concerns reading and changing tags,
    rather than reading or writing the blob's content. Version deletion
    permissions are also unnecessary.

    To require encrypted transport, configure HTTPS only in the allowed
    protocols setting. That control is outside the visible answer area;
    the two settings being tested here are Object and Read. These selections
    alone do not enforce HTTPS if the protocol restriction is omitted.

    An account SAS with Blob, Object, and Read is not scoped to one specific
    blob name: it can read authorized blob objects across the account when
    their URLs are known. To restrict access to a particular blob, use an
    appropriately scoped blob service SAS or user delegation SAS instead.

    Remember: Known blob name → Object + Read; discover names → List;
    search tags → Filter.

    [Microsoft Learn: Create an account SAS](https://learn.microsoft.com/en-us/rest/api/storageservices/create-account-sas)
    [Microsoft Learn: Get Blob authorization](https://learn.microsoft.com/en-us/rest/api/storageservices/get-blob)
    [Microsoft Learn: Manage and find blobs using index tags](https://learn.microsoft.com/en-us/azure/storage/blobs/storage-manage-find-blobs)
- id: '081'
  skill: Implement and manage storage
  sub-skill: Configure access to storage
  tags:
    - "exam topic: Implement and manage storage"
    - Shared access signatures
    - Container-scoped access
    - Storage account access keys
    - Secure transfer
    - must-review
  question: |
    You have an Azure subscription that contains a storage account named
    storage1. The account contains a container named container1.

    You need to configure access to container1. The solution must meet
    the following requirements:

    - Only allow read access.
    - Allow both HTTP and HTTPS protocols.
    - Apply access permissions to all the content in the container.

    What should you use?
  choices:
    A: an access policy
    B: a shared access signature (SAS)
    C: Azure Content Delivery Network (CDN)
    D: access keys
  answer: B
  user_answer: D
  user_result: incorrect
  learning_note: |
    Account keys grant full account-data access and cannot be restricted
    to read-only access to one container. A container-scoped SAS can specify
    Read permission and allow HTTP plus HTTPS. The account's Secure transfer
    required setting must also permit HTTP; SAS cannot override it.
  explanation: |
    Correct answer: **B — a shared access signature (SAS).** The attempted
    answer D grants more access than the requirements allow.

    Create a SAS scoped to container1 with Read permission and both
    HTTP and HTTPS allowed. For a container service SAS, the relevant
    fields are sr=c (container), sp=r (Read), and spr=https,http (both
    protocols). Container scope applies the granted read permission to
    the blobs within that container rather than to just one named blob.
    List permission is separate and is not required merely to read blobs.

    Why the other options are wrong:

    - A: A stored access policy can define permissions and validity times
      for associated service SAS tokens and help revoke them. It is not
      an access credential by itself, and protocol restrictions are set
      on the SAS rather than in the stored access policy.
    - C: CDN provides content delivery and caching. It does not provide
      the requested scoped storage authorization credential.
    - D: Storage account access keys grant full access to account data,
      including write and delete operations. They cannot be restricted
      to read-only access to container1.

    Allowing HTTP in the SAS does not override the account's Secure
    transfer required setting. To meet the stated HTTP requirement, that
    account setting must be disabled. In normal deployments HTTPS-only
    access is preferable, but this question explicitly requires both.

    SAS is a credential for the delegated access path, not a global rule
    that prevents other authorized identities or account-key holders from
    writing. The intended requirement is to provide these users read-only
    access through the issued SAS.

    Remember: Account key → full account-data access; SAS → scoped,
    restricted permissions and protocol choices.

    [Microsoft Learn: Create a service SAS](https://learn.microsoft.com/en-us/rest/api/storageservices/create-service-sas)
    [Microsoft Learn: Manage storage account access keys](https://learn.microsoft.com/en-us/azure/storage/common/storage-account-keys-manage)
    [Microsoft Learn: Require secure transfer](https://learn.microsoft.com/en-us/azure/storage/common/storage-require-secure-transfer)
- id: '082'
  skill: Implement and manage storage
  sub-skill: Configure and manage storage accounts
  tags:
    - "exam topic: Implement and manage storage"
    - Azure Data Lake Storage
    - Hierarchical namespace
    - Access tiers
    - Geo-redundant storage
  question: |
    You need to create an Azure Storage account named storage1. The solution
    must meet the following requirements:

    - Support Azure Data Lake Storage.
    - Minimize costs for infrequently accessed data.
    - Automatically replicate data to a secondary Azure region.

    Which three options should you configure for storage1?
    Each correct answer presents part of the solution.
    Each correct selection is worth one point.
  choices:
    A: zone-redundant storage (ZRS)
    B: the Cool access tier
    C: geo-redundant storage (GRS)
    D: the Hot access tier
    E: hierarchical namespace
  answer: BCE
  user_answer: BCE
  user_result: correct
  explanation: |
    Correct answer: **B, C, and E — Cool access tier, GRS, and hierarchical
    namespace.** All three attempted selections are correct.

    Enable hierarchical namespace to unlock Azure Data Lake Storage
    capabilities, including real directories and file-system semantics
    useful for analytics workloads. A standard general-purpose v2 account
    supports the combination of hierarchical namespace, Cool, and GRS.

    Choose Cool for infrequently accessed data. It has lower storage
    capacity costs than Hot, with higher access and transaction costs.
    This is the cost-appropriate tier among the listed choices; actual
    total costs also depend on access frequency and retention behavior.

    Choose GRS to automatically copy data asynchronously to a secondary
    Azure region. Replication across regions is asynchronous, so this
    choice does not guarantee zero data loss during a regional failure.
    Ordinary GRS also does not provide direct secondary-region reads
    before failover; that requires the read-access variant when needed.

    Why the other options are wrong:

    - A: ZRS replicates across availability zones within the same region.
      It does not replicate data to a secondary region.
    - D: Hot is intended for frequently accessed data and has higher
      storage capacity costs than Cool, contrary to the stated workload.

    Remember: Data Lake → hierarchical namespace; infrequent access →
    Cool; secondary region replication → GRS.

    [Microsoft Learn: Data Lake Storage hierarchical namespace](https://learn.microsoft.com/en-us/azure/storage/blobs/data-lake-storage-namespace)
    [Microsoft Learn: Blob access tiers](https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview)
    [Microsoft Learn: Storage redundancy](https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy)
- id: '083'
  skill: Implement and manage storage
  sub-skill: Configure Azure Files and Azure Blob Storage
  tags:
    - "exam topic: Implement and manage storage"
    - Blob lifecycle management
    - Blob versioning
    - Blob snapshots
    - Access tiers
    - Rehydration
  question: |
    HOTSPOT

    You have an Azure Storage account named storage1 that contains two
    containers named container1 and container2. Blob versioning is enabled
    for both containers.

    You periodically take blob snapshots of critical blobs.

    You create the following lifecycle management policy:

    ```json
    {
      "rules": [
        {
          "enabled": true,
          "name": "rule1",
          "type": "Lifecycle",
          "definition": {
            "actions": {
              "version": {
                "tierToCool": {
                  "daysAfterCreationGreaterThan": 15
                },
                "tierToArchive": {
                  "daysAfterLastTierChangeGreaterThan": 7,
                  "daysAfterCreationGreaterThan": 30
                }
              }
            },
            "filters": {
              "blobTypes": ["blockBlob"],
              "prefixMatch": ["container1/"]
            }
          }
        }
      ]
    }
    ```

    For each statement, select Yes if the statement is true. Otherwise,
    select No. Each correct selection is worth one point.
  choices:
    A blob snapshot automatically moves to the Cool access tier after 15 days.:
      - 'Yes'
      - 'No'
    A blob version in container2 automatically moves to the Archive access tier after 30 days.:
      - 'Yes'
      - 'No'
    A rehydrated version automatically moves to the Archive access tier after 30 days.:
      - 'Yes'
      - 'No'
  answer:
    A blob snapshot automatically moves to the Cool access tier after 15 days.: 'No'
    A blob version in container2 automatically moves to the Archive access tier after 30 days.: 'No'
    A rehydrated version automatically moves to the Archive access tier after 30 days.: 'No'
  user_answer:
    A blob snapshot automatically moves to the Cool access tier after 15 days.: 'No'
    A blob version in container2 automatically moves to the Archive access tier after 30 days.: 'No'
    A rehydrated version automatically moves to the Archive access tier after 30 days.: 'No'
  user_result: correct
  user_reasoning: |
    Selected No for the snapshot because the rule targets versions, and No
    for container2 because the rule applies only to container1. Also selected
    No for the rehydrated version, without providing a reason for that selection.
  learning_note: |
    Read lifecycle policies by target object, prefix filter, and time conditions.
    Rehydration does not reset creation time. The archive action requires both
    creation age greater than 30 days and time since last tier change greater
    than 7 days; it does not establish a 30-day delay after rehydration.
  explanation: |
    Correct selections: **No, No, No**, interpreting the third statement's
    30-day period as time after rehydration. All attempted selections are correct
    under that interpretation; the third statement is loosely worded.

    1. Snapshot to Cool after 15 days — No. The actions are under version,
       which targets previous blob versions. There is no snapshot action.
       Versions and snapshots are separate lifecycle policy targets.
    2. Version in container2 to Archive after 30 days — No. The prefixMatch
       filter is container1/, so blobs in container2 are excluded.
    3. Rehydrated version to Archive after 30 days — No. The rule does not
       specify a 30-day delay after rehydration. A matching previous version
       in container1 is eligible for rearchiving when BOTH its creation age
       exceeds 30 days and its time since the last tier change exceeds 7 days.
       Rehydration changes the tier-change time but does not reset creation time.

    For example, a 60-day-old matching version rehydrated today can become
    eligible for Archive after more than 7 days, rather than waiting another
    30 days. Lifecycle processing is asynchronous, so eligibility does not
    guarantee an action at an exact day or time.

    Wording caveat: If the third statement merely means that a qualifying
    version will be archived by 30 days after rehydration, No is not an
    unconditional conclusion; it could already have been rearchived earlier.
    The intended distinction is between creation age and time since rehydration.

    Remember: version is not snapshot; container1/ excludes container2;
    archive eligibility uses creation age > 30 AND last tier change age > 7.

    [Microsoft Learn: Blob lifecycle management policy structure](https://learn.microsoft.com/en-us/azure/storage/blobs/lifecycle-management-policy-structure)
- id: '084'
  skill: Implement and manage storage
  sub-skill: Configure and manage storage accounts
  tags:
    - "exam topic: Implement and manage storage"
    - Storage redundancy
    - Zone-redundant storage
    - Redundancy conversion
    - Storage account kinds
  question: |
    You have an Azure subscription that contains the storage accounts shown
    in the following table.

    | Name | Kind | Performance | Replication | Access tier |
    |------|------|-------------|-------------|-------------|
    | storage1 | Storage (general purpose v1) | Premium | Locally-redundant storage (LRS) | Not applicable |
    | storage2 | StorageV2 (general purpose v2) | Standard | Locally-redundant storage (LRS) | Cool |
    | storage3 | StorageV2 (general purpose v2) | Standard | Read-access geo-redundant storage (RA-GRS) | Hot |
    | storage4 | BlobStorage | Premium | Locally-redundant storage (LRS) | Hot |

    Which storage account can be converted to zone-redundant storage (ZRS)
    replication?
  choices:
    A: storage1
    B: storage2
    C: storage3
    D: storage4
  answer: B
  user_answer: B
  user_result: correct
  learning_note: |
    Standard StorageV2 with LRS supports conversion to ZRS in a supported
    region. RA-GRS requires an intermediate change to LRS before conversion
    to ZRS. Distinguish legacy BlobStorage from premium BlockBlobStorage.
  explanation: |
    Intended answer: **B — storage2.** The attempted answer is correct under
    the question's implied requirement to convert from the configuration
    shown without an intermediate redundancy change.

    storage2 is a standard general-purpose v2 account using LRS. It supports
    conversion to ZRS, assuming the region supports ZRS and other conversion
    prerequisites are satisfied. The Cool access tier does not prevent this
    conversion; Archive-tier blobs would be a relevant restriction.

    Why the other options are not the intended answer:

    - A: storage1 is a premium general-purpose v1 account, which does not
      support ZRS.
    - C: storage3 uses RA-GRS. To reach ZRS, first switch it to LRS and then
      perform the conversion to ZRS. It cannot take the same direct LRS-to-ZRS
      conversion path as storage2 from the configuration shown.
    - D: Legacy BlobStorage does not support ZRS. Premium block blob accounts
      use the distinct kind BlockBlobStorage, which does support ZRS.

    Wording caveat: Under current rules, storage3 can ultimately reach ZRS
    through RA-GRS → LRS → ZRS, so the unqualified phrase "can be converted"
    makes the question ambiguous if intermediate changes are allowed. B is
    the intended single answer rather than a claim that storage3 can never
    use ZRS.

    Exhibit caveat: The table pairs legacy BlobStorage with Premium performance,
    which is not a valid account-kind/performance combination. The table is
    preserved as supplied rather than silently changed to BlockBlobStorage.

    Remember: Standard GPv2 + LRS → ZRS; RA-GRS → LRS first.

    [Microsoft Learn: Change how a storage account is replicated](https://learn.microsoft.com/en-us/azure/storage/common/redundancy-migration)
    [Microsoft Learn: Storage account overview](https://learn.microsoft.com/en-us/azure/storage/common/storage-account-overview)
- id: '085'
  skill: Implement and manage storage
  sub-skill: Configure and manage storage accounts
  tags:
    - "exam topic: Implement and manage storage"
    - Azure Storage Explorer
    - Supported operating systems
  question: |
    You have an Azure subscription that contains the devices shown in
    the following table.

    | Name | Platform |
    |------|----------|
    | Device1 | Windows |
    | Device2 | Ubuntu Linux |
    | Device3 | macOS |
    | Device4 | Android |

    On which devices can you install Azure Storage Explorer?
  choices:
    A: Device1 only
    B: Device1 and Device2 only
    C: Device1 and Device3 only
    D: Device1, Device2, and Device3 only
    E: Device1, Device3, and Device4 only
  answer: D
  user_answer: D
  user_result: correct
  explanation: |
    Correct answer: **D — Device1, Device2, and Device3 only.** The attempted
    answer is correct.

    Azure Storage Explorer is a standalone desktop application supported
    on Windows, Linux (including Ubuntu), and macOS. Therefore, it can
    be installed on Device1, Device2, and Device3, assuming their operating
    system versions and dependencies meet the release requirements.
    Android is not a supported installation platform, so Device4 is excluded.

    Why the other options are wrong:

    - A: Omits supported Ubuntu Linux and macOS devices.
    - B: Omits supported macOS.
    - C: Omits supported Ubuntu Linux.
    - E: Includes unsupported Android and omits Ubuntu Linux.

    Do not confuse the installed Storage Explorer desktop application with
    browser-based storage management in the Azure portal. Storage Explorer
    and AzCopy both support Windows, Linux, and macOS, although one is a
    graphical desktop application and the other is a command-line utility.

    Remember: Storage Explorer → Windows + Linux + macOS; not Android.

    [Microsoft Learn: Get started with Storage Explorer](https://learn.microsoft.com/en-us/azure/storage/storage-explorer/vs-azure-tools-storage-manage-with-storage-explorer)
- id: '086'
  skill: Implement and manage storage
  sub-skill: Configure and manage storage accounts
  tags:
    - "exam topic: Implement and manage storage"
    - Locally redundant storage
    - Storage redundancy
    - Blob access tiers
    - Storage costs
  question: |
    HOTSPOT

    You have an Azure subscription.

    You plan to create the Azure Storage account as shown in the following exhibit.

    | Section | Setting | Value |
    |---------|---------|-------|
    | Basics | Subscription | Subscription1 |
    | Basics | Resource group | RG1 |
    | Basics | Location | (Europe) North Europe |
    | Basics | Storage account name | storage16852 |
    | Basics | Deployment model | Resource manager |
    | Basics | Account kind | StorageV2 (general purpose v2) |
    | Basics | Replication | Locally-redundant storage (LRS) |
    | Basics | Performance | Standard |
    | Basics | Access tier (default) | Hot |
    | Networking | Connectivity method | Private endpoint |
    | Networking | Private Endpoint | (New) StorageEndpoint1 (blob) (privatelink.blob.core.windows.net) |
    | Advanced | Secure transfer required | Enabled |
    | Advanced | Large file shares | Disabled |
    | Advanced | Blob soft delete | Disabled |
    | Advanced | Blob change feed | Disabled |
    | Advanced | Hierarchical namespace | Disabled |
    | Advanced | NFS v3 | Disabled |

    Select the answer choice that completes each statement.
    Each correct selection is worth one point.

    1. The minimum number of copies of the storage account will be [answer choice].
    2. To reduce the cost of infrequently accessed data in the storage account,
       you must modify the [answer choice] setting.
  choices:
    The minimum number of copies of the storage account:
      - '1'
      - '2'
      - '3'
      - '4'
    To reduce the cost of infrequently accessed data:
      - Access tier (default)
      - Performance
      - Account kind
      - Replication
  answer:
    The minimum number of copies of the storage account: '3'
    To reduce the cost of infrequently accessed data: Access tier (default)
  user_answer:
    The minimum number of copies of the storage account: '3'
    To reduce the cost of infrequently accessed data: Access tier (default)
  user_result: correct
  user_reasoning: Selected three copies because the account uses LRS; selected access tier for reducing the cost of infrequently accessed data.
  learning_note: |
    LRS maintains three data copies within one datacenter in the primary region.
    Access tier controls the storage-versus-access cost tradeoff for blob data;
    replication controls redundancy and resilience.
  explanation: |
    Correct selections: **3; Access tier (default).** Both attempted selections
    are correct, and the reasoning for the LRS copy count is sound.

    LRS synchronously maintains three copies of the data within a single
    physical datacenter in the primary region. The private endpoint controls
    network access and does not change the replication copy count. The question
    refers to copies of the stored data, rather than three separate account
    resources.

    To reduce storage costs for infrequently accessed blob data, change the
    default access tier from Hot to Cool. Cool offers lower storage costs
    but higher access costs, making it appropriate for infrequently accessed
    data. The account default applies to blobs without an explicitly assigned
    tier; changing it does not override an explicitly assigned blob tier.

    Why the other second-dropdown options are not the answer:

    - Performance selects Standard or Premium performance, not access frequency.
    - Account kind selects the account's capabilities; this account is already
      general-purpose v2 and supports blob access tiers.
    - Replication controls redundancy. The account already uses LRS, the
      lowest-cost redundancy option; it does not select Hot versus Cool.

    The exhibit preserves older Azure portal labels. The default blob access
    tier concerns Blob Storage, not a universal access tier for Files, Tables,
    and Queues.

    Remember: Replication → resilience and copy count; access tier → storage
    and access costs.

    [Microsoft documentation: Azure storage redundancy offerings](https://techcommunity.microsoft.com/blog/azurestorageblog/understanding-azure-storage-redundancy-offerings/1431700)
    [Microsoft Learn: Access tiers for blob data](https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview/)
- id: '087'
  skill: Implement and manage storage
  sub-skill: Configure Azure Files and Azure Blob Storage
  tags:
    - "exam topic: Implement and manage storage"
    - Blob inventory
    - Block blobs
    - Prefix filters
    - ARM templates
  question: |
    HOTSPOT

    You have an Azure Storage account named storage1 that contains a container
    named container1. The container1 container stores thousands of image files.

    You plan to use an Azure Resource Manager (ARM) template to create a blob
    inventory rule named rule1.

    You need to ensure that only blobs whose names start with the word finance
    are stored daily as a CSV file in container1.

    How should you complete rule1? Each correct selection is worth one point.

    The answer area shows the following rule fragment (placeholders represent
    the two dropdowns; the remaining values are preserved from the exhibit):

    ```json
    {
      "definition": {
        "filters": {
          "blobTypes": "[answer choice]",
          "includeBlobVersions": true,
          "includeSnapshots": true,
          "prefixMatch": "[answer choice]"
        },
        "format": "string",
        "objectType": "blob",
        "schedule": "daily",
        "schemaFields": ["Name"]
      },
      "destination": "CSV",
      "enabled": true,
      "name": "rule1"
    }
    ```
  choices:
    blobTypes:
      - appendBlob
      - blockBlob
      - pageBlob
    prefixMatch:
      - container1/*
      - container1/finance
      - finance
  answer:
    blobTypes: blockBlob
    prefixMatch: container1/finance
  user_answer:
    blobTypes: blockBlob
    prefixMatch: container1/finance
  user_result: correct
  learning_note: |
    Inventory prefix filters include the container name: container1/finance
    matches blob names starting with finance in container1. Inventory reports
    list blob properties; they do not copy image contents into CSV.
  explanation: |
    Correct selections: **blockBlob; container1/finance.** Both attempted
    selections are correct.

    Image files typically use block blobs. The blobTypes filter selects the
    source blobs included in the inventory, rather than determining the
    report format. Append blobs suit append-only logs, while page blobs suit
    random-access workloads such as virtual disks.

    The prefix includes the container name followed by the beginning of the
    blob name. container1/finance matches finance2026.jpg and finance/report.png
    in container1, but not reports/finance.jpg. Prefix matching is case-sensitive.
    The finance option alone targets a container-name prefix rather than blob
    names in container1. The asterisk in container1/* is not a wildcard.

    Exhibit correction: The non-dropdown output settings are inconsistent with
    the requirement. A usable rule must set format to csv and destination to
    container1, not format to string and destination to CSV. The blobTypes and
    prefixMatch fields must be arrays of strings in the actual ARM definition:

    ```json
    {
      "definition": {
        "filters": {
          "blobTypes": ["blockBlob"],
          "includeBlobVersions": true,
          "includeSnapshots": true,
          "prefixMatch": ["container1/finance"]
        },
        "format": "csv",
        "objectType": "blob",
        "schedule": "daily",
        "schemaFields": ["Name"]
      },
      "destination": "container1",
      "enabled": true,
      "name": "rule1"
    }
    ```

    The rule generates a daily CSV inventory report listing matching blob
    names, including matching versions and snapshots because those flags
    are enabled. It does not convert the image contents into CSV.

    Remember: Images → blockBlob; inventory prefix → container/blob-name-prefix.

    [Microsoft Learn: Azure Storage blob inventory](https://learn.microsoft.com/en-us/azure/storage/blobs/blob-inventory)
- id: '088'
  skill: Implement and manage storage
  sub-skill: Configure access to storage
  tags:
    - "exam topic: Implement and manage storage"
    - Shared access signatures
    - Account SAS versus container SAS
    - Least privilege
    - Ambiguous question
  question: |
    HOTSPOT

    You have an Azure subscription that contains a storage account named
    storage1. The account contains blobs in a container named container1.

    You plan to share access to storage1.

    You need to generate a shared access signature (SAS). The solution
    must meet the following requirements:

    - Ensure that the SAS can only be used to enumerate and download
      blobs stored in container1.
    - Use the principle of least privilege.

    Which three settings should you enable? Select the appropriate
    settings in the answer area.

    In the exhibit, Blob is already selected under Allowed services.
    All resource-type and permission checkboxes are initially unchecked.
  choices:
    Allowed resource types:
      - Service
      - Container
      - Object
    Allowed permissions:
      - Read
      - Write
      - Delete
      - List
      - Add
      - Create
      - Update
      - Process
      - Immutable storage
      - Permanent delete
    Blob versioning permissions:
      - Enables deletion of versions
    Allowed blob index permissions:
      - Read/Write
      - Filter
  answer:
    Allowed resource types:
      - Container
      - Object
    Allowed permissions:
      - Read
      - List
  user_answer:
    Allowed resource types:
      - Container
    Allowed permissions:
      - Read
      - List
  user_result: partially_correct
  learning_note: |
    In an account SAS, Container plus List enables listing blobs, while
    Object plus Read enables downloading their contents. The Container
    resource-type checkbox does not restrict the token to container1.
    This exhibit needs four checkboxes, despite asking for three; use a
    container-scoped service or user delegation SAS to meet the actual scope.
  explanation: |
    Verified settings for the displayed account SAS form: **Container,
    Object, Read, and List**, with Blob already selected. The attempted
    selections are all needed but omit Object, so downloads would fail.

    This question is inconsistent. It asks for three settings, but the
    displayed account SAS form requires four checkboxes for both operations:

    - List Blobs requires the Container resource type and List permission.
    - Get Blob requires the Object resource type and Read permission.

    Container plus Read permits certain container-level reads, such as
    reading container metadata; it does not authorize downloading blob
    contents without Object. Leave Service unchecked because account-level
    operations such as listing containers are unnecessary. Write, Delete,
    tag Filter, and other modifying or discovery permissions are unnecessary.

    There is also a scope mismatch: an account SAS cannot be restricted
    to a specific container name. The Container checkbox selects a class
    of operations across the account, not container1 as an individual
    resource. The recorded answer describes the minimum checkboxes needed
    for listing and downloading in the exhibit; it does not fully satisfy
    the requirement to limit access to container1.

    To meet the actual requirement, generate a container-scoped service
    SAS or user delegation SAS for container1 with Read and List permissions.
    For a container service SAS, sr=c identifies the signed container resource
    and sp=rl grants read and list access to its contents. Unlike srt=c in
    an account SAS, this container scope also covers reading its blobs.

    Do not force a three-checkbox answer that contradicts the documented
    operation requirements. Treat this as a flawed exhibit or selection count.

    Remember: Account SAS list → Container + List; download → Object + Read.
    Restrict to one named container → container-scoped SAS.

    [Microsoft Learn: Account SAS operation permissions](https://learn.microsoft.com/en-us/rest/api/storageservices/create-account-sas)
    [Microsoft Learn: Service SAS resource scope](https://learn.microsoft.com/en-us/rest/api/storageservices/create-service-sas)
    [Microsoft Learn: List Blobs authorization](https://learn.microsoft.com/en-us/rest/api/storageservices/list-blobs)
    [Microsoft Learn: Get Blob authorization](https://learn.microsoft.com/en-us/rest/api/storageservices/get-blob)
- id: '089'
  skill: Implement and manage storage
  sub-skill: Configure Azure Files and Azure Blob Storage
  tags:
    - "exam topic: Implement and manage storage"
    - Blob lifecycle management
    - Prefix filters
    - Access tiers
    - Blob deletion
    - must-review
  question: |
    HOTSPOT

    You have an Azure subscription. The subscription contains a storage account
    named storage1 that has the lifecycle management rules shown in the
    following table.

    | Name | Blob prefix | If base blob was last modified more than (days ago) | Then |
    |------|-------------|----------------------------------------------------|------|
    | Rule1 | container1/ | 3 days | Move to archive storage |
    | Rule2 | Not applicable | 5 days | Move to cool storage |
    | Rule3 | container2/ | 10 days | Delete the blob |
    | Rule4 | container2/ | 15 days | Move to archive storage |

    On June 1, you store two blobs in storage1 as shown in the following table.

    | Name | Location | Access tier |
    |------|----------|-------------|
    | File1 | container1 | Hot |
    | File2 | container2 | Hot |

    For each statement, select Yes if the statement is true. Otherwise,
    select No. Each correct selection is worth one point.
  choices:
    On June 6, File1 will be stored in the Cool access tier.:
      - 'Yes'
      - 'No'
    On June 7, File2 will be stored in the Cool access tier.:
      - 'Yes'
      - 'No'
    On June 16, File2 will be stored in the Archive access tier.:
      - 'Yes'
      - 'No'
  answer:
    On June 6, File1 will be stored in the Cool access tier.: 'No'
    On June 7, File2 will be stored in the Cool access tier.: 'Yes'
    On June 16, File2 will be stored in the Archive access tier.: 'No'
  user_answer:
    On June 6, File1 will be stored in the Cool access tier.: 'No'
    On June 7, File2 will be stored in the Cool access tier.: 'No'
    On June 16, File2 will be stored in the Archive access tier.: 'No'
  user_result: partially_correct
  user_reasoning: |
    Believed File1 would be in Archive on June 6, File2 would still be in Hot
    on June 7, and File2 would be deleted on June 16 because deletion is cheaper.
  learning_note: |
    A lifecycle rule without a prefix filter applies across the storage account,
    including container2. Deletion is an action, not a tier. When eligible
    actions overlap, Delete takes precedence over Archive, which takes
    precedence over Cool.
  explanation: |
    Correct selections: **No, Yes, No.** The first and third attempted
    selections are correct; the second selection needs correction.

    1. June 6, File1 in Cool — No. Rule1 applies to container1 and moves File1
       to Archive once its last-modified age exceeds 3 days. Rule2 does not
       rehydrate an archived blob to Cool; lifecycle tiering cannot perform
       an Archive-to-Cool transition.
    2. June 7, File2 in Cool — Yes. Rule2's prefix is Not applicable, meaning
       no prefix restriction. It applies to blobs in both containers. File2
       is more than 5 days old on June 7, so it qualifies for Cool. The
       deletion and archive thresholds for container2 have not yet been met.
    3. June 16, File2 in Archive — No. Rule3 makes File2 eligible for deletion
       after more than 10 days, before Rule4's archive threshold. Under normal
       lifecycle processing, File2 has been deleted rather than archived.
       If multiple actions are eligible together, deletion takes precedence.

    The learner correctly identified Archive for File1 and deletion for File2,
    but overlooked the account-wide scope of Rule2. Deletion is not a cheaper
    access tier; it is the least expensive lifecycle action. For the listed
    actions, the precedence is Delete → Archive → Cool.

    These are the expected exam outcomes, assuming no further modifications
    and normal policy processing. Lifecycle execution is asynchronous, so
    eligibility does not guarantee an operation at an exact date or time.

    Remember: No prefix filter → all matching blobs in the account.
    Overlapping eligible actions → Delete before Archive before Cool.

    [Microsoft Learn: Blob lifecycle management policy structure](https://learn.microsoft.com/en-us/azure/storage/blobs/lifecycle-management-policy-structure)
    [Microsoft Learn: Lifecycle management overview](https://learn.microsoft.com/en-us/azure/storage/blobs/lifecycle-management-overview)
- id: '090'
  skill: Implement and manage storage
  sub-skill: Configure access to storage
  tags:
    - must-review
    - "exam topic: Implement and manage storage"
    - Azure RBAC
    - Management plane versus data plane
    - Shared Key authorization
    - Azure Files
    - Blob access
  question: |
    HOTSPOT

    You have an Azure subscription. The subscription contains a storage account
    named contoso2024 that contains the resources shown in the following table.

    | Name | Type | Contents |
    |------|------|----------|
    | container1 | Blob container | File1 |
    | share1 | Azure Files share | File2 |

    You have users that have permissions for contoso2024 as shown in the
    following table.

    | Name | Permission |
    |------|------------|
    | User1 | Reader role |
    | User2 | Storage Account Contributor role |
    | User3 | Has an access key for contoso2024 |

    The contoso2024 account is configured as shown in the following exhibit.

    | Setting | Value |
    |---------|-------|
    | Account kind | StorageV2 (general purpose v2) |
    | Performance | Standard |
    | Secure transfer required | Enabled |
    | Allow Blob public access | Enabled |
    | Allow storage account key access | Disabled |
    | Allow recommended upper limit for shared access signature (SAS) expiry interval | Disabled |
    | Default to Azure Active Directory authorization in the Azure portal | Disabled |
    | Minimum TLS version | Version 1.2 |
    | Permitted scope for copy operations (preview) | From any storage account |
    | Blob access tier (default) | Hot |
    | Large file shares | Disabled |

    For each statement, select Yes if the statement is true. Otherwise,
    select No. Each correct selection is worth one point.
  choices:
    User1 can read File1.:
      - 'Yes'
      - 'No'
    User2 can read File2.:
      - 'Yes'
      - 'No'
    User3 can read File1 and File2.:
      - 'Yes'
      - 'No'
  answer:
    User1 can read File1.: 'No'
    User2 can read File2.: 'No'
    User3 can read File1 and File2.: 'No'
  user_answer:
    User1 can read File1.: 'Yes'
    User2 can read File2.: 'No'
    User3 can read File1 and File2.: 'Yes'
  user_result: partially_correct
  user_reasoning: |
    Thought Reader might include both account read permissions and Storage Blob
    Data Reader permissions. Selected No for User2 because Storage Account
    Contributor does not directly grant data-plane access. Selected Yes for
    User3 because the user possesses the storage account access key.
  learning_note: |
    Reader does not include Storage Blob Data Reader. Storage Account Contributor
    can retrieve account keys but has no direct data permissions; use of those
    keys depends on Shared Key access being enabled. Possessing an access key
    does not bypass the disabled account-key setting, including for File2 in
    the question's portal/REST access context.
  explanation: |
    Correct selections: **No, No, No.** Only the second attempted selection
    is correct, based on the permissions and configuration shown and without
    changing the account settings.

    1. User1 can read File1 — No. Reader grants management-plane visibility
       into resource properties. It does not include Storage Blob Data Reader
       or permission to read blob contents. A suitable blob data role would
       be needed for Microsoft Entra authorization.
    2. User2 can read File2 — No. Storage Account Contributor has no direct
       file data permissions. Although it includes permission to retrieve
       account keys, the account disables Shared Key authorization, so the
       key-based portal/REST route to File2 is blocked. The role's ability to
       change account configuration is not the same as data access under the
       configuration currently shown.
    3. User3 can read File1 and File2 — No. Possessing an account key does not
       override Allow storage account key access being Disabled. Key-based
       requests cannot read File1 or File2 in the portal/REST context, and no
       other data-access permission is stated for User3.

    Allow Blob public access being Enabled only permits containers to be
    configured for anonymous access. It does not automatically make container1
    public; the question supplies no container-level anonymous access setting.
    Default to Azure Active Directory authorization is a portal preference,
    not an authorization grant or an override of the disabled Shared Key setting.
    Azure Active Directory is now Microsoft Entra ID.

    Remember: Reader is not Data Reader. Retrieving or possessing a key is
    useful only when the applicable service accepts that authorization method.

    [Microsoft Learn: Azure built-in roles for Storage](https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/storage)
    [Microsoft Learn: Prevent Shared Key authorization](https://learn.microsoft.com/en-us/azure/storage/common/shared-key-authorization-prevent)
    [Microsoft Learn: Authorize access to Azure file data in the portal](https://learn.microsoft.com/en-us/azure/storage/files/authorize-data-operations-portal)
