- id: '061'
  skill: Implement and manage storage
  sub-skill: Configure Azure Files and Azure Blob Storage
  tags:
    - "exam topic: Implement and manage storage"
    - Blob lifecycle management
    - Action precedence
    - Blob deletion
  question: |
    You have an Azure subscription that contains a storage account named
    storage1 with the following lifecycle management rules.

    | Name | If base blobs were last modified more than (days) | Then |
    |------|--------------------------------------------------|------|
    | Rule1 | 5 days | Move to cool storage |
    | Rule2 | 5 days | Delete the blob |
    | Rule3 | 5 days | Move to archive storage |

    On June 1, you store a blob named File1 in the Hot access tier of storage1.

    What is the state of File1 on June 7?
  choices:
    A: stored in the Cool access tier
    B: stored in the Archive access tier
    C: stored in the Hot access tier
    D: deleted
  answer: D
  user_answer: D
  user_result: correct
  explanation: |
    Correct answer: **D — deleted.** The attempted answer is correct.

    By June 7, File1 has been unchanged for six days, exceeding the
    five-day threshold shared by all three rules. Each action is eligible.

    When multiple eligible lifecycle actions apply to the same blob,
    Azure chooses the least expensive action. Deletion takes precedence
    over archiving, and archiving takes precedence over moving to Cool.
    Therefore, Rule2 deletes File1. Rule names and the order in which
    the rules are listed do not make Rule1 win.

    Why the other options are wrong:

    - A: The Cool action loses to the eligible deletion action.
    - B: The Archive action also loses to deletion.
    - C: More than five days have elapsed, so leaving the blob in Hot
      does not match the intended result after lifecycle processing.

    This is the expected exam outcome, assuming no further modifications,
    no versions or snapshots blocking deletion, and that lifecycle
    processing has run. Actual execution is asynchronous, rather than
    guaranteed at a specific time on June 7.

    Remember: Among eligible actions, Delete → Archive → Cool.

    [Microsoft Learn: Lifecycle management policy structure](https://learn.microsoft.com/en-us/azure/storage/blobs/lifecycle-management-policy-structure)
- id: '062'
  skill: Implement and manage storage
  sub-skill: Configure Azure Files and Azure Blob Storage
  tags:
