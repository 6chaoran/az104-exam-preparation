    - Storage account failover
  question: |
    HOTSPOT

    You have an Azure AD user named User1 and a read-access geo-redundant
    storage (RA-GRS) account named contoso2023.

    You need to meet the following requirements:

    - User1 must be able to write blob data to contoso2023.
    - The contoso2023 account must fail over to its secondary endpoint.

    Which two settings should you configure? Select the appropriate settings
    in the answer area. Each correct selection is worth one point.

    The storage account menu in the exhibit contains the following settings.
  choices:
    - Diagnose and solve problems
    - Access Control (IAM)
    - Data migration
    - Events
    - Storage browser
    - Containers
    - File shares
    - Queues
    - Tables
    - Networking
    - Azure CDN
    - Access keys
    - Shared access signature
    - Encryption
    - Microsoft Defender for Cloud
    - Geo-replication
    - Data protection
    - Object replication
    - Blob inventory
    - Static website
    - Lifecycle management
  answer:
    - Access Control (IAM)
    - Geo-replication
  user_answer:
    - Access Control (IAM)
    - Geo-replication
  user_result: correct
  explanation: |
    Correct selections: **Access Control (IAM) and Geo-replication.**
    Both attempted selections are correct.

    In Access Control (IAM), assign Storage Blob Data Contributor to User1
    at the appropriate account or container scope. This grants blob read,
    write, and delete permissions using Microsoft Entra ID, formerly Azure AD.
    A general Contributor role does not directly grant blob-data permissions.

    In Geo-replication, initiate storage-account failover to promote the
    secondary region to primary. RA-GRS permits read access to the secondary
    endpoint before failover; that endpoint is not writable while it remains
    secondary. Failover updates the account's normal endpoint routing so
    clients can write to the new primary region.

    The exhibit uses the older Geo-replication portal label. Current portal
    documentation places account failover controls under Redundancy.

    Access keys and SAS provide other authorization methods, but IAM is
    the appropriate setting for assigning permissions to the named Entra
    user. Networking controls connectivity, not blob-data role assignments.
    Object replication copies blobs between accounts and does not initiate
    this account's regional failover.

    Remember: Who can write → IAM; which region is primary → failover.

