    - Azure Files
  question: |
    You have an Azure subscription named Subscription1.

    You have 5 TB of data that you need to transfer to Subscription1.

    You plan to use an Azure Import/Export job.

    What can you use as the destination of the imported data?
  choices:
    A: Azure File Storage
    B: an Azure Cosmos DB database
    C: Azure Data Factory
    D: Azure SQL Database
  answer: A
  user_answer: A
  user_result: correct
  explanation: |
    Correct answer: **A — Azure File Storage (Azure Files).**
    The attempted answer is correct.

    Azure Import/Export imports large amounts of data by shipping physical
    disk drives to an Azure datacenter. Supported import destinations are
    Azure Blob Storage and Azure Files. Among the listed options, only
    Azure File Storage is a supported destination. The 5 TB data size does
    not change which destination services are supported.

    Why the other options are wrong:

    - B: Azure Cosmos DB is a database service and is not a direct destination
      for an Azure Import/Export job.
    - C: Azure Data Factory is a data integration and orchestration service,
      not a storage destination for this job.
    - D: Azure SQL Database is not a direct Import/Export destination.

    This tests the same import-destination rule as Question 028, with Azure
    Files offered instead of Blob Storage. Azure Files is the storage service;
    Azure File Sync's Storage Sync Service is not an import destination.

    Remember: Import → Blobs and Files; Export → Blobs only.

