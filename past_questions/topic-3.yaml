    - Azure Storage Explorer
    - Append blobs
    - Azure Files
    - Azure Table Storage
  question: |
    You have an Azure subscription that contains the resources shown in
    the following table.

    | Name | Type |
    |------|------|
    | storage1 | Storage account |
    | container1 | Blob container |
    | table1 | Storage table |

    You need to perform the tasks shown in the following table.

    | Name | Type |
    |------|------|
    | Task1 | Create a new storage account. |
    | Task2 | Upload an append blob to container1. |
    | Task3 | Create a file share in storage1. |
    | Task4 | Add data to table1. |

    Which tasks can you perform by using Azure Storage Explorer?
  choices:
    A: Task1 and Task3 only
    B: Task1, Task2, and Task3 only
    C: Task1, Task3, and Task4 only
    D: Task2, Task3, and Task4 only
    E: Task1, Task2, Task3, and Task4
  answer: D
  user_answer: E
  user_result: incorrect
  learning_note: |
    Storage Explorer supports uploading append blobs, creating file shares,
    and adding table entities within existing storage accounts. Connecting
    or adding an account to its explorer tree does not create a new Azure
    storage account; use the portal, CLI, PowerShell, or ARM/Bicep for that.
  explanation: |
    Correct answer: **D — Task2, Task3, and Task4 only.**
    The attempted answer E incorrectly includes Task1.

    Azure Storage Explorer manages storage objects and data within existing
    accounts. The supported tasks are:

    - Task2: Upload an append blob to container1 by choosing the append
      blob type in the upload dialog.
    - Task3: Create a file share under the File Shares node of storage1.
    - Task4: Add entities to table1 using the table editor.

    Task1 is not performed directly by Storage Explorer. Create a new
    storage account using the Azure portal, Azure CLI, Azure PowerShell,
    or an ARM/Bicep deployment. Adding or connecting an account in Storage
    Explorer only makes an existing account accessible in the app.

    A, B, C, and E all include unsupported Task1. D includes all three
    supported tasks and excludes account creation.

    Remember: Create the account in Azure; manage its contents in Storage Explorer.

    [Microsoft Learn: Get started with Storage Explorer](https://learn.microsoft.com/en-us/azure/vs-azure-tools-storage-manage-with-storage-explorer)
    [Microsoft Learn: Create a blob with Storage Explorer](https://learn.microsoft.com/en-us/azure/storage/blobs/quickstart-storage-explorer)
    [Microsoft Learn: Using Storage Explorer with Azure Files](https://learn.microsoft.com/en-us/azure/storage/storage-explorer/vs-azure-tools-storage-explorer-files)
    [Microsoft Learn: Create an Azure Storage account](https://learn.microsoft.com/en-us/azure/storage/common/storage-account-create)
- id: '056'
  skill: Implement and manage storage
  sub-skill: Configure and manage storage accounts
