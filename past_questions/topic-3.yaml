- id: '046'
  skill: Implement and manage storage
  sub-skill: Configure and manage storage accounts
  tags:
    - "exam topic: Implement and manage storage"
    - Storage account kinds
    - Premium block blobs
    - Storage performance
    - Zone-redundant storage
  question: |
    You have an Azure subscription.

    In the Azure portal, you plan to create a storage account named storage1
    that will have the following settings:

    - Performance: Standard
    - Replication: Zone-redundant storage (ZRS)
    - Access tier (default): Cool
    - Hierarchical namespace: Disabled

    You need to ensure that you can set Account kind for storage1 to
    BlockBlobStorage.

    Which setting should you modify first?
  choices:
    A: Performance
    B: Replication
    C: Access tier (default)
    D: Hierarchical namespace
  answer: A
  user_answer: B
  user_result: incorrect
  learning_note: |
    BlockBlobStorage requires Premium performance. ZRS is supported for
    premium block blob accounts in supported regions, so changing replication
    does not address the Standard-performance blocker.
  explanation: |
    Correct answer: **A — Performance.** Change Standard to Premium first.
    The attempted answer B does not resolve the account-kind requirement.

    BlockBlobStorage is the account kind for premium block blob storage.
    Its supported SKUs include Premium_LRS and Premium_ZRS. Selecting
    Premium performance is therefore the prerequisite for selecting this
    account kind; a Standard account cannot use BlockBlobStorage.

    Why the other choices are wrong:

    - B: ZRS is compatible with premium block blob storage in supported
      regions. Changing it to LRS would still leave Performance set to
      Standard, which prevents selecting BlockBlobStorage.
    - C: Premium block blobs do not support the standard Hot, Cool, Cold,
      or Archive access tiers. Changing the default Cool tier does not
      enable the account kind; the performance selection must change first.
    - D: Hierarchical namespace can remain disabled. Enabling it is not
      a prerequisite for BlockBlobStorage.

    The question describes an older portal layout. The durable concept is
    the relationship between account kind and performance, rather than
    the exact arrangement of today's account-creation controls.

    Blueprint context: The AZ-104 skills measured as of April 17, 2026
    include creating and configuring storage accounts and configuring
    storage redundancy under Configure and manage storage accounts.
    BlockBlobStorage is not explicitly named in the blueprint, but this
    account-configuration concept fits those objectives. This does not
    guarantee that the exact question appears on the exam.

    Remember: BlockBlobStorage → Premium; replication → LRS or ZRS.

    [Microsoft Learn: Create an Azure Storage account](https://learn.microsoft.com/en-us/azure/storage/common/storage-account-create)
    [Microsoft Learn: Premium block blob storage accounts](https://learn.microsoft.com/en-us/azure/storage/blobs/storage-blob-block-blob-premium)
    [Microsoft Learn: Official AZ-104 study guide](https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/az-104)
- id: '048'
  skill: Implement and manage storage
  sub-skill: Configure and manage storage accounts
  tags:
    - "exam topic: Implement and manage storage"
    - Azure Blob Storage
    - Encryption scopes
    - Encryption at rest
    - Storage access keys
  question: |
    You create an Azure Storage account.

    You plan to add 10 blob containers to the storage account.

    For one of the containers, you need to use a different key to encrypt
    data at rest.

    What should you do before you create the container?
  choices:
    A: Generate a shared access signature (SAS).
    B: Modify the minimum TLS version.
    C: Rotate the access keys.
    D: Create an encryption scope.
  answer: D
  user_answer: C
  user_result: incorrect
  learning_note: |
    Storage account access keys are authentication credentials, not the
    keys selected for container-specific encryption at rest. Create an
    encryption scope to use a separate encryption key for a container.
    TLS settings govern protection in transit rather than at rest.
  explanation: |
    Correct answer: **D — Create an encryption scope.**
    The attempted answer C does not meet the requirement.

    Encryption scopes let you manage encryption at the level of a container
    or individual blob within one storage account. Create a scope using
    the required separate encryption key, then select it as the container's
    default encryption scope when creating the container. Blobs subsequently
    uploaded to the container use that default unless an override is allowed
    and supplied. To enforce the scope for the container, disallow overrides.
    Scopes can be protected by Microsoft-managed or customer-managed keys.

    Why the other choices are wrong:

    - A: A SAS grants scoped, time-limited access to storage data. It does
      not select a separate encryption-at-rest key for a container.
    - B: The minimum TLS version controls the security of connections
      in transit, not encryption of stored data.
    - C: Rotating access keys replaces account authentication credentials.
      It does not assign a separate encryption key to one container.

    Remember: Access key → authentication; encryption scope → encryption
    at rest; TLS → protection in transit.

    [Microsoft Learn: Encryption scopes for Blob storage](https://learn.microsoft.com/en-us/azure/storage/blobs/encryption-scope-overview)
    [Microsoft Learn: Create and manage encryption scopes](https://learn.microsoft.com/en-us/azure/storage/blobs/encryption-scope-manage)
- id: '049'
  skill: Implement and manage storage
  sub-skill: Configure Azure Files and Azure Blob Storage
  tags:
    - "exam topic: Implement and manage storage"
    - Blob lifecycle management
    - Access tiers
    - Blob deletion
  question: |
    HOTSPOT

    You have an Azure subscription that contains a storage account named
    storage1 with the following lifecycle management rules.

    | Name | Blob prefix | If base blobs were last modified more than (days ago) | Then |
    |------|-------------|------------------------------------------------------|------|
    | Rule1 | container1/ | 3 days | Move to archive storage |
    | Rule2 | Not applicable | 5 days | Move to cool storage |
    | Rule3 | container2/ | 10 days | Delete the blob |
    | Rule4 | container2/ | 15 days | Move to archive storage |

    On June 1, you store the following two blobs in storage1.

    | Name | Location | Access tier |
    |------|----------|-------------|
    | File1 | container1 | Hot |
    | File2 | container2 | Hot |

    For each statement, select Yes if the statement is true. Otherwise,
    select No. Each correct selection is worth one point.

    1. On June 6, File1 will be stored in the Cool access tier.
    2. On June 1, File2 will be stored in the Cool access tier.
    3. On June 16, File2 will be stored in the Archive access tier.
  choices:
    File1 is Cool on June 6:
      - "Yes"
      - "No"
    File2 is Cool on June 1:
      - "Yes"
      - "No"
    File2 is Archive on June 16:
      - "Yes"
      - "No"
  answer:
    File1 is Cool on June 6: "No"
    File2 is Cool on June 1: "No"
    File2 is Archive on June 16: "No"
  user_answer:
    File1 is Cool on June 6: "No"
    File2 is Cool on June 1: "No"
    File2 is Archive on June 16: "Yes"
  user_result: partially_correct
  user_reasoning: Rejected the first statement because File1 is archived and the second because File2 is Hot.
  learning_note: |
    Check deletion rules before later tiering rules. File2 qualifies for
    deletion after more than ten days, before its fifteen-day Archive
    threshold. A tier change does not reset the last-modified clock.
  explanation: |
    Correct selections: **No, No, No.** The attempted answer gets two of
    the three statements correct, with correct reasoning for the first two.

    1. No. File1 matches container1/ and qualifies for Rule1's Archive
       action after more than three days without modification. By June 6
       it is archived, rather than Cool. Rule2 does not rehydrate an
       archived blob into Cool storage.
    2. No. File2 is uploaded on June 1 in the Hot tier. It has not yet
       exceeded Rule2's five-day threshold, so it is not Cool that day.
    3. No. File2 matches container2/ and qualifies for Rule3's deletion
       action after more than ten days without modification. Assuming
       normal lifecycle processing, it is deleted before Rule4's
       fifteen-day Archive action can apply. Therefore, it is not stored
       in Archive on June 16. At exactly fifteen days, a condition stated
       as more than fifteen days has not yet been exceeded either.

    All these rules measure elapsed time from the last modification.
    Moving a blob from Hot to Cool does not restart that clock or postpone
    the deletion condition. Tier-change age is a separate condition that
    must be explicitly configured if needed.

    If multiple eligible actions apply to the same blob, lifecycle
    management chooses the least expensive action: deletion takes
    precedence over archiving, and archiving over cooling. A later
    tiering rule does not protect a blob from an earlier deletion rule.

    These are the expected exam outcomes, assuming no further modifications,
    no snapshots or previous versions blocking deletion, and that lifecycle
    processing has run. Actual policy execution is asynchronous rather
    than guaranteed at a particular time of day.

    Remember: Track last modification, match prefixes, and check deletion
    before concluding that a blob will reach a later storage tier.

    [Microsoft Learn: Lifecycle management policy structure](https://learn.microsoft.com/en-us/azure/storage/blobs/lifecycle-management-policy-structure)
    [Microsoft Learn: Lifecycle management overview](https://learn.microsoft.com/en-us/azure/storage/blobs/lifecycle-management-overview)
- id: '050'
  skill: Implement and manage storage
  sub-skill: Configure Azure Files and Azure Blob Storage
  tags:
    - "exam topic: Implement and manage storage"
    - ARM templates
    - Point-in-time restore
    - Blob soft delete
    - Container soft delete
    - Storage network rules
    - Locally redundant storage
  question: |
    HOTSPOT

    You have an Azure subscription.

    You plan to deploy a storage account named storage1 by using the
    following Azure Resource Manager (ARM) template.

    ```json
    {
      "$schema": "http://schema.management.azure.com/schemas/2015-01-01/deploymentTemplate.json#",
      "contentVersion": "1.0.0.0",
      "resources": [
        {
          "name": "storage1",
          "type": "Microsoft.Storage/storageAccounts",
          "apiVersion": "2021-08-01",
          "location": "East US",
          "properties": {
            "allowBlobPublicAccess": true,
            "defaultToOAuthAuthentication": false,
            "networkAcls": {
              "bypass": "AzureServices",
              "defaultAction": "Allow",
              "ipRules": []
            }
          },
          "sku": {
            "name": "Standard_LRS"
          },
          "kind": "StorageV2"
        },
        {
          "name": "storage1/default",
          "type": "Microsoft.Storage/storageAccounts/blobServices",
          "apiVersion": "2021-08-01",
          "properties": {
            "restorePolicy": {
              "enabled": true,
              "days": 6
            },
            "deleteRetentionPolicy": {
              "enabled": true,
              "days": 7
            },
            "containerDeleteRetentionPolicy": {
              "enabled": true,
              "days": 7
            },
            "changeFeed": {
              "enabled": true
            },
            "isVersioningEnabled": true
          },
          "dependsOn": [
            "[concat('Microsoft.Storage/storageAccounts/', 'storage1')]"
          ]
        }
      ]
    }
    ```

    For each statement, select Yes if the statement is true. Otherwise,
    select No. Each correct selection is worth one point.
  choices:
    Changes made to the data in storage1 can be rolled back after seven days:
      - "Yes"
      - "No"
    Only users located in the East US Azure region can connect to storage1:
      - "Yes"
      - "No"
    Three copies of storage1 will be maintained in the East US Azure region:
      - "Yes"
      - "No"
  answer:
    Changes made to the data in storage1 can be rolled back after seven days: "No"
    Only users located in the East US Azure region can connect to storage1: "No"
    Three copies of storage1 will be maintained in the East US Azure region: "Yes"
  user_answer:
    Changes made to the data in storage1 can be rolled back after seven days: "No"
    Only users located in the East US Azure region can connect to storage1: "No"
    Three copies of storage1 will be maintained in the East US Azure region: "Yes"
  user_result: correct
  user_reasoning: Selected No, No, Yes; explained the third selection by identifying LRS.
  learning_note: |
    Point-in-time restore is configured for six days, while blob and container
    soft delete are configured for seven days. These are separate recovery
    features. The account's region does not restrict client location, and
    LRS maintains three local data replicas in the primary region.
  explanation: |
    Correct selections: **No, No, Yes.** All attempted selections are correct.
    The learner correctly used LRS to identify the three local copies.

    1. **No:** restorePolicy.days is 6, so the configured point-in-time
       restore window is six days, not seven. deleteRetentionPolicy.days
       and containerDeleteRetentionPolicy.days are both 7, but those
       settings govern recovery of soft-deleted blobs and containers.
       They do not extend the point-in-time restore window. That window
       must be at least one day shorter than blob soft-delete retention.
       This statement is interpreted as the configured point-in-time
       rollback capability; retained individual blob versions are a
       separate recovery mechanism, not a seven-day account restore window.

    2. **No:** networkAcls.defaultAction is Allow, with no IP restrictions.
       Clients are not restricted to East US. location controls where
       the storage account resides, not where users must be located.
       Permitted network access still requires appropriate authorization
       to access private data. allowBlobPublicAccess permits containers
       to be configured for anonymous access; it does not itself make
       every container public.

    3. **Yes:** Standard_LRS maintains three synchronously replicated
       copies of the data within one physical datacenter in the primary
       region. The template selects East US, so the local copies reside
       there. These are data replicas, not separate storage accounts.

    Remember: Restore window → restorePolicy; connectivity → networkAcls;
    copy count → sku.

    [Microsoft Learn: Point-in-time restore for block blobs](https://learn.microsoft.com/en-us/azure/storage/blobs/point-in-time-restore-overview)
    [Microsoft Learn: Set the default public network access rule](https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security-set-default-access)
    [Microsoft Learn: Azure Storage redundancy](https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy)
- id: '052'
  skill: Implement and manage storage
  sub-skill: Configure Azure Files and Azure Blob Storage
  tags:
    - "exam topic: Implement and manage storage"
    - Blob lifecycle management
    - Archive access tier
    - Prefix filters
    - must-review
  question: |
    HOTSPOT

    You have an Azure subscription that contains a storage account named
    storage1. The storage1 account contains a container named container1.

    You need to create a lifecycle management rule for storage1 that will
    automatically move the blobs in container1 to the lowest-cost tier
    after 90 days.

    How should you complete the rule? Select the appropriate options in
    the answer area. Each correct selection is worth one point.

    ```json
    {
      "rules": [
        {
          "enabled": true,
          "name": "rule1",
          "type": "Lifecycle",
          "definition": {
            "actions": {
              "baseBlob": {
                "[action]": {
                  "daysAfterModificationGreaterThan": 90
                }
              }
            },
            "filters": {
              "[filter]": ["container1/"]
            }
          }
        }
      ]
    }
    ```

    The exhibit shows an abbreviated rule; other required properties are
    omitted from the displayed sections.
  choices:
    Action:
      - enableAutoTierToHotFromCool
      - tierToArchive
      - tierToCool
    Filter:
      - blobIndexMatch
      - blobTypes
      - prefixMatch
  answer:
    Action: tierToArchive
    Filter: prefixMatch
  user_answer:
    Action: enableAutoTierToHotFromCool
    Filter: prefixMatch
  user_result: partially_correct
  learning_note: |
    tierToArchive moves eligible blobs to the lowest storage-capacity-cost
    tier. enableAutoTierToHotFromCool instead returns eligible cool blobs
    to Hot when accessed. prefixMatch correctly selects the container path.
    daysAfterModificationGreaterThan measures age since last modification.
  explanation: |
    Correct selections: **tierToArchive; prefixMatch.** The attempted filter
    is correct, but the action does not meet the requirement.

    Archive has the lowest storage capacity cost among the offered tiers.
    tierToArchive is therefore the action required to move eligible blobs
    to that tier. tierToCool moves blobs only to Cool.
    enableAutoTierToHotFromCool is a Boolean option for returning eligible
    cool blobs to Hot when accessed, not an age-based Archive action.

    prefixMatch: ["container1/"] limits the rule to blob paths in container1.
    blobIndexMatch filters by blob index tags, while blobTypes identifies
    types such as blockBlob; neither accepts the container path as its
    intended filter value.

    A complete rule can be written as follows:

    ```json
    {
      "rules": [
        {
          "enabled": true,
          "name": "rule1",
          "type": "Lifecycle",
          "definition": {
            "actions": {
              "baseBlob": {
                "tierToArchive": {
                  "daysAfterModificationGreaterThan": 90
                }
              }
            },
            "filters": {
              "blobTypes": ["blockBlob"],
              "prefixMatch": ["container1/"]
            }
          }
        }
      ]
    }
    ```

    The 90-day condition is based on the blob's last modification time,
    not necessarily its creation time. Lifecycle processing is periodic,
    so the transition is not guaranteed at the exact 90-day mark.
    Archive is offline and requires rehydration before reading; lowest
    capacity cost does not mean lowest retrieval or total workload cost.

    Remember: Action = where to move; prefix = which blobs; condition = when.

    [Microsoft Learn: Lifecycle policies that transition blobs between tiers](https://learn.microsoft.com/en-us/azure/storage/blobs/lifecycle-management-policy-access-tiers)
    [Microsoft Learn: Lifecycle management policy structure](https://learn.microsoft.com/en-us/azure/storage/blobs/lifecycle-management-policy-structure)
- id: '053'
  skill: Monitor and maintain Azure resources
  sub-skill: Implement backup and recovery
  tags:
    - "exam topic: Monitor and maintain Azure resources"
    - Azure Backup
    - Recovery Services vault
    - Zone-redundant storage
    - Backup configuration order
  question: |
    DRAG DROP

    You have an Azure subscription that contains a virtual machine named VM1.

    You need to back up VM1. The solution must ensure that backups are stored
    across three availability zones in the primary region.

    Which three actions should you perform in sequence? Move the appropriate
    actions from the list of actions to the answer area and arrange them
    in the correct order.
  choices:
    - Configure a replication policy.
    - Set Replication to Zone-redundant storage (ZRS).
    - For VM1, create a backup policy and configure the backup.
    - Set Replication to Locally-redundant storage (LRS).
    - Create a Recovery Services vault.
  answer:
    - Create a Recovery Services vault.
    - Set Replication to Zone-redundant storage (ZRS).
    - For VM1, create a backup policy and configure the backup.
  user_answer:
    - Create a Recovery Services vault.
    - For VM1, create a backup policy and configure the backup.
    - Set Replication to Zone-redundant storage (ZRS).
  user_result: partially_correct
  learning_note: |
    The correct actions were selected, but the last two were reversed.
    Configure the Recovery Services vault's storage redundancy before
    enabling backup or protecting workloads. ZRS meets the requirement
    to distribute backup data across availability zones in the primary region.
  explanation: |
    Correct sequence:

    1. **Create a Recovery Services vault.** This provides the Azure Backup
       resource in which VM1's backup will be configured.
    2. **Set Replication to Zone-redundant storage (ZRS).** Configure the
       vault's backup storage redundancy before enabling backup. ZRS
       distributes backup data across availability zones in the primary
       region, meeting the stated requirement.
    3. **For VM1, create a backup policy and configure the backup.** The
       policy defines the backup schedule and retention; VM1 is then
       protected using the vault's configured redundancy.

    The attempted sequence selected all three required actions and placed
    vault creation first, but configured backup before choosing ZRS.
    Microsoft specifies that a Recovery Services vault's storage replication
    type must be configured before backup is configured in the vault.

    Why the other actions are not selected:

    - Configure a replication policy: This belongs to Site Recovery
      replication rather than the Azure Backup configuration requested here.
    - Set Replication to LRS: LRS maintains local copies within a single
      datacenter, not across three availability zones.

    Remember: Create vault → choose redundancy → enable backup.

    [Microsoft Learn: Create and configure Recovery Services vaults](https://learn.microsoft.com/en-us/azure/backup/backup-create-recovery-services-vault)
    [Microsoft Learn: Azure Storage redundancy](https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy)
