- id: '064'
  skill: Implement and manage storage
  sub-skill: Configure Azure Files and Azure Blob Storage
  tags:
    - "exam topic: Implement and manage storage"
    - Blob lifecycle management
    - Access tiers
    - Last modification time
    - Block blobs
  question: |
    HOTSPOT

    You have an Azure subscription that contains a storage account named
    storage1. The account contains a container named container1.

    You create a blob lifecycle rule named rule1.

    You need to configure rule1 to automatically move blobs that were NOT
    updated for 45 days from container1 to the Cool access tier.

    Complete the rule by selecting the appropriate options.
    Each correct selection is worth one point.

    ```json
    {
      "rules": [
        {
          "enabled": true,
          "name": "rule1",
          "type": "Lifecycle",
          "definition": {
            "actions": {
              "baseBlob": {
                "tierToCool": {
                  "[age condition]": 45
                }
              }
            },
            "filters": {
              "blobTypes": ["[blob type]"],
              "prefixMatch": ["container1"]
            }
          }
        }
      ]
    }
    ```
  choices:
    Age condition:
      - daysAfterCreationGreaterThan
      - daysAfterLastAccessTimeGreaterThan
      - daysAfterModificationGreaterThan
    Blob type:
      - AppendBlob
      - Blockblob
      - Pageblob
  answer:
    Age condition: daysAfterModificationGreaterThan
    Blob type: Blockblob
  user_answer:
    Age condition: daysAfterModificationGreaterThan
    Blob type: Blockblob
  user_result: correct
  explanation: |
    Correct selections: **daysAfterModificationGreaterThan; Blockblob.**
    Both attempted selections are correct. The second selection retains
    the exhibit's label; actual policy JSON uses the exact value blockBlob.

    The decisive wording is NOT updated. This refers to the elapsed time
    since the blob's last modification. Set daysAfterModificationGreaterThan
    to 45 under the baseBlob tierToCool action. The condition becomes
    eligible when the age exceeds 45 days, and execution is asynchronous.

    daysAfterCreationGreaterThan measures age since creation and does not
    reflect later updates. daysAfterLastAccessTimeGreaterThan measures
    access age, rather than modification age, and requires the appropriate
    access-time tracking configuration to use the blob's last access time.

    Cool tiering applies to block blobs. Append blobs and page blobs do
    not support this lifecycle tierToCool action. Standard GPv2 accounts
    support Cool tiering; premium block blob accounts do not.

    The relevant corrected JSON fragments are:

    ```json
    "tierToCool": {
      "daysAfterModificationGreaterThan": 45
    }
    ```

    ```json
    "blobTypes": ["blockBlob"],
    "prefixMatch": ["container1/"]
    ```

    The exhibit uses container1 without a trailing slash. For a rule
    restricted to that exact container, use container1/. Without the
    slash, the prefix can also match similarly named containers such
    as container10. This is a prefix-filter refinement, not one of the
    two blanks being tested.

    Remember: Not updated → last modification; not read → last access.

    [Microsoft Learn: Lifecycle management policy structure](https://learn.microsoft.com/en-us/azure/storage/blobs/lifecycle-management-policy-structure)
    [Microsoft Learn: Lifecycle management policy FAQ](https://learn.microsoft.com/en-us/azure/storage/blobs/lifecycle-management-policy-faq)
