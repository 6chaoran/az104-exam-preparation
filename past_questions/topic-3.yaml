    - AzCopy
    - Supported operating systems
    - macOS
  question: |
    You have an Azure subscription that contains a storage account named storage1.

    You have the devices shown in the following table.

    | Name | Platform |
    |------|----------|
    | Device1 | Windows 10 |
    | Device2 | Linux |
    | Device3 | macOS |

    From which devices can you use AzCopy to copy data to storage1?
  choices:
    A: Device1 only
    B: Device1, Device2 and Device3
    C: Device1 and Device2 only
    D: Device1 and Device3 only
  answer: B
  user_answer: C
  user_result: incorrect
  learning_note: |
    AzCopy v10 runs on Windows, Linux, and macOS. The attempted selection
    omitted macOS. Current support requires officially maintained OS versions;
    the historical Windows 10 label does not fully establish 2026 support.
  explanation: |
    Intended answer: **B — Device1, Device2, and Device3.**

    AzCopy v10 is a cross-platform command-line data-transfer utility.
    Microsoft provides builds for Windows, Linux, and macOS, so all three
    devices can use it under the question's historical platform assumptions.

    Why the other options are wrong:

    - A omits both supported Linux and macOS platforms.
    - C, the attempted answer, incorrectly omits macOS.
    - D incorrectly omits Linux.

    Current-support caveat: Microsoft supports AzCopy only on operating-system
    versions that are officially maintained. In 2026, the generic Windows 10
    label is insufficient to establish current support without details of
    the edition and maintenance status. Linux and macOS versions are also
    unspecified. This legacy question tests operating-system families rather
    than lifecycle eligibility; B remains its intended answer.

    Remember: AzCopy = Windows + Linux + macOS.

    [Microsoft Learn: Get started with AzCopy — supported platforms and downloads](https://learn.microsoft.com/en-us/azure/storage/common/storage-use-azcopy-v10)
- id: '041'
  skill: Implement and manage storage
  sub-skill: Configure Azure Files and Azure Blob Storage
  tags:
    - "exam topic: Implement and manage storage"
    - Immutable Blob Storage
    - Time-based retention
    - WORM
  question: |
    You have an Azure Storage account named storage1 that contains a blob
    container named container1.

    You need to prevent new content added to container1 from being modified
    for one year.

    What should you configure?
  choices:
    A: the access tier
    B: an access policy
    C: the Access control (IAM) settings
    D: the access level
  answer: B
  user_answer: B
  user_result: correct
  explanation: |
    Correct answer: **B — an access policy.** The attempted answer is correct.

    Specifically, configure a time-based immutability retention policy on
    container1 for one year, typically expressed as 365 days. This places
    blobs in a write once, read many (WORM) state: new blobs can be added
    and read, but their content cannot be modified or deleted during their
    retention period. The retention period for newly added blobs is based
    on each blob's creation time, rather than a single common expiry date
    for the whole container.

    Here, 'access policy' refers to the container's immutability policy,
    not a stored access policy used to manage SAS tokens. A time-based
    policy matches the fixed duration; a legal hold lasts until removed.
    Lock the policy when the retention requirement must be protected
    against policy removal or shortening.

    Why the other options are wrong:

    - A: Access tiers control storage costs and retrieval behavior. They
      do not enforce protection against modification for one year.
    - C: IAM controls which identities have permissions. It does not
      provide the required time-based immutable retention guarantee.
    - D: The container's access level controls anonymous read access,
      not protection against modification or deletion.

    Remember: Prevent changes for a fixed period → time-based immutability policy.

    [Microsoft Learn: Configure immutability policies for containers](https://learn.microsoft.com/en-us/azure/storage/blobs/immutable-policy-configure-container-scope)
- id: '042'
  skill: Implement and manage storage
  sub-skill: Configure Azure Files and Azure Blob Storage
  tags:
    - "exam topic: Implement and manage storage"
    - Blob lifecycle management
    - Access tiers
    - Archive rehydration
    - Prefix matching
    - must-review
  question: |
    HOTSPOT

    You have an Azure Storage account named storage1 that contains a blob
    container named container1. The default access tier is Hot.

    You create the following lifecycle management rules in storage1.

    | Name | Rule scope | Blob type | Blob subtype | Rule block | Prefix match |
    |------|------------|-----------|--------------|------------|--------------|
    | Rule1 | Limit blobs by using filters | Block blobs | Base blobs | If base blobs were not modified for two days, move to archive storage. If base blobs were not modified for nine days, delete the blob. | container1/Dep1 |
    | Rule2 | Apply to all blobs in storage1 | Block blobs | Base blobs | If base blobs were not modified for three days, move to cool storage. If base blobs were not modified for nine days, move to archive storage. | Not applicable |

    You perform the following actions.

    | Date | Action |
    |------|--------|
    | October 1 | Upload Dep1File1.docx, File2.docx, and File3.docx to container1. |
    | October 2 | Edit Dep1File1.docx and File3.docx. |
    | October 5 | Edit File2.docx. |

    For each statement, select Yes if the statement is true. Otherwise,
    select No. Each correct selection is worth one point.

    1. On October 10, you can read Dep1File1.docx.
    2. On October 10, you can read File2.docx.
    3. On October 10, you can read File3.docx.
  choices:
    Can read Dep1File1.docx on October 10:
      - "Yes"
      - "No"
    Can read File2.docx on October 10:
      - "Yes"
      - "No"
    Can read File3.docx on October 10:
      - "Yes"
      - "No"
  answer:
    Can read Dep1File1.docx on October 10: "No"
    Can read File2.docx on October 10: "Yes"
    Can read File3.docx on October 10: "Yes"
  user_answer:
    Can read Dep1File1.docx on October 10: "Yes"
    Can read File2.docx on October 10: "Yes"
    Can read File3.docx on October 10: "Yes"
  user_result: partially_correct
  user_reasoning: Believed Dep1File1.docx could still be read because it was only moved to Archive rather than deleted.
  learning_note: |
    An archived blob still exists, but its contents cannot be read until
    rehydration completes. Cool storage remains online and directly readable.
    Lifecycle age is measured from the last modification, and prefix filters
    match the beginning of a blob name without requiring a folder boundary.
  explanation: |
    Correct selections: **No, Yes, Yes.** The attempted answer gets two of
    the three statements correct.

    1. No. Dep1File1.docx matches container1/Dep1 because its name begins
       with Dep1. Rule1 archives it after two days without modification.
       Its last modification was October 2, so on October 10 it has been
       unchanged for eight days and has not reached the nine-day deletion
       threshold. It still exists, but Archive is offline: its contents
       cannot be read until it is rehydrated to an online tier.
    2. Yes. File2.docx was last modified on October 5. After five days it
       qualifies for Rule2's Cool tier, but not its nine-day Archive action.
       Cool blobs remain directly readable.
    3. Yes. File3.docx was last modified on October 2. After eight days it
       qualifies for Cool, but not the nine-day Archive action. Its name
       does not match Rule1's Dep1 prefix, so it remains readable.

    Rule2's Cool action does not bring an already archived blob back online.
    Lifecycle management cannot rehydrate archived blobs. Tier changes do
    not reset the blob's last-modified time.

    Rehydration is an explicit operation followed by a wait for completion.
    Standard-priority rehydration can take up to 15 hours. High-priority
    rehydration for blobs smaller than 10 GB can finish in under one hour,
    but this is not guaranteed. Merely trying to read the blob does not
    automatically rehydrate it.

    These selections assume lifecycle processing has run as intended by the
    exam scenario. Actual lifecycle execution is asynchronous. The default
    access tier is an account setting, despite the exhibit's container wording.

    Remember: Cool = online and readable. Archive = exists but needs rehydration.

    [Microsoft Learn: Lifecycle management policy structure](https://learn.microsoft.com/en-us/azure/storage/blobs/lifecycle-management-policy-structure)
    [Microsoft Learn: Access tiers overview](https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview)
    [Microsoft Learn: Archive rehydration overview](https://learn.microsoft.com/en-us/azure/storage/blobs/archive-rehydrate-overview)
- id: '043'
  skill: Implement and manage storage
  sub-skill: Configure access to storage
  tags:
    - "exam topic: Implement and manage storage"
    - Azure RBAC
    - Microsoft Entra ID
    - Azure Blob Storage
    - Control plane versus data plane
    - Least privilege
    - must-review
  question: |
    You are configuring Azure Active Directory (Azure AD) authentication for
    an Azure Storage account named storage1.

    You need to ensure that the members of a group named Group1 can upload
    files by using the Azure portal. The solution must use the principle
    of least privilege.

    Which two roles should you configure for storage1?
    Each correct answer presents part of the solution.
    Each correct selection is worth one point.
  choices:
    A: Storage Account Contributor
    B: Storage Blob Data Contributor
    C: Reader
    D: Contributor
    E: Storage Blob Data Reader
  answer: BC
  user_answer: BE
  user_result: partially_correct
  learning_note: |
    Azure portal access with Microsoft Entra credentials requires management
    permissions to navigate the storage account as well as blob-data permissions.
    Reader provides portal navigation; Storage Blob Data Contributor provides
    upload permissions. Storage Blob Data Reader is redundant alongside Data
    Contributor and does not replace the management-plane Reader role.
  explanation: |
    Correct answer: **B and C — Storage Blob Data Contributor and Reader.**
    The attempted answer correctly selected B but selected E instead of C.

    Assign both roles to Group1 at storage1's scope as requested. Reader
    supplies the management-plane permissions needed to view the account
    and navigate its resources in the Azure portal. Storage Blob Data
    Contributor supplies data-plane permissions to read, upload/write,
    and delete blobs using Microsoft Entra ID, formerly Azure AD.

    These are separate permission requirements. A blob-data role does not
    by itself provide all the account-navigation permissions needed in
    the portal. Reader alone does not authorize uploading blob data.

    Why the other choices are wrong:

    - A: Storage Account Contributor grants unnecessary account-management
      permissions, including access to storage account keys. It is broader
      than the Reader role needed for portal navigation.
    - D: Contributor grants broader resource-management permissions than
      the task requires and does not supply direct Entra blob-data access.
    - E: Storage Blob Data Reader cannot upload blobs. Its blob read
      permissions are already included in Storage Blob Data Contributor,
      and it does not replace the management-plane Reader role.

    Storage Blob Data Contributor includes deletion as well as upload, but
    it is the least-privileged listed data role that supports uploading.
    Reader is the least-privileged listed management role for portal navigation.

    Remember: Portal navigation → Reader; blob upload → Storage Blob Data Contributor.

    [Microsoft Learn: Assign an Azure role for access to blob data](https://learn.microsoft.com/en-us/azure/storage/blobs/assign-azure-role-data-access)
    [Microsoft Learn: Authorize access to blob data in the Azure portal](https://learn.microsoft.com/en-us/azure/storage/blobs/authorize-data-operations-portal)
- id: '044'
  skill: Implement and manage storage
  sub-skill: Configure and manage storage accounts
  tags:
    - "exam topic: Implement and manage storage"
    - Object replication
    - Storage account types
    - Blob containers
  question: |
    HOTSPOT

    You have an Azure Storage account named storage1 that stores images.

    You need to create a new storage account and replicate the images in
    storage1 to the new account by using object replication.

    How should you configure the new account? Select the appropriate options.
    Each correct selection is worth one point.
  choices:
    Account type:
      - StorageV2 only
      - StorageV2 or FileStorage only
      - StorageV2 or BlobStorage only
      - StorageV2, BlobStorage, or FileStorage
    Object type to create in the new account:
      - Container
      - File share
      - Table
      - Queue
  answer:
    Account type: StorageV2 only
    Object type to create in the new account: Container
  user_answer:
    Account type: StorageV2 only
    Object type to create in the new account: Container
  user_result: correct
  explanation: |
    Correct selections: **StorageV2 only; Container.** Both attempted
    selections are correct.

    Object replication asynchronously copies block blobs between source
    and destination containers in different storage accounts. Images can
    be stored as block blobs, so create a destination blob container.
    File shares, tables, and queues are not destinations for this feature.

    Among the listed account types, standard general-purpose v2
    (StorageV2) supports object replication. The legacy BlobStorage account
    type does not, and FileStorage accounts contain Azure file shares.
    Azure Blob Storage is the service name; BlobStorage is a specific
    legacy account kind. StorageV2 includes the Blob Storage service.

    Current Azure also supports object replication with premium block
    blob accounts (BlockBlobStorage), which are not listed as an option.
    Do not confuse BlockBlobStorage with legacy BlobStorage or premium
    StorageV2 page-blob accounts.

    Enable blob versioning on both source and destination accounts and
    change feed on the source account. Configure a replication rule
    linking the source container to the destination container. Object
    replication supports block blobs, not append blobs or page blobs.

    Remember: Object replication → block blobs in containers; versioning
    on both accounts and change feed on the source.

    [Microsoft Learn: Object replication overview](https://learn.microsoft.com/en-us/azure/storage/blobs/object-replication-overview)
    [Microsoft Learn: Configure object replication](https://learn.microsoft.com/en-us/azure/storage/blobs/object-replication-configure)
- id: '045'
  skill: Implement and manage storage
  sub-skill: Configure and manage storage accounts
  tags:
    - "exam topic: Implement and manage storage"
    - AzCopy
    - Blob uploads
    - Recursive copy
  question: |
    You have an on-premises server that contains a folder named D:\Folder1.

    You need to copy the contents of D:\Folder1 to the public container in
    an Azure Storage account named contosodata.

    Which command should you run?
  choices:
    A: https://contosodata.blob.core.windows.net/public
    B: azcopy sync D:\folder1 https://contosodata.blob.core.windows.net/public --snapshot
    C: azcopy copy D:\folder1 https://contosodata.blob.core.windows.net/public --recursive
    D: az storage blob copy start-batch D:\Folder1 https://contosodata.blob.core.windows.net/public
  answer: C
  user_answer: C
  user_result: correct
  explanation: |
    Correct answer: **C — azcopy copy with --recursive.** The attempted
    answer is correct.

    AzCopy uploads files from a local folder to the destination blob
    container. The --recursive flag includes files in subfolders.

    In PowerShell, run the command with quoted paths:

    ```powershell
    azcopy copy "D:\Folder1" "https://contosodata.blob.core.windows.net/public" --recursive
    ```

    This uploads the folder and its contents under a Folder1/ prefix in
    the container. To upload the contents directly into the container
    without the containing folder, use "D:\Folder1\*" as the source and
    retain --recursive. C is the correct listed command, although the
    question does not specify the required destination folder layout.

    Why the other options are wrong:

    - A: A destination URL by itself does not perform a copy operation.
    - B: --snapshot is not a valid azcopy sync flag. A correctly configured
      sync command can synchronize local files, but this option is invalid.
    - D: az storage blob copy start-batch copies existing blobs rather than
      uploading local files, and the shown positional syntax is invalid.
      Azure CLI local-folder uploads use az storage blob upload-batch.

    The container name public does not grant write permission. Even if
    anonymous read access is enabled, uploads require authorization, such
    as an authenticated identity with blob write permissions or a SAS
    token granting the required access.

    Remember: Local folder upload → azcopy copy; include subfolders → --recursive.

    [Microsoft Learn: Upload blobs with AzCopy](https://learn.microsoft.com/en-us/azure/storage/common/storage-use-azcopy-blobs-upload)
    [Microsoft Learn: AzCopy sync reference](https://learn.microsoft.com/en-us/azure/storage/common/storage-ref-azcopy-sync)
    [Microsoft Learn: Azure CLI storage blob commands](https://learn.microsoft.com/en-us/cli/azure/storage/blob)
- id: '047'
  skill: Implement and manage storage
  sub-skill: Configure access to storage
  tags:
    - "exam topic: Implement and manage storage"
    - AzCopy
    - Shared access signatures
    - Microsoft Entra ID
    - Azure Files
    - Legacy question
  question: |
    DRAG DROP

    You have an Azure subscription that contains the following storage accounts.

    | Name | Azure Active Directory (Azure AD) authentication | Contents |
    |------|------------------------------------------------|----------|
    | storage1 | Enabled | A blob container named container1 that has a public access level of No public access |
    | storage2 | Enabled | A file share named share1 |

    You plan to use AzCopy to copy a blob from container1 directly to share1.

    You need to identify which authentication method to use when you use AzCopy.

    Identify a method for each account. Each method may be used once, more
    than once, or not at all. Each correct selection is worth one point.
  choices:
    storage1:
      - OAuth
      - Anonymous
      - A storage account access key
      - A shared access signature (SAS) token
    storage2:
      - OAuth
      - Anonymous
      - A storage account access key
      - A shared access signature (SAS) token
  answer:
    storage1: A shared access signature (SAS) token
    storage2: A shared access signature (SAS) token
  user_answer:
    storage1: A shared access signature (SAS) token
    storage2: OAuth
  user_result: partially_correct
  learning_note: |
    The recorded result uses the historical expected answer: SAS for both
    accounts in this direct Blob-to-Files scenario. Current AzCopy supports
    Microsoft Entra ID authorization for Azure Files operations targeting
    files and directories, so the destination OAuth answer should not be
    treated as universally wrong today. Authentication support also does
    not replace the need for appropriate data permissions.
  explanation: |
    Historical expected selections: **storage1: SAS token; storage2: SAS token.**
    Under that interpretation, the attempted answer gets one of two correct.
    This older question needs a version caveat rather than a timeless rule.

    In the historical direct Blob-to-Azure Files copy scenario, append a
    SAS token to both the source blob URL and destination file URL. The
    source token authorizes reading the private blob; the destination
    token authorizes the required file creation and write operations.

    Anonymous access cannot read container1 because its access level is
    No public access. Anonymous access also cannot write to Azure Files.
    AzCopy uses Microsoft Entra credentials or SAS tokens rather than a
    raw storage account key supplied directly as its transfer credential.
    An account key can be used to generate a SAS, which is a distinct choice.

    Current behavior differs from the historical Azure Files limitation.
    Microsoft documents Entra ID authorization for AzCopy commands targeting
    files and directories. Commands targeting only a file share or account
    still require SAS under the documented limitation. Consequently, the
    learner's OAuth destination choice is not inherently invalid with modern
    AzCopy and appropriate file-data permissions. Without an AzCopy version
    and exact command, this question does not establish a unique current
    authentication combination. SAS on both endpoints remains a supported
    way to perform the transfer.

    Azure AD is now named Microsoft Entra ID. Having identity authentication
    enabled does not grant data access automatically: the identity needs
    appropriate data roles and the transfer needs network access.

    Remember: Separate historical tool limitations from current support;
    check both source-read and destination-write authorization.

    [Microsoft Learn: Transfer data with AzCopy and Azure Files](https://learn.microsoft.com/en-us/azure/storage/common/storage-use-azcopy-files)
