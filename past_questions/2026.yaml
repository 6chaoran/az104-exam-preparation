# AZ-104 original practice questions for the April 17, 2026 blueprint.
# Verified October 9, 2026. These are authored practice items, not recalled exam questions.
# Identified substantive objective change: Configure encryption at host for Azure VMs.
# IDs 812-831 cover encryption at host; IDs 832-851 close older coverage gaps.
# Forty original practice questions; these are not forty newly added blueprint topics.
# Comparison and historical-evidence limits: ../AZ-104-QUESTION-BANK-2026-COMPARISON.md
# Blueprint: https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/az-104

- id: 812
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  question: |
    You plan to deploy VM1 on a supported Azure VM size. You must encrypt its temporary disk and OS/data disk caches without installing encryption software inside the guest operating system. Which feature should you enable?
  choices:
    A: "Azure Disk Encryption"
    B: "Encryption at host"
    C: "Azure Storage encryption on a blob container"
    D: "Transport Layer Security for the application"
  answer: B
  explanation: |
    B is correct: encryption starts on the Azure host and covers local disk data. A uses guest encryption; C targets blobs; D protects application traffic.
    
    [Microsoft Learn](https://learn.microsoft.com/en-us/azure/virtual-machines/disk-encryption)

- id: 813
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  question: |
    You have VM1 with a supported size, no Azure Disk Encryption history, and encryption at host disabled. The security team requires encryption of the temporary disk and disk caches. Solution: You rely only on default encryption of persisted managed disks. Does this meet the goal?
  choices:
    A: "Yes"
    B: "No"
  answer: B
  explanation: |
    Default managed-disk encryption alone does not establish host-cache protection. Enable encryption at host for the stated local-disk requirement.
    
    [Microsoft Learn](https://learn.microsoft.com/en-us/azure/virtual-machines/disk-encryption)

- id: 814
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  question: |
    You plan to enable encryption at host in Subscription1. The Microsoft.Compute resource provider is registered, but its EncryptionAtHost feature is NotRegistered. Which Azure CLI command should you run first?
  choices:
    A: "az provider register --namespace Microsoft.Storage"
    B: "az vm encryption enable --resource-group RG1 --name VM1 --disk-encryption-keyvault Vault1"
    C: "az feature register --namespace Microsoft.Compute --name EncryptionAtHost"
    D: "az keyvault update --name Vault1 --enabled-for-disk-encryption true"
  answer: C
  explanation: |
    C registers the required subscription feature. Provider registration alone is insufficient; the other commands configure different encryption mechanisms or resources.
    
    [Microsoft Learn](https://learn.microsoft.com/en-us/azure/virtual-machines/linux/disks-enable-host-based-encryption-cli)

- id: 815
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  question: |
    You register the EncryptionAtHost feature in Subscription1. You need to confirm that registration has completed before deploying VM1. Which command should you use?
  choices:
    A: "az feature show --namespace Microsoft.Compute --name EncryptionAtHost"
    B: "az vm show --resource-group RG1 --name VM1 --query provisioningState"
    C: "az keyvault key list --vault-name Vault1"
    D: "az disk list --resource-group RG1"
  answer: A
  explanation: |
    A returns the feature registration state; wait for Registered. VM provisioning, key listings, and disk listings do not verify subscription feature readiness.
    
    [Microsoft Learn](https://learn.microsoft.com/en-us/azure/virtual-machines/linux/disks-enable-host-based-encryption-cli)

- id: 816
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  question: |
    You have a running VM named VM1. Its size supports encryption at host, the subscription feature is registered, and VM1 has never used Azure Disk Encryption. You need to enable encryption at host on VM1. What should you do first?
  choices:
    A: "Enable BitLocker inside VM1"
    B: "Create a storage-account shared access signature"
    C: "Restart VM1 from its guest operating system"
    D: "Stop and deallocate VM1"
  answer: D
  explanation: |
    D releases the VM allocation before the encryption update. A guest restart does not deallocate it; BitLocker and SAS tokens do not enable host encryption.
    
    [Microsoft Learn](https://learn.microsoft.com/en-us/azure/virtual-machines/windows/disks-enable-host-based-encryption-powershell)

- id: 817
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  question: |
    VM1 has been deallocated and meets all encryption-at-host prerequisites. You need to enable the feature by using Azure CLI. Which command should you run?
  choices:
    A: "az vm update -g RG1 -n VM1 --set securityProfile.encryptionAtHost=true"
    B: "az vm update -g RG1 -n VM1 --set storageProfile.osDisk.caching=ReadOnly"
    C: "az vm encryption enable -g RG1 -n VM1 --disk-encryption-keyvault Vault1"
    D: "az vm update -g RG1 -n VM1 --set diagnosticsProfile.bootDiagnostics.enabled=true"
  answer: A
  explanation: |
    A updates the host-encryption property. C enables Azure Disk Encryption; cache mode and boot diagnostics do not switch on encryption at host.
    
    [Microsoft Learn](https://learn.microsoft.com/en-us/azure/virtual-machines/linux/disks-enable-host-based-encryption-cli)

- id: 818
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  question: |
    You manage VM1 by using Azure PowerShell. VM1 is deallocated, has a supported size, and meets the subscription prerequisites. You retrieve it into $vm by using Get-AzVM. Which command enables encryption at host?
  choices:
    A: "Set-AzVMDiskEncryptionExtension -ResourceGroupName RG1 -VMName VM1"
    B: "Update-AzVM -ResourceGroupName RG1 -VM $vm -EncryptionAtHost $true"
    C: "Start-AzVM -ResourceGroupName RG1 -Name VM1"
    D: "Set-AzVMOSDisk -VM $vm -Caching ReadOnly"
  answer: B
  explanation: |
    B changes the host-encryption setting. The encryption extension implements ADE; starting a VM or changing cache mode does not configure this setting.
    
    [Microsoft Learn](https://learn.microsoft.com/en-us/azure/virtual-machines/windows/disks-enable-host-based-encryption-powershell)

- id: 819
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  question: |
    You deployed VM1 with encryption at host. You need to verify the VM setting by using Azure CLI. Which query should you use with az vm show -g RG1 -n VM1?
  choices:
    A: "--query storageProfile.osDisk.diskSizeGb"
    B: "--query hardwareProfile.vmSize"
    C: "--query securityProfile.encryptionAtHost"
    D: "--query diagnosticsProfile.bootDiagnostics.enabled"
  answer: C
  explanation: |
    C reads the actual host-encryption setting. Disk capacity, VM size, and diagnostics are separate properties and cannot confirm that it is enabled.
    
    [Microsoft Learn](https://learn.microsoft.com/en-us/azure/virtual-machines/linux/disks-enable-host-based-encryption-cli)

- id: 820
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  question: |
    You plan to enable encryption at host on an older VM size. You inspect the regional Microsoft.Compute resource SKU capabilities. Which capability must have the value True?
  choices:
    A: "PremiumIO"
    B: "AcceleratedNetworkingEnabled"
    C: "UltraSSDAvailable"
    D: "EncryptionAtHostSupported"
  answer: D
  explanation: |
    D explicitly identifies size support for host encryption. Premium storage, accelerated networking, and Ultra Disk support test different capabilities.
    
    [Microsoft Learn](https://learn.microsoft.com/en-us/azure/virtual-machines/linux/disks-enable-host-based-encryption-cli)

- id: 821
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  question: |
    You create VM1 in the Azure portal. Its size supports encryption at host, the subscription feature is registered, and platform-managed keys are acceptable. Where should you enable encryption at host during creation?
  choices:
    A: "The Disks tab of the VM creation workflow"
    B: "The inbound port rules on the Networking tab"
    C: "The Access control (IAM) page of a storage account"
    D: "The backup policy in a Recovery Services vault"
  answer: A
  explanation: |
    A contains the host-encryption selection. Networking, storage RBAC, and backup settings cannot substitute for the VM disk-security setting.
    
    [Microsoft Learn](https://learn.microsoft.com/en-us/azure/virtual-machines/disks-enable-host-based-encryption-portal)

- id: 822
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  question: |
    You plan to deploy VM1 with encryption at host and platform-managed keys only. The subscription feature is registered and the VM size is supported. Solution: You enable encryption at host without creating an Azure Key Vault or a disk encryption set. Does this meet the goal?
  choices:
    A: "Yes"
    B: "No"
  answer: A
  explanation: |
    Yes. A customer key store and disk encryption set are needed for customer-managed keys, rather than the platform-managed-key configuration specified here.
    
    [Microsoft Learn](https://learn.microsoft.com/en-us/azure/virtual-machines/windows/disks-enable-host-based-encryption-powershell)

- id: 823
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  question: |
    You plan to deploy VM1 with encryption at host. The OS and data disk caches must use your own key in Azure Key Vault. Which two actions should you perform? Each correct answer presents part of the solution. Choose two.
  choices:
    A: "Create a disk encryption set referencing the key and authorize its identity to use the key"
    B: "Enable Azure Disk Encryption on the same VM"
    C: "Store the key in a storage-account access key setting"
    D: "Associate the OS and data managed disks with the disk encryption set"
    E: "Create a Recovery Services vault"
  answer: AD
  explanation: |
    A and D connect the managed disks and their caches to the customer key. ADE is incompatible; storage-account keys and backup vaults serve different purposes.
    
    [Microsoft Learn](https://learn.microsoft.com/en-us/azure/virtual-machines/disks-enable-host-based-encryption-portal)

- id: 824
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  question: |
    VM1 uses encryption at host. Its OS and data managed disks use a customer-managed key through a disk encryption set. VM1 also has a temporary disk. Which key encrypts the temporary disk?
  choices:
    A: "The customer-managed key used by the OS disk"
    B: "The administrator password of VM1"
    C: "A platform-managed key"
    D: "A storage-account access key"
  answer: C
  explanation: |
    C is correct: temporary-disk encryption uses platform-managed keys even when managed-disk caches use a customer-managed key. Passwords and access keys are not disk-encryption keys.
    
    [Microsoft Learn](https://learn.microsoft.com/en-us/azure/virtual-machines/disks-enable-host-based-encryption-portal)

- id: 825
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  question: |
    You enable encryption at host on VM1. Its OS disk uses a platform-managed key and its data disk uses a customer-managed key. Which statement describes encryption of the disk caches?
  choices:
    A: "Both caches must use the customer-managed key"
    B: "Each cache uses the key-management type selected for its corresponding disk"
    C: "Both caches use the VM administrator password"
    D: "The data disk cache remains unencrypted"
  answer: B
  explanation: |
    B is correct: cache key management follows its corresponding disk. Mixed disk key types do not force one key type on both caches.
    
    [Microsoft Learn](https://learn.microsoft.com/en-us/azure/virtual-machines/disk-encryption)

- id: 826
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  question: |
    VM1 currently uses Azure Disk Encryption. Its VM size supports encryption at host. Solution: You enable encryption at host on VM1 while retaining Azure Disk Encryption. Does this meet the goal of configuring encryption at host?
  choices:
    A: "Yes"
    B: "No"
  answer: B
  explanation: |
    No. Encryption at host and ADE cannot be enabled together on this VM. Supported size alone does not remove the incompatibility.
    
    [Microsoft Learn](https://learn.microsoft.com/en-us/azure/virtual-machines/windows/disks-enable-host-based-encryption-powershell)

- id: 827
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  question: |
    VM1 previously used Azure Disk Encryption. You removed the encryption extension and disabled ADE. You want to enable encryption at host on the same VM. Solution: You deallocate VM1 and set encryptionAtHost to true. Does this meet the goal?
  choices:
    A: "Yes"
    B: "No"
  answer: B
  explanation: |
    No. The documented restriction includes VMs that ever had ADE enabled. Removing the extension does not remove that history; plan a supported replacement deployment.
    
    [Microsoft Learn](https://learn.microsoft.com/en-us/azure/virtual-machines/windows/disks-enable-host-based-encryption-powershell)

- id: 828
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  question: |
    You have a Flexible virtual machine scale set named VMSS1 with two existing instances. No instance has used Azure Disk Encryption. You enable encryption at host in the scale-set model and create a third instance. Which statement is correct?
  choices:
    A: "All existing instances are immediately encrypted without any allocation change"
    B: "Only the oldest instance is automatically encrypted"
    C: "Encryption at host cannot be used with any scale set"
    D: "The new instance is automatically encrypted; existing instances require deallocation and reallocation"
  answer: D
  explanation: |
    D distinguishes model changes from existing allocations. New instances inherit host encryption; the existing instances require deallocation and reallocation to apply it.
    
    [Microsoft Learn](https://learn.microsoft.com/en-us/azure/virtual-machines/windows/disks-enable-host-based-encryption-powershell)

- id: 829
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  question: |
    You deploy VM1 with encryption at host enabled. An application is sensitive to guest CPU usage. Which statement correctly describes where disk encryption is performed?
  choices:
    A: "Inside the guest by BitLocker for every operating system"
    B: "On the Azure host without consuming VM1 guest CPU for the encryption"
    C: "Inside the application by its TLS library"
    D: "Only in Azure Key Vault, which stores every disk block"
  answer: B
  explanation: |
    B is correct: host encryption does not consume the guest CPU. BitLocker is guest encryption; TLS handles traffic; Key Vault stores keys rather than disk blocks.
    
    [Microsoft Learn](https://learn.microsoft.com/en-us/azure/virtual-machines/disk-encryption)

- id: 830
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  question: |
    You plan to use encryption at host with customer-managed keys for VM1. Vault1 stores the key and has soft delete enabled. Purge protection is disabled. Which additional Vault1 setting is required for managed-disk customer-managed encryption?
  choices:
    A: "Enable purge protection"
    B: "Enable anonymous public access"
    C: "Configure a blob lifecycle rule"
    D: "Create an Azure Files snapshot"
  answer: A
  explanation: |
    A prevents permanent key deletion during retention and is required for this configuration. Public access, blob rules, and file snapshots do not protect the Key Vault key.
    
    [Microsoft Learn](https://learn.microsoft.com/en-us/azure/virtual-machines/disks-enable-customer-managed-keys-portal)

- id: 831
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  question: |
    VM1 uses encryption at host and customer-managed keys for its managed disks. DES1 is a disk encryption set with a system-assigned managed identity. Vault1 uses the access-policy permission model. DES1 cannot access the key. Which principal and key permissions should you configure?
  choices:
    A: "VM1 administrator account with secret list permission"
    B: "DES1 managed identity with get, wrapKey, and unwrapKey permissions"
    C: "The storage account identity with blob read permission"
    D: "The subscription billing administrator with certificate import permission"
  answer: B
  explanation: |
    B authorizes the disk encryption set to use the key. Secret, blob, and certificate permissions do not grant the required key operations to DES1.
    
    [Microsoft Learn](https://learn.microsoft.com/en-us/azure/virtual-machines/windows/disks-enable-host-based-encryption-powershell)

# Additional coverage gaps: 2025 soft-delete coverage and continuing Bicep/Container Apps objectives.
- id: 832
  skill: Implement and manage storage
  sub-skill: Configure Azure Files and Azure Blob Storage
  question: |
    You have a Standard StorageV2 account named storage1 with hierarchical namespace and blob versioning disabled. You must recover individual blobs accidentally deleted during the previous 14 days. Which setting should you enable before a deletion occurs?
  choices:
    A: "Container soft delete with a 14-day retention period"
    B: "Blob soft delete with a 14-day retention period"
    C: "An Azure Files share snapshot"
    D: "A lifecycle rule that deletes blobs after 14 days"
  answer: B
  explanation: |
    B retains deleted blobs for recovery. Container soft delete protects whole-container deletion; file snapshots protect shares; lifecycle deletion does not provide the requested recovery protection.
    
    [Microsoft Learn](https://learn.microsoft.com/en-us/azure/storage/blobs/soft-delete-blob-overview)

- id: 833
  skill: Implement and manage storage
  sub-skill: Configure Azure Files and Azure Blob Storage
  question: |
    storage1 has blob soft delete enabled but container soft delete disabled. An administrator deletes container1, including its blobs. Solution: You use blob soft delete to recover container1 and all its contents. Does this meet the goal?
  choices:
    A: "Yes"
    B: "No"
  answer: B
  explanation: |
    No. Blob soft delete alone does not protect container deletion. Container soft delete must have been enabled before the container was deleted.
    
    [Microsoft Learn](https://learn.microsoft.com/en-us/azure/storage/blobs/soft-delete-container-overview)

- id: 834
  skill: Implement and manage storage
  sub-skill: Configure Azure Files and Azure Blob Storage
  question: |
    You manage storage1 in the Azure portal. You need to retain accidentally deleted containers for 30 days. Which action should you take?
  choices:
    A: "Under Data protection, enable soft delete for containers and set retention to 30 days"
    B: "Set the default blob access tier to Cool"
    C: "Create a lifecycle rule that deletes containers after 30 days"
    D: "Enable soft delete for Azure file shares only"
  answer: A
  explanation: |
    A configures container recovery. Access tiers manage costs; lifecycle rules and file-share soft delete do not establish container-deletion protection.
    
    [Microsoft Learn](https://learn.microsoft.com/en-us/azure/storage/blobs/soft-delete-container-overview)

- id: 835
  skill: Implement and manage storage
  sub-skill: Configure Azure Files and Azure Blob Storage
  question: |
    storage1 has hierarchical namespace and versioning disabled. Blob soft delete retains deleted blobs for seven days. An administrator deletes report.csv. Two days later you display deleted blobs in the portal. What should you do to recover report.csv?
  choices:
    A: "Regenerate a storage-account access key"
    B: "Change the access tier to Hot"
    C: "Select report.csv and use Undelete"
    D: "Enable container soft delete now"
  answer: C
  explanation: |
    C restores the deleted blob while retention is active. Key rotation and tier changes do not restore it; enabling container protection afterward does not recover this individual deletion.
    
    [Microsoft Learn](https://learn.microsoft.com/en-us/azure/storage/blobs/soft-delete-blob-manage)

- id: 836
  skill: Implement and manage storage
  sub-skill: Configure Azure Files and Azure Blob Storage
  question: |
    storage1 uses a flat namespace, with blob versioning disabled and blob soft delete enabled. An application overwrites an existing block blob by using Put Blob. You need its earlier contents. Which two actions should you perform within retention? Choose two.
  choices:
    A: "Call Undelete Blob to restore the soft-deleted snapshot"
    B: "Delete the storage account"
    C: "Enable versioning now and select a version created before the overwrite"
    D: "Copy or promote the restored snapshot over the base blob"
    E: "Change the account redundancy to GRS"
  answer: AD
  explanation: |
    A restores the snapshot captured by the overwrite; D promotes its contents. Enabling versioning later cannot create a historical version; deletion and redundancy changes do not roll back the blob.
    
    [Microsoft Learn](https://learn.microsoft.com/en-us/azure/storage/blobs/soft-delete-blob-manage)

- id: 837
  skill: Implement and manage storage
  sub-skill: Configure Azure Files and Azure Blob Storage
  question: |
    storage1 has blob versioning and blob soft delete enabled. You delete the current blob named data.csv, leaving a previous version. You need to make that previous version accessible again as the current blob. What should you do?
  choices:
    A: "Only call Undelete Blob and assume it recreates the current blob"
    B: "Select the required previous version and choose Make current version"
    C: "Disable blob versioning"
    D: "Enable container soft delete"
  answer: B
  explanation: |
    B promotes the selected version. With versioning enabled, Undelete restores soft-deleted versions or snapshots, but does not restore the base blob as current. The other settings do not promote a version.
    
    [Microsoft Learn](https://learn.microsoft.com/en-us/azure/storage/blobs/soft-delete-blob-manage)

- id: 838
  skill: Implement and manage storage
  sub-skill: Configure Azure Files and Azure Blob Storage
  question: |
    container1 was deleted when container soft-delete retention was seven days. Two days later you change retention to 30 days. No other protection is configured. You attempt to recover the original container ten days after its deletion. Can the retention change make that container recoverable?
  choices:
    A: "Yes, all previously deleted containers receive the new retention period"
    B: "Yes, changing retention restarts the deletion timer"
    C: "No, the original deletion keeps its seven-day retention period"
    D: "No, container soft delete never permits retention changes"
  answer: C
  explanation: |
    C is correct: retention changes are not retroactive. The original deletion expires under its original policy; later deletions use the new retention. Policies can be changed.
    
    [Microsoft Learn](https://learn.microsoft.com/en-us/azure/storage/blobs/soft-delete-container-overview)

- id: 839
  skill: Implement and manage storage
  sub-skill: Configure Azure Files and Azure Blob Storage
  question: |
    storage1 has blob and container soft delete enabled. Your requirement is to prevent an administrator from accidentally deleting the storage account through Azure Resource Manager. Which additional control should you configure?
  choices:
    A: "Increase blob soft-delete retention to 365 days"
    B: "Enable blob versioning"
    C: "Change the default tier to Archive"
    D: "Apply a CanNotDelete resource lock to the storage account"
  answer: D
  explanation: |
    D blocks management-plane account deletion. Blob/container soft delete and versioning protect data operations within an existing account, while Archive is an access tier.
    
    [Microsoft Learn](https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources)

- id: 840
  skill: Deploy and manage Azure compute resources
  sub-skill: Automate deployment of resources by using Azure Resource Manager (ARM) templates or Bicep files
  question: |
    You have an ARM template named main.json. You need to generate a Bicep source file from it for review and further editing. Which command should you run?
  choices:
    A: "az bicep build --file main.json"
    B: "az deployment group create --resource-group RG1 --template-file main.json"
    C: "az bicep decompile --file main.json"
    D: "az group export --name RG1"
  answer: C
  explanation: |
    C converts ARM JSON to Bicep. Build converts in the opposite direction; deployment creates resources; export retrieves an ARM template rather than decompiling the local file. Review conversion warnings.
    
    [Microsoft Learn](https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/decompile)

- id: 841
  skill: Deploy and manage Azure compute resources
  sub-skill: Automate deployment of resources by using Azure Resource Manager (ARM) templates or Bicep files
  question: |
    You have the following Bicep declarations:
    
    ```bicep
    @allowed([
      'Standard_LRS'
      'Standard_ZRS'
    ])
    param storageSku string = 'Standard_LRS'
    ```
    
    The storage resource uses storageSku as sku.name. A deployment passes storageSku=Standard_GRS. What happens?
  choices:
    A: "The parameter value is rejected because it is outside the allowed values"
    B: "The default Standard_LRS silently overrides the supplied value"
    C: "The template automatically converts Standard_GRS to Standard_ZRS"
    D: "The allowed decorator affects only the editor; deployment accepts any string"
  answer: A
  explanation: |
    A is correct: the parameter constraint excludes Standard_GRS. A supplied value does not silently revert to the default or get converted to a different SKU.
    
    [Microsoft Learn](https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/parameters)

- id: 842
  skill: Deploy and manage Azure compute resources
  sub-skill: Automate deployment of resources by using Azure Resource Manager (ARM) templates or Bicep files
  question: |
    You have the following Bicep resource in a resource-group-scoped file:
    
    ```bicep
    param accountName string
    resource stg 'Microsoft.Storage/storageAccounts@2023-05-01' = {
      name: accountName
      location: resourceGroup().location
      kind: 'StorageV2'
      sku: {
        name: 'Standard_LRS'
      }
      properties: {}
    }
    ```
    
    You must deploy the new account with zone-redundant storage. Which edit should you make?
  choices:
    A: "Change kind to 'Standard_ZRS'"
    B: "Change sku.name to 'Standard_ZRS'"
    C: "Change location to 'Standard_ZRS'"
    D: "Rename the symbolic name stg to Standard_ZRS"
  answer: B
  explanation: |
    B changes the storage redundancy SKU. kind selects account type; location selects region; the symbolic resource name is a source-code reference. The target region must support ZRS.
    
    [Microsoft Learn](https://learn.microsoft.com/en-us/azure/storage/common/storage-account-create)

- id: 843
  skill: Deploy and manage Azure compute resources
  sub-skill: Automate deployment of resources by using Azure Resource Manager (ARM) templates or Bicep files
  question: |
    main.bicep is resource-group scoped and declares a storage account. RG1 already exists. You need to deploy the file to RG1 by using Azure CLI. Which command should you run?
  choices:
    A: "az bicep build --file main.bicep"
    B: "az deployment sub create --location eastus --template-file main.bicep"
    C: "az group create --name RG1 --location eastus"
    D: "az deployment group create --resource-group RG1 --template-file main.bicep"
  answer: D
  explanation: |
    D submits the resource-group deployment. Build only compiles the file, a subscription deployment targets a different scope, and creating RG1 does not deploy the storage resource.
    
    [Microsoft Learn](https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/deploy-cli)

- id: 844
  skill: Deploy and manage Azure compute resources
  sub-skill: Automate deployment of resources by using Azure Resource Manager (ARM) templates or Bicep files
  question: |
    You have a subscription-scoped Bicep file:
    
    ```bicep
    targetScope = 'subscription'
    resource rg 'Microsoft.Resources/resourceGroups@2022-09-01' existing = {
      name: 'RG1'
    }
    module storage './storage.bicep' = {
      name: 'storageDeployment'
      scope: rg
      params: {
        accountName: 'stcontoso2026example'
      }
    }
    ```
    
    storage.bicep is resource-group scoped and declares a storage account. RG1 exists in the current subscription. Where is the account deployed?
  choices:
    A: "Directly at subscription scope without a resource group"
    B: "To a new resource group named storageDeployment"
    C: "Into RG1"
    D: "Into a resource group named stcontoso2026example"
  answer: C
  explanation: |
    C follows the module scope rg. The module name identifies its deployment, and accountName names the storage account. Neither creates or selects a different resource group.
    
    [Microsoft Learn](https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/modules)

- id: 845
  skill: Deploy and manage Azure compute resources
  sub-skill: Automate deployment of resources by using Azure Resource Manager (ARM) templates or Bicep files
  question: |
    You have a resource-group-scoped Bicep file containing:
    
    ```bicep
    param location string = resourceGroup().location
    resource stg 'Microsoft.Storage/storageAccounts@2023-05-01' = {
      name: 'stcontoso2026example'
      location: location
      kind: 'StorageV2'
      sku: {
        name: 'Standard_LRS'
      }
      properties: {}
    }
    ```
    
    RG1 has location eastus. You deploy into RG1 and explicitly pass location=westus2. Which statement is correct?
  choices:
    A: "The account belongs to RG1 and is deployed in westus2"
    B: "The account belongs to RG1 and must be deployed in eastus"
    C: "A resource group named westus2 is automatically created"
    D: "The parameter changes RG1 location to westus2"
  answer: A
  explanation: |
    A is correct: the explicit parameter overrides its default. A resource can reside in a different region from its resource group; the parameter neither creates nor relocates that group.
    
    [Microsoft Learn](https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/parameters)

- id: 846
  skill: Deploy and manage Azure compute resources
  sub-skill: Provision and manage containers in the Azure portal
  question: |
    You have a Consumption-plan container app named api1 with HTTP ingress and an HTTP scale rule. It uses single revision mode. You need at least one replica to remain running during normal operation when no requests arrive. Which setting should you configure?
  choices:
    A: "Set minReplicas to 0"
    B: "Set maxReplicas to 1 and leave minReplicas at 0"
    C: "Remove HTTP ingress"
    D: "Set minReplicas to 1"
  answer: D
  explanation: |
    D sets the running-replica floor. A permits scale-to-zero; B sets only the ceiling; removing ingress does not establish a minimum running replica.
    
    [Microsoft Learn](https://learn.microsoft.com/en-us/azure/container-apps/scale-app)

- id: 847
  skill: Deploy and manage Azure compute resources
  sub-skill: Provision and manage containers in the Azure portal
  question: |
    api1 is a Consumption-plan container app with HTTP ingress, single revision mode, and an HTTP scale rule. It must be able to scale to zero when idle and have a configured maximum of five replicas per revision. Which settings meet the requirement?
  choices:
    A: "minReplicas: 1; maxReplicas: 5"
    B: "minReplicas: 0; maxReplicas: 5"
    C: "minReplicas: 5; maxReplicas: 5"
    D: "minReplicas: 0; maxReplicas: 1"
  answer: B
  explanation: |
    B allows an idle floor of zero and a configured ceiling of five. The other configurations either retain running replicas or cap scaling at one. Temporary maintenance replicas can exceed the normal ceiling.
    
    [Microsoft Learn](https://learn.microsoft.com/en-us/azure/container-apps/scale-app)

- id: 848
  skill: Deploy and manage Azure compute resources
  sub-skill: Provision and manage containers in the Azure portal
  question: |
    You have this scale configuration for a container app with HTTP ingress:
    
    ```json
    {
      "minReplicas": 0,
      "maxReplicas": 6,
      "rules": [{
        "name": "http-scale",
        "http": {
          "metadata": {
            "concurrentRequests": "20"
          }
        }
      }]
    }
    ```
    
    You must lower the HTTP scaling threshold to ten concurrent requests. Which property should you modify?
  choices:
    A: "minReplicas"
    B: "maxReplicas"
    C: "rules[0].http.metadata.concurrentRequests"
    D: "The ingress targetPort"
  answer: C
  explanation: |
    C configures the concurrency threshold. Minimum and maximum replicas set bounds; targetPort selects the application listening port. None of those controls the HTTP scaling threshold.
    
    [Microsoft Learn](https://learn.microsoft.com/en-us/azure/container-apps/scale-app)

- id: 849
  skill: Deploy and manage Azure compute resources
  sub-skill: Provision and manage containers in the Azure portal
  question: |
    You deploy a continuously running queue-worker container app using the Consumption plan. It has no HTTP ingress, uses single revision mode, and must scale from zero when messages arrive in an Azure Storage queue. Which scaling rule should you configure?
  choices:
    A: "An Azure Storage queue event scale rule with the required queue metadata and authentication"
    B: "Only an HTTP concurrency rule"
    C: "Only a CPU-utilization rule with minReplicas set to 0"
    D: "An App Service plan autoscale rule"
  answer: A
  explanation: |
    A polls the queue independently of running replicas. HTTP does not observe queue depth; CPU alone cannot wake zero replicas. App Service autoscale targets a different hosting service.
    
    [Microsoft Learn](https://learn.microsoft.com/en-us/azure/container-apps/scale-app)

- id: 850
  skill: Deploy and manage Azure compute resources
  sub-skill: Provision and manage containers in the Azure portal
  question: |
    You have a queue-triggered container app with HTTP ingress disabled. You use the Azure Storage queue scaler with connection-string authentication. The connection string is stored in an app secret named queue-connection. What should the scale rule authentication entry reference?
  choices:
    A: "The container image tag"
    B: "The environment name"
    C: "The ingress target port"
    D: "The queue-connection secret, mapped to the scaler connection parameter"
  answer: D
  explanation: |
    D supplies credentials to the scaler through its secret reference. Image tags, environment names, and ingress ports do not authenticate queue polling. Managed-identity authentication is a separate supported approach.
    
    [Microsoft Learn](https://learn.microsoft.com/en-us/azure/container-apps/scale-app)

- id: 851
  skill: Deploy and manage Azure compute resources
  sub-skill: Provision and manage containers in the Azure portal
  question: |
    You deploy a container app on the Consumption plan with two tightly coupled containers. The application container requests 0.25 vCPU and 0.5 GiB memory. Its sidecar requests 0.25 vCPU and 0.5 GiB memory. Which statement correctly evaluates the allocation for each replica?
  choices:
    A: "Only the application container counts; the replica uses 0.25 vCPU and 0.5 GiB"
    B: "The combined allocation is 0.5 vCPU and 1 GiB, a supported Consumption combination"
    C: "Each container must request at least 1 vCPU"
    D: "The containers must run in separate replicas because sidecars are unsupported"
  answer: B
  explanation: |
    B adds both containers in one replica. Consumption sizing validates the total allocation; sidecars count toward it and can share a replica. A one-vCPU minimum is not required.
    
    [Microsoft Learn](https://learn.microsoft.com/en-us/azure/container-apps/containers)

