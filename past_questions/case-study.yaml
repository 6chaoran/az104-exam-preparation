    - id: '004'
      skill: Implement and manage storage
      sub-skill: Configure access to storage
      question: |
        You need to ensure that you can grant Group4 Azure RBAC read-only
        permissions to all the Azure file shares.

        What should you do?
      choices:
        A: On storage2, enable identity-based access for the file shares.
        B: Recreate storage2 and set Hierarchical namespace to Enabled.
        C: On storage1 and storage4, change the Account kind type to StorageV2 (general purpose v2).
        D: Create a shared access signature (SAS) for storage1, storage2, and storage4.
      answer: A
      user_answer: A
      user_result: correct
      learning_note: |
        Storage File Data SMB Share Reader grants read-only file data access.
        The generic Reader role only grants access to resource configuration.
      explanation: |
        Enable identity-based access on storage2. Storage1 and storage4 already
        have Azure AD DS identity-based access enabled, while storage2 has it
        disabled. This enables identity-based SMB access with Azure RBAC
        share-level permissions across the existing file shares.

        Grant Group4 Storage File Data SMB Share Reader at the required share
        scopes for least privilege. File and directory ACLs must also permit
        access. The generic Reader role does not grant file data access.

        B configures a Data Lake Storage feature rather than Azure Files SMB
        authentication. C does not enable identity-based access, and changing
        storage1 or storage4 is unnecessary. D grants token-based access rather
        than assigning Azure RBAC permissions to Group4.

        Azure AD and Azure AD DS are now named Microsoft Entra ID and Microsoft
        Entra Domain Services, respectively.

        [Microsoft Learn: Assign Azure Files share-level permissions](https://learn.microsoft.com/en-us/azure/storage/files/storage-files-identity-assign-share-level-permissions)

    - id: '005'
      skill: Implement and manage storage
      sub-skill: Configure Azure Files and Azure Blob Storage
      question: |
        HOTSPOT -

        You need to create container1 and share1.

        Which storage accounts should you use for each resource? Select the
        appropriate options in the answer area. Each correct selection is
        worth one point.
      choices:
        container1:
          - storage2 only
          - storage2 and storage3 only
          - storage1, storage2, and storage3 only
          - storage2, storage3, and storage4 only
          - storage1, storage2, storage3, and storage4
        share1:
          - storage2 only
          - storage4 only
          - storage2 and storage4 only
          - storage1, storage2, and storage4 only
          - storage1, storage2, storage3, and storage4
      answer:
        container1: storage2 and storage3 only
        share1: storage2 only
      user_answer:
        container1: storage2 only
        share1: storage2 only
      user_result: partially_correct
      user_reasoning: Selected storage2 for container1 because general-purpose v2 supports the Cool access tier; also selected storage2 for share1.
      learning_note: |
        Both general-purpose v2 and legacy BlobStorage accounts support Cool
        blobs. Cool Azure file shares require the standard general-purpose v2
        account among the account types listed in this scenario.
      explanation: |
        container1: storage2 and storage3 only.
        share1: storage2 only.

        The planned changes require the Cool storage tier. Evaluate both the
        resource type and its tier, rather than merely whether an account can
        contain blobs or file shares.

        | Account | Kind in the exhibit | Cool blobs | Cool file shares |
        | --- | --- | --- | --- |
        | storage1 | Storage (general purpose v1) | No | No |
        | storage2 | StorageV2 (general purpose v2) | Yes | Yes |
        | storage3 | BlobStorage | Yes | No; does not host file shares |
        | storage4 | FileStorage | No; does not host blobs | No; premium file shares |

        Storage2 supports both resources with the required tiers. Storage3
        also supports Cool blobs, so it is eligible for container1. The Cool
        tier applies to the blobs in the container, rather than to the container
        object itself. Storage1 can host blobs and file shares but does not
        provide the required Cool tiers in its stated GPv1 configuration.
        Storage4 hosts premium file shares rather than Cool file shares.

        The supplied container1 answer is corrected to include storage3.
        The share1 answer is correct. Use the account kinds as shown in this
        historical exhibit; upgrading a legacy account would change its
        capabilities and is not requested by the question.

        [Microsoft Learn: Blob access tiers](https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview)
        [Microsoft Azure: Blob Storage tiers and account types](https://azure.microsoft.com/en-us/pricing/details/storage/blobs/)
        [Microsoft Learn: Azure Files billing and access tiers](https://learn.microsoft.com/en-us/azure/storage/files/understanding-billing)

    - id: '006'
      skill: Implement and manage storage
      sub-skill: Configure and manage storage accounts
      question: |
        HOTSPOT -

        You need to create storage5. The solution must support the planned changes.

        Which type of storage account should you use, and which account should
        you configure as the destination storage account? Select the appropriate
        options in the answer area. Each correct selection is worth one point.
      choices:
        Account kind:
          - BlobStorage
          - BlockBlobStorage
          - Storage (general purpose v1)
          - StorageV2 (general purpose v2)
        Destination:
          - Storage1
          - Storage2
          - Storage3
          - Storage4
      answer:
        Account kind: StorageV2 (general purpose v2)
        Destination: Storage2
      user_answer:
        Account kind: StorageV2 (general purpose v2)
        Destination: Storage2
      user_result: correct
      learning_note: |
        Object replication copies block blobs between storage accounts. Both
        accounts must support object replication; supporting Cool blobs alone
        is insufficient. Current support includes GPv2 and premium BlockBlobStorage.
      explanation: |
        Expected historical selections: StorageV2 (general purpose v2) for
        storage5 and Storage2 as the destination. The learner's selections
        match these answers.

        The requirement to configure replication for the Blob service with a
        destination storage account refers to object replication. Storage2 is
        GPv2 and supports object replication. Storage1 is GPv1, storage3 is
        legacy BlobStorage, and storage4 is FileStorage; none supports object
        replication in the configuration shown. Storage3 can store Cool blobs
        but that does not make it a supported object replication destination.

        Enable blob versioning on both source and destination accounts and
        change feed on the source account. Configure replication rules for the
        source and destination containers. Object replication is asynchronous
        and applies to block blobs; it differs from account redundancy such
        as GRS, whose secondary location is managed by Azure.

        Currency caveat: current Microsoft documentation supports both GPv2
        and premium block blob (BlockBlobStorage) accounts as sources and
        destinations. Therefore BlockBlobStorage is also technically valid for
        storage5 under current rules, given the requirements supplied. The
        prompt does not state a standard-performance or cost constraint that
        would exclude it. StorageV2 remains valid and is the expected historical
        selection, but the account-kind dropdown is ambiguous under current
        support. Storage2 remains the only eligible destination listed.

        [Microsoft Learn: Object replication overview](https://learn.microsoft.com/en-us/azure/storage/blobs/object-replication-overview)
        [Microsoft Learn: Configure object replication](https://learn.microsoft.com/en-us/azure/storage/blobs/object-replication-configure)

    - id: '007'
      skill: Monitor and maintain Azure resources
      sub-skill: Monitor resources in Azure
      question: |
        You need to identify which storage account to use for the flow logging
        of IP traffic from VM5. The solution must meet the retention requirements.

        Which storage account should you identify?
      choices:
        A: storage1
        B: storage2
        C: storage3
        D: storage4
      answer: B
      user_answer: B
      user_result: correct
      user_reasoning: Selected storage2 because it is in the same region as VM5.
      learning_note: |
        Check both region and account kind. For the historical NSG flow-log
        retention feature, use a GPv2 storage account in the NSG's region.
        East US and East US 2 are different regions.
      explanation: |
        B. storage2 is correct. VM5 is in East US, and storage2 is a
        StorageV2 (general purpose v2) account in East US. It meets both the
        regional requirement and the eight-month retention requirement.

        In the historical NSG flow-log solution, the storage account must be
        in the same region as the network security group being logged.
        Built-in retention is available only with general-purpose v2 accounts
        and supports a retention period of up to one year, covering eight months.
        The learner's region reasoning is correct; GPv2 retention support is
        the additional decisive requirement.

        A is a GPv1 account in West US. C is legacy BlobStorage in East US 2,
        which is a different region from East US, and does not support the
        required built-in retention feature. D is FileStorage in Central US
        and does not provide the required blob storage destination.

        The scenario initially has no NSG associated with VM5 or its subnet.
        The historical NSG flow-log implementation would also require an NSG
        associated with VM5's network interface or subnet; this question only
        asks which storage account to select.

        Current deployments should use virtual network flow logs. Creation of
        new NSG flow logs is no longer supported, and NSG flow logs retire on
        September 30, 2027. Storage2 remains appropriate for the current flow-log
        solution and its retention configuration.

        [Microsoft Learn: NSG flow logs and retention](https://learn.microsoft.com/en-us/azure/network-watcher/nsg-flow-logs-overview)
        [Microsoft Learn: Manage virtual network flow logs](https://learn.microsoft.com/en-us/azure/network-watcher/vnet-flow-logs-manage)

    - id: '008'
      skill: Implement and manage virtual networking
      sub-skill: Configure secure access to virtual networks
      question: |
        HOTSPOT -

        You implement the planned changes for NSG1 and NSG2.

        For each of the following statements, select Yes if the statement is
        true. Otherwise, select No.
      choices:
        From VM1, you can establish a Remote Desktop session to VM2.:
          - 'Yes'
          - 'No'
        From VM2, you can ping VM3.:
          - 'Yes'
          - 'No'
        From VM2, you can establish a Remote Desktop session to VM3.:
          - 'Yes'
          - 'No'
      answer:
        From VM1, you can establish a Remote Desktop session to VM2.: 'Yes'
        From VM2, you can ping VM3.: 'Yes'
        From VM2, you can establish a Remote Desktop session to VM3.: 'No'
      user_answer:
        From VM1, you can establish a Remote Desktop session to VM2.: 'Yes'
        From VM2, you can ping VM3.: 'Yes'
        From VM2, you can establish a Remote Desktop session to VM3.: 'No'
      user_result: correct
      user_reasoning: |
        Selected Yes for VM1-to-VM2 RDP because no custom inbound rules block
        VM2 and default virtual network rules allow the connection. Selected
        Yes for VM2-to-VM3 ping because VNET1 and VNET2 are peered and no NSG
        rule blocks ICMP. Selected No for VM2-to-VM3 RDP because VM2 outbound
        RDP traffic is blocked.
      learning_note: |
        NSG2 has default inbound rules even though only custom outbound rules
        are specified. NSGs are stateful, so replies to an allowed session do
        not need an independent allow rule. The custom ICMP allow targets
        10.0.1.0/24; ping to VM3 instead uses default AllowVnetOutBound.
      explanation: |
        Correct selections: Yes, Yes, No.

        VM1 to VM2 Remote Desktop: Yes. NSG1's default outbound rule permits
        the TCP 3389 request from VM1. NSG1's custom RDP deny is inbound to
        VM1, so it does not block this request. NSG2's default AllowVnetInBound
        permits the request into VM2. NSGs are stateful: response traffic for
        the allowed session is permitted, without independently applying the
        outbound deny as if the response were a new RDP connection.

        VM2 to VM3 ping: Yes. VNET1 and VNET2 are directly peered. NSG2's
        priority-200 deny applies to TCP 3389, not ICMP. Its priority-400 ICMP
        allow targets 10.0.1.0/24 and does not match VM3 at 172.16.1.4. The
        default AllowVnetOutBound rule at priority 65000 allows the ping because
        VirtualNetwork includes the directly peered VNET2. VM3 has no NSG.

        VM2 to VM3 Remote Desktop: No. NSG2's priority-200 outbound deny matches
        VM2's source IP 10.0.2.4 within 10.0.0.0/16, TCP destination port 3389,
        and VM3 within the VirtualNetwork service tag. This custom deny takes
        precedence over the default allow at priority 65000. The priority-400
        ICMP rule cannot allow TCP RDP traffic.

        These answers evaluate the Azure network configuration supplied in the
        case study. They assume the guest firewalls and services permit the
        tested traffic; the exhibits do not specify guest firewall restrictions.

        [Microsoft Learn: NSG rules, defaults, and stateful behavior](https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview)
        [Microsoft Learn: VirtualNetwork service tag](https://learn.microsoft.com/en-us/azure/virtual-network/service-tags-overview)


    - id: '009'
      skill: Implement and manage virtual networking
      sub-skill: Configure name resolution and load balancing
      question: |
        You need to add VM1 and VM2 to the backend pool of LB1.

        What should you do first?
      choices:
        A: Connect VM2 to VNET1/Subnet1.
        B: Redeploy VM1 and VM2 to the same availability zone.
        C: Redeploy VM1 and VM2 to the same availability set.
        D: Create a new NSG and associate the NSG to VNET1/Subnet1.
      answer: C
      user_answer: A
      user_result: incorrect
      learning_note: |
        A Basic Load Balancer backend pool requires VMs in a single availability
        set or virtual machine scale set. Sharing a subnet does not replace
        this requirement. Standard Load Balancer allows VMs across availability
        sets and zones within one virtual network.
      explanation: |
        C. Redeploy VM1 and VM2 to the same availability set.

        LB1 is explicitly a Basic internal Load Balancer. Its backend pool
        supports virtual machines in a single availability set or virtual
        machine scale set. No common availability set is specified for VM1
        and VM2, so redeploy them into one before adding them to the pool.
        An existing VM cannot simply be assigned to a different availability
        set; recreation using its existing disks is a typical approach.

        A does not satisfy the Basic SKU availability-set requirement. VM1 and
        VM2 already belong to VNET1, and backend VMs do not need to share the
        frontend's subnet. Subnet1 identifies the location of LB1's private
        frontend IP; it does not require moving VM2 out of Subnet2.
        B confuses availability zones with availability sets; Basic Load
        Balancer does not support availability zones. D changes traffic
        filtering and does not make the VMs eligible for the backend pool.

        The supplied answer A is corrected to C. The decisive keyword is Basic.
        Standard Load Balancer supports backend VMs across availability sets
        and zones within one virtual network.

        This is a historical question: Basic Load Balancer retired on
        September 30, 2025. Current deployments should use Standard Load
        Balancer, which does not require these VMs to share an availability set.

        [Microsoft Learn: Load Balancer SKU comparison](https://learn.microsoft.com/en-us/azure/load-balancer/skus)


    - id: '010'
      skill: Implement and manage virtual networking
      sub-skill: Configure and manage virtual networks in Azure
      question: |
        You need to ensure that VM1 can communicate with VM4. The solution
        must minimize administrative effort.

        What should you do?
      choices:
        A: Create a user-defined route from VNET1 to VNET3.
        B: Create an NSG and associate the NSG to VM1 and VM4.
        C: Assign VM4 an IP address of 10.0.1.5/24.
        D: Establish peering between VNET1 and VNET3.
      answer: D
      user_answer: D
      user_result: correct
      learning_note: |
        Virtual network peering is not transitive. If VNET1 peers with VNET2
        and VNET2 peers with VNET3, VNET1 cannot automatically reach VNET3.
        Direct peering is the simplest solution when transit infrastructure
        is not already present.
      explanation: |
        D. Establish peering between VNET1 and VNET3.

        VM1 belongs to VNET1/Subnet1 and VM4 belongs to VNET3/Subnet1. The
        existing peerings connect VNET1 to VNET2 and VNET2 to VNET3, but peering
        is not transitive. Those connections do not create a route between
        VNET1 and VNET3. Configure direct peering in both directions with
        virtual network access allowed to enable private-IP communication.
        Peered virtual networks must have nonoverlapping address spaces.

        Direct peering minimizes administrative effort because it supplies
        connectivity and routing without adding a router or virtual appliance.
        The supplied answer D is correct.

        A does not establish connectivity by itself. Transit through VNET2
        would require a forwarding device or other transit infrastructure,
        appropriate routes, and forwarding configuration; none is specified.
        B filters traffic but cannot connect isolated virtual networks.
        NSGs are associated with network interfaces or subnets, rather than
        directly with the VM resource. C assigns an address from VM1's subnet
        to a VM attached to VNET3 and does not connect the networks; a private
        NIC address must belong to its attached subnet's address range.

        The planned NSG1 deny targets inbound RDP from 10.0.2.0/24, not VM4's
        192.168.1.4 address. NSG2 is attached to VNET1/Subnet2, not VM1's subnet.
        Therefore those custom rules do not prevent the required general
        connectivity after direct peering. Specific applications still depend
        on guest firewall and service configuration.

        [Microsoft Learn: Peering requirements and nontransitive behavior](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-manage-peering)
        [Microsoft Learn: Virtual network peering overview](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-peering-overview)

- id: 3
  title: Litware, Inc.
  description: |
    Overview

    Litware, Inc. is a consulting company with a main office in Montreal and
    branch offices in Seattle and New York. Montreal has 2,000 employees,
    Seattle has 1,000 employees, and New York has 200 employees.
    All resources used by Litware are hosted on-premises.

    Litware creates a new Azure subscription. Its Azure Active Directory
    (Azure AD) tenant uses litware.onmicrosoft.com and the Premium P1 tier.
    Azure AD is now called Microsoft Entra ID; the historical wording is retained.

    Existing Environment

    The network contains an Active Directory forest named litware.com.
    All domain controllers are DNS servers and host the litware.com DNS zone.

    Litware has finance, human resources, sales, research, and information
    technology departments. Each department has an organizational unit (OU)
    containing all its accounts. All user accounts have the department
    attribute set to their respective department. New users are added frequently.
    Litware.com contains a user named User1.

    All offices connect using private connections. Montreal and Seattle have
    data centers. Each office has a firewall that can be configured as a VPN device.
    All infrastructure servers are virtualized.

    | Name | Role | Contains virtual machine |
    | --- | --- | --- |
    | Server1 | VMware vCenter server | VM1 |
    | Server2 | Hyper-V host | VM2 |

    Litware uses two web applications, App1 and App2. Each instance of each
    application requires 1 GB of memory.
    The Azure subscription contains these resources:

    | Name | Type |
    | --- | --- |
    | VNet1 | Virtual network |
    | VM3 | Virtual machine |
    | VM4 | Virtual machine |

    The network security team implements several network security groups (NSGs).

    Requirements

    Planned Changes

    - Deploy Azure ExpressRoute to the Montreal office.
    - Migrate the virtual machines hosted on Server1 and Server2 to Azure.
    - Synchronize on-premises Active Directory to Azure AD.
    - Migrate App1 and App2 to Azure web apps named WebApp1 and WebApp2.

    Technical Requirements

    - Ensure WebApp1 adjusts its instance count automatically based on load,
      scaling out to five instances.
    - Ensure VM3 can establish outbound TCP connections to port 8080 on the
      application servers in Montreal.
    - Exchange routing information automatically between Azure and the
      routers in Montreal.
    - Enable Azure Multi-Factor Authentication (MFA) for finance users only.
    - Ensure webapp2.azurewebsites.net is accessible using app2.litware.com.
    - Connect the New York office to VNet1 over the Internet using encryption.
    - Create a workflow that sends an email when VM4's settings are modified.
    - Create a custom Azure role named Role1 based on the Reader role.
    - Minimize costs whenever possible.

    Exhibit limitations

    The supplied source references Attachment.tiff, but no additional topology
    was supplied. Question 002 mentions VNET3, which is absent from the shared
    resource table. VM1 and VM4's VNet assignments and the VNets' address spaces
    are not supplied; no missing topology is invented.
  questions:
    - id: '001'
      skill: Monitor and maintain Azure resources
      sub-skill: Monitor resources in Azure
      question: |
        You discover that VM3 does NOT meet the technical requirements.
        You need to verify whether the issue relates to the NSGs.
        What should you use?
      choices:
        A: Diagram in VNet1
        B: Diagnostic settings in Azure Monitor
        C: Diagnose and solve problems in Traffic Manager profiles
        D: The security recommendations in Azure Advisor
        E: IP flow verify in Azure Network Watcher
      answer: E
      user_answer: E
      user_result: correct
      explanation: |
        E. IP flow verify in Azure Network Watcher checks whether security rules
        allow or deny a specified flow to or from a VM and identifies the rule
        responsible. This directly tests whether NSGs block VM3's required flow.

        Select VM3, Outbound, and TCP. Set the local IP to VM3's private IP,
        the local port to an ephemeral source port, the remote IP to the Montreal
        application server's IP, and the remote port to 8080. Port 8080 is the
        destination port, not the client's source port.

        An Allowed result confirms the tested flow passes the security rules;
        it does not prove end-to-end connectivity. Routing, on-premises firewalls,
        and the destination application can still cause failures.

        A displays topology. B configures diagnostic data collection. C addresses
        Traffic Manager rather than VM security rules. D provides recommendations
        rather than evaluating this specific flow.

        [Microsoft Learn: IP flow verify](https://learn.microsoft.com/en-us/azure/network-watcher/ip-flow-verify-overview)

    - id: '002'
      skill: Implement and manage virtual networking
      sub-skill: Configure and manage virtual networks in Azure
      question: |
        You need to ensure that VM1 can communicate with VM4.
        The solution must minimize the administrative effort.
        What should you do?

        The supplied shared exhibit does not show VNET3 or the VNet assignments
        of VM1 and VM4. The expected answer assumes the VMs are in VNET1 and
        VNET3, with non-overlapping address spaces and security rules permitting
        the required traffic.
      choices:
        A: Create an NSG and associate the NSG to VM1 and VM4.
        B: Establish peering between VNET1 and VNET3.
        C: Assign VM4 an IP address of 10.0.1.5/24.
        D: Create a user-defined route from VNET1 to VNET3.
      answer: B
      user_answer: B
      user_result: correct
      learning_note: |
        Peering connects VNets and adds routes automatically. NSGs filter
        traffic; a user-defined route alone cannot connect disconnected VNets.
      explanation: |
        B. Establish VNet peering. Under the stated assumptions, peering enables
        communication between VM1 and VM4 using private IP addresses over the
        Microsoft backbone. Azure adds the necessary peering routes automatically,
        minimizing administrative effort. Configure peering in both directions
        and allow virtual network access; applicable NSGs and guest firewalls
        must also permit the traffic.

        A controls traffic permissions but does not establish network connectivity.
        NSGs are associated with subnets or network interfaces, rather than directly
        with VM resources. C changes an IP address without connecting the VNets.
        D controls routing but does not create a path between disconnected VNets.

        B is the expected answer, but the missing topology prevents independently
        confirming the VMs' placement from the supplied shared scenario.

        [Microsoft Learn: Virtual network peering](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-peering-overview)

    - id: '003'
      skill: Implement and manage virtual networking
      sub-skill: Configure and manage virtual networks in Azure
      question: |
        HOTSPOT -

        You need to meet the connection requirements for the New York office.
        What should you do? Select the appropriate options in the answer area.
        Each correct selection is worth one point.
      choices:
        From the Azure portal:
          - Create an ExpressRoute circuit only.
          - Create a virtual network gateway only.
          - Create a virtual network gateway and a local network gateway.
          - Create an ExpressRoute circuit and an on-premises data gateway.
          - Create a virtual network gateway and an on-premises data gateway.
        In the New York office:
          - Deploy ExpressRoute.
          - Deploy a DirectAccess server.
          - Implement a Web Application Proxy.
          - Configure a site-to-site VPN connection.
      answer:
        From the Azure portal: Create a virtual network gateway and a local network gateway.
        In the New York office: Configure a site-to-site VPN connection.
      user_answer:
        From the Azure portal: Create an ExpressRoute circuit and an on-premises data gateway.
        In the New York office: Configure a site-to-site VPN connection.
      user_result: partially_correct
      learning_note: |
        An encrypted office-to-VNet connection over the Internet requires a
        site-to-site VPN. A local network gateway is an Azure resource representing
        the office network; it is different from an on-premises data gateway.
        Private connectivity and encryption are separate requirements.
      explanation: |
        Select Create a virtual network gateway and a local network gateway
        in Azure, and Configure a site-to-site VPN connection in New York.
        The supplied first selection is corrected; the second selection is correct.

        The requirement explicitly says over the Internet using encryption.
        A site-to-site VPN provides an IPsec/IKE encrypted tunnel between the
        New York firewall configured as a VPN device and Azure's VPN gateway.
        The virtual network gateway is the Azure tunnel endpoint in VNet1.
        The local network gateway is an Azure resource representing the office's
        VPN device public IP address and its network address ranges. Create a
        site-to-site connection resource linking the gateways and configure the
        office VPN device with matching connection settings.

        ExpressRoute provides private connectivity that avoids the public Internet;
        the scenario plans it for Montreal. An on-premises data gateway enables
        supported cloud services to access on-premises data sources and is not a
        network VPN endpoint. DirectAccess and Web Application Proxy do not
        provide the requested office-to-VNet site-to-site connection.

        Follow-up: Would requiring a private connection change the answer?
        If private means traffic protected inside an encrypted tunnel over the
        Internet, the VPN answer remains correct. If it means avoiding the public
        Internet, use ExpressRoute. Connecting a VNet that way requires an
        ExpressRoute circuit and an ExpressRoute virtual network gateway; none
        of the first dropdown's options fully describes that combination.
        An on-premises data gateway is still incorrect. ExpressRoute is not
        encrypted by default, so encryption must be addressed separately if
        both private transport and encryption are required.

        [Microsoft Learn: Create a site-to-site VPN](https://learn.microsoft.com/en-us/azure/vpn-gateway/tutorial-site-to-site-portal)
        [Microsoft Learn: VPN Gateway connectivity options](https://learn.microsoft.com/en-us/azure/vpn-gateway/design)

    - id: '004'
      skill: Manage Azure identities and governance
      sub-skill: Manage access to Azure resources
      question: |
        HOTSPOT -

        You need to implement Role1.
        Which command should you run before you create Role1?
        Select the appropriate options in the answer area.
        Each correct selection is worth one point.

        Complete the command:

        ```powershell
        [First command] -Name "Reader" | [Second command]
        ```
      choices:
        First command:
          - Find-RoleCapability
          - Get-AzureADDirectoryRole
          - Get-AzRoleDefinition
          - Get-AzResourceProvider
        Second command:
          - ConvertFrom-Json
          - ConvertFrom-String
          - ConvertTo-Json
          - ConvertTo-Xml
      answer:
        First command: Get-AzRoleDefinition
        Second command: ConvertTo-Json
      user_answer:
        First command: Get-AzRoleDefinition
        Second command: ConvertTo-Json
      user_result: correct
      learning_note: |
        Get-AzRoleDefinition retrieves Azure RBAC roles; directory roles are a
        different permission system. ConvertTo-Json exports an object to JSON,
        whereas ConvertFrom-Json parses JSON into an object.
      explanation: |
        Correct selections: Get-AzRoleDefinition and ConvertTo-Json.

        ```powershell
        Get-AzRoleDefinition -Name "Reader" | ConvertTo-Json
        ```

        Role1 must be based on the built-in Reader role. Get-AzRoleDefinition
        retrieves Reader's Azure role-based access control (RBAC) definition.
        The pipe passes that object to ConvertTo-Json, which serializes it into
        JSON so it can be used as the starting point for the custom role.

        This command does not create Role1. Save the output if using a JSON-file
        workflow, change the name to Role1, remove the existing role ID, set
        IsCustom to true, and configure the description, required permissions,
        and AssignableScopes. Then create the role using New-AzRoleDefinition
        with the edited input file. Creating a role definition is separate from
        assigning that role to a user, group, or service principal.

        Find-RoleCapability concerns PowerShell module role capabilities.
        Get-AzureADDirectoryRole retrieves legacy Azure AD directory roles,
        rather than Azure resource RBAC roles. Get-AzResourceProvider retrieves
        resource provider information rather than a role definition.
        ConvertFrom-Json parses JSON into an object, the opposite direction.
        ConvertFrom-String parses text, and ConvertTo-Xml produces XML rather
        than the JSON used by this custom-role workflow.

        Exam focus: Manage Azure identities and governance → Manage access to
        Azure resources. Retrieve the baseline role, export and customize its
        definition, create the custom role, and assign it at the required scope.

        [Microsoft Learn: Create a custom role with Azure PowerShell](https://learn.microsoft.com/en-us/azure/role-based-access-control/tutorial-custom-role-powershell)

    - id: '005'
      skill: Manage Azure identities and governance
      sub-skill: Manage Microsoft Entra users and groups
      question: |
        You need to recommend a solution to automate the configuration for
        the finance department users. The solution must meet the technical
        requirements.
        What should you include in the recommendation?
      choices:
        A: Azure AD B2C
        B: Dynamic groups and Conditional Access policies
        C: Azure AD Identity Protection
        D: An Azure logic app and the Microsoft Identity Management (MIM) client
      answer: B
      user_answer: B
      user_result: correct
      learning_note: |
        Dynamic membership determines who is in the finance group; Conditional
        Access determines when members must use MFA. Use the synchronized
        department attribute, rather than assuming on-premises OU membership
        automatically becomes an Entra group.
      explanation: |
        B. Dynamic groups and Conditional Access policies meet the requirement
        to automate MFA configuration for finance users only.

        Create a dynamic user security group using the synchronized department
        attribute. For example, if the actual attribute value is Finance:

        ```text
        (user.department -eq "Finance")
        ```

        Create a Conditional Access policy targeting that group and the required
        cloud resources, with the Grant control Require multifactor authentication.
        Enable the policy after validating its targeting. New finance users enter
        the group automatically after synchronization and dynamic membership
        processing, without manually adding each user or enabling per-user MFA.
        Attribute changes also update membership; processing is not instantaneous.

        The case specifies Premium P1, which supports dynamic membership and
        Conditional Access. Appropriate P1 licenses are required for users covered
        by these features; a tenant tier alone is not a license for every user.

        A is for customer identities, rather than workforce department-based MFA.
        C focuses on identity risk detection and risk-based protection rather than
        automating department membership. D introduces unnecessary custom
        automation and identity-management components when native features meet
        the requirement.

        Azure AD is now Microsoft Entra ID. The historical finance-only requirement
        describes this policy's targeting; other policies or platform requirements
        can independently require MFA for other users in a current environment.

        Exam focus: Manage Microsoft Entra users and groups. Attribute-based
        dynamic membership selects the users; Conditional Access enforces MFA.

        [Microsoft Learn: Dynamic membership rules](https://learn.microsoft.com/en-us/entra/identity/users/groups-dynamic-membership)
        [Microsoft Learn: Conditional Access user and group assignments](https://learn.microsoft.com/en-us/entra/identity/conditional-access/concept-conditional-access-users-groups)
        [Microsoft Learn: Plan Conditional Access](https://learn.microsoft.com/en-us/entra/identity/conditional-access/plan-conditional-access)
