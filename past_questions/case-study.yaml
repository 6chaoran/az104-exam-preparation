- id: 1
  title: Contoso, Ltd.
  description: |
    Introductory Info

    Overview

    Contoso, Ltd. is a manufacturing company that has offices worldwide.
    Contoso works with partner organizations to bring products to market.
    Contoso products are manufactured by using blueprint files that the
    company authors and maintains.

    Existing Environment

    Currently, Contoso uses multiple types of servers for business operations:
    - File servers
    - Domain controllers
    - Microsoft SQL Server servers

    Your network contains an Active Directory forest named contoso.com.
    All servers and client computers are joined to Active Directory.

    You have a public-facing application named App1. App1 comprises three tiers:
    - A SQL database
    - A web front end
    - A processing middle tier

    Each tier comprises five virtual machines. Users access the web front end
    by using HTTPS only.

    The source text references Attachment.tiff for the application tiers,
    but that diagram was not supplied. No additional topology is assumed.

    Requirements

    Planned Changes

    Contoso plans to implement the following changes to the infrastructure:
    - Move all the tiers of App1 to Azure.
    - Move the existing product blueprint files to Azure Blob storage.
    - Create a hybrid directory to support an upcoming Microsoft 365 migration project.

    Technical Requirements

    Contoso must meet the following technical requirements:
    - Move all the virtual machines for App1 to Azure.
    - Minimize the number of open ports between the App1 tiers.
    - Ensure that all the virtual machines for App1 are protected by backups.
    - Copy the blueprint files to Azure over the Internet.
    - Ensure that the blueprint files are stored in the archive storage tier.
    - Ensure that partner access to the blueprint files is secured and temporary.
    - Prevent user passwords or hashes of passwords from being stored in Azure.
    - Use unmanaged standard storage for the hard disks of the virtual machines.
    - Ensure that when users join devices to Azure Active Directory (Azure AD),
      the users use a mobile phone to verify their identity.
    - Minimize administrative effort whenever possible.

    User Requirements

    Contoso identifies the following requirements for users:
    - Ensure that only users who are part of a group named Pilot can join devices to Azure AD.
    - Designate a new user named Admin1 as the service admin for the Azure subscription.
    - Admin1 must receive email alerts regarding service outages.
    - Ensure that a new user named User3 can create network objects for the Azure subscription.
  questions:
    - id: '001'
      skill: Manage Azure identities and governance
      sub-skill: Manage Microsoft Entra users and groups
      question: |
        HOTSPOT -

        You need to configure the Device settings to meet the technical
        requirements and the user requirements.

        Which two settings should you modify? To answer, select the appropriate
        settings in the answer area.

        The Device settings exhibit shows the following current configuration:

        | Setting | Available options | Current value |
        | --- | --- | --- |
        | Users may join devices to Azure AD | All, Selected, None | All |
        | Additional local administrators on Azure AD joined devices | Selected, None | None |
        | Users may register their devices with Azure AD | All, None | All |
        | Require Multi-Factor Auth to join devices | Yes, No | No |
        | Maximum number of devices per user | Numeric value | 50 |

        The selection areas for both device join users and additional local
        administrators display "No member selected". The toolbar shows Save,
        Discard, and Got feedback?.
      choices:
        Users may join devices to Azure AD:
          - All
          - Selected
          - None
        Additional local administrators on Azure AD joined devices:
          - Selected
          - None
        Users may register their devices with Azure AD:
          - All
          - None
        Require Multi-Factor Auth to join devices:
          - 'Yes'
          - 'No'
        Maximum number of devices per user:
          - 50
      answer:
        Users may join devices to Azure AD: Selected
        Require Multi-Factor Auth to join devices: 'Yes'
      user_answer:
        Users may join devices to Azure AD: Selected
        Require Multi-Factor Auth to join devices: 'Yes'
      user_result: correct
      user_reasoning: |
        Selected restricts device joining to the Pilot group. Requiring MFA
        addresses the requirement to verify identity using a mobile phone.
      learning_note: |
        Select the Pilot group after changing device join permissions to Selected.
        Requiring MFA does not by itself enforce a mobile-phone method; the
        available authentication methods must also be configured appropriately.
      explanation: |
        Modify Users may join devices to Azure AD from All to Selected, then
        select the Pilot group. This limits device joining to Pilot members.

        Change Require Multi-Factor Auth to join devices from No to Yes.
        This is the expected selection in the historical exhibit for requiring
        additional identity verification during device joining. Phone-based
        verification also depends on the configured authentication methods.

        Registration permissions, additional local administrators, and the device
        limit do not satisfy the two requirements being tested.

        Azure AD is now called Microsoft Entra ID. For current deployments,
        Microsoft recommends enforcing MFA for device registration or joining
        through Conditional Access. When using that policy, the legacy device
        setting must be No to avoid conflicting configurations.

        [Microsoft Learn: Plan your Microsoft Entra join deployment](https://learn.microsoft.com/en-us/entra/identity/devices/device-join-plan)
        [Microsoft Learn: Require MFA for device registration](https://learn.microsoft.com/en-us/entra/identity/conditional-access/policy-all-users-device-registration)

    - id: '002'
      skill: Manage Azure identities and governance
      sub-skill: Manage Azure subscriptions and governance
      question: |
        You need to meet the user requirement for Admin1.
        What should you do?
      choices:
        A: From the Azure Active Directory blade, modify the Groups.
        B: From the Azure Active Directory blade, modify the Properties.
        C: From the Subscriptions blade, select the subscription, and then modify the Access control (IAM) settings.
        D: From the Subscriptions blade, select the subscription, and then modify the Properties.
      answer: D
      user_answer: C
      user_result: incorrect
      learning_note: |
        In this legacy question, Service Administrator is a classic subscription
        role changed through subscription Properties. IAM assigns Azure RBAC
        roles such as Owner. Classic administrator roles have since retired.
      explanation: |
        Correct answer: **D. Modify the subscription Properties.**

        The supplied answer C is corrected to D for the historical scenario.
        Admin1 must become the subscription's Service Administrator, a classic
        administrator role. The historical portal path was Subscriptions →
        select the subscription → Properties → Change service admin.

        C assigns Azure role-based access control (RBAC) roles such as Owner
        through Access control (IAM). Although Owner provides broad subscription
        access, it was distinct from the classic Service Administrator role.
        A and B change directory configuration rather than the subscription's
        Service Administrator.

        Email alerts about outages are a separate requirement; this action
        answers the administrator designation. Service Health alert rules and
        an email action group can explicitly configure outage notifications.

        This is an outdated practice question. Classic administrator roles
        retired on August 31, 2024. Current subscription administration uses
        Azure RBAC through IAM, so C describes the modern administration path.

        [Microsoft Learn: Azure classic subscription administrators](https://learn.microsoft.com/en-us/azure/role-based-access-control/classic-administrators)
        [Microsoft Learn: Add or change Azure subscription administrators](https://learn.microsoft.com/en-us/azure/cost-management-billing/manage/add-change-subscription-administrator)

    - id: '003'
      skill: Monitor and maintain Azure resources
      sub-skill: Implement backup and recovery
      question: |
        You need to implement a backup solution for App1 after the application is moved.
        What should you create first?
      choices:
        A: a recovery plan
        B: an Azure Backup Server
        C: a backup policy
        D: a Recovery Services vault
      answer: D
      user_answer: B
      user_result: incorrect
      learning_note: |
        For Azure VM backup, create a Recovery Services vault first, then
        select or create a backup policy and enable protection. Azure Backup
        Server is not required for native Azure VM backup.
      explanation: |
        Correct answer: **D. A Recovery Services vault.**

        The supplied answer B is corrected to D. After migration, App1 runs
        on 15 Azure virtual machines across its three tiers. The requirement
        is to protect all these VMs with backups while minimizing administration.
        Use native Azure VM backup through Azure Backup.

        Create a Recovery Services vault first. The vault manages backup
        policies and recovery points. Then select an existing policy or create
        one for the required schedule and retention, and enable backup for
        the VMs. The vault must be in the same region as the protected VMs;
        use a vault in each region if the VMs span multiple regions.

        A recovery plan orchestrates failover with Azure Site Recovery rather
        than configuring VM backups. Azure Backup Server is a separate server
        product for protecting workloads and adds unnecessary infrastructure
        here. A backup policy defines schedule and retention within a vault,
        so it is not the first resource to create.

        The shared scenario uses legacy unmanaged disks. Preserve that wording
        for this historical question; it does not change the expected vault-first
        answer.

        [Microsoft Learn: Back up multiple Azure virtual machines](https://learn.microsoft.com/en-us/azure/backup/tutorial-backup-vm-at-scale)
        [Microsoft Learn: Prepare Azure VM backup in a Recovery Services vault](https://learn.microsoft.com/en-us/azure/backup/backup-azure-arm-vms-prepare)

    - id: '004'
      skill: Implement and manage storage
      sub-skill: Configure and manage storage accounts
      question: |
        You need to move the blueprint files to Azure.
        What should you do?
      choices:
        A: Generate an access key. Map a drive, and then copy the files by using File Explorer.
        B: Use Azure Storage Explorer to copy the files.
        C: Use the Azure Import/Export service.
        D: Generate a shared access signature (SAS). Map a drive, and then copy the files by using File Explorer.
      answer: B
      user_answer: B
      user_result: correct
      learning_note: |
        Storage Explorer uploads files to Blob storage over the Internet.
        Mapping an SMB drive targets Azure Files, while Import/Export transfers
        data by shipping physical disks. Set the blobs to Archive separately.
      explanation: |
        Correct answer: **B. Use Azure Storage Explorer to copy the files.**

        The decisive requirements are to copy the blueprint files over the
        Internet and store them in Azure Blob storage. Storage Explorer can
        upload local files or folders directly to a blob container, meeting
        both requirements without deploying additional infrastructure.

        Set the uploaded block blobs' access tier to Archive to satisfy the
        storage-tier requirement. Uploading files alone does not guarantee
        that they are archived. Archived blobs must be rehydrated to an online
        tier before their contents can be read.

        A describes mapping an Azure Files SMB share using a storage account
        key, which does not upload to the required Blob storage destination.
        C uses physical disks shipped to an Azure datacenter, conflicting with
        the Internet-transfer requirement. D does not work as proposed: a SAS
        authorizes supported storage requests but is not an SMB drive-mapping
        credential and does not turn Blob storage into a Windows mapped drive.

        The requirement for secured, temporary partner access is separate
        from this upload question. A suitably scoped, expiring SAS can address
        temporary access, but the drive-mapping step in D remains incorrect.

        [Microsoft Learn: Manage blobs with Storage Explorer](https://learn.microsoft.com/en-us/azure/storage/storage-explorer/vs-azure-tools-storage-explorer-blobs)
        [Microsoft Learn: Archive a blob](https://learn.microsoft.com/en-us/azure/storage/blobs/archive-blob)
        [Microsoft Learn: Azure Import/Export service](https://learn.microsoft.com/en-us/azure/import-export/storage-import-export-service)
        [Microsoft Learn: Mount an SMB Azure file share on Windows](https://learn.microsoft.com/en-us/azure/storage/files/storage-how-to-use-files-windows)

    - id: '005'
      skill: Implement and manage storage
      sub-skill: Configure and manage storage accounts
      question: |
        HOTSPOT -

        You need to identify the storage requirements for Contoso.
        For each of the following statements, select Yes if the statement
        is true. Otherwise, select No.
        NOTE: Each correct selection is worth one point.

        Answer Area:

        | Statements | Yes | No |
        | --- | --- | --- |
        | Contoso requires a storage account that supports Blob storage. | Select | Select |
        | Contoso requires a storage account that supports Azure Table storage. | Select | Select |
        | Contoso requires a storage account that supports Azure File Storage. | Select | Select |
      choices:
        Contoso requires a storage account that supports Blob storage.:
          - 'Yes'
          - 'No'
        Contoso requires a storage account that supports Azure Table storage.:
          - 'Yes'
          - 'No'
        Contoso requires a storage account that supports Azure File Storage.:
          - 'Yes'
          - 'No'
      answer:
        Contoso requires a storage account that supports Blob storage.: 'Yes'
        Contoso requires a storage account that supports Azure Table storage.: 'No'
        Contoso requires a storage account that supports Azure File Storage.: 'No'
      user_answer:
        Contoso requires a storage account that supports Blob storage.: 'Yes'
        Contoso requires a storage account that supports Azure Table storage.: 'No'
        Contoso requires a storage account that supports Azure File Storage.: 'Yes'
      user_result: partially_correct
      user_reasoning: |
        Selected Yes for Blob storage because the blueprint files must use
        the archive tier. No reasoning was supplied for the other selections.
      learning_note: |
        Legacy unmanaged VM disks are VHDs stored as page blobs, not Azure
        Files shares. Existing file servers do not establish an Azure Files
        requirement unless their shares must be migrated to that service.
      explanation: |
        Correct selections: **Yes, No, No**, in the displayed order.
        The learner's first two selections are correct; the third is corrected
        from Yes to No.

        Blob storage: Yes. The blueprint files explicitly move to Azure Blob
        storage and must use the archive tier. Archive applies to block blobs.
        The historical requirement for unmanaged VM disks also needs Blob
        storage, because unmanaged VHDs are stored as page blobs. VM disks
        must remain available and are not placed in the archive tier.

        Azure Table storage: No. Table storage is a schemaless NoSQL service.
        No requirement calls for it, and the existing SQL database does not
        imply a migration to Table storage.

        Azure File Storage: No. Azure Files provides managed file shares.
        The planned changes move App1's VMs and the blueprint files, not the
        existing file servers' shares to Azure Files. Blueprint files go to
        Blob storage, and unmanaged VM disks use page blobs rather than file
        shares. A storage account may support additional services, but that
        capability does not make those services a requirement.

        Unmanaged disks have since retired. The page-blob explanation reflects
        the original historical scenario; current deployments use managed disks.

        [Microsoft Learn: Introduction to Azure Storage](https://learn.microsoft.com/en-us/azure/storage/common/storage-introduction)
        [Microsoft Learn: Backup and disaster recovery for unmanaged disks](https://learn.microsoft.com/en-us/azure/virtual-machines/page-blobs-backup-and-disaster-recovery)
        [Microsoft Learn: Blob access tiers](https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview)
        [Microsoft Learn: Unmanaged disks retirement](https://learn.microsoft.com/en-us/azure/virtual-machines/unmanaged-disks-deprecation)

    - id: '006'
      skill: Implement and manage virtual networking
      sub-skill: Configure and manage virtual networks in Azure
      question: |
        HOTSPOT -

        You need to recommend a solution for App1. The solution must meet
        the technical requirements.
        What should you include in the recommendation? To answer, select
        the appropriate options in the answer area.
        NOTE: Each correct selection is worth one point.

        Answer Area:

        | Setting | Available options |
        | --- | --- |
        | Number of virtual networks | 1, 2, 3 |
        | Number of subnets per virtual network | 1, 2, 3 |
      choices:
        Number of virtual networks:
          - 1
          - 2
          - 3
        Number of subnets per virtual network:
          - 1
          - 2
          - 3
      answer:
        Number of virtual networks: 1
        Number of subnets per virtual network: 3
      user_answer:
        Number of virtual networks: 1
        Number of subnets per virtual network: 3
      user_result: correct
      learning_note: |
        Use one virtual network for App1 and one subnet per application tier.
        Subnets provide segmentation, but NSG rules must explicitly restrict
        traffic; default NSG rules permit traffic within the virtual network.

        Think of a VNet as a network boundary and a subnet as a division inside
        that boundary. Start with one VNet for a closely related workload. Add
        VNets when requirements justify separate networks:
        - Different Azure regions: a VNet belongs to one region.
        - Independent environments: separate production and development when
          they need independent connectivity or administration.
        - Different ownership or policies: teams can manage networks independently.
        - Strong network isolation: VNets remain disconnected unless explicitly connected.
        - Shared network services: a hub VNet can provide connectivity or
          inspection for multiple application VNets.

        More VNets add address planning, connectivity, routing, and DNS work.
        They do not automatically improve security; connected VNets still need
        traffic controls. App1 has no stated requirement for separate regions
        or independently managed networks, so one VNet minimizes administration
        while three subnets separate the web, processing, and SQL tiers.

        Exam rule: choose VNets for network boundaries, subnets for tier
        separation, and NSGs for traffic restrictions.
      explanation: |
        Correct selections: **1 virtual network and 3 subnets per virtual network.**

        App1 has a web front end, a processing middle tier, and a SQL database
        tier, each containing five VMs. Place all 15 VMs in one virtual network,
        with the five VMs of each tier in a separate subnet. This supports
        private communication between tiers while minimizing administration.

        Associate network security groups (NSGs) with the tier subnets. Allow
        HTTPS (TCP 443) for user access to the web front end and only the
        application-required ports between the relevant tiers. Add deny rules
        with higher priority than the default AllowVNetInBound rule to block
        unwanted internal traffic. Separate subnets alone do not close ports.
        The missing application diagram does not justify inventing specific
        middle-tier or database port numbers.

        Two or three virtual networks would add connectivity administration
        without a stated requirement for that separation. One or two subnets
        would not provide a separate subnet for each of the three tiers in
        this recommended design. The number of subnets follows the tier count,
        not the number of VMs.

        [Microsoft Learn: Azure virtual networks and subnets](https://learn.microsoft.com/en-us/azure/networking/design-guide/vnets-subnets)
        [Microsoft Learn: Network security groups](https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview)

    - id: '007'
      skill: Implement and manage virtual networking
      sub-skill: Configure secure access to virtual networks
      question: |
        You are planning the move of App1 to Azure.
        You create a network security group (NSG).
        You need to recommend a solution to provide users with access to App1.
        What should you recommend?
      choices:
        A: Create an incoming security rule for port 443 from the Internet. Associate the NSG to the subnet that contains the web servers.
        B: Create an outgoing security rule for port 443 from the Internet. Associate the NSG to the subnet that contains the web servers.
        C: Create an incoming security rule for port 443 from the Internet. Associate the NSG to all the subnets.
        D: Create an outgoing security rule for port 443 from the Internet. Associate the NSG to all the subnets.
      answer: A
      user_answer: A
      user_result: correct
      learning_note: |
        Determine NSG direction from the protected resource's perspective:
        Internet users connecting to web servers is inbound traffic. HTTPS
        uses TCP destination port 443. Scope the Internet-facing allow rule
        to the web tier. NSGs are stateful, so response traffic for an allowed
        connection does not require a separate outbound allow rule.
      explanation: |
        Correct answer: **A. Allow incoming port 443 from the Internet and
        associate the NSG with the web-server subnet.**

        App1's users access the web front end using HTTPS only. Configure an
        inbound Allow rule with source Internet, protocol TCP, and destination
        port 443. Give it a higher priority (lower priority number) than the
        default inbound deny rule. Associating the NSG with the web subnet
        applies the rule to all five web VMs with minimal administration.

        B and D use the wrong direction. Outbound rules govern connections
        leaving the protected resources; they do not permit users' incoming
        HTTPS connections. NSGs track connection state and automatically
        permit replies to an allowed connection.

        C allows the correct port and direction but applies the Internet-facing
        rule to the processing and database subnets as well. Only the web tier
        requires user access. Keep backend tiers restricted to the required
        inter-tier traffic rather than granting unnecessary Internet access.

        This question concerns the NSG configuration. A public endpoint and
        an HTTPS listener are also needed for actual user connectivity; an
        NSG rule permits traffic but does not create either. If NIC-level NSGs
        are also present, their rules must allow the incoming traffic too.

        [Microsoft Learn: Network security groups overview](https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview)
        [Microsoft Learn: How NSGs filter network traffic](https://learn.microsoft.com/en-us/azure/virtual-network/network-security-group-how-it-works)

- id: 2
  title: Contoso, Ltd. — Consulting company
  description: |
    Introductory Info

    Case studies are not timed separately. Manage the overall exam time to
    complete all questions. Each question in this case study is independent.
    Review and change answers before moving to the next section; after starting
    a new section, you cannot return to this section.

    In the original exam interface, Next displays the first question. Buttons
    in the left pane display the scenario information, and Question returns to
    the question. All Information contains the same information as the other tabs.

    Overview

    Contoso, Ltd. is a consulting company that has a main office in Montreal
    and branch offices in Seattle and New York.

    Existing Environment

    Contoso has an Azure subscription named Sub1 linked to an Azure Active
    Directory (Azure AD) tenant. An on-premises Active Directory domain syncs
    to the Azure AD tenant.

    The Azure AD tenant contains the following users:

    | Name | Type | Role |
    | --- | --- | --- |
    | User1 | Member | None |
    | User2 | Guest | None |
    | User3 | Member | None |
    | User4 | Member | None |

    Sub1 contains two resource groups named RG1 and RG2 and these virtual networks:

    | Name | Subnet | Peered with |
    | --- | --- | --- |
    | VNET1 | Subnet1, Subnet2 | VNET2 |
    | VNET2 | Subnet1 | VNET1, VNET3 |
    | VNET3 | Subnet1 | VNET2 |
    | VNET4 | Subnet1 | None |

    User1 manages the resources in RG1. User4 manages the resources in RG2.

    Sub1 contains the following virtual machines running Windows Server 2019:

    | Name | IP address | Location | Connected to |
    | --- | --- | --- | --- |
    | VM1 | 10.0.1.4 | West US | VNET1/Subnet1 |
    | VM2 | 10.0.2.4 | West US | VNET1/Subnet2 |
    | VM3 | 172.16.1.4 | Central US | VNET2/Subnet1 |
    | VM4 | 192.168.1.4 | West US | VNET3/Subnet1 |
    | VM5 | 10.0.22.4 | East US | VNET4/Subnet1 |

    No network security groups (NSGs) are associated with the network interfaces
    or the subnets.

    Sub1 contains the following storage accounts:

    | Name | Kind | Location | File share | Identity-based access for file share |
    | --- | --- | --- | --- | --- |
    | storage1 | Storage (general purpose v1) | West US | sharea | Azure Active Directory Domain Services (Azure AD DS) |
    | storage2 | StorageV2 (general purpose v2) | East US | shareb, sharec | Disabled |
    | storage3 | BlobStorage | East US 2 | Not applicable | Not applicable |
    | storage4 | FileStorage | Central US | shared | Azure Active Directory Domain Services (Azure AD DS) |

    Requirements

    Planned Changes

    - Create a blob container named container1 and a file share named share1
      that will use the Cool storage tier.
    - Create a storage account named storage5 and configure storage replication
      for the Blob service.
    - Create NSG1 with these custom inbound security rules:

    | Priority | Port | Protocol | Source | Destination | Action |
    | --- | --- | --- | --- | --- | --- |
    | 500 | 3389 | TCP | 10.0.2.0/24 | Any | Deny |
    | 1000 | Any | ICMP | Any | VirtualNetwork | Allow |

    Associate NSG1 with the network interface of VM1.

    Create NSG2 with these custom outbound security rules:

    | Priority | Port | Protocol | Source | Destination | Action |
    | --- | --- | --- | --- | --- | --- |
    | 200 | 3389 | TCP | 10.0.0.0/16 | VirtualNetwork | Deny |
    | 400 | Any | ICMP | 10.0.2.0/24 | 10.0.1.0/24 | Allow |

    Associate NSG2 with VNET1/Subnet2.

    Technical Requirements

    - Create container1 and share1.
    - Use the principle of least privilege.
    - Create an Azure AD security group named Group4.
    - Back up the Azure file shares and virtual machines by using Azure Backup.
    - Trigger an alert if VM1 or VM2 has less than 20 GB of free space on volume C.
    - Enable User1 to create Azure policy definitions and User2 to assign Azure
      policies to RG1.
    - Create an internal Basic Azure Load Balancer named LB1 and connect it to
      VNET1/Subnet1.
    - Enable flow logging for IP traffic from VM5 and retain the flow logs for
      eight months.
    - Whenever possible, grant Group4 Azure role-based access control (Azure RBAC)
      read-only permissions to the Azure file shares.
  questions:
    - id: '001'
      skill: Monitor and maintain Azure resources
      sub-skill: Implement backup and recovery
      question: |
        HOTSPOT -

        You need to configure Azure Backup to back up the file shares and
        virtual machines.

        What is the minimum number of Recovery Services vaults and backup
        policies you should create? Select the appropriate options in the
        answer area. Each correct selection is worth one point.
      choices:
        Recovery Services vaults: [1, 2, 3, 4, 7]
        Backup policies: [1, 2, 3, 4, 5, 6]
      answer:
        Recovery Services vaults: 3
        Backup policies: 6
      user_answer:
        Recovery Services vaults: 1
        Backup policies: No ideas
      user_result: incorrect
      user_reasoning: Believed one Recovery Services vault could protect all the VMs; did not know the policy count.
      learning_note: |
        Recovery Services vaults are regional. Count one vault per region,
        then one policy per workload type in each vault when schedules can be shared.
      explanation: |
        Create three Recovery Services vaults and six backup policies.
        A vault must be in the same region as the resources it protects.
        VM and Azure Files backup require separate workload-specific policies,
        and policies belong to their vault.

        | Vault region | Virtual machines | File shares | Minimum policies |
        | --- | --- | --- | --- |
        | West US | VM1, VM2, VM4 | storage1: sharea | 2 |
        | Central US | VM3 | storage4: shared | 2 |
        | East US | VM5 | storage2: shareb, sharec | 2 |

        Multiple VMs can share a VM policy, and multiple file shares can share
        an Azure Files policy in the same vault. No distinct schedules or
        retention requirements are specified. Storage3 in East US 2 has no
        file shares or VMs to protect, so it adds no vault. The planned share1
        has no specified location and does not establish another required region.

        The supplied vault count of one is corrected to three.

        [Microsoft Learn: Azure Backup guidance](https://learn.microsoft.com/en-us/azure/backup/guidance-best-practices)
        [Microsoft Learn: Backup policy types](https://learn.microsoft.com/en-us/cli/azure/backup/policy?view=azure-cli-latest)
        [Microsoft Learn: Back up Azure Files](https://learn.microsoft.com/en-us/azure/backup/tutorial-backup-azure-files-vault-tier-portal)

    - id: '002'
      skill: Monitor and maintain Azure resources
      sub-skill: Monitor resources in Azure
      question: |
        DRAG DROP -

        You need to configure the alerts for VM1 and VM2 to meet the technical
        requirements.

        Which three actions should you perform in sequence? Select three
        actions from the list and arrange them in the correct order.
      choices:
        - Create a Log Analytics workspace.
        - Configure the Diagnostic settings.
        - Create an alert rule.
        - Collect Windows performance counters from the Log Analytics agents.
        - Create an Azure SQL database.
      answer:
        - Create a Log Analytics workspace.
        - Collect Windows performance counters from the Log Analytics agents.
        - Create an alert rule.
      user_answer:
        - Create a Log Analytics workspace.
        - Collect Windows performance counters from the Log Analytics agents.
        - Create an alert rule.
      user_result: correct
      learning_note: |
        Free space on C: is a guest operating system measurement. Collect guest
        performance counters before configuring the alert that evaluates them.
      explanation: |
        First create the workspace that receives the monitoring data. Then
        collect Windows performance counters from VM1 and VM2, including
        LogicalDisk(C:)\Free Megabytes. Finally, create an alert rule that
        triggers when either VM has less than 20 GB free on C:.

        Diagnostic settings alone do not collect the required guest disk-space
        counter. An Azure SQL database is unnecessary.

        The original wording says to move all actions, but requests three actions
        and supplies five choices. Select the three required actions above.
        This historical question uses the Log Analytics agent; current
        deployments use Azure Monitor Agent and data collection rules.

        [Microsoft Learn: Virtual machine alerts](https://learn.microsoft.com/en-us/azure/azure-monitor/vm/monitor-virtual-machine-alerts)

    - id: '003'
      skill: Manage Azure identities and governance
      sub-skill: Manage access to Azure resources
      question: |
        HOTSPOT -

        You need to ensure that User1 can create initiative definitions, and
        User4 can assign initiatives to RG2. The solution must meet the
        technical requirements.

        Which role should you assign to each user? Select the appropriate
        options in the answer area. Each correct selection is worth one point.
      choices:
        User1:
          - Contributor for RG1
          - Contributor for Sub1
          - Security Admin for RG1
          - Resource Policy Contributor for Sub1
        User4:
          - Contributor for RG2
          - Contributor for Sub1
          - Security Admin for Sub1
          - Resource Policy Contributor for RG2
      answer:
        User1: Resource Policy Contributor for Sub1
        User4: Resource Policy Contributor for RG2
      user_answer:
        User1: Resource Policy Contributor for Sub1
        User2: Security Admin for Sub1
      user_result: partially_correct
      learning_note: |
        The question asks about User4, not User2. Use Resource Policy Contributor
        at subscription scope to create definitions and at RG2 scope to assign
        initiatives to RG2 with least privilege.
      explanation: |
        User1 needs Resource Policy Contributor for Sub1. Initiative definitions
        are policy set definitions created at subscription or management group
        scope; they cannot be created at resource group scope.

        User4 needs Resource Policy Contributor for RG2. This permits initiative
        assignments within RG2 while limiting access to the required scope.
        Resource Policy Contributor includes policy definition, policy set
        definition, and policy assignment operations. Contributor excludes
        the required Microsoft.Authorization write operations, and Security
        Admin does not provide the required initiative management permissions.

        The learner's User1 selection is correct. The second supplied selection
        names User2 instead of User4 and uses the wrong role and scope; it is
