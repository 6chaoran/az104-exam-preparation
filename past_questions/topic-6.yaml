- id: '025'
  skill: Manage Azure identities and governance
  sub-skill: Manage access to Azure resources
  question: |
    HOTSPOT
    You have the role assignment file shown in the following exhibit.

    ```json
    [
      {
        "RoleAssignmentId": "e3108585-0e5d-4572-91a3-aa5d2df73999",
        "Scope": "/subscriptions/fb960108-fcdc-499b-886e-d9c31d3f26ff",
        "DisplayName": "User1",
        "SignInName": "User1@contoso.onmicrosoft.com",
        "RoleDefinitionName": "Owner"
      },
      {
        "RoleAssignmentId": "3bab4763-16a9-4d5d-9fcd-eee0cc31a21e",
        "Scope": "/subscriptions/fb960108-fcdc-499b-886e-d9c31d3f26ff/resourceGroups/RG2",
        "DisplayName": "User2",
        "SignInName": "User2@contoso.onmicrosoft.com",
        "RoleDefinitionName": "Owner"
      },
      {
        "RoleAssignmentId": "a071c023-40a3-4b7f-8680-1109b40270c5",
        "Scope": "/subscriptions/fb960108-fcdc-499b-886e-d9c31d3f26ff/resourceGroups/RG1/providers/Microsoft.Compute/virtualMachines/VM1",
        "DisplayName": "User3",
        "SignInName": "User3@contoso.onmicrosoft.com",
        "RoleDefinitionName": "Owner"
      },
      {
        "RoleAssignmentId": "c5b9e7da-76d4-4888-93b5-8afb2bb780b4",
        "Scope": "/subscriptions/fb960108-fcdc-499b-886e-d9c31d3f26ff/resourceGroups/RG1",
        "DisplayName": "User4",
        "SignInName": "User4@contoso.onmicrosoft.com",
        "RoleDefinitionName": "Contributor"
      }
    ]
    ```

    The exhibit omits additional properties with ellipses in each assignment.
    Use the drop-down menus to complete each statement based on the exhibit.
    Each correct selection is worth one point.

    1. [Answer choice] assigned the Owner role for VM1.
    2. [Answer choice] can create a virtual machine in RG1.
  choices:
    owner_of_vm1:
      - User3 is
      - User3 and User4 are
      - User1 and User3 are
      - User1, User3, and User4 are
      - User1, User2, User3, and User4 are
    create_vm_in_rg1:
      - User1 and User4
      - User1, User2, and User3
      - User1, User2, and User4
      - User1, User3, and User4
      - User1, User2, User3, and User4
  answer:
    owner_of_vm1: User1 and User3 are
    create_vm_in_rg1: User1 and User4
  user_answer:
    owner_of_vm1: User1 and User3 are
    create_vm_in_rg1: User1 and User4
  user_result: correct
  explanation: |
    Both selections are correct. User1 has Owner at subscription scope,
    which is inherited by RG1 and VM1. User3 has Owner directly on VM1.
    User4 has Contributor on RG1, which grants management permissions on
    VM1 but does not grant the Owner role. User2's Owner role is limited
    to RG2 and does not apply to RG1 or VM1.

    User1 can create a VM in RG1 through subscription-level Owner access.
    User4 can create a VM through RG1-level Contributor access. User3's
    VM1-level Owner assignment permits management of that existing VM,
    but does not grant permission to create another VM in its parent RG1.

    Owner and Contributor both permit resource creation and management
    within their scopes. Owner additionally permits Azure RBAC role
    assignments; Contributor does not.

    Exam takeaway: permissions flow down from subscription to resource
    group to resource. They do not flow up to a parent or sideways to
    another resource group. Check both the role and its scope.

    [Microsoft Learn: Role assignments and scope inheritance](https://learn.microsoft.com/en-us/azure/role-based-access-control/role-assignments-steps)

- id: '026'
  skill: Manage Azure identities and governance
  sub-skill: Manage access to Azure resources
  tags: [must-review]
  question: |
    HOTSPOT
    You have the following custom role-based access control (RBAC) role.

    ```json
    {
      "id": "b988327b-7dae-4d00-8925-1cc14fd68be4",
      "properties": {
        "roleName": "Role1",
        "description": "",
        "assignableScopes": [
          "/subscriptions/c691ad84-99f2-42fd-949b-58afd7ef6ab3"
        ],
        "permissions": [
          {
            "actions": [
              "Microsoft.Resources/subscription/resourceGroups/resources/read",
              "Microsoft.Resources/subscription/resourceGroups/read",
              "Microsoft.Resourcehealth/*",
              "Microsoft.Authorization/*/read",
              "Microsoft.Compute/*/read",
              "Microsoft.Support/*",
              "Microsoft.Authorization/*/read",
              "Microsoft.Network/virtualNetworks/read",
              "Microsoft.Resources/deployments/*",
              "Microsoft.Resources/subscription/resourceGroups/read",
              "Microsoft.Storage/storageAccounts/read",
              "Microsoft.Compute/virtualMachines/start/action",
              "Microsoft.Compute/virtualMachines/powerOff/action",
              "Microsoft.Compute/virtualMachines/deallocate/action",
              "Microsoft.Compute/virtualMachines/restart/action",
              "Microsoft.Compute/virtualMachines/*",
              "Microsoft.Compute/disks/*",
              "Microsoft.Compute/availabilitySets/*",
              "Microsoft.Network/virtualNetworks/subnets/join/action",
              "Microsoft.Network/virtualNetworks/subnets/read",
              "Microsoft.Network/virtualNetworks/subnets/virtualMachines/read",
              "Microsoft.Network/networkInterfaces/*",
              "Microsoft.Compute/snapshots/*"
            ],
            "notAction": [
              "Microsoft.Authorization/*/Delete",
              "Microsoft.Authorization/*/Write",
              "Microsoft.Authorization/elevateAccess/Action"
            ]
          }
        ]
      }
    }
    ```

    For each statement, select Yes if the statement is true. Otherwise,
    select No. Each correct selection is worth one point.

    1. Users that are assigned Role1 can assign Role1 to users.
    2. Users that are assigned Role1 can deploy new virtual machines.
    3. Users that are assigned Role1 can set a static IP address on a virtual machine.
  choices:
    - 'Yes'
    - 'No'
  answer:
    - 'No'
    - 'Yes'
    - 'Yes'
  user_answer:
    - 'No'
    - 'No'
    - 'No'
  user_result: partially_correct
  learning_note: |
    A wildcard such as Microsoft.Compute/virtualMachines/* includes write
    permissions, not just the explicitly listed start and stop operations.
    Static private IP configuration belongs to the network interface.
    Authorization exclusions do not remove Compute or Network permissions.
  explanation: |
    The expected answers are No, Yes, Yes, assuming the role is assigned
    at a scope covering the resources involved.

    1. No: assigning roles requires Microsoft.Authorization/roleAssignments/write.
       The role grants authorization read access only, and the intended
       NotActions also exclude authorization writes.
    2. Yes: Microsoft.Compute/virtualMachines/* includes virtualMachines/write.
       The role also permits deployment operations, disk and NIC management,
       and joining an existing subnet. It can deploy VMs using existing
       networking; it does not grant creation of a new virtual network or
       public IP resource.
    3. Yes: Microsoft.Network/networkInterfaces/* includes networkInterfaces/write.
       A static private IP is configured on the VM's NIC IP configuration.
       This does not imply permission to create or modify public IP resources.

    The screenshot uses notAction (singular). Valid Azure role-definition
    JSON uses notActions. The answers interpret this as the intended
    exclusions list; the exhibit should not be deployed verbatim.
    The duplicated read entries are preserved from the exhibit.

    AssignableScopes determines where the role is available for assignment;
    it does not itself grant a user subscription-wide access. NotActions
    subtracts permissions from this role and is not a deny assignment that
    overrides permissions granted by another role.

    Exam takeaway: expand wildcard Actions, subtract matching NotActions,
    and check the assignment scope. Match each operation to its provider.

    [Microsoft Learn: Azure role definitions](https://learn.microsoft.com/en-us/azure/role-based-access-control/role-definitions)
    [Microsoft Learn: Network interface permissions](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-network-interface)
    [Microsoft Learn: Configure a static private IP](https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/virtual-networks-static-private-ip)

- id: '027'
  skill: Implement and manage virtual networking
  sub-skill: Configure secure access to virtual networks
  tags: [must-review]
  question: |
    HOTSPOT
    You have an Azure subscription that contains the following resources.

    | Name | Type | Description |
    | --- | --- | --- |
    | VNET1 | Virtual network | Contains subnet1 and subnet2 |
    | subnet1 | Subnet | IP address space 10.3.0.0/24 |
    | subnet2 | Subnet | IP address space 10.4.0.0/24 |
    | NSG1 | Network security group (NSG) | None |
    | vm1 | Virtual machine | IP address 10.3.0.15 |
    | vm2 | Virtual machine | IP address 10.4.0.16 |
    | storage1 | Storage account | None |

    NSG1 is configured as follows.

    Essentials:
    - Resource group: RG1
    - Location: East US 2
    - Subscription: Microsoft Azure Sponsorship
    - Subscription ID: not shown
    - Tags: Click here to add tags
    - Custom security rules: 1 inbound, 2 outbound
    - Associated with: 1 subnet, 0 network interfaces

    Inbound security rules:

    | Priority | Name | Port | Protocol | Source | Destination | Action |
    | --- | --- | --- | --- | --- | --- | --- |
    | 110 | HTTPS_VM1_Deny | 443 | TCP | Internet | 10.3.0.15 | Deny |
    | 65000 | AllowVnetInBound | Any | Any | VirtualNetwork | VirtualNetwork | Allow |
    | 65001 | AllowAzureLoadBalancerInBound | Any | Any | AzureLoadBalancer | Any | Allow |
    | 65500 | DenyAllInBound | Any | Any | Any | Any | Deny |

    Outbound security rules:

    | Priority | Name | Port | Protocol | Source | Destination | Action |
    | --- | --- | --- | --- | --- | --- | --- |
    | 145 | Storage_Access | 443 | TCP | VirtualNetwork | Storage | Allow |
    | 150 | Block_Internet | Any | Any | VirtualNetwork | Internet | Deny |
    | 65000 | AllowVnetOutBound | Any | Any | VirtualNetwork | VirtualNetwork | Allow |
    | 65001 | AllowInternetOutBound | Any | Any | Any | Internet | Allow |
    | 65500 | DenyAllOutBound | Any | Any | Any | Any | Deny |

    For each statement, select Yes if the statement is true. Otherwise,
    select No. Each correct selection is worth one point.

    1. VM1 can access storage1.
    2. VM2 can access VM1 by using the HTTPS protocol.
    3. The security rules for NSG1 apply to any virtual machine on VNET1.
  choices:
    - 'Yes'
    - 'No'
  answer:
    - 'Yes'
    - 'Yes'
    - 'No'
  user_answer:
    - 'Yes'
    - 'Yes'
    - 'Yes'
  user_result: partially_correct
  user_reasoning: |
    For the second statement, VM2 accesses VM1 from a VNet subnet rather
    than from the Internet.
  learning_note: |
    Correctly distinguished VirtualNetwork traffic from Internet traffic.
    An NSG's association determines where its rules apply. A VirtualNetwork
    service tag matches traffic; it does not associate the NSG with every
    subnet in the VNet.
  explanation: |
    The answers are Yes, Yes, No, based on the network filtering shown.

    1. Yes: outbound HTTPS to Azure Storage matches Storage_Access at
       priority 145. This is evaluated before Block_Internet at priority
       150, since lower numbers have higher priority. Processing stops at
       the first matching rule. If VM1 is outside the associated subnet,
       NSG1 does not filter its traffic. Nothing shown blocks its storage
       access. The exam assumes the required routing and storage access
       permissions are otherwise available; an NSG allow does not itself
       grant storage authorization or bypass a storage firewall.
    2. Yes: VM2's private address 10.4.0.16 belongs to VNET1. The inbound
       deny at priority 110 matches Internet sources, not VM2's private
       VNet traffic. The default AllowVnetInBound and AllowVnetOutBound
       rules allow communication between the subnets, including TCP 443.
       The learner's reasoning for this statement is correct.
    3. No: the exhibit shows association with one subnet and zero NICs.
       VNET1 has two subnets. NSG1 does not automatically apply to every
       VM in both subnets. It filters traffic at its associated subnet.
       Traffic from another subnet can still be filtered when entering
       that associated subnet, but this is not VNet-wide association.

    The exhibit does not identify which subnet is associated with NSG1.
    This does not change the expected selections for the shown rules.
    VirtualNetwork and Storage are service tags used to match addresses;
    they do not define the association scope of the NSG.

    Exam takeaway: lower priority number wins; match the full traffic
    tuple; distinguish rule address matching from subnet/NIC association.

    [Microsoft Learn: NSG rules and priorities](https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview)
    [Microsoft Learn: How NSGs filter traffic](https://learn.microsoft.com/en-us/azure/virtual-network/network-security-group-how-it-works)

- id: '028'
  skill: Implement and manage virtual networking
  sub-skill: Configure and manage virtual networks in Azure
  question: |
    You have an Azure subscription named Subscription1 that contains two
    Azure virtual networks named VNet1 and VNet2. VNet1 contains a VPN
    gateway named VPNGW1 that uses static routing. There is a site-to-site
    VPN connection between your on-premises network and VNet1.
    On a computer named Client1 that runs Windows 10, you configure a
    point-to-site VPN connection to VNet1.
    You configure virtual network peering between VNet1 and VNet2. You
    verify that you can connect to VNet2 from the on-premises network.
    Client1 is unable to connect to VNet2.
    You need to ensure that you can connect Client1 to VNet2.
    What should you do?
  choices:
    A: Select Use the remote virtual network's gateway or Route Server on VNet1 to VNet2 peering.
    B: Select Use the remote virtual network's gateway or Route Server on VNet2 to VNet1 peering.
    C: Download and re-install the VPN client configuration package on Client1.
    D: Enable BGP on VPNGW1.
  answer: C
  user_answer: C
  user_result: correct
  explanation: |
    C is correct. Windows point-to-site VPN clients need an updated VPN
    client configuration package after a change to VNet peering or network
    topology. Client1 was configured before VNet2 was peered, so download
    and reinstall the package to supply the new route to VNet2, then reconnect.

    The successful connection from the on-premises network to VNet2 is
    the decisive clue that the Azure gateway-transit path already works.
    The missing update is on the Windows point-to-site client.

    A reverses the gateway-sharing direction: VPNGW1 is in VNet1, so VNet2
    is the network that would use the remote gateway in VNet1.
    B describes that correct sharing direction, but the working on-premises
    connection indicates gateway transit is already configured; it does
    not refresh Client1's route configuration.
    D does not replace the required client configuration update. BGP is
    not required just to reach a directly peered VNet from this P2S client.

    Static routing should not automatically be interpreted as a
    policy-based gateway. The scenario assumes a gateway supporting P2S
    and gateway transit; policy-based gateways do not support that setup.

    Exam takeaway: after changing peering or topology, download and install
    an updated Windows P2S VPN configuration so the client gets new routes.

    [Microsoft Learn: VPN gateway transit and Windows client updates](https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-peering-gateway-transit)
    [Microsoft Learn: Troubleshoot virtual network peering](https://learn.microsoft.com/en-us/troubleshoot/azure/virtual-network/virtual-network-troubleshoot-peering-issues)

- id: '029'
  skill: Manage Azure identities and governance
  sub-skill: Manage access to Azure resources
  question: |
    HOTSPOT
    You have two Azure subscriptions named Sub1 and Sub2. Sub1 is in a
    management group named MG1. Sub2 is in a management group named MG2.
    You have the resource groups shown in the following table.

    | Name | Subscription |
    | --- | --- |
    | RG1 | Sub1 |
    | RG2 | Sub2 |

    You have the virtual machines shown in the following table.

    | Name | Resource group |
    | --- | --- |
    | VM1 | RG1 |
    | VM2 | RG2 |
    | VM3 | RG2 |

    You assign roles to users as shown in the following table.

    | User | Role | Resource |
    | --- | --- | --- |
    | User1 | Virtual Machine Contributor | MG1 |
    | User1 | Virtual Machine User Login | Sub2 |
    | User2 | Virtual Machine Contributor | MG2 |
    | User2 | Virtual Machine User Login | Sub1 |
    | User2 | Virtual Machine User Login | VM3 |

    For each statement, select Yes if the statement is true. Otherwise,
    select No. Each correct selection is worth one point.

    1. User1 can sign in to VM1.
    2. User2 can manage disks and disk snapshots of VM1.
    3. User2 can manage disks and disk snapshots of VM3.
  choices:
    - 'Yes'
    - 'No'
  answer:
    - 'No'
    - 'No'
    - 'Yes'
  user_answer:
    - 'No'
    - 'No'
    - 'Yes'
  user_result: correct
  user_reasoning: |
    User1's sign-in permission applies only to VMs under Sub2/RG2.
    User2's contributor permission inherits through MG2/Sub2/RG2 to VM2
    and VM3, not VM1.
  explanation: |
    No, No, Yes is correct. Check the role's permissions and then trace
    the assignment scope down the hierarchy.

    MG1 -> Sub1 -> RG1 -> VM1
    MG2 -> Sub2 -> RG2 -> VM2 and VM3

    1. No: User1 inherits Virtual Machine Contributor on VM1 from MG1.
       This grants VM management, but does not itself grant Microsoft
       Entra VM sign-in through Virtual Machine User Login. User1's login
       role is assigned on Sub2, so it applies to VM2 and VM3, not VM1.
    2. No: User2's Virtual Machine Contributor role is on MG2. It does
       not apply to VM1 under MG1. The login role on Sub1 allows regular
       user sign-in to VM1, not Azure disk or snapshot management.
    3. Yes: User2 inherits Virtual Machine Contributor on resources under
       MG2, including the disks and snapshots associated with VM3 in
       Sub2/RG2. This management permission comes from the MG2 assignment,
       not the separate Virtual Machine User Login assignment on VM3.

    The learner's inheritance reasoning is correct. The precise role name
    is Virtual Machine Contributor, rather than the general Contributor
    role. Disk and snapshot resources must be within the assignment's scope.

    These sign-in answers evaluate the permissions granted by the listed
    roles and assume the VM's Microsoft Entra login prerequisites are met.
    They do not rule out separately configured local OS credentials.

    Exam takeaway: VM management permissions and VM sign-in permissions
    are different. Login does not grant Azure disk management, and scope
    inheritance does not cross into a sibling management group.

    [Microsoft Learn: Virtual Machine Contributor](https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/compute#virtual-machine-contributor)
    [Microsoft Learn: Virtual Machine User Login](https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/compute#virtual-machine-user-login)
    [Microsoft Learn: Role scope and inheritance](https://learn.microsoft.com/en-us/azure/role-based-access-control/role-assignments-steps)

- id: '030'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  question: |
    You have an Azure Active Directory (Azure AD) tenant that is linked
    to 10 Azure subscriptions.
    You need to centrally monitor user activity across all the subscriptions.
    What should you use?
  choices:
    A: Azure Application Insights Profiler
    B: access reviews
    C: Activity log filters
    D: a Log Analytics workspace
  answer: D
  user_answer: C
  user_result: incorrect
  learning_note: |
    Activity Log identifies subscription management operations, but filters
    only narrow a view. For centralized collection, querying, and alerting
    across subscriptions, export their Activity Logs to a shared Log
    Analytics workspace using diagnostic settings.
  explanation: |
    D is correct. Use a shared Log Analytics workspace as the central log
    destination and configure diagnostic settings for each subscription
    to send its Activity Log there. The records appear in the AzureActivity
    table and can be queried together, including by caller and subscription.
    Creating a workspace alone does not automatically collect these logs.

    C is tempting because the Activity Log records resource management
    operations performed by users. Filters help select events by criteria
    such as subscription, time, or caller, but do not provide the shared
    collection and analysis destination requested by centrally monitor.
    This does not mean the portal cannot display multiple subscriptions;
    the distinction is filtering a view versus centralizing logs.

    A profiles application performance rather than users' subscription
    management activity. B reviews whether users should retain access;
    it does not collect and analyze their operational activity.

    Azure AD is now named Microsoft Entra ID. If user activity also means
    tenant sign-ins or directory changes, configure Entra diagnostic
    settings to send sign-in and audit logs to the workspace as well.
    Those tenant identity logs are distinct from subscription Activity Logs.

    Exam takeaway: filters narrow events; Log Analytics centralizes logs
    for queries, correlation, and log-based alerts across subscriptions.

    [Microsoft Learn: Azure Activity Log](https://learn.microsoft.com/en-us/azure/azure-monitor/platform/activity-log)
    [Microsoft Learn: Subscription diagnostic settings](https://learn.microsoft.com/en-us/azure/azure-monitor/platform/resource-manager-diagnostic-settings)
    [Microsoft Learn: Integrate Microsoft Entra logs](https://learn.microsoft.com/en-us/entra/identity/monitoring-health/howto-integrate-activity-logs-with-azure-monitor-logs)

- id: '031'
  skill: Monitor and maintain Azure resources
  sub-skill: Implement backup and recovery
  question: |
    DRAG DROP
    You have an Azure subscription that contains a virtual machine named VM1.
    VM1 has an operating system disk named Disk1 and a data disk named Disk2.
    You need to back up Disk2 by using Azure Backup.
    Which three actions should you perform in sequence?
    Move the appropriate actions from the list to the answer area and
    arrange them in the correct order.
  choices:
    A: Configure a managed identity
    B: Create an Azure Backup vault
    C: Create a Recovery Services vault
    D: Delegate permissions for the vault
    E: Create a backup policy and configure the backup
  answer:
    - B
    - D
    - E
  user_answer:
    - B
    - D
    - E
  user_result: correct
  explanation: |
    The correct sequence is B, D, E:
    1. Create an Azure Backup vault.
    2. Delegate permissions for the vault.
    3. Create a backup policy and configure the backup.

    This workflow protects Disk2 as an individual managed disk using
    Azure Disk Backup. Create the Backup vault first so its managed
    identity exists. Grant that identity Disk Backup Reader on Disk2 and
    Disk Snapshot Contributor on the resource group used to store and
    manage snapshots. Then create a policy specifying the schedule and
    retention, select Disk2, and finish configuring backup.

    Configure a managed identity is not a separate selected step in the
    standard vault-creation workflow, which provides a system-assigned
    managed identity. Its permissions still need to be explicitly granted;
    having an identity does not itself authorize disk access.

    Recovery Services vault is the alternative associated with Azure VM
    Backup. It is not the vault type used for this standalone Azure Disk
    Backup workflow. This distinction does not mean VM Backup cannot offer
    selective disk backup; the listed actions identify the disk-backup path.

    Azure Disk Backup uses incremental snapshots in the subscription.
    The Backup vault manages protection; the disk snapshots are not copied
    into its vault storage. Permissions must be in place before completing
    backup configuration, even though a policy can be created earlier in
    an actual portal workflow.

    Exam takeaway: individual managed disk backup uses Backup vault ->
    grant vault identity permissions -> policy and backup configuration.

    [Microsoft Learn: Back up Azure Managed Disks](https://learn.microsoft.com/en-us/azure/backup/backup-managed-disks)
    [Microsoft Learn: Azure Disk Backup overview](https://learn.microsoft.com/en-us/azure/backup/disk-backup-overview)

- id: '032'
  skill: Implement and manage virtual networking
  sub-skill: Configure secure access to virtual networks
  tags: [must-review]
  question: |
    You have a subnet named Subnet1 that contains Azure virtual machines.
    A network security group (NSG) named NSG1 is associated to Subnet1.
    NSG1 only contains the default rules.
    You need to create a rule in NSG1 to prevent the hosts on Subnet1 from
    connecting to the Azure portal. The hosts must be able to connect to
    other internet hosts.
    To what should you set Destination in the rule?
  choices:
    A: Application security group
    B: IP Addresses
    C: Service Tag
    D: Any
  answer: C
  user_answer: C
  user_result: correct
  explanation: |
    C, Service Tag, is the expected exam answer. A service tag represents
    Microsoft-maintained IP address prefixes for a service, allowing an
    outbound NSG deny rule to target that service without manually keeping
    individual destination IP addresses up to date. Other Internet traffic
    can continue to match the default AllowInternetOutBound rule.

    Use a custom outbound deny with higher priority (lower number) than
    the default Internet allow at priority 65001. AzureResourceManager is
    the documented service tag for Resource Manager management endpoints.

    A groups Azure VM network interfaces; it does not represent external
    Azure portal endpoints. B requires maintaining individual IP ranges
    and is not the intended service-based destination selection. D would
    match every destination and block other Internet hosts as well.

    Wording caveat: AzureResourceManager covers Resource Manager endpoints,
    not every web frontend, authentication endpoint, or dependency of the
    Azure portal. There is no AzurePortal tag in the current documented
    service-tag list. Therefore, C identifies the intended NSG destination
    type; do not infer that a single ARM deny guarantees a complete block
    of portal.azure.com. A precise domain-based web restriction requires
    appropriate application-layer filtering, such as a firewall or proxy.

    Exam takeaway: service tag = managed service IP ranges; application
    security group = groups of VM NICs. NSGs match IPs and ports, not URLs.

    [Microsoft Learn: Azure service tags](https://learn.microsoft.com/en-us/azure/virtual-network/service-tags-overview)
    [Microsoft Learn: Azure Resource Manager service tag](https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/service-tags)

- id: '033'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  tags: [must-review]
  question: |
    You have an Azure subscription named Subscription1 that contains an
    Azure Log Analytics workspace named Workspace1.
    You need to view the error events from a table named Event.
    Which query should you run in Workspace1?
  choices:
    A: 'search in (Event) "error"'
    B: 'Event | where EventType is "error"'
    C: 'select * from Event where EventType == "error"'
    D: 'Get-Event Event | where {$_.EventType == "error"}'
  answer: A
  user_answer: B
  user_result: incorrect
  learning_note: |
    Recognize valid KQL rather than SQL or PowerShell syntax. KQL uses
    == for case-sensitive equality and =~ for case-insensitive string
    equality, not is. In the standard Event table, text severity is
    EventLevelName rather than EventType.
  explanation: |
    A is the valid KQL query among the choices. search in (Event) limits
    the search to the Event table, and "error" searches for that term
    across its columns. The default search is case-insensitive.

    B has the familiar table | where structure, but is is not the KQL
    equality operator. Additionally, EventType is not a column in the
    current standard Azure Monitor Event schema. C uses SQL SELECT syntax,
    which is not supported as a Log Analytics query. D resembles PowerShell
    command and script-block syntax rather than KQL.

    A searches for the word error and can also return non-error-severity
    events whose messages mention that word. For a precise severity filter
    in the standard Event table, use:

    ```kusto
    Event
    | where EventLevelName =~ "error"
    ```

    =~ compares strings without case sensitivity; == is case-sensitive.
    The expected exam answer remains A because it is the valid supplied
    query, but term searching and severity filtering are not equivalent.

    Exam takeaway: KQL uses table | operator; search in scopes a term
    search to a table, while where filters using a Boolean expression.

    [Microsoft Learn: KQL search operator](https://learn.microsoft.com/en-us/kusto/query/search-operator)
    [Microsoft Learn: Event table schema](https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/event)
    [Microsoft Learn: KQL string operators](https://learn.microsoft.com/en-us/kusto/query/datatypes-string-operators)

- id: '034'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  question: |
    You have an Azure App Service web app named App1.
    You need to collect performance traces for App1.
    What should you use?
  choices:
    A: Azure Application Insights Profiler
    B: the Activity log
    C: the Deployment center
    D: the Diagnose and solve problems settings
  answer: A
  user_answer: A
  user_result: correct
  explanation: |
    A is correct. Application Insights Profiler captures detailed execution
    traces from a live application to identify slow requests and the code
    paths responsible for bottlenecks. Performance traces is the decisive
    phrase in the question.

    B records Azure resource management events, such as configuration
    changes, rather than application execution performance traces.
    C configures and monitors application deployment workflows.
    D provides broader App Service troubleshooting and diagnostic tools;
    it is a plausible option, but Profiler is the specific tool named for
    collecting these application performance traces. This does not mean
    App Service diagnostics lacks performance investigation capabilities.

    Current Microsoft documentation describes Application Insights Profiler
    for .NET. A real deployment must meet its supported runtime and hosting
    prerequisites and connect the app to Application Insights; the question
    assumes a supported app.

    Exam takeaway: code execution performance traces -> Application Insights
    Profiler; resource management operations -> Activity Log.

    [Microsoft Learn: Application Insights Profiler for App Service](https://learn.microsoft.com/en-us/azure/azure-monitor/profiler/profiler)
    [Microsoft Learn: Troubleshoot App Service performance](https://learn.microsoft.com/en-us/troubleshoot/azure/app-service/troubleshoot-performance-degradation)

- id: '035'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure Azure App Service
  tags: [must-review]
  question: |
    You have an Azure subscription that contains the storage accounts
    shown in the following table.

    | Name | Kind | Location |
    | --- | --- | --- |
    | storage1 | StorageV2 | Central US |
    | storage2 | BlobStorage | West US |
    | storage3 | BlockBlobStorage | West US |
    | storage4 | FileStorage | East US |

    You deploy a web app named App1 to the West US Azure region.
    You need to back up App1. The solution must minimize costs.
    Which storage account should you use as the target for the backup?
  choices:
    A: storage1
    B: storage2
    C: storage3
    D: storage4
  answer: B
  user_answer: B
  user_result: correct
  explanation: |
    B, storage2, is the expected answer. App Service custom backups are
    stored as blobs in an Azure Storage container. storage2 is a standard
    BlobStorage account in West US, the same region as App1. It provides
    the required storage without the premium performance tier or the
    cross-region transfer costs introduced by the other blob choices.

    A, storage1, supports blobs but is in Central US. Sending backup data
    from West US to a different region can incur outbound transfer charges.
    C, storage3, is in the correct region, but BlockBlobStorage is the
    premium block blob account kind. The question provides no performance
    requirement justifying that premium tier for backup storage.
    D, storage4, provides Azure Files rather than a blob container, so it
    is not the target type for App Service custom backups.

    The distinction between BlobStorage and BlockBlobStorage is the key
    account-kind trap: the latter identifies premium block blob storage,
    not simply any account that can store block blobs.

    BlobStorage is a legacy account kind. For a new real-world deployment,
    Microsoft recommends a standard general-purpose v2 account for most
    scenarios; a suitable standard StorageV2 account in West US would be
    a normal modern choice. This question asks which existing account to use.
    Exact pricing depends on capacity, operations, access tier, and redundancy;
    B follows the exam's stated cost assumptions rather than a full price model.

    Exam takeaway: App Service custom backup -> blob container; minimize
    routine backup costs with suitable standard storage in the app's region.

    [Microsoft Learn: App Service backups](https://learn.microsoft.com/en-us/azure/app-service/manage-backup)
    [Microsoft Learn: App Service colocation and transfer costs](https://learn.microsoft.com/en-us/azure/app-service/app-service-best-practices#colocation)
    [Microsoft Learn: Storage account kinds](https://learn.microsoft.com/en-us/azure/storage/common/storage-account-create)

- id: '036'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  question: |
    HOTSPOT
    You have an Azure subscription that is linked to an Azure AD tenant.
    The tenant contains two users named User1 and User2.
    The subscription contains the following resources.

    | Name | Type | Description |
    | --- | --- | --- |
    | RG1 | Resource group | None |
    | VM1 | Virtual machine | Created in RG1 |

    The subscription contains the following alert rules.

    | Name | Scope | Condition |
    | --- | --- | --- |
    | Alert1 | RG1 | All Administrative operations |
    | Alert2 | VM1 | All Administrative operations |

    The users perform the following actions:
    - User1 creates a new virtual disk and attaches the disk to VM1.
    - User2 creates a new resource tag and assigns the tag to RG1 and VM1.

    Which alert rules are triggered by each user?
    Select the appropriate options. Each correct selection is worth one point.
  choices:
    User1:
      - No alert is triggered
      - Only Alert1 is triggered
      - Only Alert2 is triggered
      - Alert1 and Alert2 are triggered
    User2:
      - No alert is triggered
      - Only Alert1 is triggered
      - Only Alert2 is triggered
      - Alert1 and Alert2 are triggered
  answer:
    User1: Alert1 and Alert2 are triggered
    User2: Alert1 and Alert2 are triggered
  user_answer:
    User1: Alert1 and Alert2 are triggered
    User2: No alert is triggered
  user_result: partially_correct
  user_reasoning: |
    Assumed assigning resource tags is not an Administrative operation.
  learning_note: |
    Tag assignment updates Azure resource metadata through Resource Manager
    and is an Administrative operation. Administrative includes management
    writes, deletes, and actions, not just major infrastructure changes.
  explanation: |
    Both users trigger Alert1 and Alert2.

    User1 attaches a disk to VM1, which updates VM1 through Resource Manager.
    The VM update is an Administrative operation within both the VM1 scope
    of Alert2 and the containing RG1 scope of Alert1. Disk creation can
    generate a separate event, but attachment to VM1 is sufficient to
    explain why both rules trigger.

    User2 assigns tags to RG1 and VM1. Tags are resource metadata, and
    updating them is a Resource Manager write operation recorded in the
    Administrative category. Tagging RG1 matches Alert1. Tagging VM1
    matches Alert2 and also falls within Alert1's RG1 scope.

    The learner's first selection is correct. The second is corrected
    because Administrative operations include metadata updates, not only
    creation, deletion, or hardware configuration changes. The category
    includes Resource Manager create, update, delete, and action operations.

    Activity log alert scopes use resource ID prefixes: a resource group
    scope includes resources below it, while a VM scope targets that VM
    and events under its resource ID. The question asks which rules fire,
    not the exact number of alert instances generated by multiple events.

    Azure AD is now named Microsoft Entra ID. These operations affect
    Azure resources and their Activity Logs, rather than tenant sign-in logs.

    Exam takeaway: changing tags is a management-plane update and can
    trigger an All Administrative operations Activity Log alert.

    [Microsoft Learn: Administrative Activity Log events](https://learn.microsoft.com/en-us/azure/azure-monitor/fundamentals/activity-log-schema#administrative-category)
    [Microsoft Learn: Activity log alert scopes](https://learn.microsoft.com/en-us/azure/templates/microsoft.insights/activitylogalerts)

- id: '038'
  skill: Implement and manage virtual networking
  sub-skill: Configure secure access to virtual networks
  question: |
    You have an Azure subscription that contains eight virtual machines
    and the resources shown in the following table.

    | Name | Description |
    | --- | --- |
    | storage1 | Storage account |
    | storage2 | Storage account |
    | KeyVault1 | Key vault |
    | VNET1 | Virtual network with a single subnet that has five virtual machines connected |
    | VNET2 | Virtual network with a single subnet that has three virtual machines connected |

    You need to configure access for VNET1. The solution must meet the
    following requirements:
    - The virtual machines connected to VNET1 must be able to communicate
      with the virtual machines connected to VNET2 by using the Microsoft backbone.
    - The virtual machines connected to VNET1 must be able to access
      storage1, storage2, and Azure AD by using the Microsoft backbone.

    What is the minimum number of service endpoints you should add to VNET1?
  choices:
    A: '1'
    B: '2'
    C: '3'
    D: '5'
  answer: A
  user_answer: B
  user_result: incorrect
  user_reasoning: Counted one service endpoint for each of the two storage accounts.
  learning_note: |
    Service endpoints are enabled per service type on a subnet, not once
    per target account. One Storage service endpoint configuration can
    serve multiple storage accounts. VNet peering is separate, and Entra
    ID does not natively support service endpoints.
  explanation: |
    A, 1, is the supported answer under current Microsoft documentation.
    Enable a Storage service endpoint on VNET1's single subnet. That one
    service-type configuration can provide a backbone route to both
    storage1 and storage2; configure access rules on each storage account
    separately if their firewalls restrict access. Use Microsoft.Storage
    for the supported regional coverage, or Microsoft.Storage.Global for
    accounts across regions. The subnet uses one Storage endpoint type,
    not a separate service endpoint per storage account.

    Use virtual network peering for communication between VNET1 and VNET2
    over the Microsoft backbone. Peering is not a service endpoint.
    KeyVault1 is listed but is not included in the access requirements,
    so do not add a Key Vault endpoint merely because it appears in the table.

    Azure AD is now Microsoft Entra ID. Microsoft documentation explicitly
    states that Entra ID does not natively support service endpoints.
    The historical Microsoft.AzureActiveDirectory endpoint supported
    Data Lake Storage Gen1 network integration, not general tenant sign-in
    access. Azure-hosted public service traffic can use the Microsoft
    backbone without a dedicated Entra ID service endpoint; this is not
    the same as providing a private endpoint or eliminating public endpoints.

    Older answer keys may count Storage plus Microsoft.AzureActiveDirectory
    and select 2. That interpretation should be flagged as outdated or
    misleading for the question's generic Azure AD requirement. Regardless
    of an older key, the learner's one-per-storage-account reasoning is
    incorrect: service endpoint configurations are per service per subnet.

    The screenshot identifies this as Question 38; no Question 37 was
    supplied in this conversation.

    Exam takeaway: count required supported service types per subnet,
    not accounts, VMs, or all resources listed in the scenario.

    [Microsoft Learn: Service endpoints overview](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoints-overview)
    [Microsoft Learn: Entra ID does not natively support service endpoints](https://learn.microsoft.com/en-us/azure/private-link/private-link-faq#does-microsoft-entra-id-support-virtual-network-service-endpoints)
    [Microsoft Learn: Storage service endpoint types](https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security)

- id: '039'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure Azure App Service
  tags: [must-review]
  question: |
    You need to configure an Azure web app named contoso.azurewebsites.net
    to host www.contoso.com.
    What should you do first?
  choices:
    A: Create A records named www.contoso.com and asuid.contoso.com.
    B: Create a TXT record named asuid that contains the domain verification ID.
    C: Create a CNAME record named asuid that contains the domain verification ID.
    D: Create a TXT record named www.contoso.com that has a value of contoso.azurewebsites.net.
  answer: B
  user_answer: C
  user_result: incorrect
  learning_note: |
    Domain ownership verification uses a TXT record containing the App
    Service verification ID. A CNAME maps the custom hostname to the
    app hostname; it does not store a verification token. For www, the
    verification record is asuid.www in the contoso.com DNS zone.
  explanation: |
    B is the intended answer because the domain verification ID belongs
    in a TXT record. Prove ownership before completing the custom-domain
    binding in App Service.

    The supplied B has a hostname wording defect: for www.contoso.com,
    the documented TXT host is asuid.www in the contoso.com zone, yielding
    asuid.www.contoso.com. Bare asuid is the root-domain verification host.
    Therefore, B is the intended record-type answer, but none of the choices
    states the exact modern www verification record correctly.

    The two DNS records for the requested subdomain are:
    - TXT: asuid.www -> the app's custom domain verification ID.
    - CNAME: www -> contoso.azurewebsites.net.

    The TXT proves ownership; the CNAME routes name resolution to the app.
    After DNS propagation, add www.contoso.com in the app's Custom domains
    settings, validate, and complete the binding. DNS records alone do not
    configure App Service to accept the custom hostname.

    A is wrong because A records contain IPv4 addresses, and the verification
    record must be TXT. C is wrong because a CNAME value is a DNS hostname,
    not the domain verification ID. D places the app hostname in a TXT
    record rather than creating the CNAME mapping or TXT verification token.

    Exam takeaway: TXT + verification ID = ownership; CNAME + app hostname
    = subdomain mapping. For www, use TXT host asuid.www.

    [Microsoft Learn: Map an existing custom domain](https://learn.microsoft.com/en-us/azure/app-service/app-service-web-tutorial-custom-domain)
    [Microsoft Learn: Verify a domain before migrating traffic](https://learn.microsoft.com/en-us/azure/app-service/manage-custom-dns-migrate-domain)

- id: '040'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  question: |
    You have an Azure subscription that contains 10 network security
    groups (NSGs), 10 virtual machines, and a Log Analytics workspace
    named Workspace1. Each NSG is connected to a virtual machine.
    You need to configure an Azure Monitor Network Insights alert that
    will be triggered when suspicious network traffic is detected.
    What should you do first?
  choices:
    A: Deploy Connection Monitor.
    B: Configure data collection endpoints.
    C: Configure a private link.
    D: Configure NSG flow logs.
  answer: D
  user_answer: D
  user_result: correct
  explanation: |
    D is the expected answer for this older question. NSG flow logs capture
    IP traffic details, such as source and destination addresses, ports,
    protocol, and allow/deny results. Configure collection first so Traffic
    Analytics and log-based alerts have network traffic data to analyze.

    In this legacy workflow, raw flow logs are written to an Azure Storage
    account. Enable Traffic Analytics with Workspace1 to obtain processed
    traffic data in Log Analytics, then configure an appropriate alert query
    and action group. Flow logging alone does not automatically detect every
    suspicious flow or create an alert.

    A tests reachability, connection failures, and latency between specified
    endpoints; it is not the traffic collection prerequisite asked for.
    B supplies ingestion endpoints for supported Azure Monitor collection
    scenarios, not NSG flow recording. C provides private service connectivity,
    not collection or detection of suspicious network traffic.

    Current deployment caveat: creation of new NSG flow logs stopped after
    June 30, 2025. Existing NSG flow logs retire on September 30, 2027.
    For a new deployment, configure virtual network flow logs and Traffic
    Analytics instead. Preserve D as the historical exam answer; none of
    the supplied choices names the current replacement workflow.

    Exam takeaway: collect flow records before traffic analysis and alerts.
    Connection Monitor tests connectivity; flow logs record network flows.

    [Microsoft Learn: Network Insights traffic view](https://learn.microsoft.com/en-us/azure/network-watcher/network-insights-overview)
    [Microsoft Learn: NSG flow logs retirement](https://learn.microsoft.com/en-us/azure/network-watcher/nsg-flow-logs-portal)
    [Microsoft Learn: Network monitoring and VNet flow logs](https://learn.microsoft.com/en-us/azure/networking/design-guide/monitor)

- id: '041'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  question: |
    HOTSPOT
    You have an Azure subscription named Sub1 that contains the following resources.

    | Name | Description |
    | --- | --- |
    | RG1 | Resource group |
    | Action1 | Action group that sends an email message to admin1@contoso.com |

    Sub1 contains the following alert rule:
    - Name: Alert1
    - Scope: All resource groups in Sub1; include all future resources
    - Condition: All administrative operations
    - Actions: Action1

    Sub1 contains the following alert processing rule:
    - Name: Rule1
    - Scope: Sub1
    - Rule type: Suppress notifications
    - Apply the rule: On a specific time
    - Start: August 10, 2022
    - End: August 13, 2022

    For each statement, select Yes if the statement is true. Otherwise,
    select No. Each correct selection is worth one point.

    1. If you create a resource group in Sub1 on August 11, 2022,
       Alert1 is listed in the Azure portal.
    2. If you create a resource group in Sub1 on August 12, 2022,
       an email message is sent to admin1@contoso.com.
    3. If you add a tag to RG1 on August 15, 2022,
       an email message is sent to admin1@contoso.com.
  choices:
    - 'Yes'
    - 'No'
  answer:
    - 'Yes'
    - 'No'
    - 'Yes'
  user_answer:
    - 'Yes'
    - 'No'
    - 'Yes'
  user_result: correct
  user_reasoning: |
    For the first statement, the alert is still listed even though the
    email notification is suppressed.
  explanation: |
    Yes, No, Yes is correct. An alert processing rule that suppresses
    notifications does not disable the alert rule or prevent a matching
    alert from firing. It removes the action groups from affected fired
    alerts, while those alerts remain visible in the Azure portal.

    1. Yes: resource group creation on August 11 is an Administrative
       operation within Alert1's scope, which includes future resources.
       The alert fires and remains listed, although Rule1 suppresses Action1.
    2. No: August 12 is inside the August 10-13 suppression window.
       The alert can fire, but Action1 is suppressed, so no email is sent.
    3. Yes: adding a tag to RG1 is a Resource Manager update and therefore
       an Administrative operation. August 15 is outside Rule1's window,
       so Action1 runs and sends the email for the new matching alert.

    Notifications suppressed during the window are not queued for delivery
    when the window ends. The August 15 email is caused by the new tag update,
    not by replaying an earlier suppressed alert.

    The dates belong to the hypothetical scenario. No exact boundary-time
    assumption is necessary because the tested dates fall clearly inside
    or outside the suppression window.

    Exam takeaway: alert rule determines whether an alert fires; action
    group determines the response; alert processing rule can suppress that
    response while retaining the fired alert.

    [Microsoft Learn: Alert processing rules](https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-processing-rules)
    [Microsoft Learn: Administrative Activity Log events](https://learn.microsoft.com/en-us/azure/azure-monitor/fundamentals/activity-log-schema#administrative-category)

- id: '042'
  skill: Implement and manage storage
  sub-skill: Configure and manage storage accounts
  tags: [must-review]
  question: |
    You have an Azure subscription that contains a storage account named
    storage1 in the North Europe Azure region.
    You need to ensure that when blob data is added to storage1, a secondary
    copy is created in the East US region. The solution must minimize
    administrative effort.
    What should you configure?
  choices:
    A: operational backup
    B: object replication
    C: geo-redundant storage (GRS)
    D: a lifecycle management rule
  answer: B
  user_answer: C
  user_result: incorrect
  learning_note: |
    GRS replicates to Azure's designated secondary region, not an arbitrary
    destination. North Europe is paired with West Europe. Use object
    replication to copy block blobs to a chosen account in East US.
  explanation: |
    B is correct. Configure object replication from storage1's source
    containers to destination containers in a supported storage account
    in East US. Once configured, Azure asynchronously copies new block
    blobs according to the replication rules, avoiding a custom copy job.

    C is tempting because GRS automatically creates a secondary-region
    copy. However, you cannot choose East US as the GRS secondary for a
    North Europe account: its paired region is West Europe. The explicit
    East US destination requirement eliminates GRS despite its low effort.

    A, operational backup, provides local point-in-time protection for
    blobs rather than the specified copy in a chosen remote region.
    D, lifecycle management, automates tier transitions and deletion;
    it does not copy blobs into another region or account.

    Object replication requires change feed on the source account and
    blob versioning on both source and destination accounts. It supports
    block blobs in general-purpose v2 or premium block blob accounts,
    not append or page blobs. The exam assumes supported account and blob
    types. Replication is asynchronous, so the copy is not instantaneous.

    Exam takeaway: GRS -> designated secondary region; object replication
    -> chosen destination account and region for supported block blobs.

    [Microsoft Learn: Object replication](https://learn.microsoft.com/en-us/azure/storage/blobs/object-replication-overview)
    [Microsoft Learn: Storage redundancy](https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy)
    [Microsoft Learn: North Europe and West Europe region pairing](https://learn.microsoft.com/en-us/azure/reliability/regions-paired)

- id: '043'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  tags: [must-review]
  question: |
    You have an Azure subscription that contains two Log Analytics
    workspaces named Workspace1 and Workspace2 and 100 virtual machines
    that run Windows Server.
    You need to collect performance data and events from the virtual machines.
    The solution must meet the following requirements:
    - Logs must be sent to Workspace1 and Workspace2.
    - All Windows events must be captured.
    - All security events must be captured.
    What should you install and configure on each virtual machine?
  choices:
    A: the Azure Monitor agent
    B: the Windows Azure diagnostics extension (WAD)
    C: the Windows VM agent
  answer: A
  user_answer: A
  user_result: correct
  explanation: |
    A is correct. Azure Monitor Agent (AMA) collects guest performance
    counters and Windows event logs and supports delivery to multiple
    Log Analytics workspaces through data collection rules (DCRs).

    Install AMA on each VM and associate suitable DCRs. Configure performance
    counter collection, include all required Windows event channels and
    event levels, explicitly include the Security channel, and route the
    collected data to both Workspace1 and Workspace2. Avoid XPath filters
    that exclude events required by the question. Installation alone does
    not configure collection, and selecting only System and Application
    does not capture Security or every other channel.

    Security events can be collected through an ordinary Windows events
    DCR into the Event table. Microsoft Sentinel's Windows Security Events
    via AMA connector instead sends them to SecurityEvent; Sentinel is not
    required solely to collect Security log events into Log Analytics.
    Collection can only capture events generated by the operating system;
    configure Windows auditing appropriately for the desired security events.

    B is a legacy diagnostics extension primarily associated with Azure
    Storage and diagnostic metrics collection, not the required AMA/DCR
    multi-workspace collection workflow. C is the VM extension-management
    agent; it enables extension deployment and is not itself the guest
    performance and event-log collection agent requested here.

    For 100 VMs, Azure Policy can automate AMA deployment and DCR association.
    Sending the same data to two workspaces incurs ingestion costs in both.

    Exam takeaway: VM guest counters and event logs to Log Analytics ->
    AMA + DCRs; the Windows VM agent manages extensions.

    [Microsoft Learn: Collect Windows events with AMA](https://learn.microsoft.com/en-us/azure/azure-monitor/vm/data-collection-windows-events)
    [Microsoft Learn: VM data collection rules](https://learn.microsoft.com/en-us/azure/azure-monitor/vm/monitor-virtual-machine-data-collection)
    [Microsoft Learn: Install and manage AMA](https://learn.microsoft.com/en-us/azure/azure-monitor/agents/azure-monitor-agent-manage)

- id: '044'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  question: |
    You have an Azure subscription that contains a virtual machine named
    VM1 and an Azure function named App1.
    You need to create an alert rule that will run App1 if VM1 stops.
    What should you create for the alert rule?
  choices:
    A: an application security group
    B: a security group that has dynamic device membership
    C: an action group
    D: an application group
  answer: C
  user_answer: C
  user_result: correct
  explanation: |
    C is correct. An Azure Monitor action group defines the notifications
    and automated actions to execute when an alert fires. Add an Azure
    Function action targeting App1 and attach the action group to the
    alert rule. The function action invokes an HTTP-triggered function.

    The alert rule detects the condition; the action group performs the
    response. Choose a condition appropriate to what stops means: an
    Activity Log alert can detect a management stop or deallocate operation,
    while unexpected unavailability needs a suitable health or monitoring
    signal. Creating an action group alone does not detect VM shutdown.

    A groups VM network interfaces for NSG rule matching. B groups devices
    in Microsoft Entra ID by membership rules, not alert response actions.
    D is not the Azure Monitor mechanism for invoking a function.

    Exam takeaway: alert condition -> alert fires -> action group ->
    Azure Function runs. Action groups support automation as well as email.

    [Microsoft Learn: Azure Monitor action groups](https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/action-groups)

- id: '045'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  question: |
    You have an Azure subscription that contains a virtual network named VNet1.
    VNet1 uses two ExpressRoute circuits that connect to two separate
    on-premises datacenters.
    You need to create a dashboard to display detailed metrics and a
    visual representation of the network topology.
    What should you use?
  choices:
    A: Azure Monitor Network Insights
    B: a Data Collection Rule (DCR)
    C: Azure Virtual Network Watcher
    D: Log Analytics
  answer: A
  user_answer: C
  user_result: incorrect
  learning_note: |
    Network Watcher has topology and diagnostic capabilities, but Azure
    Monitor Network Insights provides the combined ExpressRoute topology,
    health, and detailed metrics dashboard requested by this question.
  explanation: |
    A is correct. Azure Monitor Network Insights provides ExpressRoute
    topology maps and a detailed, preloaded metrics dashboard. Its functional
    dependency view shows relationships between circuits, peerings,
    connections, and gateways. The metrics dashboard includes availability,
    throughput, packet drops, and gateway metrics.

    C is tempting because Network Watcher includes topology and network
    troubleshooting tools, and its capabilities are integrated with Network
    Insights. However, the specific combined ExpressRoute metrics and
    topology dashboard requested here is the Network Insights experience.
    The option calls the service Azure Virtual Network Watcher; the standard
    service name is Azure Network Watcher.

    B specifies how supported monitoring data is collected and delivered;
    it is not a dashboard or topology visualization tool. D queries and
    analyzes log data and can support custom monitoring solutions, but does
    not itself provide the ready-made ExpressRoute topology and metrics view.

    Hands-on connection: in Azure Monitor, open Networks, select the
    ExpressRoute Circuits card, open a circuit's topology, then choose
    View detailed metrics to inspect the built-in dashboard.

    Exam takeaway: ExpressRoute topology plus a detailed metrics dashboard
    -> Azure Monitor Network Insights.

    [Microsoft Learn: ExpressRoute Network Insights](https://learn.microsoft.com/en-us/azure/expressroute/expressroute-network-insights)
    [Microsoft Learn: Network Insights overview](https://learn.microsoft.com/en-us/azure/network-watcher/network-insights-overview)

- id: '046'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  question: |
    You deploy Azure virtual machines to three Azure regions.
    Each region contains a virtual network. Each virtual network contains
    multiple subnets peered in a full mesh topology.
    Each subnet contains a network security group (NSG) that has defined rules.
    A user reports that he cannot use port 33000 to connect from a virtual
    machine in one region to a virtual machine in another region.
    Which two options can you use to diagnose the issue?
    Each correct answer presents a complete solution.
    Each correct selection is worth one point.
  choices:
    A: Azure Virtual Network Manager
    B: IP flow verify
    C: Azure Monitor Network Insights
    D: Connection troubleshoot
    E: effective security rules
  answer: BD
  user_answer: BD
  user_result: correct
  explanation: |
    B and D are the expected selections. Both are Azure Network Watcher
    diagnostic tools targeting the reported connectivity problem.

    IP flow verify evaluates a specified packet's direction, protocol,
    source/destination IPs, and ports against the security rules that apply
    to a VM NIC. It returns Allowed or Denied and the deciding rule. Check
    source outbound and destination inbound filtering using the real traffic
    tuple: port 33000 is the destination service port, while the client's
    source port is typically an ephemeral port. This diagnoses security-rule
    filtering; it does not prove application or end-to-end availability.

    Connection troubleshoot tests the path from the source VM to the target
    IP or VM on destination port 33000, assuming TCP. It can identify issues
    such as NSG blocking, missing routes, or guest firewall problems.

    A centrally manages network connectivity and security configurations;
    it is not the specific per-flow test requested. C provides topology,
    health, and metrics views and links to diagnostic tools, but is not
    itself the direct connectivity test represented by B and D.

    E is a plausible distractor, not a useless tool. Effective security
    rules shows the combined subnet and NIC NSG rules and can help manually
    identify an NSG problem. Microsoft documents it as a troubleshooting
    method. B and D are the expected two direct diagnostic tools, but the
    broad wording diagnose the issue makes E defensible for manual NSG
    investigation; do not memorize that effective rules cannot diagnose
    connectivity problems.

    Wording correction: virtual networks are peered, not their subnets.
    Interpret the scenario as three VNets peered in a full mesh, each with
    multiple subnets and subnet-associated NSGs. The original wording is
    retained in the question field rather than silently changing the setup.

    Exam takeaway: IP flow verify -> allowed/denied and deciding rule;
    Connection troubleshoot -> connection path; effective rules -> inspect
    the combined security configuration.

    [Microsoft Learn: IP flow verify](https://learn.microsoft.com/en-us/azure/network-watcher/ip-flow-verify-overview)
    [Microsoft Learn: Connection troubleshoot](https://learn.microsoft.com/en-us/azure/network-watcher/connection-troubleshoot-overview)
    [Microsoft Learn: Diagnose NSG blocking, including effective rules](https://learn.microsoft.com/en-us/troubleshoot/azure/virtual-network/virtual-network-troubleshoot-nsg-blocking-traffic)

- id: '047'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  question: |
    You have an Azure subscription.
    You need to receive an email alert when a resource lock is removed
    from any resource in the subscription.
    What should you use to create an activity log alert in Azure Monitor?
  choices:
    A: a resource, a condition, and an action group
    B: a resource, a condition, and a Microsoft 365 group
    C: a Log Analytics workspace, a resource, and an action group
    D: a data collection endpoint, an application security group, and a resource group
  answer: A
  user_answer: A
  user_result: correct
  explanation: |
    A is correct. Configure the monitored resource scope, the event
    condition, and an action group that sends the required email.

    Scope the alert to the subscription so lock deletions on any resource
    within it are covered. Choose the Administrative operation Delete
    management locks (Microsoft.Authorization/locks/delete). Filter for
    Succeeded to notify about completed removals rather than attempted
    deletions that fail. Add an action group with the desired email receiver.

    A direct Activity Log alert evaluates Activity Log events without
    requiring a Log Analytics workspace or export to AzureActivity. A
    workspace could support a separate log-query alert, but is not a
    prerequisite for the Activity Log alert requested here.

    B substitutes a Microsoft 365 group for Azure Monitor's action group.
    A group email address could be a receiver, but an action group still
    defines the notification action. C omits the event condition and adds
    an unnecessary workspace. D contains unrelated ingestion and network
    grouping components rather than the alert's condition and response.

    Exam takeaway: scope = where; condition = when; action group = response.
    Subscription scope covers resource lock removals across the subscription.

    [Microsoft Learn: Create an Activity Log alert](https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-create-activity-log-alert-rule)
    [Microsoft Learn: Action groups](https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/action-groups)
    [Microsoft Learn: Resource locks](https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources)

- id: '048'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  question: |
    HOTSPOT
    You have an Azure subscription that contains the alerts shown in
    the following exhibit.

    Summary: Total alerts 4; Critical 0; Error 0; Warning 0;
    Informational 0; Verbose 4. Grouping: No grouping.
    The exhibit includes Search, Add filter, and More (4) controls.

    | Name | Severity | Alert condition | User response | Fired time |
    | --- | --- | --- | --- | --- |
    | Alert2 | 4 - Verbose | Fired | New | 4/29/2022, 2:09 PM |
    | Alert2 | 4 - Verbose | Fired | New | 4/29/2022, 2:09 PM |
    | Alert1 | 4 - Verbose | Fired | Closed | 4/29/2022, 2:04 PM |
    | Alert1 | 4 - Verbose | Fired | Closed | 4/29/2022, 2:04 PM |

    Use the drop-down menus to complete each statement based on the exhibit.
    Each correct selection is worth one point.

    1. For Alert1, User response [answer choice].
    2. For Alert2, User response [answer choice].
  choices:
    Alert1:
      - cannot be changed
      - can be changed to New only
      - can be changed to Acknowledged only
      - can be changed to New or Acknowledged
    Alert2:
      - cannot be changed
      - can be changed to Acknowledged only
      - can be changed to Closed only
      - can be changed to Acknowledged or Closed
  answer:
    Alert1: can be changed to New or Acknowledged
    Alert2: can be changed to Acknowledged or Closed
  user_answer:
    Alert1: cannot be changed
    Alert2: can be changed to Acknowledged or Closed
  user_result: partially_correct
  learning_note: |
    Closed is not an irreversible user response. Authorized users can
    switch alert responses among New, Acknowledged, and Closed. User
    response is independent of the system-managed Fired/Resolved condition.
  explanation: |
    Alert1 can be changed to New or Acknowledged. Alert2 can be changed
    to Acknowledged or Closed. The learner's second selection is correct;
    the first incorrectly treats Closed as a terminal response state.

    User response tracks a person's handling of the alert:
    - New: not yet handled.
    - Acknowledged: recognized and under investigation.
    - Closed: marked handled by the user.
    An authorized user can change this response, including reopening a
    Closed alert by setting it to New or Acknowledged.

    Alert condition is a separate system-managed field, usually Fired or
    Resolved. Closing the user response does not force the underlying
    monitored condition to resolve. Therefore, the exhibit can legitimately
    show Alert1 as both Fired and Closed. Stateless event-based alerts
    can remain Fired without an ongoing unhealthy condition.

    The choices ask about user-response transitions, not changing the
    severity, rule configuration, fired timestamp, or monitor condition.
    The duplicate alert names represent multiple alert instances in the
    exhibit and do not change the available user-response values.

    Exam takeaway: users change New/Acknowledged/Closed; the monitoring
    system determines Fired/Resolved. Closed can be reopened.

    [Microsoft Learn: Manage alert instances](https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-manage-alert-instances)
    [Microsoft Learn: Change alert state API](https://learn.microsoft.com/en-us/rest/api/alerts-management/alerts/alerts/change-state?view=rest-alerts-management-alerts-2019-03-01)

- id: '049'
  skill: Monitor and maintain Azure resources
  sub-skill: Implement backup and recovery
  question: |
    HOTSPOT
    You create a Recovery Services vault backup policy named Policy1
    with the following settings.

    | Setting | Value |
    | --- | --- |
    | Policy name | Policy1 |
    | Backup frequency | Daily |
    | Backup time | 11:00 PM |
    | Timezone | (UTC) Coordinated Universal Time |
    | Instant recovery snapshot retention | 2 days |
    | Daily backup point retention | 11:00 PM; 30 days |
    | Weekly backup point retention | Enabled; Sunday at 11:00 PM; 10 weeks |
    | Monthly backup point retention | Enabled; Day Based; day 1 at 11:00 PM; 36 months |
    | Yearly backup point retention | Enabled; Day Based; March 1 at 11:00 PM; 10 years |

    Use the drop-down menus to complete each statement based on the exhibit.
    Each correct selection is worth one point.

    1. The backup that occurs on Sunday, March 1, will be retained for [answer choice].
    2. The backup that occurs on Sunday, November 1, will be retained for [answer choice].
  choices:
    march_1:
      - 30 days
      - 10 weeks
      - 36 months
      - 10 years
    november_1:
      - 30 days
      - 10 weeks
      - 36 months
      - 10 years
  answer:
    march_1: 10 years
    november_1: 36 months
  user_answer:
    march_1: 10 years
    november_1: 36 months
  user_result: correct
  explanation: |
    Both selections are correct. A recovery point matching multiple
    retention rules is kept until its longest applicable retention expires.
    The retention periods are not added together.

    Sunday, March 1 matches all four rules: daily 30 days, weekly Sunday
    10 weeks, monthly day 1 for 36 months, and yearly March 1 for 10 years.
    Therefore, this recovery point is retained for 10 years.

    Sunday, November 1 matches daily, weekly, and monthly retention.
    It does not match the yearly rule, which selects March 1 specifically.
    Therefore, the longest applicable retention is 36 months.

    Monthly and yearly settings are Day Based, not Week Based: the
    specified day-of-month determines those selections. Sunday matters
    only for the weekly rule. The two-day instant recovery snapshot
    retention is a separate local snapshot window; it does not limit
    the vault recovery point's long-term retention.

    Exam takeaway: identify every matching retention rule, then use the
    longest duration. Do not add durations or confuse snapshot retention
    with vault recovery-point retention.

    Instant Restore retention is a duration, not a fixed snapshot count.
    Each backup's disk snapshots are retained in the snapshot tier for
    two days to allow faster restoration. With one successful backup per
    day, roughly two recent snapshot recovery points are normally available.
    This does not necessarily mean two physical snapshots: a VM can have
    multiple disks, cleanup can be delayed, and the latest snapshot can be
    retained longer if subsequent backups fail.

    The snapshot tier and vault tier have separate retention windows.
    For the March 1 recovery point, the snapshot tier is available for
    approximately the first two days. After those snapshots expire, the
    vault recovery point remains available for its ten-year retention.
    Thus, two days controls the fast-restore window, not the backup lifetime.

    [Microsoft Learn: Instant Restore snapshot retention](https://learn.microsoft.com/en-us/azure/backup/backup-instant-restore-capability)
    [Microsoft Learn: Backup retention policies](https://learn.microsoft.com/en-us/azure/backup/backup-azure-backup-cloud-as-tape)
    [Microsoft Learn: Azure VM backup retention](https://learn.microsoft.com/en-us/azure/backup/backup-support-matrix-iaas)

- id: '050'
  skill: Monitor and maintain Azure resources
  sub-skill: Implement backup and recovery
  question: |
    HOTSPOT
    You have an Azure subscription that contains the following vaults.

    | Name | Type |
    | --- | --- |
    | Recovery1 | Recovery Services vault |
    | Backup1 | Azure Backup vault |

    You deploy the following virtual machines.

    | Name | Operating system | Security Configuration |
    | --- | --- | --- |
    | VM1 | Windows Server | Azure Disk Encryption |
    | VM2 | Linux | Trusted Launch |

    You have the following backup policies.

    | Name | Type | In vault |
    | --- | --- | --- |
    | Policy1 | Standard | Recovery1 |
    | Policy2 | Enhanced | Recovery2 |
    | Policy3 | Not applicable | Backup1 |

    For each statement, select Yes if the statement is true. Otherwise,
    select No. Each correct selection is worth one point.

    1. VM1 can be backed up by using Policy1.
    2. VM2 can be backed up by using Policy3.
    3. VM2 can be backed up by using Policy2.
  choices:
    - 'Yes'
    - 'No'
  answer:
    - 'Yes'
    - 'No'
    - 'Yes'
  user_answer:
    - 'Yes'
    - 'Yes'
    - 'Yes'
  user_result: partially_correct
  learning_note: |
    Recovery Services vaults support whole Azure VM backup. Backup vaults
    support different workloads, including individual disks; disk backup
    is not equivalent to backing up the VM. Check vault type before policy.
  explanation: |
    The intended answers are Yes, No, Yes, subject to the exhibit's vault
    naming inconsistency described below.

    1. Yes: Azure VM Backup supports Windows VMs protected with Azure Disk
       Encryption. A Standard policy in Recovery1 can protect VM1, assuming
       normal prerequisites such as supported disks, region, and required
       Key Vault access for encryption keys and secrets are satisfied.
    2. No: Policy3 is in Backup1, a Backup vault. Whole Azure VM backup uses
       a Recovery Services vault. A Backup vault can protect supported
       individual managed disks, but that is not VM-level backup of VM2.
    3. Yes, under the intended setup: Enhanced policy in a Recovery Services
       vault supports Trusted Launch VMs, including supported Linux VMs.

    Exhibit defect: Policy2 is listed in Recovery2, but the vault table
    defines only Recovery1 and Backup1. The third answer assumes Recovery2
    is a Recovery Services vault or that the name is a typo for Recovery1.
    As written, the existence and type of Recovery2 cannot be verified;
    retain this caveat rather than silently correcting the question.

    Current-version nuance: Trusted Launch backup also supports Standard
    policy through supported recent CLI, PowerShell, and REST API versions.
    Enhanced remains supported and is the relevant policy in this question.
    Do not generalize the older distinction into Trusted Launch always
    requiring Enhanced for every management interface.

    Exam takeaway: identify the protected workload, then its vault type,
    then policy/security support. Recovery Services vault -> whole VM;
    Backup vault -> workloads such as standalone Azure Disk Backup.

    [Microsoft Learn: VM backup support, encryption and Trusted Launch](https://learn.microsoft.com/en-us/azure/backup/backup-support-matrix-iaas)
    [Microsoft Learn: Supported vaults and workloads](https://learn.microsoft.com/en-us/azure/backup/backup-support-matrix)
    [Microsoft Learn: Enhanced VM backup policy](https://learn.microsoft.com/en-us/azure/backup/backup-azure-vms-enhanced-policy)

- id: '051'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  question: |
    You have an Azure subscription. The subscription contains virtual machines
    that connect to a virtual network named VNet1.

    You plan to configure Azure Monitor for VM Insights.

    You need to ensure that all the virtual machines only communicate with
    Azure Monitor through VNet1.

    What should you create first?
  choices:
    A: a data collection rule (DCR)
    B: a Log Analytics workspace
    C: an Azure Monitor Private Link Scope (AMPLS)
    D: a private endpoint
  answer: C
  user_answer: C
  user_result: correct
  explanation: |
    C is correct. The decisive words are "only communicate ... through VNet1"
    and "first": the question tests Azure Monitor Private Link setup order.

    An Azure Monitor Private Link Scope (AMPLS) groups the Azure Monitor
    resources to expose privately. Create the scope, connect monitoring
    resources such as a Log Analytics workspace and data collection endpoint
    to it, and then connect the scope to a private endpoint in VNet1.
    The private endpoint supplies a private IP address in the virtual network.

    A DCR specifies what monitoring data to collect and its destinations;
    it does not establish private network connectivity. A Log Analytics
    workspace stores logs but does not itself enforce a private path.
    A private endpoint is required later, but the AMPLS is its target and
    must exist first.

    Creating AMPLS alone does not complete the requirement. Finish private
    endpoint and private DNS configuration, configure the agent's required
    data collection endpoint, and apply appropriate private-only and public
    network access restrictions to enforce private communication.

    Exam takeaway: Azure Monitor private connectivity starts with AMPLS;
    the private endpoint connects the VNet to that scope.

    [Microsoft Learn: Configure private link for Azure Monitor](https://learn.microsoft.com/en-us/azure/azure-monitor/fundamentals/private-link-configure)
    [Microsoft Learn: Azure Monitor Agent private link](https://learn.microsoft.com/en-us/azure/azure-monitor/agents/azure-monitor-agent-private-link)

- id: '052'
  tags:
    - must-review
  skill: Monitor and maintain Azure resources
  sub-skill: Implement backup and recovery
  question: |
    HOTSPOT

    You have an Azure subscription that contains the following vaults.

    | Name | Type |
    | --- | --- |
    | Backup1 | Backup vault |
    | Recovery1 | Recovery Services vault |

    You create a storage account that contains the following resources.

    | Name | Type |
    | --- | --- |
    | cont1 | Blob container |
    | share1 | File share |

    To which vault can you back up cont1 and share1? Select the appropriate
    option for each resource.
  choices:
    cont1:
      - Backup1 only
      - Recovery1 only
      - Backup1 or Recovery1
      - Cannot be backed up to Backup1 or Recovery1
    share1:
      - Backup1 only
      - Recovery1 only
      - Backup1 or Recovery1
      - Cannot be backed up to Backup1 or Recovery1
  answer:
    cont1: Backup1 only
    share1: Recovery1 only
  user_answer:
    cont1: Backup1 or Recovery1
    share1: Backup1 only
  user_result: incorrect
  learning_note: |
    Vault types are not interchangeable. Azure Blob backup uses a Backup
    vault; Azure file share backup uses a Recovery Services vault. Select
    the vault by workload, even when resources share one storage account.
  explanation: |
    cont1: Backup1 only. Native Azure Blob backup uses a Backup vault,
    not a Recovery Services vault.

    share1: Recovery1 only. Native Azure Files backup uses a Recovery
    Services vault, not a Backup vault.

    Both resources are in one storage account, but that does not make their
    backup vault requirements identical. Azure Backup is the service name;
    Backup vault and Recovery Services vault are distinct resource types
    supporting different workloads. Neither "either vault" nor "cannot
    be backed up" is the correct choice for these supported workloads.

    Blob operational backup is managed through a Backup vault even though
    recovery data remains in the source storage account. Vaulted blob
    backup stores an isolated backup copy. This distinction does not change
    which vault type is used.

    Exam takeaway: blobs and standalone disks -> Backup vault; Azure file
    shares and whole Azure VMs -> Recovery Services vault.

    [Microsoft Learn: Backup vault overview](https://learn.microsoft.com/en-us/azure/backup/backup-vault-overview)
    [Microsoft Learn: Azure Backup vault support](https://learn.microsoft.com/en-us/azure/backup/backup-support-matrix#vault-support)

- id: '053'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  question: |
    You have an Azure subscription that contains an Azure Stream Analytics
    job named Job1.

    You need to monitor input events for Job1 to identify the number of
    events that were NOT processed.

    Which metric should you use?
  choices:
    A: Out-of-Order Events
    B: Output Events
    C: Late Input Events
    D: Backlogged Input Events
  answer: D
  user_answer: D
  user_result: correct
  explanation: |
    D is correct. Backlogged Input Events measures input events still
    waiting to be processed. A sustained or increasing backlog indicates
    the job is falling behind the incoming event stream.

    Interpret "NOT processed" here as "not processed yet," rather than
    a cumulative count of permanently failed, rejected, or lost events.

    A: Out-of-Order Events concerns event ordering and configured ordering
    tolerance, rather than the total backlog.
    B: Output Events counts events sent to output destinations, rather
    than events still waiting at the input.
    C: Late Input Events concerns events arriving outside the configured
    lateness tolerance, rather than the total unprocessed backlog.

    Exam takeaway: waiting input events -> backlog; timing violations ->
    late or out-of-order metrics; emitted results -> output events.

    [Microsoft Learn: Stream Analytics monitoring metrics](https://learn.microsoft.com/en-us/azure/stream-analytics/monitor-azure-stream-analytics-reference)
    [Microsoft Learn: Job diagram metrics and backlog](https://learn.microsoft.com/en-us/azure/stream-analytics/stream-analytics-job-logical-diagram-with-metrics)

- id: '054'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  question: |
    You have an Azure subscription that contains an Azure SQL database
    named DB1.

    You plan to use Azure Monitor to monitor the performance of DB1.
    You must be able to run queries to analyze log data.

    Which destination should you configure in the Diagnostic settings of DB1?
  choices:
    A: Send to a Log Analytics workspace.
    B: Archive to a storage account.
    C: Stream to an Azure event hub.
  answer: A
  user_answer: A
  user_result: correct
  explanation: |
    A is correct. Sending the selected diagnostic logs to a Log Analytics
    workspace makes them available for analysis using Kusto Query Language
    (KQL) in Azure Monitor Logs. The decisive requirement is the ability
    to run queries against log data.

    B: A storage account archives diagnostic data. It does not by itself
    provide Azure Monitor's interactive log-query capability.
    C: Event Hubs streams diagnostic data to downstream consumers, such
    as external monitoring or analytics systems. It is not itself a log
    store with Azure Monitor's query interface.

    Configure DB1's diagnostic settings, select the relevant log categories,
    and select the destination workspace. Query the data after ingestion.
    These monitoring queries use KQL against the workspace, rather than
    T-SQL against DB1's application tables.

    Exam takeaway: query and analyze logs -> Log Analytics workspace;
    archive -> storage account; stream to consumers -> Event Hubs.

    [Microsoft Learn: Collect and query resource logs](https://learn.microsoft.com/en-us/azure/azure-monitor/platform/tutorial-resource-logs)
    [Microsoft Learn: Resource log destinations](https://learn.microsoft.com/en-us/azure/azure-monitor/logs/resource-logs)

- id: '055'
  tags:
    - must-review
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  question: |
    You have an Azure subscription. The subscription contains virtual
    machines that run Windows Server.

    You have a data collection rule (DCR) named Rule1.

    You plan to use the Azure Monitor Agent to collect events from Windows
    System event logs.

    You only need to collect system events that have an ID of 1001.

    Which type of query should you use for the data source in Rule1?
  choices:
    A: SQL
    B: XPath
    C: KQL
  answer: B
  user_answer: C
  user_result: incorrect
  learning_note: |
    Distinguish collection-time Windows event-log source filtering from
    querying collected logs. Windows event-log data sources in a DCR use
    XPath; Log Analytics queries and supported DCR transformations use KQL.
  explanation: |
    B is correct. Azure Monitor Agent uses XPath queries to select which
    Windows event-log records to collect in a DCR's data source.

    For this scenario, a custom DCR source filter is:

    ```text
    System!*[System[EventID=1001]]
    ```

    System! identifies the System event-log channel. The XPath expression
    selects events whose System element contains EventID 1001. These filters
    are stored in the Windows event-log data source's xPathQueries property.

    A: SQL is not the query language for Windows event-log source selection.
    C: KQL queries data in Azure Monitor Logs and is also used for supported
    DCR transformations. However, the question specifically asks for the
    Windows event-log data source filter, which uses XPath. Querying already
    ingested records with KQL does not limit source collection to those events.

    Exam takeaway: Windows event source selection -> XPath;
    workspace analysis or supported ingestion transformations -> KQL.

    [Microsoft Learn: Collect Windows events with Azure Monitor Agent](https://learn.microsoft.com/en-us/azure/azure-monitor/vm/data-collection-windows-events)

- id: '056'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  question: |
    You have an Azure subscription that contains a virtual machine named VM1.

    You have an on-premises datacenter that contains a domain controller
    named DC1. ExpressRoute is used to connect the on-premises datacenter
    to Azure.

    You need to use Connection Monitor to identify network latency between
    VM1 and DC1.

    What should you install on DC1?
  choices:
    A: the Azure Connected Machine agent for Azure Arc-enabled servers
    B: the Azure Network Watcher Agent virtual machine extension
    C: the Log Analytics agent
    D: an Azure Monitor agent extension
  answer: D
  user_answer: D
  user_result: correct
  explanation: |
    D is the current answer when DC1 is an on-premises monitoring source.
    Enable Azure Arc on DC1, then install the Azure Monitor Agent extension.
    A is a prerequisite for managing the server and deploying extensions,
    rather than a replacement for the monitoring agent. B is the extension
    used on Azure VM monitoring sources.

    Historical caveat: older versions of this question expected C, the
    Log Analytics agent. Current Microsoft documentation explicitly says
    that agent is no longer supported for on-premises Connection Monitor.

    Wording caveat: the question does not specify probe direction. If VM1
    probes DC1 solely as an IP/FQDN destination, no monitoring agent is
    required on DC1. D assumes DC1 participates as a monitoring source.

    Exam takeaway: distinguish source from destination and current agent
    requirements from retired Log Analytics agent guidance.

    [Microsoft Learn: Connection Monitor agents and endpoints](https://learn.microsoft.com/en-us/azure/network-watcher/connection-monitor-overview)

- id: '057'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  question: |
    You have an Azure subscription that has Traffic Analytics configured.

    You deploy a new virtual machine named VM1 that has the following settings:

    - Region: East US
    - Virtual network: VNet1
    - NIC network security group: NSG1

    You need to monitor VM1 traffic by using Traffic Analytics.

    Which settings should you configure?
  choices:
    A: Diagnostic settings for VM1
    B: NSG flow logs for NSG1
    C: Diagnostic settings for NSG1
    D: Insights for VM1
  answer: B
  user_answer: D
  user_result: incorrect
  learning_note: |
    Traffic Analytics consumes Network Watcher flow logs, not VM Insights
    telemetry. Distinguish flow logging from general diagnostic settings.
    For new deployments, use VNet flow logs because new NSG flow logs can
    no longer be created.
  explanation: |
    B is the intended answer in this older question. NSG1 is associated
    with VM1's NIC. Enabling its flow logs and Traffic Analytics supplies
    traffic records for analysis.

    A: VM diagnostic settings do not supply the required flow logs.
    C: General NSG diagnostic settings are not the dedicated flow-log
    configuration required by Traffic Analytics.
    D: VM Insights monitors VM performance and related telemetry; enabling
    it does not configure the flow logs consumed by Traffic Analytics.

    Currency caveat: new NSG flow logs cannot be created after June 30,
    2025, and NSG flow logs retire September 30, 2027. For a new deployment
    today, configure VNet flow logs for VNet1 and enable Traffic Analytics.
    That replacement is absent from the choices. Retain B as the historical
    intended answer, rather than treating it as current deployment advice.

    Exam takeaway: Traffic Analytics -> flow logs; VM Insights -> VM
    monitoring. Current new configurations use VNet flow logs.

    [Microsoft Learn: Traffic Analytics](https://learn.microsoft.com/en-us/azure/network-watcher/traffic-analytics)
    [Microsoft Learn: NSG flow log retirement](https://learn.microsoft.com/en-us/azure/network-watcher/nsg-flow-logs-overview)

- id: '058'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  question: |
    You have an Azure subscription. The subscription contains 10 virtual
    machines that run Windows Server. Each virtual machine hosts a website
    in IIS and has the Azure Monitor Agent installed.

    You need to collect the IIS logs from each virtual machine and store
    them in a Log Analytics workspace.

    What should you configure first?
  choices:
    A: a data collection endpoint
    B: an Azure Monitor Private Link Scope (AMPLS)
    C: Diagnostic settings
    D: VM insights
    E: a private endpoint
  answer: A
  user_answer: A
  user_result: correct
  explanation: |
    A is the historical intended answer. Earlier IIS log collection with
    Azure Monitor Agent required a data collection endpoint (DCE), which
    was configured before the collection rule using it.

    Current-version caveat: IIS logs no longer appear in the current list
    of data sources requiring a DCE. For the ordinary public-endpoint
    setup, configure a DCR with an IIS Logs data source, associate the
    VMs, and select the Log Analytics workspace destination. Records are
    stored in W3CIISLog. A DCR is missing from the choices, so this question
    no longer provides the required current answer for its stated scenario.

    B and E configure private connectivity, which is not requested.
    Private Link scenarios still require a DCE. C does not configure AMA
    collection of guest IIS log files. D does not establish the required
    IIS Logs data source.

    Exam takeaway: DCR defines what to collect and where to send it;
    DCE supplies endpoints when required. Do not assume every AMA data
    source requires a DCE. The recorded correct result is against the
    historical intended answer, not a universal current prerequisite.

    [Microsoft Learn: Collect IIS logs](https://learn.microsoft.com/en-us/azure/azure-monitor/vm/data-collection-iis)
    [Microsoft Learn: Current DCE requirements](https://learn.microsoft.com/en-us/azure/azure-monitor/data-collection/data-collection-endpoint-overview)

- id: '059'
  skill: Implement and manage virtual networking
  sub-skill: Configure secure access to virtual networks
  question: |
    HOTSPOT

    You have an Azure subscription that contains two storage accounts named
    contoso101 and contoso102.

    The subscription contains the following virtual machines.

    | Name | Connected to | Public IP address SKU |
    | --- | --- | --- |
    | VM1 | VNet1/Subnet1 | Basic |
    | VM2 | VNet1/Subnet2 | Standard |

    VNet1 has service endpoints configured as follows. Each service has one
    subnet, with status Succeeded and Locations shown as *.

    | Service | Subnet | Status | Locations |
    | --- | --- | --- | --- |
    | Microsoft.AzureActiveDirectory | Subnet2 | Succeeded | * |
    | Microsoft.Storage | Subnet1 | Succeeded | * |

    The Microsoft.Storage service endpoint has the following service endpoint
    policy. The scenario states the endpoint has this policy, although the
    creation exhibit also displays the standard association reminder.

    | Setting | Value |
    | --- | --- |
    | Validation | Passed |
    | Subscription | Azure Pass - Sponsorship |
    | Resource group | RG1 |
    | Region | East US |
    | Name | Policy1 |
    | Resources | Microsoft.Storage: contoso101 (Storage account) |
    | Tags | None |

    Exhibit reminder: For this policy to take effect, associate it to one or
    more subnets that have virtual network service endpoints. Visit a virtual
    network in East US and select the subnets to associate with the policy.

    For each statement, select Yes if true. Otherwise, select No.

    1. VM1 can access contoso102.
    2. VM2 can access contoso101.
    3. VM2 uses a private IP address to access Azure AD.
  choices:
    - 'Yes'
    - 'No'
  answer:
    - 'No'
    - 'Yes'
    - 'Yes'
  user_answer:
    - 'No'
    - 'No'
    - 'Yes'
  user_result: partially_correct
  user_reasoning: |
    VM1 can access only contoso101. VM2 cannot access contoso101 because
    Subnet2 does not have a Storage service endpoint.
  learning_note: |
    Absence of a service endpoint does not deny access to a service's public
    endpoint. Endpoint policies apply to their associated subnet. Distinguish
    private source IP identity from a private destination endpoint.
  explanation: |
    The historical intended answers are No, Yes, Yes.

    1. No: Subnet1's Storage service endpoint policy permits contoso101 only,
       so VM1 cannot access contoso102 through the policy-controlled path.
    2. Yes: VM2 is in Subnet2, which is not governed by Subnet1's Storage
       endpoint policy. Lack of a Storage endpoint does not block the public
       Storage endpoint. No storage firewall or outbound restriction is given;
       assume normal network access and valid data-access credentials.
    3. Yes in the older exhibit's model: the service endpoint on Subnet2
       represents access using the VM's private source identity. A service
       endpoint does not assign the service a private destination IP; that
       is a private endpoint concept. Public IP SKU is not decisive here.

    Currency caveat: Microsoft.AzureActiveDirectory was associated with
    service endpoint support for Azure Data Lake Storage Gen1. It should
    not be generalized into private access to all Microsoft Entra ID sign-in
    services. The third statement is historical and imprecise under current
    terminology. Basic public IP SKU in the exhibit is also legacy.

    Policy-association caveat: creating a policy alone does not enforce it.
    The first answer assumes association with Subnet1, as stated in the
    scenario; the creation screen's reminder alone would not prove association.

    Exam takeaway: endpoint -> service routing and subnet identity;
    endpoint policy -> allowed resources from the associated subnet;
    no endpoint -> public access can still be available.

    [Microsoft Learn: Service endpoint policies](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoint-policies)
    [Microsoft Learn: Service endpoints](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoints-overview)
    [Microsoft Learn: Private Link FAQ and Azure AD endpoint caveat](https://learn.microsoft.com/en-us/azure/private-link/private-link-faq)

- id: '060'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  question: |
    You have an Azure subscription that contains multiple virtual machines
    in the West US Azure region.

    You need to use Traffic Analytics in Azure Network Watcher to monitor
    virtual machine traffic.

    Which two resources should you create? Each correct answer presents
    part of the solution. Each correct selection is worth one point.
  choices:
    A: a Log Analytics workspace
    B: an Azure Monitor workbook
    C: a storage account
    D: a Microsoft Sentinel workspace
    E: a Data Collection Rule (DCR) in Azure Monitor
  answer: AC
  user_answer: AE
  user_result: partially_correct
  learning_note: |
    Traffic Analytics requires storage for raw flow logs and a Log Analytics
    workspace for processed results. Do not transfer AMA's DCR setup model
    to Network Watcher flow-log collection.
  explanation: |
    A and C are correct. The storage account stores raw Network Watcher
    flow logs. Traffic Analytics aggregates and enriches those records,
    then stores the processed results in a Log Analytics workspace for
    analysis and visualization.

    B: A workbook can visualize data but is not a required collection resource.
    D: Microsoft Sentinel enables security capabilities on a Log Analytics
    workspace; it is not required for Traffic Analytics.
    E: A DCR is not required for this Network Watcher flow-log configuration.
    DCRs used for agent-based collection should not be confused with the
    flow-log resource's storage and Traffic Analytics settings.

    For new deployments, configure VNet flow logs and enable Traffic
    Analytics using the storage account and workspace. The same resource
    pair also applied to the older NSG flow-log approach. New NSG flow logs
    can no longer be created after June 30, 2025.

    Exam takeaway: raw flow logs -> storage account;
    aggregated and enriched traffic results -> Log Analytics workspace.

    [Microsoft Learn: Traffic Analytics data processing](https://learn.microsoft.com/en-us/azure/network-watcher/traffic-analytics)
    [Microsoft Learn: Configure VNet flow logs and Traffic Analytics](https://learn.microsoft.com/en-us/azure/network-watcher/vnet-flow-logs-manage)
