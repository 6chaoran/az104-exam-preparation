- id: '001'
  skill: Monitor and maintain Azure resources
  sub-skill: Implement backup and recovery
  question: |
    You have an Azure subscription that has a Recovery Services vault named Vault1.
    The subscription contains the virtual machines shown in the following table.

    | Name | Operating system | Auto-shutdown |
    | --- | --- | --- |
    | VM1 | Windows Server 2012 R2 | Off |
    | VM2 | Windows Server 2016 | 19:00 |
    | VM3 | Ubuntu Server 18.04 LTS | Off |
    | VM4 | Windows 10 | 19:00 |

    You plan to schedule backups to occur every night at 23:00.
    Which virtual machines can you back up by using Azure Backup?
  choices:
    A: VM1 and VM3 only
    B: VM1, VM2, VM3 and VM4
    C: VM1 and VM2 only
    D: VM1 only
  answer: B
  user_answer: A
  user_result: incorrect
  learning_note: |
    Azure VM Backup supports shut-down or offline VMs. Auto-shutdown before
    the backup schedule does not prevent backup; offline recovery points
    are crash-consistent rather than application-consistent.
  explanation: |
    B, VM1, VM2, VM3 and VM4, is correct for this question's original
    operating-system context. Azure VM Backup supports both Windows and
    Linux VMs, including the operating systems listed in this older question.

    VM1 and VM3 have auto-shutdown disabled. VM2 and VM4 shut down at 19:00,
    before the scheduled backup at 23:00, but Azure Backup can still back up
    shut-down or offline VMs. Their snapshots are crash-consistent rather
    than application-consistent.

    The supplied answer A incorrectly excludes VM2 and VM4 because they
    are shut down. C and D also exclude VMs that can be backed up.

    This question uses older operating systems. For a current deployment,
    check the current support matrix for the chosen backup method; the
    agent-based OS support list has changed, and agentless crash-consistent
    backup is operating-system agnostic subject to its own prerequisites.

    Exam takeaway: a VM does not have to be running for Azure VM Backup
    to create a recovery point.

    [Microsoft Learn: Azure VM backup support matrix](https://learn.microsoft.com/en-us/azure/backup/backup-support-matrix-iaas)

- id: '002'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  question: |
    You have an Azure subscription that contains a virtual machine named VM1.
    You plan to deploy an Azure Monitor alert rule that will trigger an alert
    when CPU usage on VM1 exceeds 80 percent.
    You need to ensure that the alert rule sends an email message to two users
    named User1 and User2.
    What should you create for Azure Monitor?
  choices:
    A: an action group
    B: a mail-enabled security group
    C: a distribution group
    D: a Microsoft 365 group
  answer: A
  user_answer: A
  user_result: correct
  explanation: |
    A, an action group, is correct. An Azure Monitor action group defines
    the notifications and actions to perform when an alert fires. Add email
    notification recipients for User1 and User2, then associate the action
    group with the alert rule for VM1's Percentage CPU metric exceeding 80.

    B, a mail-enabled security group, combines permissions management with
    email delivery. C, a distribution group, distributes email to members.
    D, a Microsoft 365 group, provides collaboration resources. None of
    these is the Azure Monitor resource that configures alert notifications.
    A group email address can be used as an email recipient, but an action
    group is still required to configure the alert's notification behavior.

    Exam takeaway: the alert rule defines when an alert fires; the action
    group defines who receives notifications and which actions run.

    [Microsoft Learn: Create and manage action groups](https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/action-groups)

- id: '003'
  skill: Monitor and maintain Azure resources
  sub-skill: Implement backup and recovery
  question: |
    You have the Azure virtual machines shown in the following table:

    | Name | Azure region |
    | --- | --- |
    | VM1 | West Europe |
    | VM2 | West Europe |
    | VM3 | North Europe |
    | VM4 | North Europe |

    You have a Recovery Services vault that protects VM1 and VM2.
    You need to protect VM3 and VM4 by using Recovery Services.
    What should you do first?
  choices:
    A: Create a new Recovery Services vault
    B: Create a storage account
    C: Configure the extensions for VM3 and VM4
    D: Create a new backup policy
  answer: A
  user_answer: A
  user_result: correct
  explanation: |
    A, Create a new Recovery Services vault, is correct. For Azure VM
    backup, the Recovery Services vault must be in the same Azure region
    as the virtual machines it protects. The existing vault protects VM1
    and VM2 in West Europe, so it is in West Europe. VM3 and VM4 are in
    North Europe and require a vault in North Europe.

    First create the North Europe vault, then configure a backup policy
    and enable backup for VM3 and VM4.

    B does not provide the required regional vault; Azure Backup manages
    the vault's backup storage. C does not overcome the region requirement;
    Azure Backup installs the required backup extension when backup is
    enabled. D defines backup scheduling and retention, but a policy in
    the existing vault cannot protect VMs in a different region.

    Exam takeaway: for Azure VM backup, match the vault region to the VM
    region. Cross-region restore and geo-redundant backup storage do not
    remove this requirement.

    [Microsoft Learn: Create and configure Recovery Services vaults](https://learn.microsoft.com/en-us/azure/backup/backup-create-recovery-services-vault)

- id: '004'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  tags:
    - must-review
  question: |
    HOTSPOT -
    You have an Azure subscription that contains an Azure Storage account named
    storage1 and the users shown in the following table.

    | Name | Member of |
    | --- | --- |
    | User1 | Group1 |
    | User2 | Group2 |
    | User3 | Group1 |

    You plan to monitor storage1 and to configure email notifications for the
    signals shown in the following table.

    | Name | Type | Users to notify |
    | --- | --- | --- |
    | Ingress | Metric | User1 and User3 only |
    | Egress | Metric | User1 only |
    | Delete storage account | Activity log | User1, User2, and User3 |
    | Restore blob ranges | Activity log | User1 and User3 only |

    You need to identify the minimum number of alert rules and action groups
    required for the planned monitoring.
    How many alert rules and action groups should you identify? To answer,
    select the appropriate options in the answer area.
    NOTE: Each correct selection is worth one point.
  choices:
    Alert rules:
      - 1
      - 2
      - 3
      - 4
    Action groups:
      - 1
      - 2
      - 3
      - 4
  answer:
    Alert rules: 4
    Action groups: 3
  user_answer:
    Alert rules: 4
    Action groups: 1
  user_result: partially_correct
  learning_note: |
    Action groups are reusable across alert rules, but each group invokes its
    configured recipients. Different recipient sets require separate action
    groups; sharing one group does not select different recipients per signal.
  explanation: |
    The correct selections are 4 alert rules and 3 action groups.

    Create a separate alert rule for each signal: Ingress, Egress, Delete
    storage account, and Restore blob ranges. The metric signals need
    independent evaluation and different recipients, while the activity-log
    operations also have different recipients. Combining metric conditions
    in a single rule would require all conditions to be met and would not
    provide independent notification routing for these signals.

    Three action groups cover the distinct recipient sets:
    - User1 and User3: used by Ingress and Restore blob ranges.
    - User1 only: used by Egress.
    - User1, User2, and User3: used by Delete storage account.

    One action group would send its configured notifications whenever any
    associated rule fires, so it cannot meet the different recipient
    requirements. Group membership does not automatically configure Azure
    Monitor email notifications or select recipients for each signal.

    Your alert-rule count of 4 is correct; your action-group count of 1
    should be 3.

    Exam takeaway: count independently monitored signals for alert rules,
    and distinct notification recipient sets for reusable action groups.

    [Microsoft Learn: Create and manage action groups](https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/action-groups)
    [Microsoft Learn: Types of Azure Monitor alerts](https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alert-options)

- id: '005'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  question: |
    You have an Azure subscription that contains the identities shown in the
    following table.

    | Name | Type | Member of |
    | --- | --- | --- |
    | User1 | User | None |
    | User2 | User | Group1 |
    | Principal1 | Managed identity | None |
    | Principal2 | Managed identity | Group1 |

    User1, Principal1, and Group1 are assigned the Monitoring Reader role.
    An action group named AG1 has the Email Azure Resource Manager Role
    notification type and is configured to email the Monitoring Reader role.
    You create an alert rule named Alert1 that uses AG1.
    You need to identify who will receive an email notification when Alert1
    is triggered.
    Who should you identify?
  choices:
    A: User1 and Principal1 only
    B: User1, User2, Principal1, and Principal2
    C: User1 only
    D: User1 and User2 only
  answer: D
  user_answer: D
  user_result: correct
  explanation: |
    D, User1 and User2 only, is correct. Email Azure Resource Manager Role
    notifications support user and group role assignments at subscription
    scope. Monitoring Reader is one of the supported roles. Users must have
    an email address configured in their Microsoft Entra profiles.

    User1 receives the notification through the direct Monitoring Reader
    assignment. User2 receives it through membership in Group1, which is
    assigned Monitoring Reader. Principal1 and Principal2 are managed
    identities, not user email recipients, so neither receives an email,
    whether the role is assigned directly or through a group.

    A and B incorrectly include managed identities. C incorrectly excludes
    User2, whose group-based role assignment is supported.

    The question assumes the role assignments are at subscription scope
    and the users have configured email addresses. Assignments only at
    resource-group or resource scope do not qualify for this notification.

    Exam takeaway: role-based email includes users with direct or group-based
    subscription role assignments, but excludes managed identities.

    [Microsoft Learn: Email Azure Resource Manager Role notifications](https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/action-groups#email-azure-resource-manager)

- id: '006'
  skill: Monitor and maintain Azure resources
  sub-skill: Implement backup and recovery
  tags:
    - must-review
  question: |
    HOTSPOT -
    You have an Azure virtual machine named VM1 and a Recovery Services vault
    named Vault1.
    You create a backup policy named Policy1 as shown in the exhibit.

    Policy1 has the following settings. All retention options are enabled.

    | Setting | Value |
    | --- | --- |
    | Backup schedule frequency | Daily |
    | Backup schedule time | 2:00 AM |
    | Timezone | (UTC) Coordinated Universal Time |
    | Daily backup point retention | At 2:00 AM, for 5 days |
    | Weekly backup point retention | On Sunday at 2:00 AM, for 20 weeks |
    | Monthly backup point retention | Day Based: on day 2 at 2:00 AM, for 24 months |
    | Yearly backup point retention | Day Based: in January, on day 9 at 2:00 AM, for 5 years |

    You configure the backup of VM1 to use Policy1 on Thursday, January 1
    at 1:00 AM.
    You need to identify the number of available recovery points for VM1.
    How many recovery points are available on January 8 and January 15?
    To answer, select the appropriate options in the answer area.
    NOTE: Each correct selection is worth one point.
  choices:
    January 8 at 2:00 PM (14:00):
      - 5
      - 6
      - 8
      - 9
    January 15 at 2:00 PM (14:00):
      - 5
      - 8
      - 17
      - 19
  answer:
    January 8 at 2:00 PM (14:00): 6
    January 15 at 2:00 PM (14:00): 8
  user_answer:
    January 8 at 2:00 PM (14:00): 7
    January 15 at 2:00 PM (14:00): 8
  user_result: partially_correct
  user_reasoning: |
    Counted January 8 as 5 daily + 1 weekly + 1 monthly, and January 15
    as 5 daily + 2 weekly + 1 monthly.
  learning_note: |
    Count distinct recovery points, not retention labels. A Sunday point
    inside the daily retention window is not an additional backup. Include
    the January 9 yearly point after it leaves the daily retention window.
  explanation: |
    The correct selections are 6 on January 8 and 8 on January 15.
    Assume scheduled backups succeed and expired points are cleaned up as
    intended by the exam. Backup starts on January 1 at 2:00 AM, after
    protection is configured at 1:00 AM. January 4 and January 11 are Sundays.

    On January 8 at 14:00, the retained dates are:
    - January 4, 5, 6, 7, and 8: five daily points.
    - January 2: one older point retained by the monthly rule.
    January 4 also qualifies for weekly retention, but is already counted
    among the daily points. January 9 has not occurred yet, so there is
    no yearly point. Total: 5 + 1 = 6.

    On January 15 at 14:00, the retained dates are:
    - January 11, 12, 13, 14, and 15: five daily points.
    - January 4: one older weekly point.
    - January 2: one older monthly point.
    - January 9: one older yearly point.
    January 11 also qualifies for weekly retention, but is already counted
    among the daily points. Total: 5 + 1 + 1 + 1 = 8.

    Your January 8 count double-counts January 4. Your January 15 total is
    correct, but the reasoning double-counts January 11 and omits January 9;
    those two errors happen to cancel out. The first answer, 7, is also
    absent from the available choices.

    Retention rules keep selected scheduled recovery points for longer;
    they do not create additional copies for each daily, weekly, monthly,
    or yearly label. Count the union of retained backup dates.

    [Microsoft Learn: Azure Backup architecture and retention](https://learn.microsoft.com/en-us/azure/backup/backup-architecture)

- id: '007'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  question: |
    HOTSPOT -
    You have the web apps shown in the following table.

    | Name | Web framework | Hosting environment |
    | --- | --- | --- |
    | App1 | Microsoft ASP.NET | An on-premises physical server that runs Windows Server 2019 and has Internet Information Services (IIS) configured |
    | App2 | Microsoft ASP.NET Core | An Azure virtual machine that runs Windows Server 2019 and has Internet Information Services (IIS) configured |

    You need to monitor the performance and usage of the apps by using Azure
    Application Insights. The solution must minimize modifications to the
    application code.
    What should you do on each app? To answer, select the appropriate options
    in the answer area.
    NOTE: Each correct selection is worth one point.
  choices:
    App1:
      - Install the Log Analytics agent
      - Install the Azure Monitor agent
      - Use the Application Insights SDK
      - Install the Application Insights Agent
    App2:
      - Install the Log Analytics agent
      - Install the Azure Monitor agent
      - Use the Application Insights SDK
      - Install the Application Insights Agent
  answer:
    App1: Install the Application Insights Agent
    App2: Install the Application Insights Agent
  user_answer:
    App1: Install the Application Insights Agent
    App2: Use the Application Insights SDK
  user_result: partially_correct
  learning_note: |
    The supplied selections match the historical exam answer. Application
    Insights Agent 2.0.0 and later support ASP.NET Core hosted in IIS, so
    using the agent for both apps now best minimizes application code changes.
  explanation: |
    With current documented capabilities, install the Application Insights
    Agent for both App1 and App2. The agent enables autoinstrumentation for
    IIS-hosted ASP.NET and ASP.NET Core applications without adding the
    Application Insights SDK to the application code. It can be installed
    on an on-premises IIS server or deployed through an Azure VM extension.

    App1: the agent monitors the ASP.NET application on the on-premises
    Windows Server running IIS while minimizing code modifications.

    App2: Application Insights Agent 2.0.0 and later support ASP.NET Core
    hosted in IIS. This satisfies the requirement with fewer application
    code changes than adding and configuring the SDK.

    Historical exam context: older agent versions did not support ASP.NET
    Core in this scenario, so the expected selections were the agent for
    App1 and the SDK for App2. Your selections match that historical answer.
    The recorded answer and result reflect current documented support;
    the SDK remains a valid monitoring method but does not best satisfy
    the minimal-code-change requirement when autoinstrumentation is available.

    The Log Analytics agent and Azure Monitor agent collect machine-level
    logs and metrics; they do not replace Application Insights application
    instrumentation for requests, dependencies, and application performance.

    Exam takeaway: distinguish application instrumentation from host monitoring,
    and check the framework and agent version before assuming SDK changes
    are required.

    [Microsoft Learn: Application Insights Agent deployment and ASP.NET Core support](https://learn.microsoft.com/en-us/previous-versions/azure/azure-monitor/app/classic-api)

- id: '008'
  skill: Monitor and maintain Azure resources
  sub-skill: Implement backup and recovery
  tags:
    - must-review
  question: |
    You have an Azure virtual machine named VM1.
    You use Azure Backup to create a backup of VM1 named Backup1.
    After creating Backup1, you perform the following changes to VM1:
    - Modify the size of VM1.
    - Copy a file named Budget.xls to a folder named Data.
    - Reset the password for the built-in administrator account.
    - Add a data disk to VM1.

    An administrator uses the Replace existing option to restore VM1 from Backup1.
    You need to ensure that all the changes to VM1 are restored.
    Which change should you perform again?
  choices:
    A: Modify the size of VM1.
    B: Reset the password for the built-in administrator account.
    C: Add a data disk.
    D: Copy Budget.xls to Data.
  answer: BCD
  user_answer: B
  user_result: partially_correct
  learning_note: |
    This single-answer question is ambiguous. Replace existing restores disk
    contents and the backed-up disk set, while retaining the existing VM size.
    More than one post-backup change may need to be reapplied.
  explanation: |
    There is no uniquely correct single answer under the literal requirement
    to preserve all four post-backup changes. BCD records the changes that
    can require repetition under the ordinary assumptions below, rather than
    a verified single-option exam key. The question needs clarification.

    Replace existing swaps the existing VM's disks for disks from Backup1.
    It keeps the existing VM resource, so A, the VM size change, persists.

    B: the local administrator password is part of the guest OS state.
    Restoring the OS disk can revert a password reset, so it may need to be
    repeated. The question does not specify the reset method or whether an
    Azure VMAccess extension reapplies the password after restoration.

    C: the restored disk configuration reflects the disks in Backup1.
    A disk added afterward is not in that recovery point. Reattach the
    retained original disk to recover the post-backup disk addition;
    creating another empty disk would not recover its data. Original disks
    are retained in the resource group after replacement.

    D: if Data is on a disk restored from Backup1, Budget.xls was not present
    at backup time and must be copied again from a surviving source. The
    question does not identify which disk contains Data.

    Your answer B is defensible, but alone does not ensure that all changes
    are recovered. D is also necessary for a file on a restored disk, and
    the added disk must be reattached. A single-answer key would require
    additional assumptions about password reset behavior and disk handling.

    Exam takeaway: distinguish the existing VM's resource configuration from
    restored guest disk contents, and account for disks added after backup.

    [Microsoft Learn: Restore options and Replace existing disks](https://learn.microsoft.com/en-us/azure/backup/backup-azure-arm-restore-vms)

- id: '009'
  skill: Manage Azure identities and governance
  sub-skill: Manage Microsoft Entra users and groups
  question: |
    HOTSPOT -
    You have an Azure Active Directory (Azure AD) tenant named
    contoso.onmicrosoft.com that contains the users shown in the following table.

    | Name | Member of | Role assigned |
    | --- | --- | --- |
    | User1 | Group1 | None |
    | User2 | Group2 | None |
    | User3 | Group1, Group2 | User administrator |

    You enable password reset for contoso.onmicrosoft.com as shown in the
    Password Reset exhibit.

    | Password Reset setting | Value |
    | --- | --- |
    | Self service password reset enabled | Selected (other options: None, All) |
    | Select group | Group2 |

    You configure the authentication methods for password reset as shown in
    the Authentication Methods exhibit.

    | Authentication Methods setting | Value |
    | --- | --- |
    | Number of methods required to reset | 2 (other option: 1) |
    | Mobile app notification | Unchecked |
    | Mobile app code | Unchecked |
    | Email | Unchecked |
    | Mobile phone | Checked |
    | Office phone | Unchecked |
    | Security questions | Checked |
    | Number of questions required to register | 5 (other options: 3, 4) |
    | Number of questions required to reset | 3 (other options: 4, 5) |
    | Select security questions | 10 security questions selected |

    Both exhibits display this notice: These settings only apply to end users
    in your organization. Admins are always enabled for self-service password
    reset and are required to use two authentication methods to reset their
    password. Click here to learn more about administrator password policies.

    For each statement, select Yes if the statement is true. Otherwise,
    select No. NOTE: Each correct selection is worth one point.
  choices:
    After User2 answers three security questions correctly, he can reset his password immediately.:
      - Yes
      - No
    If User1 forgets her password, she can reset the password by using the mobile phone app.:
      - Yes
      - No
    User3 can add security questions to the password reset process.:
      - Yes
      - No
  answer:
    After User2 answers three security questions correctly, he can reset his password immediately.: 'No'
    If User1 forgets her password, she can reset the password by using the mobile phone app.: 'No'
    User3 can add security questions to the password reset process.: 'No'
  user_answer:
    After User2 answers three security questions correctly, he can reset his password immediately.: 'No'
    If User1 forgets her password, she can reset the password by using the mobile phone app.: 'No'
    User3 can add security questions to the password reset process.: 'Yes'
  user_result: partially_correct
  learning_note: |
    Several security questions together count as one verification method.
    Administrator SSPR excludes security questions. User Administrator does
    not grant authority to configure the tenant's SSPR authentication policy.
  explanation: |
    The correct selections are No, No, No.

    1. No: User2 belongs to Group2 and is enabled for SSPR, but two methods
       are required. Answering three security questions completes only the
       security-questions method. User2 must also complete mobile-phone
       verification before resetting the password.

    2. No: User1 belongs only to Group1, while SSPR is enabled for Group2.
       User1 is not an administrator and is outside the enabled group.
       Also, mobile phone verification is distinct from mobile app
       notification or mobile app code, both unchecked in this exhibit.

    3. No: User3 has the User Administrator role. Administrator accounts
       follow a separate two-method SSPR policy that prohibits security
       questions, so User3 cannot add them to their own reset process.
       If the statement means configuring the tenant's reset process,
       User Administrator alone is insufficient: SSPR configuration requires
       Authentication Policy Administrator or an appropriately privileged
       role such as Global Administrator.

    Your first two selections are correct; the third should be No.
    Azure AD is now named Microsoft Entra ID. The screenshot shows the
    legacy authentication-methods interface; current deployments use the
    Authentication methods policy for methods migrated from legacy policies.

    Exam takeaway: check SSPR scope, count methods rather than individual
    questions, and distinguish administrator reset rules from end-user rules.

    [Microsoft Learn: Administrator reset policy differences](https://learn.microsoft.com/en-us/entra/identity/authentication/concept-sspr-policy#administrator-reset-policy-differences)
    [Microsoft Learn: Enable and configure SSPR](https://learn.microsoft.com/en-us/entra/identity/authentication/tutorial-enable-sspr)

- id: '010'
  skill: Manage Azure identities and governance
  sub-skill: Manage Microsoft Entra users and groups
  question: |
    Your company has a main office in London that contains 100 client computers.
    Three years ago, you migrated to Azure Active Directory (Azure AD).
    The company's security policy states that all personal devices and
    corporate-owned devices must be registered or joined to Azure AD.
    A remote user named User1 is unable to join a personal device to Azure AD
    from a home network.
    You verify that User1 was able to join devices to Azure AD in the past.
    You need to ensure that User1 can join the device to Azure AD.
    What should you do?
  choices:
    A: Assign the User administrator role to User1.
    B: From the Device settings blade, modify the Maximum number of devices per user setting.
    C: Create a point-to-site VPN from the home network of User1 to Azure.
    D: From the Device settings blade, modify the Users may join devices to Azure AD setting.
  answer: B
  user_answer: B
  user_result: correct
  explanation: |
    B is the intended answer. Maximum number of devices per user limits
    how many Microsoft Entra joined or registered devices a user can have.
    Increase the configured limit so User1 can join another device.

    The decisive clue is that User1 successfully joined devices previously.
    In this exam scenario, that points to reaching the per-user device
    quota rather than lacking permission to join devices. In a real
    deployment, confirm the device count and error before changing the limit;
    earlier success alone does not prove a quota issue.

    A grants unnecessary administrative privileges and does not address
    the device quota. C is unnecessary because joining Microsoft Entra ID
    can occur over the internet without a point-to-site VPN. D controls
    who may join devices, not how many devices each user may join; the
    question provides no indication that User1's join permission changed.

    Azure AD is now called Microsoft Entra ID. The number of computers in
    the London office is not the per-user quota. Personal and corporate
    devices associated with User1 can both contribute to the applicable
    joined/registered device count.

    Exam takeaway: Users may join devices controls eligibility; Maximum
    number of devices per user controls quantity.

    [Microsoft Learn: Configure device settings](https://learn.microsoft.com/en-us/entra/identity/devices/manage-device-identities#configure-device-settings)

- id: '011'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure Azure App Service
  tags:
    - must-review
  question: |
    HOTSPOT -
    You have two Azure App Service apps named App1 and App2. Each app has a
    production deployment slot and a test deployment slot.
    The Backup Configuration settings for the production slots are shown
    in the following table.

    | App | Backup Every | Start backup schedule from | Retention (Days) | Keep at least one backup |
    | --- | --- | --- | --- | --- |
    | App1 | 1 Days | January 6, 2021 | 0 | Yes |
    | App2 | 1 Days | January 6, 2021 | 30 | Yes |

    For each of the following statements, select Yes if the statement is
    true. Otherwise, select No.
    NOTE: Each correct selection is worth one point.
  choices:
    On January 15, 2021, App1 will have only one backup in storage.:
      - Yes
      - No
    On February 6, 2021, you can access the backup of the App2 test slot from January 15, 2021.:
      - Yes
      - No
    On January 15, 2021, you can restore the App2 production slot backup from January 6 to the App2 test slot.:
      - Yes
      - No
  answer:
    On January 15, 2021, App1 will have only one backup in storage.: 'No'
    On February 6, 2021, you can access the backup of the App2 test slot from January 15, 2021.: 'No'
    On January 15, 2021, you can restore the App2 production slot backup from January 6 to the App2 test slot.: 'Yes'
  user_answer:
    On January 15, 2021, App1 will have only one backup in storage.: 'No'
    On February 6, 2021, you can access the backup of the App2 test slot from January 15, 2021.: 'Yes'
    On January 15, 2021, you can restore the App2 production slot backup from January 6 to the App2 test slot.: 'Yes'
  user_result: partially_correct
  user_reasoning: |
    Selected No for the first statement because production plus test would
    produce two backups. Selected Yes for the second and third statements.
  learning_note: |
    A production-slot backup does not automatically back up the test slot.
    Zero-day custom-backup retention means backups do not expire, and
    Keep at least one backup is a minimum safeguard, not a one-backup cap.
  explanation: |
    The correct selections are No, No, Yes. Assume the scheduled custom
    backups succeed and no backups are manually deleted.

    1. No: App1 runs daily backups starting January 6. For these custom
       backup settings, retention 0 means backups do not expire. Multiple
       production backups accumulate by January 15. Keep at least one
       backup does not restrict storage to exactly one backup. Your No
       selection is correct, but the production-plus-test reasoning is not:
       only the production slot's backup schedule is configured here.

    2. No: the exhibit configures App2's production-slot backups, not its
       test-slot backups. Having a test slot does not automatically create
       backups of that slot. January 15 to February 6 is within 30 days,
       so the production backup from January 15 would still be retained,
       but that does not make it a backup of the test slot.

    3. Yes: App2's January 6 production backup is still within the 30-day
       retention period on January 15. App Service supports restoring a
       backup to another deployment slot, including App2's test slot.

    These are custom backup settings from the historical interface.
    App Service automatic backups are a separate feature with their own
    retention behavior; do not substitute that behavior for this table.

    Exam takeaway: identify the backed-up source slot separately from the
    restore destination, and distinguish retention duration from backup count.

    [Microsoft Learn: Back up and restore an App Service app](https://learn.microsoft.com/en-us/azure/app-service/manage-backup)

- id: '012'
  skill: Manage Azure identities and governance
  sub-skill: Manage Microsoft Entra users and groups
  tags:
    - must-review
  question: |
    HOTSPOT -
    You have an Azure subscription that contains an Azure Active Directory
    (Azure AD) tenant named contoso.com. The tenant is synced to the
    on-premises Active Directory domain. The domain contains the users
    shown in the following table.

    | Name | Role |
    | --- | --- |
    | SecAdmin1 | Security administrator |
    | BillAdmin1 | Billing administrator |
    | User1 | Reports reader |

    You enable self-service password reset (SSPR) for all users and configure
    SSPR to have the following authentication methods:
    - Number of methods required to reset: 2
    - Methods available to users: Mobile phone, Security questions
    - Number of questions required to register: 3
    - Number of questions required to reset: 3

    You select the following security questions:
    - What is your favorite food?
    - In what city was your first job?
    - What was the name of your first pet?

    For each of the following statements, select Yes if the statement is
    true. Otherwise, select No.
    NOTE: Each correct selection is worth one point.
  choices:
    'SecAdmin1 must answer the following question during the self-service password reset: In what city was your first job?':
      - 'Yes'
      - 'No'
    'BillAdmin1 must answer the following question during the self-service password reset: What is your favorite food?':
      - 'Yes'
      - 'No'
    'User1 must answer the following question during the self-service password reset: What was the name of your first pet?':
      - 'Yes'
      - 'No'
  answer:
    'SecAdmin1 must answer the following question during the self-service password reset: In what city was your first job?': 'No'
    'BillAdmin1 must answer the following question during the self-service password reset: What is your favorite food?': 'No'
    'User1 must answer the following question during the self-service password reset: What was the name of your first pet?': 'Yes'
  user_answer:
    'SecAdmin1 must answer the following question during the self-service password reset: In what city was your first job?': 'Yes'
    'BillAdmin1 must answer the following question during the self-service password reset: What is your favorite food?': 'Yes'
    'User1 must answer the following question during the self-service password reset: What was the name of your first pet?': 'Yes'
  user_result: partially_correct
  user_reasoning: |
    Selected Yes for all three because only three security questions are
    configured and three answers are required to reset the password.
  learning_note: |
    Check whether the role uses the administrator SSPR policy before counting
    security questions. Security Administrator and Billing Administrator
    cannot use security questions; Reports Reader follows the end-user policy
    in this scenario. All three questions together count as one method.
  explanation: |
    The correct selections are No, No, Yes.

    SecAdmin1: No. Security Administrator is on the list of roles governed
    by the administrator SSPR policy. That policy requires two verification
    methods and prohibits security questions, regardless of the end-user
    settings shown in the scenario.

    BillAdmin1: No. Billing Administrator is also on the administrator SSPR
    policy's affected-role list, so security questions cannot be used.

    User1: Yes. Reports Reader is not on that restricted-role list and
    follows the configured end-user policy here. There are exactly three
    configured questions, and three answers are required, so User1 must
    answer all of them, including the first-pet question. User1 must also
    complete mobile-phone verification: three questions are one method,
    not three separate authentication methods.

    Your question-count reasoning is correct for User1, but does not apply
    to SecAdmin1 or BillAdmin1 because their administrator policy excludes
    security questions. The custom domain and directory synchronization
    place this scenario outside the administrator one-gate exception for
    an unsynchronized default onmicrosoft.com tenant.

    Azure AD is now Microsoft Entra ID. The question uses legacy SSPR
    configuration terminology. For synchronized users, successful on-premises
    password reset also requires password writeback; this does not change
    which verification methods are allowed in these statements.

    Exam takeaway: administrator-role restrictions take precedence over
    end-user SSPR settings; count questions only after checking the role.

    [Microsoft Learn: Administrator reset policy differences and affected roles](https://learn.microsoft.com/en-us/entra/identity/authentication/concept-sspr-policy#administrator-reset-policy-differences)
    [Microsoft Learn: Security questions authentication method](https://learn.microsoft.com/en-us/entra/identity/authentication/concept-authentication-security-questions)

- id: '013'
  skill: Manage Azure identities and governance
  sub-skill: Manage Microsoft Entra users and groups
  question: |
    Note: This question is part of a series of questions that present the same
    scenario. Each question in the series contains a unique solution that
    might meet the stated goals. Some question sets might have more than one
    correct solution, while others might not have a correct solution.
    After you answer a question in this section, you will NOT be able to
    return to it. As a result, these questions will not appear in the review screen.

    You have an Azure subscription that contains the following users in an
    Azure Active Directory tenant named contoso.onmicrosoft.com:

    | Name | Role | Scope |
    | --- | --- | --- |
    | User1 | Global administrator | Azure Active Directory |
    | User2 | Global administrator | Azure Active Directory |
    | User3 | User administrator | Azure Active Directory |
    | User4 | Owner | Azure Subscription |

    User1 creates a new Azure Active Directory tenant named
    external.contoso.onmicrosoft.com.
    You need to create new user accounts in external.contoso.onmicrosoft.com.
    Solution: You instruct User1 to create the user accounts.
    Does that meet the goal?
  choices:
    A: 'Yes'
    B: 'No'
  answer: A
  user_answer: B
  user_result: incorrect
  learning_note: |
    Tenant roles do not automatically carry over to another tenant, but the
    user who creates a new tenant receives Global Administrator in that tenant.
  explanation: |
    A, Yes, is correct. The user who creates a Microsoft Entra tenant is
    automatically assigned Global Administrator in the new tenant. Because
    User1 created external.contoso.onmicrosoft.com, User1 can switch to that
    directory and create the required user accounts.

    The decisive fact is that User1 created the new tenant, not merely that
    User1 is Global Administrator in contoso.onmicrosoft.com. Directory roles
    are scoped to their tenant and do not automatically grant authority in
    another tenant. User1 receives a separate creator assignment in the new
    tenant; the table alone does not establish permissions there for User2
    or User3. User4's Azure subscription Owner role is distinct from a
    Microsoft Entra directory role.

    B is incorrect because User1 already has the required authority in the
    newly created tenant. No additional role assignment is stated as necessary.
    Azure Active Directory is now named Microsoft Entra ID.

    Exam takeaway: tenant creator becomes Global Administrator in the new
    tenant; other administrators in the original tenant do not inherit access.

    [Microsoft Learn: Create a new Microsoft Entra tenant](https://learn.microsoft.com/en-us/entra/fundamentals/create-new-tenant)

- id: '014'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  question: |
    You have an existing Azure subscription that contains 10 virtual machines.
    You need to monitor the latency between your on-premises network and the
    virtual machines.
    What should you use?
  choices:
    A: Service Map
    B: Connection troubleshoot
    C: Network Performance Monitor
    D: Effective routes
  answer: C
  user_answer: C
  user_result: correct
  explanation: |
    C, Network Performance Monitor, is the correct historical answer among
    the listed options. It monitored network performance, including latency
    and packet loss, between on-premises resources and Azure virtual machines.
    The requirement is ongoing latency monitoring across a hybrid network.

    A, Service Map, maps application and process dependencies rather than
    providing the requested hybrid network latency monitoring. B, Connection
    troubleshoot, performs an on-demand connectivity diagnostic; it is not
    the continuous monitoring service. D, Effective routes, shows routing
    information for a network interface, not latency measurements.

    This question uses a legacy service. For a current implementation, use
    Azure Network Watcher Connection Monitor, which measures network latency
    and packet loss and supports Azure and on-premises endpoints. Connection
    Monitor is distinct from the Connection troubleshoot option listed here.
    Microsoft provides migration guidance from Network Performance Monitor
    to Connection Monitor.

    Exam takeaway: continuous network performance monitoring differs from
    one-time connectivity troubleshooting and route inspection. Remember
    Network Performance Monitor for this older question and Connection
    Monitor for current deployments.

    [Microsoft Learn: Connection Monitor overview](https://learn.microsoft.com/en-us/azure/network-watcher/connection-monitor-overview)
    [Microsoft Learn: Migrate from Network Performance Monitor](https://learn.microsoft.com/en-us/azure/network-watcher/migrate-to-connection-monitor-from-network-performance-monitor)

- id: '015'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  question: |
    HOTSPOT -
    You have an Azure App Service plan named ASP1.
    CPU usage for ASP1 is shown in the following exhibit.

    The Azure Monitor line chart is titled CPU Percentage for ASP1.
    The time selector reads Local Time: Last 30 days (Automatic - 6 hours).
    Two series are selected: ASP1 CPU Percentage, Avg and ASP1 CPU Percentage, Max.
    The horizontal axis shows Aug 29, Sep 05, Sep 12, Sep 19, and Sep 26;
    the displayed timezone is UTC-06:00. The vertical axis shows CPU percentage,
    with labeled ticks from 0% through 110% in increments of 10%.

    - The blue Average series stays below approximately 10%, mostly around
      2–7%, with small recurring spikes throughout the period.
    - The orange Maximum series frequently reaches 100%, with many dips to
      approximately 70–95% and a few deeper dips to approximately 15–60%.
    - The legend shows CPU Percentage (Avg), use2Shared: 3.6684%, and
      CPU Percentage (Max), use2Shared: 100%.

    Use the drop-down menus to select the answer choice that completes each
    statement based on the information presented in the graphic.
    NOTE: Each correct selection is worth one point.
  choices:
    The average CPU percentage is calculated [answer choice] per day:
      - once
      - four times
      - six times
      - 24 times
    ASP1 must be [answer choice] to optimize CPU usage:
      - scaled up
      - scaled down
      - scaled out
  answer:
    The average CPU percentage is calculated [answer choice] per day: four times
    ASP1 must be [answer choice] to optimize CPU usage: scaled down
  user_answer:
    The average CPU percentage is calculated [answer choice] per day: four times
    ASP1 must be [answer choice] to optimize CPU usage: scaled up
  user_result: partially_correct
  user_reasoning: |
    Calculated four times per day from the six-hour interval. Chose scaling
    up because maximum CPU reaches 100% many times.
  learning_note: |
    Maximum CPU within a six-hour bucket does not show how long a peak lasted.
    The low average CPU indicates spare capacity for the intended exam answer.
    Chart aggregation granularity is distinct from raw metric sampling frequency.
  explanation: |
    The intended selections are four times and scaled down.

    Four times: the chart uses six-hour aggregation buckets, so there are
    24 / 6 = 4 displayed average values per day. This is chart aggregation,
    not a claim that Azure collects or calculates raw CPU metrics only four
    times per day. Underlying samples are collected at finer granularity.

    Scaled down: average CPU is 3.6684%, and the blue average series remains
    below approximately 10% throughout the chart. The exam interprets this
    as an oversized plan with substantial unused CPU capacity. Selecting
    a smaller plan size improves utilization and can reduce cost.

    The maximum series reports the highest CPU observation in each six-hour
    bucket. A maximum of 100% does not imply that CPU remained at 100% for
    that entire interval. Your first selection is correct, but frequent
    maximum values alone do not justify scaling up. Scaling out adds
    instances and is not the intended response to such low average use.

    For a real deployment, this coarse chart alone cannot establish that
    scaling down is safe. Inspect shorter intervals, instance-level metrics,
    memory use, request latency, and workload requirements before resizing.
    High maximums should be investigated even when the long-window average
    is low. Treat scaled down as the intended exam inference, not proof
    that every workload represented by this graph can safely be downsized.

    Exam takeaway: read both the aggregation type and time granularity;
    distinguish peak CPU from sustained CPU usage.

    [Microsoft Learn: Metrics aggregation and display](https://learn.microsoft.com/en-us/azure/azure-monitor/metrics/metrics-aggregation-explained)
    [Microsoft Learn: Autoscaling guidance](https://learn.microsoft.com/en-us/azure/architecture/best-practices/auto-scaling)

- id: '016'
  skill: Monitor and maintain Azure resources
  sub-skill: Implement backup and recovery
  question: |
    DRAG DROP -
    You have an Azure Linux virtual machine that is protected by Azure Backup.
    One week ago, two files were deleted from the virtual machine.
    You need to restore the deleted files to an on-premises Windows Server 2016
    computer as quickly as possible.
    Which four actions should you perform in sequence? To answer, move the
    appropriate actions from the list of actions to the answer area and
    arrange them in the correct order.
  choices:
    - Download and run the script to mount a drive on the local computer
    - Select a restore point that contains the deleted files
    - From the Azure portal, click Restore VM from the vault
    - From the Azure portal, click File Recovery from the vault
    - Mount a VHD
    - Copy the files by using AZCopy
    - Copy the files by using File Explorer
  answer:
    - From the Azure portal, click File Recovery from the vault
    - Select a restore point that contains the deleted files
    - Download and run the script to mount a drive on the local computer
    - Copy the files by using File Explorer
  user_answer:
    - From the Azure portal, click File Recovery from the vault
    - Select a restore point that contains the deleted files
    - Download and run the script to mount a drive on the local computer
    - Copy the files by using File Explorer
  user_result: correct
  learning_note: |
    The sequence matches the intended exam answer, but the Linux-to-Windows
    scenario omits a compatible Linux recovery host and file-transfer step.
    Do not assume Windows can directly mount a typical Linux backup filesystem.
  explanation: |
    Your four actions match the intended exam sequence:
    1. Open File Recovery for the protected VM in the Recovery Services vault.
    2. Select a recovery point created before the files were deleted.
    3. Download and run the recovery script to mount the recovery-point volumes.
    4. Copy the required files, using File Explorer when they are accessible
       from the Windows destination.

    File Recovery avoids restoring an entire VM just to recover two files.
    Restore VM and manually mounting a VHD are unnecessary for the intended
    file-recovery workflow. AZCopy transfers data to or from Azure storage;
    it is not required to copy files exposed through file recovery.

    Technical limitation: Microsoft requires the recovery script to run on
    a machine with the same or a compatible OS as the backed-up VM. Linux VM
    backups produce a Linux recovery script and commonly contain filesystems
    that Windows Server 2016 cannot read natively. Therefore, the offered
    sequence is incomplete if local computer means the Windows destination.

    In practice, mount the recovery point on a compatible Linux recovery
    host, then transfer the recovered files to Windows using a suitable
    network transfer method. File Explorer can copy them from a Linux SMB
    share if one is configured. This intermediate host and transfer setup
    are not specified among the offered actions. After copying the files,
    unmount the recovery disks through the portal.

    The recorded correct result reflects the intended ordering among the
    offered choices, not verification that direct Linux-backup mounting on
    Windows is supported.

    Exam takeaway: select file recovery for a few files, choose a pre-deletion
    point, mount on a compatible OS, copy the files, and unmount afterward.

    [Microsoft Learn: Recover files and folders from Azure VM backup](https://learn.microsoft.com/en-us/azure/backup/backup-azure-restore-files-from-vm)

- id: '017'
  skill: Monitor and maintain Azure resources
  sub-skill: Implement backup and recovery
  question: |
    HOTSPOT -
    You purchase a new Azure subscription named Subscription1.
    You create a virtual machine named VM1 in Subscription1. VM1 is not
    protected by Azure Backup.
    You need to protect VM1 by using Azure Backup. Backups must be created
    at 01:00 and stored for 30 days.
    What should you do? To answer, select the appropriate options in the
    answer area.
    NOTE: Each correct selection is worth one point.
  choices:
    Location in which to store the backups:
      - A blob container
      - A file share
      - A Recovery Services vault
      - A storage account
    Object to use to configure the protection for VM1:
      - A backup policy
      - A batch job
      - A batch schedule
      - A recovery plan
  answer:
    Location in which to store the backups: A Recovery Services vault
    Object to use to configure the protection for VM1: A backup policy
  user_answer:
    Location in which to store the backups: A Recovery Services vault
    Object to use to configure the protection for VM1: A backup policy
  user_result: correct
  explanation: |
    Both selections are correct: a Recovery Services vault and a backup policy.

    A Recovery Services vault manages Azure VM backups and stores vaulted
    recovery points. Use a vault in the same region as VM1. A user-managed
    blob container, file share, or storage account is not the protection
    resource selected for Azure VM Backup.

    A backup policy defines the schedule and retention. Configure daily
    backup at 01:00 in the required timezone and retain the daily recovery
    points for 30 days, then enable protection for VM1 with that policy.

    A batch job and batch schedule are Azure Batch workload concepts, not
    Azure Backup protection policies. A recovery plan orchestrates disaster
    recovery failover in Azure Site Recovery; it does not define VM backup
    scheduling and retention.

    Exam takeaway: vault = backup storage and management; backup policy =
    when backups run and how long recovery points are retained.

    [Microsoft Learn: Back up Azure VMs in a Recovery Services vault](https://learn.microsoft.com/en-us/azure/backup/backup-azure-arm-vms-prepare)
    [Microsoft Learn: Backup policy schedule and retention](https://learn.microsoft.com/en-us/azure/backup/guidance-best-practices)

- id: '018'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  question: |
    You have an Azure virtual machine named VM1.
    Azure collects events from VM1.
    You are creating an alert rule in Azure Monitor to notify an administrator
    when an error is logged in the System event log of VM1.
    Which target resource should you monitor in the alert rule?
  choices:
    A: virtual machine extension
    B: virtual machine
    C: metric alert
    D: Azure Log Analytics workspace
  answer: D
  user_answer: D
  user_result: correct
  explanation: |
    D, Azure Log Analytics workspace, is the intended answer. The collected
    Windows event records are stored in the workspace. Create a log search
    alert scoped to that workspace, filter for VM1's System log errors, and
    trigger when the matching record count exceeds zero. Attach an action
    group to notify the administrator.

    For events collected into the Event table, an illustrative query is:

    ```kusto
    Event
    | where Computer =~ "VM1"
    | where EventLog == "System"
    | where EventLevelName =~ "Error"
    ```

    Use the actual Computer value reported by VM1, which may be a fully
    qualified name, or filter by its resource ID. Match the query to the
    table and schema used by the configured collection pipeline.

    A is a collection or management component, not the workspace containing
    the events. B is the source of the guest events; targeting its platform
    metrics alone does not query the System event log. C names an alert type,
    not a target resource, and this requirement is based on log records.

    Current Azure Monitor also supports resource-centric log alert scopes
    in applicable configurations. D remains the intended workspace-based
    answer here; do not infer that a VM can never be a log alert scope.

    Exam takeaway: guest event-log errors require a log query; choose the
    Log Analytics workspace for the workspace-based alert in this question.

    [Microsoft Learn: Event table query examples](https://learn.microsoft.com/en-us/azure/azure-monitor/reference/queries/event)
    [Microsoft Learn: Log search alert troubleshooting and workspace access](https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-troubleshoot-log)

- id: '019'
  skill: Manage Azure identities and governance
  sub-skill: Manage Azure subscriptions and governance
  question: |
    You have an Azure subscription that contains 100 virtual machines.
    You regularly create and delete virtual machines.
    You need to identify unattached disks that can be deleted.
    What should you do?
  choices:
    A: From Azure Cost Management, view Cost Analysis
    B: From Azure Advisor, modify the Advisor configuration
    C: From Microsoft Azure Storage Explorer, view the Account Management properties
    D: From Azure Cost Management, view Advisor Recommendations
  answer: D
  user_answer: D
  user_result: correct
  explanation: |
    D is correct. Azure Advisor cost recommendations identify unattached
    managed disks that may be removed to avoid unnecessary storage charges.
    Review Advisor Recommendations through Cost Management to find the
    affected resources. Disks can remain after their virtual machines are
    deleted and continue to incur charges.

    A, Cost Analysis, shows spending and usage trends but is not the
    recommendation view that identifies disks for cleanup. B changes
    Advisor configuration rather than displaying the recommendations.
    C manages storage connections and account properties; it does not
    provide the requested subscription-level cost recommendations for
    unattached managed disks.

    An unattached disk is a cleanup candidate, not proof that its data is
    no longer needed. Confirm its purpose and required retention before
    deleting it. The question asks how to identify candidates, not to
    delete every unattached disk automatically.

    Exam takeaway: Cost Analysis explains spending; Advisor Recommendations
    suggests actions to reduce unnecessary costs.

    [Microsoft Learn: Azure Advisor cost recommendations](https://learn.microsoft.com/en-us/azure/advisor/advisor-reference-cost-recommendations)

- id: '020'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  question: |
    You have an Azure web app named webapp1.
    Users report that they often experience HTTP 500 errors when they connect
    to webapp1.
    You need to provide the developers of webapp1 with real-time access to
    the connection errors. The solution must provide all the connection
    error details.
    What should you do first?
  choices:
    A: From webapp1, enable Web server logging
    B: From Azure Monitor, create a workbook
    C: From Azure Monitor, create a Service Health alert
    D: From webapp1, turn on Application Logging
  answer: D
  user_answer: A
  user_result: incorrect
  learning_note: |
    Web server logs show HTTP request metadata and status codes. Application
    logs provide emitted application error and exception details, which can
    be viewed through Log stream after logging is enabled.
  explanation: |
    D, turn on Application Logging, is the intended answer. Enable application
    logging first, then use App Service Log stream to give developers live
    access to the application's emitted errors and diagnostic messages.
    Choose an appropriate logging level and ensure the app logs its exceptions.

    A, Web server logging, captures raw HTTP request data, including status
    codes such as 500. It can identify failed requests, but does not by itself
    expose the application's exception messages and stack traces. That makes
    it less suitable for the requested detailed developer diagnostics.

    B, a workbook, visualizes existing monitoring data; it does not first
    enable collection of the application's error details. C, a Service Health
    alert, reports Azure service incidents rather than webapp1's individual
    application failures.

    The wording all the connection error details is stronger than any single
    logging switch guarantees. Application Logging captures what the app
    emits, not every exception automatically. Depending on the failure and
    hosting platform, detailed error messages, failed request tracing, or
    Application Insights exception instrumentation may also be necessary.
    These caveats do not change D as the intended first step among the options.

    Exam takeaway: HTTP access logs identify failed requests; application
    logs explain emitted application errors. Enable logging before streaming it.

    [Microsoft Learn: Enable diagnostic logs and stream logs in App Service](https://learn.microsoft.com/en-us/azure/app-service/troubleshoot-diagnostic-logs)

- id: '021'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  question: |
    You have an Azure web app named App1.
    You need to monitor the availability of App1 by using a multi-step web test.
    What should you use in Azure Monitor?
  choices:
    A: Azure Service Health
    B: Azure Application Insights
    C: the Diagnostic settings
    D: metrics
  answer: B
  user_answer: A
  user_result: incorrect
  learning_note: |
    Application Insights tests application availability through synthetic
    requests. Service Health reports Azure service incidents and maintenance,
    not whether a particular application workflow succeeds.
  explanation: |
    B, Azure Application Insights, is the correct historical answer.
    Application Insights provided multi-step web tests that replayed a
    sequence of requests to verify application availability and workflows.

    A, Azure Service Health, reports platform service incidents, planned
    maintenance, and advisories affecting Azure resources. It does not run
    synthetic multi-step tests against App1. C, Diagnostic settings, routes
    supported logs and metrics to monitoring destinations; it does not
    execute availability tests. D, metrics, displays numerical telemetry
    but is not the feature used to create the requested web test.

    This question references a retired feature. Application Insights
    multi-step web tests retired on August 31, 2024. For a current multi-step
    workflow, implement custom availability tests and report their results
    to Application Insights. Standard availability tests are appropriate
    for single-request endpoint checks, not a substitute for an entire
    multi-step transaction.

    Exam takeaway: Application Insights monitors your application's
    availability; Service Health monitors Azure platform health.

    [Microsoft Learn: Application Insights availability tests](https://learn.microsoft.com/en-us/azure/azure-monitor/app/availability)
    [Microsoft retirement announcement: Multi-step web tests](https://learn.microsoft.com/en-us/answers/questions/530154/retirement-announcement-transition-to-custom-avail)

- id: '022'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  question: |
    HOTSPOT -
    You have an Azure subscription that has diagnostic logging enabled and
    is configured to send logs to a Log Analytics workspace.
    You are investigating a service outage.
    You need to view the event time, the event name, and the affected resources.
    How should you complete the query? To answer, select the appropriate
    options in the answer area.
    NOTE: Each correct selection is worth one point.

    ```kusto
    [Table]
    | where Level == 'Critical'
    | [Operator] TimeGenerated, OperationNameValue, _ResourceId
    ```
  choices:
    Table:
      - AzureActivity
      - Heartbeat
      - NetworkMonitoring
      - Perf
    Operator:
      - extend
      - join
      - print
      - project
  answer:
    Table: AzureActivity
    Operator: project
  user_answer:
    Table: NetworkMonitoring
    Operator: print
  user_result: incorrect
  learning_note: |
    Use AzureActivity for subscription activity events. The project operator
    selects output columns from existing rows; print creates a row from scalar
    expressions and is not a piped column-selection operator.
  explanation: |
    The correct selections are AzureActivity and project:

    ```kusto
    AzureActivity
    | where Level == 'Critical'
    | project TimeGenerated, OperationNameValue, _ResourceId
    ```

    AzureActivity contains exported Azure Activity Log events. The supplied
    columns identify the event timestamp, operation name, and associated
    resource. The where clause filters the records to Critical severity;
    project returns only the three requested columns.

    Heartbeat records agent heartbeat information. NetworkMonitoring contains
    network-monitoring data rather than the subscription activity events
    described here. Perf contains performance-counter samples.

    extend adds or calculates columns while retaining other columns. join
    combines tables. print evaluates scalar expressions to produce a row;
    it does not select these columns from the incoming event records.

    The screenshot capitalizes Where; the transcribed query uses the valid
    lowercase KQL operator where. Export of the relevant Activity Log
    categories must be configured for the records to appear in AzureActivity.
    The query only returns ingested Critical events; it does not guarantee
    that every outage produces a matching event.

    Exam takeaway: choose the table for the data source, where for row
    filtering, and project for column selection.

    [Microsoft Learn: AzureActivity table](https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/azureactivity)
    [Microsoft Learn: project operator](https://learn.microsoft.com/en-us/kusto/query/project-operator)

- id: '023'
  skill: Monitor and maintain Azure resources
  sub-skill: Implement backup and recovery
  question: |
    You have a Recovery Services vault named RSV1. RSV1 has a backup policy
    that retains instant snapshots for five days and daily backup for 14 days.
    RSV1 performs daily backups of VM1. VM1 hosts a static website that was
    updated eight days ago.
    You need to recover VM1 to a point eight days ago. The solution must
    minimize downtime.
    What should you do first?
  choices:
    A: Deallocate VM1.
    B: Restore VM1 by using the Replace existing restore configuration option.
    C: Delete VM1.
    D: Restore VM1 by using the Create new restore configuration option.
  answer: D
  user_answer: B
  user_result: incorrect
  learning_note: |
    Create new restores alongside the running VM so it can continue serving
    traffic. Replace existing interrupts the source VM. Snapshot retention
    and vault backup retention are separate recovery windows.
  explanation: |
    D, Create new, is correct. Restore the eight-day-old recovery point to
    a new VM while VM1 continues to serve the website. Validate the restored
    site, then redirect traffic to it. This limits service disruption to
    the cutover instead of interrupting the existing site for the restore.

    The recovery point is older than the five-day instant snapshot retention,
    so the instant snapshot is no longer available. It remains within the
    14-day daily backup retention and can be restored from the vault tier.
    Restoring alongside VM1 keeps recovery time from becoming website downtime.

    A stops service before recovery is ready. B replaces the disks of the
    existing VM and requires interruption during disk replacement. It can
    restore the desired state, but does not best meet the minimum-downtime
    requirement. C removes the working VM before its replacement is available.

    Create new is the first step, not the entire recovery. Configure and
    validate the new VM's web service and networking, then perform the traffic
    cutover using the site's existing routing mechanism. The question does
    not specify that mechanism, so zero downtime is not guaranteed.

    Exam takeaway: restore alongside a running service when minimizing
    downtime; distinguish snapshot availability from vault recovery retention.

    [Microsoft Learn: Azure VM restore options](https://learn.microsoft.com/en-us/azure/backup/backup-azure-arm-restore-vms)
    [Microsoft Learn: Snapshot and vault recovery-point tiers](https://learn.microsoft.com/en-us/azure/backup/about-azure-vm-restore)

- id: '024'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  tags: [must-review]
  question: |
    HOTSPOT
    You have an Azure subscription that contains the following resources.

    | Name | Type |
    | --- | --- |
    | VM1 | Virtual machine |
    | storage1 | Storage account |
    | Workspace1 | Log Analytics workspace |
    | DB1 | Azure SQL database |

    You plan to create a data collection rule named DCR1 in Azure Monitor.
