      - VM1, storage1, and DB1 only
      - VM1, storage1, Workspace1, and DB1
    destinations:
      - storage1 only
      - Workspace1 only
      - Workspace1 and storage1 only
      - Workspace1, storage1, and DB1 only
  answer:
    data_sources: VM1 only
    destinations: Workspace1 only
  user_answer:
    data_sources: VM1, storage1, and DB1 only
    destinations: Workspace1 only
  user_result: partially_correct
  learning_note: |
    Distinguish Azure Monitor Agent data collection rules for VM guest data
    from diagnostic settings for Azure resource logs. The destination
    selection was correct; the source selection included extra resources.
  explanation: |
    For the Azure Monitor Agent collection scenario tested by this question,
    VM1 is the eligible source and Workspace1 is the eligible destination.
    The agent collects guest logs and performance data from the VM according
    to a DCR and sends logs to a Log Analytics workspace.

    storage1 and DB1 use diagnostic settings to send their resource logs
    to Azure Monitor Logs; they are not VM agent sources. Workspace1 is
    the receiving workspace, not an agent data source.

    The learner's source selection is corrected from VM1, storage1, and DB1
    to VM1 only. The Workspace1 destination selection is correct.

    This older question assumes the VM agent collection workflow. Modern
    DCRs support additional scenarios, including metrics export, so do not
