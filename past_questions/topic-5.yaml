    It also states that Ultra Disks are only available when using Managed
    Disks, and that unmanaged data disks cannot be added during VM creation
    but can be added after creation. These are historical portal messages.

    You need to ensure that VM1 can be created in an Availability Zone.

    Which two settings should you modify? Each correct answer presents
