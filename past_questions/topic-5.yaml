    You have an Azure subscription that contains the virtual machines
    shown in the following table.

    | Name | Public IP SKU | Connected to | Status |
    | --- | --- | --- | --- |
    | VM1 | None | VNET1/Subnet1 | Stopped (deallocated) |
    | VM2 | Basic | VNET1/Subnet2 | Running |

    You deploy a load balancer that has the following configurations:

    - Name: LB1
    - Type: Internal
    - SKU: Standard
    - Virtual network: VNET1

    You need to ensure that you can add VM1 and VM2 to the backend pool
    of LB1.

    Solution: You create a Basic SKU public IP address, associate the
    address to the network interface of VM1, and then start VM1.

    Does this meet the goal?
  choices:
    A: 'Yes'
    B: 'No'
  answer: B
  user_answer: A
  user_result: incorrect
  learning_note: |
    A Standard Load Balancer backend cannot mix with Basic public IPs on
    its member VMs, including for an internal load balancer. Backend VMs
    do not need their own public IPs. Starting a VM does not fix SKU conflicts.
  explanation: |
    B — No. LB1 is Standard SKU, but VM2 already has a Basic public IP.
    The solution adds another incompatible Basic public IP to VM1 without
    resolving VM2's mismatch. Starting VM1 does not change resource SKUs.

    An internal load balancer uses a private frontend IP, but public IPs
    attached to its backend VMs still must be compatible with its SKU.
    Backend VMs do not require public IPs. Leave VM1 without a public IP
    and remove VM2's Basic public IP or upgrade it to Standard instead.

    VM1 and VM2 can occupy different subnets in the same VNet. Their subnet
    placement is not the obstacle. A VM must run and pass health probes
    to serve traffic, but backend membership and operational readiness
    are separate concerns; starting VM1 does not resolve the SKU mismatch.

    This question uses historical Basic SKU resources. Basic Load Balancer
    and Basic public IPs retired on September 30, 2025; use supported
    Standard resources in current deployments.

    [Microsoft Learn: SKU compatibility for backend public IPs](https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-basic-upgrade-guidance)
    [Microsoft Learn: Load Balancer SKUs](https://learn.microsoft.com/en-us/azure/load-balancer/skus)
