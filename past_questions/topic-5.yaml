- id: '078'
  skill: Implement and manage virtual networking
  sub-skill: Configure secure access to virtual networks
  question: |
    Note: This question is part of a series of questions that present the
    same scenario. Each question in the series contains a unique solution
    that might meet the stated goals. Some question sets might have more
    than one correct solution, while others might not have a correct solution.

    After you answer a question in this section, you will NOT be able to
    return to it. As a result, these questions will not appear in the review
    screen.

    You have an app named App1 that is installed on two Azure virtual
    machines named VM1 and VM2. Connections to App1 are managed by using
    an Azure Load Balancer.

    The effective network security configurations for VM2 are shown in
    the following exhibit.

    | Setting | Value |
    | --- | --- |
    | Network interface | VM2-NIC1 |
    | Virtual network/subnet | Vnet1/Subnet11 |
    | NIC public IP | None |
    | NIC private IP | 10.240.11.5 |
    | Accelerated networking | Disabled |
    | Network security group | NSG2 |
    | NSG association | Subnet11; impacts 1 subnet, 0 network interfaces |

    The exhibit's association label inconsistently calls Subnet11 a
    network interface; the association counts identify a subnet association.

    | Priority | Name | Port | Protocol | Source | Destination | Action |
    | --- | --- | --- | --- | --- | --- | --- |
    | 100 | Allow_131.107.100.50 | 443 | TCP | 131.107.100.50 | VirtualNetwork | Allow |
    | 200 | BlockAllOther441 | 443 | Any | Any | Any | Deny |
    | 65000 | AllowVnetInBound | Any | Any | VirtualNetwork | VirtualNetwork | Allow |
    | 65001 | AllowAzureLoadBalancerInBound | Any | Any | AzureLoadBalancer | Any | Allow |
    | 65500 | DenyAllInBound | Any | Any | Any | Any | Deny |

    You discover that connections to App1 from 131.107.100.50 over TCP
    port 443 fail. You verify that the Load Balancer rules are configured
    correctly.

    You need to ensure that connections to App1 can be established
    successfully from 131.107.100.50 over TCP port 443.

    Solution: You create an inbound security rule that denies all traffic
    from the 131.107.100.50 source and has a priority of 64999.

    Does this meet the goal?
  choices:
    A: 'Yes'
    B: 'No'
  answer: B
  user_answer: B
  user_result: correct
  learning_note: |
    Custom NSG priorities range from 100 to 4096. Priority 64999 is invalid.
    Lower numbers are evaluated first, and processing stops at the first
    match. A later client deny does not fix blocked load balancer probes.
  explanation: |
    B — No is correct. The proposed rule cannot be created as specified:
    custom NSG rule priorities must be between 100 and 4096 inclusive.
    The existing priorities 65000, 65001, and 65500 belong to default rules,
    not the permitted range for custom rules.

    Even if priority 64999 were hypothetically allowed, the existing client
    TCP 443 allow at priority 100 would match first. The later deny could
    not override it and would not resolve the connectivity failure.

    Azure Load Balancer preserves the client source IP for application
    traffic. Health probes instead originate from 168.63.129.16 for IPv4,
    represented by the AzureLoadBalancer service tag. If probes use port
    443, the deny at priority 200 blocks them before the default probe allow
    at 65001. Permit probe traffic before priority 200 to address that cause.

    The exhibit names the deny BlockAllOther441, but its Port column is
    443. Rule names are labels; the configured port determines matching.
    The exhibit omits the probe port and VM1's configuration, so blocked
    probes on 443 are the intended likely diagnosis, not a fully proven
    explanation. The proposed client deny does not fix it in any case.

    Remember: valid custom priorities = 100–4096;
    first matching rule wins; client traffic and probes have different sources.

    [Microsoft Learn: NSG rule priorities](https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview)
    [Microsoft Learn: Load Balancer health probes](https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-custom-probe-overview)
- id: '079'
  skill: Implement and manage virtual networking
  sub-skill: Configure and manage virtual networks in Azure
  question: |
    DRAG DROP

    You have an Azure subscription that contains two on-premises locations
    named site1 and site2.

    You need to connect site1 and site2 by using an Azure Virtual WAN.

    Which four actions should you perform in sequence? To answer, move
    the appropriate actions from the list of actions to the answer area
    and arrange them in the correct order.
  choices:
    - Create a virtual hub.
    - Create VPN sites.
    - Connect the virtual networks to the hub.
    - Create a Virtual WAN resource.
    - Connect the VPN sites to the hub.
  answer:
    - Create a Virtual WAN resource.
    - Create a virtual hub.
    - Create VPN sites.
    - Connect the VPN sites to the hub.
  user_answer:
    - Create a virtual hub.
    - Create VPN sites.
    - Connect the VPN sites to the hub.
  user_result: partially_correct
  learning_note: |
    Create the Virtual WAN resource before its virtual hub. VPN sites
    describe on-premises locations; connect them to the hub's S2S VPN gateway.
    The question asks for four actions, and the supplied sequence omits
    the parent Virtual WAN resource.
  explanation: |
    The intended four-step sequence is:
    1. Create a Virtual WAN resource.
    2. Create a virtual hub.
    3. Create VPN sites.
    4. Connect the VPN sites to the hub.

    Your three actions are in the intended relative order, but you omitted
    the first action. A virtual hub belongs to a Virtual WAN resource,
    so create that parent resource first.

    Create the hub with a site-to-site VPN gateway. Create VPN site resources
    representing site1 and site2 and their VPN device links, then connect
    those sites to the hub's VPN gateway. Configure the corresponding
    on-premises devices to establish the tunnels. The four listed actions
    are the exam's Azure-side sequence, not every operational setup task.

    Use Standard Virtual WAN with branch-to-branch connectivity enabled
    for transit between the two locations. VPN sites and hubs both depend
    on the Virtual WAN resource; a VPN site can technically be created
    before the hub, but the displayed answer follows the documented
    tutorial sequence. Both must exist before connecting sites to the hub.

    Connect the virtual networks to the hub is the distractor. That action
    connects Azure VNets, while this scenario asks to connect two on-premises
    locations and specifies no Azure VNet requiring a hub connection.

    Remember: Virtual WAN resource → hub → VPN sites → site connections.

    [Microsoft Learn: Create a site-to-site connection using Virtual WAN](https://learn.microsoft.com/en-us/azure/virtual-wan/virtual-wan-site-to-site-portal)
    [Microsoft Learn: Virtual WAN overview](https://learn.microsoft.com/en-us/azure/virtual-wan/virtual-wan-about)
- id: '080'
  tags: [must-review]
  skill: Implement and manage virtual networking
  sub-skill: Configure name resolution and load balancing
  question: |
    HOTSPOT

    You have an Azure subscription that contains the virtual networks
    shown in the following table.

    | Name | Peered with | DNS server |
    | --- | --- | --- |
    | VNET1 | VNET2 | Default (Azure-provided) |
    | VNET2 | VNET1 | 10.10.0.4 |

    You have the virtual machines shown in the following table.

    | Name | IP address | Network interface | Connects to |
    | --- | --- | --- | --- |
    | Server1 | 10.10.0.4 | NIC1 | VNET1/Subnet1 |
    | Server2 | 172.16.0.4 | NIC2 | VNET1/Subnet2 |
    | Server3 | 192.168.0.4 | NIC3 | VNET2/Subnet2 |

    You have the virtual network interfaces shown in the following table.

    | Name | DNS server |
    | --- | --- |
    | NIC1 | Inherit from virtual network |
    | NIC2 | 10.10.0.4 |
    | NIC3 | Inherit from virtual network |

    Server1 is a DNS server that contains the resources shown in the following table.

    | Name | Type | Value |
    | --- | --- | --- |
    | contoso.com | Primary DNS zone | Not applicable |
    | Host1.contoso.com | A record | 131.107.10.15 |

    You have an Azure private DNS zone named contoso.com that has a virtual
    network link to VNET2 and the records shown in the following table.

    | Name | Type | Value |
    | --- | --- | --- |
    | Host1 | A record | 131.107.200.20 |
    | Host2 | A record | 131.107.50.50 |

    For each of the following statements, select Yes if the statement
    is true. Otherwise, select No.

    NOTE: Each correct selection is worth one point.
  choices:
    Server2 resolves host2.contoso.com to 131.107.50.50.:
      - 'Yes'
      - 'No'
    Server2 resolves host1.contoso.com to 131.107.10.15.:
      - 'Yes'
      - 'No'
    Server3 resolves host2.contoso.com to 131.107.50.50.:
      - 'Yes'
      - 'No'
  answer:
    Server2 resolves host2.contoso.com to 131.107.50.50.: 'No'
    Server2 resolves host1.contoso.com to 131.107.10.15.: 'Yes'
    Server3 resolves host2.contoso.com to 131.107.50.50.: 'No'
  user_answer:
    Server2 resolves host2.contoso.com to 131.107.50.50.: 'Yes'
    Server2 resolves host1.contoso.com to 131.107.10.15.: 'Yes'
    Server3 resolves host2.contoso.com to 131.107.50.50.: 'Yes'
  user_result: partially_correct
  user_reasoning: |
    Server2 uses Server1 as its DNS server. Referred to a Host1 record in
    the private DNS zone when explaining the first Yes selection, and
    selected Yes for all three statements.
  learning_note: |
    NIC DNS settings override VNet DNS settings. Custom DNS does not
    automatically query Azure Private DNS zones linked to the client VNet.
    A primary zone on the custom server is separate from an Azure private
    zone with the same name; missing records are not automatically merged.
  explanation: |
    The correct sequence is No, Yes, No. Your second selection is correct.

    Server2's NIC2 explicitly selects 10.10.0.4 (Server1) as its DNS server,
    overriding VNET1's Azure-provided setting. Server3's NIC3 inherits
    VNET2's DNS setting, which is also 10.10.0.4. Thus both clients query
    Server1, assuming DNS traffic is allowed across the peering.

    Server1 hosts a primary contoso.com zone containing only the listed
    Host1 record at 131.107.10.15. It can answer host1.contoso.com with that
    address, making the second statement Yes. It has no Host2 record, so
    it cannot return 131.107.50.50 for host2.contoso.com. As authoritative
    for contoso.com, it returns a negative response for the missing name
    rather than automatically searching another same-named zone.

    The Azure private contoso.com zone is a different DNS authority with
    different records. Linking it to VNET2 does not cause clients configured
    with custom DNS to query it automatically. Server3 still uses Server1,
    so the third statement is No despite being in the linked VNet.

    Server1's own NIC using Azure-provided DNS does not merge its hosted
    primary zone with Azure Private DNS. Also, VNET1 is not linked to the
    Azure private zone. Peering provides network connectivity, not automatic
    inheritance of another VNet's private DNS zone links.

    No forwarding, delegation, or other integration is specified. Resolving
    Azure private records through custom DNS requires an explicitly designed
    resolver or forwarding arrangement and handling the same-name authority
    conflict, not merely creating a VNet link.

    Remember: identify the client's effective DNS server first, then read
    that server's zone. NIC override → VNet setting → resolver's records.

    [Microsoft Learn: Private DNS zone resolution](https://learn.microsoft.com/en-us/azure/dns/private-dns-privatednszone)
    [Microsoft Learn: Private DNS FAQ](https://learn.microsoft.com/en-us/azure/dns/dns-faq-private)
- id: '081'
  skill: Implement and manage virtual networking
  sub-skill: Configure and manage virtual networks in Azure
  question: |
    You have a virtual network named VNet1 as shown in the exhibit.
    (Click the Exhibit tab.)

    | Setting | Value |
    | --- | --- |
    | Resource group | Production |
    | Location | West US |
    | Subscription | Production subscription |
    | Subscription ID | 14d26092-8e42-4ea7-b770-9dcef70fb1ea |
    | Address space | 10.2.0.0/16 |
    | DNS servers | Azure provided DNS service |
    | Tags | Click here to add tags |

    The Connected devices table has columns Device, Type, IP address,
    and Subnet, and shows No results.

    No devices are connected to VNet1.

    You plan to peer VNet1 to another virtual network named VNet2.
    VNet2 has an address space of 10.2.0.0/16.

    You need to create the peering.

    What should you do first?
  choices:
    A: Modify the address space of VNet1.
    B: Add a gateway subnet to VNet1.
    C: Create a subnet on VNet1 and VNet2.
    D: Configure a service endpoint on VNet2.
  answer: A
  user_answer: A
  user_result: correct
  user_reasoning: |
    Modify the address space to avoid overlapping address ranges.
  learning_note: |
    VNet peering requires nonoverlapping address spaces. Different subnet
    ranges within overlapping VNet address spaces do not remove the conflict.
  explanation: |
    A — Modify the address space of VNet1 is correct, and your reasoning
    is sound. Both VNets currently use 10.2.0.0/16, so their address spaces
    overlap completely. Azure does not allow peering between overlapping VNets.

    Change VNet1 to a nonoverlapping range, such as 10.3.0.0/16, before
    creating the peering. Remove the conflicting 10.2.0.0/16 prefix rather
    than merely adding another prefix. If existing subnets use the old
    range, update or remove them as needed so all subnet prefixes remain
    inside the new address space. The absence of connected devices reduces
    the disruption involved in changing the range.

    B — A gateway subnet is used by a virtual network gateway. Ordinary
    VNet peering does not require a gateway and this does not fix overlap.

    C — Creating subnets does not fix overlapping VNet address spaces,
    even if the chosen subnets themselves do not overlap.

    D — A service endpoint provides subnet-based access to supported Azure
    services; it does not establish VNet peering or resolve address conflicts.

    Remember: before peering, compare the entire address spaces of both VNets.

    [Microsoft Learn: Virtual network peering requirements](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-manage-peering)
- id: '082'
  skill: Implement and manage virtual networking
  sub-skill: Configure name resolution and load balancing
  question: |
    You have the Azure virtual machines shown in the following table.

    | Name | IP address | Virtual network |
    | --- | --- | --- |
    | VM1 | 10.0.0.4 | VNET1 |
    | VM2 | 10.0.0.5 | VNET1 |

    VNET1 is linked to a private DNS zone named contoso.com that contains
    the records shown in the following table.

    | Name | Type | TTL | Value | Auto registered |
    | --- | --- | --- | --- | --- |
    | comp1 | TXT | 3600 | 10.0.0.5 | False |
    | comp2 | A | 3600 | 10.0.0.5 | False |
    | comp3 | CNAME | 3600 | comp1.contoso.com | False |
    | comp4 | PTR | 3600 | 10.0.0.5 | False |

    You need to ping VM2 from VM1.

    Which DNS names can you use to ping VM2?
  choices:
    A: comp2.contoso.com and comp4.contoso.com only
    B: comp1.contoso.com, comp2.contoso.com, comp3.contoso.com, and comp4.contoso.com
    C: comp2.contoso.com only
    D: comp1.contoso.com and comp2.contoso.com only
    E: comp1.contoso.com, comp2.contoso.com, and comp4.contoso.com only
  answer: C
  user_answer: C
  user_result: correct
  user_reasoning: |
    An A record points a DNS name to an IP address.
  learning_note: |
    A records resolve names to IPv4 addresses. An IP-looking TXT value
    remains text. A CNAME must ultimately resolve to an address record;
    aliasing a name with only a TXT record does not make it pingable.
    PTR records support reverse lookup, not forward address resolution.
  explanation: |
    C — comp2.contoso.com only is correct, and your reasoning is sound.
    Ping needs to resolve the supplied name to an IP address. comp2 has
    an A record containing VM2's IPv4 address, 10.0.0.5.

    comp1 has a TXT record. Although its value looks like an IP address,
    the record type makes it text data rather than an address mapping.
    An address lookup does not treat that TXT value as an A record.

    comp3 is a CNAME pointing to comp1.contoso.com. A CNAME redirects
    resolution to another DNS name; the target must ultimately have an
    appropriate A or AAAA record. Here, comp1 has only the listed TXT
    record, so the alias does not resolve to VM2's address.

    comp4 has a PTR record, which is intended for reverse lookup from an
    IP address to a hostname. It does not answer the forward A lookup
    needed by ping. The exhibit's PTR value is also atypical: a normal
    reverse DNS PTR uses an owner in a reverse zone and a hostname as
    its target. Either way, this PTR is not an A record for comp4.

    Every other option includes at least one name without a usable
    forward address mapping. Auto registered being False does not prevent
    resolution: manually created A records work normally in a linked zone.
    Successful ICMP replies still require network and guest firewall rules
    to permit ping; the question tests which names resolve to VM2.

    Remember: A = name to IPv4; TXT = text; CNAME = another name;
    PTR = reverse lookup. Record type matters more than how the value looks.

    [Microsoft Learn: DNS zones and record types](https://learn.microsoft.com/en-us/azure/dns/dns-zones-records)
- id: '083'
  tags: [must-review]
  skill: Implement and manage virtual networking
  sub-skill: Configure secure access to virtual networks
  question: |
    HOTSPOT

    You have a network security group (NSG) named NSG1 that has the rules
    defined in the exhibit. (Click the Exhibit tab.)

    The exhibit runs the following PowerShell command:

    ```powershell
    Get-AzNetworkSecurityGroup -Name "NSG1" -ResourceGroupName "RG1" | Select -ExpandProperty SecurityRules
    ```

    | Setting | ALLOW_HTTPS | DENY_PING |
    | --- | --- | --- |
    | Protocol | TCP | ICMP |
    | SourcePortRange | * | * |
    | DestinationPortRange | 443 | * |
    | SourceAddressPrefix | * | VirtualNetwork |
    | DestinationAddressPrefix | * | * |
    | SourceApplicationSecurityGroups | Empty | Empty |
    | DestinationApplicationSecurityGroups | Empty | Empty |
    | Access | Allow | Deny |
    | Priority | 100 | 111 |
    | Direction | Inbound | Outbound |
    | ProvisioningState | Succeeded | Succeeded |
    | Description | Empty | Empty |

    The rule IDs are under subscription 09d06b22-ff51-48b7-a8be-947f15cbd69d,
    resource group RG1, and Microsoft.Network/networkSecurityGroups/NSG1/securityRules,
    with the respective rule names. ETags are resource metadata.

    NSG1 is associated to a subnet named Subnet1. Subnet1 contains the
    virtual machines shown in the following table.

    | Name | IP address |
    | --- | --- |
    | VM1 | 10.1.0.10 |
    | VM2 | 10.1.0.11 |

    You need to add a rule to NSG1 to ensure that VM1 can ping VM2.
    The solution must use the principle of least privilege.

    How should you configure the rule? To answer, select the appropriate
    options in the answer area.

    NOTE: Each correct selection is worth one point.
  choices:
    Direction:
      - Inbound
      - Outbound
    Source:
      - Any
      - 10.1.0.10
      - 10.1.0.11
      - '10.1.0.10; 10.1.0.11'
      - 10.1.0.0/28
    Destination:
      - Any
      - 10.1.0.10
      - 10.1.0.11
      - '10.1.0.10; 10.1.0.11'
      - 10.1.0.0/28
    Priority:
      - '110'
      - '111'
      - '112'
  answer:
    Direction: Outbound
    Source: 10.1.0.10
    Destination: 10.1.0.11
    Priority: '110'
  user_answer:
    Direction: Outbound
    Source: 10.1.0.11
    Destination: 10.1.0.10
    Priority: '110'
  user_result: partially_correct
  user_reasoning: |
    Recognized that an outbound ICMP deny requires a higher-priority allow,
    but proposed allowing an outbound echo from VM2 to VM1 rather than
    the stated VM1-to-VM2 ping.
  learning_note: |
    The ping initiator is the source: VM1 to VM2 means 10.1.0.10 to
    10.1.0.11. NSGs are stateful, so permitted requests allow corresponding
    response traffic without a separate reverse-direction allow.
  explanation: |
    Select Outbound, source 10.1.0.10, destination 10.1.0.11, and priority
    110. Your direction and priority are correct; your IP selections are
    reversed. Configure the new rule with Allow access and ICMP protocol.

    VM1 initiates the echo request. The packet therefore leaves VM1 with
    source 10.1.0.10 and destination 10.1.0.11. DENY_PING blocks outbound
    ICMP at priority 111. The new outbound allow at 110 matches first
    and permits precisely that VM pair, satisfying least privilege.

    An inbound rule cannot override an outbound deny. Priority 112 would
    be evaluated after the deny, and 111 is already used in the outbound
    direction. The existing inbound HTTPS allow at 100 applies to TCP
    port 443, not ICMP.

    The default AllowVnetInBound rule permits the echo request at VM2.
    NSGs are stateful: once the initiating traffic is permitted, its
    corresponding echo reply is allowed without adding a separate
    VM2-to-VM1 rule. A rule allowing VM2 to initiate a ping to VM1 does
    not permit the blocked VM1-to-VM2 initiating request.

    Any, both VM addresses, and 10.1.0.0/28 broaden the allowed endpoints
    beyond the requested source and destination. Select the individual IPs.
    Guest firewalls must also permit ICMP for actual replies; the question
    isolates the necessary NSG change.

    Remember: initiator = source; target = destination;
    lower priority number wins; stateful replies need no reverse allow.

    [Microsoft Learn: NSG rules, priority, and statefulness](https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview)
    [Microsoft Learn: How NSGs filter traffic](https://learn.microsoft.com/en-us/azure/virtual-network/network-security-group-how-it-works)
- id: '084'
  skill: Implement and manage virtual networking
  sub-skill: Configure and manage virtual networks in Azure
  question: |
    Note: This question is part of a series of questions that present the
    same scenario. Each question in the series contains a unique solution
    that might meet the stated goals. Some question sets might have more
    than one correct solution, while others might not have a correct solution.

    After you answer a question in this section, you will NOT be able to
    return to it. As a result, these questions will not appear in the review
    screen.

    You have a computer named Computer1 that has a point-to-site VPN
    connection to an Azure virtual network named VNet1. The point-to-site
    connection uses a self-signed certificate.

    From Azure, you download and install the VPN client configuration
    package on a computer named Computer2.

    You need to ensure that you can establish a point-to-site VPN
    connection to VNet1 from Computer2.

    Solution: On Computer2, you set the Startup type for the IPSec Policy
    Agent service to Automatic.

    Does this meet the goal?
  choices:
    A: 'Yes'
    B: 'No'
  answer: B
  user_answer: B
  user_result: correct
  learning_note: |
    The VPN client configuration package does not supply a client certificate
    and private key. Each certificate-authenticated P2S client needs a valid
    client certificate issued by a root trusted by the Azure VPN gateway.
  explanation: |
    B — No is correct. Setting the IPSec Policy Agent service to Automatic
    does not satisfy the certificate authentication requirement on Computer2.

    The VPN client configuration package supplies the connection settings,
    not Computer1's client certificate and private key. Computer2 must have
    a valid client certificate with its private key, issued by a root whose
    public certificate is uploaded to VNet1's VPN gateway.

    Generate a separate client certificate for Computer2 from the same
    trusted root and install it in the appropriate user certificate store.
    Alternatively, an existing valid client certificate can be exported
    with its private key as a password-protected PFX and imported on
    Computer2, although separate client certificates allow individual
    revocation. Installing only a public certificate without the client
    private key is insufficient.

    Service settings cannot replace a missing authentication credential.
    The stated solution therefore does not establish that Computer2 can
    authenticate to the VPN gateway.

    Remember: VPN package = connection settings;
    client certificate plus private key = authentication credential.

    [Microsoft Learn: Generate and export P2S certificates](https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-certificates-point-to-site)
- id: '085'
  skill: Implement and manage virtual networking
  sub-skill: Configure name resolution and load balancing
  question: |
    You have five Azure virtual machines that run Windows Server 2016.
    The virtual machines are configured as web servers.

    You have an Azure load balancer named LB1 that provides load balancing
    services for the virtual machines.

    You need to ensure that visitors are serviced by the same web server
    for each request.

    What should you configure?
  choices:
    A: Session persistence to Client IP and protocol
    B: Protocol to UDP
    C: Session persistence to None
    D: Floating IP (direct server return) to Enabled
  answer: A
  user_answer: A
  user_result: correct
  learning_note: |
    Client IP and protocol persistence uses a three-tuple hash to maintain
    source IP affinity across connections. None uses the default five-tuple
    hash, which can map separate connections to different backends.
  explanation: |
    A — Session persistence to Client IP and protocol is correct.
    This source IP affinity mode hashes the source IP address, destination
    IP address, and protocol. By excluding the changing source port,
    separate connections from the same client IP using the same protocol
    are mapped to the same backend while the backend pool remains stable.

    C — None uses the default five-tuple hash: source IP, source port,
    destination IP, destination port, and protocol. A single connection
    stays with its backend, but different connections from one visitor
    can be distributed to different servers because their source ports vary.

    B — Selecting UDP changes the transport protocol rather than enabling
    session affinity. It does not satisfy this persistence requirement.

    D — Floating IP changes frontend-to-backend IP mapping for scenarios
    such as direct server return. It does not provide client affinity.

    Azure Load Balancer works at the transport layer, so it identifies
    clients by IP and protocol rather than browser cookies or user identity.
    Visitors sharing a NAT public IP may be mapped to the same backend.
    Affinity does not guarantee staying on a failed server; backend health
    or pool membership changes can affect the mapping.

    Remember: same client across connections = source IP session persistence;
    None = five-tuple connection distribution.

    [Microsoft Learn: Load Balancer distribution modes](https://learn.microsoft.com/en-us/azure/load-balancer/distribution-mode-concepts)
- id: '086'
  skill: Implement and manage virtual networking
  sub-skill: Configure name resolution and load balancing
  question: |
    You have an Azure subscription that uses the public IP addresses
    shown in the following table.

    | Name | IP version | SKU | IP address assignment | Availability zone |
    | --- | --- | --- | --- | --- |
    | IP1 | IPv6 | Basic | Static | Not applicable |
    | IP2 | IPv6 | Basic | Dynamic | Not applicable |
    | IP3 | IPv6 | Standard | Static | Zone-redundant |

    You need to create a public Azure Standard Load Balancer.

    Which public IP addresses can you use?
  choices:
    A: IP1, IP2, and IP3
    B: IP2 only
    C: IP3 only
    D: IP1 and IP3 only
  answer: C
  user_answer: D
  user_result: incorrect
  user_reasoning: |
    Believed static IP assignment was sufficient, so selected both static
    public IP addresses, IP1 and IP3.
  learning_note: |
    Public IP SKU must match the public load balancer SKU. A Basic public
    IP remains incompatible with Standard Load Balancer even if static.
    Standard Load Balancer supports Standard static IPv6 frontend addresses.
  explanation: |
    C — IP3 only is correct. Your supplied answer D is preserved in
    user_answer, but answer is C. Static assignment is not the only
    requirement: a public Standard Load Balancer requires a Standard
    SKU public IP address for its frontend.

    IP1 is static but Basic SKU, so it is incompatible with the Standard
    load balancer. Changing allocation to static does not change the SKU.
    IP2 is also Basic SKU and therefore incompatible.
    IP3 is Standard SKU with static assignment, so it is compatible.
    Its IPv6 version and zone-redundant configuration are supported.

    All alternatives include at least one Basic SKU IP. D is tempting
    because it selects the static addresses, but it overlooks SKU matching.

    This is a legacy scenario: Basic public IPs retired on September 30,
    2025. The question's Basic IPv6 static entry should not be taken as
    guidance for creating current resources; the decisive compatibility
    rule is still Standard public load balancer → Standard public IP.

    Remember: check SKU first, then allocation and IP version;
    static Basic is not Standard.

    [Microsoft Learn: Public IP addresses with Load Balancer](https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/configure-public-ip-load-balancer)
    [Microsoft Learn: Load Balancer SKUs](https://learn.microsoft.com/en-us/azure/load-balancer/skus)
- id: '087'
  skill: Implement and manage virtual networking
  sub-skill: Configure secure access to virtual networks
  question: |
    You have an Azure subscription.

    You are deploying an Azure Kubernetes Service (AKS) cluster that will
    contain multiple pods. The pods will use kubenet networking.

    You need to restrict network traffic between the pods.

    What should you configure on the AKS cluster?
  choices:
    A: the Azure network policy
    B: the Calico network policy
    C: pod security policies
    D: an application security group
  answer: B
  user_answer: C
  user_result: incorrect
  learning_note: |
    Calico supports network policy enforcement with kubenet. Azure Network
    Policy Manager requires Azure CNI. Pod security policies control pod
    security settings, not pod-to-pod traffic; they are also retired.
  explanation: |
    B — the Calico network policy is the intended answer. Your supplied
    answer C is preserved in user_answer, but answer is B. The source
    question's kubernet is normalized to kubenet, the AKS network plugin.

    Kubernetes NetworkPolicy resources specify which pods may communicate
    with selected pods, using pod or namespace selectors and protocol/port
    rules. A supported network policy engine must enforce those rules.
    Calico supports AKS clusters using kubenet, making it the correct choice
    for this question's network model.

    A — the Azure network policy option refers to Azure Network Policy
    Manager, which requires Azure CNI rather than kubenet. The network
    plugin in the question is the decisive compatibility clue.

    C — pod security policies govern pod security settings, such as
    privileged execution and allowed host access. They do not filter network
    traffic between pods. PodSecurityPolicy was removed in Kubernetes 1.25;
    Pod Security Admission and other admission controls address pod security
    in modern clusters, while NetworkPolicy addresses network isolation.

    D — an application security group groups Azure network interfaces for
    use in NSG rules. It is not the Kubernetes mechanism for enforcing
    pod-level traffic rules within this kubenet cluster.

    For isolation, define NetworkPolicy objects as well as enabling the
    engine. Policies can provide default-deny ingress and egress, followed
    by specific allowances for required application and DNS traffic.

    Remember: kubenet plus pod traffic isolation = Calico;
    pod execution privileges = pod security admission controls.

    [Microsoft Learn: Secure AKS pod traffic with network policies](https://learn.microsoft.com/en-us/azure/aks/use-network-policies)
    [Kubernetes: Pod Security Policy removal](https://kubernetes.io/docs/concepts/security/pod-security-policy/)
- id: '088'
  skill: Implement and manage virtual networking
  sub-skill: Configure and manage virtual networks in Azure
  question: |
    HOTSPOT

    You have an Azure subscription that contains a virtual network named
    VNet1. VNet1 uses an IP address space of 10.0.0.0/16 and contains the
    VPN Gateway and subnets in the following table:

    | Name | IP address range |
    | --- | --- |
    | Subnet0 | 10.0.0.0/24 |
    | Subnet1 | 10.0.1.0/24 |
    | Subnet2 | 10.0.2.0/24 |
    | GatewaySubnet | 10.0.254.0/24 |

    Subnet1 contains a virtual appliance named VM1 that operates as a router.

    You create a routing table named RT1.

    You need to route all inbound traffic from the VPN gateway to VNet1
    through VM1.

    How should you configure RT1? To answer, select the appropriate
    options in the answer area.

    NOTE: Each correct selection is worth one point.
  choices:
    Address prefix:
      - 10.0.0.0/16
      - 10.0.1.0/24
      - 10.0.254.0/24
    Next hop type:
      - Virtual appliance
      - Virtual network
      - Virtual network gateway
    Assigned to:
      - GatewaySubnet
      - Subnet0
      - Subnet1 and Subnet2
  answer:
    Address prefix: 10.0.0.0/16
    Next hop type: Virtual appliance
    Assigned to: GatewaySubnet
  user_answer:
    Address prefix: 10.0.0.0/16
    Next hop type: Virtual appliance
    Assigned to: GatewaySubnet
  user_result: correct
  learning_note: |
    A route prefix identifies the destination range, not the source range.
    Associate the route table with GatewaySubnet to steer traffic leaving
    the VPN gateway toward VNet workloads via the appliance's private IP.
  explanation: |
    All three selections are correct: 10.0.0.0/16, Virtual appliance,
    and GatewaySubnet.

    Address prefix is the destination range to match. Traffic arriving
    through the VPN gateway is destined for VNet1, whose address space
    is 10.0.0.0/16. Choosing only Subnet1's /24 would not cover the other
    workload subnets; choosing GatewaySubnet's /24 would match destinations
    in the gateway subnet rather than the intended VNet workloads.

    Virtual appliance forwards matching traffic to VM1. Set the route's
    next hop IP address to VM1's private IP in Subnet1; the question does
    not provide that exact address. Virtual network would use direct VNet
    routing, while Virtual network gateway would not select VM1 as router.

    Assign RT1 to GatewaySubnet because this is where traffic enters the
    VNet from the VPN gateway and is routed onward to the destination.
    Assigning it only to workload subnets would instead affect traffic
    leaving those subnets and would not intercept this gateway-to-workload
    path at its source.

    For matching equal-length prefixes, a user-defined route takes
    precedence over a system route. Enable IP forwarding on VM1's Azure
    NIC and configure the appliance OS to forward packets. More-specific
    routes can take precedence, so verify effective routing in a deployment.

    This is gateway ingress routing, not an instruction to send all gateway
    traffic to VM1 using 0.0.0.0/0. Avoid unsupported GatewaySubnet routes,
    preserve required gateway connectivity and route propagation, and
    configure return paths consistently when using a stateful appliance.

    Remember: destination = VNet range; next hop = appliance;
    gateway ingress steering = route table on GatewaySubnet.

    [Microsoft Learn: Virtual network traffic routing](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-udr-overview)
    [Microsoft Learn: VPN gateway configuration settings](https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-about-vpn-gateway-settings)
- id: '090'
  skill: Implement and manage virtual networking
  sub-skill: Configure secure access to virtual networks
  question: |
    HOTSPOT

    You have an Azure subscription that contains the virtual machines
    shown in the following table:

    | Name | Operating system | Connects to |
    | --- | --- | --- |
    | VM1 | Windows Server 2019 | Subnet1 |
    | VM2 | Windows Server 2019 | Subnet2 |

    VM1 and VM2 use public IP addresses. From Windows Server 2019 on VM1
    and VM2, you allow inbound Remote Desktop connections.

    Subnet1 and Subnet2 are in a virtual network named VNET1.

    The subscription contains two network security groups (NSGs) named
    NSG1 and NSG2. NSG1 uses only the default rules.

    NSG2 uses the default rules and the following custom incoming rule:

    - Priority: 100
    - Name: Rule1
    - Port: 3389
    - Protocol: TCP
    - Source: Any
    - Destination: Any
    - Action: Allow

    NSG1 is associated to Subnet1. NSG2 is associated to the network
    interface of VM2.

    For each of the following statements, select Yes if the statement
    is true. Otherwise, select No.

    NOTE: Each correct selection is worth one point.
  choices:
    From the Internet, you can connect to VM1 by using Remote Desktop.:
      - 'Yes'
      - 'No'
    From the Internet, you can connect to VM2 by using Remote Desktop.:
      - 'Yes'
      - 'No'
    From VM1, you can connect to VM2 by using Remote Desktop.:
      - 'Yes'
      - 'No'
  answer:
    From the Internet, you can connect to VM1 by using Remote Desktop.: 'No'
    From the Internet, you can connect to VM2 by using Remote Desktop.: 'Yes'
    From VM1, you can connect to VM2 by using Remote Desktop.: 'Yes'
  user_answer:
    From the Internet, you can connect to VM1 by using Remote Desktop.: 'No'
    From the Internet, you can connect to VM2 by using Remote Desktop.: 'Yes'
    From VM1, you can connect to VM2 by using Remote Desktop.: 'Yes'
  user_result: correct
  user_reasoning: |
    VM2's RDP port and traffic are allowed. Default NSG rules allow virtual
    network traffic, permitting VM1-to-VM2 RDP.
  learning_note: |
    A public IP and guest firewall allowance do not override an NSG deny.
    Default NSGs allow VNet traffic but deny unsolicited internet ingress.
    Check source outbound and destination inbound rules for private VM traffic.
  explanation: |
    No, Yes, Yes is correct, and your reasoning is sound.

    Internet to VM1: No. NSG1 has only default rules. Internet RDP matches
    neither AllowVnetInBound nor AllowAzureLoadBalancerInBound, so it reaches
    DenyAllInBound at priority 65500. VM1's public IP and Windows RDP
    allowance do not override this subnet-level NSG decision.

    Internet to VM2: Yes. NSG2's Rule1 allows TCP destination port 3389
    from Any at priority 100, before the default inbound deny. VM2 has
    a public IP and its Windows configuration permits inbound RDP.
    No additional Subnet2 NSG is specified.

    VM1 to VM2: Yes, using VM2's private IP in VNET1. NSG1's default
    AllowVnetOutBound permits the request leaving VM1. At VM2, NSG2's
    custom RDP allow permits it; the default AllowVnetInBound would also
    permit this VNet traffic if Rule1 were absent. Both guest systems
    are configured to allow inbound Remote Desktop as stated.

    This is a useful distinction: your default-VNet-rule reasoning explains
    the third result, but VM2's priority-100 rule is the first inbound match.
    NSGs are stateful, so corresponding response traffic is allowed.

    Remember: public IP provides an endpoint, not permission;
    guest firewall and every applicable NSG must allow the connection.

    [Microsoft Learn: Default NSG rules](https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview)
    [Microsoft Learn: NSG traffic evaluation](https://learn.microsoft.com/en-us/azure/virtual-network/network-security-group-how-it-works)
- id: '091'
  skill: Implement and manage virtual networking
  sub-skill: Configure name resolution and load balancing
  question: |
    You have an Azure subscription that contains two virtual machines
    named VM1 and VM2.

    You create an Azure load balancer.

    You plan to create a load balancing rule that will load balance HTTPS
    traffic between VM1 and VM2.

    Which two additional load balancer resources should you create before
    you can create the load balancing rule? Each correct answer presents
    part of the solution.

    NOTE: Each correct selection is worth one point.
  choices:
    A: a frontend IP address
    B: an inbound NAT rule
    C: a virtual network
    D: a backend pool
    E: a health probe
  answer: DE
  user_answer: AD
  user_result: partially_correct
  learning_note: |
    A load balancing rule references a frontend configuration, backend pool,
    and health probe. This question assumes the frontend was configured
    when the load balancer was created; the additional resources are the
    backend pool and health probe.
  explanation: |
    D and E — a backend pool and a health probe — are the intended answers.
    Your backend pool selection is correct. Replace A with E for this
    question's assumed creation workflow.

    The backend pool identifies VM1 and VM2 as the targets for distributed
    connections. A health probe checks which backends can receive new
    traffic. Create both, then create a rule referencing the pool and probe,
    normally mapping frontend TCP 443 to backend TCP 443 for HTTPS.

    A frontend IP configuration is also required for the rule: it is the
    endpoint clients connect to. The exam assumes this already exists as
    part of creating the load balancer. The wording does not explicitly
    state that assumption. If the load balancer was created without a
    frontend, you would also need to create one; A is a real prerequisite,
    but DE is the intended pair of additional resources in this workflow.

    B — An inbound NAT rule maps traffic to an individual backend instance,
    for example for RDP. It is not required to distribute HTTPS traffic
    across the backend pool.

    C — A virtual network is not an additional load balancer child resource.
    The existing VMs already have networking; creating another VNet does
    not supply the backend pool or probe needed by the rule.

    Azure Load Balancer forwards TCP connections rather than terminating
    TLS. Configure HTTPS on the backend applications and permit client
    traffic and health probes through the relevant security rules.

    Remember: frontend = entry point; backend pool = targets;
    health probe = healthy targets; rule = connects these components.

    [Microsoft Learn: Load Balancer components](https://learn.microsoft.com/en-us/azure/load-balancer/components)
    [Microsoft Learn: Create a public load balancer](https://learn.microsoft.com/en-us/azure/load-balancer/quickstart-load-balancer-standard-public-portal)
- id: '092'
  skill: Implement and manage virtual networking
  sub-skill: Configure and manage virtual networks in Azure
  question: |
    You have an on-premises network that contains a database server
    named dbserver1.

    You have an Azure subscription.

    You plan to deploy three Azure virtual machines. Each virtual machine
    will be deployed to a separate availability zone.

    You need to configure an Azure VPN gateway for a site-to-site VPN.
    The solution must ensure that the virtual machines can connect to dbserver1.

    Which type of public IP address SKU and assignment should you use
    for the gateway?
  choices:
    A: a basic SKU and a static IP address assignment
    B: a standard SKU and a static IP address assignment
    C: a basic SKU and a dynamic IP address assignment
  answer: B
  user_answer: B
  user_result: correct
  learning_note: |
    Use a Standard SKU public IP with static assignment for current VPN
    gateway deployments, including zonal or zone-redundant gateways.
    VM zone placement alone does not require a zone-redundant VPN gateway.
  explanation: |
    B — a standard SKU and a static IP address assignment is correct.
    Standard public IP addresses use static allocation and support
    availability zone configurations. They are the supported choice
    for current VPN gateway public IP deployment, including gateways
    using availability zones.

    The gateway's public IP is the VPN endpoint used by the on-premises
    VPN device. After the site-to-site tunnel and routes are configured,
    Azure VMs reach dbserver1 through the gateway using private network
    connectivity; each VM does not need a public IP for that access.

    A and C specify Basic public IPs rather than the Standard public IP
    needed for the intended zonal gateway configuration. C also reflects
    the historical dynamic allocation used by legacy VPN gateways, not
    the current Standard static configuration.

    Placing the three VMs in separate zones does not itself require the
    gateway to be zone-redundant for basic reachability. A single properly
    configured gateway can serve VMs across zones in its virtual network.
    Gateway zone redundancy is a separate availability choice. Standard
    static remains the correct offered public IP configuration.

    Public IP SKU is separate from the VPN gateway SKU, such as VpnGw1AZ.
    Connectivity also requires appropriate gateway, local network gateway,
    connection, address ranges, routing, and firewall configuration.

    Remember: VPN gateway public endpoint = Standard public IP + Static;
    VM zone placement and gateway zone redundancy are separate decisions.

    [Microsoft Learn: VPN gateway configuration settings](https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-about-vpn-gateway-settings)
    [Microsoft Learn: Zone-redundant VPN gateways](https://learn.microsoft.com/en-us/azure/vpn-gateway/about-zone-redundant-vnet-gateways)
