  user_answer: AC
  user_result: correct
  learning_note: |
    Availability Zone deployment requires managed disks and an Availability
    zone selection. Standard HDD versus SSD is a disk performance tier;
    it is separate from managed versus unmanaged disks.
  explanation: |
    **A and C** are correct.

    Change Use managed disks from No to Yes. The planned unmanaged OS
