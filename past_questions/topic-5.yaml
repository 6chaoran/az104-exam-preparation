- id: '001'
  skill: Implement and manage virtual networking
  sub-skill: Configure name resolution and load balancing
  question: |
    HOTSPOT

    You have an Azure subscription named Sub1.

    You plan to deploy a multi-tiered application that will contain the tiers
    shown in the following table.

    | Tier | Accessible from the Internet | Number of virtual machines |
    | --- | --- | --- |
    | Front-end web server | Yes | 10 |
    | Business logic | No | 100 |
    | Microsoft SQL Server database | No | 5 |

    You need to recommend a networking solution to meet the following requirements:

    - Ensure that communication between the web servers and the business logic tier spreads equally across the virtual machines.
    - Protect the web servers from SQL injection attacks.

    Which Azure resource should you recommend for each requirement? To answer,
    select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  choices:
    Ensure that communication between the web servers and the business logic tier spreads equally across the virtual machines:
      - an application gateway that uses the Standard tier
      - an application gateway that uses the WAF tier
      - an internal load balancer
      - a network security group (NSG)
      - a public load balancer
    Protect the web servers from SQL injection attacks:
      - an application gateway that uses the Standard tier
      - an application gateway that uses the WAF tier
      - an internal load balancer
      - a network security group (NSG)
      - a public load balancer
  answer:
    Ensure that communication between the web servers and the business logic tier spreads equally across the virtual machines: an internal load balancer
    Protect the web servers from SQL injection attacks: an application gateway that uses the WAF tier
  user_answer:
    Ensure that communication between the web servers and the business logic tier spreads equally across the virtual machines: an internal load balancer
    Protect the web servers from SQL injection attacks: an application gateway that uses the WAF tier
  user_result: correct
  learning_note: |
    Use an internal load balancer to distribute private traffic between tiers.
    Use Application Gateway with Web Application Firewall (WAF) to protect
    web applications from SQL injection. NSGs filter network traffic but do
    not inspect web requests for SQL injection.
  explanation: |
    **Internal load balancer; Application Gateway with the WAF tier** is correct.

    The business logic tier must remain private. An internal load balancer
    provides a private frontend and distributes traffic from the web servers
    across healthy business logic VMs. The question uses "equally" to mean
    load distribution, rather than a guarantee of identical work on every VM.

    Application Gateway with WAF inspects web requests for attacks such as
    SQL injection. Use a WAF policy with the relevant rules and prevention
    mode to block malicious requests before they reach the web servers.

    Application Gateway with the Standard tier does not include WAF protection.
    Application Gateway can balance web traffic, but the first requirement
    specifies private inter-tier traffic without requiring HTTP-specific routing.
    An internal load balancer is the intended choice for that requirement.
    A public load balancer provides an internet-facing frontend, which is
    inappropriate for the private business logic tier. Neither internal nor
    public Azure Load Balancer inspects HTTP payloads for SQL injection.
    An NSG allows or denies network traffic; it does not distribute requests
    across VMs or provide SQL injection inspection.

    Remember: private tier distribution = internal load balancer;
    web attack protection = Application Gateway with WAF.

    [Microsoft Learn: Azure Load Balancer overview](https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-overview)
    [Microsoft Learn: WAF on Application Gateway](https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/ag-overview)
- id: '002'
  skill: Implement and manage virtual networking
  sub-skill: Configure and manage virtual networks in Azure
  question: |
    Your company has three offices. The offices are located in Miami,
    Los Angeles, and New York. Each office contains a datacenter.

    You have an Azure subscription that contains resources in the East US
    and West US Azure regions. Each region contains a virtual network.
    The virtual networks are peered.

    You need to connect the datacenters to the subscription. The solution
    must minimize network latency between the datacenters.

    What should you create?
  choices:
    A: three Azure Application Gateways and one On-premises data gateway
    B: three virtual hubs and one virtual WAN
    C: three virtual WANs and one virtual hub
    D: three On-premises data gateways and one Azure Application Gateway
  answer: B
  user_answer: D
  user_result: incorrect
  learning_note: |
    Azure Virtual WAN connects branch networks and Azure virtual networks
    through virtual hubs. An on-premises data gateway connects cloud services
    to local data sources; it is not a site-to-site networking gateway.
    Application Gateway balances web traffic rather than connecting datacenters.
  explanation: |
    **B — three virtual hubs and one virtual WAN** is the intended answer.
    Your supplied answer D is preserved in user_answer, but answer is B
    based on the documented roles of these services.

    A Standard virtual WAN provides a shared transit network. Its virtual
    hubs interconnect over Microsoft's backbone, allowing connected branches
    and Azure virtual networks to communicate. Connect the datacenters to
    suitably located hubs using site-to-site VPN or ExpressRoute, and connect
    the Azure virtual networks to hubs. Regional entry points and backbone
    transit support the latency requirement.

    The three-hub count is part of the intended exam option, not a universal
    rule that every office requires its own hub. Hubs are deployed in Azure
    regions, not inside the offices. In practice, choose hub locations and
    counts using measured connectivity and latency; several offices can
    share a hub. The two existing resource regions do not prohibit creating
    a hub in another suitable region.

    **A and D** use services that do not provide the required network transit.
    An on-premises data gateway lets services such as Power BI and Logic Apps
    access local data sources. Application Gateway routes and balances web
    requests. Neither provides general datacenter-to-datacenter connectivity.

    **C** reverses the resource relationship: multiple hubs belong to one
    virtual WAN. A hub belongs to a single virtual WAN; one hub is not shared
    across three virtual WANs to form the required transit network.

    Existing VNet peering connects the Azure virtual networks, but does not
    by itself connect the on-premises datacenters.

    Remember: Virtual WAN = network connectivity; on-premises data gateway =
    access to data sources; Application Gateway = web traffic routing.

    [Microsoft Learn: Azure Virtual WAN overview](https://learn.microsoft.com/en-us/azure/virtual-wan/virtual-wan-about)
    [Microsoft Learn: On-premises data gateway](https://learn.microsoft.com/en-us/data-integration/gateway/service-gateway-onprem)
    [Microsoft Learn: Application Gateway overview](https://learn.microsoft.com/en-us/azure/application-gateway/overview)
- id: '003'
  skill: Implement and manage virtual networking
  sub-skill: Configure secure access to virtual networks
  question: |
    HOTSPOT

    You plan to deploy five virtual machines to a virtual network subnet.

    Each virtual machine will have a public IP address and a private IP address.

    Each virtual machine requires the same inbound and outbound security rules.

    What is the minimum number of network interfaces and network security
    groups that you require? To answer, select the appropriate options in
    the answer area.

    NOTE: Each correct selection is worth one point.
  choices:
    Minimum number of network interfaces:
      - '5'
      - '10'
      - '15'
      - '20'
    Minimum number of network security groups:
      - '1'
      - '2'
      - '5'
      - '10'
  answer:
    Minimum number of network interfaces: '5'
    Minimum number of network security groups: '1'
  user_answer:
    Minimum number of network interfaces: '5'
    Minimum number of network security groups: '1'
  user_result: correct
  learning_note: |
    One NIC per VM can support both a private IP address and an associated
    public IP address. One subnet-level NSG can apply the same inbound and
    outbound rules to all five VMs.
  explanation: |
    **5 network interfaces and 1 network security group** is correct.

    Each VM requires at least one network interface (NIC), and a NIC cannot
    be shared by multiple VMs simultaneously. Therefore, five VMs require
    at least five NICs. A NIC's IP configuration can contain a private IP
    address and an association to a public IP address resource. Having both
    address types does not require two NICs per VM. The options 10, 15, and
    20 therefore exceed the minimum.

    A network security group (NSG) contains both inbound and outbound rules.
    Associate one NSG with the shared subnet to apply the required rules to
    all five VMs. Alternatively, the same NSG can be associated with each
    VM's NIC; that still requires only one NSG resource. There is no need
    to create separate NSGs per VM, per IP address, or per traffic direction.
    The options 2, 5, and 10 therefore exceed the minimum.

    Remember: count NICs per VM, not per IP address; share an NSG when the
    security rules are the same.

    [Microsoft Learn: Network interfaces](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-network-interface)
    [Microsoft Learn: NIC IP configurations](https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/virtual-network-network-interface-addresses)
    [Microsoft Learn: How NSGs filter traffic](https://learn.microsoft.com/en-us/azure/virtual-network/network-security-group-how-it-works)
- id: '004'
  skill: Implement and manage virtual networking
  sub-skill: Configure name resolution and load balancing
  question: |
    You have an Azure subscription that contains the resources shown in the following table.

    | Name | Type |
    | --- | --- |
    | LB1 | Load balancer |
    | VM1 | Virtual machine |
    | VM2 | Virtual machine |

    LB1 is configured as shown in the following table.

    | Name | Type | Value |
    | --- | --- | --- |
    | bepool1 | Backend pool | VM1, VM2 |
    | LoadBalancerFrontEnd | Frontend IP configuration | Public IP address |
    | hprobe1 | Health probe | Protocol: TCP; Port: 80; Interval: 5 seconds; Unhealthy threshold: 2 |
    | rule1 | Load balancing rule | IP version: IPv4; Frontend IP address: LoadBalancerFrontEnd; Port: 80; Backend Port: 80; Backend pool: bepool1; Health probe: hprobe1 |

    You plan to create new inbound NAT rules that meet the following requirements:

    - Provide Remote Desktop access to VM1 from the internet by using port 3389.
    - Provide Remote Desktop access to VM2 from the internet by using port 3389.

    What should you create on LB1 before you can create the new inbound NAT rules?
  choices:
    A: a frontend IP address
    B: a load balancing rule
    C: a health probe
    D: a backend pool
  answer: A
  user_answer: B
  user_result: incorrect
  learning_note: |
    Inbound NAT rules provide access to a specific VM using a frontend IP
    address and port. To reach two separate VMs using the same external TCP
    port, use different frontend IP addresses. A load balancing rule
    distributes connections rather than selecting a particular VM.
  explanation: |
    **A — a frontend IP address** is correct. Your supplied answer B is
    preserved in user_answer, but answer is A based on inbound NAT behavior.

    The intended reading is that clients must use external port 3389 for
    each VM. LB1 currently has one public frontend IP configuration. Two
    separate per-VM NAT mappings cannot use the same frontend IP address,
    TCP protocol, and frontend port to select different VMs. Add a second
    public frontend IP configuration, then create these mappings:

    | Internet endpoint | Destination |
    | --- | --- |
    | Existing frontend public IP:3389 | VM1 private IP:3389 |
    | New frontend public IP:3389 | VM2 private IP:3389 |

    **B — a load balancing rule** distributes traffic across backend VMs.
    It does not provide the required ability to select VM1 or VM2 for an
    RDP session and is not a prerequisite for inbound NAT rules.

    **C — a health probe** checks backend availability. Inbound NAT rules
    do not require a health probe.

    **D — a backend pool** is unnecessary: bepool1 already contains VM1 and
    VM2. Another pool would not resolve the frontend IP and port conflict.

    The existing port 80 load balancing rule does not consume port 3389;
    the conflict would be between the two proposed RDP mappings.

    If port 3389 meant only the backend port, different external ports
    could share the existing frontend IP, for example port 50001 to
    VM1:3389 and port 50002 to VM2:3389. The exam's expected answer assumes
    port 3389 is required on the internet-facing side for both VMs.

    Remember: same external port plus separate VM access requires different
    frontend IP addresses; different external ports can share one frontend.

    [Microsoft Learn: Inbound NAT rules](https://learn.microsoft.com/en-us/azure/load-balancer/inbound-nat-rules)
- id: '005'
  skill: Implement and manage virtual networking
  sub-skill: Configure name resolution and load balancing
  question: |
    HOTSPOT

    You have Azure virtual machines that run Windows Server 2019 and are
    configured as shown in the following table.

    | Name | Private IP address | Public IP address | Virtual network name | DNS suffix configured in Windows Server |
    | --- | --- | --- | --- | --- |
    | VM1 | 10.1.0.4 | 52.186.85.63 | VNET1 | Adatum.com |
    | VM2 | 10.1.0.5 | 13.92.168.13 | VNET1 | Contoso.com |

    You create a private Azure DNS zone named adatum.com. You configure the
    adatum.com zone to allow auto registration from VNET1.

    Which A records will be added to the adatum.com zone for each virtual
    machine? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  choices:
    A records for VM1:
      - None
      - Private IP address only
      - Public IP address only
      - Private IP address and public IP address
    A records for VM2:
      - None
      - Private IP address only
      - Public IP address only
      - Private IP address and public IP address
  answer:
    A records for VM1: Private IP address only
    A records for VM2: Private IP address only
  user_answer:
    A records for VM1: Private IP address and public IP address
    A records for VM2: Public IP address only
  user_result: incorrect
  learning_note: |
    Azure Private DNS autoregistration registers VM private IP addresses,
    not public IP addresses. The registration-enabled virtual network link
    determines the zone. Azure ignores the DNS suffix configured inside
    Windows when performing this registration.
  explanation: |
    **VM1: Private IP address only; VM2: Private IP address only** is correct.
    Both supplied selections are preserved in user_answer and corrected
    in answer.

    Both VMs belong to VNET1, which is linked to adatum.com with
    autoregistration enabled. Azure automatically creates these A records:

    | Record | IPv4 address |
    | --- | --- |
    | vm1.adatum.com | 10.1.0.4 |
    | vm2.adatum.com | 10.1.0.5 |

    Autoregistration uses the VM's private IP address. Neither VM's public
    IP address is automatically added, so both options containing a public
    IP address are incorrect.

    The Windows DNS suffix is a distractor. Azure's DHCP service performs
    this registration and ignores the guest operating system's DNS suffix.
    VM2 therefore registers in adatum.com even though its Windows suffix
    is Contoso.com. The matching suffix on VM1 does not cause its public
    address to be registered. None is incorrect for both VMs because both
    are in the registration-enabled virtual network.

    This is a rule about automatic registration, not a restriction that
    private DNS zones can never contain manually created public-IP A records.

    Remember: the VNet link determines the registration zone; autoregistration
    records private IP addresses; the Windows DNS suffix does not decide it.

    [Microsoft Learn: Private DNS autoregistration](https://learn.microsoft.com/en-us/azure/dns/private-dns-autoregistration)
    [Microsoft Learn: Private DNS overview](https://learn.microsoft.com/en-us/azure/dns/private-dns-overview)
    [Microsoft Learn: Private DNS FAQ and Windows DNS suffixes](https://learn.microsoft.com/en-us/azure/dns/dns-faq-private)
- id: '006'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  question: |
    HOTSPOT

    You have an Azure virtual network named VNet1 that connects to your
    on-premises network by using a site-to-site VPN. VNet1 contains one
    subnet named Subnet1.

    Subnet1 is associated to a network security group (NSG) named NSG1.
    Subnet1 contains a basic internal load balancer named ILB1. ILB1 has
    three Azure virtual machines in the backend pool.

    You need to collect data about the IP addresses that connect to ILB1.
    You must be able to run interactive queries from the Azure portal
    against the collected data.

    What should you do? To answer, select the appropriate options in the
    answer area.

    NOTE: Each correct selection is worth one point.
  choices:
    Resource to create:
      - An Azure Event Grid
      - An Azure Log Analytics workspace
      - An Azure Storage account
    Resource on which to enable diagnostics:
      - ILB1
      - NSG1
      - The Azure virtual machines
  answer:
    Resource to create: An Azure Log Analytics workspace
    Resource on which to enable diagnostics: NSG1
  user_answer:
    Resource to create: An Azure Log Analytics workspace
    Resource on which to enable diagnostics: ILB1
  user_result: partially_correct
  learning_note: |
    Log Analytics provides interactive log queries. For this legacy question,
    NSG flow logging captures the network conversation metadata needed to
    identify client IP addresses, rather than load balancer diagnostics.
    For new deployments, use virtual network flow logs with Traffic Analytics.
  explanation: |
    **An Azure Log Analytics workspace; NSG1** is the expected answer.
    Your workspace selection is correct. Your ILB1 selection is preserved
    in user_answer but corrected to NSG1 in answer.

    NSG flow logs capture source and destination IP addresses, ports,
    protocols, and allow/deny decisions for traffic evaluated by NSG1.
    NSG1 is associated with the backend VMs' subnet, making it the intended
    network logging resource in this question. Correlate flows with the
    backend VM addresses and service ports; do not assume every flow record
    uses the load balancer frontend IP as its destination after translation.

    Log Analytics provides interactive queries using Kusto Query Language
    (KQL) in the Azure portal. In the legacy flow-log architecture, Network
    Watcher writes raw NSG flow logs to a storage account, and Traffic
    Analytics processes them into a Log Analytics workspace. Ordinary NSG
    diagnostic settings alone are not equivalent to enabling flow logs.
    The answer choices abbreviate this complete collection pipeline.

    A storage account is part of that pipeline, but storing logs alone does
    not satisfy the interactive Log Analytics query requirement. Event Grid
    routes events rather than providing a queryable log repository.
    ILB1 diagnostics do not supply the required per-client connection log.
    VM diagnostics would require additional guest-level collection rather
    than the intended network flow logging across the subnet.

    This is a legacy scenario. Basic Load Balancer retired on September 30,
    2025. Creating new NSG flow logs has been unavailable since June 30,
    2025, and existing NSG flow logs retire on September 30, 2027. For a
    new deployment, use Standard Load Balancer and virtual network flow
    logs with Traffic Analytics and a Log Analytics workspace. NSG1 remains
    the intended answer among the historical options given here.

    The exhibit initially spells the subnet name Sunet1, then uses Subnet1;
    the question text normalizes the apparent typo to Subnet1. It also omits
    the dedicated GatewaySubnet required for an Azure VPN gateway; treat
    Subnet1 as the workload subnet. This does not change the logging answer.

    Remember: flow logs identify network conversations; Log Analytics
    lets you query them.

    [Microsoft Learn: Traffic Analytics](https://learn.microsoft.com/en-us/azure/network-watcher/traffic-analytics)
    [Microsoft Learn: NSG flow logs and retirement](https://learn.microsoft.com/en-us/azure/network-watcher/nsg-flow-logs-overview)
    [Microsoft Learn: Load Balancer diagnostics limitations](https://learn.microsoft.com/en-us/troubleshoot/azure/load-balancer/troubleshoot-load-balancer-platform-limitations)
    [Microsoft Learn: Load Balancer overview](https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-overview)
- id: '007'
  skill: Implement and manage virtual networking
  sub-skill: Configure and manage virtual networks in Azure
  question: |
    You have the Azure virtual networks shown in the following table.

    | Name | Address space | Subnet | Resource group Azure region |
    | --- | --- | --- | --- |
    | VNet1 | 10.11.0.0/16 | 10.11.0.0/17 | West US |
    | VNet2 | 10.11.0.0/17 | 10.11.0.0/25 | West US |
    | VNet3 | 10.10.0.0/22 | 10.10.1.0/24 | East US |
    | VNet4 | 192.168.16.0/22 | 192.168.16.0/24 | North Europe |

    To which virtual networks can you establish a peering connection from VNet1?
  choices:
    A: VNet2 and VNet3 only
    B: VNet2 only
    C: VNet3 and VNet4 only
    D: VNet2, VNet3, and VNet4
  answer: C
  user_answer: C
  user_result: correct
  learning_note: |
    Compare complete VNet address spaces when checking peering eligibility.
    Different CIDR prefix lengths can still overlap: 10.11.0.0/17 is inside
    10.11.0.0/16. Different Azure regions are supported by global VNet peering.
  explanation: |
    **C — VNet3 and VNet4 only** is correct.

    VNet peering requires nonoverlapping address spaces. VNet1's address
    space, 10.11.0.0/16, spans 10.11.0.0 through 10.11.255.255.

    | Network | Full address range | Can peer with VNet1? |
    | --- | --- | --- |
    | VNet2 | 10.11.0.0–10.11.127.255 | No: entirely inside VNet1's range |
    | VNet3 | 10.10.0.0–10.10.3.255 | Yes: no overlap |
    | VNet4 | 192.168.16.0–192.168.19.255 | Yes: no overlap |

    VNet2's /17 prefix does not make its range separate from VNet1's /16.
    Both include the same addresses in the lower half of 10.11.0.0/16.
    Being in the same region does not remove this conflict.

    Peering can connect VNets in different Azure regions through global
    VNet peering, so the East US and North Europe entries do not exclude
    VNet3 or VNet4. The exhibit labels the column Resource group Azure
    region; a resource group's location does not constrain peering either.

    A, B, and D are incorrect because each includes VNet2. Evaluate the
    full VNet address spaces, not just their currently configured subnets.

    Remember: overlapping address spaces block ordinary VNet peering;
    different regions do not.

    [Microsoft Learn: VNet peering requirements](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-manage-peering)
    [Microsoft Learn: VNet peering overview](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-peering-overview)
- id: '008'
  skill: Implement and manage virtual networking
  sub-skill: Configure name resolution and load balancing
  question: |
    You have an Azure subscription that contains a virtual network named
    VNet1. VNet1 contains four subnets named Gateway, Perimeter, NVA, and
    Production.

    The NVA subnet contains two network virtual appliances (NVAs) that will
    perform network traffic inspection between the Perimeter subnet and
    the Production subnet.

    You need to implement an Azure load balancer for the NVAs. The solution
    must meet the following requirements:

    - The NVAs must run in an active-active configuration that uses automatic failover.
    - The load balancer must load balance traffic to two services on the Production subnet. The services have different IP addresses.

    Which three actions should you perform? Each correct answer presents
    part of the solution.

    NOTE: Each correct selection is worth one point.
  choices:
    A: Deploy a basic load balancer
    B: Deploy a standard load balancer
    C: Add two load balancing rules that have HA Ports and Floating IP enabled
    D: Add two load balancing rules that have HA Ports enabled and Floating IP disabled
    E: Add a frontend IP configuration, a backend pool, and a health probe
    F: Add a frontend IP configuration, two backend pools, and a health probe
  answer: BCE
  user_answer: BCF
  user_result: partially_correct
  learning_note: |
    The NVA load balancer's backend pool contains the inspection appliances,
    not one separate pool per downstream service. Both active NVAs can share
    one pool. Multiple HA Ports rules for that pool require Floating IP and
    distinct frontend IP configurations. The listed options omit the second
    frontend configuration required for the proposed two-rule design.
  explanation: |
    **B, C, E** is the intended answer. B and C in your answer are correct;
    replace F with E. Your original BCF selection is preserved in user_answer.

    B selects an internal Standard Load Balancer, which supports HA Ports.
    C selects the floating HA Ports configuration needed for multiple rules
    sharing the same backend pool. E supplies one pool containing both NVAs
    and a health probe to detect unhealthy appliances.

    F confuses the two downstream services with the load balancer's targets:
    the targets here are the two inspection appliances. Separate service IP
    addresses do not require separate NVA pools. A lacks HA Ports support;
    D does not support the proposed multiple-rule design for the same NVAs.

    There is a wording gap: E specifies only one frontend IP configuration.
    Each of C's two HA Ports rules needs a distinct private frontend IP,
    so the complete design needs two frontend configurations sharing the
    NVA pool, with Floating IP enabled on both rules. BCE is the best intended
    selection, rather than a complete literal deployment recipe.

    In deployment, routing, IP forwarding, and appliance configuration must
    also direct traffic through the NVAs. Health-probe failover does not
    itself synchronize appliance session state or guarantee that established
    sessions survive. Validate return-path symmetry with the NVA vendor,
    particularly when using multiple frontends.

    Remember: count backend pools by the traffic-processing target group,
    not by the number of downstream service IP addresses.

    [Microsoft Learn: HA Ports configurations and limitations](https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-ha-ports-overview)
- id: '009'
  skill: Implement and manage virtual networking
  sub-skill: Configure and manage virtual networks in Azure
  question: |
    You have an Azure subscription named Subscription1 that contains two
    Azure virtual networks named VNet1 and VNet2. VNet1 contains a VPN
    gateway named VPNGW1 that uses static routing. There is a site-to-site
    VPN connection between your on-premises network and VNet1.

    On a computer named Client1 that runs Windows 10, you configure a
    point-to-site VPN connection to VNet1.

    You configure virtual network peering between VNet1 and VNet2. You
    verify that you can connect to VNet2 from the on-premises network.
    Client1 is unable to connect to VNet2.

    You need to ensure that you can connect Client1 to VNet2.

    What should you do?
  choices:
    A: Download and re-install the VPN client configuration package on Client1.
    B: Select Allow gateway transit on VNet1.
    C: Select Allow gateway transit on VNet2.
    D: Enable BGP on VPNGW1
  answer: A
  user_answer: A
  user_result: correct
  learning_note: |
    After adding VNet peering, refresh the Windows point-to-site VPN client
    configuration so the client has the new network routes. Distinguish
    missing client routes from gateway transit configuration. A policy-based
    gateway, historically called static routing, does not support P2S.
  explanation: |
    **A — Download and re-install the VPN client configuration package on
    Client1** is the intended answer.

    Client1 was configured before VNet2 was peered with VNet1. Downloading
    and installing an updated package refreshes the routes available to
    the Windows VPN client. Reconnect after applying the configuration.

    B is not the intended fix: successful on-premises access to VNet2
    indicates the gateway transit path already works in this scenario.
    C selects the wrong direction for gateway sharing: VNet1 hosts the
    gateway and allows transit; VNet2 uses the remote gateway.
    D does not address the stale Windows VPN configuration. BGP is not
    required for this client to reach a directly peered VNet.

    The scenario has an inconsistency. In Azure's historical terminology,
    a static-routing VPN gateway is policy-based, and policy-based gateways
    do not support point-to-site VPN connections. A is correct under the
    intended assumption that VPNGW1 is a P2S-capable route-based gateway,
    potentially using manually configured routes rather than BGP. If the
    gateway is literally policy-based, a gateway change is also required
    and none of the offered answers alone makes the scenario valid.

    Remember: peering added after Windows P2S setup means refresh the
    client configuration; route-based does not necessarily mean BGP enabled.

    [Microsoft Learn: Troubleshoot P2S connections and peered VNet access](https://learn.microsoft.com/en-us/troubleshoot/azure/vpn-gateway/vpn-gateway-troubleshoot-vpn-point-to-site-connection-problems)
    [Microsoft Learn: VPN Gateway FAQ and P2S gateway support](https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-vpn-faq)
