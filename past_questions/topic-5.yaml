- id: '095'
  skill: Implement and manage virtual networking
  sub-skill: Configure and manage virtual networks in Azure
  question: |
    You have an on-premises datacenter and an Azure subscription.
    You plan to connect the datacenter to Azure by using ExpressRoute.
    You need to deploy an ExpressRoute gateway. The solution must meet the following requirements:
    - Support up to 10 Gbps of traffic.
    - Support availability zones.
    - Support FastPath.
    - Minimize costs.

    Which SKU should you deploy?
  choices:
    A: ERGw1AZ
    B: ERGw2
    C: ErGw3
    D: ErGw3AZ
  answer: D
  user_answer: D
  user_result: correct
  explanation: |
    D, ErGw3AZ, is the only listed option that meets all requirements.
    Microsoft lists ErGw3AZ with 10,000 Mbps (10 Gbps) gateway throughput
    and FastPath support. Its AZ SKU supports availability-zone deployment.
    Lower-cost options that fail mandatory requirements cannot be selected.

    A, ERGw1AZ, supports availability zones but provides 1 Gbps gateway
    throughput and does not support FastPath.
    B, ERGw2, lacks the AZ designation and represents the lower performance
    tier; even the zone-enabled ErGw2AZ tier provides 2 Gbps and lacks FastPath.
    C, ErGw3, lacks the AZ designation and therefore does not satisfy the
    availability-zone requirement. B and C use abbreviated non-AZ tier names
    in the question; current documentation calls the non-AZ tiers
    HighPerformance and UltraPerformance.

    FastPath bypasses the gateway for supported data traffic, while the
    gateway remains necessary for route exchange. The throughput figures
    are published gateway limits, rather than guarantees for every workload.
    Current documentation also lists ErGwScale with FastPath support at
    a minimum of 10 scale units, but it is not an offered answer. This
    question establishes the eligible option among the choices, not a
    universal current pricing comparison.

    Exam takeaway: ErGw3AZ combines the 10 Gbps tier, availability zones,
    and FastPath. Gateway capabilities and circuit bandwidth are separate.

    Taxonomy note: ExpressRoute gateway SKU selection is not explicitly
    listed in the repository's sub-skills; virtual network configuration
    is the closest existing category.

    [Microsoft Learn: ExpressRoute virtual network gateways](https://learn.microsoft.com/en-us/azure/expressroute/expressroute-about-virtual-network-gateways)
    [Microsoft Learn: ExpressRoute FastPath](https://learn.microsoft.com/en-us/azure/expressroute/about-fastpath)

- id: '096'
  skill: Implement and manage virtual networking
  sub-skill: Configure secure access to virtual networks
  question: |
    HOTSPOT

    You have a virtual network named VNET1 that contains the subnets shown in the following table:

    | Name | Subnet | Network security group (NSG) |
    | --- | --- | --- |
    | Subnet1 | 10.10.1.0/24 | NSG1 |
    | Subnet2 | 10.10.2.0/24 | None |

    You have Azure virtual machines that have the network configurations shown in the following table:

    | Name | Subnet | IP address | NSG |
    | --- | --- | --- | --- |
    | VM1 | Subnet1 | 10.10.1.5 | NSG2 |
    | VM2 | Subnet2 | 10.10.2.5 | None |
    | VM3 | Subnet2 | 10.10.2.6 | None |

    For NSG1, you create the inbound security rule shown in the following table:

    | Priority | Source | Destination | Destination port | Action |
    | --- | --- | --- | --- | --- |
    | 101 | 10.10.2.0/24 | 10.10.1.0/24 | TCP/1433 | Allow |

    For NSG2, you create the inbound security rule shown in the following table:

    | Priority | Source | Destination | Destination port | Action |
    | --- | --- | --- | --- | --- |
    | 125 | 10.10.2.5 | 10.10.1.5 | TCP/1433 | Block |

    For each of the following statements, select Yes if the statement is true.
    Otherwise, select No.
    NOTE: Each correct selection is worth one point.
  choices:
    VM2 can connect to the TCP port 1433 services on VM1.:
      - 'Yes'
      - 'No'
    VM1 can connect to the TCP port 1433 services on VM2.:
      - 'Yes'
      - 'No'
    VM2 can connect to the TCP port 1433 services on VM3.:
      - 'Yes'
      - 'No'
  answer:
    VM2 can connect to the TCP port 1433 services on VM1.: 'No'
    VM1 can connect to the TCP port 1433 services on VM2.: 'Yes'
    VM2 can connect to the TCP port 1433 services on VM3.: 'Yes'
  user_answer:
    VM2 can connect to the TCP port 1433 services on VM1.: 'No'
    VM1 can connect to the TCP port 1433 services on VM2.: 'Yes'
    VM2 can connect to the TCP port 1433 services on VM3.: 'Yes'
  user_result: correct
  user_reasoning: |
    VM2 to VM1 is blocked by NSG2's inbound rule. Selected Yes for the
    other two connections because no NSG rules were believed to apply.
  learning_note: |
    VM1's outbound traffic is evaluated by its NIC NSG2 and subnet NSG1;
    default AllowVnetOutBound rules permit VM1 to VM2. Rule priorities are
    evaluated within each NSG, not compared across NSGs. An inbound deny
    does not prevent initiating an outbound connection; NSGs are stateful.
  explanation: |
    The answers are No, Yes, Yes. All selections are correct, but the
    reasoning for VM1 to VM2 needs refinement.

    VM2 to VM1: inbound traffic first passes NSG1 on Subnet1, whose priority
    101 rule allows it. NSG2 on VM1's NIC then denies the exact source,
    destination, and TCP port with priority 125. Both applicable NSGs must
    permit the traffic. Priority 101 in NSG1 does not override priority 125
    in NSG2, because priorities are evaluated independently within each NSG.

    VM1 to VM2: outbound traffic is evaluated by NSG2 and then NSG1.
    The custom rules shown are inbound rules, so they do not apply to this
    outbound connection. The default AllowVnetOutBound rules permit it.
    VM2 and Subnet2 have no NSGs to block the incoming connection. NSGs
    are stateful, so responses to this allowed connection are permitted
    without adding a separate inbound response rule on VM1.

    VM2 to VM3: neither VM NIC nor Subnet2 has an NSG. NSG1 on Subnet1
    and NSG2 on VM1's NIC do not apply to this connection.

    These results evaluate the specified Azure network controls, assuming
    the destination services are listening and guest firewalls allow them.
    Remember: evaluate the initiating direction at each applicable NSG;
    every NSG on the path must allow the new connection.

    [Microsoft Learn: How NSGs filter network traffic](https://learn.microsoft.com/en-us/azure/virtual-network/network-security-group-how-it-works)
    [Microsoft Learn: NSG rules and stateful filtering](https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview)

- id: '097'
  skill: Implement and manage virtual networking
  sub-skill: Configure and manage virtual networks in Azure
  question: |
    HOTSPOT

    You have an Azure subscription named Subscription1.
    Subscription1 contains the virtual machines in the following table:

    | Name | IP address |
    | --- | --- |
    | VM1 | 10.0.1.4 |
    | VM2 | 10.0.2.4 |
    | VM3 | 10.0.3.4 |

    Subscription1 contains a virtual network named VNet1 that has the subnets in the following table:

    | Name | Address space | Connected virtual machine |
    | --- | --- | --- |
    | Subnet1 | 10.0.1.0/24 | VM1 |
    | Subnet2 | 10.0.2.0/24 | VM2 |
    | Subnet3 | 10.0.3.0/24 | VM3 |

    VM3 has multiple network adapters, including a network adapter named NIC3.
    IP forwarding is enabled on NIC3. Routing is enabled on VM3.
    You create a route table named RT1 that contains the routes in the following table:

    | Address prefix | Next hop type | Next hop address |
    | --- | --- | --- |
    | 10.0.1.0/24 | Virtual appliance | 10.0.3.4 |
    | 10.0.2.0/24 | Virtual appliance | 10.0.3.4 |

    You apply RT1 to Subnet1 and Subnet2.
    For each of the following statements, select Yes if the statement is true.
    Otherwise, select No.
    NOTE: Each correct selection is worth one point.
  choices:
    VM3 can establish a network connection to VM1.:
      - 'Yes'
      - 'No'
    If VM3 is turned off, VM2 can establish a network connection to VM1.:
      - 'Yes'
      - 'No'
    VM1 can establish a network connection to VM2.:
      - 'Yes'
      - 'No'
  answer:
    VM3 can establish a network connection to VM1.: 'Yes'
    If VM3 is turned off, VM2 can establish a network connection to VM1.: 'No'
    VM1 can establish a network connection to VM2.: 'Yes'
  user_answer:
    VM3 can establish a network connection to VM1.: 'Yes'
    If VM3 is turned off, VM2 can establish a network connection to VM1.: 'No'
    VM1 can establish a network connection to VM2.: 'Yes'
  user_result: correct
  explanation: |
    The answers are Yes, No, Yes.

    VM3 to VM1: RT1 is associated with Subnet1 and Subnet2, not Subnet3.
    VM3 uses the default virtual network route to reach VM1. VM1's reply
    is addressed to 10.0.3.4, which matches neither /24 route in RT1, so
    the default virtual network route also carries the reply to VM3.

    VM2 to VM1 with VM3 turned off: the destination 10.0.1.4 matches
    RT1's 10.0.1.0/24 route, so VM2 sends traffic to next hop 10.0.3.4.
    VM3 cannot forward traffic while stopped. Azure does not automatically
    fall back to a less-specific system route when the appliance is down.

    VM1 to VM2: the destination 10.0.2.4 matches the route to 10.0.2.0/24,
    so traffic takes VM1 -> VM3 -> VM2. VM2's reply matches the route to
    10.0.1.0/24 and takes VM2 -> VM3 -> VM1. NIC IP forwarding and guest
    routing are both enabled on VM3, satisfying the stated forwarding
    prerequisites. VM3 forwards onward using Subnet3's default routes.

    Evaluate each statement independently; the shutdown condition belongs
    only to the second statement. Assume no additional firewall or NSG
    restriction beyond the routing configuration shown.

    Exam takeaway: route prefixes describe destinations, and route-table
    associations determine which source subnets use those routes. A single
    appliance next hop is a dependency, without automatic route failover.

    [Microsoft Learn: Virtual network traffic routing](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-udr-overview)
    [Microsoft Learn: Route traffic through a network virtual appliance](https://learn.microsoft.com/en-us/azure/virtual-network/tutorial-create-route-table-portal)

- id: '098'
  skill: Implement and manage virtual networking
  sub-skill: Configure and manage virtual networks in Azure
  question: |
    Your on-premises network contains an SMB share named Share1.
    You have an Azure subscription that contains the following resources:
    - A web app named webapp1
    - A virtual network named VNET1

    You need to ensure that webapp1 can connect to Share1.
    What should you deploy?
  choices:
    A: an Azure Application Gateway
    B: an Azure Active Directory (Azure AD) Application Proxy
    C: an Azure Virtual Network Gateway
  answer: C
  user_answer: A
  user_result: incorrect
  explanation: |
    C, an Azure Virtual Network Gateway, is the intended answer.
    Deploy a VPN gateway in VNET1 and establish a site-to-site VPN to the
    on-premises network. Configure webapp1's VNet integration so outbound
    traffic can reach on-premises resources through VNET1.

    A, Application Gateway, routes HTTP/HTTPS web traffic and does not
    provide connectivity to an SMB share. B, Azure AD Application Proxy
    (now Microsoft Entra Application Proxy), publishes on-premises web
    applications and does not proxy SMB traffic.

    The supplied answer A is incorrect. For an actual deployment, also
    verify App Service SMB support and restrictions: TCP port 445 is
    blocked by default in the App Service sandbox, so a VPN gateway alone
    does not guarantee that the application can use the share.

    Exam takeaway: connect an Azure virtual network to an on-premises
    network by using a virtual network gateway and a site-to-site VPN.

    [Microsoft Learn: App Service VNet integration](https://learn.microsoft.com/en-us/azure/app-service/overview-vnet-integration)
    [Microsoft Learn: App Service networking features](https://learn.microsoft.com/en-us/azure/app-service/networking-features)

- id: '099'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  question: |
    You plan to deploy several Azure virtual machines that will run
    Windows Server 2019 in a virtual machine scale set by using an Azure
    Resource Manager template.

    You need to ensure that NGINX is available on all the virtual machines
    after they are deployed.
    What should you use?
  choices:
    A: the Publish-AzVMDscConfiguration cmdlet
    B: Azure Application Insights
    C: Azure Custom Script Extension
    D: the New-AzConfigurationAssignment cmdlet
  answer: C
  user_answer: C
  user_result: correct
  explanation: |
    C, Azure Custom Script Extension, is correct. Include the extension
    in the scale set's ARM template to download and execute a script that
    installs NGINX on each Windows Server VM after deployment.

    A, Publish-AzVMDscConfiguration, packages and uploads a Desired State
    Configuration script; the cmdlet alone does not apply it to the VMs.
    B, Application Insights, monitors application performance rather than
    installing software. D, New-AzConfigurationAssignment, creates a
    machine configuration assignment and is not the intended installation
    mechanism for this task.

    Exam takeaway: run a script to install software automatically after
    VM deployment by using Custom Script Extension.

    [Microsoft Learn: Custom Script Extension for Windows](https://learn.microsoft.com/en-us/azure/virtual-machines/extensions/custom-script-windows)

- id: '100'
  tags: [must-review]
  skill: Implement and manage virtual networking
  sub-skill: Configure secure access to virtual networks
  question: |
    Your on-premises network contains a VPN gateway.
    You have an Azure subscription that contains the resources shown in the following table.

    | Name | Type | Description |
    | --- | --- | --- |
    | vgw1 | Virtual network gateway | Gateway for Site-to-Site VPN to the on-premises network |
    | storage1 | Storage account | Standard performance tier |
    | Vnet1 | Virtual network | Enabled forced tunneling |
    | VM1 | Virtual machine | Connected to Vnet1 |

    You need to ensure that all the traffic from VM1 to storage1 travels
    across the Microsoft backbone network.
    What should you configure?
  choices:
    A: a network security group (NSG)
    B: service endpoints
    C: Azure Peering Service
    D: Azure Firewall
  answer: B
  user_answer: C
  user_result: incorrect
  explanation: |
    B, service endpoints, is correct. Enable an Azure Storage service
    endpoint on the subnet that contains VM1. This adds service-specific
    routes that send storage traffic directly across the Microsoft Azure
    backbone, bypassing the forced-tunneling path through the on-premises
    VPN gateway. Service endpoint routes take precedence over BGP and
    user-defined routes for the matching service address prefixes.

    A, an NSG, filters traffic but does not select its route. C, Azure
    Peering Service, improves connectivity from customer networks to
    Microsoft cloud services through participating connectivity providers;
    it does not configure a subnet's direct route to Azure Storage.
    D, Azure Firewall, filters and inspects traffic but does not by itself
    provide the service endpoint routing required here.

    Exam takeaway: forced tunneling plus direct backbone access to Azure
    Storage points to a service endpoint on the VM's subnet.

    [Microsoft Learn: Virtual network service endpoints](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoints-overview)

- id: '101'
  skill: Implement and manage virtual networking
  sub-skill: Configure and manage virtual networks in Azure
  question: |
    You plan to deploy route-based Site-to-Site VPN connections between
    several on-premises locations and an Azure virtual network.
    Which tunneling protocol should you use?
  choices:
    A: IKEv1
    B: PPTP
    C: IKEv2
    D: L2TP
  answer: C
  user_answer: C
  user_result: correct
  explanation: |
    C, IKEv2, is the intended exam answer. Azure Site-to-Site VPNs use
    IPsec/IKE, and connections to multiple on-premises sites require a
    route-based gateway. IKEv2 negotiates the security associations for
    the IPsec VPN connections. PPTP and L2TP are not supported protocols
    for Azure VPN Gateway Site-to-Site connections.

    Historical exam guidance associates route-based gateways with IKEv2
    and policy-based gateways with IKEv1. Current Azure documentation
    supports both IKEv1 and IKEv2 on most current route-based gateway SKUs;
    the Basic route-based gateway supports IKEv2 only. Therefore, the
    question's wording does not uniquely exclude IKEv1 on modern SKUs,
    although C remains the intended answer.

    Exam takeaway: route-based multi-site VPN points to IKEv2 in this
    question, but verify gateway SKU capabilities for actual deployments.

    [Microsoft Learn: VPN Gateway topology and design](https://learn.microsoft.com/en-us/azure/vpn-gateway/design)
    [Microsoft Learn: VPN Gateway configuration settings](https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-about-vpn-gateway-settings)

- id: '102'
  skill: Monitor and maintain Azure resources
  sub-skill: Implement backup and recovery
  question: |
    You have an Azure subscription that contains the resources shown in the following table.

    | Name | Type | Description |
    | --- | --- | --- |
    | VNET1 | Virtual network | Azure region: US East. Subnet1: 172.16.1.0/24; Subnet2: 172.16.2.0/24; Subnet3: 172.16.3.0/24 |
    | VNET2 | Virtual network | Azure region: West US. DemoSubnet1: 172.16.1.0/24; RecoverySubnetA: 172.16.5.0/24; RecoverySubnetB: 172.16.3.0/24; TestSubnet1: 172.16.2.0/24 |
    | VM1 | Virtual machine | Connected to Subnet2 |

    You configure Azure Site Recovery to replicate VM1 between the US East
    and West US regions.

    You perform a test failover of VM1 and specify VNET2 as the target
    virtual network.

    When the test version of VM1 is created, to which subnet will the
    virtual machine be connected?
  choices:
    A: TestSubnet1
    B: DemoSubnet1
    C: RecoverySubnetA
    D: RecoverySubnetB
  answer: B
  user_answer: A
  user_result: incorrect
  explanation: |
    B, DemoSubnet1, is correct under the default Site Recovery subnet
    selection behavior. Site Recovery selects a target subnet with the
    same name as the source subnet when one exists. Otherwise, it selects
    the first subnet alphabetically. Test failover similarly uses the
    subnet name configured in the replicated VM's network settings, with
    an alphabetical fallback when that name is absent from the test network.

    VM1 uses Subnet2, and VNET2 has no subnet named Subnet2. With no custom
    subnet mapping specified, DemoSubnet1 is selected because it comes
    before RecoverySubnetA, RecoverySubnetB, and TestSubnet1 alphabetically.

    A, TestSubnet1, has the same address prefix as Subnet2, but matching
    address prefixes do not determine the default subnet selection.
    C and D are not first alphabetically and do not match the source name.
    An explicitly configured target subnet could change this behavior,
    but none is stated in the question.

    Exam takeaway: Site Recovery matches subnet names, then falls back
    to alphabetical order; it does not match subnet address prefixes.

    [Microsoft Learn: Azure-to-Azure network mapping](https://learn.microsoft.com/en-us/azure/site-recovery/azure-to-azure-network-mapping)
    [Microsoft Learn: Run a test failover](https://learn.microsoft.com/en-us/azure/site-recovery/site-recovery-test-failover-to-azure)

- id: '103'
  skill: Implement and manage virtual networking
  sub-skill: Configure name resolution and load balancing
  question: |
    You have five Azure virtual machines that run Windows Server 2016.
    The virtual machines are configured as web servers.
    You have an Azure load balancer named LB1 that provides load balancing
    services for the virtual machines.

    You need to ensure that visitors are serviced by the same web server
    for each request.
    What should you configure?
  choices:
    A: Protocol to UDP
    B: Session persistence to None
    C: Floating IP (direct server return) to Disabled
    D: Session persistence to Client IP
  answer: D
  user_answer: D
  user_result: correct
  user_reasoning: |
    Selected D, but wondered whether Client IP and protocol was required.
  explanation: |
    D, Session persistence to Client IP, is correct. Client IP affinity
    uses a two-tuple hash of source IP and destination IP, so successive
    connections from the same client IP to the same frontend are directed
    to the same backend server while the backend pool remains stable.

    Client IP and protocol uses a three-tuple hash: source IP, destination
    IP, and transport protocol (TCP or UDP). It provides affinity for each
    client IP and protocol combination. Ordinary HTTP and HTTPS web
    traffic uses TCP, so either affinity mode can satisfy that case, but
    adding protocol is not necessary. HTTP and HTTPS are application
    protocols, not separate protocol values in this hash.

    A changes the transport protocol without enabling affinity. B uses
    the default five-tuple hash, which includes source and destination
    ports, so new connections from the same visitor may reach different
    servers. C controls floating IP behavior rather than session affinity.

    Client IP affinity identifies source IPs, not individual users. Users
    behind the same NAT or proxy can share an affinity assignment. Backend
    pool changes or server failures can also change the selected server.

    Exam takeaway: same visitor, same backend server points to Client IP
    session persistence; Client IP and protocol is not required here.

    [Microsoft Learn: Load Balancer distribution modes](https://learn.microsoft.com/en-us/azure/load-balancer/distribution-mode-concepts)

- id: '104'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  question: |
    You plan to deploy several Azure virtual machines that will run
    Windows Server 2019 in a virtual machine scale set by using an Azure
    Resource Manager template.

    You need to ensure that NGINX is available on all the virtual machines
    after they are deployed.
    What should you use?
  choices:
    A: the Publish-AzVMDscConfiguration cmdlet
    B: a Microsoft Endpoint Manager device configuration profile
    C: Deployment Center in Azure App Service
    D: a Desired State Configuration (DSC) extension
  answer: D
  user_answer: D
  user_result: correct
  user_reasoning: |
    Selected D, but wondered why question 099 used Custom Script Extension
    for the same deployment requirement.
  explanation: |
    D, a Desired State Configuration (DSC) extension, is correct among
    these choices. Include the extension and a suitable DSC configuration
    in the scale set's ARM template to install and configure NGINX on
    the Windows Server instances. The extension alone does not supply
    an NGINX installation configuration.

    Question 099 has the same requirement but different options. Both
    Custom Script Extension and DSC extension can install software after
    deployment. Custom Script Extension executes an installation script
    that specifies the steps to perform. DSC describes a desired state,
    such as NGINX being installed and its service running, and uses DSC
    resources to check and apply that state. Ongoing drift correction
    depends on the DSC Local Configuration Manager settings; it is not
    automatically guaranteed merely by deploying the extension.

    A, Publish-AzVMDscConfiguration, packages and uploads configuration
    files and dependencies; it does not itself execute the configuration
    on the scale set instances. B is an endpoint device management profile,
    not the intended scale set provisioning mechanism. C deploys apps to
    Azure App Service rather than configuring these virtual machines.

    Exam takeaway: choose the execution mechanism offered in the answers.
    Custom Script Extension and DSC extension are both valid installation
    approaches; publishing a DSC package alone does not apply it.

    [Microsoft Learn: Deploy applications to a scale set](https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/virtual-machine-scale-sets-deploy-app)
    [Microsoft Learn: DSC extension overview](https://learn.microsoft.com/en-us/azure/virtual-machines/extensions/dsc-overview)

- id: '106'
  skill: Implement and manage virtual networking
  sub-skill: Configure secure access to virtual networks
  question: |
    You have an Azure subscription that contains 20 virtual machines,
    a network security group (NSG) named NSG1, and two virtual networks
    named VNET1 and VNET2 that are peered.

    You plan to deploy an Azure Bastion Basic SKU host named Bastion1
    to VNET1.
    You need to configure NSG1 to allow inbound access to the virtual
    machines via Bastion1.
    Which port should you configure for the inbound security rule?
  choices:
    A: '22'
    B: '443'
    C: '389'
    D: '8080'
  answer: A
  user_answer: C
  user_result: incorrect
  user_reasoning: |
    Selected port 389. Recognized 22 as SSH and 443 as HTTPS, but asked
    what port 8080 is used for.
  explanation: |
    A, port 22, is the correct option among the listed choices. Target
    VM NSGs must permit inbound SSH on TCP 22 or RDP on TCP 3389 from
    the AzureBastionSubnet address range. The VM operating system is not
    stated, but 22 is the only listed target VM connection port.

    The two connection legs use different ports: the browser connects
    to Bastion over HTTPS on TCP 443; Bastion connects to the target VM
    over its private IP using SSH on TCP 22 or RDP on TCP 3389. Peering
    does not change these destination port requirements.

    B, 443, applies to browser access to Bastion rather than the target
    VM's SSH/RDP session. C, 389, is LDAP, not RDP; RDP uses 3389.
    D, 8080, is commonly used as an alternate HTTP port, and in Azure
    Bastion it is used with 5701 for internal host communication. It is
    not the target VM SSH/RDP port.

    Exam takeaway: distinguish browser-to-Bastion HTTPS 443 from
    Bastion-to-VM SSH 22 or RDP 3389. Do not confuse LDAP 389 with RDP 3389.

    [Microsoft Learn: Configure NSG rules for Azure Bastion](https://learn.microsoft.com/en-us/azure/bastion/bastion-nsg)

- id: '107'
  skill: Implement and manage virtual networking
  sub-skill: Configure name resolution and load balancing
  question: |
    HOTSPOT

    Your network contains an on-premises Active Directory Domain Services
    (AD DS) domain named contoso.com. The domain contains the servers
    shown in the following table.

    | Name | IP address | Role |
    | --- | --- | --- |
    | DC1 | 192.168.2.1/16 | Domain controller; DNS server |
    | Server1 | 192.168.2.50/16 | Member server |

    You plan to migrate contoso.com to Azure.
    You create an Azure virtual network named VNET1 that has the following settings:
    - Address space: 10.0.0.0/16
    - Subnet name: Subnet1
    - Subnet IPv4: 10.0.1.0/24

    You need to move DC1 to VNET1. The solution must ensure that the member
    servers in contoso.com can resolve AD DS DNS names.
    How should you configure DC1? Select the appropriate options.
    NOTE: Each correct selection is worth one point.
  choices:
    IP address:
      - Obtain an IP address automatically
      - Use 10.0.1.3
      - Use 10.0.2.1
      - Use 192.168.2.1
    Name resolution:
      - Configure VNET1 to use a custom DNS server
      - Configure VNET1 to use the default Azure-provided DNS server
      - Create an Azure Private DNS zone named contoso.com
      - Create an Azure public DNS zone named contoso.com
  answer:
    IP address: Obtain an IP address automatically
    Name resolution: Configure VNET1 to use a custom DNS server
  user_answer:
    IP address: Use 10.0.1.3
    Name resolution: Configure VNET1 to use a custom DNS server
  user_result: incorrect
  explanation: |
    The correct selections are Obtain an IP address automatically and
    Configure VNET1 to use a custom DNS server. The DNS selection is
    correct, but the IP address selection is incorrect.

    Azure reserves the first four addresses and the last address of each
    subnet. In Subnet1, 10.0.1.0 through 10.0.1.3 and 10.0.1.255 are
    reserved. Therefore, 10.0.1.3 cannot be assigned to DC1. 10.0.2.1 is
    outside Subnet1, and 192.168.2.1 is outside VNET1's address space.
    Obtain an IP address automatically is the only valid listed option.

    Keep the guest OS configured to obtain its IP address through Azure
    DHCP. For a stable domain controller/DNS address, configure a static
    private IP on the Azure NIC using an available address in Subnet1,
    such as 10.0.1.4 if it is free. Guest DHCP and an Azure NIC static
    allocation are compatible: Azure supplies the reserved NIC address
    to the guest.

    Configure VNET1's custom DNS server setting with DC1's Azure private
    IP so member servers in the VNet can resolve the AD DS zone and its
    service records. Azure-provided DNS does not host the existing AD DS
    zone. Creating a public or private Azure DNS zone alone does not
    replace the domain controller's AD-integrated DNS service. Member
    servers remaining on-premises also need network connectivity and
    DNS settings or forwarding that can reach DC1's new address.

    Exam takeaway: .3 is reserved in an Azure /24 subnet; use guest DHCP
    with a stable Azure NIC allocation and custom DNS for AD DS.

    [Microsoft Learn: Azure-reserved IP addresses](https://learn.microsoft.com/en-us/azure/networking/design-guide/ip-planning)
    [Microsoft Learn: Virtual network DNS settings](https://learn.microsoft.com/en-us/azure/virtual-network/manage-virtual-network)

- id: '109'
  tags: [must-review]
  skill: Implement and manage virtual networking
  sub-skill: Configure secure access to virtual networks
  question: |
    You have an Azure subscription that contains the virtual networks
    shown in the following table.

    | Name | Azure region | Resource group |
    | --- | --- | --- |
    | VNET1 | West US | RG1 |
    | VNET2 | Central US | RG1 |
    | VNET3 | Central US | RG2 |
    | VNET4 | West US | RG2 |

    You need to deploy an Azure firewall named AF1 to RG1 in the West US
    Azure region.
    To which virtual networks can you deploy AF1?
  choices:
    A: VNET1, VNET2, VNET3, and VNET4
    B: VNET1 and VNET2 only
    C: VNET1 only
    D: VNET1, VNET2, and VNET4 only
    E: VNET1 and VNET4 only
  answer: C
  user_answer: C
  user_result: correct
  explanation: |
    C, VNET1 only, is correct according to the Azure Firewall-specific
    resource group restriction in Microsoft documentation. The firewall
    and its hosting virtual network must be in the same region and the
    same resource group. AF1 is being deployed to RG1 in West US.

    VNET1 satisfies both requirements. VNET2 is in RG1 but in Central US.
    VNET3 is in Central US and RG2. VNET4 is in West US but in RG2, so it
    fails the firewall-specific resource group requirement.

    E applies the same-region requirement but overlooks the same-resource-
    group restriction. Although general VNet guidance allows many connected
    resources to belong to different resource groups, the Azure Firewall
    FAQ explicitly states that the firewall and VNet must share a resource
    group. The hosting VNet also needs a suitable AzureFirewallSubnet.

    Deployment into a VNet is distinct from inspecting traffic from other
    networks through peering and routing; a firewall can protect connected
    networks without being deployed into each one.

    Exam takeaway: use the Azure Firewall-specific constraints rather than
    assuming the general VNet resource group flexibility applies.

    [Microsoft Learn: Azure Firewall resource group restrictions](https://learn.microsoft.com/en-us/azure/firewall/firewall-faq#are-there-any-azure-firewall-resource-group-restrictions)
    [Microsoft Learn: Virtual network region requirements](https://learn.microsoft.com/en-us/azure/virtual-network/manage-virtual-network)

- id: '110'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  question: |
    You have an on-premises network.
    You have an Azure subscription that contains three virtual networks
    named VNET1, VNET2, and VNET3. The virtual networks are peered and
    connected to the on-premises network. The subscription contains the
    virtual machines shown in the following table.

    | Name | Location | Connected to |
    | --- | --- | --- |
    | VM1 | West US | VNET1 |
    | VM2 | West US | VNET1 |
    | VM3 | West US | VNET2 |
    | VM4 | Central US | VNET3 |

    You need to monitor connectivity between the virtual machines and
    the on-premises network by using Connection Monitor.
    What is the minimum number of connection monitors you should deploy?
  choices:
    A: '1'
    B: '2'
    C: '3'
    D: '4'
  answer: B
  user_answer: C
  user_result: incorrect
  explanation: |
    B, 2, is the intended answer. A connection monitor is a region-specific
    resource and can contain multiple source endpoints and test groups.
    Under the regional source selection model used by this question,
    deploy one monitor in West US for VM1, VM2, and VM3, and one in
    Central US for VM4. Both monitor connectivity to on-premises endpoints.

    The number of VNets does not determine the number of monitors.
    VM1 and VM2 in VNET1 and VM3 in VNET2 share the West US region and
    can be sources in the same monitor. Peering does not merge regions.
    A single monitor does not cover both source regions under this model,
    and a separate monitor for each VM is unnecessary because multiple
    sources are supported.

    Exam takeaway: count source VM regions, not virtual networks or VMs,
    for this regional Connection Monitor question.

    [Microsoft Learn: Connection Monitor overview](https://learn.microsoft.com/en-us/azure/network-watcher/connection-monitor-overview)
    [Microsoft Learn: Create a connection monitor in the portal](https://learn.microsoft.com/en-us/azure/network-watcher/connection-monitor-create-using-portal)

- id: '111'
  skill: Deploy and manage Azure compute resources
  sub-skill: Automate deployment of resources by using templates
  question: |
    HOTSPOT

    You plan to deploy the following Azure Resource Manager (ARM) template.

    ```json
    {
      "$schema": "https://schema.management.azure.com/schemas/2015-01-01/deploymentTemplate.json#",
      "contentVersion": "1.0.0.0",
      "parameters": {},
      "variables": {
        "vnetId": "[resourceId('Microsoft.Network/virtualNetworks/', 'VNET1')]",
        "lbId": "[resourceId('Microsoft.Network/loadBalancers/', 'LB1')]",
        "sku": "Standard",
        "netname": "APP1"
      },
      "resources": [
        {
          "apiVersion": "2017-08-01",
          "type": "Microsoft.Network/loadBalancers/",
          "name": "LB1",
          "location": "EastUS",
          "sku": { "name": "[variables('sku')]" },
          "properties": {
            "frontendIPConfiguration": [
              {
                "name": "[variables('netname')]",
                "properties": {
                  "subnet": {
                    "id": "[concat(variables('vnetId'), '/subnets/', variables('netname'))]"
                  },
                  "privateIPAllocationMethod": "Dynamic"
                }
              }
            ],
            "backendAddressPools": [
              { "name": "concat(variables('netname'), '-Servers')]" }
            ],
            "loadBalancingRules": [
              {
                "name": "APP1",
                "properties": {
                  "frontendIPConfiguration": {
                    "id": "[concat(variables('lbId'), '/frontendIPConfigurations/', variables('netname'))]"
                  },
                  "backendAddressPool": {
                    "id": "[concat(variables('lbId'), '/backendAddressPool/', variables('netname'))]"
                  },
                  "probe": { "id": "[concat(variables('lbId'), '/probes/probe')]" },
                  "backendPort": 8080,
                  "protocol": "Tcp",
                  "frontendPort": 80,
                  "enableFloatingIP": false,
                  "idleTimeoutInMinutes": 4,
                  "loadDistribution": "SourceIPProtocol"
                }
              }
            ],
            "probes": [
              {
                "name": "probe",
                "properties": {
                  "protocol": "Tcp",
                  "port": 8080,
                  "intervalInSeconds": 15,
                  "numberOfProbes": 2
                }
              }
            ]
          }
        }
      ]
    }
    ```

    For each statement, select Yes if the statement is true. Otherwise, select No.
    NOTE: Each correct selection is worth one point.
  choices:
    LB1 will be connected to a subnet named VNET1/netname:
      - 'Yes'
      - 'No'
    LB1 can be deployed only to the resource group that contains VNET1:
      - 'Yes'
      - 'No'
    The value of the sku variable can be provided as a parameter when the template is deployed from a command prompt:
      - 'Yes'
      - 'No'
  answer:
    LB1 will be connected to a subnet named VNET1/netname: 'No'
    LB1 can be deployed only to the resource group that contains VNET1: 'Yes'
    The value of the sku variable can be provided as a parameter when the template is deployed from a command prompt: 'No'
  user_answer:
    LB1 will be connected to a subnet named VNET1/netname: 'No'
    LB1 can be deployed only to the resource group that contains VNET1: 'No'
    The value of the sku variable can be provided as a parameter when the template is deployed from a command prompt: 'No'
  user_result: incorrect
  user_reasoning: |
    First No because the subnet reference resolves to VNET1/APP1.
    Second No because no resource group restriction seemed to be stated.
    Third No because sku is defined as a variable.
  explanation: |
    The intended answers are No, Yes, No. The first and third selections
    are correct; the second overlooks the implicit scope of resourceId().

    First: variables('netname') resolves to APP1, so the subnet reference
    ends in virtualNetworks/VNET1/subnets/APP1. It does not refer to a
    subnet literally named netname.

    Second: resourceId('Microsoft.Network/virtualNetworks/', 'VNET1')
    omits a resource group argument. For this resource group deployment,
    resourceId() defaults to the current deployment resource group and
    subscription. Therefore, the unmodified template looks for VNET1 in
    the same resource group where it deploys LB1. This is a consequence
    of this template, not a general restriction on load balancers. To
    reference a VNet in another resource group, include that group in
    resourceId() or provide the full subnet resource ID.

    Third: parameters is empty and sku is a variable fixed to Standard.
    Deployment parameter arguments cannot override a template variable.
    To make the SKU configurable, declare a parameter and use its value.

    The screenshot also contains apparent template defects unrelated to
    the tested concepts: frontendIPConfiguration is singular at the array
    level, the backend pool name lacks an opening expression bracket,
    and the backend pool reference has an inconsistent path and name.
    The answers describe the intended expressions; successful deployment
    of the template exactly as printed is not assumed.

    Exam takeaway: omitted resourceId() scope arguments implicitly refer
    to the deployment resource group; only declared parameters accept
    deployment-time parameter values.

    [Microsoft Learn: resourceId function](https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/template-functions-resource#resourceid)
    [Microsoft Learn: ARM template parameters](https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/parameters)

- id: '112'
  skill: Implement and manage storage
  sub-skill: Configure access to storage
  question: |
    You have an Azure subscription that contains a storage account.
    The account stores website data.
    You need to ensure that inbound user traffic uses the Microsoft
    point-of-presence (POP) closest to the user's location.
    What should you configure?
  choices:
    A: private endpoints
    B: Azure Firewall rules
    C: Routing preference
    D: load balancing
  answer: C
  user_answer: C
  user_result: correct
  explanation: |
    C, Routing preference, is correct. Configure the storage account's
    routing preference to Microsoft network routing (Microsoft global
    network). Traffic enters Microsoft's network at the POP closest to
    the client and travels over the Microsoft backbone to the storage
    account. Microsoft network routing is also the default preference.

    Internet routing instead uses the Microsoft POP closest to the storage
    account, leaving more of the path on the public internet. The requirement
    explicitly calls for the POP closest to the user, so Microsoft network
    routing meets it.

    A, private endpoints, provides private VNet access to storage rather
    than selecting the public client's ingress POP. B, firewall rules,
    controls allowed traffic rather than the POP selection. D, load
    balancing, distributes traffic across backends and is not the storage
    account setting that controls this routing preference.

    Exam takeaway: closest POP to the user means Microsoft network routing;
    closest POP to the storage account means Internet routing.

    [Microsoft Learn: Storage network routing preference](https://learn.microsoft.com/en-us/azure/storage/common/network-routing-preference)
    [Microsoft Learn: Configure routing preference](https://learn.microsoft.com/en-us/azure/storage/common/configure-network-routing-preference)

- id: '113'
  skill: Implement and manage virtual networking
  sub-skill: Configure secure access to virtual networks
  question: |
    You have two Azure virtual machines named VM1 and VM2 that run Windows
    Server. The virtual machines are in a subnet named Subnet1.
    Subnet1 is in a virtual network named VNet1.

    You need to prevent VM1 from accessing VM2 on port 3389.
    What should you do?
  choices:
    A: Create a network security group (NSG) that has an outbound security rule to deny destination port 3389 and apply the NSG to the network interface of VM1.
    B: Configure Azure Bastion in VNet1.
    C: Create a network security group (NSG) that has an outbound security rule to deny source port 3389 and apply the NSG to Subnet1.
    D: Create a network security group (NSG) that has an inbound security rule to deny source port 3389 and apply the NSG to Subnet1.
  answer: A
  user_answer: D
  user_result: incorrect
  explanation: |
    A is correct. Associate an NSG with VM1's network interface and create
    an outbound deny rule for destination port 3389. This blocks VM1 from
    initiating RDP connections to VM2. To limit the rule to this pair,
    specify VM2's private IP as the destination and use source port Any.
    Give the deny rule precedence over applicable allow rules.

    A typical initiating connection looks like VM1:50000 -> VM2:3389.
    The client uses an ephemeral source port; 3389 is the destination
    service port. Outbound means leaving VM1, while inbound at VM2 would
    still have destination port 3389. Direction does not swap the source
    and destination fields in the packet.

    B, deploying Bastion, provides managed remote access but does not
    block direct VM-to-VM RDP. C and D match source port 3389, so they
    do not match the normal initiating RDP connection. NSGs are stateful:
    reply traffic for an allowed connection does not require a separate
    allow rule and cannot be reliably blocked by targeting its source
    service port. Rule changes do not terminate existing connections.

    Exam takeaway: block access to a service by matching its destination
    port. An outbound rule on the source NIC or an inbound rule on the
    destination NIC can block a new connection when correctly scoped.

    [Microsoft Learn: NSG security rules and stateful filtering](https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview)

- id: '114'
  skill: Implement and manage virtual networking
  sub-skill: Configure and manage virtual networks in Azure
  question: |
    You have an Azure subscription that contains the resources shown in the following table.

    | Name | Type | Description |
    | --- | --- | --- |
    | App1 | App Service | Virtual network integration enabled for VNET1 |
    | ASP1 | App Service plan | Standard SKU |
    | VNET1 | Virtual network | None |
    | Firewall1 | Azure Firewall | Connected to VNET1 |

    You need to manage outbound traffic from VNET1 by using Firewall1.
    What should you do first?
  choices:
    A: Configure the Hybrid Connection Manager.
    B: Upgrade ASP1 to the Premium SKU.
    C: Create a route table.
    D: Create an Azure Network Watcher.
  answer: C
  user_answer: C
  user_result: correct
  explanation: |
    C, Create a route table, is correct. A user-defined route directs
    outbound traffic from the relevant subnet to Firewall1. For default
    internet egress, add a route for 0.0.0.0/0 with next hop type Virtual
    appliance and next hop address set to Firewall1's private IP, then
    associate the route table with App1's VNet integration subnet.

    To include App1's public internet-bound traffic, also enable outbound
    internet traffic routing through VNet integration (historically called
    Route All). Configure Firewall1's rules to permit the required traffic.
    Merely connecting a firewall to the VNet does not send traffic through it.

    A, Hybrid Connection Manager, enables access to specific hybrid TCP
    endpoints rather than configuring firewall egress routing. B is not
    necessary because the Standard App Service plan supports VNet
    integration, which is already enabled. D, Network Watcher, provides
    monitoring and diagnostics rather than steering traffic to the firewall.

    Exam takeaway: route traffic through Azure Firewall by using a route
    table with a Virtual appliance next hop pointing to its private IP.

    [Microsoft Learn: App Service VNet integration and route tables](https://learn.microsoft.com/en-us/azure/app-service/overview-vnet-integration)
    [Microsoft Learn: App Service outbound routing](https://learn.microsoft.com/en-us/azure/app-service/configure-vnet-integration-routing)

- id: '115'
  skill: Implement and manage virtual networking
  sub-skill: Configure secure access to virtual networks
  question: |
    You have an Azure subscription that contains the resources shown in the following table.

    | Name | Type |
    | --- | --- |
    | VM1 | Virtual machine |
    | App1 | Web app |
    | contoso.com | Azure Active Directory Domain Services (Azure AD DS) domain |

    All the resources connect to a virtual network named Vnet1.
    You plan to deploy an Azure Bastion host named Bastion1 to Vnet1.
    Which resources can be protected by using Bastion1?
  choices:
    A: VM1 only
    B: contoso.com only
    C: App1 and contoso.com only
    D: VM1 and contoso.com only
    E: VM1, App1, and contoso.com
  answer: A
  user_answer: A
  user_result: correct
  explanation: |
    A, VM1 only, is correct. Azure Bastion provides secure RDP and SSH
    access to virtual machines over their private IP addresses. VM1
    therefore does not need public exposure of its RDP/SSH ports for
    administrative access through Bastion.

    App1 is an App Service web app, not a VM that exposes customer-managed
    RDP/SSH access through Bastion. contoso.com is an Azure AD DS managed
    domain (now Microsoft Entra Domain Services), whose managed domain
    controllers are not customer-administered VMs accessible through
    Bastion. Connecting these services to Vnet1 does not make them Bastion
    targets. A separate management VM used to administer the domain could
    be accessed through Bastion, but the managed domain itself cannot.

    Exam takeaway: Bastion secures administrative RDP/SSH access to VMs;
    it does not automatically protect every service connected to a VNet.

    [Microsoft Learn: Azure Bastion overview](https://learn.microsoft.com/en-us/azure/bastion/bastion-overview)

- id: '118'
  skill: Implement and manage virtual networking
  sub-skill: Configure secure access to virtual networks
  question: |
    You have an Azure subscription that contains 10 virtual machines and
    the resources shown in the following table.

    | Name | Type | Description |
    | --- | --- | --- |
    | VNET1 | Virtual network | None |
    | Bastion1 | Basic SKU Azure Bastion host | Subnet size /26 |

    You need to ensure that Bastion1 can support 100 concurrent SSH users.
    The solution must minimize administrative effort.
    What should you do first?
  choices:
    A: Resize the subnet of Bastion1.
    B: Configure host scaling.
    C: Create a network security group (NSG).
    D: Upgrade Bastion1 to the Standard SKU.
  answer: D
  user_answer: A
  user_result: incorrect
  user_reasoning: |
    Selected A because a /26 subnet has only 64 IP addresses, which seemed
    too small for 100 concurrent users.
  explanation: |
    D, Upgrade Bastion1 to the Standard SKU, is correct. Basic uses two
    fixed instances and does not support configurable host scaling.
    Standard enables host scaling, so upgrade first, then increase the
    instance count to support the required concurrency.

    Microsoft documents 40 concurrent SSH connections per instance for
    medium workloads. Two Basic instances provide approximately 80 such
    sessions. Three Standard instances provide approximately 120, enough
    for 100 concurrent SSH users under that workload assumption. Actual
    capacity depends on session activity.

    A /26 contains 64 addresses, of which 59 are usable after Azure's
    reservations. These addresses are for deployed infrastructure, not
    one address per SSH user. Many sessions share each Bastion instance.
    The existing /26 meets the host scaling subnet requirement, so it
    does not need to be resized for this scenario.

    B is the subsequent step, but cannot be configured on Basic. C controls
    traffic filtering and does not increase session capacity.

    Exam takeaway: concurrent users consume session capacity, not one
    subnet IP each. Upgrade Basic to Standard before configuring scaling.

    [Microsoft Learn: Configure Bastion host scaling](https://learn.microsoft.com/en-us/azure/bastion/configure-host-scaling)
    [Microsoft Learn: Bastion SKU comparison](https://learn.microsoft.com/en-us/azure/bastion/bastion-sku-comparison)

- id: '120'
  skill: Implement and manage virtual networking
  sub-skill: Configure secure access to virtual networks
  question: |
    DRAG DROP

    You have a Windows 11 device named Device1 and an Azure subscription
    that contains the resources shown in the following table.

    | Name | Description |
    | --- | --- |
    | VNET1 | Virtual network |
    | VM1 | Virtual machine that runs Windows Server 2022 and does NOT have a public IP address; connected to VNET1 |
    | Bastion1 | Azure Bastion Basic SKU host connected to VNET1 |

    Device1 has Azure PowerShell and Azure Command-Line Interface (CLI) installed.
    From Device1, you need to establish a Remote Desktop connection to VM1.
    Which three actions should you perform in sequence? Select and arrange
    the appropriate actions in the correct order.
  choices:
    - From Azure CLI on Device1, run az network bastion rdp.
    - From Bastion1, enable Kerberos authentication.
    - From VM1, enable just-in-time (JIT) VM access.
    - From Bastion1, select Native Client Support.
    - On Device1, run mstsc.exe.
    - Upgrade Bastion1 to the Standard SKU.
  answer:
    - Upgrade Bastion1 to the Standard SKU.
    - From Bastion1, select Native Client Support.
    - From Azure CLI on Device1, run az network bastion rdp.
  user_answer: []
  user_result: incorrect
  user_reasoning: |
    No idea; no sequence selected.
  explanation: |
    First upgrade Bastion1 from Basic to Standard, then enable Native
    Client Support on Bastion1, and finally run az network bastion rdp
    from Azure CLI on Device1. Native client connections require the
    Standard SKU or higher and the native client feature enabled.

    The CLI command establishes connectivity through Bastion and launches
    the Windows native Remote Desktop client (MSTSC). Bastion reaches
    VM1 through its private IP, so VM1 does not need a public IP address.
    Simply launching mstsc.exe does not establish a Bastion tunnel and
    does not by itself give Device1 network access to VM1's private IP.

    Kerberos authentication and JIT VM access are not required for this
    connection sequence. Basic supports browser-based RDP through the
    Azure portal, but the listed actions describe a native client workflow.

    Exam takeaway: native RDP through Bastion follows Standard SKU,
    Native Client Support, then az network bastion rdp.

    [Microsoft Learn: Configure Bastion native client connections](https://learn.microsoft.com/en-us/azure/bastion/connect-native-client-windows)
    [Microsoft Learn: Connect with a Windows native client](https://learn.microsoft.com/en-us/azure/bastion/connect-vm-native-client-windows)

- id: '122'
  skill: Implement and manage virtual networking
  sub-skill: Configure secure access to virtual networks
  question: |
    You have an Azure subscription that has the public IP addresses shown
    in the following table.

    | Name | IP version | SKU | Tier | IP address assignment |
    | --- | --- | --- | --- | --- |
    | IP1 | IPv4 | Standard | Regional | Static |
    | IP2 | IPv4 | Standard | Global | Static |
    | IP3 | IPv4 | Basic | Regional | Dynamic |
    | IP4 | IPv4 | Basic | Regional | Static |
    | IP5 | IPv6 | Basic | Regional | Dynamic |

    You plan to deploy an Azure Bastion Basic SKU host named Bastion1.
    Which IP addresses can you use?
  choices:
    A: IP1 only
    B: IP1 and IP2 only
    C: IP3, IP4, and IP5 only
    D: IP1, IP2, IP4, and IP5 only
    E: IP1, IP2, IP3, IP4, and IP5
  answer: A
  user_answer: A
  user_result: correct
  explanation: |
    A, IP1 only, is correct. A Bastion Basic host requires a Standard SKU,
    static, regional public IP in the same region as the host. IP1 has
    the required IPv4, Standard, Regional, and Static properties.

    IP2 has Global tier, which is for cross-region Load Balancer rather
    than a regional Bastion host. IP3 has Basic SKU and dynamic allocation.
    IP4 is static but still has Basic SKU. IP5 has Basic SKU and dynamic
    allocation, and is an IPv6-only address rather than the required IPv4
    configuration in this question.

    Bastion's SKU and the public IP's SKU are separate: a Basic Bastion
    host still requires a Standard public IP. Current documentation also
    describes IPv4/IPv6 dual-stack Bastion support in preview; this does
    not make the Basic dynamic IPv6 address IP5 eligible.

    Exam takeaway: Basic Bastion does not mean Basic public IP; choose
    Standard, Regional, Static IPv4 among these options.

    [Microsoft Learn: Bastion configuration settings](https://learn.microsoft.com/en-us/azure/bastion/configuration-settings)
    [Microsoft Learn: Public IP addresses](https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/public-ip-addresses)

- id: '125'
  skill: Manage Azure identities and governance
  sub-skill: Manage Azure subscriptions and governance
  question: |
    You have two Azure subscriptions named Sub1 and Sub2.
    Sub1 contains a virtual machine named VM1 and a storage account named storage1.
    VM1 is associated to the resources shown in the following table.

    | Name | Type |
    | --- | --- |
    | Disk1 | Operating system disk |
    | NetInt1 | Network interface |
    | VNet1 | Virtual network |

    You need to move VM1 to Sub2.
    Which resources should you move to Sub2?
  choices:
    A: VM1, Disk1, and NetInt1 only
    B: VM1, Disk1, and VNet1 only
    C: VM1, Disk1, and storage1 only
    D: VM1, Disk1, NetInt1, and VNet1
  answer: D
  user_answer: A
  user_result: incorrect
  explanation: |
    D is correct. Moving VM1 across subscriptions requires moving its
    dependent resources, including its operating system disk Disk1,
    network interface NetInt1, and the virtual network VNet1 to which
    the network interface is attached.

    A omits VNet1. B omits NetInt1. C omits the networking dependencies
    and includes storage1, which is not stated to be associated with VM1.
    Assuming Disk1 is a managed disk and storage1 has no other dependency
    relationship with VM1, storage1 does not need to move merely because
    it exists in the source subscription.

    A cross-subscription move preserves the dependency chain; it does
    not automatically reconnect the NIC to a different target VNet.
    In a real deployment, other resources attached to VNet1 can extend
    the required move set. Validate the complete dependency list before
    moving the resources.

    Exam takeaway: moving a VM across subscriptions includes its disk,
    NIC, and VNet, not just the VM and directly attached disk and NIC.

    [Microsoft Learn: Networking move dependencies](https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/move-limitations/networking-move-limitations)

- id: '131'
  skill: Monitor and maintain Azure resources
  sub-skill: Implement backup and recovery
  question: |
    You have an Azure subscription that contains a Recovery Services
    vault named Vault1.
    You need to enable multi-user authorization (MAU) for Vault1.
    Which resource should you create first?
  choices:
    A: an administrative unit
    B: a managed identity
    C: a resource guard
    D: a custom Azure role
  answer: C
  user_answer: A
  user_result: incorrect
  explanation: |
    C, a resource guard, is correct. Multi-user authorization (normally
    abbreviated MUA) uses Resource Guard as an additional authorization
    mechanism for critical Azure Backup operations on the vault.
    Create Resource Guard first, assign the necessary permissions, and
    then associate it with Vault1 when enabling MUA.

    Resource Guard is controlled by a security administrator so the
    backup administrator cannot independently perform protected critical
    operations. It must be in the same region as the vault; Microsoft
    recommends isolating it in another subscription or tenant.

    A, an administrative unit, scopes Microsoft Entra administration of
    directory objects rather than vault protection. B, a managed identity,
    provides an identity for a resource but is not the prerequisite for
    MUA. D, a custom Azure role, defines permissions but does not replace
    Resource Guard; built-in roles are available for this workflow.

    Exam takeaway: Azure Backup multi-user authorization requires
    Resource Guard. The question's MAU abbreviation refers to MUA.

    [Microsoft Learn: Create Resource Guard and enable MUA](https://learn.microsoft.com/en-us/azure/backup/multi-user-authorization-tutorial)

- id: '132'
  skill: Implement and manage virtual networking
  sub-skill: Configure name resolution and load balancing
  question: |
    Note: This question is part of a series of questions that present the
    same scenario. Each question in the series contains a unique solution
    that might meet the stated goals. Some question sets might have more
    than one correct solution, while others might not have a correct solution.
    After you answer a question in this section, you will NOT be able to
    return to it. These questions will not appear in the review screen.

    You have an app named App1 that is installed on two Azure virtual
    machines named VM1 and VM2. Connections to App1 are managed by using
    an Azure Load Balancer.
    The effective network security configurations for VM2 are shown below.
    VM2-NIC1 has private IP 10.240.11.5 in Vnet1/Subnet11. NSG2 is attached
    to Subnet11. The inbound rules are:

    | Priority | Name | Port | Protocol | Source | Destination | Action |
    | --- | --- | --- | --- | --- | --- | --- |
    | 100 | Allow_131.107.100.50 | 443 | TCP | 131.107.100.50 | VirtualNetwork | Allow |
    | 200 | BlockAllOther443 | 443 | Any | Any | Any | Deny |
    | 65000 | AllowVnetInBound | Any | Any | VirtualNetwork | VirtualNetwork | Allow |
    | 65001 | AllowAzureLoadBalancerInBound | Any | Any | AzureLoadBalancer | Any | Allow |
    | 65500 | DenyAllInBound | Any | Any | Any | Any | Deny |

    You discover that connections to App1 from 131.107.100.50 over TCP
    port 443 fail. You verify that the Load Balancer rules are configured
    correctly.
    You need to ensure that connections to App1 can be established
    successfully from 131.107.100.50 over TCP port 443.

    Solution: You create an inbound security rule that allows any traffic
    from the AzureLoadBalancer source and has a priority of 150.
    Does this meet the goal?
  choices:
    A: 'Yes'
    B: 'No'
  answer: A
  user_answer: A
  user_result: correct
  explanation: |
    A, Yes, is the intended answer. The priority 100 rule already permits
    client traffic from 131.107.100.50 to TCP 443. However, the priority
    200 deny blocks health probes on port 443 before the default
    AzureLoadBalancer allow at priority 65001 can be evaluated.

    The new AzureLoadBalancer allow at priority 150 precedes the deny at
    200 and permits the probes. Healthy backends can then receive the
    client connections already allowed by priority 100. Lower numeric
    priority values are evaluated first, and the first matching rule wins.

    AzureLoadBalancer identifies health probe traffic, not all user
    traffic forwarded by the load balancer. Client traffic retains the
    client's source IP and still needs its own allow rule. IPv4 probes
    originate from 168.63.129.16.

    The question implicitly assumes the health probe uses port 443 and
    that no other service or guest firewall issue exists. If the probe
    used a different port, the displayed 443 deny would not explain its
    failure. In production, restrict the probe allow to its required port
    rather than allowing every port.

    Exam takeaway: allow both the client traffic and health probes, with
    each allow taking precedence over any matching deny.

    [Microsoft Learn: Load Balancer health probes](https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-custom-probe-overview)
    [Microsoft Learn: Troubleshoot blocked health probes](https://learn.microsoft.com/en-us/troubleshoot/azure/load-balancer/troubleshoot-load-balancer-health-probe-failures)

- id: '133'
  skill: Implement and manage virtual networking
  sub-skill: Configure secure access to virtual networks
  question: |
    Your on-premises network contains a VPN gateway.
    You have an Azure subscription that contains the resources shown in the following table.

    | Name | Type | Description |
    | --- | --- | --- |
    | vgw1 | Virtual network gateway | Gateway for Site-to-Site VPN to the on-premises network |
    | storage1 | Storage account | Standard performance tier |
    | Vnet1 | Virtual network | Enabled forced tunneling |
    | VM1 | Virtual machine | Connected to Vnet1 |

    You need to ensure that all the traffic from VM1 to storage1 travels
    across the Microsoft backbone network.
    What should you configure?
  choices:
    A: Azure Application Gateway
    B: service endpoints
    C: Azure AD Application Proxy
    D: Azure Virtual WAN
  answer: B
  user_answer: B
  user_result: correct
  explanation: |
    B, service endpoints, is correct. Enable an Azure Storage service
    endpoint on VM1's subnet. Its service-specific routes send storage
    traffic directly across the Microsoft backbone, bypassing the
    forced-tunneling route through the on-premises VPN gateway.
    Service endpoint routes take precedence over BGP and user-defined
    routes for the matching service address prefixes.

    A, Application Gateway, routes HTTP/HTTPS requests to application
    backends rather than configuring a direct subnet-to-storage route.
    C, Azure AD Application Proxy (now Microsoft Entra Application Proxy),
    publishes on-premises web applications. D, Azure Virtual WAN, provides
    managed network connectivity and routing but is not the service
    endpoint configuration required by this scenario.

    This repeats question 100's scenario with different distractors.
    Exam takeaway: forced tunneling plus direct backbone access to Azure
    Storage points to a service endpoint on the VM's subnet.

    [Microsoft Learn: Virtual network service endpoints](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoints-overview)

- id: '134'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  question: |
    You create an Azure VM named VM1 that runs Windows Server 2019.
    VM1 is configured as shown in the exhibit:

    | Setting | Value |
    | --- | --- |
    | Resource group | RG5 |
    | Status | Stopped (deallocated) |
    | Location | East US (Zone 1) |
    | Availability zone | 1 |
    | Operating system | Windows |
    | Size | Standard DS1 v2 (1 vCPU, 3.5 GiB memory) |
    | Public IP address | 20.115.52.215 |
    | Virtual network/subnet | VNET1/default |
    | DNS name | Not configured |
    | Computer name | VM1 |
    | Publisher | MicrosoftWindowsServer |
    | Private IP address | 10.1.0.4 |

    You need to enable Desired State Configuration for VM1.
    What should you do first?
  choices:
    A: Connect to VM1.
    B: Start VM1.
    C: Capture a snapshot of VM1.
    D: Configure a DNS name for VM1.
  answer: B
  user_answer: B
  user_result: correct
  explanation: |
    B, Start VM1, is correct. The exhibit shows that VM1 is stopped and
    deallocated. The guest OS and Azure VM Agent must be running for the
    DSC extension to be installed and execute its configuration. Start
    the VM before enabling DSC.

    A is not the first step because a stopped VM cannot accept a remote
    session, and a manual connection is not required to deploy the DSC
    extension. C is not a prerequisite for enabling DSC. D is not required
    because DSC extension deployment does not depend on a public DNS name.

    Exam takeaway: check the VM's power state in the exhibit; a stopped,
    deallocated VM must be started before guest extensions can execute.

    [Microsoft Learn: Azure VM extensions](https://learn.microsoft.com/en-us/azure/virtual-machines/extensions/overview)
    [Microsoft Learn: DSC extension overview](https://learn.microsoft.com/en-us/azure/virtual-machines/extensions/dsc-overview)

- id: '135'
  skill: Deploy and manage Azure compute resources
  sub-skill: Provision and manage containers in the Azure portal
  question: |
    HOTSPOT

    You have an Azure subscription that contains the virtual networks shown below.

    | Name | Location | IP address space | Subnet |
    | --- | --- | --- | --- |
    | VNet1 | East US | 10.1.128.0/23 | Subnet1 |
    | VNet2 | East US | 192.168.0.0/16 | Subnet21, Subnet23 |
    | VNet3 | East US | 172.16.0.0/16 | Subnet3 |

    The subnets have the following IP address spaces.

    | Name | IP address space |
    | --- | --- |
    | Subnet1 | 10.1.128.0/24 |
    | Subnet21 | 192.168.0.0/17 |
    | Subnet22 | 192.168.128.0/17 |
    | Subnet3 | 172.16.1.0/24 |

    You plan to create a container app named contapp1 in East US.
    You need to create a container app environment named con-env1 that:
    - Uses its own virtual network.
    - Uses its own subnet.
    - Is connected to the smallest possible subnet.

    To which virtual networks can you connect con-env1, and which subnet
    mask should you use? Select the appropriate options.
    NOTE: Each correct selection is worth one point.
  choices:
    Virtual network:
      - VNet1 only
      - VNet2 only
      - VNet3 only
      - VNet1 or VNet2 only
      - VNet2 or VNet3 only
      - VNet1 or VNet3 only
      - VNet1, VNet2, or VNet3
    Subnet mask:
      - /16
      - /23
      - /24
      - /26
      - /28
  answer:
    Virtual network: VNet3 only
    Subnet mask: /23
  user_answer:
    Virtual network: VNet1 only
    Subnet mask: /24
  user_result: incorrect
  explanation: |
    The intended legacy exam answers are VNet3 only and /23. A legacy
    Consumption-only Container Apps environment requires a dedicated
    subnet of /23 or larger. The subnet must not overlap existing subnets.

    VNet1's /23 contains two /24 blocks. Subnet1 occupies 10.1.128.0/24,
    leaving only 10.1.129.0/24, too small for a new /23. VNet2's two /17
    blocks consume its entire /16, leaving no space for a new subnet.
    VNet3 has ample unused space outside 172.16.1.0/24, for example
    172.16.2.0/23. All VNets are in the required East US region.

    The exhibit inconsistently lists Subnet23 in the VNet table and
    Subnet22 in the subnet table. The intended interpretation is that
    the two listed 192.168.x.x /17 ranges belong to VNet2 and exhaust it.

    Current workload profiles environments require only /27 or larger.
    Under that environment type, VNet1 or VNet3 could accommodate a new
    dedicated subnet, and /26 is the smallest valid offered mask (/28
    is too small; /27 is not offered). Because the question does not
    specify environment type, its intended /23 answer reflects the
    older Consumption-only requirement rather than a universal rule.

    Exam takeaway: distinguish the VNet address space from free subnet
    space; an environment needs a new, non-overlapping dedicated subnet.

    [Microsoft Learn: Container Apps networking environment types](https://learn.microsoft.com/en-us/azure/container-apps/networking)
    [Microsoft Learn: Integrate a VNet with Container Apps](https://learn.microsoft.com/en-us/azure/container-apps/vnet-custom)

- id: '136'
  skill: Implement and manage virtual networking
  sub-skill: Configure secure access to virtual networks
  question: |
    You have an Azure subscription that contains the virtual networks
    shown in the following table.

    | Name | Location |
    | --- | --- |
    | Vnet1 | US East |
    | Vnet2 | US East |
    | Vnet3 | US East |
    | Vnet4 | UK South |
    | Vnet5 | UK South |
    | Vnet6 | UK South |
    | Vnet7 | Asia East |
    | Vnet8 | Asia East |
    | Vnet9 | Asia East |
    | Vnet10 | Asia East |

    All the virtual networks are peered. Each virtual network contains
    nine virtual machines.
    You need to configure secure RDP connections to the virtual machines
    by using Azure Bastion.
    What is the minimum number of Bastion hosts required?
  choices:
    A: '1'
    B: '3'
    C: '9'
    D: '10'
  answer: A
  user_answer: A
  user_result: correct
  explanation: |
    A, 1, is correct. A single Azure Bastion host can provide RDP/SSH
    connectivity to VMs in its own VNet and directly peered VNets.
    Bastion supports both same-region and global VNet peering, so the
    three regions do not require three separate hosts.

    Deploy Bastion in one VNet that is peered with all the target VNets.
    The 90 VMs do not require separate hosts or imply 90 simultaneous
    sessions. Concurrent session requirements could affect SKU and
    instance scaling, but no concurrency requirement is stated here.

    VNet peering is not transitive; the answer assumes the stated peering
    provides direct connectivity from the hosting VNet to each target
    VNet. Additional regional hosts can improve resilience, but they
    are not required for the minimum connectivity solution.

    Exam takeaway: one Bastion host can serve multiple peered VNets,
    including VNets in different regions through global peering.

    [Microsoft Learn: Bastion and VNet peering](https://learn.microsoft.com/en-us/azure/bastion/vnet-peering)

- id: '137'
  skill: Implement and manage virtual networking
  sub-skill: Configure secure access to virtual networks
  question: |
    HOTSPOT

    You have an Azure subscription that contains the following virtual networks.

    | Name | Location | Peered with |
    | --- | --- | --- |
    | VNet1 | East US | VNet2 |
    | VNet2 | East US | VNet1, VNet3 |
    | VNet3 | West US | VNet2 |

    The subscription contains the following virtual machines.

    | Name | Operating system | Connected to |
    | --- | --- | --- |
    | VM1 | Windows | VNet1 |
    | VM2 | Linux | VNet2 |
    | VM3 | Windows | VNet3 |

    Each virtual machine contains only a private IP address.
    You create an Azure Bastion for VNet1 as shown in the exhibit.

    | Setting | Value |
    | --- | --- |
    | Subscription | MSDN Platforms |
    | Resource group | RG1 |
    | Name | Bastion1 |
    | Region | East US |
    | Tier | Basic |
    | Instance count | 2 |
    | Virtual network | VNet1 |
    | Subnet | AzureBastionSubnet (10.0.2.0/24) |
    | Public IP address | Create new |
    | Public IP address name | VNet1-ip |
    | Public IP address SKU | Standard |
    | Assignment | Static |

    For each statement, select Yes if the statement is true. Otherwise, select No.
    NOTE: Each correct selection is worth one point.
  choices:
    The Remote Desktop Connection client (mstsc.exe) can be used to connect to VM1 through Bastion1.:
      - 'Yes'
      - 'No'
    The Azure portal can use SSH to connect to VM2 through Bastion1.:
      - 'Yes'
      - 'No'
    The Azure portal can be used to connect to VM3 through Bastion1.:
      - 'Yes'
      - 'No'
  answer:
    The Remote Desktop Connection client (mstsc.exe) can be used to connect to VM1 through Bastion1.: 'No'
    The Azure portal can use SSH to connect to VM2 through Bastion1.: 'Yes'
    The Azure portal can be used to connect to VM3 through Bastion1.: 'No'
  user_answer:
    The Remote Desktop Connection client (mstsc.exe) can be used to connect to VM1 through Bastion1.: 'Yes'
    The Azure portal can use SSH to connect to VM2 through Bastion1.: 'Yes'
    The Azure portal can be used to connect to VM3 through Bastion1.: 'No'
  user_result: incorrect
  explanation: |
    The correct answers are No, Yes, No. The second and third selections
    are correct; the first overlooks Bastion1's Basic SKU.

    VM1 with mstsc.exe: No. Basic supports browser-based RDP and SSH
    through the Azure portal. Native client connections require Standard
    or higher with Native Client Support enabled. VM1 can be accessed
    through the portal, but not with the native client through this
    Basic Bastion deployment.

    Native client access means using an application installed on your
    computer, such as Windows Remote Desktop (mstsc.exe) or a local SSH
    client, to connect to a VM through Bastion. Browser access instead
    displays the RDP/SSH session inside the Azure portal.

    | Access method | Client | Bastion requirement |
    | --- | --- | --- |
    | Browser access | RDP/SSH session inside the Azure portal | Basic or higher |
    | Native client access | Local Remote Desktop or SSH application | Standard or higher, with Native Client Support enabled |

    For example, running az network bastion rdp on your Windows computer
    establishes the connection through Bastion and launches Windows
    Remote Desktop instead of displaying the session in a browser.
    The target VM still needs only a private IP address. In this question,
    mstsc.exe is a native client, so Basic Bastion cannot support that
    connection method.

    VM2 through portal SSH: Yes. VM2 is Linux and its VNet2 is directly
    peered with VNet1, where Bastion1 resides. Basic supports portal SSH
    connections to VMs in directly peered VNets, assuming required
    permissions, NSG rules, and guest SSH configuration.

    VM3 through the portal: No. VNet1 is not directly peered with VNet3.
    VNet1-to-VNet2 and VNet2-to-VNet3 peerings do not provide transitive
    connectivity. The problem is the missing direct peering, not VM3's
    West US region: Bastion supports global VNet peering.

    Exam takeaway: Basic means browser-based clients; native clients
    require Standard. A chain of VNet peerings is not transitive.

    [Microsoft Learn: Bastion native client requirements](https://learn.microsoft.com/en-us/azure/bastion/connect-native-client-windows)
    [Microsoft Learn: Portal SSH through Bastion](https://learn.microsoft.com/en-us/azure/bastion/bastion-connect-vm-ssh-linux)
    [Microsoft Learn: VNet peering is not transitive](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-manage-peering)

- id: '138'
  tags: [must-review]
  skill: Implement and manage virtual networking
  sub-skill: Configure secure access to virtual networks
  question: |
    HOTSPOT

    You have an Azure subscription that contains the following virtual networks.

    | Name | Location |
    | --- | --- |
    | VNet1 | West Europe |
    | VNet2 | Southeast Asia |
    | VNet3 | South Central US |

    The subscription contains the following subnets.

    | Name | Virtual network | Service endpoint |
    | --- | --- | --- |
    | Subnet1 | VNet1 | None |
    | Subnet2 | VNet2 | Microsoft.Storage |
    | Subnet3 | VNet3 | Microsoft.Storage |
    | Subnet4 | VNet4 | None |

    The subscription contains the following storage accounts.

    | Name | Location | Kind |
    | --- | --- | --- |
    | storage1 | West Europe | StorageV2 |
    | storage2 | South Central US | BlobStorage |
    | storage3 | Southeast Asia | StorageV2 |

    You create a service endpoint policy named Policy1 in South Central US
    to allow connectivity to all the storage accounts in the subscription.
    For each statement, select Yes if true. Otherwise, select No.
    NOTE: Each correct selection is worth one point.
  choices:
    Policy1 can be applied to Subnet3.:
      - 'Yes'
      - 'No'
    Only storage1 and storage2 can be accessed from VNet2.:
      - 'Yes'
      - 'No'
    Only storage2 can be accessed from VNet3.:
      - 'Yes'
      - 'No'
  answer:
    Policy1 can be applied to Subnet3.: 'Yes'
    Only storage1 and storage2 can be accessed from VNet2.: 'No'
    Only storage2 can be accessed from VNet3.: 'No'
  user_answer:
    Policy1 can be applied to Subnet3.: 'Yes'
    Only storage1 and storage2 can be accessed from VNet2.: 'No'
    Only storage2 can be accessed from VNet3.: 'Yes'
  user_result: incorrect
  explanation: |
    The correct answers are Yes, No, No. The first two selections are
    correct; the third incorrectly treats the policy's region as a limit
    on the storage accounts it can allow.

    Policy1 can be applied to Subnet3: Yes. Policy1 and VNet3 are in
    South Central US and the same subscription, and Subnet3 has the
    Microsoft.Storage service endpoint. A policy must be in the same
    region and subscription as the VNet to which it is attached.

    Only storage1 and storage2 from VNet2: No. No policy attachment or
    storage firewall rule is stated that excludes storage3. In particular,
    storage3 is in Southeast Asia, the same region as VNet2. Creating
    Policy1 does not automatically apply it to other subnets, and its
    South Central US location prevents attaching it to VNet2.

    Only storage2 from VNet3: No. Policy1 allows all storage accounts in
    the subscription, not just those in its region. When a service endpoint
    policy is applied, the Storage endpoint scope is upgraded from regional
    to global. Therefore, if Policy1 is attached to Subnet3, all three
    listed accounts are allowed by the policy. Merely creating the policy
    does not itself impose restrictions either.

    Service endpoints and endpoint policies do not grant data authorization
    or override storage firewalls. These answers assume no additional
    access restrictions beyond the configuration shown. VNet4 appears in
    the subnet table without a location in the VNet table; it does not
    affect the statements being evaluated.

    Exam takeaway: the policy's region governs where it can be attached;
    its allowlist can include storage accounts across regions.

    [Microsoft Learn: Service endpoint policy scope and region requirements](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoint-policies-overview)

- id: '140'
  skill: Deploy and manage Azure compute resources
  sub-skill: Provision and manage containers in the Azure portal
  question: |
    You have an Azure subscription that contains a resource group named
    RG1 and a virtual network named VNet1.
    You plan to create an Azure container instance named container1.
    You need to be able to configure DNS name label scope reuse for container1.
    What should you configure for container1?
  choices:
    A: the private networking type
    B: the public networking type
    C: a new subnet on VNet1
    D: a confidential SKU
  answer: B
  user_answer: A
  user_result: incorrect
  explanation: |
    B, the public networking type, is correct. DNS name label scope reuse
    controls reuse of the Azure-provided public DNS name for a container
    group. Select public networking to configure its DNS label and reuse
    scope, such as tenant, subscription, or resource group.

    The reuse policy controls the generated hash in the public FQDN to
    help protect against subdomain takeover when resources are deleted
    and recreated. It does not configure private DNS resolution or grant
    network access to the container.

    A, private networking, deploys the container group into a VNet and
    does not support this public DNS label. C, a new subnet, supports VNet
    deployment rather than public DNS label reuse. D, a confidential SKU,
    concerns confidential computing rather than the networking setting
    required for DNS name label scope reuse.

    Exam takeaway: Azure Container Instances DNS name label scope reuse
    is a public networking feature, not a private VNet DNS setting.

    [Microsoft Learn: Container Instances DNS name reuse policy](https://learn.microsoft.com/en-us/azure/container-instances/how-to-reuse-dns-names)
    [Microsoft Learn: Container Instances VNet limitations](https://learn.microsoft.com/en-us/azure/container-instances/container-instances-virtual-network-concepts)

- id: '141'
  skill: Implement and manage virtual networking
  sub-skill: Configure name resolution and load balancing
  question: |
    HOTSPOT

    You have the Azure virtual machines shown in the following table.

    | Name | IP address | Virtual network |
    | --- | --- | --- |
    | VM1 | 10.0.0.4 | VNET1 |
    | VM2 | 172.16.0.4 | VNET2 |
    | VM3 | 192.168.0.4 | VNET3 |
    | VM4 | 192.168.0.5 | VNET3 |

    VNET1, VNET2, and VNET3 are peered.
    VM4 has a DNS server that is authoritative for a zone named contoso.com
    and contains the records shown in the following table.

    | Name | Type | Value |
    | --- | --- | --- |
    | Server1 | A | 131.107.3.3 |
    | Server2 | A | 131.107.3.4 |

    The virtual networks are configured to use the following DNS servers.

    | Virtual network | DNS server |
    | --- | --- |
    | VNET1 | Default (Azure-provided) |
    | VNET2 | Custom: 192.168.0.5 |
    | VNET3 | Custom: 192.168.0.5 |

    For each statement, select Yes if true. Otherwise, select No.
    NOTE: Each correct selection is worth one point.
  choices:
    From VM1, server1.contoso.com resolves to 131.107.3.3.:
      - 'Yes'
      - 'No'
    From VM2, server1.contoso.com resolves to 131.107.3.3.:
      - 'Yes'
      - 'No'
    From VM3, server2.contoso.com resolves to 131.107.2.4.:
      - 'Yes'
      - 'No'
  answer:
    From VM1, server1.contoso.com resolves to 131.107.3.3.: 'No'
    From VM2, server1.contoso.com resolves to 131.107.3.3.: 'Yes'
    From VM3, server2.contoso.com resolves to 131.107.2.4.: 'No'
  user_answer:
    From VM1, server1.contoso.com resolves to 131.107.3.3.: 'No'
    From VM2, server1.contoso.com resolves to 131.107.3.3.: 'Yes'
    From VM3, server2.contoso.com resolves to 131.107.2.4.: 'No'
  user_result: correct
  explanation: |
    The correct answers are No, Yes, No. All selections are correct.

    VM1: No. VNET1 uses Azure-provided DNS, which does not automatically
    query VM4's custom contoso.com zone merely because the VNets are
    peered. No forwarding or matching public DNS record is specified.

    VM2: Yes. VNET2 explicitly uses VM4 at 192.168.0.5 as its DNS server.
    With peering connectivity and DNS traffic allowed, VM4 returns the
    Server1 A record value 131.107.3.3.

    VM3: No. VNET3 also uses VM4, but the Server2 A record is 131.107.3.4,
    not 131.107.2.4. Read the record value carefully.

    These answers assume the VNet DNS settings are effective on the VMs,
    with no NIC-level override or additional firewall restriction. Peering
    supplies network connectivity, not automatic sharing of DNS settings
    or custom DNS zones. DNS resolution does not itself guarantee that
    the resolved server is reachable.

    Exam takeaway: identify which DNS server each VM queries, then check
    the exact A record value; peering does not configure DNS forwarding.

    [Microsoft Learn: Name resolution for Azure resources](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-name-resolution-for-vms-and-role-instances)

- id: '142'
  skill: Deploy and manage Azure compute resources
  sub-skill: Automate deployment of resources by using templates
  question: |
    DRAG DROP

    You have an Azure subscription that contains a resource group named RG1.
    You plan to create an Azure Resource Manager (ARM) template to deploy
    a new virtual machine named VM1. VM1 must support the capture of
    performance data.
    You need to specify resource dependencies for the ARM template.

    In which order should you deploy the resources? Move all resources
    from the list to the answer area and arrange them in the correct order.
  choices:
    - virtual machine
    - Azure Monitor extension
    - network interface
    - virtual network
  answer:
    - virtual network
    - network interface
    - virtual machine
    - Azure Monitor extension
  user_answer:
    - virtual network
    - network interface
    - virtual machine
    - Azure Monitor extension
  user_result: correct
  explanation: |
    The correct order is virtual network, network interface, virtual
    machine, then Azure Monitor extension. All selections are correct.

    The virtual network and its subnet must exist before the NIC can
    reference the subnet. The NIC must exist before VM1 can attach it.
    The monitoring extension is a child resource of VM1 and depends on
    the VM being provisioned so the guest agent can install and run it.

    Use ARM resource dependencies, such as dependsOn, to express this
    ordering. The order of objects in the template's resources array
    alone does not guarantee deployment order. ARM deploys independent
    resources in parallel and respects their declared dependencies.

    In a current Azure Monitor Agent deployment, performance data
    collection also requires an appropriate data collection rule and
    association; those resources are not among this question's choices.

    Exam takeaway: VNet/subnet -> NIC -> VM -> VM extension.

    [Microsoft Learn: ARM resource dependencies](https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/resource-dependency)

- id: '144'
  skill: Implement and manage virtual networking
  sub-skill: Configure secure access to virtual networks
  question: |
    You have an Azure subscription that contains the virtual networks
    shown in the following table.

    | Name | Region | Peers with |
    | --- | --- | --- |
    | VNet1 | West US | VNet2 |
    | VNet2 | West US | VNet1, VNet3 |
    | VNet3 | East US | VNet2 |

    The subscription contains the virtual machines shown in the following table.

    | Name | Connected to |
    | --- | --- |
    | VM1 | VNet1 |
    | VM2 | VNet2 |
    | VM3 | VNet3 |

    All the virtual machines have only private IP addresses.
    You deploy an Azure Bastion host named Bastion1 to VNet1.
    To which virtual machines can you connect through Bastion1?
  choices:
    A: VM1 only
    B: VM1 and VM2 only
    C: VM1 and VM3 only
    D: VM1, VM2, and VM3
  answer: B
  user_answer: B
  user_result: correct
  explanation: |
    B, VM1 and VM2 only, is correct. Bastion1 can connect to VM1 in its
    own VNet1 and VM2 in VNet2, which is directly peered with VNet1.
    The target VMs do not require public IP addresses.

    VM3 is in VNet3, which is peered only with VNet2. VNet peering is
    not transitive: VNet1-to-VNet2 and VNet2-to-VNet3 do not establish
    connectivity between VNet1 and VNet3. No additional transit routing
    or IP-based Bastion configuration is specified.

    VM3's East US region is not the blocker. Bastion supports global
    VNet peering. Adding direct peering between VNet1 and VNet3 would
    enable Bastion connectivity, assuming the required permissions and
    network rules allow it.

    Exam takeaway: Bastion reaches its own VNet and directly peered VNets;
    a chain of peerings does not automatically extend its reach.

    [Microsoft Learn: Bastion and VNet peering](https://learn.microsoft.com/en-us/azure/bastion/vnet-peering)
    [Microsoft Learn: VNet peering is not transitive](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-manage-peering)

- id: '146'
  skill: Monitor and maintain Azure resources
  sub-skill: Implement backup and recovery
  question: |
    You have an Azure subscription.
    You plan to migrate 50 virtual machines from VMware vSphere to the subscription.
    You create a Recovery Services vault.
    What should you do next?
  choices:
    A: Configure an extended network.
    B: Create a recovery plan.
    C: Deploy an Open Virtualization Application (OVA) template to vSphere.
    D: Configure a virtual network.
  answer: C
  user_answer: C
  user_result: correct
  explanation: |
    C is the intended answer for the Site Recovery workflow described
    by this question. Deploy the OVA template to vSphere to provision
    the on-premises configuration server, then register it with the
    Recovery Services vault and configure the VMware source environment.
    The configuration server coordinates communications with Azure and
    manages replication of the VMware VMs.

    A, an extended network, is not required to establish this replication
    infrastructure. B, a recovery plan, orchestrates failover of protected
    machines and is configured later. D, a target Azure VNet, is required
    before failover, but does not provision the on-premises replication
    appliance that is the next source-preparation step intended here.

    This question reflects the classic Site Recovery configuration-server
    workflow. Deployment terminology and appliance steps differ in newer
    architectures; the OVA answer should not be treated as a universal
    sequence for every modern VMware migration approach.

    Exam takeaway: Recovery Services vault plus VMware source preparation
    points to deploying and registering the on-premises OVA appliance.

    [Microsoft Learn: Deploy the Site Recovery configuration server](https://learn.microsoft.com/en-us/azure/site-recovery/vmware-azure-deploy-configuration-server)

- id: '147'
  tags: [must-review]
  skill: Implement and manage virtual networking
  sub-skill: Configure secure access to virtual networks
  question: |
    HOTSPOT

    You have an Azure subscription that contains the following virtual networks.

    | Name | Location | Peered with |
    | --- | --- | --- |
    | VNet1 | East US | VNet2 |
    | VNet2 | East US | VNet1 |

    Each virtual network has 50 connected virtual machines.
    You need to implement Azure Bastion. The solution must:
    - Support host scaling.
    - Support uploading and downloading files.
    - Support the virtual machines on both VNet1 and VNet2.
    - Minimize the number of addresses on the Azure Bastion subnet.

    How should you configure Azure Bastion? Select the appropriate options.
    NOTE: Each correct answer is worth one point.
  choices:
    Subnet size:
      - /24
      - /26
      - /28
      - /29
    Public IP:
      - Basic SKU with a dynamic allocation
      - Basic SKU with a static allocation
      - Standard SKU with a static allocation
  answer:
    Subnet size: /26
    Public IP: Standard SKU with a static allocation
  user_answer:
    Subnet size: /24
    Public IP: Standard SKU with a static allocation
  user_result: incorrect
  user_reasoning: |
    Selected /24 to support 100 VMs and Standard SKU with static allocation.
  explanation: |
    The correct selections are /26 and Standard SKU with a static
    allocation. The public IP selection is correct; /24 is unnecessarily
    large for the dedicated AzureBastionSubnet.

    AzureBastionSubnet must be /26 or larger to support host scaling.
    Among the offered sizes, /26 is the smallest supported subnet.
    It has 64 total addresses and 59 usable addresses after Azure's
    reservations. /28 and /29 are too small; /24 uses more addresses
    than required.

    The 100 target VMs remain in their existing workload subnets. They
    do not each consume an address in AzureBastionSubnet, which hosts
    Bastion infrastructure. One Bastion deployment can reach both VNets
    through their direct peering. Session concurrency determines host
    capacity requirements, not the total number of target VMs alone.

    Bastion requires a Standard SKU static public IP. The Bastion host
    itself also needs Standard or higher for host scaling and native
    client file transfer; this host SKU is separate from the public IP
    SKU. Enable Native Client Support for native RDP/SSH file transfer.

    Exam takeaway: minimum Bastion subnet for scaling is /26; target
    VM count does not determine the size of AzureBastionSubnet.

    [Microsoft Learn: Bastion host scaling](https://learn.microsoft.com/en-us/azure/bastion/configure-host-scaling)
    [Microsoft Learn: Bastion configuration settings](https://learn.microsoft.com/en-us/azure/bastion/configuration-settings)
    [Microsoft Learn: File transfer via native client](https://learn.microsoft.com/en-us/azure/bastion/vm-upload-download-native)

- id: '148'
  skill: Implement and manage virtual networking
  sub-skill: Configure and manage virtual networks in Azure
  question: |
    You have an Azure subscription that contains the virtual networks
    shown in the following table.

    | Name | Location |
    | --- | --- |
    | VNet1 | West US |
    | VNet2 | Central Europe |

    You need to ensure that all the traffic between VNet1 and VNet2
    traverses the Microsoft backbone network.
    What should you configure?
  choices:
    A: a private endpoint
    B: peering
    C: Express Route
    D: a route table
  answer: B
  user_answer: B
  user_result: correct
  explanation: |
    B, peering, is correct. Configure global virtual network peering
    because the VNets are in different regions. Traffic between peered
    VNets uses private IP addresses and traverses the Microsoft backbone.

    A, a private endpoint, provides private access to a particular service
    rather than general connectivity between two VNets. C, ExpressRoute,
    primarily connects an external network to Microsoft cloud services
    through a connectivity provider and is unnecessary for this direct
    VNet-to-VNet requirement. D, a route table, controls routing but does
    not itself establish connectivity between isolated VNets.

    The exhibit's Central Europe location is preserved as printed; the
    tested concept is connectivity between VNets in different regions.
    Peering requires non-overlapping VNet address spaces and appropriate
    network rules, which the question does not otherwise constrain.

    Exam takeaway: same-region VNet peering or cross-region global VNet
    peering carries inter-VNet traffic over the Microsoft backbone.

    [Microsoft Learn: Virtual network peering](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-peering-overview)

- id: '149'
  skill: Implement and manage virtual networking
  sub-skill: Configure and manage virtual networks in Azure
  question: |
    You have the Azure virtual networks shown in the following table.

    | Name | Address space | Subnet | Resource group Azure region |
    | --- | --- | --- | --- |
    | VNet1 | 10.11.0.0/16 | 10.11.0.0/17 | West US |
    | VNet2 | 10.11.0.0/17 | 10.11.0.0/25 | West US |
    | VNet3 | 10.10.0.0/22 | 10.10.1.0/24 | East US |
    | VNet4 | 192.168.16.0/22 | 192.168.16.0/24 | North Europe |

    Which virtual networks can you peer with VNet1?
  choices:
    A: VNet2, VNet3, and VNet4
    B: VNet2 only
    C: VNet3 and VNet4 only
    D: VNet2 and VNet3 only
  answer: C
  user_answer: C
  user_result: correct
  explanation: |
    C, VNet3 and VNet4 only, is correct. Peered VNets must have
    non-overlapping address spaces. Global VNet peering allows the
    networks to be in different regions.

    VNet1 spans 10.11.0.0 through 10.11.255.255. VNet2 spans 10.11.0.0
    through 10.11.127.255, entirely inside VNet1's address space, so
    VNet2 cannot be peered with VNet1.

    VNet3 spans 10.10.0.0 through 10.10.3.255, and VNet4 spans
    192.168.16.0 through 192.168.19.255. Neither overlaps VNet1, so
    both can be peered with it despite their different regions.

    Evaluate the entire VNet address spaces, not merely the allocated
    subnet ranges. Unused addresses still belong to a VNet's address space.

    Exam takeaway: non-overlapping VNet address spaces are required;
    different Azure regions do not prevent global VNet peering.

    [Microsoft Learn: VNet peering requirements](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-manage-peering)

- id: '150'
  skill: Deploy and manage Azure compute resources
  sub-skill: Provision and manage containers in the Azure portal
  question: |
    You have an Azure subscription.
    You are creating a new Azure container instance that will have the following settings:
    - Container name: cont1
    - SKU: Standard
    - OS type: Windows
    - Networking type: Public
    - Memory (GiB): 2.5
    - Number of CPU cores: 2

    You discover that the Private setting for Networking type is unavailable.
    You need to ensure that cont1 can be configured to use private networking.
    Which setting should you change?
  choices:
    A: Memory (GiB)
    B: Networking type
    C: Number of CPU cores
    D: OS type
    E: SKU
  answer: D
  user_answer: D
  user_result: correct
  explanation: |
    D, OS type, is the intended historical exam answer. At the time this
    question was written, VNet deployment supported Linux containers only.
    Change the OS type from Windows to Linux to make private VNet
    networking available, and use a compatible Linux container image.

    A and C change compute sizing but do not remove the OS restriction.
    B is the setting you ultimately want to select, but Private is
    unavailable until the incompatible OS choice is changed. E is not
    required because Standard SKU supports Linux VNet deployments.

    Current documentation states that VNet deployment supports both Linux
    and Windows containers in most supported regions. Therefore, changing
    OS type is no longer a universal prerequisite; this question reflects
    an older platform limitation.

    Exam takeaway for this older question: change Windows to Linux. For
    current deployments, verify regional support and networking requirements.

    [Microsoft Learn: Container Instances virtual network support](https://learn.microsoft.com/en-us/azure/container-instances/container-instances-virtual-network-concepts)
