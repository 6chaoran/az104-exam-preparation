- id: '031'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  question: |
    HOTSPOT -

    You have an Azure subscription that contains the resources shown in
    the following table.

    | Name | Type | Resource group | Location |
    | --- | --- | --- | --- |
    | RG1 | Resource group | Not applicable | Central US |
    | RG2 | Resource group | Not applicable | West US |
    | RG3 | Resource group | Not applicable | East US |
    | VMSS1 | Virtual machine scale set | RG1 | West US |

    VMSS1 is set to VM (virtual machines) orchestration mode.

    You need to deploy a new Azure virtual machine named VM1, and then
    add VM1 to VMSS1.

    Which resource group and location should you use to deploy VM1?
    To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  choices:
    Resource group:
      - RG1 only
      - RG2 only
      - RG1 or RG2 only
      - RG1, RG2, or RG3
    Location:
      - West US only
      - Central US only
      - Central US or West US only
      - East US, Central US, or West US
  answer:
    Resource group: RG1 only
    Location: West US only
  user_answer:
    Resource group: RG1, RG2, or RG3
    Location: West US only
  user_result: partially_correct
  learning_note: |
    A VM attached to a Flexible scale set must share its resource group
    and region. A resource group's metadata location does not dictate
    the regions of its contained resources. The location selection was
    correct; the scale set membership requirement restricts the group to RG1.
  explanation: |
    **RG1 only; West US only** is correct.

    VMSS1 belongs to RG1 and is deployed in West US. VM1 must share the
    scale set's resource group and region to be attached to it.

    The question's older VM orchestration mode terminology corresponds
    to Flexible orchestration, which manages standard Azure VM resources.
    This flexibility does not remove the same-resource-group restriction.
    Current documentation requires it for both newly created VMs associated
    with a scale set and existing VMs attached afterward.

    RG1's Central US location is the location of its resource group metadata.
    It does not force the contained resources into Central US, as demonstrated
    by VMSS1 already being in West US. RG2's matching West US metadata
    location does not make RG2 eligible for VMSS1 membership either.

    Your West US only selection is correct. RG1, RG2, or RG3 would generally
    be possible for a standalone VM, but adding VM1 to VMSS1 restricts its
    resource group to RG1.

    Remember: match the scale set's resource group and region; distinguish
    resource placement from resource group metadata location.

    [Microsoft Learn: Attach or detach VMs to or from a scale set](https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/virtual-machine-scale-sets-attach-detach-vm)
    [Microsoft Learn: Scale set orchestration modes](https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/virtual-machine-scale-sets-orchestration-modes)
- id: '032'
  skill: Implement and manage virtual networking
  sub-skill: Configure and manage virtual networks in Azure
  question: |
    HOTSPOT -

    You have an Azure subscription that contains three virtual networks
    named VNET1, VNET2, and VNET3.

    Peering for VNET1 is configured as shown in the following exhibit.

    | Name | Peering status | Peer | Gateway transit |
    | --- | --- | --- | --- |
    | Peering1 | Connected | VNET2 | Disabled |
    | Peering1 | Connected | VNET3 | Disabled |

    Peering for VNET2 is configured as shown in the following exhibit.

    | Name | Peering status | Peer | Gateway transit |
    | --- | --- | --- | --- |
    | Peering1 | Connected | VNET1 | Disabled |

    Peering for VNET3 is configured as shown in the following exhibit.

    | Name | Peering status | Peer | Gateway transit |
    | --- | --- | --- | --- |
    | Peering1 | Connected | VNET1 | Disabled |

    How can packets be routed between the virtual networks? To answer,
    select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  choices:
    Packets from VNET1 can be routed to:
      - VNET2 only
      - VNET3 only
      - VNET2 and VNET3
    Packets from VNET2 can be routed to:
      - VNET1 only
      - VNET3 only
      - VNET1 and VNET3
  answer:
    Packets from VNET1 can be routed to: VNET2 and VNET3
    Packets from VNET2 can be routed to: VNET1 only
  user_answer:
    Packets from VNET1 can be routed to: VNET2 and VNET3
    Packets from VNET2 can be routed to: VNET1 only
  user_result: correct
  learning_note: |
    VNet peering is nontransitive. Direct peers can communicate, but sharing
    a common peer does not create connectivity between them. Gateway transit
    is not required for ordinary traffic across a direct peering.
  explanation: |
    **VNET2 and VNET3; VNET1 only** is correct.

    VNET1 has connected, direct peerings with both VNET2 and VNET3.
    Packets from VNET1 can therefore be routed to either network through
    its respective peering, assuming traffic is permitted by security rules.

    VNET2 has a direct peering with VNET1 only. VNet peering is nontransitive,
    so the VNET2-to-VNET1 and VNET1-to-VNET3 peerings do not automatically
    provide a VNET2-to-VNET3 route. VNET2 would need a direct peering with
    VNET3 or an explicitly configured transit routing solution.

    Gateway transit is disabled on all shown peerings, but that does not
    prevent ordinary communication between direct peers. Gateway transit
    controls use of a VPN or ExpressRoute gateway in a peered VNet; it is
    not a prerequisite for direct peering traffic. Simply enabling gateway
    transit would not make these peering relationships transitive.

    The exhibit shows both VNET1 peering entries named Peering1. Those
    labels are transcribed as displayed; the distinct peer destinations
    and connected status establish the topology tested by the question.

    Remember: A peers with B and C does not mean B peers with C.

    [Microsoft Learn: VNet peering requirements and nontransitivity](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-manage-peering)
    [Microsoft Learn: VNet peering and gateway transit](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-peering-overview)
- id: '033'
  skill: Implement and manage virtual networking
  sub-skill: Configure and manage virtual networks in Azure
  question: |
    Note: This question is part of a series of questions that present the
    same scenario. Each question in the series contains a unique solution
    that might meet the stated goals. Some question sets might have more
    than one correct solution, while others might not have a correct solution.

    After you answer a question in this section, you will NOT be able to
    return to it. As a result, these questions will not appear in the review screen.

    You have a computer named Computer1 that has a point-to-site VPN
    connection to an Azure virtual network named VNet1. The point-to-site
    connection uses a self-signed certificate.

    From Azure, you download and install the VPN client configuration
    package on a computer named Computer2.

    You need to ensure that you can establish a point-to-site VPN connection
    to VNet1 from Computer2.

    Solution: You modify the Azure Active Directory (Azure AD)
    authentication policies.

    Does this meet the goal?
  choices:
    A: 'Yes'
    B: 'No'
  answer: B
  user_answer: B
  user_result: correct
  learning_note: |
    Certificate-authenticated point-to-site VPN requires a client certificate
    and its private key on each connecting computer. Installing the VPN
    configuration package alone does not supply this credential. Changing
    Microsoft Entra authentication policies does not meet that requirement.
  explanation: |
    **B — No** is correct. The configured VPN uses certificate authentication,
    so modifying Azure AD authentication policies does not supply Computer2
    with the credential required by the VPN gateway.

    Computer2 must have a valid client certificate with its private key,
    signed by a root certificate whose public certificate is trusted by
    the Azure VPN gateway. The downloaded VPN client configuration package
    provides the connection settings; it does not install the client certificate.

    Export an appropriate client certificate with its private key as a PFX
    file and import it into Computer2's current-user Personal certificate
    store, or generate a separate client certificate from the same trusted
    root and install it on Computer2. A separate certificate permits
    individual revocation. Installing only the public root certificate
    is not a substitute for the client certificate and private key.

    Microsoft Entra ID authentication is a different VPN authentication
    method. Changing its policies alone does not convert this existing
    certificate-authenticated configuration or meet the stated goal.
    Azure AD is the former name of Microsoft Entra ID.

    Remember: VPN profile supplies settings; client certificate supplies identity.

    [Microsoft Learn: Generate and export certificates for point-to-site VPN](https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-certificates-point-to-site)
- id: '034'
  skill: Implement and manage virtual networking
  sub-skill: Configure and manage virtual networks in Azure
  question: |
    Note: This question is part of a series of questions that present the
    same scenario. Each question in the series contains a unique solution
    that might meet the stated goals. Some question sets might have more
    than one correct solution, while others might not have a correct solution.

    After you answer a question in this section, you will NOT be able to
    return to it. As a result, these questions will not appear in the review screen.

    You have a computer named Computer1 that has a point-to-site VPN
    connection to an Azure virtual network named VNet1. The point-to-site
    connection uses a self-signed certificate.

    From Azure, you download and install the VPN client configuration
    package on a computer named Computer2.

    You need to ensure that you can establish a point-to-site VPN connection
    to VNet1 from Computer2.

    Solution: You join Computer2 to Azure Active Directory (Azure AD).

    Does this meet the goal?
  choices:
    A: 'Yes'
    B: 'No'
  answer: B
  user_answer: A
  user_result: incorrect
  learning_note: |
    Joining a computer to Microsoft Entra ID does not install the client
    certificate and private key required by a certificate-authenticated
    point-to-site VPN. Evaluate the proposed solution against the configured
    authentication method.
  explanation: |
    **B — No** is correct. Joining Computer2 to Azure AD does not satisfy
    the existing VPN gateway's certificate authentication requirement.

    Computer2 needs a valid client certificate with its private key,
    signed by a root certificate trusted by the Azure VPN gateway.
    Installing the VPN client configuration package supplies connection
    settings, but not the required client certificate. Joining Azure AD
    does not supply that certificate either.

    Export an appropriate client certificate with its private key as a PFX
    file and install it on Computer2, or issue and install a separate client
    certificate from the same trusted root. These actions provide the
    credential required for this certificate-authenticated connection.

    Microsoft Entra ID authentication is a separate VPN authentication
    option that requires gateway and client configuration. A device join
    alone does not change this VPN's authentication method.
    Azure AD is the former name of Microsoft Entra ID.

    Remember: directory membership is not a substitute for a VPN client certificate.

    [Microsoft Learn: Install a point-to-site VPN client certificate](https://learn.microsoft.com/en-us/azure/vpn-gateway/point-to-site-how-to-vpn-client-install-azure-cert)
- id: '035'
  skill: Manage Azure identities and governance
  sub-skill: Manage Azure subscriptions and governance
  question: |
    Note: This question is part of a series of questions that present the
    same scenario. Each question in the series contains a unique solution
    that might meet the stated goals. Some question sets might have more
    than one correct solution, while others might not have a correct solution.

    After you answer a question in this section, you will NOT be able to
    return to it. As a result, these questions will not appear in the review screen.

    You have an Azure subscription that contains 10 virtual networks.
    The virtual networks are hosted in separate resource groups.

    Another administrator plans to create several network security groups
    (NSGs) in the subscription.

    You need to ensure that when an NSG is created, it automatically blocks
    TCP port 8080 between the virtual networks.

    Solution: You create a resource lock, and then you assign the lock
    to the subscription.

    Does this meet the goal?
  choices:
    A: 'Yes'
    B: 'No'
  answer: B
  user_answer: B
  user_result: correct
  learning_note: |
    Resource locks restrict management operations such as updates and
    deletions. They neither generate NSG security rules nor filter network
    packets. Subscription-wide configuration governance is a different
    requirement from protecting resources against changes.
  explanation: |
    **B — No** is correct. A subscription-level resource lock does not
    automatically add a deny rule to newly created NSGs.

    CanNotDelete prevents deletion while permitting authorized modifications.
    ReadOnly restricts management-plane writes and deletion. Neither lock
    type defines a protocol, port, source, destination, or network action.
    A ReadOnly lock could obstruct resource creation or configuration,
    but blocking administrative writes is not the requested traffic control.

    Locks apply to control-plane operations and do not filter network
    traffic. The goal requires an appropriate NSG deny rule and association
    with the relevant subnet or NIC. Automatic deployment or enforcement
    of that configuration across resource groups requires a suitable
    governance or automation mechanism, such as a correctly designed
    Azure Policy assignment; the proposed lock supplies none of this.

    The subscription scope covers the separate resource groups, but a broad
    scope does not change what the lock does. Evaluate the proposed solution
    itself: it cannot ensure that new NSGs block TCP port 8080.

    Remember: locks protect resource configuration; NSG rules filter packets.

    [Microsoft Learn: Resource locks and their scope](https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources)
- id: '036'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  question: |
    You have an Azure subscription named Subscription1. Subscription1
    contains a virtual machine named VM1.

    You have a computer named Computer1 that runs Windows 10.
    Computer1 is connected to the Internet.

    You add a network interface named vm1173 to VM1 as shown in the exhibit.
    (Click the Exhibit tab.)

    | Exhibit setting | Value |
    | --- | --- |
    | Network interface | vm1173 |
    | Virtual network/subnet | RG1-vnet/default |
    | Public IP | VM1-ip |
    | Private IP | 10.0.0.5 |
    | Accelerated networking | Disabled |
    | Network security group | VM1-nsg, attached to network interface vm1173 |
    | NSG associations | 0 subnets, 1 network interface |

    Inbound port rules:

    | Priority | Name | Port | Protocol | Source | Destination | Action |
    | --- | --- | --- | --- | --- | --- | --- |
    | 300 | RDP | 3389 | TCP | Any | Any | Allow |
    | 65000 | AllowVnetInBound | Any | Any | VirtualNetwork | VirtualNetwork | Allow |
    | 65001 | AllowAzureLoadBalancerInBound | Any | Any | AzureLoadBalancer | Any | Allow |
    | 65500 | DenyAllInBound | Any | Any | Any | Any | Deny |

    The default-rule names and service tags that are truncated in the
    exhibit are expanded to their standard Azure names in this table.

    From Computer1, you attempt to connect to VM1 by using Remote Desktop,
    but the connection fails.

    You need to establish a Remote Desktop connection to VM1.

    What should you do first?
  choices:
    A: Change the priority of the RDP rule.
    B: Attach a network interface.
    C: Delete the DenyAllInBound rule.
    D: Start VM1.
  answer: D
  user_answer: D
  user_result: correct
  learning_note: |
    Adding a NIC to an existing Azure VM requires stopping and deallocating
    the VM, followed by starting it again. The RDP allow rule at priority
    300 already takes precedence over the default deny at 65500.
  explanation: |
    **D — Start VM1** is the intended answer. Attaching a network interface
    to an existing VM requires it to be stopped and deallocated. After
    attaching vm1173, start VM1 so the operating system and RDP service run.

    The exhibit does not explicitly display VM1's power state. The answer
    relies on the stated NIC attachment workflow and assumes the VM has
    not yet been restarted after attachment.

    A is unnecessary: RDP on TCP 3389 is allowed at priority 300, which
    is evaluated before DenyAllInBound at 65500. Lower priority numbers
    are processed first. B is unnecessary because vm1173 is already attached.
    C is incorrect because default NSG rules cannot be deleted, and the
    matching higher-priority RDP allow already overrides the default deny.

    Remember: after NIC attachment, restart the deallocated VM before
    attempting a guest connection.

    [Microsoft Learn: Add or remove VM network interfaces](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-network-interface-vm)
    [Microsoft Learn: NSG rule priorities and defaults](https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview)
- id: '037'
  skill: Implement and manage virtual networking
  sub-skill: Configure and manage virtual networks in Azure
  question: |
    You have the Azure virtual machines shown in the following table.

    | Name | IP address | Connected to |
    | --- | --- | --- |
    | VM1 | 10.1.0.4 | VNET1/Subnet1 |
    | VM2 | 10.1.10.4 | VNET1/Subnet2 |
    | VM3 | 172.16.0.4 | VNET2/SubnetA |
    | VM4 | 10.2.0.8 | VNET3/SubnetB |

    A DNS service is installed on VM1.

    You configure the DNS servers settings for each virtual network as
    shown in the following exhibit.

    | DNS servers setting | Value |
    | --- | --- |
    | Default (Azure-provided) | Not selected |
    | Custom | Selected |
    | DNS server IP address | 10.1.0.4 |

    You need to ensure that all the virtual machines can resolve DNS names
    by using the DNS service on VM1.

    What should you do?
  choices:
    A: Configure a conditional forwarder on VM1.
    B: Add service endpoints on VNET1.
    C: Add service endpoints on VNET2 and VNET3.
    D: Configure peering between VNET1, VNET2, and VNET3.
  answer: D
  user_answer: D
  user_result: correct
  learning_note: |
    Configuring a DNS server IP does not establish network reachability.
    Peering supplies a path to VM1. A conditional forwarder sends queries
    for a specified DNS domain to another DNS server after VM1 receives
    them; it cannot connect clients in isolated VNets to VM1.
  explanation: |
    **D — Configure peering between VNET1, VNET2, and VNET3** is correct.

    Every VNet already uses 10.1.0.4 as its custom DNS server. VM2 is in
    VNET1 with VM1, while VM3 and VM4 need connectivity from their separate
    VNets to VM1. Direct peerings VNET1-to-VNET2 and VNET1-to-VNET3 provide
    the required paths. A VNET2-to-VNET3 peering is not required solely
    for this shared DNS service. Permit UDP and TCP port 53 through the
    applicable NSGs and VM1's firewall, and ensure clients have picked up
    the custom DNS settings.

    Option A: A conditional forwarder is a domain-specific forwarding rule
    on a DNS server. For example, configure VM1 to forward queries ending
    in corp.example.com to a DNS server at 192.168.1.10 that resolves that
    namespace. A query for app.corp.example.com follows this path:

    Client VM -> VM1 -> DNS server at 192.168.1.10 -> VM1 -> client VM.

    Queries for other domains do not match that conditional forwarder.
    A normal forwarder handles unresolved queries more generally. Conditional
    forwarding is useful for on-premises domains, partner namespaces, or
    other domains handled by designated DNS servers. The forwarder target
    must itself be reachable and capable of resolving those names.

    A conditional forwarder on VM1 affects how VM1 processes queries it
    receives. It cannot provide the missing network path from VM3 or VM4
    to VM1. No separate namespace or upstream DNS server is specified here,
    so configuring a conditional forwarder does not meet this requirement.

    B and C are incorrect because service endpoints provide access to
    supported Azure services; they do not connect VNets to a VM-hosted
    DNS server.

    Remember: clients must reach the DNS server before its forwarding
    rules can help resolve a query.

    [Microsoft Learn: VNet peering and custom DNS](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-manage-peering)
    [Microsoft Learn: DNS forwarding and conditional forwarders](https://learn.microsoft.com/en-us/windows-server/networking/dns/forwarding)
- id: '038'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  question: |
    HOTSPOT -

    You have an Azure subscription that contains the Azure virtual machines
    shown in the following table.

    | Name | Connected to subnet |
    | --- | --- |
    | VM1 | 172.16.1.0/24 |
    | VM2 | 172.16.2.0/24 |

    You add inbound security rules to a network security group (NSG)
    named NSG1 as shown in the following table.

    | Priority | Source | Destination | Protocol | Port | Action |
    | --- | --- | --- | --- | --- | --- |
    | 100 | 172.16.1.0/24 | 172.16.2.0/24 | TCP | Any | Allow |
    | 101 | Any | 172.16.2.0/24 | TCP | Any | Deny |

    You run Azure Network Watcher as shown in the following exhibit.

    | First check setting | Value |
    | --- | --- |
    | Source resource group | RG1 |
    | Source type | Virtual machine |
    | Source virtual machine | VM1 |
    | Destination selection | Select a virtual machine |
    | Destination resource group | RG1 |
    | Destination virtual machine | VM2 |
    | Probe protocol | TCP |
    | Destination port | 8080 |
    | Status | Unreachable |
    | Agent extension version | 1.4 |
    | Source virtual machine in results | VM1 |

    You run Network Watcher again as shown in the following exhibit.

    | Second check setting | Value |
    | --- | --- |
    | Source type | Virtual machine |
    | Source virtual machine | VM1 |
    | Destination selection | Select a virtual machine |
    | Destination resource group | RG1 |
    | Destination virtual machine | VM2 |
    | Probe protocol | ICMP |
    | Status | Reachable |
    | Agent extension version | 1.4 |
    | Source virtual machine in results | VM1 |
    | Results view | Grid view |

    The second check shows these hops:

    | Name | IP address | Status | Next hop IP address | RTT from source |
    | --- | --- | --- | --- | --- |
    | VM1 | 172.16.1.4 | Success | 172.16.2.4 | 0 |
    | VM2 | 172.16.2.4 | Success | - | - |

    For each of the following statements, select Yes if the statement
    is true. Otherwise, select No.

    NOTE: Each correct selection is worth one point.
  choices:
    NSG1 limits VM1 traffic:
      - 'Yes'
      - 'No'
    NSG1 applies to VM2:
      - 'Yes'
      - 'No'
    VM1 and VM2 connect to the same virtual network:
      - 'Yes'
      - 'No'
  answer:
    NSG1 limits VM1 traffic: 'No'
    NSG1 applies to VM2: 'Yes'
    VM1 and VM2 connect to the same virtual network: 'Yes'
  user_answer:
    NSG1 limits VM1 traffic: 'No'
    NSG1 applies to VM2: 'Yes'
    VM1 and VM2 connect to the same virtual network: 'Yes'
  user_result: correct
  user_reasoning: |
    Selected No for the first statement because NSG1 limits VM2.
    Asked why TCP 8080 fails while ICMP succeeds despite the allow rule
    permitting TCP from VM1's subnet to VM2's subnet.
  learning_note: |
    The attempt matches the intended answer, which relies on unstated
    topology and NSG association assumptions. An NSG allow is not proof of
    end-to-end TCP connectivity: the destination service must listen and
    the guest firewall and other applicable controls must permit traffic.
    ICMP success does not prove TCP port availability or same-VNet membership.
  explanation: |
    **No, Yes, Yes** is the intended answer, with evidence limitations.

    Your interpretation of the TCP rule is correct. Traffic from
    172.16.1.4 to 172.16.2.4 on TCP 8080 matches priority 100 and is allowed
    by NSG1. Processing stops at that matching rule. Priority 101 does
    not override the earlier allow; it denies other matching TCP sources.

    A TCP check requires a successful connection to the specified service
    port. ICMP checks use a different protocol and do not require a TCP
    listener. VM2 can respond to ICMP while TCP 8080 is unreachable because
    no process listens on port 8080, the guest firewall blocks it, or another
    applicable security control denies TCP. These are possible explanations,
    not a diagnosis established by the screenshots. Inspect detailed Network
    Watcher results for NoListenerOnDestination, GuestFirewall, or NSG issues.

    The custom NSG1 rules shown are inbound rules targeting VM2's subnet,
    rather than inbound restrictions targeting VM1. This supports the
    intended No for NSG1 limits VM1 traffic. It does not imply that all
    VM1 traffic bypasses NSGs or that NSG1 has no other rules.

    The intended Yes for NSG1 applies to VM2 assumes an association with
    VM2's subnet or NIC. A destination prefix in a rule does not itself
    associate an NSG with a VM; no association is displayed in the exhibits.

    The intended Yes for same-VNet membership assumes the direct path
    represents two subnets within one VNet. Neither their private IP ranges
    nor ICMP success conclusively establishes that: peered VNets can also
    have this connectivity. Actual VNet resource IDs would confirm membership.

    Thus the expected answers are preserved, but the supplied exhibits do
    not independently prove the second and third statements. The failed
    TCP check must not be attributed to NSG1's displayed deny rule.

    Remember: allowed by an NSG is not the same as an available TCP service.

    [Microsoft Learn: Connection troubleshoot and detected issues](https://learn.microsoft.com/en-us/azure/network-watcher/connection-troubleshoot-overview)
    [Microsoft Learn: NSG evaluation and priority](https://learn.microsoft.com/en-us/troubleshoot/azure/virtual-network/virtual-network-troubleshoot-nsg-blocking-traffic)
    [Microsoft Learn: NSG associations and filtering](https://learn.microsoft.com/en-us/azure/virtual-network/network-security-group-how-it-works)
- id: '039'
  skill: Implement and manage virtual networking
  sub-skill: Configure secure access to virtual networks
  question: |
    You have the Azure virtual network named VNet1 that contains a subnet
    named Subnet1. Subnet1 contains three Azure virtual machines. Each
    virtual machine has a public IP address.

    The virtual machines host several applications that are accessible
    over port 443 to users on the Internet.

    Your on-premises network has a site-to-site VPN connection to VNet1.

    You discover that the virtual machines can be accessed by using the
    Remote Desktop Protocol (RDP) from the Internet and from the
    on-premises network.

    You need to prevent RDP access to the virtual machines from the
    Internet, unless the RDP connection is established from the
    on-premises network. The solution must ensure that all the applications
    can still be accessed by the Internet users.

    What should you do?
  choices:
    A: Modify the address space of the local network gateway.
    B: Create a deny rule in a network security group (NSG) that is linked to Subnet1.
    C: Remove the public IP addresses from the virtual machines.
    D: Modify the address space of Subnet1.
  answer: B
  user_answer: B
  user_result: correct
  learning_note: |
    An inbound NSG deny targeting Internet-origin RDP can block port 3389
    while preserving HTTPS on 443 and RDP from on-premises private prefixes
    through the VPN. Rule priority and source scope determine the result.
  explanation: |
    **B — Create a deny rule in an NSG linked to Subnet1** is correct.
    A subnet association applies the rule to all three VMs.

    Deny inbound TCP traffic from the Internet service tag to the VMs on
    destination port 3389. Choose a priority that evaluates this deny before
    any existing broad RDP allow. Retain the rules allowing Internet HTTPS
    on TCP 443 and on-premises RDP through the site-to-site VPN.

    VPN traffic normally retains its on-premises private source addresses.
    Connected on-premises address ranges are included in the VirtualNetwork
    service tag. Ensure an applicable allow exists for those sources; using
    the actual on-premises prefixes provides a more specific RDP allow.
    All applicable subnet and NIC NSGs must permit the required traffic.

    If UDP-based RDP transport is enabled, deny Internet UDP 3389 as well,
    for example using Any protocol on destination port 3389. TCP is required
    for the conventional RDP connection discussed here.

    A changes the representation of on-premises address ranges for routing,
    rather than selectively filtering RDP. C removes the public endpoints
    used by Internet application users and violates the HTTPS requirement.
    D changes subnet addressing rather than implementing port-specific access.

    Remember: restrict the RDP source and port while retaining HTTPS access.

    [Microsoft Learn: NSG rules and priorities](https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview)
    [Microsoft Learn: NSG filtering and associations](https://learn.microsoft.com/en-us/azure/virtual-network/network-security-group-how-it-works)
    [Microsoft Learn: VirtualNetwork tag includes connected on-premises ranges](https://learn.microsoft.com/en-us/azure/network-watcher/diagnose-network-security-rules)
- id: '040'
  tags:
    - must-review
  skill: Implement and manage virtual networking
  sub-skill: Configure secure access to virtual networks
  question: |
    You have an Azure subscription that contains the resources in the
    following table.

    | Name | Type |
    | --- | --- |
    | ASG1 | Application security group |
    | NSG1 | Network security group (NSG) |
    | Subnet1 | Subnet |
    | VNet1 | Virtual network |
    | NIC1 | Network interface |
    | VM1 | Virtual machine |

    Subnet1 is associated to VNet1. NIC1 attaches VM1 to Subnet1.

    You need to apply ASG1 to VM1.

    What should you do?
  choices:
    A: Associate NIC1 to ASG1
    B: Modify the properties of ASG1
    C: Modify the properties of NSG1
  answer: A
  user_answer: B
  user_result: incorrect
  learning_note: |
    ASG membership is configured on a NIC's IP configuration. Editing an
    ASG's properties or an NSG rule does not add a VM to the group. ASGs
    group endpoints; NSG rules referencing them enforce traffic filtering.
  explanation: |
    **A — Associate NIC1 to ASG1** is correct.

    An application security group groups network interface IP configurations
    so NSG rules can refer to application roles instead of individual IP
    addresses. Associate NIC1's applicable IP configuration with ASG1 to
    make VM1 an endpoint represented by the group.

    B is incorrect because modifying ASG1's properties does not assign
    VM1's NIC membership. The association is stored on the NIC's IP
    configuration. C is incorrect because modifying NSG1 can create or
    change a rule referencing ASG1, but does not add NIC1 to that ASG.

    ASG membership alone does not allow or deny packets. A security rule
    in an NSG must reference the ASG as a source or destination, and the
    NSG must be associated with the relevant subnet or NIC, to enforce
    that rule on traffic.

    Remember: ASGs identify groups of endpoints; NSGs contain filtering rules.

    [Microsoft Learn: Associate network interfaces with an ASG](https://learn.microsoft.com/en-us/azure/virtual-network/tutorial-filter-network-traffic#associate-network-interfaces-to-an-asg)
    [Microsoft Learn: Configure ASGs on NIC IP configurations](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-network-interface)
- id: '041'
  skill: Implement and manage virtual networking
  sub-skill: Configure and manage virtual networks in Azure
  question: |
    You have an Azure subscription named Subscription1 that contains an
    Azure virtual network named VNet1. VNet1 connects to your on-premises
    network by using Azure ExpressRoute.

    You plan to prepare the environment for automatic failover in case
    of ExpressRoute failure.

    You need to connect VNet1 to the on-premises network by using a
    site-to-site VPN. The solution must minimize cost.

    Which three actions should you perform? Each correct answer presents
    part of the solution.

    NOTE: Each correct selection is worth one point.
  choices:
    A: Create a connection
    B: Create a local site VPN gateway
    C: Create a VPN gateway that uses the VpnGw1 SKU
    D: Create a gateway subnet
    E: Create a VPN gateway that uses the Basic SKU
  answer: ABC
  user_answer: ACD
  user_result: partially_correct
  learning_note: |
    Existing ExpressRoute connectivity already requires a GatewaySubnet.
    The VPN gateway shares that subnet, which must be adequately sized.
    Add a local network gateway and connection, and use a non-Basic VPN
    gateway because Basic does not support ExpressRoute/VPN coexistence.
  explanation: |
    **A, B, and C** are correct. A and C in your attempt are correct;
    replace D with B. This is a multi-select question, not an ordered sequence.

    A creates the site-to-site connection between the Azure VPN gateway
    and the local network gateway representing the on-premises site.

    B uses the question's wording local site VPN gateway. The intended
    Azure resource is a local network gateway, which specifies the
    on-premises VPN endpoint and address ranges. The on-premises VPN
    device must also be configured for the connection.

    C provides a route-based VPN gateway using VpnGw1, the lower-cost
    supported choice among the listed gateway SKUs. E is unsuitable because
    Basic VPN Gateway does not support coexistence with ExpressRoute.
    The cost requirement does not justify choosing an unsupported SKU.

    D is unnecessary because the existing ExpressRoute virtual network
    gateway already uses GatewaySubnet. Both gateways share it; do not
    create a second gateway subnet. Verify that the existing subnet is
    /27 or larger for coexistence. Resizing an undersized subnet may be
    necessary in an actual deployment, but creating another subnet is
    not the required action in the stated scenario.

    Preparing automatic failover also requires a working backup VPN and
    appropriate route advertisements and preferences. Prefer ExpressRoute
    while it is available, including on-premises routing preferences to
    avoid asymmetric routing, and ensure the VPN provides the backup path.
    These resource selections alone do not configure every failover detail.

    Remember: existing ExpressRoute means an existing GatewaySubnet;
    add the VPN gateway, local network gateway, and VPN connection.

    [Microsoft Learn: ExpressRoute and site-to-site VPN coexistence](https://learn.microsoft.com/en-us/azure/expressroute/expressroute-howto-coexist-resource-manager)
- id: '042'
  skill: Implement and manage virtual networking
  sub-skill: Configure and manage virtual networks in Azure
  question: |
    HOTSPOT -

    You have peering configured as shown in the following exhibit.

    The Virtual networks list displays test1-vnet, testVNET1, vNET1, vNET2,
    vNET3, vNET4, vNET5, and vNET6. vNET6 is selected, and its Peerings
    pane shows the following entries:

    | Name | Peering status | Peer | Gateway transit |
    | --- | --- | --- | --- |
    | peering1 | Disconnected | vNET1 | Enabled |
    | peering2 | Disconnected | vNET2 | Disabled |

    Use the drop-down menus to select the answer choice that completes each
    statement based on the information presented in the graphic.

    NOTE: Each correct selection is worth one point.
  choices:
    Hosts on vNET6 can communicate with hosts on:
      - vNET6 only
      - vNET6 and vNET1 only
      - vNET6, vNET1, and vNET2 only
      - all the virtual networks in the subscription
    To change the status of the peering connection to vNET1 to Connected, you must first:
      - add a service endpoint
      - add a subnet
      - delete peering1
      - modify the address space
  answer:
    Hosts on vNET6 can communicate with hosts on: vNET6 only
    To change the status of the peering connection to vNET1 to Connected, you must first: delete peering1
  user_answer:
    Hosts on vNET6 can communicate with hosts on: vNET6 only
    To change the status of the peering connection to vNET1 to Connected, you must first: delete peering1
  user_result: correct
  user_reasoning: |
    Selected vNET6 only because its peerings to vNET1 and vNET2 are disconnected.
  learning_note: |
    Disconnected peerings provide no connectivity. Delete the remaining
    disconnected link and recreate both directions to restore peering.
    Gateway transit lets a peer share a VPN or ExpressRoute gateway, but
    requires working peering and complementary remote-gateway settings.
  explanation: |
    **vNET6 only; delete peering1** is correct for the displayed topology.

    Both peerings are Disconnected, so neither provides connectivity to
    its remote VNet. Local vNET6 communication remains possible, subject
    to security rules. The presence of other VNets in the subscription
    does not automatically establish connectivity to them.

    Disconnected means a previously established peering lost one of its
    directional links. Delete the remaining peering1 link, then recreate
    both directional links between vNET6 and vNET1. Verify Connected on
    both sides. This differs from Initiated, where completing the missing
    reciprocal link establishes the connection without that repair sequence.
    Service endpoints, adding a subnet, and changing address space do not
    repair this disconnected link.

    Gateway transit allows a VNet to use a VPN or ExpressRoute gateway
    located in a peered VNet. For example, a spoke can send on-premises
    traffic through the hub VNet's VPN gateway instead of deploying its
    own gateway. Enable Allow gateway transit on the gateway-owning hub's
    peering and Use remote gateways on the spoke's reciprocal peering.
    Appropriate forwarding, routing, and security settings are also required.

    The gateway transit Enabled flag does not show that a gateway exists
    or that the reciprocal remote-gateway setting is configured. It cannot
    make a disconnected peering usable. Ordinary direct peering traffic
    does not require gateway transit, and enabling it alone does not make
    peering automatically transitive between other spokes.

    Remember: check peering status before gateway-sharing settings.

    [Microsoft Learn: Disconnected peering repair](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-faq)
    [Microsoft Learn: Hub-spoke gateway transit settings](https://learn.microsoft.com/en-us/azure/networking/design-guide/hub-spoke)
- id: '043'
  skill: Implement and manage virtual networking
  sub-skill: Configure name resolution and load balancing
  question: |
    HOTSPOT -

    You have an Azure subscription that contains the following resources.

    | Name | Type |
    | --- | --- |
    | VM1 | Virtual machine |
    | VM2 | Virtual machine |
    | LB1 | Load balancer (Basic SKU) |

    You install the Web Server server role (IIS) on VM1 and VM2, and then
    add VM1 and VM2 to LB1. LB1 is configured as shown in the exhibit.

    | Setting | Value |
    | --- | --- |
    | Resource group | VMRG |
    | Location | West Europe |
    | Subscription name | Azure Pass |
    | SKU | Basic |
    | Backend pool | Backend1 (2 virtual machines) |
    | Health probe | Probe1 (HTTP:80/Probe1.htm) |
    | Load balancing rule | Rule1 (TCP/80) |
    | NAT rules | None |
    | Public IP address | 104.40.178.194 (LB1) |

    Rule1 is configured as shown in the following exhibit.

    | Setting | Value |
    | --- | --- |
    | Name | Rule1 |
    | IP version | IPv4 |
    | Frontend IP address | 104.40.178.194 (LoadBalanceFrontEnd) |
    | Protocol | TCP |
    | Port | 80 |
    | Backend port | 80 |
    | Backend pool | Backend1 (2 virtual machines) |
    | Health probe | Probe1 (HTTP:80/Probe1.htm) |
    | Session persistence | None |
    | Idle timeout (minutes) | 4 |
    | Floating IP (direct server return) | Disabled |

    For each statement, select Yes if the statement is true. Otherwise,
    select No. Each correct selection is worth one point.
  choices:
    VM1 is in the same availability set as VM2.:
      - 'Yes'
      - 'No'
    If Probe1.htm is present on VM1 and VM2, LB1 will balance TCP port 80 between VM1 and VM2.:
      - 'Yes'
      - 'No'
    If you delete Rule1, LB1 will balance all the requests between VM1 and VM2 for all the ports.:
      - 'Yes'
      - 'No'
  answer:
    VM1 is in the same availability set as VM2.: 'Yes'
    If Probe1.htm is present on VM1 and VM2, LB1 will balance TCP port 80 between VM1 and VM2.: 'Yes'
    If you delete Rule1, LB1 will balance all the requests between VM1 and VM2 for all the ports.: 'No'
  user_answer:
    VM1 is in the same availability set as VM2.: 'Yes'
    If Probe1.htm is present on VM1 and VM2, LB1 will balance TCP port 80 between VM1 and VM2.: 'Yes'
    If you delete Rule1, LB1 will balance all the requests between VM1 and VM2 for all the ports.: 'Yes'
  user_result: partially_correct
  learning_note: |
    A backend pool identifies the servers, a probe determines their health,
    and a load-balancing rule specifies the traffic to distribute. Deleting
    a rule does not enable load balancing on all ports.
  explanation: |
    The correct selections are Yes, Yes, No.

    Basic SKU restricts backend VMs to a single availability set or virtual
    machine scale set. Given the two ordinary VMs successfully added to
    LB1, they belong to the same availability set.

    Rule1 maps frontend TCP port 80 to backend TCP port 80. Probe1 checks
    HTTP /Probe1.htm on port 80 on each VM. The intended answer assumes
    IIS serves that page successfully on both VMs, making both eligible
    for new connections. Strictly, file presence alone is insufficient:
    each endpoint must respond with HTTP 200 OK and permit probe traffic.

    Deleting the sole load-balancing rule removes the mapping for new
    inbound connections. It does not create a wildcard rule for all ports.
    All-port HA Ports load balancing requires an explicit configuration
    on an internal Standard Load Balancer and is unavailable on Basic SKU.

    Azure Load Balancer has no default load-balancing rule to fall back to.
    After Rule1 is deleted, the backend pool and health probe can still
    exist, but neither supplies the missing traffic mapping. LB1 therefore
    has no rule to distribute new incoming connections to these VMs.

    NSGs do have default security rules, which allow or deny traffic.
    Those rules do not tell a load balancer which backend should receive
    a connection and cannot replace a deleted load-balancing rule.

    This is a historical Basic SKU question. Basic Load Balancer retired
    on September 30, 2025; apply its historical restrictions to this exhibit.

    [Microsoft Learn: Load Balancer SKU comparison](https://learn.microsoft.com/en-us/azure/load-balancer/skus)
    [Microsoft Learn: Health probes](https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-custom-probe-overview)
    [Microsoft Learn: Load-balancing rules](https://learn.microsoft.com/en-us/azure/load-balancer/manage-rules-how-to)
- id: '044'
  tags: [must-review]
  skill: Implement and manage virtual networking
  sub-skill: Configure name resolution and load balancing
  question: |
    HOTSPOT -

    You have an Azure virtual machine named VM1 that connects to a virtual
    network named VNet1. VM1 has the following configurations:

    - Subnet: 10.0.0.0/24
    - Availability set: AVSet
    - Network security group (NSG): None
    - Private IP address: 10.0.0.4 (dynamic)
    - Public IP address: 40.90.219.6 (dynamic)

    You deploy a standard, Internet-facing load balancer named slb1.
    You need to configure slb1 to allow connectivity to VM1.

    Which changes should you apply to VM1 as you configure slb1? Select
    the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  choices:
    Before you create a backend pool on slb1, you must:
      - Create and assign an NSG to VM1
      - Remove the public IP address from VM1
      - Change the private IP address of VM1 to static
    Before you can connect to VM1 from slb1, you must:
      - Create and configure an NSG
      - Remove the public IP address from VM1
      - Change the private IP address of VM1 to static
  answer:
    Before you create a backend pool on slb1, you must: Remove the public IP address from VM1
    Before you can connect to VM1 from slb1, you must: Create and configure an NSG
  user_answer:
    Before you create a backend pool on slb1, you must: Create and assign an NSG to VM1
    Before you can connect to VM1 from slb1, you must: Change the private IP address of VM1 to static
  user_result: incorrect
  learning_note: |
    Distinguish backend membership from traffic permission. Remove a Basic
    public IP before adding its VM to a Standard Load Balancer backend;
    configure and associate an NSG to permit inbound connectivity. A
    NIC-based backend pool does not require a static private IP address.
  explanation: |
    The correct selections are Remove the public IP address from VM1;
    Create and configure an NSG.

    The dynamic public IP identifies a historical Basic SKU public IP.
    Standard public IP addresses use static allocation. Public IPs on a
    load balancer and its backend VMs must have compatible SKUs, so VM1's
    Basic public IP must be removed before VM1 joins this Standard backend
    pool. Upgrading to a compatible Standard public IP is another practical
    solution, but it is not an offered choice. Backend VMs do not require
    their own public IP to receive traffic through a public load balancer.

    The first statement's wording is imprecise: an empty backend pool can
    be created without modifying VM1. The intended prerequisite concerns
    adding VM1 to that pool.

    Standard Load Balancer is closed to inbound traffic unless an NSG
    explicitly allows it. Create the NSG, associate it with VM1's NIC or
    subnet, and allow the application's backend port from the required
    sources. Health probe traffic must also be permitted; the default
    AllowAzureLoadBalancerInBound rule normally provides that permission.
    Creating an unattached NSG or allowing only probes is insufficient.

    The dynamic private IP can remain unchanged for a NIC-based backend
    pool. Changing it to static neither resolves the public IP SKU mismatch
    nor opens inbound traffic. AVSet membership is not the obstacle here.

    This question reflects historical Basic public IP behavior. Basic
    public IPs retired on September 30, 2025; current deployments should
    use supported Standard resources.

    Remember: SKU compatibility controls backend membership; NSG rules
    control connectivity.

    [Microsoft Learn: Public IP SKUs and backend compatibility](https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/public-ip-addresses/)
    [Microsoft Learn: Standard Load Balancer inbound connectivity](https://learn.microsoft.com/en-us/troubleshoot/azure/load-balancer/troubleshoot-common-problems/no-inbound-connectivity-standard-external-load-balancers)
- id: '045'
  skill: Implement and manage virtual networking
  sub-skill: Configure and manage virtual networks in Azure
  question: |
    You have an Azure subscription that contains the resources shown in
    the following table.

    | Name | Type | Location |
    | --- | --- | --- |
    | VNET1 | Virtual network | East US |
    | IP1 | Public IP address | West Europe |
    | RT1 | Route table | North Europe |

    You need to create a network interface named NIC1.
    In which location can you create NIC1?
  choices:
    A: East US and North Europe only
    B: East US only
    C: East US, West Europe, and North Europe
    D: East US and West Europe only
  answer: B
  user_answer: B
  user_result: correct
  user_reasoning: NIC1 should follow the virtual network's location.
  learning_note: |
    A NIC must connect to a subnet in a VNet in the same region and
    subscription. An optional public IP or route table does not supply
    an alternative region for that NIC.
  explanation: |
    B — East US only is correct for the resources provided.

    A network interface must connect to a subnet in a virtual network
    in the same region and subscription. The only listed virtual network,
    VNET1, is in East US, so NIC1 must be created in East US.

    IP1 is optional and cannot be associated with NIC1 because it is in
    West Europe. RT1 is associated with subnets rather than directly with
    NICs; its North Europe location does not determine NIC1's location.
    Neither resource provides a virtual network in its region.

    A, C, and D include regions without a listed VNet that NIC1 could join.
    Creating another VNet in another region could change the possibilities,
    but the question asks about the supplied resources.

    Remember: NIC → subnet → VNet; match the VNet's region. A VM attached
    to the NIC must also be in the same region and subscription.

    [Microsoft Learn: Create, change, or delete network interfaces](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-network-interface)
- id: '046'
  skill: Implement and manage virtual networking
  sub-skill: Configure name resolution and load balancing
  question: |
    You have Azure virtual machines that run Windows Server 2019 and are
    configured as shown in the following table.

    | Name | Virtual network name | DNS suffix configured in Windows Server |
    | --- | --- | --- |
    | VM1 | VNET1 | Contoso.com |
    | VM2 | VNET2 | Contoso.com |

    You create a public Azure DNS zone named adatum.com and a private
    Azure DNS zone named contoso.com.

    For contoso.com, you create a virtual network link named link1 as
    shown in the exhibit.

    | Setting | Value |
    | --- | --- |
    | Link name | link1 |
    | Private DNS zone | contoso.com |
    | Link state | Completed |
    | Provisioning state | Succeeded |
    | Virtual network | VNET1 |
    | Enable auto registration | Unchecked (disabled) |

    The virtual network ID field displays the truncated value
    /subscriptions/8372f433-2dcd-4361-b5ef-5b188fed87d0/resourceGroups/RG2/provi...

    You discover that VM1 can resolve names in contoso.com but cannot
    resolve names in adatum.com. VM1 can resolve other hosts on the Internet.

    You need to ensure that VM1 can resolve host names in adatum.com.
    What should you do?
  choices:
    A: Update the DNS suffix on VM1 to be adatum.com
    B: Configure the name servers for adatum.com at the domain registrar
    C: Create an SRV record in the contoso.com zone
    D: Modify the Access control (IAM) settings for link1
  answer: B
  user_answer: B
  user_result: correct
  learning_note: |
    Creating a public Azure DNS zone does not delegate the domain to Azure.
    Configure its assigned name servers at the domain registrar. Private
    DNS zone links and auto-registration are separate mechanisms.
  explanation: |
    B is correct. Configure adatum.com's name servers at the domain registrar
    to use all four name servers assigned to its public Azure DNS zone.

    A public zone created in Azure holds authoritative records, but recursive
    resolvers need public DNS delegation to discover those Azure servers.
    VM1 can resolve other Internet hosts, so the intended diagnosis is missing
    delegation for adatum.com rather than a general connectivity problem.
    The answer assumes the required host records already exist in the zone;
    delegation alone does not create missing records.

    A changes how unqualified names are expanded. It does not fix delegation
    or resolution of fully qualified names such as server1.adatum.com.
    C creates a service-location record in a different zone and does not
    delegate adatum.com. D changes management permissions on the private
    zone link, not the DNS resolution path.

    link1 allows VNET1 to resolve existing records in the private contoso.com
    zone. Its disabled auto-registration setting means Azure does not
    automatically create VM records through this link; resolution of existing
    records still works. This setting does not affect public adatum.com.

    Remember: private zone → VNet link; public zone → registrar delegation.

    [Microsoft Learn: Delegate a domain to Azure DNS](https://learn.microsoft.com/en-us/azure/dns/dns-delegate-domain-azure-dns)
- id: '047'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  question: |
    HOTSPOT -

    You plan to use Azure Network Watcher to perform the following tasks:

    - Task1: Identify a security rule that prevents a network packet from
      reaching an Azure virtual machine.
    - Task2: Validate outbound connectivity from an Azure virtual machine
      to an external host.

    Which feature should you use for each task? Select the appropriate
    options in the answer area.

    NOTE: Each correct selection is worth one point.
  choices:
    Task1:
      - IP flow verify
      - Next hop
      - Packet capture
      - Security group view
      - Traffic Analytics
    Task2:
      - Connection troubleshoot
      - IP flow verify
      - Next hop
      - NSG flow logs
      - Traffic Analytics
  answer:
    Task1: IP flow verify
    Task2: Connection troubleshoot
  user_answer:
    Task1: Packet capture
    Task2: Connection troubleshoot
  user_result: partially_correct
  learning_note: |
    IP flow verify identifies the security rule allowing or denying a
    specified packet. Packet capture records traffic for inspection.
    Connection troubleshoot validates connectivity to a destination.
  explanation: |
    Task1 requires IP flow verify. Task2 requires Connection troubleshoot.

    IP flow verify evaluates the specified traffic direction, protocol,
    local and remote IP addresses, and ports against the applicable NSG
    and security admin rules. It returns Allowed or Denied and the name
    of the responsible rule. That directly identifies the rule requested
    in Task1. Packet capture records actual traffic for packet-level
    inspection; it does not directly identify the NSG rule blocking it.

    Connection troubleshoot tests connectivity from the source VM to a
    destination host and port and provides diagnostic results. It can
    test an external host, so it meets Task2. IP flow verify can evaluate
    outbound rule permission but does not by itself establish that the
    destination is reachable or that its service is listening.

    Next hop identifies the routing decision for a destination. Security
    group view displays effective security rules rather than directly
    evaluating the specified packet. NSG flow logs record traffic flows,
    and Traffic Analytics analyzes flow data and traffic patterns; neither
    is the best tool for this immediate connectivity test.

    Remember: Which rule? → IP flow verify. Can I connect? → Connection
    troubleshoot. What packets? → Packet capture. Which route? → Next hop.

    [Microsoft Learn: IP flow verify](https://learn.microsoft.com/en-us/azure/network-watcher/ip-flow-verify-overview)
    [Microsoft Learn: Connection troubleshoot](https://learn.microsoft.com/en-us/azure/network-watcher/connection-troubleshoot-manage)
- id: '048'
  skill: Implement and manage virtual networking
  sub-skill: Configure name resolution and load balancing
  question: |
    HOTSPOT -

    You have an Azure subscription that contains the Azure virtual machines
    shown in the following table.

    | Name | Operating system | Subnet | Virtual network |
    | --- | --- | --- | --- |
    | VM1 | Windows Server 2019 | Subnet1 | VNET1 |
    | VM2 | Windows Server 2019 | Subnet2 | VNET1 |
    | VM3 | Red Hat Enterprise Linux 7.7 | Subnet3 | VNET1 |

    You configure the network interfaces of the virtual machines to use
    the settings shown in the following table.

    | Name | DNS server |
    | --- | --- |
    | VM1 | None |
    | VM2 | 192.168.10.15 |
    | VM3 | 192.168.10.15 |

    From the settings of VNET1, you configure DNS servers as shown in the
    exhibit: Custom is selected, Default (Azure-provided) is unselected,
    and the custom DNS server is 193.77.134.10.

    The virtual machines can successfully connect to the DNS server that
    has an IP address of 192.168.10.15 and the DNS server that has an IP
    address of 193.77.134.10.

    For each statement, select Yes if the statement is true. Otherwise,
    select No. Each correct selection is worth one point.
  choices:
    VM1 connects to 193.77.134.10 for DNS queries.:
      - 'Yes'
      - 'No'
    VM2 connects to 193.77.134.10 for DNS queries.:
      - 'Yes'
      - 'No'
    VM3 connects to 192.168.10.15 for DNS queries.:
      - 'Yes'
      - 'No'
  answer:
    VM1 connects to 193.77.134.10 for DNS queries.: 'Yes'
    VM2 connects to 193.77.134.10 for DNS queries.: 'No'
    VM3 connects to 192.168.10.15 for DNS queries.: 'Yes'
  user_answer:
    VM1 connects to 193.77.134.10 for DNS queries.: 'No'
    VM2 connects to 193.77.134.10 for DNS queries.: 'No'
    VM3 connects to 192.168.10.15 for DNS queries.: 'No'
  user_result: partially_correct
  learning_note: |
    Custom NIC DNS settings override VNet DNS settings. With no NIC-level
    override, the VM inherits the VNet's DNS settings. This applies to
    both Windows and Linux; None does not mean DNS is disabled.
  explanation: |
    The correct selections are Yes, No, Yes.

    VM1 has no custom DNS server on its NIC, so it inherits VNET1's custom
    DNS server, 193.77.134.10. None in the NIC table means no NIC-level
    override, not that DNS resolution is disabled.

    VM2 has a custom NIC DNS server, 192.168.10.15. NIC-level settings take
    precedence over the VNet-level server, so VM2 does not use 193.77.134.10
    for its configured DNS queries.

    VM3 also has the custom NIC DNS server 192.168.10.15 and uses it.
    Its Linux operating system does not change Azure's DNS precedence.
    The different subnets do not change this rule either. Reachability
    to both DNS servers does not mean both are selected as resolvers.

    These answers assume the configured settings have taken effect in
    the guest operating systems. After changing DNS settings, renew DHCP
    leases or restart affected VMs to obtain the updated configuration.

    Remember: custom NIC DNS wins; otherwise inherit VNet DNS.

    [Microsoft Learn: Network interface DNS settings](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-network-interface)
    [Microsoft Learn: Name resolution and DHCP renewal](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-name-resolution-for-vms-and-role-instances)
