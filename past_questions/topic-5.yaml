    You have an Azure subscription that contains the virtual machines
    shown in the following table.

    | Name | Public IP SKU | Connected to | Status |
    | --- | --- | --- | --- |
    | VM1 | None | VNET1/Subnet1 | Stopped (deallocated) |
    | VM2 | Basic | VNET1/Subnet2 | Running |

    You deploy a load balancer that has the following configurations:

    - Name: LB1
    - Type: Internal
    - SKU: Standard
    - Virtual network: VNET1

    You need to ensure that you can add VM1 and VM2 to the backend pool
    of LB1.

    Solution: You create two Standard SKU public IP addresses and associate
    a Standard SKU public IP address to the network interface of each
    virtual machine.

    Does this meet the goal?
  choices:
    A: 'Yes'
    B: 'No'
  answer: A
  user_answer: B
  user_result: incorrect
  user_reasoning: |
    Questioned whether VM1 must be running before it can be added to the
    backend pool.
  learning_note: |
    Adding a NIC IP configuration to a backend pool does not require its
    VM to be running. Serving traffic requires the VM and service to run
    and pass health probes. Distinguish membership from traffic readiness.
  explanation: |
    A — Yes is the intended answer. Both VMs can have Standard public IPs
    compatible with Standard LB1. The solution assumes VM2's new Standard
    public IP replaces its existing Basic public IP on the NIC IP
    configuration, rather than leaving an incompatible Basic IP attached.

    VM1 does not need to be running to configure backend membership through
    its NIC IP configuration. Deallocation leaves the NIC resource in place.
    VM1 must be started, its application must listen on the backend port,
    and its health probe must succeed before it can serve load-balanced
    traffic. The stated goal is to add the VMs, not to make both actively
    serve requests immediately.

    An internal load balancer does not require public IPs on its backend
    VMs, so adding one to VM1 is unnecessary but compatible. Removing
    VM2's Basic public IP or upgrading it would also resolve the mismatch.
    The question does not require minimum cost or the fewest changes.
    Different subnets within the same VNet are supported.

    This is a historical question involving Basic public IP resources;
    apply the SKU compatibility rule to the proposed replacement.

    Remember: backend membership is configuration; receiving traffic
    requires a running, healthy service.

    [Microsoft Learn: Backend public IP SKU compatibility](https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-basic-upgrade-guidance)
