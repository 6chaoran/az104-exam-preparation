    screen.

    You manage a virtual network named VNet1 that is hosted in the West US
    Azure region.

    VNet1 hosts two virtual machines named VM1 and VM2 that run Windows Server.

    You need to inspect all the network traffic from VM1 to VM2 for a
    period of three hours.

    Solution: From Azure Monitor, you create a metric on Network In
    and Network Out.

    Does this meet the goal?
  choices:
    A: 'Yes'
    B: 'No'
  answer: B
  user_answer: B
  user_result: correct
  learning_note: |
    Network In and Network Out metrics summarize received and sent bytes.
    They do not capture packets or isolate the complete VM1-to-VM2 exchange.
    Use Network Watcher packet capture to inspect actual traffic.
  explanation: |
    B — No is correct. Azure Monitor's VM network metrics show the volume
    of data received and sent, rather than a recording of individual packets.
    Viewing those metrics for three hours does not provide the packet headers
    and payloads needed to inspect all traffic from VM1 to VM2.

    The metrics also aggregate VM traffic rather than identifying every
    packet exchanged with one specific peer. They are useful for observing
    throughput trends but do not satisfy the packet-inspection requirement.

    Use Network Watcher packet capture, targeting VM1 and filtering on VM2's
    private IP with all protocols and ports. Set a capture duration of
    10,800 seconds and sufficient capture capacity to avoid stopping early.

    Remember: Network In/Out = how much data;
    packet capture = what packets were exchanged.

    [Microsoft Learn: Supported virtual machine metrics](https://learn.microsoft.com/en-us/azure/azure-monitor/reference/supported-metrics/microsoft-compute-virtualmachines-metrics)
