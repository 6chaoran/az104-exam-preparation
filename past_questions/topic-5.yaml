    You have an Azure subscription that contains the virtual machines
    shown in the following table.

    | Name | Public IP SKU | Connected to | Status |
    | --- | --- | --- | --- |
    | VM1 | None | VNET1/Subnet1 | Stopped (deallocated) |
    | VM2 | Basic | VNET1/Subnet2 | Running |

    You deploy a load balancer that has the following configurations:

    - Name: LB1
    - Type: Internal
    - SKU: Standard
    - Virtual network: VNET1

    You need to ensure that you can add VM1 and VM2 to the backend pool
    of LB1.

    Solution: You create a Standard SKU public IP address, associate the
    address to the network interface of VM1, and then stop VM2.

    Does this meet the goal?
  choices:
    A: 'Yes'
    B: 'No'
  answer: B
  user_answer: B
  user_result: correct
  learning_note: |
    Stopping a VM does not remove its public IP or change its SKU. VM2's
    Basic public IP remains incompatible with Standard LB1. Fix the SKU
    mismatch by removing or upgrading that public IP.
  explanation: |
    B — No is correct. The proposed solution leaves VM2's Basic public IP
    associated with its NIC. That is incompatible with Standard LB1,
    including when LB1 is internal. Stopping VM2 does not change its
    network resource associations or public IP SKU.

    VM1's new Standard public IP is compatible, but an internal load
    balancer backend VM does not require a public IP. VM1 could retain
    its original configuration without one. To resolve the actual obstacle,
    remove VM2's Basic public IP or upgrade it to Standard.

    VM1 and VM2 are in different subnets of the same VNet, which is allowed.
    Backend membership and serving traffic are separate concerns: VMs
    need to be running and pass health probes to serve traffic, but changing
    their power state does not resolve a SKU mismatch.

    This question uses historical Basic SKU resources. Evaluate the proposed
    solution under those compatibility rules; current deployments should
    use supported Standard resources.

    Remember: stopping a VM changes runtime state, not network configuration.

    [Microsoft Learn: SKU compatibility for backend public IPs](https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-basic-upgrade-guidance)
