    screen.

    You have an app named App1 that is installed on two Azure virtual
    machines named VM1 and VM2. Connections to App1 are managed by using
    an Azure Load Balancer.

    The effective network security configurations for VM2 are shown in
    the following exhibit.

    | Setting | Value |
    | --- | --- |
    | Network interface | VM2-NIC1 |
    | Virtual network/subnet | Vnet1/Subnet11 |
    | NIC public IP | None |
    | NIC private IP | 10.240.11.5 |
    | Accelerated networking | Disabled |
    | Network security group | NSG2 |
    | NSG association | Subnet11; impacts 1 subnet, 0 network interfaces |

    The exhibit's association label inconsistently calls Subnet11 a
    network interface; the association counts identify a subnet association.

    | Priority | Name | Port | Protocol | Source | Destination | Action |
    | --- | --- | --- | --- | --- | --- | --- |
    | 100 | Allow_131.107.100.50 | 443 | TCP | 131.107.100.50 | VirtualNetwork | Allow |
    | 200 | BlockAllOther443 | 443 | Any | Any | Any | Deny |
    | 65000 | AllowVnetInBound | Any | Any | VirtualNetwork | VirtualNetwork | Allow |
    | 65001 | AllowAzureLoadBalancerInBound | Any | Any | AzureLoadBalancer | Any | Allow |
    | 65500 | DenyAllInBound | Any | Any | Any | Any | Deny |

    You discover that connections to App1 from 131.107.100.50 over TCP
    port 443 fail. You verify that the Load Balancer rules are configured
    correctly.

    You need to ensure that connections to App1 can be established
    successfully from 131.107.100.50 over TCP port 443.

    Solution: You modify the priority of the Allow_131.107.100.50 inbound
    security rule.

    Does this meet the goal?
  choices:
    A: 'Yes'
    B: 'No'
  answer: B
  user_answer: B
  user_result: correct
  user_reasoning: |
    The client allow rule already has high priority.
  learning_note: |
    Priority 100 is the highest permitted custom NSG priority. The client
    allow already precedes the deny; changing it does not allow probes
    from a different source. Diagnose the traffic that is actually blocked.
  explanation: |
    B — No is correct. Allow_131.107.100.50 already has priority 100,
    the lowest permitted number and therefore highest custom-rule priority.
    It allows the client's TCP 443 requests before BlockAllOther443 at 200.

    Moving this allow to another priority before 200 leaves the client
    decision unchanged. Moving it after 200 makes the client traffic hit
    the deny first. Neither change resolves the underlying connectivity
    problem.

    Load balancer application traffic preserves the client source IP.
    Health probes use a different source, 168.63.129.16 for IPv4, represented
    by the AzureLoadBalancer service tag. They do not match the client-specific
    allow, regardless of its priority. If probing on port 443, the deny at
    200 blocks probes before the default probe allow at 65001. A targeted
    probe allow before 200 or removing the deny addresses that obstruction.

    The probe port and VM1's configuration are not shown, so probe blocking
    is the intended likely diagnosis rather than a fully established cause.
    Changing the already-winning client allow does not establish successful
    connectivity under either interpretation.

    Remember: changing priority helps only when it changes the first
    matching rule for the traffic that is blocked.

    [Microsoft Learn: NSG priority range and rule processing](https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview)
    [Microsoft Learn: Client traffic versus health probes](https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-best-practices)
- id: '060'
  tags: [must-review]
  skill: Manage Azure identities and governance
  sub-skill: Manage Azure subscriptions and governance
  question: |
    Note: This question is part of a series of questions that present the
    same scenario. Each question in the series contains a unique solution
    that might meet the stated goals. Some question sets might have more
    than one correct solution, while others might not have a correct solution.

    After you answer a question in this section, you will NOT be able to
    return to it. As a result, these questions will not appear in the review
    screen.

    You have an Azure subscription that contains 10 virtual networks.
    The virtual networks are hosted in separate resource groups.

    Another administrator plans to create several network security groups
    (NSGs) in the subscription.

    You need to ensure that when an NSG is created, it automatically blocks
    TCP port 8080 between the virtual networks.

    Solution: You assign a built-in policy definition to the subscription.

    Does this meet the goal?
  choices:
    A: 'Yes'
    B: 'No'
  answer: B
  user_answer: A
  user_result: incorrect
  learning_note: |
    Azure Policy is the right automation service, but an unspecified built-in
    policy does not deploy this custom TCP 8080 deny rule. Distinguish built-in
    definitions from custom definitions, and Policy's deny effect from an
    NSG rule's Deny action.
  explanation: |
    B — No is the best answer as written. Assigning a built-in policy is
    insufficient without a definition that implements the required behavior.
    Microsoft's published networking built-in catalog does not list a policy
    that automatically deploys the stated TCP 8080 inter-VNet deny rule.
    Built-ins for NSG diagnostics, flow logs, auditing, or subnet association
    do not implement that requirement.

    A suitable solution is a custom Azure Policy definition, typically using
    deployIfNotExists to deploy the missing security rule, assigned at
    subscription scope to cover NSGs across the separate resource groups.
    Configure the correct source and destination ranges, TCP destination port
    8080, Deny action, and priority before competing allow rules. Assign the
    policy a managed identity with the required deployment permissions.
    NSGs must be associated with the relevant subnets or NICs to filter traffic.

    deployIfNotExists runs after resource creation or update and a configurable
    delay; it does not atomically insert the rule at the instant of creation.
    Existing noncompliant resources can be remediated with remediation tasks.

    Policy's deny effect rejects noncompliant resource operations. An NSG
    Deny rule blocks matching network traffic. These are different mechanisms.

    If an answer key gives Yes merely because Azure Policy is mentioned,
    it overlooks the built-in qualification and missing implementation.
    A specific suitable definition and configuration must be established
    before the proposed assignment can be considered sufficient.

    Remember: choose the correct policy definition and effect, not just
    the correct Azure service.

    [Microsoft Learn: Networking built-in policy catalog](https://learn.microsoft.com/en-us/azure/virtual-network/policy-reference)
    [Microsoft Learn: deployIfNotExists requirements and timing](https://learn.microsoft.com/en-us/azure/governance/policy/concepts/effect-deploy-if-not-exists)
- id: '061'
  skill: Implement and manage virtual networking
  sub-skill: Configure and manage virtual networks in Azure
  question: |
    You have an Azure subscription.

    You plan to deploy an Azure Kubernetes Service (AKS) cluster to support
    an app named App1. On-premises clients connect to App1 by using the
    IP address of the pod.

    For the AKS cluster, you need to choose a network type that will
    support App1.

    What should you choose?
  choices:
    A: kubenet
    B: Azure Container Networking Interface (CNI)
    C: Hybrid Connection endpoints
    D: Azure Private Link
  answer: B
  user_answer: A
  user_result: incorrect
  learning_note: |
    Direct access to pod IP addresses from on-premises requires Azure CNI
    with flat networking. Pods receive routable virtual network addresses.
    Azure CNI Overlay does not provide the same direct external pod access.
  explanation: |
    B — Azure Container Networking Interface (CNI) is correct. Your supplied
    answer A is preserved in user_answer, but answer is B.

    With traditional Azure CNI or Azure CNI Pod Subnet networking, pods
    receive IP addresses from a virtual network subnet. On-premises clients
    can access those addresses directly through suitably configured VPN
    or ExpressRoute connectivity, routing, and security rules.

    kubenet assigns pods addresses from a separate range and uses NAT for
    external communication. It is not the intended choice when clients
    on a connected on-premises network must directly access pod IPs.

    Hybrid Connection endpoints and Azure Private Link are not AKS network
    plugins that assign routable virtual network IP addresses to pods.

    In this question, Azure CNI means flat networking, not Azure CNI Overlay.
    Overlay pod addresses are not directly accessible from external networks.

    Remember: direct pod IP access from connected networks = flat Azure CNI.

    [Microsoft Learn: AKS networking best practices](https://learn.microsoft.com/en-us/azure/aks/operator-best-practices-network)
    [Microsoft Learn: AKS CNI networking overview](https://learn.microsoft.com/en-us/azure/aks/concepts-network-cni-overview)
- id: '062'
  skill: Implement and manage virtual networking
  sub-skill: Configure name resolution and load balancing
  question: |
    Note: This question is part of a series of questions that present the
    same scenario. Each question in the series contains a unique solution
    that might meet the stated goals. Some question sets might have more
    than one correct solution, while others might not have a correct solution.

    After you answer a question in this section, you will NOT be able to
    return to it. As a result, these questions will not appear in the review
    screen.

    You have an Azure subscription that contains the virtual machines
    shown in the following table.

    | Name | Public IP SKU | Connected to | Status |
    | --- | --- | --- | --- |
    | VM1 | None | VNET1/Subnet1 | Stopped (deallocated) |
    | VM2 | Basic | VNET1/Subnet2 | Running |

    You deploy a load balancer that has the following configurations:

    - Name: LB1
    - Type: Internal
    - SKU: Standard
    - Virtual network: VNET1

    You need to ensure that you can add VM1 and VM2 to the backend pool of LB1.

    Solution: You disassociate the public IP address from the network
    interface of VM2.

    Does this meet the goal?
  choices:
    A: 'Yes'
    B: 'No'
  answer: A
  user_answer: B
  user_result: incorrect
  learning_note: |
    A Standard load balancer backend VM can have no public IP or a Standard
    public IP. Removing a Basic public IP resolves the SKU conflict.
    Backend pool membership does not require the VM to be running, and
    backend VMs can occupy different subnets in the same virtual network.
  explanation: |
    A — Yes is correct. Your supplied answer B is preserved in user_answer,
    but answer is A. The goal is to add the VMs to the backend pool, not
    to make both VMs immediately serve application traffic.

    VM2's Basic SKU public IP conflicts with the Standard SKU load balancer
    for the intended NIC-based backend pool. Disassociating that public IP
    removes the conflict. VM2 retains its private IP address, which the
    internal load balancer uses to send traffic to the backend.

    VM1 already has no public IP, so no public IP change is required for it.
    Its NIC and private IP configuration remain available while the VM is
    deallocated. It can be added to the backend pool, although it must be
    started and pass health probes before it can serve traffic.

    Both VMs belong to VNET1. Standard Load Balancer supports backend VMs
    across subnets within the same virtual network; Subnet1 and Subnet2
    do not prevent membership. Neither VM needs a public IP for this
    internal load balancer.

    This is a legacy exam scenario involving a Basic public IP. Basic
    public IPs were retired on September 30, 2025; use Standard resources
    for current deployments.

    Remember: Standard backend public IP = Standard or none;
    pool membership is separate from a running, healthy backend.

    [Microsoft Learn: Load Balancer SKUs and compatibility](https://learn.microsoft.com/en-us/azure/load-balancer/skus)
    [Microsoft Learn: Backend pool management](https://learn.microsoft.com/en-us/azure/load-balancer/backend-pool-management)
    [Microsoft Learn: Public IP addresses](https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/public-ip-addresses)
- id: '063'
  skill: Manage Azure identities and governance
  sub-skill: Manage Azure subscriptions and governance
  question: |
    Note: This question is part of a series of questions that present the
    same scenario. Each question in the series contains a unique solution
    that might meet the stated goals. Some question sets might have more
    than one correct solution, while others might not have a correct solution.

    After you answer a question in this section, you will NOT be able to
    return to it. As a result, these questions will not appear in the review
    screen.

    You have an Azure subscription that contains 10 virtual networks.
    The virtual networks are hosted in separate resource groups.

    Another administrator plans to create several network security groups
    (NSGs) in the subscription.

    You need to ensure that when an NSG is created, it automatically blocks
    TCP port 8080 between the virtual networks.

    Solution: You configure a custom policy definition, and then you
    assign the policy to the subscription.

    Does this meet the goal?
  choices:
    A: 'Yes'
    B: 'No'
  answer: A
  user_answer: A
  user_result: correct
  learning_note: |
    Use a custom Azure Policy definition to deploy a specific NSG rule,
    typically with deployIfNotExists. Subscription scope covers separate
    resource groups. Policy's deny effect rejects resource operations;
    an NSG rule's Deny action blocks network traffic.
  explanation: |
    A — Yes is the intended answer. A custom policy can encode the required
    TCP 8080 deny rule rather than relying on an unspecified built-in policy.
    Assigning it at subscription scope covers newly created NSGs across
    the subscription's resource groups.

    A suitable implementation uses deployIfNotExists to check each NSG
    for the required security rule and deploy it when missing. Configure
    the rule with TCP, destination port 8080, Deny action, appropriate
    source and destination address ranges, and a priority before competing
    allow rules. The assignment requires a managed identity with the
    permissions needed for deployment. NSGs must be associated with the
    relevant subnets or NICs for their rules to filter traffic.

    This answer assumes the custom definition implements that behavior;
    creating an arbitrary custom policy is not sufficient. deployIfNotExists
    runs after resource creation or update and a configurable evaluation
    delay, so the rule is not inserted atomically at the instant of creation.
    Existing noncompliant NSGs can be handled with remediation tasks.

    A policy using only audit would report noncompliance without deploying
    the rule. Azure Policy's deny effect rejects noncompliant resource
    operations; it does not itself block network packets.

    Unlike Question 060's unspecified built-in definition, a custom
    definition can implement this exact organization-specific requirement.

    Remember: custom rule automation = custom Azure Policy;
    all resource groups in a subscription = subscription assignment scope.

    [Microsoft Learn: deployIfNotExists effect](https://learn.microsoft.com/en-us/azure/governance/policy/concepts/effect-deploy-if-not-exists)
    [Microsoft Learn: Remediate noncompliant resources](https://learn.microsoft.com/en-us/azure/governance/policy/how-to/remediate-resources)
- id: '064'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  question: |
    You have two Azure virtual networks named VNet1 and VNet2. VNet1
    contains an Azure virtual machine named VM1. VNet2 contains an Azure
    virtual machine named VM2.

    VM1 hosts a frontend application that connects to VM2 to retrieve data.

    Users report that the frontend application is slower than usual.

    You need to view the average round-trip time (RTT) of the packets
    from VM1 to VM2.

    Which Azure Network Watcher feature should you use?
  choices:
    A: IP flow verify
    B: Connection troubleshoot
    C: Connection monitor
    D: NSG flow logs
  answer: C
  user_answer: C
  user_result: correct
  learning_note: |
    Connection monitor measures connectivity and RTT over time. Connection
    troubleshoot performs an on-demand check and can also report average
    latency, so distinguish continuous monitoring from a one-time diagnosis.
  explanation: |
    C — Connection monitor is the intended answer. Configure VM1 as the
    source and VM2 as the destination to collect connectivity measurements
    over time. Connection monitor exposes the RoundTripTimeMs metric with
    Average aggregation, allowing you to inspect average round-trip latency.

    A — IP flow verify checks whether security rules allow or deny a
    specified packet and identifies the matching rule. It does not measure RTT.

    B — Connection troubleshoot performs a point-in-time connectivity test
    and helps diagnose failures. It can also report average latency, so
    it is not technically incapable of satisfying a one-time latency check.
    The question does not explicitly require ongoing monitoring, making
    the wording somewhat ambiguous. Connection monitor is the expected
    exam answer for viewing average RTT and investigating performance trends.

    D — NSG flow logs record flow information such as source and destination
    addresses, ports, and allow or deny decisions. They are not an active
    probe feature for measuring round-trip latency between VM1 and VM2.

    Remember: latency over time = Connection monitor;
    one-time connectivity diagnosis = Connection troubleshoot;
    security-rule decision = IP flow verify.

    [Microsoft Learn: Connection monitor metrics](https://learn.microsoft.com/en-us/azure/networking/network-monitoring-overview)
    [Microsoft Learn: Connection monitor schema](https://learn.microsoft.com/en-us/azure/network-watcher/connection-monitor-schema)
    [Microsoft Learn: Connection troubleshoot](https://learn.microsoft.com/en-us/azure/network-watcher/connection-troubleshoot-overview)
- id: '065'
  tags: [must-review]
  skill: Implement and manage virtual networking
  sub-skill: Configure name resolution and load balancing
  question: |
    HOTSPOT

    You have an Azure subscription that contains the public load balancers
    shown in the following table.

    | Name | SKU |
    | --- | --- |
    | LB1 | Basic |
    | LB2 | Standard |

    You plan to create six virtual machines and to load balance requests
    to the virtual machines. Each load balancer will load balance three
    virtual machines.

    You need to create the virtual machines for the planned solution.

    How should you create the virtual machines? To answer, select the
    appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  choices:
    'The virtual machines that will be load balanced by using LB1 must:':
      - be connected to the same virtual network
      - be created in the same resource group
      - be created in the same availability set or virtual machine scale set
      - run the same operating system
    'The virtual machines that will be load balanced by using LB2 must:':
      - be connected to the same virtual network
      - be created in the same resource group
      - be created in the same availability set or virtual machine scale set
      - run the same operating system
  answer:
    'The virtual machines that will be load balanced by using LB1 must:': be created in the same availability set or virtual machine scale set
    'The virtual machines that will be load balanced by using LB2 must:': be connected to the same virtual network
  user_answer:
    'The virtual machines that will be load balanced by using LB1 must:': be connected to the same virtual network
    'The virtual machines that will be load balanced by using LB2 must:': be created in the same availability set or virtual machine scale set
  user_result: incorrect
  learning_note: |
    Basic Load Balancer restricts backend VMs to one availability set or
    virtual machine scale set. Standard Load Balancer supports backend VMs
    across availability sets and scale sets within a single virtual network.
    The supplied selections reverse the intended SKU-specific requirements.
  explanation: |
    For LB1 (Basic), select be created in the same availability set or
    virtual machine scale set. For LB2 (Standard), select be connected
    to the same virtual network. Your supplied selections are preserved
    in user_answer, but they are reversed relative to the intended answers.

    Basic Load Balancer's backend pool is restricted to VMs in a single
    availability set or virtual machine scale set. Sharing a virtual
    network alone does not satisfy this more restrictive requirement.

    Standard Load Balancer supports any VMs or virtual machine scale sets
    within a single virtual network. Its three backend VMs can belong to
    different availability sets, different scale sets, or be standalone VMs.
    They can also occupy different subnets in that virtual network.

    The Basic backend VMs also share a virtual network, so the first
    dropdown has some overlap between necessary conditions. The intended
    answer is the stronger condition that distinguishes Basic from Standard.
    Conversely, Standard backends may share an availability set, but they
    are not required to do so.

    Being in the same resource group is not the defining backend requirement.
    Azure Load Balancer operates at the transport layer and does not require
    all backend VMs to run the same operating system.

    Basic Load Balancer retired on September 30, 2025. This question tests
    the historical SKU comparison; use Standard for current deployments.

    Remember: Basic = one availability set or scale set;
    Standard = one virtual network, with broader backend membership.

    [Microsoft Learn: Azure Load Balancer SKU comparison](https://learn.microsoft.com/en-us/azure/load-balancer/skus)
- id: '066'
  tags: [must-review]
  skill: Implement and manage virtual networking
  sub-skill: Configure and manage virtual networks in Azure
  question: |
    HOTSPOT

    You have an on-premises data center and an Azure subscription. The data
    center contains two VPN devices. The subscription contains an Azure
    virtual network named VNet1. VNet1 contains a gateway subnet.

    You need to create a site-to-site VPN. The solution must ensure that
    if a single instance of an Azure VPN gateway fails, or a single
    on-premises VPN device fails, the failure will not cause an interruption
    that is longer than two minutes.

    What is the minimum number of public IP addresses, virtual network
    gateways, and local network gateways required in Azure? To answer,
    select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  choices:
    Public IP addresses:
      - '1'
      - '2'
      - '3'
      - '4'
    Virtual network gateways:
      - '1'
      - '2'
      - '3'
      - '4'
    Local network gateways:
      - '1'
      - '2'
      - '3'
      - '4'
  answer:
    Public IP addresses: '2'
    Virtual network gateways: '1'
    Local network gateways: '2'
  user_answer:
    Public IP addresses: '2'
    Virtual network gateways: '2'
    Local network gateways: '1'
  user_result: partially_correct
  learning_note: |
    One Azure virtual network gateway resource contains two gateway instances.
    Active-active mode needs two Azure public IPs, one per instance. Create
    one local network gateway per on-premises VPN device, so two devices
    require two local network gateways.
  explanation: |
    The intended answer is 2 public IP addresses, 1 virtual network gateway,
    and 2 local network gateways. Your public IP count is correct, but the
    virtual and local network gateway counts are reversed.

    Deploy one Azure VPN gateway resource in active-active mode. It contains
    two gateway instances, each with its own public IP address. Counting
    the instances as separate virtual network gateway resources is the trap.

    Create two local network gateway resources in Azure, one representing
    each on-premises VPN device and its endpoint and routing information.
    A local network gateway is an Azure configuration resource, not another
    VPN appliance deployed in the data center.

    Create two connection resources, one for each local network gateway.
    Each Azure gateway instance connects to each on-premises device, giving
    four IPsec tunnels. Configure BGP and compatible on-premises routing
    so surviving paths can carry traffic after a single instance or device
    failure. The on-premises devices' public IPs are not included in the
    question's count of public IP resources required in Azure.

    Active-standby Azure gateways can take longer than two minutes to fail
    over after an unplanned failure. Active-active dual redundancy is the
    intended design because alternate tunnels are already established.
    Actual interruption also depends on device failure detection and routing
    convergence; these resource counts alone do not guarantee a time bound.

    Remember: one Azure gateway resource, two active instances and public IPs;
    two on-premises devices, two local network gateway resources.

    [Microsoft Learn: Highly available VPN gateway connectivity](https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-highlyavailable)
    [Microsoft Learn: Active-active VPN gateways](https://learn.microsoft.com/en-us/azure/vpn-gateway/about-active-active-gateways)
- id: '067'
  tags: [must-review]
  skill: Implement and manage virtual networking
  sub-skill: Configure name resolution and load balancing
  question: |
    You have an Azure subscription that contains two virtual machines
    as shown in the following table.

    | Name | Operating system | Location | IP address | DNS server |
    | --- | --- | --- | --- | --- |
    | VM1 | Windows Server 2019 | West Europe | 10.0.0.4 | Default (Azure-provided) |
    | VM2 | Windows Server 2019 | West Europe | 10.0.0.5 | Default (Azure-provided) |

    You perform a reverse DNS lookup for 10.0.0.4 from VM2.

    Which FQDN will be returned?
  choices:
    A: vm1.core.windows.net
    B: vm1.azure.com
    C: vm1.westeurope.cloudapp.azure.com
    D: vm1.internal.cloudapp.net
  answer: D
  user_answer: C
  user_result: incorrect
  learning_note: |
    Azure-provided reverse DNS for a VM's private IP returns a name of
    the form vmname.internal.cloudapp.net. The regional cloudapp.azure.com
    format belongs to public IP DNS labels, not this private IP lookup.
  explanation: |
    D — vm1.internal.cloudapp.net is correct. Your supplied answer C is
    preserved in user_answer, but answer is D.

    A reverse DNS lookup maps an IP address to a name using a PTR record.
    The target 10.0.0.4 is VM1's private IP address. Azure-managed PTR
    records for VMs use the form [vmname].internal.cloudapp.net and are
    automatically added when the VM starts. Under the intended assumption
    that VM2 can resolve VM1 through Azure-provided DNS within the same
    virtual network, the returned name is vm1.internal.cloudapp.net.

    C — vm1.westeurope.cloudapp.azure.com uses the format of an Azure
    public IP DNS label. Such a label must be configured on a public IP
    resource; it is not the default reverse DNS name for 10.0.0.4.
    The West Europe location does not change the private PTR suffix.

    A — vm1.core.windows.net is not the Azure-provided private VM DNS
    naming format. core.windows.net is associated with Azure Storage
    service endpoint naming.

    B — vm1.azure.com is not an automatically assigned private VM DNS name.

    The table does not explicitly identify the virtual network. Being in
    one subscription or region alone does not guarantee private name
    resolution across virtual networks. D is the intended naming answer,
    assuming the lookup is within the supported DNS scope and no custom
    private reverse DNS zone overrides the default response.

    Remember: private VM reverse DNS = internal.cloudapp.net;
    public IP DNS label = region.cloudapp.azure.com.

    [Microsoft Learn: Azure virtual network name resolution and reverse DNS](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-name-resolution-for-vms-and-role-instances)
- id: '068'
  skill: Implement and manage virtual networking
  sub-skill: Configure secure access to virtual networks
  question: |
    Note: This question is part of a series of questions that present the
    same scenario. Each question in the series contains a unique solution
    that might meet the stated goals. Some question sets might have more
    than one correct solution, while others might not have a correct solution.

    After you answer a question in this section, you will NOT be able to
    return to it. As a result, these questions will not appear in the review
    screen.

    You have an app named App1 that is installed on two Azure virtual
    machines named VM1 and VM2. Connections to App1 are managed by using
    an Azure Load Balancer.

    The effective network security configurations for VM2 are shown in
    the following exhibit.

    | Setting | Value |
    | --- | --- |
    | Network interface | VM2-NIC1 |
    | Virtual network/subnet | Vnet1/Subnet11 |
    | NIC public IP | None |
    | NIC private IP | 10.240.11.5 |
    | Accelerated networking | Disabled |
    | Network security group | NSG2 |
    | NSG association | Subnet11; impacts 1 subnet, 0 network interfaces |

    The exhibit's association label inconsistently calls Subnet11 a
    network interface; the association counts identify a subnet association.

    | Priority | Name | Port | Protocol | Source | Destination | Action |
    | --- | --- | --- | --- | --- | --- | --- |
    | 100 | Allow_131.107.100.50 | 443 | TCP | 131.107.100.50 | VirtualNetwork | Allow |
    | 200 | BlockAllOther443 | 443 | Any | Any | Any | Deny |
    | 65000 | AllowVnetInBound | Any | Any | VirtualNetwork | VirtualNetwork | Allow |
    | 65001 | AllowAzureLoadBalancerInBound | Any | Any | AzureLoadBalancer | Any | Allow |
    | 65500 | DenyAllInBound | Any | Any | Any | Any | Deny |

    You discover that connections to App1 from 131.107.100.50 over TCP
    port 443 fail. You verify that the Load Balancer rules are configured
    correctly.

    You need to ensure that connections to App1 can be established
    successfully from 131.107.100.50 over TCP port 443.

    Solution: You create an inbound security rule that allows any traffic
    from the AzureLoadBalancer source and has a cost of 150.

    Does this meet the goal?
  choices:
    A: 'Yes'
    B: 'No'
  answer: A
  user_answer: A
  user_result: correct
  learning_note: |
    Client traffic and load balancer health probes need separate allows.
    Allow AzureLoadBalancer at priority 150 before the port-443 deny at 200.
    Lower NSG priority numbers are evaluated first.
  explanation: |
    A — Yes is the intended answer. The question calls the value 150 a
    "cost"; for an NSG rule, the intended property is priority.

    Client requests from 131.107.100.50 are already allowed on TCP 443
    at priority 100. Azure Load Balancer preserves the client source IP
    for application traffic, so this client-specific allow is appropriate.

    Health probes originate from 168.63.129.16 for IPv4, represented by
    the AzureLoadBalancer service tag. If the probe uses port 443,
    BlockAllOther443 at priority 200 blocks it before the default
    AllowAzureLoadBalancerInBound rule at 65001 can be evaluated.

    The new allow at priority 150 is evaluated before the deny at 200,
    permitting health probes to reach VM2. Once the backend responds
    successfully, the load balancer can mark it healthy and send new
    connections to it. The new rule allows probes; it is not a replacement
    for the existing rule allowing the actual client's application traffic.

    The exhibit does not specify the probe port or VM1's configuration.
    Yes assumes the intended cause is blocked probes on port 443 and
    that there are no other connectivity or application blockers.

    Remember: client allow at 100; probe allow at 150; other 443 deny at 200.
    The default probe allow at 65001 cannot override a deny at 200.

    [Microsoft Learn: Health probe source and behavior](https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-custom-probe-overview)
    [Microsoft Learn: Load Balancer best practices](https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-best-practices)
- id: '069'
  skill: Implement and manage virtual networking
  sub-skill: Configure and manage virtual networks in Azure
  question: |
    You have an Azure subscription that contains a policy-based virtual
    network gateway named GW1 and a virtual network named VNet1.

    You need to ensure that you can configure a point-to-site connection
    from an on-premises computer to VNet1.

    Which two actions should you perform? Each correct answer presents
    part of the solution.

    NOTE: Each correct selection is worth one point.
  choices:
    A: Add a service endpoint to VNet1
    B: Reset GW1
    C: Create a route-based virtual network gateway
    D: Add a connection to GW1
    E: Delete GW1
    F: Add a public IP address space to VNet1
  answer: CE
  user_answer: BD
  user_result: incorrect
  learning_note: |
    Point-to-site VPN requires a route-based VPN gateway. A policy-based
    gateway cannot be converted in place; delete and recreate it as
    route-based. Resetting a gateway does not change its VPN type.
  explanation: |
    C and E are correct. Your supplied answer BD is preserved in
    user_answer, but answer is CE. Perform E first, then C: delete the
    policy-based GW1 and create a route-based VPN gateway for VNet1.

    Point-to-site (P2S) connects an individual computer to an Azure virtual
    network using a VPN client. Azure does not support P2S on policy-based
    VPN gateways. The VPN type cannot be changed from policy-based to
    route-based in place, so the existing gateway must be replaced.

    B — Reset GW1 is a troubleshooting operation. It does not change
    the gateway's VPN type or add point-to-site support.

    D — Adding a connection to GW1 does not overcome the policy-based
    gateway limitation. P2S settings, including a client address pool,
    tunnel protocol, and authentication, are configured on a supported
    gateway; clients then use the appropriate VPN client configuration.

    A — A service endpoint provides subnet-based access to supported Azure
    services. It does not establish a VPN from an on-premises computer.

    F — Adding public address space to VNet1 does not enable P2S. A P2S
    client address pool is a separate configuration and should not overlap
    with the networks the clients need to access.

    The selected actions make P2S configuration possible. Completing the
    connection also requires configuring P2S authentication and tunnel
    settings and setting up the client. Replacing GW1 interrupts any
    existing connections, which must be reconfigured as necessary.

    Remember: P2S requires route-based; change VPN type by delete and recreate.

    [Microsoft Learn: VPN Gateway FAQ](https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-vpn-faq)
    [Microsoft Learn: VPN gateway configuration settings](https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-about-vpn-gateway-settings)
- id: '070'
  tags: [must-review]
  skill: Implement and manage virtual networking
  sub-skill: Configure name resolution and load balancing
  question: |
    HOTSPOT

    You have an Azure subscription that contains the resources in the following table:

    | Name | Type |
    | --- | --- |
    | VMRG | Resource group |
    | VNet1 | Virtual network |
    | VNet2 | Virtual network |
    | VM5 | Virtual machine connected to VNet1 |
    | VM6 | Virtual machine connected to VNet2 |

    In Azure, you create a private DNS zone named adatum.com. You set the
    registration virtual network to VNet2. The adatum.com zone is configured
    as shown in the following exhibit:

    | Setting | Value |
    | --- | --- |
    | Resource group | vmrg |
    | Subscription | Azure Pass |
    | Subscription ID | a4fde29b-d56a-4f6c-8298-6c53cd0b720c |
    | Name server 1 | - |
    | Name server 2 | - |
    | Name server 3 | - |
    | Name server 4 | - |
    | Tags | Click here to add tags |

    | Name | Type | TTL | Value |
    | --- | --- | --- | --- |
    | @ | SOA | 3600 | Email: azuredns-hostmaster.microsoft.com; Host: internal.cloudapp.net; Refresh: 3600; Retry: 300; Expire: 2419200; Minimum TTL: 300; Serial number: 1 |
    | vm1 | A | 3600 | 10.1.0.4 |
    | vm9 | A | 3600 | 10.1.0.12 |

    For each of the following statements, select Yes if the statement is
    true. Otherwise, select No.

    NOTE: Each correct selection is worth one point.
  choices:
    The A record for VM5 will be registered automatically in the adatum.com zone.:
      - 'Yes'
      - 'No'
    VM5 can resolve VM9.adatum.com.:
      - 'Yes'
      - 'No'
    VM6 can resolve VM9.adatum.com.:
      - 'Yes'
      - 'No'
  answer:
    The A record for VM5 will be registered automatically in the adatum.com zone.: 'No'
    VM5 can resolve VM9.adatum.com.: 'No'
    VM6 can resolve VM9.adatum.com.: 'Yes'
  user_answer:
    The A record for VM5 will be registered automatically in the adatum.com zone.: 'No'
    VM5 can resolve VM9.adatum.com.: 'No'
    VM6 can resolve VM9.adatum.com.: 'No'
  user_result: partially_correct
  user_reasoning: |
    VM5 is not connected to VNet2, so its record will not be registered
    automatically. For the third statement, cited VM6.adatum.com when
    selecting No.
  learning_note: |
    A registration VNet link enables both automatic registration of its VMs
    and resolution of records in the private zone. A VM can resolve other
    hosts' records, not only its own name. Registration and resolution are
    separate functions.
  explanation: |
    The correct sequence is No, No, Yes. Your first two selections are
    correct; the third is incorrect.

    VM5 belongs to VNet1, but only VNet2 is specified as a registration
    virtual network. Therefore, VM5's A record is not automatically
    registered in adatum.com. In current terminology, VNet2 has a virtual
    network link with autoregistration enabled.

    No link from VNet1 to adatum.com or DNS forwarding arrangement is
    specified. Under the intended default DNS configuration, VM5 cannot
    resolve the private record VM9.adatum.com. Sharing a subscription or
    resource group does not grant private DNS resolution.

    VM6 belongs to VNet2. A registration virtual network can also resolve
    records in its linked private zone. The existing vm9 A record therefore
    resolves VM9.adatum.com to 10.1.0.12 for VM6. DNS names are case-insensitive.
    VM6 is not restricted to querying VM6.adatum.com: it can query other
    records in adatum.com, including manually created records.

    Name resolution does not prove that VM6 can connect to the returned IP.
    Routing, peering, and security rules govern connectivity separately.
    The question asks only whether the DNS name can be resolved.

    Remember: registration link = register own VNet's VMs plus resolve zone;
    resolution-only link = resolve zone without automatic VM registration.

    [Microsoft Learn: Private DNS virtual network links](https://learn.microsoft.com/en-us/azure/dns/private-dns-virtual-network-links)
    [Microsoft Learn: Private DNS autoregistration](https://learn.microsoft.com/en-us/azure/dns/private-dns-autoregistration)
- id: '071'
  tags: [must-review]
  skill: Implement and manage virtual networking
  sub-skill: Configure name resolution and load balancing
  question: |
    HOTSPOT

    You have an Azure subscription that contains the virtual networks
    shown in the following table.

    | Name | Location |
    | --- | --- |
    | VNET1 | West US |
    | VNET2 | West US |
    | VNET3 | East US |

    The subscription contains the private DNS zones shown in the following table.

    | Name | Location |
    | --- | --- |
    | Zone1.com | West US |
    | Zone2.com | West US |
    | Zone3.com | East US |

    You add virtual network links to the private DNS zones as shown
    in the following table.

    | Name | Private DNS zone | Virtual network | Enable auto registration |
    | --- | --- | --- | --- |
    | Link1 | Zone1.com | VNET1 | Yes |
    | Link2 | Zone2.com | VNET2 | No |
    | Link3 | Zone3.com | VNET3 | No |

    For each of the following statements, select Yes if the statement
    is true. Otherwise, select No.

    NOTE: Each correct selection is worth one point.
  choices:
    You can enable auto registration for Link2.:
      - 'Yes'
      - 'No'
    You can add a virtual network link for VNET1 to Zone3.com.:
      - 'Yes'
      - 'No'
    You can add a virtual network link for VNET2 to Zone1.com and enable auto registration.:
      - 'Yes'
      - 'No'
  answer:
    You can enable auto registration for Link2.: 'Yes'
    You can add a virtual network link for VNET1 to Zone3.com.: 'Yes'
    You can add a virtual network link for VNET2 to Zone1.com and enable auto registration.: 'Yes'
  user_answer:
    You can enable auto registration for Link2.: 'Yes'
    You can add a virtual network link for VNET1 to Zone3.com.: 'No'
    You can add a virtual network link for VNET2 to Zone1.com and enable auto registration.: 'No'
  user_result: partially_correct
  user_reasoning: |
    Selected Yes tentatively for enabling autoregistration on Link2.
    Believed linking VNET1 to Zone3.com required VNET1 and VNET3 to be peered.
    Selected No for linking VNET2 to Zone1.com with autoregistration because
    VNET2 currently has no autoregistration enabled.
  learning_note: |
    Private DNS zone links do not require VNet peering or matching regions.
    A VNet may resolve multiple linked zones but can autoregister in only
    one zone. One zone can have multiple autoregistration-enabled VNet links.
    Evaluate each statement independently against the original configuration.
  explanation: |
    The correct sequence is Yes, Yes, Yes. Your first selection is correct;
    the second and third are incorrect.

    1. Yes: VNET2 currently has a resolution-only link to Zone2.com and no
    autoregistration-enabled link. You can enable autoregistration on Link2,
    making Zone2.com its registration zone.

    2. Yes: VNET1 can have an additional resolution-only link to Zone3.com.
    Its existing registration link to Zone1.com does not prevent resolving
    another zone. Leave autoregistration disabled on the new link because
    VNET1 already registers in Zone1.com. No peering with VNET3 is required.
    A DNS zone link enables name resolution; it does not create network
    connectivity between the linked VNets.

    3. Yes: In the original configuration, VNET2 does not register in any
    zone, so a new link to Zone1.com can enable autoregistration. Zone1.com
    can accept automatic records from both VNET1 and VNET2. The limit is one
    registration zone per VNet, not one registration VNet per zone.

    Evaluate the statements independently, not as successive changes.
    If you first enabled autoregistration on Link2, you could not also
    enable it on VNET2's Zone1.com link without disabling it on Link2.

    The exhibit assigns regions to private DNS zones. Azure Private DNS
    zones are global resources; those displayed region labels do not
    constrain which VNets can be linked. Links support VNets across regions.

    Remember: many resolution zones per VNet; one registration zone per
    VNet; multiple registration VNets per zone; no peering needed for links.

    [Microsoft Learn: Private DNS virtual network links](https://learn.microsoft.com/en-us/azure/dns/private-dns-virtual-network-links)
    [Microsoft Learn: Private DNS FAQ](https://learn.microsoft.com/en-us/azure/dns/dns-faq-private)
    [Microsoft Learn: Private DNS overview](https://learn.microsoft.com/en-us/azure/dns/private-dns-overview)
- id: '072'
  skill: Implement and manage virtual networking
  sub-skill: Configure secure access to virtual networks
  question: |
    HOTSPOT

    You have an Azure subscription.

    You plan to use an Azure Resource Manager template to deploy a virtual
    network named VNET1 that will use Azure Bastion.

    How should you complete the template? To answer, select the appropriate
    options in the answer area.

    NOTE: Each correct selection is worth one point.

    ```json
    {
      "type": "Microsoft.Network/virtualNetworks",
      "name": "VNET1",
      "apiVersion": "2019-02-01",
      "location": "[resourceGroup().location]",
      "properties": {
        "addressSpace": {
          "addressPrefixes": ["10.10.10.0/24"]
        },
        "subnets": [
          {
            "name": "<subnet name>",
            "properties": {
              "addressPrefix": "<address prefix>"
            }
          },
          {
            "name": "LAN02",
            "properties": {
              "addressPrefix": "10.10.10.128/25"
            }
          }
        ]
      }
    }
    ```
  choices:
    Subnet name:
      - AzureBastionSubnet
      - AzureFirewallSubnet
      - LAN01
      - RemoteAccessSubnet
    Address prefix:
      - 10.10.10.0/27
      - 10.10.10.0/29
      - 10.10.10.0/30
  answer:
    Subnet name: AzureBastionSubnet
    Address prefix: 10.10.10.0/27
  user_answer:
    Subnet name: AzureBastionSubnet
    Address prefix: 10.10.10.0/27
  user_result: correct
  user_reasoning: |
    Selected AzureBastionSubnet (typed AzureBastionSubset) and /27, but
    asked why /27 is required when all offered ranges avoid overlap with LAN02.
  learning_note: |
    Nonoverlap is necessary but does not establish sufficient subnet size.
    /27 was Bastion's historical minimum; new dedicated Bastion deployments
    require /26 or larger. The supplied prefix choices are outdated.
    The required subnet name is AzureBastionSubnet, not AzureBastionSubset.
  explanation: |
    AzureBastionSubnet and 10.10.10.0/27 are the historical intended answers.
    Your answer is recorded as correct for that historical question, with
    the obvious typo AzureBastionSubset normalized to AzureBastionSubnet.
    For a new dedicated Bastion deployment today, none of the listed prefix
    choices is sufficient: use /26 or larger, such as 10.10.10.0/26.

    The subnet must have the exact name AzureBastionSubnet. AzureFirewallSubnet
    is reserved for Azure Firewall; LAN01 and RemoteAccessSubnet do not
    satisfy Bastion's dedicated subnet naming requirement.

    All three proposed ranges fit inside VNET1 and avoid LAN02. However,
    Azure Bastion also requires enough addresses for its service instances.
    The historical minimum was /27, so /29 and /30 were too small even
    though they did not overlap LAN02.

    | Prefix | Full address range | Total addresses |
    | --- | --- | --- |
    | 10.10.10.0/27 | 10.10.10.0–10.10.10.31 | 32 |
    | 10.10.10.0/29 | 10.10.10.0–10.10.10.7 | 8 |
    | 10.10.10.0/30 | 10.10.10.0–10.10.10.3 | 4 |
    | LAN02: 10.10.10.128/25 | 10.10.10.128–10.10.10.255 | 128 |

    For Bastion resources deployed on or after November 2, 2021, the minimum
    dedicated AzureBastionSubnet size is /26 or larger. Older /27 deployments
    remain supported. 10.10.10.0/26 spans .0–.63, fits within VNET1's /24,
    and does not overlap LAN02. Selecting an older ARM API version does
    not restore the historical minimum for a new deployment.

    Remember: check containment, nonoverlap, exact service subnet name,
    and service minimum size. Smaller CIDR prefix numbers mean larger subnets.

    [Microsoft Learn: Azure Bastion configuration settings](https://learn.microsoft.com/en-us/azure/bastion/configuration-settings)
- id: '073'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  question: |
    Note: This question is part of a series of questions that present the
    same scenario. Each question in the series contains a unique solution
    that might meet the stated goals. Some question sets might have more
    than one correct solution, while others might not have a correct solution.

    After you answer a question in this section, you will NOT be able to
    return to it. As a result, these questions will not appear in the review
    screen.

    You manage a virtual network named VNet1 that is hosted in the West US
    Azure region.

    VNet1 hosts two virtual machines named VM1 and VM2 that run Windows Server.

    You need to inspect all the network traffic from VM1 to VM2 for a
    period of three hours.

    Solution: From Azure Network Watcher, you create a packet capture.

    Does this meet the goal?
  choices:
    A: 'Yes'
    B: 'No'
  answer: A
  user_answer: A
  user_result: correct
  learning_note: |
    Packet capture records actual packets for inspection. Three hours is
    10,800 seconds, within the standard five-hour capture duration limit.
    Connection monitor measures connectivity and latency rather than
    recording every packet.
  explanation: |
    A — Yes is correct. Network Watcher packet capture records packets
    to and from a target VM for later analysis, for example with Wireshark.
    It is the appropriate feature for inspecting traffic between VM1 and VM2.

    Target VM1 and filter on VM2's private IP as the remote address, with
    protocol Any and no port restriction, to capture their traffic across
    protocols and ports. Such a filter captures both directions of the
    exchange; inspect source and destination addresses to identify VM1-to-VM2
    packets. Set the time limit to 10,800 seconds for three hours, which
    is within the standard capture session limit of 18,000 seconds (five hours).

    The VM requires the Network Watcher agent extension, and the capture
    needs a supported storage destination. Capture all bytes per packet
    rather than truncating packets, and provide sufficient capture capacity:
    reaching the configured size limit can stop capture before three hours.

    Connection monitor provides connectivity and latency measurements, not
    the packet contents. IP flow verify checks security-rule decisions,
    while flow logs provide flow metadata rather than a full packet capture.
    Packet capture records encrypted traffic as transmitted; it does not
    automatically decrypt application payloads.

    Remember: inspect packets = packet capture;
    monitor RTT and connectivity = Connection monitor.

    [Microsoft Learn: Manage Network Watcher packet captures](https://learn.microsoft.com/en-us/azure/network-watcher/packet-capture-manage)
    [Microsoft Learn: Packet capture overview](https://learn.microsoft.com/en-us/azure/network-watcher/packet-capture-overview)
- id: '074'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  question: |
    Note: This question is part of a series of questions that present the
    same scenario. Each question in the series contains a unique solution
    that might meet the stated goals. Some question sets might have more
    than one correct solution, while others might not have a correct solution.

    After you answer a question in this section, you will NOT be able to
    return to it. As a result, these questions will not appear in the review
    screen.

    You manage a virtual network named VNet1 that is hosted in the West US
    Azure region.

    VNet1 hosts two virtual machines named VM1 and VM2 that run Windows Server.

    You need to inspect all the network traffic from VM1 to VM2 for a
    period of three hours.

    Solution: From Azure Network Watcher, you create a connection monitor.

    Does this meet the goal?
  choices:
    A: 'Yes'
    B: 'No'
  answer: B
  user_answer: A
  user_result: incorrect
  learning_note: |
    Connection monitor measures connectivity, failed checks, and round-trip
    latency using test traffic. It does not record all application packets.
    Use packet capture when the requirement is to inspect actual traffic.
  explanation: |
    B — No is correct. Your supplied answer A is preserved in user_answer,
    but answer is B. The decisive requirement is to inspect all network
    traffic from VM1 to VM2, not merely monitor whether their connection
    is available or how quickly test traffic completes a round trip.

    Connection monitor performs repeated connection tests and reports
    metrics such as round-trip time and the percentage of failed checks.
    Running it for three hours does not produce a capture of every packet
    exchanged by the applications on VM1 and VM2.

    Network Watcher packet capture is the appropriate feature, as in
    Question 073. Target VM1, filter on VM2's private IP with all protocols
    and ports, and configure a 10,800-second capture with sufficient storage
    capacity. Captured packets can then be inspected with a packet analyzer.

    Remember: connection health and RTT = Connection monitor;
    inspect actual packets = packet capture.

    [Microsoft Learn: Connection monitor overview](https://learn.microsoft.com/en-us/azure/networking/network-monitoring-overview)
    [Microsoft Learn: Network Watcher packet capture](https://learn.microsoft.com/en-us/azure/network-watcher/packet-capture-overview)
- id: '075'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  question: |
    Note: This question is part of a series of questions that present the
    same scenario. Each question in the series contains a unique solution
    that might meet the stated goals. Some question sets might have more
    than one correct solution, while others might not have a correct solution.

    After you answer a question in this section, you will NOT be able to
    return to it. As a result, these questions will not appear in the review
    screen.

    You manage a virtual network named VNet1 that is hosted in the West US
    Azure region.

    VNet1 hosts two virtual machines named VM1 and VM2 that run Windows Server.

    You need to inspect all the network traffic from VM1 to VM2 for a
    period of three hours.

    Solution: From Performance Monitor, you create a Data Collector Set (DCS).

    Does this meet the goal?
  choices:
    A: 'Yes'
    B: 'No'
  answer: B
  user_answer: A
  user_result: incorrect
  learning_note: |
    Performance Monitor Data Collector Sets collect counters, event traces,
    and configuration data. Creating an unspecified DCS is not a full packet
    capture. Use Network Watcher packet capture to inspect network packets.
  explanation: |
    B — No is the intended answer. Your supplied answer A is preserved in
    user_answer, but answer is B. This is recorded as Question 075 based
    on its position after Question 074.

    A Performance Monitor Data Collector Set groups performance counters,
    event trace collectors, and configuration data collectors for logging.
    Network counters can show traffic rates, errors, and other performance
    statistics, but those statistics are not the actual packets exchanged
    between VM1 and VM2.

    The proposed solution only creates a DCS; it does not specify a packet
    capture provider or packet-level tracing configuration. A generic DCS
    therefore does not establish capture of all the required network traffic.
    Windows has packet-level tracing tools, but those would require a
    specifically configured capture rather than the stated generic solution.

    Use Azure Network Watcher packet capture, as in Question 073. Target
    VM1, filter on VM2's private IP with all protocols and ports, and set
    the capture duration to 10,800 seconds with sufficient storage capacity.

    Remember: performance counters summarize activity;
    packet capture records packets for inspection.

    [Microsoft Learn: Performance Monitor](https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/perfmon)
    [Microsoft Learn: Network Watcher packet capture](https://learn.microsoft.com/en-us/azure/network-watcher/packet-capture-overview)
- id: '076'
  skill: Implement and manage virtual networking
  sub-skill: Configure name resolution and load balancing
  question: |
    DRAG DROP

    You have an Azure subscription that contains the resources shown
    in the following table.

    | Name | Type | Description |
    | --- | --- | --- |
    | vm1 | Virtual machine | Uses a basic public IP address |
    | vm2 | Virtual machine | Uses a basic public IP address |
    | nsg1 | Network security group (NSG) | Allows incoming traffic from port 443 |
    | lb1 | Azure Standard Load Balancer | Not applicable |

    You need to load balance HTTPS connections to vm1 and vm2 by using lb1.

    Which three actions should you perform in sequence? To answer, move
    the appropriate actions from the list of actions to the answer area
    and arrange them in the correct order.
  choices:
    - Remove nsg1.
    - Remove the public IP addresses from vm1 and vm2.
    - Create a health probe and backend pool on lb1.
    - Create an availability set.
    - Create a load balancing rule on lb1.
  answer:
    - Remove the public IP addresses from vm1 and vm2.
    - Create a health probe and backend pool on lb1.
    - Create a load balancing rule on lb1.
  user_answer:
    - Remove nsg1.
    - Create a health probe and backend pool on lb1.
    - Create a load balancing rule on lb1.
  user_result: partially_correct
  learning_note: |
    Remove incompatible Basic public IP associations before adding the
    VMs to a Standard Load Balancer's NIC-based backend pool. Retain the
    NSG that allows HTTPS. Create the backend pool and health probe before
    the load balancing rule that references them.
  explanation: |
    The correct sequence is:
    1. Remove the public IP addresses from vm1 and vm2.
    2. Create a health probe and backend pool on lb1.
    3. Create a load balancing rule on lb1.

    Your second and third steps are correct. Replace Remove nsg1 with
    Remove the public IP addresses from vm1 and vm2.

    The VMs have Basic SKU public IP addresses, which conflict with the
    Standard Load Balancer for the intended NIC-based backend pool.
    Disassociate those public IPs; lb1 forwards traffic to the VMs' private
    IPs, so backend VMs do not need individual public IPs. Replacing the
    public IPs with Standard SKU addresses would be another possible
    approach, but it is not among the offered actions.

    Add vm1 and vm2 to the backend pool and create a suitable health probe.
    Then create the rule referencing that pool and probe, normally mapping
    frontend TCP port 443 to backend TCP port 443. Azure Load Balancer
    forwards HTTPS at the transport layer; TLS terminates on the backend
    applications rather than on the load balancer.

    Keep nsg1: its HTTPS allowance is needed for application traffic.
    The exhibit says traffic "from port 443"; the intended interpretation
    is inbound destination port 443. Also ensure the actual NSG rules allow
    AzureLoadBalancer health probes on the configured probe port, and
    that guest firewalls and applications accept the traffic.

    Creating an availability set is unnecessary. Standard Load Balancer
    supports backend VMs across availability sets or standalone VMs within
    the same virtual network. The rule requires its pool and probe to exist,
    which explains the order of the final two actions.

    Basic public IPs are a legacy part of this scenario. They retired on
    September 30, 2025; current deployments should use Standard resources.
    The question assumes lb1 already has the necessary frontend configuration.

    Remember: fix SKU compatibility, create pool and probe, then create rule;
    preserve the NSG allowance for HTTPS and health probes.

    [Microsoft Learn: Load Balancer SKUs](https://learn.microsoft.com/en-us/azure/load-balancer/skus)
    [Microsoft Learn: Load Balancer components](https://learn.microsoft.com/en-us/azure/load-balancer/components)
    [Microsoft Learn: Load Balancer health probes](https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-custom-probe-overview)
- id: '077'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  question: |
    Note: This question is part of a series of questions that present the
    same scenario. Each question in the series contains a unique solution
    that might meet the stated goals. Some question sets might have more
    than one correct solution, while others might not have a correct solution.

    After you answer a question in this section, you will NOT be able to
