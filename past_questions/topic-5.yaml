- id: '053'
  tags: [must-review]
  skill: Implement and manage virtual networking
  sub-skill: Configure and manage virtual networks in Azure
  question: |
    Note: This question is part of a series of questions that present the
    same scenario. Each question in the series contains a unique solution
    that might meet the stated goals. Some question sets might have more
    than one correct solution, while others might not have a correct solution.

    After you answer a question in this section, you will NOT be able to
    return to it. As a result, these questions will not appear in the review
    screen.

    You have a computer named Computer1 that has a point-to-site VPN
    connection to an Azure virtual network named VNet1. The point-to-site
    connection uses a self-signed certificate.

    From Azure, you download and install the VPN client configuration
    package on a computer named Computer2.

    You need to ensure that you can establish a point-to-site VPN connection
    to VNet1 from Computer2.

    Solution: You export the client certificate from Computer1 and install
    the certificate on Computer2.

    Does this meet the goal?
  choices:
    A: 'Yes'
    B: 'No'
  answer: A
  user_answer: B
  user_result: incorrect
  learning_note: |
    Exporting and installing the client certificate meets the goal when
    the export includes its private key and certificate chain, normally
    in a PFX file. A public-only CER file cannot authenticate the client.
    A certificate includes a public key; its private key is stored separately.
  explanation: |
    A — Yes is the intended answer, assuming the client certificate is
    exported with its private key and certificate chain as a PFX file.
    Install it on Computer2 in the appropriate client certificate store.
    Microsoft documents this as a supported way to configure another
    computer for certificate-based point-to-site authentication.

    The question omits the export format. If only the public certificate
    were exported as a CER file, the solution would be insufficient because
    Computer2 would lack the private key needed to authenticate. The VPN
    client configuration package provides connection settings, not the
    client's private key.

    The correct term is self-signed certificate, not self-signed key. A
    certificate contains a public key, identity information, and a signature.
    The corresponding private key is stored separately. Self-signed means
    the certificate is signed using its own corresponding private key,
    rather than a separate certificate authority's key. A PFX file can
    package a certificate with its private key and certificate chain;
    the certificate itself does not contain the private key.

    In this Azure workflow, a self-signed root certificate acts as the trust
    anchor. Its private key signs client certificates, each with its own
    public/private key pair. Azure receives the root's public certificate;
    each connecting computer needs a valid client certificate and its
    matching private key. Computer2 does not need the root private key.

    Remember: certificate = public identity information; private key =
    proof of possession for authentication. Copy the client credential,
    not just its public certificate.

    [Microsoft Learn: P2S client certificate export requirements](https://learn.microsoft.com/en-us/azure/vpn-gateway/point-to-site-vpn-client-certificate-windows-azure-vpn-client)
    [Microsoft Learn: Install a client certificate](https://learn.microsoft.com/en-us/azure/vpn-gateway/point-to-site-how-to-vpn-client-install-azure-cert)
    [Microsoft Learn: Root and client certificate setup](https://learn.microsoft.com/en-us/azure/vpn-gateway/point-to-site-certificate-gateway)
- id: '054'
  skill: Implement and manage virtual networking
  sub-skill: Configure secure access to virtual networks
  question: |
    You have an Azure virtual machine named VM1. The network interface
    for VM1 is configured as shown in the exhibit.

    | Setting | Value |
    | --- | --- |
    | Network interface | vm1175 |
    | Virtual network/subnet | RG5-vnet/default |
    | Public IP | 40.127.109.108 |
    | Private IP | 172.16.1.4 |
    | Accelerated networking | Disabled |
    | Network security group | VM1-nsg, attached to vm1175 |
    | NSG associations | 0 subnets, 1 network interface |

    The inbound port rules are shown below. The exhibit truncates the
    default load-balancer rule name and source; their standard names
    are expanded here.

    | Priority | Name | Port | Protocol | Source | Destination | Action |
    | --- | --- | --- | --- | --- | --- | --- |
    | 300 | RDP | 3389 | TCP | Any | Any | Allow |
    | 400 | Rule1 | 80 | TCP | Any | Any | Deny |
    | 500 | Rule2 | 80,443 | TCP | Any | Any | Deny |
    | 1000 | Rule4 | 50-100,400-500 | UDP | Any | Any | Allow |
    | 2000 | Rule5 | 50-5000 | Any | Any | VirtualNetwork | Deny |
    | 3000 | Rule6 | 150-300 | Any | Any | Any | Allow |
    | 4000 | Rule3 | 60-500 | Any | Any | VirtualNetwork | Allow |
    | 65000 | AllowVnetInBound | Any | Any | VirtualNetwork | VirtualNetwork | Allow |
    | 65001 | AllowAzureLoadBalancerInBound | Any | Any | AzureLoadBalancer | Any | Allow |
    | 65500 | DenyAllInBound | Any | Any | Any | Any | Deny |

    You deploy a web server on VM1, and then create a secure website that
    is accessible by using the HTTPS protocol. VM1 is used as a web server
    only.

    You need to ensure that users can connect to the website from the Internet.
    What should you do?
  choices:
    A: Modify the protocol of Rule4
    B: Delete Rule1
    C: For Rule5, change the Action to Allow and change the priority to 401
    D: Create a new inbound rule that allows TCP protocol 443 and configure the rule to have a priority of 501
  answer: C
  user_answer: C
  user_result: correct
  learning_note: |
    NSGs use the first matching rule in ascending priority-number order.
    An allow for TCP 443 must precede Rule2 at priority 500. An inbound
    VirtualNetwork destination can match Internet-originated traffic to
    the VM's translated private IP; source and destination are distinct.
  explanation: |
    C is correct. HTTPS uses TCP port 443 in this scenario. Rule1 at priority
    400 only denies TCP 80, so it does not match the HTTPS connection.
    Moving Rule5 to priority 401 and changing its action to Allow makes
    it the first matching rule: its port range 50-5000 includes 443, its
    protocol Any includes TCP, and its source Any includes Internet clients.
    Processing stops before Rule2 at priority 500 can deny TCP 443.

    Rule5's VirtualNetwork destination includes VM1's private IP. Azure
    translates inbound public-IP traffic to the private IP before NSG
    evaluation. A VirtualNetwork destination does not require the source
    to be inside the VNet; this rule's source is Any.

    A leaves Rule4 at priority 1000, after the matching deny at 500, even
    if its protocol is changed to TCP. B removes a TCP 80 deny but leaves
    Rule2's TCP 443 deny. D's new allow at 501 also comes after Rule2 and
    therefore cannot override it.

    The offered solution allows a broad port range. A targeted TCP 443
    allow with a priority number below 500 would be more restrictive for
    a web-only deployment, but it is not offered. The guest firewall and
    web service must also allow and listen on TCP 443 for actual connectivity.

    Remember: lower number is evaluated first; the first matching rule wins.

    [Microsoft Learn: NSG rule priority and inbound address translation](https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview)
- id: '055'
  skill: Manage Azure identities and governance
  sub-skill: Manage Azure subscriptions and governance
  question: |
    Note: This question is part of a series of questions that present the
    same scenario. Each question in the series contains a unique solution
    that might meet the stated goals. Some question sets might have more
    than one correct solution, while others might not have a correct solution.

    After you answer a question in this section, you will NOT be able to
    return to it. As a result, these questions will not appear in the review
    screen.

    You have an Azure subscription that contains 10 virtual networks.
    The virtual networks are hosted in separate resource groups.

    Another administrator plans to create several network security groups
    (NSGs) in the subscription.

    You need to ensure that when an NSG is created, it automatically blocks
    TCP port 8080 between the virtual networks.

    Solution: From the Resource providers blade, you unregister the
    Microsoft.ClassicNetwork provider.

    Does this meet the goal?
  choices:
    A: 'Yes'
    B: 'No'
  answer: B
  user_answer: B
  user_result: correct
  learning_note: |
    Resource provider registration controls resource operations; it does
    not deploy NSG rules. Azure Policy can automate required configuration
    across resource groups through a subscription-scoped assignment.
  explanation: |
    B — No is correct. Unregistering Microsoft.ClassicNetwork does not
    create a TCP 8080 deny rule in new NSGs. It concerns the classic
    networking provider, whereas modern NSGs are resources under
    Microsoft.Network/networkSecurityGroups. Even unregistering the modern
    provider would not configure traffic filtering rules.

    A suitable automation mechanism is a subscription-scoped Azure Policy
    assignment using deployIfNotExists to deploy the required NSG security
    rule when missing. The assignment needs a managed identity with the
    required deployment permissions. The rule must have appropriate source
    and destination ranges, protocol TCP, destination port 8080, and a
    priority that precedes matching allow rules. The NSG must also be
    associated with the relevant subnet or NIC to enforce traffic filtering.

    deployIfNotExists deploys after successful resource creation or update
    and a configurable evaluation delay. It is not an atomic guarantee
    that a newly created NSG has the rule at the instant of creation.
    Existing noncompliant NSGs can be handled with remediation tasks.

    Remember: provider registration enables resource operations; Policy
    enforces configuration; NSG rules filter traffic.

    [Microsoft Learn: Resource provider registration](https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/resource-providers-and-types)
    [Microsoft Learn: deployIfNotExists behavior](https://learn.microsoft.com/en-us/azure/governance/policy/concepts/effect-deploy-if-not-exists)
- id: '056'
  skill: Implement and manage virtual networking
  sub-skill: Configure and manage virtual networks in Azure
  question: |
    HOTSPOT -

    You manage two Azure subscriptions named Subscription1 and Subscription2.
    Subscription1 has the following virtual networks:

    | Name | Address space | Location |
    | --- | --- | --- |
    | VNET1 | 10.10.10.0/24 | West Europe |
    | VNET2 | 172.16.0.0/16 | West US |

    The virtual networks contain the following subnets:

    | Name | Address space | In virtual network |
    | --- | --- | --- |
    | Subnet11 | 10.10.10.0/24 | VNET1 |
    | Subnet21 | 172.16.0.0/18 | VNET2 |
    | Subnet22 | 172.16.128.0/18 | VNET2 |

    Subscription2 contains the following virtual network:

    - Name: VNETA
    - Address space: 10.10.128.0/17
    - Location: Canada Central

    VNETA contains the following subnets:

    | Name | Address space |
    | --- | --- |
    | SubnetA1 | 10.10.130.0/24 |
    | SubnetA2 | 10.10.131.0/24 |

    For each statement, select Yes if the statement is true. Otherwise,
    select No. Each correct selection is worth one point.
  choices:
    A Site-to-Site connection can be established between VNET1 and VNET2.:
      - 'Yes'
      - 'No'
    VNET1 and VNET2 can be peered.:
      - 'Yes'
      - 'No'
    VNET1 and VNETA can be peered.:
      - 'Yes'
      - 'No'
  answer:
    A Site-to-Site connection can be established between VNET1 and VNET2.: 'Yes'
    VNET1 and VNET2 can be peered.: 'Yes'
    VNET1 and VNETA can be peered.: 'Yes'
  user_answer:
    A Site-to-Site connection can be established between VNET1 and VNET2.: 'Yes'
    VNET1 and VNET2 can be peered.: 'Yes'
    VNET1 and VNETA can be peered.: 'Yes'
  user_result: correct
  user_reasoning: |
    Selected Yes for VNET1-to-VNET2 peering because their IP address spaces
    do not overlap.
  learning_note: |
    VNet peering supports different subscriptions, different Microsoft
    Entra tenants, and different supported regions. Both sides need proper
    permissions, and address spaces must not overlap. Compare full CIDR
    ranges rather than only their shared leading octets.
  explanation: |
    Yes, Yes, Yes is the intended answer.

    VNET1 and VNET2 can be connected through VPN gateways across regions
    because their address spaces do not overlap. Suitable gateways,
    GatewaySubnets, and connection configuration are required. Subnet11
    currently occupies VNET1's entire /24, so its address allocation must
    be changed or additional address space added to accommodate a
    GatewaySubnet. The statement asks whether a connection can be
    established, not whether no prerequisite changes are needed.

    VNET1 and VNET2 can use global VNet peering between West Europe and
    West US. Their 10.10.10.0/24 and 172.16.0.0/16 ranges are disjoint.

    VNET1 and VNETA can also use global VNet peering across Subscription1
    and Subscription2. Cross-subscription peering is supported, including
    when subscriptions belong to different Microsoft Entra tenants,
    provided the required permissions are configured on both sides.
    Configure reciprocal peering links to establish connectivity.

    VNET1 covers 10.10.10.0 through 10.10.10.255. VNETA covers
    10.10.128.0 through 10.10.255.255. The shared 10.10 prefix does not
    imply overlap. Compare the full VNet address spaces, not only subnets.

    Remember: different subscriptions and regions are supported;
    overlapping address spaces prevent ordinary VNet peering.

    [Microsoft Learn: VNet peering requirements](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-manage-peering)
    [Microsoft Learn: Cross-subscription and cross-tenant peering](https://learn.microsoft.com/en-us/azure/virtual-network/create-peering-different-subscriptions)
    [Microsoft Learn: VPN Gateway FAQ](https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-vpn-faq)
- id: '057'
  skill: Implement and manage virtual networking
  sub-skill: Configure secure access to virtual networks
  question: |
    Note: This question is part of a series of questions that present the
    same scenario. Each question in the series contains a unique solution
    that might meet the stated goals. Some question sets might have more
    than one correct solution, while others might not have a correct solution.

    After you answer a question in this section, you will NOT be able to
    return to it. As a result, these questions will not appear in the review
    screen.

    You have an app named App1 that is installed on two Azure virtual
    machines named VM1 and VM2. Connections to App1 are managed by using
    an Azure Load Balancer.

    The effective network security configurations for VM2 are shown in
    the following exhibit.

    | Setting | Value |
    | --- | --- |
    | Network interface | VM2-NIC1 |
    | Virtual network/subnet | Vnet1/Subnet11 |
    | NIC public IP | None |
    | NIC private IP | 10.240.11.5 |
    | Accelerated networking | Disabled |
    | Network security group | NSG2 |
    | NSG association | Subnet11; impacts 1 subnet, 0 network interfaces |

    The exhibit's association label inconsistently calls Subnet11 a
    network interface; the association counts identify a subnet association.

    | Priority | Name | Port | Protocol | Source | Destination | Action |
    | --- | --- | --- | --- | --- | --- | --- |
    | 100 | Allow_131.107.100.50 | 443 | TCP | 131.107.100.50 | VirtualNetwork | Allow |
    | 200 | BlockAllOther443 | 443 | Any | Any | Any | Deny |
    | 65000 | AllowVnetInBound | Any | Any | VirtualNetwork | VirtualNetwork | Allow |
    | 65001 | AllowAzureLoadBalancerInBound | Any | Any | AzureLoadBalancer | Any | Allow |
    | 65500 | DenyAllInBound | Any | Any | Any | Any | Deny |

    You discover that connections to App1 from 131.107.100.50 over TCP
    port 443 fail. You verify that the Load Balancer rules are configured
    correctly.

    You need to ensure that connections to App1 can be established
    successfully from 131.107.100.50 over TCP port 443.

    Solution: You create an inbound security rule that denies all traffic
    from the 131.107.100.50 source and has a cost of 64999.

    Does this meet the goal?
  choices:
    A: 'Yes'
    B: 'No'
  answer: B
  user_answer: A
  user_result: incorrect
  user_reasoning: |
    Assumed the goal was to block connections from the load balancer.
  learning_note: |
    Read the goal as allowing successful client connections. Load-balanced
    application traffic preserves the client source IP; AzureLoadBalancer
    identifies health probes. Allow the client and the probes separately.
    NSG rules stop at the first match, and custom priorities are 100-4096.
  explanation: |
    B — No. The goal is to allow connections from 131.107.100.50 over
    TCP 443, not block the load balancer. Adding a deny does not fix that.

    The proposed cost is apparently intended to mean NSG priority. Custom
    NSG priorities must be between 100 and 4096, so 64999 is invalid for
    a custom rule. Even treating it hypothetically as a permitted priority,
    it would be evaluated after the existing TCP 443 allow at priority 100
    and could not override that first matching rule.

    Azure Load Balancer preserves the client source IP for application
    traffic. Requests from 131.107.100.50 therefore match the existing
    allow at priority 100. The VirtualNetwork destination includes VM2's
    private address after inbound destination translation.

    Health probes are separate traffic. IPv4 probes originate from
    168.63.129.16, represented by the AzureLoadBalancer service tag. If the
    probe uses port 443, BlockAllOther443 at priority 200 denies it before
    the default probe allow at 65001 is reached. Failed probes can mark
    a backend unhealthy and stop new traffic being sent to it. Allow probe
    traffic on its configured port with a valid priority before 200.

    The exhibit does not show the probe port or VM1's security settings,
    so probe blocking on 443 is a likely diagnosis, not a proven complete
    explanation for the entire application's failure. The proposed deny
    still does not meet the goal regardless of that uncertainty.

    Remember: client traffic keeps the client IP; health probes use
    AzureLoadBalancer. Permit both, and check the first matching rule.

    [Microsoft Learn: Client source preservation and probe access](https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-best-practices)
    [Microsoft Learn: Health probe source and behavior](https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-custom-probe-overview)
    [Microsoft Learn: NSG priority limits](https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview)
- id: '058'
  skill: Implement and manage virtual networking
  sub-skill: Configure secure access to virtual networks
  question: |
    Note: This question is part of a series of questions that present the
    same scenario. Each question in the series contains a unique solution
    that might meet the stated goals. Some question sets might have more
    than one correct solution, while others might not have a correct solution.

    After you answer a question in this section, you will NOT be able to
    return to it. As a result, these questions will not appear in the review
    screen.

    You have an app named App1 that is installed on two Azure virtual
    machines named VM1 and VM2. Connections to App1 are managed by using
    an Azure Load Balancer.

    The effective network security configurations for VM2 are shown in
    the following exhibit.

    | Setting | Value |
    | --- | --- |
    | Network interface | VM2-NIC1 |
    | Virtual network/subnet | Vnet1/Subnet11 |
    | NIC public IP | None |
    | NIC private IP | 10.240.11.5 |
    | Accelerated networking | Disabled |
    | Network security group | NSG2 |
    | NSG association | Subnet11; impacts 1 subnet, 0 network interfaces |

    The exhibit's association label inconsistently calls Subnet11 a
    network interface; the association counts identify a subnet association.

    | Priority | Name | Port | Protocol | Source | Destination | Action |
    | --- | --- | --- | --- | --- | --- | --- |
    | 100 | Allow_131.107.100.50 | 443 | TCP | 131.107.100.50 | VirtualNetwork | Allow |
    | 200 | BlockAllOther443 | 443 | Any | Any | Any | Deny |
    | 65000 | AllowVnetInBound | Any | Any | VirtualNetwork | VirtualNetwork | Allow |
    | 65001 | AllowAzureLoadBalancerInBound | Any | Any | AzureLoadBalancer | Any | Allow |
    | 65500 | DenyAllInBound | Any | Any | Any | Any | Deny |

    You discover that connections to App1 from 131.107.100.50 over TCP
    port 443 fail. You verify that the Load Balancer rules are configured
    correctly.

    You need to ensure that connections to App1 can be established
    successfully from 131.107.100.50 over TCP port 443.

    Solution: You delete the BlockAllOther443 inbound security rule.

    Does this meet the goal?
  choices:
    A: 'Yes'
    B: 'No'
  answer: A
  user_answer: A
  user_result: correct
  learning_note: |
    The client is already allowed at priority 100. Removing the port-443
    deny restores the default health-probe allowance, assuming probes use
    that port. Client permission and health-probe permission are separate.
  explanation: |
    A — Yes is the intended answer. BlockAllOther443 at priority 200
    denies traffic on port 443 from sources other than the explicitly
    allowed client. If the load balancer probes on port 443, this blocks
    probes from 168.63.129.16 before the default AzureLoadBalancer allow
    at priority 65001 can be evaluated.

    Deleting that deny allows the default AllowAzureLoadBalancerInBound
    rule to permit health probes. Once the backend responds successfully,
    the load balancer can mark it healthy and send new connections to it.
    Client requests from 131.107.100.50 remain allowed by priority 100;
    Azure Load Balancer preserves the original client source IP.

    The exhibit omits the probe port and VM1's configuration. The intended
    diagnosis assumes probing on port 443 and no other blockers. Deleting
    this rule would not fix an unrelated application, routing, or guest
    firewall problem.

    Deletion also removes the restriction for other sources. VNet traffic
    can then match AllowVnetInBound. Other unsolicited inbound traffic
    still encounters DenyAllInBound unless another allow applies. A more
    targeted alternative is to allow AzureLoadBalancer probe traffic on
    its configured port with a valid priority before 200 while retaining
    the deny. The question does not require minimum access or least change.

    Remember: a client allow does not guarantee that probes are allowed;
    healthy backends need both application and probe connectivity.

    [Microsoft Learn: Health probe source and behavior](https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-custom-probe-overview)
    [Microsoft Learn: Separate application and probe access](https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-best-practices)
- id: '059'
  skill: Implement and manage virtual networking
  sub-skill: Configure secure access to virtual networks
  question: |
    Note: This question is part of a series of questions that present the
    same scenario. Each question in the series contains a unique solution
