- id: '011'
  skill: Implement and manage virtual networking
  sub-skill: Configure secure access to virtual networks
  question: |
    You have an Azure subscription that contains the resources in the following table.

    | Name | Type | Azure region | Resource group |
    | --- | --- | --- | --- |
    | VNet1 | Virtual network | West US | RG2 |
    | VNet2 | Virtual network | West US | RG1 |
    | VNet3 | Virtual network | East US | RG1 |
    | NSG1 | Network security group (NSG) | East US | RG2 |

    To which subnets can you apply NSG1?
  choices:
    A: the subnets on VNet1 only
    B: the subnets on VNet2 and VNet3 only
    C: the subnets on VNet2 only
    D: the subnets on VNet3 only
    E: the subnets on VNet1, VNet2, and VNet3
  answer: D
  user_answer: D
  user_result: correct
  learning_note: |
    An NSG and the virtual network whose subnet it protects must be in the
    same region and subscription. They can belong to different resource
    groups. Match the resource region, not the resource group.
  explanation: |
    **D — the subnets on VNet3 only** is correct.

    NSG1 is in East US. VNet3 is the only virtual network in East US, so
    its subnets can be associated with NSG1. VNet3 being in RG1 while
    NSG1 is in RG2 does not prevent the association.

    VNet1 is in West US. Sharing RG2 with NSG1 does not override the
    requirement that the NSG and virtual network be in the same region.
    VNet2 is also in West US and cannot use this East US NSG.

    A, B, C, and E each include at least one West US virtual network.
    Resource groups organize resources and permissions; they do not make
    a regional NSG usable across regions. The question already places
    all resources in the same subscription.

    Remember: same resource region required; same resource group not required.

    [Microsoft Learn: Plan Azure virtual networks](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-vnet-plan-design-arm)
    [Microsoft Learn: Manage network security groups](https://learn.microsoft.com/en-us/azure/virtual-network/manage-network-security-group)
- id: '012'
  skill: Implement and manage virtual networking
  sub-skill: Configure and manage virtual networks in Azure
  question: |
    DRAG DROP

    You have an Azure subscription that contains two virtual networks named
    VNet1 and VNet2. Virtual machines connect to the virtual networks.

    The virtual networks have the address spaces and the subnets configured
    as shown in the following table.

    | Virtual network | Address space | Subnet | Peering |
    | --- | --- | --- | --- |
    | VNet1 | 10.1.0.0/16 | 10.1.0.0/24; 10.1.1.0/26 | VNet2 |
    | VNet2 | 10.2.0.0/16 | 10.2.0.0/24 | VNet1 |

    You need to add the address space of 10.33.0.0/16 to VNet1. The solution
    must ensure that the hosts on VNet1 and VNet2 can communicate.

    Which three actions should you perform in sequence? To answer, move
    the appropriate options from the list of actions to the answer area
    and arrange them in the correct order.
  choices:
    - Remove VNet1.
    - Add the 10.33.0.0/16 address space to VNet1.
    - Create a new virtual network named VNet1.
    - On the peering connection in VNet2, allow gateway transit.
    - Recreate peering between VNet1 and VNet2.
    - On the peering connection in VNet1, allow gateway transit.
    - Remove peering between VNet1 and VNet2.
  answer:
    - Remove peering between VNet1 and VNet2.
    - Add the 10.33.0.0/16 address space to VNet1.
    - Recreate peering between VNet1 and VNet2.
  user_answer:
    - Remove peering between VNet1 and VNet2.
    - Add the 10.33.0.0/16 address space to VNet1.
    - Recreate peering between VNet1 and VNet2.
  user_result: correct
  learning_note: |
    The legacy exam sequence is remove peering, add the address range,
    and recreate peering. Current Azure supports adding address space
    while peering remains in place, followed by synchronizing the peer.
    Removing peering is no longer required and temporarily breaks connectivity.
  explanation: |
    Your sequence is correct for this older question's supplied choices:

    1. Remove peering between VNet1 and VNet2.
    2. Add the 10.33.0.0/16 address space to VNet1.
    3. Recreate peering between VNet1 and VNet2.

    Historically, peering had to be removed before changing a VNet's
    address space. Recreating the peering restored connectivity with the
    updated ranges. Add the new range alongside 10.1.0.0/16; do not replace
    the existing range containing VNet1's subnets. The new 10.33.0.0/16
    range does not overlap VNet1's or VNet2's existing address space.

    Removing and recreating VNet1 is unnecessary and would disrupt its
    attached resources. Gateway transit shares a VPN or ExpressRoute
    gateway with a peer; it is unrelated to this address-space update.

    Current Azure supports resizing peered VNets without removing peering.
    Add 10.33.0.0/16 to VNet1, then synchronize the peering on VNet2 so it
    learns VNet1's updated address space. Existing address-space connectivity
    remains available. Sync is missing from the offered actions, so answer
    preserves the intended historical sequence rather than presenting it
    as a current requirement.

    The remove/recreate sequence temporarily interrupts communication.
    If uninterrupted connectivity were required throughout the change,
    that legacy sequence would not satisfy it.

    Remember: current Azure = add address space, then sync peering;
    legacy question = remove, add, recreate.

    [Microsoft Learn: Resize peered VNet address spaces](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-peering-overview)
    [Microsoft Azure: Announcement removing the historical resizing restriction](https://azure.microsoft.com/en-us/blog/how-to-resize-azure-virtual-networks-that-are-peered-now-in-preview/)
- id: '013'
  skill: Manage Azure identities and governance
  sub-skill: Manage Azure subscriptions and governance
  question: |
    HOTSPOT

    You have an Azure subscription that contains the resource groups shown
    in the following table.

    | Name | Location |
    | --- | --- |
    | RG1 | West US |
    | RG2 | East US |

    RG1 contains the resources shown in the following table.

    | Name | Type | Location |
    | --- | --- | --- |
    | storage1 | Storage account | West US |
    | VNet1 | Virtual network | West US |
    | NIC1 | Network interface | West US |
    | Disk1 | Disk | West US |
    | VM1 | Virtual machine | West US |

    VM1 is running and connects to NIC1 and Disk1. NIC1 connects to VNET1.

    RG2 contains a public IP address named IP2 that is in the East US
    location. IP2 is not assigned to a virtual machine.

    For each of the following statements, select Yes if the statement is
    true. Otherwise, select No.

    NOTE: Each correct selection is worth one point.
  choices:
    You can move storage1 to RG2.:
      - 'Yes'
      - 'No'
    You can move NIC1 to RG2.:
      - 'Yes'
      - 'No'
    If you move IP2 to RG1, the location of IP2 will change.:
      - 'Yes'
      - 'No'
  answer:
    You can move storage1 to RG2.: 'Yes'
    You can move NIC1 to RG2.: 'No'
    If you move IP2 to RG1, the location of IP2 will change.: 'No'
  user_answer:
    You can move storage1 to RG2.: 'Yes'
    You can move NIC1 to RG2.: 'No'
    If you move IP2 to RG1, the location of IP2 will change.: 'Yes'
  user_result: partially_correct
  user_reasoning: |
    Selected No for moving NIC1 because a NIC must be in the same region
    as its VM.
  learning_note: |
    Moving a resource to another resource group does not change its region.
    A NIC and VM must share a region, but can be in different resource groups.
    The intended restriction on moving NIC1 alone concerns its attachment
    and move dependencies, not the destination resource group's location.
  explanation: |
    **Yes, No, No** is the intended answer. Your first two selections match;
    the third needs correction, and the reasoning for the second needs refining.

    **storage1 to RG2: Yes.** A storage account supports a resource-group
    move. It remains in West US after moving to RG2. RG2's East US location
    does not require its resources to reside in East US.

    **NIC1 to RG2: No under the intended standalone-move interpretation.**
    NIC1 is attached to VM1. Moving an attached NIC requires accounting
    for its VM-related move dependencies rather than moving NIC1 alone.
    The wording does not explicitly say alone, so this answer should not
    be generalized to mean that NICs cannot move resource groups. NICs
    support moves, including as part of a supported move of associated
    VM resources. A running VM is not itself a blanket prohibition on
    resource-group moves.

    Your same-region rule for NIC and VM attachment is correct, but RG2's
    location does not cause a region mismatch. A resource-group move leaves
    NIC1 in West US, and NICs can exist in different resource groups from
    their VMs and virtual networks.

    **IP2 changes location when moved to RG1: No.** IP2 remains in East US.
    The resource group changes, not the public IP resource's Azure region.

    A resource group's location is for its metadata. Moving resources
    between resource groups is different from migrating them across regions.

    Remember: resource-group move changes organization and resource ID;
    it does not change the resource's region. Check move dependencies separately.

    [Microsoft Learn: Move resources between resource groups](https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/move-resource-group-and-subscription)
    [Microsoft Learn: Networking move dependencies](https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/move-limitations/networking-move-limitations)
    [Microsoft Learn: NIC region and resource-group requirements](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-network-interface)
    [Microsoft Learn: VM move FAQ](https://learn.microsoft.com/en-us/troubleshoot/azure/virtual-machines/windows/move-vm-resources-faq)
- id: '014'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure Azure App Service
  question: |
    You have an Azure web app named webapp1.

    You have a virtual network named VNET1 and an Azure virtual machine
    named VM1 that hosts a MySQL database. VM1 connects to VNET1.

    You need to ensure that webapp1 can access the data hosted on VM1.

    What should you do?
  choices:
    A: Deploy an internal load balancer
    B: Peer VNET1 to another virtual network
    C: Connect webapp1 to VNET1
    D: Deploy an Azure Application Gateway
  answer: C
  user_answer: C
  user_result: correct
  learning_note: |
    App Service VNet integration enables outbound connections from a web
    app to private resources in a virtual network, such as a database on
    a VM. VNet peering alone does not integrate an App Service app.
  explanation: |
    **C — Connect webapp1 to VNET1** is correct. Configure App Service
    VNet integration to give webapp1 an outbound network path to VM1's
    private IP address and its MySQL database.

    A is incorrect because an internal load balancer distributes traffic
    among backend instances; deploying one does not connect webapp1 to
    VNET1. B connects two virtual networks, but does not integrate the
    web app with either network. D provides web traffic routing rather
    than the application's outbound connection to the MySQL database.

    In practice, use a supported App Service plan and a dedicated integration
    subnet. Configure the database endpoint and credentials, and permit the
    connection through the applicable NSG and VM firewall rules. MySQL
    must listen on an address reachable from the integration subnet.

    VNet integration provides outbound access from the app. It does not
    by itself make inbound access to the web app private.

    Remember: web app to private backend resource = VNet integration.

    [Microsoft Learn: App Service VNet integration](https://learn.microsoft.com/en-us/azure/app-service/overview-vnet-integration)
    [Microsoft Learn: Enable VNet integration](https://learn.microsoft.com/en-us/azure/app-service/configure-vnet-integration-enable)
- id: '015'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  question: |
    You create an Azure VM named VM1 that runs Windows Server 2019.

    VM1 is configured as shown in the exhibit.

    | Setting | Value |
    | --- | --- |
    | Name | VM1 |
    | Resource group | RG1 |
    | Status | Stopped (deallocated) |
    | Location | West Europe |
    | Subscription | Azure Pass - Sponsorship |
    | Subscription ID | 8Df9d59c-629e-4346-b577-8b7e1ef1316a |
    | Computer name | (start VM to view) |
    | Operating system | Windows |
    | Size | Standard DS2 v2 (2 vcpus, 7 GiB memory) |
    | Ephemeral OS disk | N/A |
    | Public IP address | VM1-ip |
    | Private IP address | 10.0.0.4 |
    | Virtual network/subnet | VNET1/default |
    | DNS name | Configure |
    | Tags | Click here to add tags |

    The Start action is available; Restart and Stop are disabled. The
    selected monitoring period is 1 hour, and the CPU chart shows no data.

    You need to enable Desired State Configuration for VM1.

    What should you do first?
  choices:
    A: Connect to VM1.
    B: Start VM1.
    C: Capture a snapshot of VM1.
    D: Configure a DNS name for VM1.
  answer: B
  user_answer: B
  user_result: correct
  learning_note: |
    Check the VM's power state before enabling guest configuration through
    an extension. A stopped, deallocated VM must be started so its agent
    and DSC extension can run. A public DNS name is not required.
  explanation: |
    **B — Start VM1** is correct. The exhibit shows Stopped (deallocated).
    The guest operating system is not running, so the VM agent and Desired
    State Configuration (DSC) extension cannot execute the onboarding work.
    Start the VM before enabling DSC through Azure.

    DSC manages desired operating-system and application settings, such
    as installed features and service configuration.

    A is unnecessary because Azure can onboard the VM without an interactive
    login, and VM1 must be started before a guest connection is possible.
    C captures disk state but does not enable DSC. D assigns a DNS name;
    a public DNS label is not a prerequisite for DSC onboarding.

    This exhibit reflects an older Azure configuration-management workflow.
    Azure Automation State Configuration is scheduled to retire on
    September 30, 2027, with Azure Machine Configuration as its replacement.
    That lifecycle change does not alter the power-state prerequisite tested.

    Remember: guest configuration needs a running guest; check power state first.

    [Microsoft Learn: Configure a VM with DSC](https://learn.microsoft.com/en-us/azure/automation/quickstarts/dsc-configuration)
    [Microsoft Learn: Enable Azure Automation State Configuration](https://learn.microsoft.com/en-us/azure/automation/automation-dsc-onboarding)
- id: '016'
  skill: Implement and manage virtual networking
  sub-skill: Configure name resolution and load balancing
  question: |
    You have five Azure virtual machines that run Windows Server 2016.
    The virtual machines are configured as web servers.

    You have an Azure load balancer named LB1 that provides load balancing
    services for the virtual machines.

    You need to ensure that visitors are serviced by the same web server
    for each request.

    What should you configure?
  choices:
    A: Floating IP (direct server return) to Disabled
    B: Session persistence to None
    C: Floating IP (direct server return) to Enabled
    D: Session persistence to Client IP
  answer: D
  user_answer: D
  user_result: correct
  learning_note: |
    Client IP session persistence provides source-IP affinity to a backend
    server. The default None mode includes source port in its hash, so new
    connections can reach different servers. Floating IP is not session affinity.
  explanation: |
    **D — Session persistence to Client IP** is correct. Configure this
    setting on LB1's load-balancing rule.

    Client IP mode uses a two-tuple hash of source IP and destination IP.
    This keeps connections from the same client IP to the same frontend
    associated with the same backend under stable operating conditions.

    B uses the default five-tuple hash: source IP, source port, destination
    IP, destination port, and protocol. A new connection can have a different
    source port and be sent to another web server. Requests sharing an
    existing TCP connection already stay on that connection's backend;
    persistence matters across separate connections.

    A and C change Floating IP/direct server return behavior. They do not
    configure client affinity.

    This is IP-based affinity, not per-user cookie affinity. Multiple
    visitors behind the same NAT address can be directed to the same
    server. Backend failures, pool changes, or a change in client IP can
    change the selected backend; persistence does not replicate session data.

    Remember: same client to same backend = session persistence.

    [Microsoft Learn: Configure Load Balancer distribution mode](https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-distribution-mode)
    [Microsoft Learn: Distribution modes](https://learn.microsoft.com/en-us/azure/load-balancer/distribution-mode-concepts)
- id: '017'
  skill: Implement and manage virtual networking
  sub-skill: Configure secure access to virtual networks
  question: |
    Note: This question is part of a series of questions that present the same
    scenario. Each question in the series contains a unique solution that
    might meet the stated goals. Some question sets might have more than one
    correct solution, while others might not have a correct solution.

    After you answer a question in this section, you will NOT be able to
    return to it. As a result, these questions will not appear in the review
    screen.

    You have an Azure subscription that contains the following resources:

    - A virtual network that has a subnet named Subnet1
    - Two network security groups (NSGs) named NSG-VM1 and NSG-Subnet1
    - A virtual machine named VM1 that has the required Windows Server configurations to allow Remote Desktop connections

    NSG-Subnet1 has the default inbound security rules only.

    NSG-VM1 has the default inbound security rules and the following custom
    inbound security rule:

    - Priority: 100
    - Source: Any
    - Source port range: *
    - Destination: *
    - Destination port range: 3389
    - Protocol: UDP
    - Action: Allow

    VM1 has a public IP address and is connected to Subnet1. NSG-VM1 is
    associated to the network interface of VM1. NSG-Subnet1 is associated
    to Subnet1.

    You need to be able to establish Remote Desktop connections from the
    internet to VM1.

    Solution: You add an inbound security rule to NSG-Subnet1 that allows
    connections from the Any source to the * destination for port range
    3389 and uses the TCP protocol. You remove NSG-VM1 from the network
    interface of VM1.

    Does this meet the goal?
  choices:
    A: 'Yes'
    B: 'No'
  answer: A
  user_answer: A
  user_result: correct
  learning_note: |
    Internet RDP requires TCP 3389. When NSGs are attached at both subnet
    and NIC levels, both must allow the traffic. Detaching the NIC NSG
    leaves the subnet NSG in force; it does not add another default deny.
  explanation: |
    **A — Yes** is correct.

    Initially, NSG-Subnet1 blocks unsolicited internet RDP through its
    default inbound rules. NSG-VM1's custom rule allows UDP 3389, which
    does not allow TCP 3389. UDP support can supplement RDP, but a UDP-only
    rule does not permit the TCP connection needed here.

    The proposed solution adds a TCP 3389 allow rule to NSG-Subnet1,
    taking precedence over its default deny rule. It also detaches NSG-VM1
    from VM1's NIC, removing the second NSG filter. Only the subnet NSG
    remains applicable, and its new rule allows the connection.

    VM1 already has a public IP address and the required Windows Server
    configuration, so no additional change is stated as necessary.

    B is incorrect because it overlooks the removal of the NIC NSG.
    If that NSG remained attached unchanged, adding only the subnet allow
    rule would not be sufficient. Rules in separate NSGs do not override
    each other; every applicable NSG must permit the traffic.

    Remember: check the protocol and every attached NSG; RDP needs TCP 3389.

    [Microsoft Learn: Troubleshoot NSG rules blocking traffic](https://learn.microsoft.com/en-us/troubleshoot/azure/virtual-network/virtual-network-troubleshoot-nsg-blocking-traffic)
    [Microsoft Learn: How NSGs filter traffic](https://learn.microsoft.com/en-us/azure/virtual-network/network-security-group-how-it-works)
- id: '018'
  skill: Implement and manage virtual networking
  sub-skill: Configure secure access to virtual networks
  question: |
    Note: This question is part of a series of questions that present the same
    scenario. Each question in the series contains a unique solution that
    might meet the stated goals. Some question sets might have more than one
    correct solution, while others might not have a correct solution.

    After you answer a question in this section, you will NOT be able to
    return to it. As a result, these questions will not appear in the review
    screen.

    You have an Azure subscription that contains the following resources:

    - A virtual network that has a subnet named Subnet1
    - Two network security groups (NSGs) named NSG-VM1 and NSG-Subnet1
    - A virtual machine named VM1 that has the required Windows Server configurations to allow Remote Desktop connections

    NSG-Subnet1 has the default inbound security rules only.

    NSG-VM1 has the default inbound security rules and the following custom
    inbound security rule:

    - Priority: 100
    - Source: Any
    - Source port range: *
    - Destination: *
    - Destination port range: 3389
    - Protocol: UDP
    - Action: Allow

    VM1 has a public IP address and is connected to Subnet1. NSG-VM1 is
    associated to the network interface of VM1. NSG-Subnet1 is associated
    to Subnet1.

    You need to be able to establish Remote Desktop connections from the
    internet to VM1.

    Solution: You add an inbound security rule to NSG-Subnet1 that allows
    connections from the internet source to the VirtualNetwork destination
    for port range 3389 and uses the UDP protocol.

    Does this meet the goal?
  choices:
    A: 'Yes'
    B: 'No'
  answer: B
  user_answer: B
  user_result: correct
  user_reasoning: |
    Selected No because RDP uses TCP, not UDP.
  learning_note: |
    RDP requires TCP 3389 for the direct connection in this scenario and can
    also use UDP for improved performance. UDP alone is insufficient. Both
    attached NSGs must allow TCP; an allow in one cannot override the other.
  explanation: |
    **B — No** is correct.

    The proposed solution permits UDP 3389 at the subnet. NSG-VM1 already
    permits UDP 3389 at the NIC, but neither NSG allows inbound TCP 3389
    from the internet. The TCP connection needed for RDP therefore remains
    blocked by the default inbound deny rules.

    Your answer is correct, but the statement that RDP uses TCP, not UDP
    needs refining. RDP can use both TCP and UDP; permitting only UDP does
    not enable the required direct RDP connection.

    A is incorrect because matching port 3389 alone is insufficient: the
    protocol must also match. Both NSGs remain associated in this solution,
    so both must permit TCP 3389. Even changing just the proposed subnet
    rule to TCP would leave NSG-VM1 blocking TCP at the NIC.

    The Internet source and VirtualNetwork destination are suitable for
    this inbound traffic. Azure evaluates inbound NSG rules after public
    IP translation, so the destination is VM1's private address. The error
    is the UDP-only configuration, not the destination service tag.

    Unlike Question #17, this solution does not remove the NIC NSG and
    does not add a TCP allow rule. Judge the solution exactly as stated.

    Remember: check both protocol and every attached NSG; UDP alone is
    insufficient for this RDP connection.

    [Microsoft Learn: RDS ports](https://learn.microsoft.com/en-us/troubleshoot/windows-server/remote/ports-used-by-rds)
    [Microsoft Learn: Troubleshoot NSG rules blocking traffic](https://learn.microsoft.com/en-us/troubleshoot/azure/virtual-network/virtual-network-troubleshoot-nsg-blocking-traffic)
    [Microsoft Learn: NSG overview](https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview)
- id: '019'
  skill: Implement and manage virtual networking
  sub-skill: Configure secure access to virtual networks
  question: |
    Note: This question is part of a series of questions that present the same
    scenario. Each question in the series contains a unique solution that
    might meet the stated goals. Some question sets might have more than one
    correct solution, while others might not have a correct solution.

    After you answer a question in this section, you will NOT be able to
    return to it. As a result, these questions will not appear in the review
    screen.

    You have an Azure subscription that contains the following resources:

    - A virtual network that has a subnet named Subnet1
    - Two network security groups (NSGs) named NSG-VM1 and NSG-Subnet1
    - A virtual machine named VM1 that has the required Windows Server configurations to allow Remote Desktop connections

    NSG-Subnet1 has the default inbound security rules only.

    NSG-VM1 has the default inbound security rules and the following custom
    inbound security rule:

    - Priority: 100
    - Source: Any
    - Source port range: *
    - Destination: *
    - Destination port range: 3389
    - Protocol: UDP
    - Action: Allow

    VM1 has a public IP address and is connected to Subnet1. NSG-VM1 is
    associated to the network interface of VM1. NSG-Subnet1 is associated
    to Subnet1.

    You need to be able to establish Remote Desktop connections from the
    internet to VM1.

    Solution: You add an inbound security rule to NSG-Subnet1 and NSG-VM1
    that allows connections from the internet source to the VirtualNetwork
    destination for port range 3389 and uses the TCP protocol.

    Does this meet the goal?
  choices:
    A: 'Yes'
    B: 'No'
  answer: A
  user_answer: A
  user_result: correct
  learning_note: |
    When both subnet and NIC NSGs are associated with a VM, both must allow
    inbound TCP 3389 for direct RDP. An existing UDP-only rule does not
    block a separate TCP allow rule; rules match on protocol as well as port.
  explanation: |
    **A — Yes** is correct.

    The proposed solution adds an inbound TCP 3389 allow rule to both
    NSG-Subnet1 and NSG-VM1. Traffic can pass through both filters, and the
    custom allow rules take precedence over the default inbound deny rules.
    VM1 already has a public IP and the required Windows RDP configuration.

    The existing priority-100 UDP rule does not match TCP traffic. Azure
    continues evaluating subsequent rules until a matching rule is found,
    so a separate TCP allow rule can permit RDP without removing the UDP rule.
    The new rule must use an available custom-rule priority.

    Internet is the appropriate source service tag. VirtualNetwork includes
    VM1's private destination address. Azure applies inbound NSG rules after
    translating the VM's public IP address to its private IP address.

    B is incorrect because both applicable NSGs now permit the required
    TCP traffic. This differs from Question #18, where only a UDP subnet
    rule was added and neither NSG permitted TCP 3389 from the internet.

    Remember: both attached NSGs must allow the required protocol and port.

    [Microsoft Learn: How NSGs filter traffic](https://learn.microsoft.com/en-us/azure/virtual-network/network-security-group-how-it-works)
    [Microsoft Learn: NSG rule evaluation and IP translation](https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview)
- id: '020'
  skill: Implement and manage virtual networking
  sub-skill: Configure and manage virtual networks in Azure
  question: |
    HOTSPOT

    You have a virtual network named VNet1 that has the configuration shown
    in the following exhibit.

    | Virtual network property | Value |
    | --- | --- |
    | Name | VNet1 |
    | ResourceGroupName | Production |
    | Location | westus |
    | Id | /subscriptions/14d26092-8e42-4ea7-b770-9dcef70fb1ea/resourceGroups/Production/providers/Microsoft.Network/virtualNetworks/VNet1 |
    | Etag | W/"76f7edd6-d022-455b-aeae-376059318e5d" |
    | ResourceGuid | 562696cc-b2ba-4cc5-9619-0a735d6c34c7 |
    | ProvisioningState | Succeeded |
    | Tags | Empty |
    | AddressSpace.AddressPrefixes | ["10.2.0.0/16"] |
    | DhcpOptions | {} |
    | VirtualNetworkPeerings | [] |
    | EnableDdosProtection | false |
    | EnableVmProtection | false |

    The Subnets collection contains one subnet:

    | Subnet property | Value |
    | --- | --- |
    | Name | default |
    | Etag | W/"76f7edd6-d022-455b-aeae-376059318e5d" |
    | Id | /subscriptions/14d26092-8e42-4ea7-b770-9dcef70fb1ea/resourceGroups/Production/providers/Microsoft.Network/virtualNetworks/VNet1/subnets/default |
    | AddressPrefix | 10.2.0.0/24 |
    | IpConfigurations | [] |
    | ResourceNavigationLinks | [] |
    | ServiceEndpoints | [] |
    | ProvisioningState | Succeeded |

    Use the drop-down menus to select the answer choice that completes
    each statement based on the information presented in the graphic.

    NOTE: Each correct selection is worth one point.
  choices:
    Before a virtual machine on VNet1 can receive an IP address from 192.168.1.0/24, you must first:
      - add a network interface
      - add a subnet
      - add an address space
      - delete a subnet
      - delete an address space
    Before a virtual machine on VNet1 can receive an IP address from 10.2.1.0/24, you must first:
      - add a network interface
      - add a subnet
      - add an address space
      - delete a subnet
      - delete an address space
  answer:
    Before a virtual machine on VNet1 can receive an IP address from 192.168.1.0/24, you must first: add an address space
    Before a virtual machine on VNet1 can receive an IP address from 10.2.1.0/24, you must first: add a subnet
  user_answer:
    Before a virtual machine on VNet1 can receive an IP address from 192.168.1.0/24, you must first: add an address space
    Before a virtual machine on VNet1 can receive an IP address from 10.2.1.0/24, you must first: add a subnet
  user_result: correct
  learning_note: |
    Check the hierarchy of VNet address space, subnet, and NIC IP allocation.
    A range outside the VNet requires an address-space addition first. An
    unused range already inside the VNet requires a subnet before NICs can
    receive addresses from it. The supplied word subset is normalized to subnet.
  explanation: |
    **Add an address space; add a subnet** is correct.

    VNet1's only address range is 10.2.0.0/16, covering 10.2.0.0 through
    10.2.255.255. Its existing default subnet is only 10.2.0.0/24.

    **192.168.1.0/24:** This is outside the VNet address space. First add
    an address range containing it, such as 192.168.1.0/24 itself. Then
    create a subnet within that range and connect the VM's NIC to it.
    Adding address space alone is not the complete deployment, but it is
    the first prerequisite requested by the question.

    **10.2.1.0/24:** This is within the existing /16 but outside the default
    subnet. Add a subnet using 10.2.1.0/24, then connect the VM's NIC to
    that subnet. No additional VNet address range is needed.

    A subnet must be contained within the VNet address space and cannot
    overlap another subnet. Both proposed new subnet ranges are separate
    from the existing default subnet. Adding a network interface alone
    does not create the required address range or subnet. Deleting a subnet
    or address space is unnecessary.

    Evaluate the statements independently; they are not a two-step sequence
    for a single address range.

    Remember: VNet address space first, subnet second, NIC IP allocation third.

    [Microsoft Learn: Manage VNet address spaces](https://learn.microsoft.com/en-us/azure/virtual-network/manage-virtual-network)
    [Microsoft Learn: Manage subnets](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-manage-subnet)
- id: '021'
  skill: Implement and manage virtual networking
  sub-skill: Configure secure access to virtual networks
  question: |
    You have an Azure subscription that contains a virtual network named
    VNET1. VNET1 contains the subnets shown in the following table.

    | Name | Connected virtual machines |
    | --- | --- |
    | Subnet1 | VM1, VM2 |
    | Subnet2 | VM3, VM4 |
    | Subnet3 | VM5, VM6 |

    Each virtual machine uses a static IP address.

    You need to create network security groups (NSGs) to meet the following
    requirements:

    - Allow web requests from the internet to VM3, VM4, VM5, and VM6.
    - Allow all connections between VM1 and VM2.
    - Allow Remote Desktop connections to VM1.
    - Prevent all other network traffic to VNET1.

    What is the minimum number of NSGs you should create?
  choices:
    A: '1'
    B: '3'
    C: '4'
    D: '12'
  answer: A
  user_answer: '2'
  user_result: incorrect
  user_reasoning: |
    Proposed two NSGs: one allowing web requests to VM3 through VM6 and
    one allowing RDP to VM1. Believed default rules would block other
    traffic and allow VM1-to-VM2 connections because they share a subnet.
  learning_note: |
    One NSG can contain multiple rules for different destination IPs and
    can be associated with multiple subnets. Count NSGs, not traffic categories.
    Default VNet allow rules permit traffic across subnets too, so strict
    isolation requires specific allows followed by a higher-priority custom
    deny that overrides the default VNet allow rule.
  explanation: |
    **A — 1 NSG** is correct. Your answer of 2 NSGs is preserved as the
    numeric selection you supplied; it is not option B, which represents 3.

    Create one NSG and associate it with Subnet1, Subnet2, and Subnet3.
    Rules within that shared NSG can target different VM private IP
    addresses. Separate web and RDP requirements do not require separate
    NSG resources. The static IP addresses make these targets stable.

    An example inbound rule set is:

    | Priority | Action | Source | Destination | Protocol and destination ports |
    | --- | --- | --- | --- | --- |
    | 100 | Allow | Internet | VM3, VM4, VM5, VM6 private IPs | TCP 80,443 for HTTP/HTTPS |
    | 110 | Allow | Required RDP source addresses | VM1 private IP | TCP 3389 |
    | 120 | Allow | VM1 private IP | VM2 private IP | Any protocol, all ports |
    | 130 | Allow | VM2 private IP | VM1 private IP | Any protocol, all ports |
    | 200 | Deny | Any | Any | Any protocol, all ports |

    Ports 80 and 443 illustrate standard web service ports; use the actual
    web listener ports in a deployment. The question does not restrict
    RDP source addresses. These example priorities evaluate all required
    allows before the custom deny, and the custom deny before default rules.

    Default AllowVNetInBound is broader than VM1-to-VM2 communication:
    it also permits other traffic within the VNet, including across subnets.
    Default DenyAllInBound is evaluated later and cannot override that allow.
    Therefore, to enforce the stated restriction on all other inbound traffic,
    explicitly allow VM1 and VM2 in both directions before the custom deny.
    NSGs are stateful, so permitted connections allow their response traffic.

    The requirement says traffic to VNET1; this example controls inbound
    traffic and lateral connections to its VMs. If outbound restrictions
    were also required, they could be added to the same NSG.

    B, C, and D create more NSGs than necessary. Even additional security
    rules would not increase the minimum number of NSG resources.

    Remember: one NSG can contain many rules and serve multiple subnets.

    [Microsoft Learn: NSG rule properties and defaults](https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview)
    [Microsoft Learn: NSG associations and traffic filtering](https://learn.microsoft.com/en-us/azure/virtual-network/network-security-group-how-it-works)
- id: '022'
  skill: Manage Azure identities and governance
  sub-skill: Manage Azure subscriptions and governance
  question: |
    You have an Azure subscription that contains the resources shown in
    the following table.

    | Name | Type | Resource group |
    | --- | --- | --- |
    | VNET1 | Virtual network | RG1 |
    | VM1 | Virtual machine | RG1 |

    The Not allowed resource types Azure policy that has policy enforcement
    enabled is assigned to RG1 and uses the following parameters:

    - Microsoft.Network/virtualNetworks
    - Microsoft.Compute/virtualMachines

    In RG1, you need to create a new virtual machine named VM2, and then
    connect VM2 to VNET1.

    What should you do first?
  choices:
    A: Remove Microsoft.Compute/virtualMachines from the policy.
    B: Create an Azure Resource Manager template.
    C: Add a subnet to VNET1.
    D: Remove Microsoft.Network/virtualNetworks from the policy.
  answer: A
  user_answer: A
  user_result: correct
  learning_note: |
    An enforced deny policy blocks noncompliant resource creation, including
    deployments through ARM templates. Existing resources are not deleted.
    Remove the VM resource type from the disallowed list before creating VM2.
  explanation: |
    **A — Remove Microsoft.Compute/virtualMachines from the policy** is correct.

    The policy assignment applies to RG1 and denies creation of the listed
    resource types. Creating VM2 is therefore blocked until the virtual
    machine resource type is removed from the assignment's disallowed list.

    VNET1 already exists. VM2 can use an existing subnet without creating
    another virtual network. A deny policy marks matching existing resources
    as noncompliant; it does not delete them. Deny can also block noncompliant
    updates, so this does not mean existing resources can always be modified.

    B is incorrect because an ARM template does not bypass Azure Policy.
    C is incorrect because adding a subnet does not unblock VM creation.
    D is incorrect because allowing virtual networks would still leave
    Microsoft.Compute/virtualMachines disallowed.

    For a first-action question, identify the restriction blocking the first
    required operation: here, creating VM2 in RG1.

    [Microsoft Learn: Azure Policy deny effect](https://learn.microsoft.com/en-us/azure/governance/policy/concepts/effect-deny)
    [Microsoft Learn: Azure Policy overview](https://learn.microsoft.com/en-us/azure/governance/policy/overview)
- id: '023'
  skill: Implement and manage virtual networking
  sub-skill: Configure name resolution and load balancing
  question: |
    Your company has an Azure subscription named Subscription1.

    The company also has two on-premises servers named Server1 and Server2
    that run Windows Server 2016. Server1 is configured as a DNS server
    that has a primary DNS zone named adatum.com. Adatum.com contains
    1,000 DNS records.

    You manage Server1 and Subscription1 from Server2. Server2 has the
    following tools installed:

    - The DNS Manager console
    - Azure PowerShell
    - Azure CLI 2.0

    You need to move the adatum.com zone to an Azure DNS zone in
    Subscription1. The solution must minimize administrative effort.

    What should you use?
  choices:
    A: Azure CLI
    B: Azure PowerShell
    C: the Azure portal
    D: the DNS Manager console
  answer: A
  user_answer: D
  user_result: incorrect
  learning_note: |
    DNS Manager manages Windows DNS servers, not Azure DNS zones. Azure CLI
    supports bulk zone-file import. A is the expected answer to this older
    question, but current Azure portal zone-file import makes C viable too.
  explanation: |
    **A — Azure CLI** is the expected exam answer. The decisive requirement
    is migrating 1,000 records with minimal administrative effort.

    Obtain the existing zone file from Server1, make it available on Server2,
    and import it using az network dns zone import. This transfers the zone
    records in bulk instead of requiring individual record creation.

    For example, after selecting Subscription1 and replacing the resource
    group and file path with actual values:

    ```azurecli
    az account set --subscription Subscription1
    az network dns zone import --resource-group <resource-group> --name adatum.com --file-name <zone-file>
    ```

    D is incorrect because DNS Manager administers Windows DNS servers and
    cannot directly import a zone into Azure DNS. It can help locate the
    source zone file, but it does not perform the Azure import.

    B can manage Azure DNS records, but Azure PowerShell has no dedicated
    zone-file import cmdlet, so custom record-processing scripts would
    require more effort than the built-in CLI import command.

    Currency caveat: current Microsoft documentation also supports zone-file
    import through the Azure portal. Therefore, C is now a viable low-effort
    option, and this older question is no longer an unambiguous single-answer
    question. A is retained as its expected exam answer; D remains incorrect.

    Importing records is separate from switching DNS delegation to Azure's
    assigned name servers when completing a public DNS hosting migration.

    [Microsoft Learn: Azure CLI DNS zone import](https://learn.microsoft.com/en-us/cli/azure/network/dns/zone#az-network-dns-zone-import)
    [Microsoft Learn: Import and export DNS zone files through the portal](https://learn.microsoft.com/en-us/azure/dns/dns-import-export-portal)
- id: '024'
  skill: Implement and manage virtual networking
  sub-skill: Configure name resolution and load balancing
  question: |
    You have a public load balancer that balances ports 80 and 443 across
    three virtual machines named VM1, VM2, and VM3.

    You need to direct all the Remote Desktop Protocol (RDP) connections
    to VM3 only.

    What should you configure?
  choices:
    A: an inbound NAT rule
    B: a new public load balancer for VM3
    C: a frontend IP configuration
    D: a load balancing rule
  answer: A
  user_answer: A
  user_result: correct
  learning_note: |
    An inbound NAT rule can map a frontend IP and port to a specific VM.
    Load balancing rules distribute connections across a backend pool.
  explanation: |
    **A — an inbound NAT rule** is correct. Configure a rule targeting VM3,
    for example mapping the load balancer's public IP on TCP port 3389 to
    VM3 on TCP port 3389. Connections to that endpoint are forwarded to VM3.
    The existing web load balancing rules on ports 80 and 443 remain in place.

    B is unnecessary because the existing load balancer supports inbound NAT.
    C defines a frontend entry point but does not specify the target VM.
    D distributes connections across its backend pool; a rule using the
    existing three-VM pool would not direct every RDP connection to VM3.
    An inbound NAT rule directly provides the requested per-VM port mapping.

    The applicable network security groups and VM3's Windows firewall must
    also permit RDP, and Remote Desktop must be enabled on VM3.

    Remember: inbound NAT selects a particular VM endpoint; load balancing
    distributes connections across backend instances.

    [Microsoft Learn: Inbound NAT rules](https://learn.microsoft.com/en-us/azure/load-balancer/inbound-nat-rules)
- id: '025'
  skill: Implement and manage virtual networking
  sub-skill: Configure name resolution and load balancing
  question: |
    HOTSPOT -

    You have an Azure subscription named Subscription1 that contains the
    virtual networks in the following table.

    | Name | Subnets |
    | --- | --- |
    | VNet1 | Subnet11, Subnet12 |
    | VNet2 | Subnet13 |

    Subscription1 contains the virtual machines in the following table.

    | Name | Subnet | Availability set |
    | --- | --- | --- |
    | VM1 | Subnet11 | AS1 |
    | VM2 | Subnet11 | AS1 |
    | VM3 | Subnet11 | Not applicable |
    | VM4 | Subnet11 | Not applicable |
    | VM5 | Subnet12 | Not applicable |
    | VM6 | Subnet12 | Not applicable |

    In Subscription1, you create a load balancer that has the following
    configurations:

    - Name: LB1
    - SKU: Basic
    - Type: Internal
    - Subnet: Subnet12
    - Virtual network: VNET1

    For each of the following statements, select Yes if the statement is
    true. Otherwise, select No.

    NOTE: Each correct selection is worth one point.
  choices:
    LB1 can balance the traffic between VM1 and VM2.:
      - 'Yes'
      - 'No'
    LB1 can balance the traffic between VM3 and VM4.:
      - 'Yes'
      - 'No'
    LB1 can balance the traffic between VM5 and VM6.:
      - 'Yes'
      - 'No'
  answer:
    LB1 can balance the traffic between VM1 and VM2.: 'Yes'
    LB1 can balance the traffic between VM3 and VM4.: 'No'
    LB1 can balance the traffic between VM5 and VM6.: 'No'
  user_answer:
    LB1 can balance the traffic between VM1 and VM2.: 'Yes'
    LB1 can balance the traffic between VM3 and VM4.: 'Yes'
    LB1 can balance the traffic between VM5 and VM6.: 'Yes'
  user_result: partially_correct
  learning_note: |
    Basic Load Balancer restricts multiple backend VMs to a single
    availability set or virtual machine scale set. Sharing a subnet does
    not satisfy this restriction. The frontend and backend may use different
    subnets within the same VNet. Basic Load Balancer is now retired.
  explanation: |
    **Yes, No, No** is correct under the historical Basic SKU rules.
    The first selection in your Yes, Yes, Yes attempt is correct.

    VM1 and VM2 both belong to AS1, so LB1 can distribute traffic to them.
    Although its frontend is in Subnet12 and these VMs are in Subnet11,
    both subnets belong to VNET1. A different frontend subnet does not
    prevent these VMs from being backend members.

    VM3 and VM4 are separate standalone VMs, not members of a shared
    availability set or scale set. They cannot form the required multi-VM
    backend for a Basic Load Balancer. Being in the same subnet is insufficient.

    VM5 and VM6 likewise do not share an availability set or scale set.
    Being in Subnet12 with LB1's frontend does not override the Basic SKU
    backend restriction. Their statement is also No.

    The question's phrase balance the traffic between refers to distributing
    incoming connections across the named backend VMs.

    Currency note: Basic Load Balancer retired on September 30, 2025.
    This question tests its historical restrictions. Standard Load Balancer
    supports backend VMs across availability sets within a single VNet.

    Remember: check the SKU and availability-set membership, not only the subnet.

    [Microsoft Learn: Load Balancer SKU comparison](https://learn.microsoft.com/en-us/azure/load-balancer/skus)
    [Microsoft Learn: Load Balancer components](https://learn.microsoft.com/en-us/azure/load-balancer/components)
- id: '026'
  skill: Implement and manage virtual networking
  sub-skill: Configure name resolution and load balancing
  question: |
    HOTSPOT -

    You have an Azure virtual machine that runs Windows Server 2019 and
    has the following configurations:

    - Name: VM1
    - Location: West US
    - Connected to: VNET1
    - Private IP address: 10.1.0.4
    - Public IP addresses: 52.186.85.63
    - DNS suffix in Windows Server: Adatum.com

    You create the Azure DNS zones shown in the following table.

    | Name | Type | Location |
    | --- | --- | --- |
    | Adatum.pri | Private | West Europe |
    | Contoso.pri | Private | Central US |
    | Adatum.com | Public | West Europe |
    | Contoso.com | Public | North Europe |

    You need to identify which DNS zones you can link to VNET1 and the
    DNS zones to which VM1 can automatically register.

    Which zones should you identify? To answer, select the appropriate
    options in the answer area.

    NOTE: Each correct selection is worth one point.
  choices:
    DNS zones that you can link to VNET1:
      - Adatum.com only
      - Adatum.pri and adatum.com only
      - The private zones only
      - The public zones only
    DNS zones to which VM1 can automatically register:
      - Adatum.com only
      - Adatum.pri and adatum.com only
      - The private zones only
      - The public zones only
  answer:
    DNS zones that you can link to VNET1: The private zones only
    DNS zones to which VM1 can automatically register: The private zones only
  user_answer:
    DNS zones that you can link to VNET1: Adatum.com only
    DNS zones to which VM1 can automatically register: Adatum.com only
  user_result: incorrect
  learning_note: |
    VNet links and Azure VM autoregistration apply to private DNS zones.
    The Windows DNS suffix does not select the registration zone. A VNet
    can link to multiple private zones for resolution, but can have only
    one registration-enabled zone at a time. DNS zones are global resources.
  explanation: |
    **The private zones only; The private zones only** is correct.

    Adatum.pri and Contoso.pri are private DNS zones, so both are eligible
    for links to VNET1. Public Adatum.com and Contoso.com do not support
    these private DNS virtual network links.

    Either private zone can be the registration zone for VNET1 when
    autoregistration is enabled on its link. VM1's private IP address,
    10.1.0.4, is registered there. Only one private zone can have
    autoregistration enabled for a given VNet at a time; both zones can
    still be linked for resolution. The answer describes eligible zones,
    not simultaneous registration in both zones. Creating zones alone
    does not enable registration: the registration-enabled link is required.

    VM1's Adatum.com Windows DNS suffix does not determine Azure-managed
    registration. The virtual network link does. A matching suffix does
    not enable linking or autoregistration in the public Adatum.com zone.

    The exhibit's regional locations are misleading because Azure DNS
    zones are global resources. A private zone can link to VNets in
    different regions, including VNET1 in West US.

    [Microsoft Learn: Private DNS virtual network links](https://learn.microsoft.com/en-us/azure/dns/private-dns-virtual-network-links)
    [Microsoft Learn: Private DNS autoregistration](https://learn.microsoft.com/en-us/azure/dns/private-dns-autoregistration)
    [Microsoft Learn: Private DNS FAQ](https://learn.microsoft.com/en-us/azure/dns/dns-faq-private)
    [Microsoft Learn: Private DNS overview and global resiliency](https://learn.microsoft.com/en-us/azure/dns/private-dns-overview)
    [Microsoft Learn: Multiple frontends](https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-multivip-overview)
- id: '027'
  skill: Implement and manage virtual networking
  sub-skill: Configure and manage virtual networks in Azure
  question: |
    DRAG DROP -

    You have an on-premises network that you plan to connect to Azure by
    using a site-to-site VPN.

    In Azure, you have an Azure virtual network named VNet1 that uses an
    address space of 10.0.0.0/16. VNet1 contains a subnet named Subnet1 that
    uses an address space of 10.0.0.0/24.

    You need to create a site-to-site VPN to Azure.

    Which four actions should you perform in sequence? To answer, move the
    appropriate actions from the list of actions to the answer area and
    arrange them in the correct order.

    NOTE: More than one order of answer choice is correct. You will receive
    credit for any of the correct orders you select.
  choices:
    - Create a local gateway.
    - Create a VPN gateway.
    - Create a gateway subnet.
    - Create a custom DNS server.
    - Create a VPN connection.
    - Create an Azure Content Delivery Network (CDN) profile.
  answer:
    - Create a gateway subnet.
    - Create a VPN gateway.
    - Create a local gateway.
    - Create a VPN connection.
  user_answer:
    - Create a VPN gateway.
    - Create a gateway subnet.
    - Create a VPN connection.
  user_result: partially_correct
  learning_note: |
    The gateway subnet must exist before deploying the VPN gateway.
    A site-to-site connection also requires a local network gateway resource
    representing the on-premises VPN endpoint and network ranges. The
    connection depends on both gateways. The attempt omitted the local
    network gateway and reversed the subnet-to-VPN-gateway dependency.
  explanation: |
    One valid sequence is:

    1. Create a gateway subnet.
    2. Create a VPN gateway.
    3. Create a local gateway.
    4. Create a VPN connection.

    The subnet must be named exactly GatewaySubnet. It hosts the Azure
    VPN gateway resources and must exist before the gateway is deployed.
    For example, 10.0.255.0/27 fits within VNet1's 10.0.0.0/16 and does not
    overlap the existing Subnet1 range, 10.0.0.0/24.

    The option Create a local gateway means creating an Azure local network
    gateway resource. This represents the on-premises VPN device endpoint
    and on-premises network address ranges; it is distinct from the Azure
    VPN gateway that terminates the Azure side of the tunnel.

    Create the site-to-site VPN connection after both gateway resources
    exist. Its shared key must match the on-premises VPN device configuration.
    A compatible on-premises device must also be configured for the tunnel.

    More than one order is valid because the local network gateway can be
    created independently, before or between the subnet and VPN gateway
    steps. The dependencies are GatewaySubnet before VPN gateway, and both
    gateway resources before the VPN connection.

    Your attempt chose three required actions, but placed the VPN gateway
    before its subnet and omitted the local network gateway. The wording
    gateway subset in your attempt is normalized to gateway subnet.
    A custom DNS server and CDN profile are not required for this VPN setup.

    Remember: subnet before Azure gateway; both gateways before connection.

    [Microsoft Learn: Create a site-to-site VPN connection](https://learn.microsoft.com/en-us/azure/vpn-gateway/tutorial-site-to-site-portal)
- id: '028'
  skill: Implement and manage virtual networking
  sub-skill: Configure secure access to virtual networks
  question: |
    You have an Azure subscription that contains the resources in the following table.

    | Name | Type | Details |
    | --- | --- | --- |
    | VNet1 | Virtual network | Not applicable |
    | Subnet1 | Subnet | Hosted on VNet1 |
    | VM1 | Virtual machine | On Subnet1 |
    | VM2 | Virtual machine | On Subnet1 |

    VM1 and VM2 are deployed from the same template and host line-of-business
    applications.

    You configure the network security group (NSG) shown in the exhibit.
    (Click the Exhibit tab.)

    | Exhibit setting | Value |
    | --- | --- |
    | Resource group | RG1lod9053488 |
    | Location | East US |
    | Subscription | Microsoft AZ |
    | Subscription ID | ac344a74-f85a-4b2e-8057-642088faaf20 |
    | Tags | Click here to add tags |
    | Custom security rules | 1 inbound, 1 outbound |
    | Associated with | 0 subnets, 0 network interfaces |

    Inbound security rules:

    | Priority | Name | Port | Protocol | Source | Destination | Action |
    | --- | --- | --- | --- | --- | --- | --- |
    | 100 | Port_80 | 80 | TCP | Internet | Any | Deny |
    | 65000 | AllowVnetInBound | Any | Any | VirtualNetwork | VirtualNetwork | Allow |
    | 65001 | AllowAzureLoadBalancerInBound | Any | Any | AzureLoadBalancer | Any | Allow |
    | 65500 | DenyAllInBound | Any | Any | Any | Any | Deny |

    Outbound security rules:

    | Priority | Name | Port | Protocol | Source | Destination | Action |
    | --- | --- | --- | --- | --- | --- | --- |
    | 100 | DenyWebSites | 80 | TCP | Any | Internet | Deny |
    | 65000 | AllowVnetOutBound | Any | Any | VirtualNetwork | VirtualNetwork | Allow |
    | 65001 | AllowInternetOutBound | Any | Any | Any | Internet | Allow |
    | 65500 | DenyAllOutBound | Any | Any | Any | Any | Deny |

    You need to prevent users of VM1 and VM2 from accessing websites on the
    Internet over TCP port 80.

    What should you do?
  choices:
    A: Disassociate the NSG from a network interface.
    B: Change the Port_80 inbound security rule.
    C: Associate the NSG to Subnet1.
    D: Change the DenyWebSites outbound security rule.
  answer: C
  user_answer: C
  user_result: correct
  learning_note: |
    An NSG's rules affect VM traffic only when the NSG is associated with
    the relevant subnet or network interface. Website access initiated by
    a VM is outbound traffic. Lower priority numbers are evaluated first.
  explanation: |
    **C — Associate the NSG to Subnet1** is correct.

    The exhibit shows that the NSG is associated with zero subnets and
    zero network interfaces. Its rules therefore do not filter either VM's
    traffic. Both VMs are on Subnet1, so a subnet association applies the
    existing rules to both.

    DenyWebSites already denies outbound TCP traffic from Any source to
    the Internet on destination port 80. Its priority of 100 is evaluated
    before AllowInternetOutBound at 65001, so new matching connections
    are blocked after association.

    A is incorrect because no NIC association exists to remove, and removing
    an association would not enforce the deny. B is incorrect because
    Port_80 is an inbound rule, whereas users browsing websites initiate
    outbound connections. D is incorrect because the outbound rule already
    matches the required protocol, port, destination, and deny action.

    Remember: verify traffic direction, rule priority, and NSG association.

    [Microsoft Learn: How NSGs filter network traffic](https://learn.microsoft.com/en-us/azure/virtual-network/network-security-group-how-it-works)
    [Microsoft Learn: NSG rules and priorities](https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview)
- id: '029'
  skill: Implement and manage virtual networking
  sub-skill: Configure and manage virtual networks in Azure
  question: |
    You have two subscriptions named Subscription1 and Subscription2.
    Each subscription is associated to a different Azure AD tenant.

    Subscription1 contains a virtual network named VNet1. VNet1 contains
    an Azure virtual machine named VM1 and has an IP address space of
    10.0.0.0/16.

    Subscription2 contains a virtual network named VNet2. VNet2 contains
    an Azure virtual machine named VM2 and has an IP address space of
    10.10.0.0/24.

    You need to connect VNet1 to VNet2.

    What should you do first?
  choices:
    A: Move VM1 to Subscription2.
    B: Move VNet1 to Subscription2.
    C: Modify the IP address space of VNet2.
    D: Provision virtual network gateways.
  answer: D
  user_answer: D
  user_result: correct
  learning_note: |
    VPN gateways can connect VNets across subscriptions and tenants.
    Cross-tenant VNet peering is also supported and does not require VPN
    gateways. Different tenants alone do not make gateways mandatory.
    These two address spaces do not overlap.
  explanation: |
    **D — Provision virtual network gateways** is the best answer among
    the listed choices. Deploy a VPN gateway in each VNet, then configure
    the VNet-to-VNet VPN connections. Different subscriptions do not need
    to belong to the same tenant for this configuration.

    Each VPN gateway requires a dedicated GatewaySubnet and the associated
    gateway configuration. Thus, gateway provisioning includes satisfying
    the subnet prerequisites; D identifies the required gateway resources
    for the VPN approach rather than every individual deployment step.

    A and B are unnecessary because connectivity does not require moving
    either VM1 or VNet1 into Subscription2. C is unnecessary because
    10.0.0.0/16 and 10.10.0.0/24 do not overlap.

    Question limitation: the scenario does not require a VPN. VNet peering
    also supports different subscriptions and Microsoft Entra tenants,
    with appropriate permissions on both sides, and requires no VPN
    gateways. Peering is omitted from the choices, so D is a valid listed
    solution, not a universal prerequisite for cross-tenant connectivity.

    Azure AD is the former name of Microsoft Entra ID.

    [Microsoft Learn: VNet-to-VNet VPN connections across subscriptions and tenants](https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-vnet-vnet-rm-ps)
    [Microsoft Learn: Cross-subscription and cross-tenant VNet peering](https://learn.microsoft.com/en-us/azure/virtual-network/create-peering-different-subscriptions)
- id: '030'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  question: |
