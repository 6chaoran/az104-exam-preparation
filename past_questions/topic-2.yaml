- id: '066'
  skill: Manage Azure identities and governance
  sub-skill: Manage access to Azure resources
  question_type: hotspot
  tags:
    - "exam topic: Manage Azure identities and governance"
    - Azure RBAC
    - Microsoft Entra roles
    - Custom roles
    - Role cloning
  question: |
    You have an Azure subscription that is linked to an Azure AD tenant. The tenant contains the
    following custom role-based access control roles:

    | Name  | Description             |
    |-------|-------------------------|
    | Role1 | Azure subscription role |
    | Role2 | Azure AD role           |

    From the Azure portal, you need to create two custom roles named Role3 and Role4. Role3 will be
    an Azure subscription role. Role4 will be an Azure AD role.

    Which roles can you clone to create each new role?
  choices:
    Role3:
      - Role1 only
      - Built-in Azure subscription roles only
      - Role1 and built-in Azure subscription roles only
      - Built-in Azure subscription roles and built-in Azure AD roles only
      - Role1, Role2, built-in Azure subscription roles, and built-in Azure AD roles
    Role4:
      - Role2 only
      - Built-in Azure AD roles only
      - Role2 and built-in Azure AD roles only
      - Built-in Azure AD roles and built-in Azure subscription roles only
      - Role1, Role2, built-in Azure AD roles, and built-in Azure subscription roles
  answer:
    Role3: Role1 and built-in Azure subscription roles only
    Role4: Role2 only
  user_answer:
    Role3: Role1 and built-in Azure subscription roles only
    Role4: Role2 and built-in Azure AD roles only
  user_result: partially_correct
  user_reasoning: Selected the matching custom role and built-in roles from the same role system for each new role.
  learning_note: |
    Azure RBAC and Microsoft Entra RBAC are separate permission systems. An Azure custom role can
    be cloned from an Azure built-in or custom role. For a Microsoft Entra custom role, the current
    portal workflow can clone baseline permissions from another custom Entra role but cannot clone
    a built-in Entra role.
  explanation: |
    Correct selections: **Role1 and built-in Azure subscription roles only** for Role3; **Role2
    only** for Role4.

    The Azure RBAC custom-role editor supports cloning existing Azure built-in and custom roles.
    Therefore, Role3 can be based on Role1 or an Azure subscription built-in role.

    Microsoft Entra custom roles use a separate permission system. The current Microsoft Entra
    custom-role workflow permits cloning baseline permissions from a custom Entra role such as
    Role2, but Microsoft's documentation states that built-in Entra roles cannot be cloned. Roles
    also cannot be cloned across the Azure RBAC and Microsoft Entra RBAC boundary.

    [Microsoft Learn: Create or update Azure custom roles](https://learn.microsoft.com/en-us/azure/role-based-access-control/custom-roles-portal)
    [Microsoft Learn: Create a custom role in Microsoft Entra ID](https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/custom-create)
- id: '067'
  skill: Manage Azure identities and governance
  sub-skill: Manage access to Azure resources
  question_type: drag_drop
  tags:
    - "exam topic: Manage Azure identities and governance"
    - Azure RBAC
    - Azure Storage
    - Reader and Data Access
    - Owner
    - Least privilege
  question: |
    You have an Azure subscription named Sub1 that contains two users named User1 and User2.

    You need to assign role-based access control (RBAC) roles to User1 and User2. The users must be
    able to perform the following tasks in Sub1:

    - User1 must view the data in any storage account.
    - User2 must assign users the Contributor role for storage accounts.

    The solution must use the principle of least privilege.

    Which RBAC role should you assign to each user?
  choices:
    - Owner
    - Contributor
    - Reader and Data Access
    - Storage Account Contributor
  answer:
    User1: Reader and Data Access
    User2: Owner
  user_answer:
    User1: Reader and Data Access
    User2: Owner
  user_result: correct
  user_reasoning: Selected Reader and Data Access for storage data visibility and Owner for assigning the Contributor role.
  learning_note: |
    Reader and Data Access includes permission to list storage account keys, which can provide
    access to the data through Shared Key authorization. Owner includes Azure RBAC role-assignment
    permissions. Contributor and Storage Account Contributor can manage resources but cannot assign
    Azure roles.
  explanation: |
    Correct selections: **Reader and Data Access for User1; Owner for User2.**

    Reader and Data Access is the least privileged listed role that permits User1 to retrieve
    storage account keys and use them to view storage data. The role can actually provide read and
    write data access through the keys, despite its name.

    Owner includes `Microsoft.Authorization/roleAssignments/write`, so User2 can assign the
    Contributor role to other users at the applicable storage-account scopes. The Contributor and
    Storage Account Contributor roles do not permit Azure RBAC role assignments.

    [Microsoft Learn: Azure built-in roles](https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles)
