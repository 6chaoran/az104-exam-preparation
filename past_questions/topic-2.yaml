  question: |
    This question is part of a series in which each question presents the same scenario with a
    different proposed solution.

    You have an Azure subscription linked to an Azure Active Directory tenant named
    contoso.onmicrosoft.com. The tenant contains the following users:

    | Name  | Role                 | Scope                  |
    |-------|----------------------|------------------------|
    | User1 | Global Administrator | Azure Active Directory |
    | User2 | Global Administrator | Azure Active Directory |
    | User3 | User Administrator   | Azure Active Directory |
    | User4 | Owner                | Azure subscription     |

    User1 creates a new Azure Active Directory tenant named external.contoso.onmicrosoft.com.

    You need to create new user accounts in external.contoso.onmicrosoft.com.

    Solution: You instruct User4 to create the user accounts.

    Does this meet the goal?
  choices:
    A: true
    B: false
  answer: B
  user_answer: A
  user_result: incorrect
  user_reasoning: Owner should have access to create users.
  learning_note: |
    Azure RBAC roles and Microsoft Entra roles govern different systems. Owner controls Azure
    resources and Azure RBAC assignments at its assigned Azure scope; it does not grant permission
    to create directory users. User creation requires a suitable Microsoft Entra role in the tenant
    where the accounts will be created.
  explanation: |
    Correct answer: **B. No.** User4's Owner assignment is an Azure RBAC role scoped to the Azure
    subscription. It permits management of Azure resources and Azure RBAC role assignments but
    does not provide Microsoft Entra user-management permissions.

    User4 also has no administrative assignment in external.contoso.onmicrosoft.com. User1 becomes
    the initial Global Administrator of the new tenant as its creator and can create the accounts,
    or can add User4 to the new tenant and assign an appropriate Microsoft Entra role such as User
    Administrator.

