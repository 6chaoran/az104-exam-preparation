- id: '001'
  skill: Manage Azure identities and governance
  sub-skill: Manage access to Azure resources
  question: |
    HOTSPOT

    You have an Azure subscription named Subscription1 that contains a resource group named RG1.
    In RG1, you create an internal load balancer named LB1 and a public load balancer named LB2.

    You need to ensure that an administrator named Admin1 can perform each task. The solution must
    follow the principle of least privilege.

    Which role should you assign to Admin1 for each task? Select the appropriate options in the
    answer area. Each correct selection is worth one point.
  choices:
    To add a backend pool to LB1:
      - Contributor on LB1
      - Network Contributor on LB1
      - Network Contributor on RG1
      - Owner on LB1
    To add a health probe to LB2:
      - Contributor on LB2
      - Network Contributor on LB2
      - Network Contributor on RG1
      - Owner on LB2
  answer:
    To add a backend pool to LB1: Network Contributor on LB1
    To add a health probe to LB2: Network Contributor on LB2
  user_answer:
    To add a backend pool to LB1: Network Contributor on LB1
    To add a health probe to LB2: Contributor on LB2
  user_result: partially_correct
  learning_note: |
    Network Contributor can manage Microsoft.Network resources, including load balancers. Assigning
    it directly to each load balancer keeps the scope narrower than assigning it at the resource
    group. Contributor can also manage the load balancer, but grants broader resource-management
    permissions than this networking task requires.
  explanation: |
    Correct selections:

    - **To add a backend pool to LB1:** Network Contributor on LB1.
    - **To add a health probe to LB2:** Network Contributor on LB2.

    Both operations manage Azure networking resources. The Network Contributor role includes
    `Microsoft.Network/*` actions, which cover load balancer configuration. Assign the role at the
    individual load balancer scope to follow least privilege.

    - **Contributor on LB2:** This can manage the load balancer, but it grants management access to
      all resource types at that scope, which is broader than needed.
    - **Network Contributor on RG1:** This grants networking permissions to all network resources
      in the resource group rather than only the specified load balancer.
    - **Owner:** This also grants permissions to manage access, which is unnecessary for these tasks.

    [Microsoft Learn: Azure built-in roles for Networking](https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/networking)
    [Microsoft Learn: Azure built-in roles for Privileged](https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/privileged)
- id: '002'
  question: |
    You have an Azure subscription that contains an Azure Active Directory (Azure AD) tenant named
    contoso.com and an Azure Kubernetes Service (AKS) cluster named AKS1.

    An administrator reports that she is unable to grant access to AKS1 to the users in contoso.com.

    You need to ensure that access to AKS1 can be granted to the contoso.com users.

    What should you do first?
  choices:
    A: From contoso.com, modify the Organization relationships settings.
    B: From contoso.com, create an OAuth 2.0 authorization endpoint.
    C: Recreate AKS1.
    D: From AKS1, create a namespace.
  answer: C
  learning_note: |
    The intended exam answer assumes AKS1 lacks Azure AD integration and expects the cluster to be
    recreated with directory authentication enabled. Current AKS supports enabling Microsoft Entra ID
    integration on an existing Kubernetes RBAC-enabled cluster with `az aks update`, so recreation is
    not generally required in practice.
  explanation: |
    Correct exam answer: **C. Recreate AKS1.**

    The question assumes the existing cluster was created without Azure AD integration. Under that
    premise, a cluster configured for directory authentication is needed before access can be granted
    to contoso.com users. Organization relationships, an OAuth endpoint, and a namespace do not enable
    AKS directory authentication.

    For current AKS clusters, Microsoft documents enabling Microsoft Entra ID integration on an
    existing Kubernetes RBAC-enabled cluster using `az aks update`. Check that option before recreating
    a real cluster.

    [Microsoft Learn: Enable Microsoft Entra ID authentication for AKS](https://learn.microsoft.com/en-us/azure/aks/enable-authentication-microsoft-entra-id)
- id: '003'
  skill: Manage Azure identities and governance
  sub-skill: Manage Microsoft Entra users and groups
  question: |
    You have a Microsoft 365 tenant and an Azure Active Directory (Azure AD) tenant named contoso.com.

    You plan to grant three users named User1, User2, and User3 access to a temporary Microsoft
    SharePoint document library named Library1.

    You need to create groups for the users. The solution must ensure that the groups are deleted
    automatically after 180 days.

    Which two groups should you create? Each correct answer presents a complete solution.
    NOTE: Each correct selection is worth one point.
  choices:
    A: a Microsoft 365 group that uses the Assigned membership type
    B: a Security group that uses the Assigned membership type
    C: a Microsoft 365 group that uses the Dynamic User membership type
    D: a Security group that uses the Dynamic User membership type
    E: a Security group that uses the Dynamic Device membership type
  answer:
    - A
    - C
  user_answer: A
  user_result: partially_correct
  learning_note: |
    Group expiration policies apply to Microsoft 365 groups, regardless of whether membership is
    Assigned or Dynamic User. Security groups do not support this expiration policy. Active groups
    can be renewed automatically, so a 180-day policy does not guarantee deletion exactly 180 days
    after creation.
  explanation: |
    Correct answers: **A and C.** Both are Microsoft 365 groups and can be covered by a group
    expiration policy set to 180 days. The membership type determines how users join the group; it
    does not determine whether the Microsoft 365 group is eligible for expiration. Choices B, D, and
    E are security groups, which are not eligible for the Microsoft 365 group expiration policy.

    A group that remains active may be renewed automatically. If it is not renewed, the policy deletes
    it after its expiration period.

    [Microsoft Learn: Set expiration for Microsoft 365 groups](https://learn.microsoft.com/en-us/entra/identity/users/groups-lifecycle)
- id: '004'
  question_type: hotspot
  question: |
    You have an Azure Active Directory (Azure AD) tenant named contoso.com that contains these users:

    | Name  | Type   | Member of |
    |-------|--------|-----------|
    | User1 | Member | Group1    |
    | User2 | Guest  | Group1    |
    | User3 | Member | None      |
    | UserA | Member | Group2    |
    | UserB | Guest  | Group2    |

    User3 is the owner of Group1. Group2 is a member of Group1.

    You configure an access review named Review1 for members of Group1. Its scope is Guest users
    only, and its reviewers are Group owners.

    For each statement, select Yes if the statement is true. Otherwise, select No.
    NOTE: Each correct selection is worth one point.
  choices:
    User3 can perform an access review of User1:
      - Yes
      - No
    User3 can perform an access review of UserA:
      - Yes
      - No
    User3 can perform an access review of UserB:
      - Yes
      - No
  answer:
    User3 can perform an access review of User1: No
    User3 can perform an access review of UserA: No
    User3 can perform an access review of UserB: Yes
  user_answer:
    User3 can perform an access review of User1: Yes
    User3 can perform an access review of UserA: Yes
    User3 can perform an access review of UserB: Yes
  user_result: partially_correct
  learning_note: |
    A group owner can review users in the configured scope. Guest users only excludes members such
    as User1 and UserA. Group reviews flatten nested groups, so guest UserB appears through Group2.
  explanation: |
    Correct selections: **No, No, Yes.** User3 is the owner of Group1 and is therefore a reviewer.
    User1 and UserA have the Member user type and are outside the Guest users only scope. UserB has
    the Guest user type and is a transitive member of Group1 through nested Group2, so User3 can
    review UserB.

    [Microsoft Learn: Create an access review of groups and applications](https://learn.microsoft.com/en-us/entra/id-governance/create-access-review)
    [Microsoft Graph: Configure access review scope](https://learn.microsoft.com/en-us/graph/accessreviews-scope-concept)
- id: '005'
  skill: Manage Azure identities and governance
  sub-skill: Manage Azure subscriptions and governance
  question_type: hotspot
  question: |
    You have the Azure management groups shown in the following table:

    | Name              | In management group |
    |-------------------|---------------------|
    | Tenant Root Group | Not applicable      |
    | ManagementGroup11 | Tenant Root Group   |
    | ManagementGroup12 | Tenant Root Group   |
    | ManagementGroup21 | ManagementGroup11   |

    You add Azure subscriptions to the management groups as shown in the following table:

    | Name          | Management group   |
    |---------------|--------------------|
    | Subscription1 | ManagementGroup21  |
    | Subscription2 | ManagementGroup12  |

    You create the Azure policies shown in the following table:

    | Name                       | Parameter       | Scope             |
    |----------------------------|-----------------|-------------------|
    | Not allowed resource types | virtualNetworks | Tenant Root Group |
    | Allowed resource types     | virtualNetworks | ManagementGroup12 |

    For each of the following statements, select Yes if the statement is true. Otherwise, select No.
    NOTE: Each correct selection is worth one point.
  choices:
    You can create a virtual network in Subscription1:
      - Yes
      - No
    You can create a virtual machine in Subscription2:
      - Yes
      - No
    You can add Subscription1 to ManagementGroup11:
      - Yes
      - No
  answer:
    You can create a virtual network in Subscription1: No
    You can create a virtual machine in Subscription2: No
    You can add Subscription1 to ManagementGroup11: Yes
  user_answer:
    You can create a virtual network in Subscription1: No
    You can create a virtual machine in Subscription2: Yes
    You can add Subscription1 to ManagementGroup11: No
  user_result: partially_correct
  learning_note: |
    Azure Policy assignments are inherited by descendant subscriptions, and a lower-scope assignment
    cannot override an inherited deny. An Allowed resource types policy denies types outside its
    list. A subscription has one direct management-group parent, but can be moved to another parent,
    including its current grandparent.
  explanation: |
    Correct selections: **No, No, Yes.** Subscription1 inherits the root policy that denies
    virtualNetworks, so a virtual network cannot be created there. Subscription2 inherits the
    ManagementGroup12 policy allowing only virtualNetworks, which denies a virtual machine.

    Subscription1 is directly under ManagementGroup21 and indirectly under ManagementGroup11.
    Adding it to ManagementGroup11 means moving it so ManagementGroup11 becomes its direct parent;
    Azure supports moving subscriptions between management groups.

    [Microsoft Learn: Azure Policy overview](https://learn.microsoft.com/en-us/azure/governance/policy/overview)
    [Microsoft Learn: Manage management groups](https://learn.microsoft.com/en-us/azure/governance/management-groups/manage)
- id: '006'
  skill: Manage Azure identities and governance
  sub-skill: Manage Azure subscriptions and governance
  question_type: hotspot
  question: |
    You have an Azure policy assignment with the following settings:

    | Setting                    | Value                       |
    |----------------------------|-----------------------------|
    | Scope                      | Subscription 1              |
    | Exclusions                 | Subscription 1/ContosoRG1   |
    | Policy definition          | Not allowed resource types  |
    | Not allowed resource types | Microsoft.Sql/servers       |

    What is the effect of the policy?
  choices:
    A: You are prevented from creating Azure SQL servers anywhere in Subscription 1.
    B: You can create Azure SQL servers in ContosoRG1 only.
    C: You are prevented from creating Azure SQL servers in ContosoRG1 only.
    D: You can create Azure SQL servers in any resource group within Subscription 1.
  answer: B
  user_answer: B
  user_result: correct
  learning_note: |
    An Azure Policy assignment applies within its scope except for excluded scopes. Excluding a
    resource group from a subscription-level deny policy means the policy does not block the specified
    resource type in that resource group.
  explanation: |
    Correct answer: **B. You can create Azure SQL servers in ContosoRG1 only.** The policy denies
    creation of Microsoft.Sql/servers throughout Subscription 1, but ContosoRG1 is excluded from
    the assignment. The exclusion means this policy does not evaluate resources in ContosoRG1.

    [Microsoft Learn: Understand scope in Azure Policy](https://learn.microsoft.com/en-us/azure/governance/policy/concepts/scope)
- id: '007'
  skill: Manage Azure identities and governance
  sub-skill: Manage Azure subscriptions and governance
  question_type: hotspot
  question: |
    You have an Azure subscription that contains the resources shown in the following table:

    | Name  | Type            | Resource group | Tag            |
    |-------|-----------------|----------------|----------------|
    | RG6   | Resource group  | Not applicable | None           |
    | VNET1 | Virtual network | RG6            | Department: D1 |

    You assign a policy to RG6 as shown in the following table:

    | Setting                    | Value                           |
    |----------------------------|---------------------------------|
    | Scope                      | Subscription1/RG6               |
    | Exclusions                 | None                            |
    | Policy definition          | Apply tag and its default value |
    | Tag name                   | Label                           |
    | Tag value                  | Value1                          |

    To RG6, you apply the tag RGroup: RG6. You deploy a virtual network named VNET2 to RG6.

    Which tags apply to VNET1 and VNET2? Select the appropriate options in the answer area.
    NOTE: Each correct selection is worth one point.
  choices:
    VNET1:
      - None
      - 'Department: D1 only'
      - 'Department: D1, and RGroup: RG6 only'
      - 'Department: D1, and Label: Value1 only'
      - 'Department: D1, RGroup: RG6, and Label: Value1'
    VNET2:
      - None
      - 'RGroup: RG6 only'
      - 'Label: Value1 only'
      - 'RGroup: RG6, and Label: Value1'
  answer:
    VNET1: 'Department: D1 only'
    VNET2: 'Label: Value1 only'
  user_answer:
    VNET1: 'Department: D1 only'
    VNET2: 'Label: Value1 only'
  user_result: correct
  learning_note: |
    An append-style tag policy applies its tag when a resource is created or updated. It does not
    change an untouched existing resource. Resource group tags do not automatically pass to child
    resources; a separate inherit-tag policy is needed for that behavior.
  explanation: |
    Correct selections: **VNET1: Department: D1 only; VNET2: Label: Value1 only.** VNET1 existed
    before the policy assignment and is not updated, so it retains its Department tag without the
    new Label tag. VNET2 is deployed after the assignment and receives Label: Value1. Applying
    RGroup: RG6 to the resource group does not automatically tag either virtual network.

    [Microsoft Learn: Policy definitions for tagging resources](https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/tag-policies)
    [Microsoft Learn: Use tags to organize Azure resources](https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/tag-resources)
- id: '008'
  skill: Manage Azure identities and governance
  sub-skill: Manage Azure subscriptions and governance
  question_type: hotspot
  question: |
    You have an Azure subscription named AZPT1 that contains the resources shown in the following table:

    | Name       | Type                                            |
    |------------|-------------------------------------------------|
    | storage1   | Azure Storage account                           |
    | VNET1      | Virtual network                                 |
    | VM1        | Azure virtual machine                           |
    | VM1Managed | Managed disk for VM1                            |
    | RVAULT1    | Recovery Services vault for Site Recovery of VM1 |

    You create a new Azure subscription named AZPT2.

    You need to identify which resources can be moved to AZPT2. Which resources should you identify?
  choices:
    A: VM1, storage1, VNET1, and VM1Managed only
    B: VM1 and VM1Managed only
    C: VM1, storage1, VNET1, VM1Managed, and RVAULT1
    D: RVAULT1 only
  answer: C
  user_answer: C
  user_result: correct
  learning_note: |
    The published exam answer is C, based on general cross-subscription move support for these
    resource types. In practice, active Azure Site Recovery protection blocks moving the vault and
    associated VM resources. Disable replication and clear the Site Recovery configuration as needed
    before the move, then configure protection again afterward. The vault manages replication
    metadata; VM data is replicated to the configured recovery destination, not into the vault.
  explanation: |
    Published exam answer: **C. VM1, storage1, VNET1, VM1Managed, and RVAULT1.** Azure Resource
    Manager lists these resource types as supporting subscription moves.

    The question omits an operational restriction: RVAULT1 is used for VM1 Site Recovery. Current
    Microsoft guidance says a vault with active Site Recovery protection cannot be moved, and moving
    a replicating VM or its related compute, storage, or network resources requires disabling and
    re-enabling replication. Thus C describes general resource-type capability, not an immediate
    move of all five resources in their stated configuration.

    [Microsoft Learn: Resource move support](https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/move-support-resources)
    [Microsoft Learn: Move Recovery Services vaults](https://learn.microsoft.com/en-us/azure/backup/backup-azure-move-recovery-services-vault)
    [Microsoft Learn: Site Recovery support matrix](https://learn.microsoft.com/en-us/azure/site-recovery/azure-to-azure-support-matrix)
- id: '009'
  skill: Manage Azure identities and governance
  sub-skill: Manage Azure subscriptions and governance
  question: |
    You recently created a new Azure subscription that contains a user named Admin1.

    Admin1 attempts to deploy an Azure Marketplace resource by using an Azure Resource Manager
    template. Admin1 deploys the template by using Azure PowerShell and receives the following error:

    "User failed validation to purchase resources. Legal terms have not been accepted for this item
    on this subscription. To accept legal terms, go to the Azure portal and configure programmatic
    deployment for the Marketplace item or create it there for the first time."

    You need to ensure that Admin1 can deploy the Marketplace resource successfully.
    What should you do?
  choices:
    A: From Azure PowerShell, run the Set-AzApiManagementSubscription cmdlet.
    B: From the Azure portal, register the Microsoft.Marketplace resource provider.
    C: From Azure PowerShell, run the Set-AzMarketplaceTerms cmdlet.
    D: From the Azure portal, assign the Billing administrator role to Admin1.
  answer: C
  user_answer: C
  user_result: correct
  learning_note: |
    Azure Marketplace legal terms must be accepted for the specific publisher, product, and plan
    before programmatic deployment in a subscription. Set-AzMarketplaceTerms -Accept performs this
    step in Azure PowerShell.
  explanation: |
    Correct answer: **C. Set-AzMarketplaceTerms.** The error identifies unaccepted Marketplace
    legal terms as the deployment blocker. Accept the terms for the item's publisher, product, and
    plan in the target subscription, then retry the deployment. Registering a resource provider,
    changing API Management subscriptions, or assigning a billing role does not accept those terms.

    [Microsoft Learn: Set-AzMarketplaceTerms](https://learn.microsoft.com/en-us/powershell/module/az.marketplaceordering/set-azmarketplaceterms)
- id: '010'
  skill: Manage Azure identities and governance
  sub-skill: Manage Microsoft Entra users and groups
  tags:
    - old question
  question: |
    You have an Azure Active Directory (Azure AD) tenant that contains 5,000 user accounts.

    You create a new user account named AdminUser1. You need to assign the User administrator
    administrative role to AdminUser1.

    What should you do from the user account properties?
  choices:
    A: From the Licenses blade, assign a new license.
    B: From the Directory role blade, modify the directory role.
    C: From the Groups blade, invite the user account to a new group.
  answer: B
  user_answer: C
  user_result: incorrect
  learning_note: |
    This question uses the old Azure AD portal label "Directory role." In the current Microsoft
    Entra admin center, open the user and select Assigned roles > Add assignments to assign the
    User Administrator role. A regular group invitation does not grant the role.
  explanation: |
    Correct answer: **B.** The User administrator role is a Microsoft Entra directory role.
    Assign it directly from the user's role settings. The older Directory role blade is now
    labeled Assigned roles in the Microsoft Entra admin center. Assigning a license or inviting
    the user to an ordinary group does not directly assign the administrative role.

    [Microsoft Learn: Assign user roles with Microsoft Entra ID](https://learn.microsoft.com/en-us/entra/fundamentals/how-to-assign-roles-to-users)
- id: '011'
  question: |
    Your company has an Azure Active Directory (Azure AD) subscription. You want to implement an
    Azure AD Conditional Access policy. The policy must be configured to require members of the
    Global Administrators group to use Multi-Factor Authentication and an Azure AD-joined device when
    they connect to Azure AD from untrusted locations.

    Solution: You access the Azure portal to alter the grant control of the Azure AD Conditional
    Access policy.

    Does the solution meet the goal?
  choices:
    A: Yes
    B: No
  answer: A
  user_answer: A
  user_result: correct
  user_reasoning: Correctly selected Yes because Conditional Access grant controls specify the authentication and device requirements that must be satisfied before access is granted.
  learning_note: Grant controls enforce access requirements such as MFA and an eligible device state. Assignments and conditions separately determine which users or roles, applications, and locations are covered by the policy.
  explanation: |
    Correct answer: **A. Yes.**

    Conditional Access grant controls define the requirements that users must satisfy before access
    is granted. They can require Multi-Factor Authentication and an appropriate device state, such as
    a compliant or hybrid Azure AD-joined device.

    The policy's assignments and conditions are used separately to target the Global Administrator
    role and connections from outside the configured trusted locations. Therefore, altering the grant
    controls is the appropriate way to enforce the stated MFA and device requirements.

    [Microsoft Learn: Conditional Access grant controls](https://learn.microsoft.com/en-us/entra/identity/conditional-access/concept-conditional-access-grant)
- id: '012'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  tags:
    - old question
    - low priority
  question: |
    You have an Azure subscription named Subscription1 and an on-premises deployment of Microsoft
    System Center Service Manager. Subscription1 contains a virtual machine named VM1.

    You need to ensure that an alert is set in Service Manager when the amount of available memory
    on VM1 is below 10 percent.

    What should you do first?
  choices:
    A: Create an automation runbook.
    B: Deploy a function app.
    C: Deploy the IT Service Management Connector (ITSM).
    D: Create a notification.
  answer: C
  user_answer: D
  user_result: incorrect
  user_reasoning: Selected a notification, but a notification alone does not integrate Azure Monitor with the on-premises Service Manager deployment.
  learning_note: The intended exam sequence is to deploy and configure the IT Service Management Connector first, then configure an Azure Monitor alert and action group to create the Service Manager alert or work item. This connector is not named explicitly in the 2026 AZ-104 blueprint, so treat the question as low priority while retaining the general alert-rule and action-group concepts.
  explanation: |
    Correct exam answer: **C. Deploy the IT Service Management Connector (ITSM).**

    The ITSM Connector must first establish integration between Azure Monitor and the on-premises
    System Center Service Manager deployment. After configuring the connector, create the appropriate
    Azure Monitor alert for VM1 and use an action group to create the alert or work item in Service
    Manager when available memory falls below 10 percent.

    A notification does not establish the required integration. An automation runbook or function app
    is also unnecessary for the intended ITSM integration workflow.

    The current AZ-104 blueprint covers Azure Monitor alert rules, action groups, and alert-processing
    rules, but it does not explicitly list the ITSM Connector or System Center Service Manager
    integration.

    [Microsoft Learn: IT Service Management integration](https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/itsmc-overview)
    [Microsoft Learn: AZ-104 study guide](https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/az-104)
- id: '013'
  tags:
    - "exam topic: Manage Azure identities and governance"
    - Microsoft Entra device settings
  question: |
    You sign up for Azure Active Directory (Azure AD) Premium P2.

    You need to add a user named admin1@contoso.com as an administrator on all the computers that
    will be joined to the Azure AD domain.

    What should you configure in Azure AD?
  choices:
    A: Device settings from the Devices blade.
    B: Providers from the MFA Server blade.
    C: User settings from the Users blade.
    D: General settings from the Groups blade.
  answer: A
  user_answer: C
  user_result: incorrect
  user_reasoning: Associated administrator access with assigning an administrative role from the user's settings, but the requirement is local administrator access on all Azure AD-joined computers rather than an Azure AD directory role.
  learning_note: Focus on what the user will administer. Assign directory roles from a user's Assigned roles page when the user must administer Azure or Microsoft Entra resources. Use device settings when the user must be a local administrator on Microsoft Entra-joined computers.
  explanation: |
    Correct answer: **A. Device settings from the Devices blade.**

    The key phrase is **"administrator on all the computers."** This describes local administrator
    access on Azure AD-joined Windows devices, not an Azure AD directory administrator role.

    In Azure AD device settings, add `admin1@contoso.com` under **Additional local administrators on
    all Azure AD joined devices**. In the current Microsoft Entra admin center, the corresponding
    setting is available through the device configuration used to manage additional local
    administrators on Microsoft Entra-joined devices.

    User role assignments grant permissions to administer Azure AD or Microsoft Entra resources;
    they do not make a user a local administrator on every joined computer. MFA providers and group
    general settings are unrelated.

    [Microsoft Learn: Manage the Microsoft Entra joined device local administrator role](https://learn.microsoft.com/en-us/entra/identity/devices/assign-local-admin)
- id: '014'
  skill: Manage Azure identities and governance
  sub-skill: Manage Microsoft Entra users and groups
  tags:
    - "exam topic: Manage Azure identities and governance"
    - Microsoft Entra groups and devices
  question: |
    HOTSPOT

    You have an Azure Active Directory tenant named Contoso.com that includes the following users:

    - User1: Cloud Device Administrator
    - User2: User Administrator

    Contoso.com includes the following Windows 10 devices:

    - Device1: Azure AD registered
    - Device2: Azure AD joined

    You create the following security groups in Contoso.com:

    - Group1: Assigned membership; owner is User2
    - Group2: Dynamic Device membership; owner is User2

    For each statement, select Yes if the statement is true. Otherwise, select No.
  choices:
    User1 can add Device2 to Group1:
      - 'Yes'
      - 'No'
    User2 can add Device1 to Group1:
      - 'Yes'
      - 'No'
    User2 can add Device2 to Group2:
      - 'Yes'
      - 'No'
  answer:
    User1 can add Device2 to Group1: 'No'
    User2 can add Device1 to Group1: 'Yes'
    User2 can add Device2 to Group2: 'No'
  user_answer:
    User1 can add Device2 to Group1: 'No'
    User2 can add Device1 to Group1: 'Yes'
    User2 can add Device2 to Group2: 'Yes'
  user_result: partially_correct
  user_reasoning: Correctly determined that the Cloud Device Administrator cannot manage Group1 membership and that User2 can add Device1 to the assigned group, but overlooked that members cannot be added manually to a dynamic device group.
  learning_note: Assigned groups allow authorized users or group owners to manage membership manually. Dynamic groups derive membership exclusively from their membership rules, so even a group owner cannot manually add a device. Azure AD registered versus Azure AD joined describes the device relationship with the tenant but does not override the group's membership type.
  explanation: |
    Correct selections: **No, Yes, No.**

    - **User1 can add Device2 to Group1 — No.** The Cloud Device Administrator role permits
      management of device objects, but it does not grant permission to manage the membership of an
      unrelated security group. User1 is not an owner of Group1.
    - **User2 can add Device1 to Group1 — Yes.** Group1 uses assigned membership, which permits
      manual changes, and User2 is its owner.
    - **User2 can add Device2 to Group2 — No.** Group2 uses dynamic device membership. Its membership
      is calculated from a dynamic rule and cannot be changed by manually adding a device, even by
      the group's owner.

    Device1 being Azure AD registered and Device2 being Azure AD joined describe how each device is
    connected to the tenant. Those join types do not change the manual-membership restrictions of an
    assigned or dynamic group.

    [Microsoft Learn: Microsoft Entra group membership types](https://learn.microsoft.com/en-us/entra/fundamentals/concept-learn-about-groups#group-membership)
    [Microsoft Learn: Microsoft Entra built-in roles](https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/permissions-reference)
- id: '015'
  skill: Monitor and maintain Azure resources
  sub-skill: Implement backup and recovery
  tags:
    - "exam topic: Monitor and maintain Azure resources"
    - Implement backup and recovery
  question: |
    You have an Azure subscription that contains a resource group named RG26.

    RG26 is set to the West Europe location and is used to create temporary resources for a project.
    RG26 contains the following resources:

    - VM1: Virtual machine, North Europe
    - RGV1: Recovery Services vault, North Europe
    - SQLDB01: SQL server in an Azure VM, North Europe
    - sa001: Storage account, West Europe

    SQLDB01 is backed up to RGV1.

    When the project is complete, you attempt to delete RG26 from the Azure portal. The deletion
    fails. You need to delete RG26.

    What should you do first?
  choices:
    A: Delete VM1.
    B: Stop VM1.
    C: Stop the backup of SQLDB01.
    D: Delete sa001.
  answer: C
  user_answer: C
  user_result: correct
  user_reasoning: Correctly identified that the backup relationship between SQLDB01 and the Recovery Services vault is likely preventing deletion of the resource group.
  learning_note: A Recovery Services vault cannot be deleted while it contains protected items or retained backup data. Stop protection and, when the vault must be removed, delete the associated backup data before deleting the vault and its resource group. A resource group can contain resources from different Azure regions.
  explanation: |
    Correct answer: **C. Stop the backup of SQLDB01.**

    RGV1 contains a protected backup item for SQLDB01. Azure prevents deletion of the Recovery
    Services vault while protected items or retained backup data remain, which in turn prevents the
    resource group deletion from completing.

    First stop protection for SQLDB01. To remove the vault completely, use the option to stop backup
    and delete the backup data, then remove any remaining vault dependencies before deleting the
    vault and RG26.

    Deleting or stopping VM1 and deleting sa001 do not remove the backup item from RGV1. The different
    resource locations are also not the cause; an Azure resource group can contain resources located
    in multiple regions.

    [Microsoft Learn: Delete an Azure Backup Recovery Services vault](https://learn.microsoft.com/en-us/azure/backup/backup-azure-delete-vault)
- id: '016'
  skill: Manage Azure identities and governance
  sub-skill: Manage access to Azure resources
  tags:
    - "exam topic: Manage Azure identities and governance"
    - Manage access to Azure resources
    - Azure RBAC
  question: |
    You have an Azure subscription named Subscription1 that contains a virtual network named VNet1.
    VNet1 is in a resource group named RG1.

    Subscription1 has a user named User1. User1 has the following roles:

    - Reader
    - Security Admin
    - Security Reader

    You need to ensure that User1 can assign the Reader role for VNet1 to other users.

    What should you do?
  choices:
    A: Remove User1 from the Security Reader and Reader roles for Subscription1.
    B: Assign User1 the User Access Administrator role for VNet1.
    C: Assign User1 the Network Contributor role for VNet1.
    D: Assign User1 the Network Contributor role for RG1.
  answer: B
  user_answer: B
  user_result: correct
  user_reasoning: Correctly selected User Access Administrator at the VNet1 scope because User1 needs permission to create role assignments for that resource.
  learning_note: Assigning an Azure RBAC role requires the Microsoft.Authorization/roleAssignments/write permission. User Access Administrator provides access-management permissions, whereas Reader and resource-specific contributor roles such as Network Contributor do not. Apply the role at the narrowest required scope.
  explanation: |
    Correct answer: **B. Assign User1 the User Access Administrator role for VNet1.**

    Creating an Azure role assignment requires the
    `Microsoft.Authorization/roleAssignments/write` permission. The User Access Administrator role
    grants permission to manage user access to Azure resources, including assigning the Reader role.

    Assigning it at the VNet1 scope follows least privilege: User1 can manage access to that virtual
    network without receiving access-management permissions over RG1 or the entire subscription.

    Reader and Security Reader are read-only roles. Security Admin manages security configuration but
    does not generally grant Azure RBAC role-assignment permissions. Network Contributor can manage
    network resources but cannot grant other users access to them.

    [Microsoft Learn: Azure built-in roles for Privileged](https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/privileged)
- id: '017'
  skill: Manage Azure identities and governance
  sub-skill: Manage Microsoft Entra users and groups
  tags:
    - "exam topic: Manage Azure identities and governance"
    - Manage Microsoft Entra custom domains
    - DNS records
  question: |
    You have an Azure Active Directory (Azure AD) tenant named contosocloud.onmicrosoft.com.

    Your company has a public DNS zone for contoso.com. You add contoso.com as a custom domain name
    to Azure AD.

    You need to ensure that Azure can verify the domain name.

    Which type of DNS record should you create?
  choices:
    A: MX
    B: NSEC
    C: PTR
    D: RRSIG
  answer: A
  user_answer: A
  user_result: correct
  user_reasoning: Correctly selected an MX record as the available DNS record type that Microsoft Entra ID can use to verify ownership of a custom domain.
  learning_note: Microsoft Entra ID commonly verifies a custom domain by using a Microsoft-provided TXT or MX record. MX means Mail Exchange, NSEC means Next Secure, PTR means Pointer, and RRSIG means Resource Record Digital Signature.
  explanation: |
    Correct answer: **A. MX (Mail Exchange).**

    Microsoft Entra ID can verify ownership of a custom domain by checking a DNS TXT or MX record
    containing the verification value supplied by Microsoft. Because TXT is not one of the available
    choices, MX is correct. The verification record proves domain ownership and does not need to
    replace the MX records used for normal email routing.

    - **MX — Mail Exchange:** Identifies the mail servers that receive email for a domain. It can also
      carry the Microsoft-provided custom-domain verification value.
    - **NSEC — Next Secure:** A DNS Security Extensions (DNSSEC) record that provides authenticated
      proof that a requested DNS name or record type does not exist.
    - **PTR — Pointer:** Maps an IP address back to a hostname for reverse DNS lookup.
    - **RRSIG — Resource Record Digital Signature:** A DNSSEC record containing the cryptographic
      signature for a DNS resource-record set.

    NSEC, PTR, and RRSIG do not verify a Microsoft Entra custom domain.

    [Microsoft Learn: Add your custom domain name using the Microsoft Entra admin center](https://learn.microsoft.com/en-us/entra/fundamentals/add-custom-domain)
- id: '018'
  skill: Manage Azure identities and governance
  sub-skill: Manage access to Azure resources
  tags:
    - "exam topic: Manage Azure identities and governance"
    - Manage access to Azure resources
    - Azure RBAC
  question: |
    You have an Azure Active Directory (Azure AD) tenant named Adatum and an Azure subscription named
    Subscription1. Adatum contains a group named Developers.

    Subscription1 contains a resource group named Dev.

    You need to provide the Developers group with the ability to create Azure Logic Apps in the Dev
    resource group.

    Solution: On Subscription1, you assign the DevTest Labs User role to the Developers group.

    Does this meet the goal?
  choices:
    A: Yes
    B: No
  answer: B
  user_answer: B
  user_result: correct
  user_reasoning: Correctly recognized that the Developers group needs a contributor role related to Logic Apps and that the DevTest Labs User role does not provide the required permissions.
  learning_note: The least-privileged built-in role for managing Logic Apps is Logic App Contributor. Assign it at the Dev resource group scope. A general Contributor role would also permit creation but grants broader resource-management permissions than required.
  explanation: |
    Correct answer: **B. No.**

    The DevTest Labs User role permits a user to view and use resources in Azure DevTest Labs. It
    does not grant permission to create or manage Azure Logic Apps.

    Assign the **Logic App Contributor** role to the Developers group at the **Dev resource group**
    scope. This is the service-specific contributor role intended for managing Logic Apps and follows
    least privilege by limiting both the permissions and their scope.

    The general Contributor role would also permit the group to create Logic Apps, but it grants
    management permissions over many other resource types and is broader than necessary.

    [Microsoft Learn: Azure built-in roles for Integration](https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/integration)
- id: '019'
  skill: Manage Azure identities and governance
  sub-skill: Manage access to Azure resources
  tags:
    - "exam topic: Manage Azure identities and governance"
    - Manage access to Azure resources
    - Azure RBAC
  question: |
    You have an Azure Active Directory (Azure AD) tenant named Adatum and an Azure subscription named
    Subscription1. Adatum contains a group named Developers.

    Subscription1 contains a resource group named Dev.

    You need to provide the Developers group with the ability to create Azure Logic Apps in the Dev
    resource group.

    Solution: On Subscription1, you assign the Logic App Operator role to the Developers group.

    Does this meet the goal?
  choices:
    A: Yes
    B: No
  answer: B
  user_answer: B
  user_result: correct
  user_reasoning: Correctly recognized that the Logic App Operator role can operate existing Logic Apps but cannot create them.
  learning_note: Operator roles generally perform operational actions on existing resources, whereas Contributor roles create and modify resources. Use Logic App Contributor at the Dev resource group scope to grant the required capability with least privilege.
  explanation: |
    Correct answer: **B. No.**

    The Logic App Operator role can work with existing Logic Apps, including viewing them, monitoring
    run history, enabling or disabling them, and resubmitting runs. It does not grant permission to
    create or modify Logic Apps.

    Assign the **Logic App Contributor** role to the Developers group at the **Dev resource group**
    scope. This grants the required creation and management permissions while limiting access to the
    intended resource group. Assigning a role at Subscription1 would be broader than necessary.

    Memory aid: **Operator operates existing resources; Contributor creates and modifies resources.**

    [Microsoft Learn: Azure built-in roles for Integration](https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/integration)
- id: '020'
  skill: Manage Azure identities and governance
  sub-skill: Manage access to Azure resources
  tags:
    - "exam topic: Manage Azure identities and governance"
    - Manage access to Azure resources
    - Azure RBAC
  question: |
    You have an Azure Directory (Azure AD) tenant named Adatum and an Azure subscription named
    Subscription1. Adatum contains a group named Developers.

    Subscription1 contains a resource group named Dev.

    You need to provide the Developers group with the ability to create Azure Logic Apps in the Dev
    resource group.

    Solution: On Dev, you assign the Contributor role to the Developers group.

    Does this meet the goal?
  choices:
    A: Yes
    B: No
  answer: A
  user_answer: B
  user_result: incorrect
  user_reasoning: Believed Contributor was too broad because the requirement mentioned only creating Azure Logic Apps.
  learning_note: In a "Does this meet the goal?" question, broader permissions still meet a capability requirement unless least privilege is explicitly required. Contributor at the Dev resource group scope permits creating Logic Apps there, though Logic App Contributor is narrower.
  explanation: |
    Correct answer: **A. Yes.**

    The Contributor role permits the Developers group to create and manage resources, including
    Azure Logic Apps, in the Dev resource group. Assigning the role on Dev limits its scope to that
    resource group.

    Contributor grants more permissions than the group needs for Logic Apps alone. However, the
    question asks whether the proposed assignment provides the required ability, and it does.
    If the question explicitly required least privilege, a more specific role such as Logic App
    Contributor would be preferable.

    [Microsoft Learn: Azure built-in roles for Privileged](https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/privileged)
