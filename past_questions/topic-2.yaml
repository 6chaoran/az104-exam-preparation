  learning_note: |
    A Microsoft Entra role defines what an administrator can do. An administrative unit defines
    which users, groups, or devices the administrator can manage. Create an administrative unit
    for each office and assign an appropriate directory role at that administrative-unit scope.
  explanation: |
    Correct answer: **B. Administrative units.** Create an administrative unit for each office,
