    - Azure RBAC
    - User Access Administrator
    - Virtual Machine Contributor
    - Role scope
  question: |
    You have an Azure Load Balancer named LB1.

    User1 has the following Azure role assignments:

    | Role                        | Scope                      |
    |-----------------------------|----------------------------|
    | User Access Administrator   | LB1 (this resource)        |
    | Virtual Machine Contributor | Resource group (inherited) |

    Complete each statement based on the role assignments. Each correct selection is worth one
    point.
  choices:
    User1 can perform which action on LB1:
      - Delete
      - Create a NAT rule for
      - Assign access to other users for
    User1 can perform which action on the resource group:
      - Delete a virtual machine from
      - Modify the load-balancing rules in
      - Deploy an Azure Kubernetes Service (AKS) cluster to
  answer:
    User1 can perform which action on LB1: Assign access to other users for
    User1 can perform which action on the resource group: Delete a virtual machine from
  user_answer:
    User1 can perform which action on LB1: Assign access to other users for
    User1 can perform which action on the resource group: Delete a virtual machine from
  user_result: correct
  user_reasoning: Identified that User Access Administrator permits assigning access on LB1 and that the inherited Virtual Machine Contributor role permits deleting a VM from the resource group.
  learning_note: |
    Evaluate Azure RBAC questions as role plus scope. User Access Administrator at LB1 can manage
    role assignments only on LB1. Virtual Machine Contributor inherited from the resource group can
    manage and delete VMs throughout that resource group, but it cannot manage the load balancer or
    deploy AKS.
  explanation: |
    Correct selections: **Assign access to other users for LB1; delete a virtual machine from the
    resource group.**

    User Access Administrator includes permission to create and remove Azure RBAC role assignments.
    Because the role is scoped to LB1, User1 can grant other principals access to LB1 but does not
    receive permission from that role to delete LB1 or create NAT rules.

    Virtual Machine Contributor is assigned at the resource-group scope and inherited by resources
    in that group. It permits User1 to create, manage, and delete virtual machines. It does not
    grant permission to modify load-balancer rules or deploy an AKS cluster.

    [Microsoft Learn: Steps to assign an Azure role](https://learn.microsoft.com/en-us/azure/role-based-access-control/role-assignments-steps)
    [Microsoft Learn: Azure built-in compute roles](https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/compute)
- id: '053'
  skill: Manage Azure identities and governance
