  skill: Implement and manage virtual networking
  sub-skill: Configure name resolution and load balancing
  tags:
    - "exam topic: Implement and manage virtual networking"
    - Azure DNS
    - DNS delegation
    - NS records
  question: |
    You have an Azure DNS zone named adatum.com.

    You need to delegate a subdomain named research.adatum.com to a different DNS server in Azure.

    What should you do?
  choices:
    A: Create an NS record named research in the adatum.com zone.
    B: Create a PTR record named research in the adatum.com zone.
    C: Modify the SOA record of adatum.com.
    D: Create an A record named *.research in the adatum.com zone.
  answer: A
  user_answer: A
  user_result: correct
  user_reasoning: Selected an NS record named research in the parent adatum.com zone; no further reasoning was provided.
  learning_note: |
    Delegate a child DNS zone by creating an NS record set for the child label in the parent zone.
    The NS records identify the name servers authoritative for the child zone. Address, reverse
    lookup, and SOA records do not delegate DNS authority.
  explanation: |
    Correct answer: **A. Create an NS record named research in the adatum.com zone.** An NS record
    set in the parent zone delegates authority for `research.adatum.com` to the name servers listed
    in that record set.

    - **B. PTR:** Maps an IP address to a DNS name for reverse DNS lookup.
    - **C. SOA:** Contains administrative and synchronization information for the current zone; it
      does not delegate a child zone.
    - **D. A:** Maps a hostname to an IPv4 address. A wildcard A record can resolve names below
      `research.adatum.com`, but it does not transfer authority for the subdomain.

    [Microsoft Learn: Delegate an Azure DNS subdomain](https://learn.microsoft.com/en-us/azure/dns/delegate-subdomain)
    [Microsoft Learn: Azure DNS delegation overview](https://learn.microsoft.com/en-us/azure/dns/dns-domain-delegation)
- id: '041'
  skill: Manage Azure identities and governance
