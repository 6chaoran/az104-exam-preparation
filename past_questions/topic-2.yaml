  skill: Manage Azure identities and governance
  sub-skill: Manage Microsoft Entra users and groups
  tags:
    - "exam topic: Manage Azure identities and governance"
    - Default user permissions
    - Application registration
    - Service principals
    - Administration portal access
  question: |
    HOTSPOT

    You have an Azure AD tenant.

    You need to modify the Default user role permissions settings for the tenant.
    The solution must meet the following requirements:

    - Standard users must be prevented from creating new service principals.
    - Standard users must only be able to use PowerShell or Microsoft Graph to manage their own Azure resources.

    Which two settings should you modify? Select the appropriate settings in the answer area.
    Each correct answer is worth one point.
  choices:
    Users can register applications:
      - 'Yes'
      - 'No'
    Restrict non-admin users from creating tenants:
      - 'Yes'
      - 'No'
    Users can create security groups:
      - 'Yes'
      - 'No'
    Guest user access restrictions:
      - Guest users have the same access as members (most inclusive)
      - Guest users have limited access to properties and memberships of directory objects
      - Guest user access is restricted to properties and memberships of their own directory objects (most restrictive)
    Restrict access to Azure AD administration portal:
      - 'Yes'
      - 'No'
    Allow users to connect their work or school account with LinkedIn:
      - 'Yes'
      - Selected group
      - 'No'
    Show keep user signed in:
      - 'Yes'
      - 'No'
  answer:
    Users can register applications: 'No'
    Restrict access to Azure AD administration portal: 'Yes'
  user_answer:
    Users can register applications: 'No'
    Restrict non-admin users from creating tenants: 'Yes'
  user_result: partially_correct
  learning_note: |
    Restrict tenant creation controls creation of new directories; it does not restrict
    administration portal access. The exam clue PowerShell or Microsoft Graph points
    to restricting administration portal access. This portal setting does not change
    API permissions or enforce access to only the user's own Azure resources.
  explanation: |
    Expected selections:

    - **Users can register applications: No.** This removes standard users' default
      ability to register applications. Registering an application through the portal
      also creates its service principal. Explicitly assigned application-management
      roles can still grant creation permissions.
    - **Restrict access to Azure AD administration portal: Yes.** This restricts
      non-admin access to directory administration pages while leaving programmatic
      access through PowerShell and Microsoft Graph available.

    The learner selected the application setting correctly. Restrict non-admin users
    from creating tenants controls creation of new directories, which is unrelated
    to requiring programmatic management of the existing tenant.

    Users can create security groups controls group creation. Guest access restrictions
    apply to guests rather than standard member users. LinkedIn connections and the
    keep-user-signed-in prompt do not meet either requirement.

    The question's wording is imprecise. Restricting administration portal access is
    not a security boundary: it limits commonly visited administration pages and does
    not block programmatic directory access or restrict access to only the user's own
    Azure resources. Actual permissions still depend on authorization, including Azure
    RBAC for Azure resources. Microsoft Graph primarily manages directory and related
    Microsoft 365 objects, rather than general Azure Resource Manager resources.
    Disabling application registration also does not describe every possible route
    by which a service principal can be provisioned, such as application consent.

    Remember: App registration restriction controls default app creation; portal access
    restriction controls the administration interface; tenant creation restriction
    controls creating another directory. Azure AD is now called Microsoft Entra ID.

    [Microsoft Learn: Default user permissions](https://learn.microsoft.com/en-us/entra/fundamentals/users-default-permissions)
    [Microsoft Learn: Register an app and create a service principal](https://learn.microsoft.com/en-us/entra/identity-platform/howto-create-service-principal-portal)
- id: '093'
  skill: Manage Azure identities and governance
  sub-skill: Manage access to Azure resources
  tags:
    - "exam topic: Manage Azure identities and governance"
    - Azure RBAC
    - Azure ABAC
    - Role assignment conditions
    - Blob data permissions
  question: |
    HOTSPOT

    You have an Azure subscription named Sub1 that contains the following blob containers.

    | Name  | In storage account | Contains blob |
    |-------|--------------------|---------------|
    | cont1 | storage1           | blob1         |
    | cont2 | storage2           | blob2         |
    | cont3 | storage3           | blob3         |

    Sub1 contains two users named User1 and User2. Both users are assigned the Reader
    role at the Sub1 scope.

    You have a condition named Condition1:

    ```text
    (
      (
        !(ActionMatches{'Microsoft.Storage/storageAccounts/blobServices/containers/blobs/read'})
      )
      OR
      (
        @Resource[Microsoft.Storage/storageAccounts/blobServices/containers:name] StringEquals 'cont1'
      )
    )
    ```

    You have a condition named Condition2:

    ```text
    (
      (
        !(ActionMatches{'Microsoft.Storage/storageAccounts/blobServices/containers/blobs/write'})
      )
      OR
      (
        @Resource[Microsoft.Storage/storageAccounts/blobServices/containers/blobs:path] StringLike '*2*'
      )
    )
    ```

    You assign the following additional roles:

    | User  | Role                    | Scope    | Role assignment condition |
    |-------|-------------------------|----------|---------------------------|
    | User1 | Storage Blob Data Reader | Sub1     | Condition1                |
    | User2 | Storage Blob Data Owner  | storage1 | Condition2                |

    For each statement, select Yes if the statement is true. Otherwise, select No.
    Each correct selection is worth one point.
  choices:
    User1 can read blob2:
      - 'Yes'
      - 'No'
    User1 can read blob3:
      - 'Yes'
      - 'No'
    User2 can read blob1:
      - 'Yes'
      - 'No'
  answer:
    User1 can read blob2: 'No'
    User1 can read blob3: 'No'
    User2 can read blob1: 'Yes'
  user_answer:
    User1 can read blob2: 'No'
    User1 can read blob3: 'No'
    User2 can read blob1: 'No'
  user_result: partially_correct
  learning_note: |
    ActionMatches checks the requested operation, not the user's role name. For a read
    request, NOT(ActionMatches{'read'}) is false, so Condition1 requires container cont1.
    Condition2 targets writes; a read makes NOT(ActionMatches{'write'}) true and passes
    that condition. Conditions restrict permissions already granted by the role and
    scope; passing a condition does not grant extra permissions.
  explanation: |
    Correct answers: **No, No, Yes.** Check the role's permissions, assignment scope,
    and then its condition. The subscription Reader role does not grant blob data access.

    **User1 can read blob2: No.** Storage Blob Data Reader at Sub1 covers storage2,
    but Condition1 restricts blob reads to containers named cont1. blob2 is in cont2.

    **User1 can read blob3: No.** The assignment scope covers storage3, but blob3 is
    in cont3 and fails the same condition.

    **User2 can read blob1: Yes.** Storage Blob Data Owner grants read permission at
    storage1, where blob1 resides. Condition2 targets the write action. Reading blob1
    makes ActionMatches{'write'} false, so its negation is true. The OR expression
    therefore passes without requiring the blob path to contain 2.

    To understand User1, simplify Condition1 to:

    ```text
    (requested action is NOT read) OR (container name is cont1)
    ```

    When User1 requests a read, ActionMatches{'read'} is true and NOT makes it false.
    The result then depends on the container: cont1 passes; cont2 and cont3 fail.
    Thus User1 can read blob1 but cannot read blob2 or blob3 through this assignment.

    ActionMatches refers to the operation currently being authorized, not the role
    name. The condition is evaluated when this assignment is used to authorize a
    request. For non-read operations, Condition1 adds no restriction, but the role
    must still grant that operation. Storage Blob Data Reader does not grant writes,
    so a true condition would not allow User1 to write a blob.

    Remember: NOT(ActionMatches{action}) OR restriction means "If performing this
    action, satisfy the restriction; otherwise this condition adds no restriction."
    Conditions do not expand a role's permissions or scope.

    [Microsoft Learn: Azure role assignment condition format and syntax](https://learn.microsoft.com/en-us/azure/role-based-access-control/conditions-format)
    [Microsoft Learn: Azure built-in roles for Storage](https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/storage)
- id: '095'
  skill: Deploy and manage Azure compute resources
  sub-skill: Automate deployment of resources by using Azure Resource Manager (ARM) templates or Bicep files
  tags:
    - "exam topic: Manage Azure identities and governance"
    - ARM templates
    - Resource groups
    - Resource iteration
    - Deployment location
  question: |
    HOTSPOT

    You purchase a new Azure subscription.
    You create an Azure Resource Manager (ARM) template named deploy.json:

    ```json
    {
      "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentTemplate.json#",
      "contentVersion": "1.0.0.0",
      "parameters": {
        "obj1": {
          "type": "object",
          "defaultValue": {
            "propA": "one",
            "propB": "two",
            "propC": "three",
            "propD": {
              "propD-1": "sub",
              "propD-2": "sub"
            }
          }
        },
        "par1": {
          "type": "string",
          "allowedValues": ["centralus", "eastus", "westus"],
          "defaultValue": "eastus"
        }
      },
      "variables": {
        "var1": ["westus", "centralus", "eastus"]
      },
      "resources": [
        {
          "type": "Microsoft.Resources/resourceGroups",
          "apiVersion": "2018-05-01",
          "location": "eastus",
          "name": "[concat('RGS', copyIndex())]",
          "copy": {
            "name": "copy",
            "count": 2
          }
        },
        {
          "type": "Microsoft.Resources/resourceGroups",
          "apiVersion": "2018-05-01",
          "location": "[last(variables('var1'))]",
          "name": "[concat('ResGrp', '8')]"
        },
        {
          "type": "Microsoft.Resources/resourceGroups",
          "apiVersion": "2018-05-01",
          "location": "[parameters('par1')]",
          "name": "[concat('RGroup', length(parameters('obj1')))]"
        }
      ],
      "outputs": {}
    }
    ```

    You connect to the subscription and run the following command:

    ```powershell
    New-AzDeployment -Location westus -TemplateFile "deploy.json"
    ```

    For each statement, select Yes if the statement is true. Otherwise, select No.
    Each correct selection is worth one point.
  choices:
    Three resource groups are created when you run the script:
      - 'Yes'
      - 'No'
    A resource group named RGroup5 is created:
      - 'Yes'
      - 'No'
    All the resource groups are created in the East US Azure region:
      - 'Yes'
      - 'No'
  answer:
    Three resource groups are created when you run the script: 'No'
    A resource group named RGroup5 is created: 'No'
    All the resource groups are created in the East US Azure region: 'Yes'
  user_answer:
    Three resource groups are created when you run the script: 'No'
    A resource group named RGroup5 is created: 'No'
    All the resource groups are created in the East US Azure region: 'Yes'
  user_result: correct
  user_reasoning: Identified four resource groups because the first definition has two copies; identified RGroup4 rather than RGroup5; selected Yes for all groups being in East US.
  learning_note: |
    Resource copy count determines the number of instances, and copyIndex() starts
    at zero. length(object) counts only top-level properties, including a nested
    object as one property. The subscription deployment's -Location stores deployment
    metadata and does not override resource locations declared in the template.
  explanation: |
    Correct answers: **No, No, Yes.**

    **Three resource groups are created: No.** The first resource definition has
    copy.count set to 2, producing RGS0 and RGS1 because copyIndex() starts at zero.
    The remaining definitions each create one resource group, for four in total.

    **RGroup5 is created: No.** obj1 has four top-level properties: propA, propB,
    propC, and propD. length(parameters('obj1')) returns 4, so the name is RGroup4.
    The two properties nested inside propD do not increase the top-level count.

    **All resource groups are in East US: Yes.** The resulting groups are:

    | Resource group | Location | Reason |
    |----------------|----------|--------|
    | RGS0 | eastus | Explicit location in the copied resource definition |
    | RGS1 | eastus | Explicit location in the copied resource definition |
    | ResGrp8 | eastus | last(var1) returns the final array element, eastus |
    | RGroup4 | eastus | par1 defaults to eastus and the command supplies no override |

    New-AzDeployment -Location westus specifies where Azure stores the subscription
    deployment metadata. It does not override the resource groups' location values.

    Remember: Copy count controls how many; copyIndex controls the zero-based suffix;
    object length counts top-level keys; deployment location stores deployment metadata.

    [Microsoft Learn: copyIndex](https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/template-functions-numeric#copyindex)
    [Microsoft Learn: Object length](https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/template-functions-object#length)
    [Microsoft Learn: Array last](https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/template-functions-array#last)
    [Microsoft Learn: Subscription deployment location](https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/deploy-to-subscription#deployment-location-and-name)
- id: '096'
  skill: Implement and manage virtual networking
  sub-skill: Configure secure access to virtual networks
  tags:
    - "exam topic: Implement and manage virtual networking"
    - Private endpoints
    - Azure Private Link
    - Azure Storage
    - Forced tunneling
    - must-review
  question: |
    Your on-premises network contains a VPN gateway.

    You have an Azure subscription that contains the following resources.

    | Name | Type | Description |
    |------|------|-------------|
    | vgw1 | Virtual network gateway | Gateway for Site-to-Site VPN to the on-premises network |
    | storage1 | Storage account | Standard performance tier |
    | Vnet1 | Virtual network | Enabled forced tunneling |
    | VM1 | Virtual machine | Connected to Vnet1 |

    You need to ensure that all the traffic from VM1 to storage1 travels across
    the Microsoft backbone network.

    What should you configure?
  choices:
    A: Azure AD Application Proxy
    B: private endpoints
    C: a network security group (NSG)
    D: Azure Peering Service
  answer: B
  user_answer: B
  user_result: correct
  user_reasoning: Selected private endpoints; no further reasoning was provided.
  learning_note: |
    A private endpoint provides a private IP address in a virtual network for a
    specific storage service. With DNS resolving the storage hostname to that IP,
    traffic uses Azure Private Link over the Microsoft backbone. Forced tunneling
    of public-destination traffic does not require this private traffic to travel
    through the on-premises VPN gateway. An NSG filters traffic rather than choosing
    its route or providing private connectivity.
  explanation: |
    **B — private endpoints** is correct.

    A private endpoint for storage1 places a network interface with a private IP
    address in Vnet1. VM1 connects to the storage service through that private IP,
    and Azure Private Link carries the traffic over the Microsoft backbone network.

    Forced tunneling is the decisive clue. Traffic to the storage public endpoint
    can otherwise follow the default route through vgw1 to the on-premises network.
    With a private endpoint and correctly configured DNS, the storage hostname
    resolves to the private endpoint IP and VM1 uses the private path:

    VM1 → private endpoint in Vnet1 → Azure Private Link → storage1.

    Create endpoints for the storage services that VM1 uses, such as Blob or File,
    and configure the corresponding private DNS resolution. Creating a private
    endpoint does not automatically disable the storage account's public endpoint.

    **Why the other options are wrong:**

    - **A:** Azure AD Application Proxy (now Microsoft Entra Application Proxy)
      provides remote access to on-premises web applications. It does not provide
      this private connection from an Azure VM to Azure Storage.
    - **C:** A network security group allows or blocks traffic. It does not create
      a private storage endpoint or ensure a route over the Microsoft backbone.
    - **D:** Azure Peering Service improves connectivity to Microsoft services through
      connectivity providers. It does not create a private storage endpoint in Vnet1.

    Remember: Private endpoint = private IP in your VNet + Private Link to the service
    over the Microsoft backbone. Service endpoints can also keep service traffic on
    the backbone, but they are not among the answer choices in this question.

    [Microsoft Learn: Use private endpoints for Azure Storage](https://learn.microsoft.com/en-us/azure/storage/common/storage-private-endpoints)
    [Microsoft Learn: Virtual network service endpoints](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoints-overview)
- id: '100'
  skill: Manage Azure identities and governance
  sub-skill: Manage Microsoft Entra users and groups
  tags:
    - "exam topic: Manage Azure identities and governance"
    - Microsoft Entra ID
    - Users and groups
    - Group-based licensing
    - must-review
  question: |
    HOTSPOT

    You have a Microsoft Entra tenant that contains the following groups.

    | Name | Type | Has an assigned license |
    |------|------|-------------------------|
    | Group1 | Security | Yes |
    | Group2 | Security | No |
    | Group3 | Microsoft 365 | Yes |
    | Group4 | Microsoft 365 | No |

    The tenant contains the following users.

    | Name | Member of | Has a directly assigned license |
    |------|-----------|---------------------------------|
    | User1 | None | Yes |
    | User2 | Group1 | No |
    | User3 | Group4 | Yes |
    | User4 | None | No |

    Which users and groups can you delete? Select the appropriate options in the
    answer area. Each correct selection is worth one point.
  choices:
    Users:
      - User4 only
      - User1 and User4 only
      - User2 and User4 only
      - User1, User2, User3, and User4
    Groups:
      - Group2 only
      - Group2 and Group3 only
      - Group2 and Group4 only
      - Group1, Group2, Group3, and Group4
  answer:
    Users: User1, User2, User3, and User4
    Groups: Group2 and Group4 only
  user_answer:
    Users: User1, User2, User3, and User4
    Groups: Group1, Group2, Group3, and Group4
  user_result: partially_correct
  user_reasoning: Selected all users and all groups; no further reasoning was provided.
  learning_note: |
    A directly assigned or inherited license does not prevent deleting a user.
    A group with assigned licenses requires those licenses to be removed before
    deletion. This applies to both security and Microsoft 365 groups.
  explanation: |
    Correct answers: **All users; Group2 and Group4 only.**

    **Users:** User1 and User3 have directly assigned licenses. User2 inherits a
    license from Group1. User4 has no license. None of these licensing states
    prevents deleting the user, so all four users can be deleted.

    **Groups:** Group1 and Group3 have licenses assigned. Remove their license
    assignments before deleting them. Group2 and Group4 have no assigned licenses
    and can be deleted as shown. Security versus Microsoft 365 group type does
    not change the licensing restriction.

    The question asks which objects can be deleted in their current state; do not
    assume an extra step to remove the groups' licenses first. User membership
    does not itself block deleting either the user or an unlicensed group.

    The learner's users selection was correct; the groups selection overlooked
    the requirement to remove assigned licenses before group deletion.

    This remains a relevant licensing distinction in Microsoft documentation,
    unlike the retired classic co-administrator role in the preceding question.

    Remember: Licensed user → can delete. Licensed group → remove licenses first.

    [Microsoft Learn: Assign or unassign user licenses](https://learn.microsoft.com/en-us/microsoft-365/admin/manage/remove-licenses-from-users?view=o365-worldwide)
    [Microsoft Learn: Troubleshoot group deletion](https://learn.microsoft.com/en-us/troubleshoot/entra/entra-id/dir-dmns-obj/troubleshoot-dynamic-groups#troubleshoot-dynamic-groups-deletion-or-restoration)
- id: '101'
  skill: Implement and manage virtual networking
  sub-skill: Configure secure access to virtual networks
  tags:
    - "exam topic: Implement and manage virtual networking"
    - Private endpoints
    - Azure Private Link
    - Azure Storage
  question: |
    You have an Azure subscription that contains the following resources.

    | Name | Type | Location |
    |------|------|----------|
    | VM1 | Virtual machine | East US |
    | storage1 | Storage account | West US |

    You need to ensure that data transfers between storage1 and VM1 do NOT
    traverse the internet.

    What should you configure for storage1?
  choices:
    A: data protection
    B: a private endpoint
    C: Public network access in the Firewalls and virtual networks settings
    D: a shared access signature (SAS)
  answer: B
  user_answer: B
  user_result: correct
  user_reasoning: Selected a private endpoint; no further reasoning was provided.
  learning_note: |
    A private endpoint gives a storage service a private IP in a virtual network.
    Traffic uses Azure Private Link over the Microsoft backbone. The storage
    account can be in a different region from the virtual network and endpoint.
    Configure DNS so the storage hostname resolves to the private endpoint IP.
  explanation: |
    **B — a private endpoint** is correct.

    Create a private endpoint for the required storage1 service, such as Blob or
    File, in VM1's virtual network. The endpoint uses a private IP address, and
    Azure Private Link carries traffic to storage1 over the Microsoft backbone,
    avoiding the public internet.

    The regions do not prevent this solution. The private endpoint and virtual
    network can be in East US while the storage account remains in West US.
    Private Link supports connecting to a service in another region.

    Configure DNS so VM1 resolves the storage service hostname to the private
    endpoint IP. Applications can keep their normal storage connection strings.
    Creating a private endpoint does not automatically disable public access to
    the storage account; public network access can be disabled separately if needed.

    **Why the other options are wrong:**

    - **A:** Data protection features help protect or recover data. They do not
      provide private network connectivity.
    - **C:** Public network access controls access through the public endpoint.
      That setting alone does not create a private connection from VM1.
    - **D:** A shared access signature grants scoped, time-limited access to
      storage data. It controls authorization, not the network path.

    Remember: Private endpoint = private IP + Private Link + Microsoft backbone.

    [Microsoft Learn: Use private endpoints for Azure Storage](https://learn.microsoft.com/en-us/azure/storage/common/storage-private-endpoints)
    [Microsoft Learn: Private endpoint regional requirements](https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview)
