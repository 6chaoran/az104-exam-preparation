    - Azure RBAC
    - Custom roles
    - Data actions
    - Assignable scopes
  question: |
    You configure a custom Azure role named role1. Its role definition includes compute and network
    management permissions in `actions`, empty `dataActions`, and the subscription in
    `assignableScopes`.

    Complete each statement by selecting the section of the custom role definition that must be
    modified.

    1. To ensure that users assigned role1 can sign in to virtual machines, modify which section?
    2. To ensure that role1 can be assigned only within a resource group named RG1, modify which
       section?
  choices:
    To permit virtual machine sign-in:
      - actions
      - roleType
      - notActions
      - dataActions
      - notDataActions
      - assignableScopes
    To restrict role assignment to RG1:
      - actions
      - roleType
      - notActions
      - dataActions
      - notDataActions
      - assignableScopes
  answer:
    To permit virtual machine sign-in: dataActions
    To restrict role assignment to RG1: assignableScopes
  user_answer:
    To permit virtual machine sign-in: actions
    To restrict role assignment to RG1: assignableScopes
  user_result: partially_correct
  user_reasoning: Selected actions for virtual machine sign-in and assignableScopes for restricting the role to RG1.
  learning_note: |
    `actions` contains control-plane permissions for managing Azure resources. Virtual machine
    sign-in permissions, such as `Microsoft.Compute/virtualMachines/login/action`, belong in
    `dataActions`. `assignableScopes` defines where a custom role is available for assignment; use
    the resource ID of RG1 to restrict its availability to that scope and its descendants.
  explanation: |
    Correct selections: **dataActions; assignableScopes.**

    Signing in to a virtual machine is treated as a data-plane operation. Add
    `Microsoft.Compute/virtualMachines/login/action` to `dataActions` for regular sign-in, or
    `Microsoft.Compute/virtualMachines/loginAsAdmin/action` when administrator sign-in is required.

    To restrict the custom role to RG1, change `assignableScopes` to the resource group's full
    resource ID, such as `/subscriptions/<subscription-id>/resourceGroups/RG1`. The role can then
    be assigned at RG1 or at resources beneath RG1.

    [Microsoft Learn: Azure role definitions](https://learn.microsoft.com/en-us/azure/role-based-access-control/role-definitions)
    [Microsoft Learn: Azure custom roles](https://learn.microsoft.com/en-us/azure/role-based-access-control/custom-roles)
- id: '055'
  skill: Implement and manage storage
  sub-skill: Configure access to storage
  tags:
    - "exam topic: Manage Azure identities and governance"
    - Azure Files
    - Azure RBAC
    - AD DS authentication
    - SMB share permissions
  question: |
    You have an Azure subscription that contains a storage account named storage1. The storage1
    account contains a file share named share1.

    The subscription is linked to a hybrid Azure Active Directory (Azure AD) tenant that contains
    a security group named Group1.

    You need to grant Group1 the Storage File Data SMB Share Elevated Contributor role for share1.

    What should you do first?
  choices:
    A: Enable Active Directory Domain Services (AD DS) authentication for storage1.
    B: Grant share-level permissions by using File Explorer.
    C: Mount share1 by using File Explorer.
    D: Create a private endpoint.
  answer: A
  user_answer: A
  user_result: correct
  user_reasoning: Selected enabling AD DS authentication for storage1 first; no further reasoning was provided.
  learning_note: |
    For identity-based SMB access to Azure Files, first enable a supported identity source on the
    storage account. Then assign the appropriate share-level Azure RBAC role. Mount the share and
    configure Windows ACLs only when file- or directory-level permissions are also required.
  explanation: |
    Correct answer: **A. Enable Active Directory Domain Services (AD DS) authentication for
    storage1.** The hybrid identity scenario requires identity-based authentication to be enabled
    for Azure Files before the synchronized security group can use Azure RBAC permissions to access
    the SMB share.

    After enabling AD DS authentication, assign Storage File Data SMB Share Elevated Contributor to
    Group1 at the share1 scope. This role grants read, write, delete, and ACL modification access.
    Mounting the share or using File Explorer is relevant later when configuring Windows file and
    directory ACLs. A private endpoint changes network connectivity and does not enable identity
    authorization.

    Memory sequence: **enable the identity source, assign share-level RBAC, and then configure NTFS
    ACLs if required.**

    [Microsoft Learn: Enable AD DS authentication for Azure Files](https://learn.microsoft.com/en-us/azure/storage/files/storage-files-identity-ad-ds-enable)
    [Microsoft Learn: Assign share-level permissions for Azure Files](https://learn.microsoft.com/en-us/azure/storage/files/storage-files-identity-assign-share-level-permissions)
- id: '056'
  skill: Manage Azure identities and governance
  sub-skill: Manage access to Azure resources
  tags:
    - "exam topic: Manage Azure identities and governance"
    - Azure RBAC
    - Management groups
    - User Access Administrator
    - Role inheritance
    - Least privilege
  question: |
    You have 15 Azure subscriptions.

    You have an Azure Active Directory (Azure AD) tenant that contains a security group named
    Group1. You plan to purchase additional Azure subscriptions.

    You need to ensure that Group1 can manage role assignments for the existing subscriptions and
    the planned subscriptions. The solution must meet the following requirements:

    - Use the principle of least privilege.
    - Minimize administrative effort.

    What should you do?
  choices:
    A: Assign Group1 the Owner role for the root management group.
    B: Assign Group1 the User Access Administrator role for the root management group.
    C: Create a new management group and assign Group1 the User Access Administrator role for the group.
    D: Create a new management group and assign Group1 the Owner role for the group.
  answer: B
  user_answer: B
  user_result: correct
  user_reasoning: Selected User Access Administrator at the root management group; no further reasoning was provided.
  learning_note: |
    User Access Administrator permits management of Azure RBAC assignments without granting full
    resource-management access. A role assigned at the tenant root management group is inherited
    throughout the hierarchy. New subscriptions default to the root management group, so one role
    assignment covers both existing and future subscriptions.
  explanation: |
    Correct answer: **B. Assign Group1 the User Access Administrator role for the root management
    group.** This role grants the access-management permissions Group1 requires and avoids the
    broader resource-management permissions of Owner.

    All subscriptions and management groups in the directory are descendants of the tenant root
    management group, and new subscriptions default to it. The role assignment is therefore
    inherited by the existing and planned subscriptions without separate assignments.

    Creating another management group would require organizing the existing subscriptions under it
    and ensuring future subscriptions are moved into it. Assigning Owner in either location would
    violate least privilege by granting full resource-management access.

    [Microsoft Learn: Organize resources with management groups](https://learn.microsoft.com/en-us/azure/governance/management-groups/overview)
    [Microsoft Learn: Azure built-in privileged roles](https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/privileged)
- id: '057'
  skill: Manage Azure identities and governance
  sub-skill: Manage Azure subscriptions and governance
  question_type: hotspot
  tags:
    - "exam topic: Manage Azure identities and governance"
    - Azure Policy
    - Policy assignments
    - Excluded scopes
    - Scope hierarchy
  question: |
    You have an Azure subscription that contains the following hierarchy:

    Tenant Root Group > ManagementGroup1 > Subscription1 > RG1 > VM1

    You create an Azure Policy definition named Policy1.

    To which Azure resources can you assign Policy1, and which Azure resources can you specify as
    exclusions from Policy1? Select the appropriate option for each statement.
  choices:
    You can assign Policy1 to:
      - Subscription1 and RG1 only
      - ManagementGroup1 and Subscription1 only
      - Tenant Root Group, ManagementGroup1, and Subscription1 only
      - Tenant Root Group, ManagementGroup1, Subscription1, and RG1 only
      - Tenant Root Group, ManagementGroup1, Subscription1, RG1, and VM1
    You can exclude Policy1 from:
      - VM1 only
      - RG1 and VM1 only
      - Subscription1, RG1, and VM1 only
      - ManagementGroup1, Subscription1, RG1, and VM1 only
      - Tenant Root Group, ManagementGroup1, Subscription1, RG1, and VM1
  answer:
    You can assign Policy1 to: Tenant Root Group, ManagementGroup1, Subscription1, RG1, and VM1
    You can exclude Policy1 from: ManagementGroup1, Subscription1, RG1, and VM1 only
  user_answer:
    You can assign Policy1 to: Tenant Root Group, ManagementGroup1, Subscription1, RG1, and VM1
    You can exclude Policy1 from: ManagementGroup1, Subscription1, RG1, and VM1 only
  user_result: correct
  user_reasoning: Policy can be assigned at every displayed scope from the tenant root group through VM1, while exclusions can include descendant scopes from ManagementGroup1 through VM1.
  learning_note: |
    Azure Policy assignments support management-group, subscription, resource-group, and individual
    resource scopes. An exclusion (`notScopes`) must be a descendant within the assignment scope.
    Therefore, an assignment at the tenant root group can exclude ManagementGroup1 or any displayed
    scope below it, but it cannot exclude its own tenant-root assignment scope.
  explanation: |
    Correct selections: **Tenant Root Group, ManagementGroup1, Subscription1, RG1, and VM1** for
    assignment; **ManagementGroup1, Subscription1, RG1, and VM1 only** for exclusion.

    A policy can be assigned at a management group, including the tenant root group, a subscription,
    a resource group, or an individual resource. Child resources inherit an assignment from a
    parent scope.

    Exclusions remove a subscope from an assignment and begin below the assignment scope. For a
    policy assigned at the tenant root group, ManagementGroup1, Subscription1, RG1, and VM1 are all
    valid descendant exclusions. The tenant root group cannot be an exclusion from its own
    assignment.

    [Microsoft Learn: Azure Policy overview](https://learn.microsoft.com/en-us/azure/governance/policy/overview)
    [Microsoft Learn: Build policies to enforce compliance](https://learn.microsoft.com/en-us/azure/governance/policy/tutorials/create-and-manage)
- id: '058'
  skill: Manage Azure identities and governance
  sub-skill: Manage Microsoft Entra users and groups
  tags:
    - "exam topic: Manage Azure identities and governance"
    - Microsoft Entra ID
    - Global Administrator
    - Tenant scope
    - Directory roles
  question: |
    This question is part of a series in which each question presents the same scenario with a
    different proposed solution.

    You have an Azure subscription linked to an Azure Active Directory tenant named
    contoso.onmicrosoft.com. The tenant contains the following users:

    | Name  | Role                 | Scope                  |
    |-------|----------------------|------------------------|
    | User1 | Global Administrator | Azure Active Directory |
    | User2 | Global Administrator | Azure Active Directory |
    | User3 | User Administrator   | Azure Active Directory |
    | User4 | Owner                | Azure subscription     |

    User1 creates a new Azure Active Directory tenant named external.contoso.onmicrosoft.com.

    You need to create new user accounts in external.contoso.onmicrosoft.com.

    Solution: You instruct User2 to create the user accounts.

    Does this meet the goal?
  choices:
    A: true
    B: false
  answer: B
  user_answer: B
  user_result: correct
  user_reasoning: User Administrator should be able to create users, but Global Administrator might not.
  learning_note: |
    Global Administrator can create users, but Microsoft Entra administrator roles are scoped to
    the tenant in which they are assigned. A Global Administrator assignment in one tenant grants
    no automatic administrative access to another tenant. The creator of a new tenant becomes its
    initial Global Administrator by default.
  explanation: |
    Correct answer: **B. No.** User2 is a Global Administrator only in
    contoso.onmicrosoft.com. That role assignment does not carry into the separately created
    external.contoso.onmicrosoft.com tenant, so User2 cannot create accounts there based on the
    existing assignment.

    User1, as the creator and initial Global Administrator of the new tenant, can create the users.
    Alternatively, User1 can add User2 to the new tenant and assign an appropriate Microsoft Entra
    role, such as User Administrator or Global Administrator.

    The issue is tenant scope, not a limitation of Global Administrator: both Global Administrator
    and User Administrator can create users when assigned in the applicable tenant.

    [Microsoft Learn: Azure roles and Microsoft Entra roles](https://learn.microsoft.com/en-us/azure/role-based-access-control/rbac-and-directory-admin-roles)
    [Microsoft Learn: Access and create a new tenant](https://learn.microsoft.com/en-us/entra/fundamentals/sign-up-organization)
