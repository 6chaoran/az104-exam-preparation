    - Least privilege
  question: |
    You have an Azure subscription that contains a user named User1.

    You need to ensure that User1 can deploy virtual machines and manage virtual networks. The
    solution must use the principle of least privilege.

    Which role-based access control (RBAC) role should you assign to User1?
  choices:
    A: Owner
    B: Virtual Machine Contributor
    C: Contributor
    D: Virtual Machine Administrator Login
  answer: C
  user_answer: C
  user_result: correct
  user_reasoning: Selected Contributor; no further reasoning was provided.
  learning_note: |
    Contributor is the least-privileged single role among these choices that can manage both
    virtual machines and virtual networks. Virtual Machine Contributor cannot manage the virtual
    networks connected to the VMs, while Owner adds unnecessary role-assignment permissions.
  explanation: |
    Correct answer: **C. Contributor.** Contributor can create and manage resources across Azure
    services, including virtual machines and virtual networks, but cannot assign Azure RBAC roles.
    It is therefore the least-privileged single role among the choices that satisfies both
    requirements.

    - **A. Owner:** Can perform both tasks but also grants permission to manage access, making it
      broader than necessary.
    - **B. Virtual Machine Contributor:** Can create and manage virtual machines, disks, and VM
      extensions, but cannot manage the virtual networks or storage accounts connected to them.
    - **D. Virtual Machine Administrator Login:** Permits administrator login to virtual machines;
      it does not grant permission to deploy VMs or manage virtual networks.

    [Microsoft Learn: Azure roles and Microsoft Entra roles](https://learn.microsoft.com/en-us/azure/role-based-access-control/rbac-and-directory-admin-roles)
