- id: '088'
  skill: Manage Azure identities and governance
  sub-skill: Manage access to Azure resources
  tags:
    - "exam topic: Manage Azure identities and governance"
    - Azure RBAC
    - Storage Blob Data Contributor
    - Managed identities
    - Management plane versus data plane
  question: |
    You have an Azure subscription that contains the resources shown in the following table.

    | Name       | Description                                   |
    |------------|-----------------------------------------------|
    | RG1        | Resource group                                |
    | RG2        | Resource group                                |
    | storage1   | Storage account in RG1                        |
    | Workspace1 | Azure Synapse Analytics workspace in RG2      |

    You need to assign Workspace1 a role to allow read, write, and delete operations
    for the data stored in the containers of storage1.

    Which role should you assign?
  choices:
    A: Storage Account Contributor
    B: Contributor
    C: Storage Blob Data Contributor
    D: Reader and Data Access
  answer: C
  user_answer: C
  user_result: correct
  learning_note: |
    Storage Blob Data Contributor grants read, write, and delete access to blob data.
    Assign the role to the workspace's managed identity at the target storage account
    or container scope. Management roles do not directly grant blob data permissions
    through Microsoft Entra authentication.
  explanation: |
    Correct answer: **C. Storage Blob Data Contributor.** The requirement concerns
    operations on the data inside blob containers. This role grants the required
    read, write, and delete permissions for Azure Storage containers and blobs.

    Assign the role to Workspace1's managed identity at the storage1 scope to cover
    its containers. The resources can be in different resource groups; the role
    assignment must cover the target storage resource. A role assigned only at RG2
    would not apply to storage1 in RG1.

    A. Storage Account Contributor manages storage accounts but does not directly
    grant blob data access through Microsoft Entra authentication.
    B. Contributor manages Azure resources but does not directly grant the required
    blob data permissions through Microsoft Entra authentication.
    D. Reader and Data Access can view resources and retrieve storage account keys,
    which can provide data access through Shared Key authentication. It is not the
    direct blob data role required for the workspace's managed identity.

    Remember: Identify the principal (workspace managed identity), role (Storage
    Blob Data Contributor), and scope (storage1). For operations on blob contents,
    look for a role with **Blob Data** in its name.

    [Microsoft Learn: Storage Blob Data Contributor](https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/storage#storage-blob-data-contributor)
    [Microsoft Learn: Assign an Azure role for access to blob data](https://learn.microsoft.com/en-us/azure/storage/blobs/assign-azure-role-data-access)
- id: '090'
  skill: Manage Azure identities and governance
  sub-skill: Manage Microsoft Entra users and groups
  tags:
    - "exam topic: Manage Azure identities and governance"
    - must-review
    - Group-based licensing
    - Microsoft Entra groups
    - Mail-enabled security groups
  question: |
    You have an Azure AD tenant that contains the groups shown in the following table.

    | Name   | Type                  | Security |
    |--------|-----------------------|----------|
    | Group1 | Security              | Enabled  |
    | Group2 | Mail-enabled security | Enabled  |
    | Group3 | Microsoft 365         | Enabled  |
    | Group4 | Microsoft 365         | Disabled |

    You purchase Azure Active Directory Premium P2 licenses.

    To which groups can you assign a license?
  choices:
    A: Group1 only
    B: Group1 and Group3 only
    C: Group3 and Group4 only
    D: Group1, Group2, and Group3 only
    E: Group1, Group2, Group3, and Group4
  answer: D
  user_answer: B
  user_result: incorrect
  learning_note: |
    Mail-enabled security groups also support group-based licensing. For this question,
    Group1, Group2, and Group3 qualify because securityEnabled is true; Group4 does not.
    securityEnabled and mailEnabled are separate properties. Mail-enabled security
    groups combine permission assignment with email distribution and are generally
    created through Exchange rather than the Entra group creation screen.
  explanation: |
    Correct answer: **D. Group1, Group2, and Group3 only.** Microsoft Graph documentation
    states that group-based licensing is available for security groups and Microsoft 365
    groups with securityEnabled set to true. Mail-enabled security groups are security
    groups too; having an email address does not disqualify them.

    Group1 qualifies as a security group. Group2 qualifies as a mail-enabled security
    group. Group3 qualifies as a Microsoft 365 group with security enabled. Group4 has
    security disabled and therefore does not meet the documented requirement.

    A excludes eligible Group2 and Group3. B excludes eligible Group2. C excludes
    eligible security groups and includes ineligible Group4. E also includes Group4.

    securityEnabled indicates whether the group is enabled as a security principal
    for permission assignment in supported services. mailEnabled indicates whether
    the group supports email distribution. A security group typically has the values
    true/false; a mail-enabled security group has true/true; a distribution group has
    false/true. Microsoft 365 groups are mail-enabled and can have either security value.
    Security disabled does not mean the group is insecure or its members are blocked;
    Microsoft 365 groups still support access to their associated collaboration resources.

    The Entra portal offers Security and Microsoft 365 group creation options.
    Mail-enabled security groups are generally created in the Exchange admin center,
    under Recipients > Groups > Add a group > Mail-enabled security.

    Remember: For this licensing question, check securityEnabled. Mail-enabled security
    groups still qualify. Azure AD is now called Microsoft Entra ID.

    [Microsoft Learn: Group-based licensing and group types](https://learn.microsoft.com/en-us/graph/api/resources/groups-overview#group-based-licensing)
    [Microsoft Support: Create a group in the Exchange admin center](https://support.microsoft.com/en-us/servicing/exchange/online/use-a-screen-reader-to-create-a-new-distribution-group-in-the-exchange-admin-center)
