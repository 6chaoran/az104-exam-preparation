    - Microsoft Entra ID
    - Custom domains
    - DNS verification
    - Drag and drop
  question: |
    DRAG DROP

    You have an Azure Active Directory (Azure AD) tenant that has the
    contoso.onmicrosoft.com domain name.

    You have a domain name of contoso.com registered at a third-party registrar.

    You need to ensure that you can create Azure AD users that have names containing a suffix of
    @contoso.com.

    Which three actions should you perform in sequence? Move the appropriate actions from the list
    to the answer area and arrange them in the correct order.
  choices:
    - Add a record to the public contoso.com DNS zone.
    - Add an Azure AD tenant.
    - Configure company branding.
    - Create an Azure DNS zone.
    - Add a custom name.
    - Verify the domain.
  answer:
    - Add a custom name.
    - Add a record to the public contoso.com DNS zone.
    - Verify the domain.
  user_answer:
    - Create an Azure DNS zone.
    - Add a record to the public contoso.com DNS zone.
    - Verify the domain.
  user_result: partially_correct
  user_reasoning: Selected creating an Azure DNS zone before adding the public DNS verification record and verifying the domain.
  learning_note: |
    First add the registered domain as a custom domain in Microsoft Entra ID so Microsoft provides
    the required verification value. Then publish that TXT or MX record through the domain's
    existing public DNS provider and verify the domain. A domain registered and hosted by a third
    party does not require an Azure DNS zone.
  explanation: |
    Correct sequence: **Add a custom name → add a record to the public contoso.com DNS zone →
    verify the domain.**

    Adding contoso.com as a custom domain in Microsoft Entra ID produces the TXT or MX verification
    value. Add that record at the public DNS provider that hosts contoso.com. After the record has
    propagated, select Verify in Microsoft Entra ID. The verified domain can then be used as the
    suffix in user principal names such as `user@contoso.com`.

    Creating an Azure DNS zone is unnecessary because contoso.com is already registered and its
    public DNS can remain with the third-party provider. Adding another tenant and configuring
    company branding do not prove ownership of the domain.

