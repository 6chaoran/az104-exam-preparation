  question: |
    You have an Azure subscription that contains a storage account named storageacct1234 and two
    users named User1 and User2.

    User1 has the following role assignments on storageacct1234:

    | Role                          | Scope                      |
    |-------------------------------|----------------------------|
    | Reader                        | Resource group (inherited) |
    | Storage Blob Data Contributor | Storage account            |

    Which two actions can User1 perform? Each correct answer presents a complete solution.
  choices:
    A: Assign roles to User2 for storageacct1234.
    B: Upload blob data to storageacct1234.
    C: Modify the firewall of storageacct1234.
    D: View blob data in storageacct1234.
    E: View file shares in storageacct1234.
  answer:
    - B
    - D
  user_answer:
    - B
    - D
  user_result: correct
  user_reasoning: Selected upload and view blob data based on the Storage Blob Data Contributor role.
  learning_note: |
    Storage Blob Data Contributor grants read, write, and delete access to blob containers and blob
    data. It does not grant Azure Files data access, storage-account firewall modification, or Azure
    RBAC role-assignment permissions. Reader supplies control-plane visibility but does not grant
    access to the underlying storage data.
  explanation: |
    Correct answers: **B and D.** Storage Blob Data Contributor includes the data actions required
    to read and write blobs, so User1 can upload and view blob data in storageacct1234.

    User1 cannot assign roles because neither assigned role includes
    `Microsoft.Authorization/roleAssignments/write`. Reader cannot modify the storage-account
    firewall, and the blob-specific data role does not grant access to Azure Files data.

    [Microsoft Learn: Storage Blob Data Contributor](https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/storage#storage-blob-data-contributor)
