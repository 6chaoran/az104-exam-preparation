- id: '021'
  skill: Manage Azure identities and governance
  sub-skill: Manage Azure subscriptions and governance
  tags:
    - "exam topic: Manage Azure identities and governance"
    - Manage costs by using tags
    - Azure Cost Management
  question: |
    DRAG DROP

    You have an Azure subscription that is used by four departments in your company. The subscription
    contains 10 resource groups. Each department uses resources in several resource groups.

    You need to send a report to the finance department. The report must detail the costs for each
    department.

    Which three actions should you perform in sequence? Move the appropriate actions from the list
    to the answer area and arrange them in the correct order.
  choices:
    - Assign a tag to each resource group.
    - Assign a tag to each resource.
    - Download the usage report.
    - From the Cost analysis blade, filter the view by tag.
    - Open the Resource costs blade of each resource group.
  answer:
    - Assign a tag to each resource.
    - From the Cost analysis blade, filter the view by tag.
    - Download the usage report.
  user_answer:
    - Assign a tag to each resource.
    - From the Cost analysis blade, filter the view by tag.
    - Download the usage report.
  user_result: correct
  user_reasoning: Selected resource-level department tags, then a tag-filtered Cost analysis view, then the report download.
  learning_note: Department costs span multiple resource groups, so identify the department on each resource. Resource group tags are not automatically inherited by resources. Cost analysis can filter or group by tag before downloading the view; tags do not apply retroactively to historical costs.
  explanation: |
    Correct sequence: **Tag each resource → filter Cost analysis by tag → download the report.**

    Apply a department tag to each resource so costs can be associated with the department even
    when resources from different departments share a resource group. In Cost analysis, use the
    department tag to view the relevant costs, then download the resulting view for finance.

    Tagging only the resource groups is insufficient because resource group tags do not automatically
    pass to their resources. Opening the costs blade of every resource group would organize costs
    by resource group rather than by department.

    Resource tags appear in cost data only for usage after the tags are applied, and some charges
    may not support tags. For a current report, check any untagged costs separately.

    [Microsoft Learn: Use tags to organize Azure resources](https://learn.microsoft.com/en-us/azure/azure-resource-manager/resource-group-using-tags)
    [Microsoft Learn: Customize views in Cost analysis](https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/customize-cost-analysis-views)
- id: '022'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  tags:
    - "exam topic: Monitor and maintain Azure resources"
    - Monitor resources by using Azure Monitor
    - Log Analytics
    - Kusto Query Language
  question: |
    You have an Azure subscription named Subscription1 that contains an Azure Log Analytics
    workspace named Workspace1.

    You need to view the error events from a table named Event.

    Which query should you run in Workspace1?
  choices:
    A: 'Get-Event Event | where {$_.EventType == "error"}'
    B: 'search in (Event) "error"'
    C: 'select * from Event where EventType == "error"'
    D: 'search in (Event) * | where EventType -eq "error"'
  answer: B
  user_answer: A
  user_result: incorrect
  user_reasoning: Selected the PowerShell-style Get-Event query to find errors in the Event table.
  learning_note: Log Analytics queries use Kusto Query Language, not PowerShell or SQL. The search operator can search for a term in the Event table. For an exact severity filter in the current Event schema, use Event | where EventLevelName == "Error".
  explanation: |
    Correct answer: **B. search in (Event) "error".**

    Workspace1 uses Kusto Query Language (KQL). The `search in (Event)` operator limits a text
    search to the Event table, and `"error"` searches for that term across its columns.

    A uses PowerShell syntax, C uses SQL syntax, and D uses the PowerShell `-eq` comparison operator
    rather than a KQL comparison operator. The current Event table also does not list `EventType`
    as a column.

    The exam option B is a broad text search. To return only records whose severity is Error,
    a more precise current KQL query is `Event | where EventLevelName == "Error"`.

    [Microsoft Learn: KQL search operator](https://learn.microsoft.com/en-us/kusto/query/search-operator?view=microsoft-fabric)
    [Microsoft Learn: Event table](https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/event)
- id: '023'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  tags:
    - "exam topic: Deploy and manage Azure compute resources"
    - Availability zones
    - Virtual networks
    - ARM templates
  question: |
    HOTSPOT

    You have an Azure subscription that contains a virtual network named VNET1 in the East US 2
    region. A network interface named VM1-NI is connected to VNET1.

    You successfully deploy an Azure Resource Manager template that creates two virtual machines:
    VM1 has `zones: "1"`, `location: "EastUS2"`, and uses network interface VM1-NI. VM2 has
    `zones: "2"`, `location: "EastUS2"`, and uses network interface VM2-NI. Both VM resources
    depend on their respective network interfaces.

    For each statement, select Yes if the statement is true. Otherwise, select No.
    NOTE: Each correct selection is worth one point.
  choices:
    VM1 and VM2 can connect to VNET1:
      - Yes
      - No
    If an Azure datacenter becomes unavailable, VM1 or VM2 will be available:
      - Yes
      - No
    If the East US 2 region becomes unavailable, VM1 or VM2 will be available:
      - Yes
      - No
  answer:
    VM1 and VM2 can connect to VNET1: Yes
    If an Azure datacenter becomes unavailable, VM1 or VM2 will be available: Yes
    If the East US 2 region becomes unavailable, VM1 or VM2 will be available: No
  user_answer:
    VM1 and VM2 can connect to VNET1: Yes
    If an Azure datacenter becomes unavailable, VM1 or VM2 will be available: Yes
    If the East US 2 region becomes unavailable, VM1 or VM2 will be available: No
  user_result: correct
  user_reasoning: Believed only VM1 could connect to VNET1; correctly reasoned that separate zones protect against a datacenter outage but both VMs share one region.
  learning_note: A VNet spans availability zones within its own region, so VMs in zones 1 and 2 can use VNET1. A VNet cannot be set up across regions; each VNet belongs to one region. To connect VNets in different regions, use global VNet peering. The first Yes selection was correct despite the mistaken supporting reason.
  explanation: |
    Correct selections: **Yes, Yes, No.**

    VNET1 is in East US 2 and spans the availability zones in that region. VM1 in zone 1 and VM2
    in zone 2 can both connect to it; a VNet is not confined to one zone. The template explicitly
    shows VM1-NI attached to VNET1, while the subnet for VM2-NI is not shown. The first selection
    concerns whether both VMs can connect to VNET1, not proof that VM2-NI is already connected.

    Because the VMs are in different zones, a failure of one datacenter or zone leaves the VM in
    the other zone available. Both VMs are in East US 2, so a failure of that entire region affects
    both.

    **Regional boundary:** A VNet cannot span regions. Create a separate VNet in another region
    and connect the two with global VNet peering when cross-region connectivity is needed.

    [Microsoft Learn: Reliability in Azure Virtual Network](https://learn.microsoft.com/en-us/azure/reliability/reliability-virtual-network)
    [Microsoft Learn: Azure Virtual Network FAQ](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-faq)
- id: '024'
  skill: Manage Azure identities and governance
  sub-skill: Manage Azure subscriptions and governance
  tags:
    - "exam topic: Manage Azure identities and governance"
    - Manage resource groups
    - Azure Policy
    - App Service
  question: |
    You have an Azure subscription named Subscription1. Subscription1 contains the resource groups
    in the following table.

    | Name | Azure region | Policy |
    | RG1 | West Europe | Policy1 |
    | RG2 | North Europe | Policy2 |
    | RG3 | France Central | Policy3 |

    RG1 has a web app named WebApp1. WebApp1 is located in West Europe.

    You move WebApp1 to RG2.

    What is the effect of the move?
  choices:
    A: The App Service plan for WebApp1 remains in West Europe. Policy2 applies to WebApp1.
    B: The App Service plan for WebApp1 moves to North Europe. Policy2 applies to WebApp1.
    C: The App Service plan for WebApp1 remains in West Europe. Policy1 applies to WebApp1.
    D: The App Service plan for WebApp1 moves to North Europe. Policy1 applies to WebApp1.
  answer: A
  user_answer: A
  user_result: correct
  user_reasoning: Selected A but was unsure why the plan location and policy would differ after the move.
  learning_note: Moving a resource to another resource group changes its management scope, not its physical region. The App Service plan stays in West Europe; the destination resource group's Policy2 applies to WebApp1.
  explanation: |
    Correct answer: **A.** Moving WebApp1 from RG1 to RG2 changes its resource group association
    but does not move the app or its App Service plan to North Europe. The plan remains in West
    Europe. WebApp1 is now within RG2's policy scope, so Policy2 applies.

    B and D incorrectly treat the destination resource group's region as the app's new region.
    C and D incorrectly keep Policy1, which was assigned to the source resource group.

    Memory aid: **Resource group move changes scope, not region.**

    [Microsoft Learn: Move App Service resources](https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/move-limitations/app-service-move-limitations)
    [Microsoft Learn: Azure Policy applicability](https://learn.microsoft.com/en-us/azure/governance/policy/concepts/policy-applicability)
- id: '025'
  skill: Manage Azure identities and governance
  sub-skill: Manage access to Azure resources
  tags:
    - "exam topic: Manage Azure identities and governance"
    - Manage access to Azure resources
    - Azure RBAC custom roles
  question: |
    HOTSPOT

    You have an Azure subscription named Subscription1 that has a subscription ID of
    c276fc76-9cd4-44c9-99a7-4fd71546436e.

    You need to create a custom RBAC role named CR1 that meets the following requirements:

    - Can be assigned only to the resource groups in Subscription1.
    - Prevents the management of the access permissions for the resource groups.
    - Allows the viewing, creating, modifying, and deleting of resources within the resource groups.

    What should you specify in the assignable scopes and permission elements of the definition
    of CR1? Select the appropriate options in the answer area. Each correct selection is worth
    one point.

    The definition already has `actions: ["*"]` and empty `dataActions` and `notDataActions`.
  choices:
    assignableScopes:
      - "/"
      - "/subscriptions/c276fc76-9cd4-44c9-99a7-4fd71546436e"
      - "/subscriptions/c276fc76-9cd4-44c9-99a7-4fd71546436e/resourceGroups"
    notActions:
      - "Microsoft.Authorization/*"
      - "Microsoft.Resources/*"
      - "Microsoft.Security/*"
  answer:
    assignableScopes: "/subscriptions/c276fc76-9cd4-44c9-99a7-4fd71546436e"
    notActions: "Microsoft.Authorization/*"
  user_answer:
    assignableScopes: "/subscriptions/c276fc76-9cd4-44c9-99a7-4fd71546436e"
    notActions: "Microsoft.Resources/*"
  user_result: partially_correct
  user_reasoning: Chose the Subscription1 path for assignableScopes and Microsoft.Resources for the excluded actions; did not explain the second selection.
  learning_note: |
    `AssignableScopes` defines where a custom role is available, while an individual role
    assignment sets the actual access scope. With `actions: ["*"]`, use `notActions` to subtract
    access-management operations. Of the offered choices, Microsoft.Authorization/* matches that
    purpose; Microsoft.Resources/* would remove resource-management actions.
  explanation: |
    Expected exam selections: **Subscription1's subscription path** for `assignableScopes` and
    **`Microsoft.Authorization/*`** for `notActions`.

    The subscription path makes CR1 available within Subscription1. The wildcard in `actions`
    grants resource-management actions; excluding `Microsoft.Authorization/*` subtracts the
    authorization actions that would manage access. Excluding `Microsoft.Resources/*` instead
    would remove resource-management operations needed by the role. `Microsoft.Security/*` is
    unrelated to managing RBAC access permissions.

    The question's "only to the resource groups" wording is imprecise. A subscription value in
    `AssignableScopes` also makes the role available for assignment at the subscription and
    individual resource scopes. To limit granted access to a particular resource group, create
    the actual role assignment at that resource group's scope. `NotActions` is not a deny rule:
    another role could still grant the excluded permissions.

    [Microsoft Learn: Understand Azure role definitions](https://learn.microsoft.com/en-us/azure/role-based-access-control/role-definitions)
    [Microsoft Learn: Azure custom roles](https://learn.microsoft.com/en-us/azure/role-based-access-control/custom-roles)
- id: '026'
  skill: Implement and manage virtual networking
  sub-skill: Configure name resolution and load balancing
  tags:
    - "exam topic: Implement and manage virtual networking"
    - Load balancing
    - VPN connectivity
    - Traffic Manager
  question: |
    You have an Azure subscription.

    Users access the resources in the subscription from either home or customer sites. From home,
    users must establish a point-to-site VPN to access the Azure resources. Users at customer sites
    access the Azure resources by using site-to-site VPNs.

    You have a line-of-business app named App1 that runs on several Azure virtual machines. The
    virtual machines run Windows Server 2016.

    You need to ensure that the connections to App1 are spread across all the virtual machines.

    What are two possible Azure services that you can use? Each correct answer presents a complete
    solution. Each correct selection is worth one point.
  choices:
    A: an internal load balancer
    B: a public load balancer
    C: an Azure Content Delivery Network (CDN)
    D: Traffic Manager
    E: an Azure Application Gateway
  answer: AE
  user_answer: AE
  user_result: correct
  user_reasoning: Selected an internal load balancer and Azure Application Gateway for users reaching App1 over VPN; later asked how internal and public load balancers differ from Traffic Manager.
  learning_note: An internal Load Balancer uses a private frontend IP and spreads TCP/UDP connections among backends. Application Gateway can use a private frontend to distribute HTTP/HTTPS requests. Traffic Manager returns DNS answers for reachable endpoints and does not proxy connections or route to private endpoints.
  explanation: |
    Correct answers: **A and E.** The users reach Azure through point-to-site or site-to-site VPNs,
    so an internal Load Balancer's private frontend can distribute their connections across the VMs.
    An Application Gateway with a private frontend can distribute requests to the VMs when App1
    uses HTTP or HTTPS.

    A public Load Balancer exposes a public frontend rather than using the private VPN path described
    in the question. CDN caches and serves content; it does not balance these private VM connections.
    Traffic Manager makes DNS routing decisions and cannot route to private endpoints such as an
    internal Load Balancer. It is not itself in the application traffic path.

    The Application Gateway choice assumes App1 is a web application. The question does not state
    App1's protocol, so that detail is implicit in the expected exam answer.

    [Microsoft Learn: Internal Load Balancer](https://learn.microsoft.com/en-us/azure/load-balancer/quickstart-load-balancer-standard-internal-portal)
    [Microsoft Learn: Application Gateway frontend IP addresses](https://learn.microsoft.com/en-us/azure/application-gateway/configuration-frontend-ip)
    [Microsoft Learn: Traffic Manager FAQ](https://learn.microsoft.com/en-us/azure/traffic-manager/traffic-manager-faqs)
- id: '027'
  skill: Manage Azure identities and governance
  sub-skill: Manage Azure subscriptions and governance
  tags:
    - "exam topic: Monitor and maintain Azure resources"
    - Azure Advisor
    - Cost optimization
    - Virtual machines
  question: |
    You have an Azure subscription.

    You have 100 Azure virtual machines.

    You need to quickly identify underutilized virtual machines that can have their service tier
    changed to a less expensive offering.

    Which blade should you use?
  choices:
    A: Monitor
    B: Advisor
    C: Metrics
    D: Customer insights
  answer: B
  user_answer: C
  user_result: incorrect
  user_reasoning: Selected Metrics; no further reasoning was provided.
  learning_note: Metrics shows measurements such as CPU usage for analysis. Azure Advisor uses utilization data to identify underutilized VMs and recommend a less expensive size, which matches the request to identify candidates quickly.
  explanation: |
    Correct answer: **B. Advisor.** Azure Advisor provides cost recommendations for virtual
    machines, including resizing or shutting down underutilized instances. It assesses utilization
    and surfaces candidates and recommended actions across the subscription.

    Metrics can show VM performance data, but it does not itself provide the same ready-made
    cost-saving recommendations. Monitor is a broader monitoring service, and Customer insights
    does not serve this VM rightsizing purpose.

    Memory aid: **Measurements → Metrics; cost-saving recommendations → Advisor.**

