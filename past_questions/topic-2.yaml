  explanation: |
    Correct answer: **A. Yes.** Logic App Contributor provides the permissions required to create
    and manage Azure Logic Apps. Assigning it to the Developers group at the Dev resource-group
    scope limits the role's effect to that resource group.

    The role does not let the group assign Azure roles or change access to the Logic Apps. It is
    more targeted than the general Contributor role and provides more management capability than
    Logic App Operator, which can read, enable, disable, and resubmit existing Logic Apps but cannot
    create or modify them.

    [Microsoft Learn: Azure built-in roles for Integration](https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/integration)
- id: '052'
  skill: Manage Azure identities and governance
  sub-skill: Manage access to Azure resources
  question_type: hotspot
  tags:
