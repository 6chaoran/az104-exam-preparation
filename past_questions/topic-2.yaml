    - Owner
    - Role assignments
    - Least scope
  question: |
    You have an Azure subscription named Subscription1 that contains a virtual network named VNet1.
    VNet1 is in a resource group named RG1.

    Subscription1 has a user named User1. User1 has the following roles:

    - Reader
    - Security Admin
    - Security Reader

    You need to ensure that User1 can assign the Reader role for VNet1 to other users.

    What should you do?
  choices:
    A: Remove User1 from the Security Reader role for Subscription1 and assign User1 the Contributor role for RG1.
    B: Assign User1 the Owner role for VNet1.
    C: Assign User1 the Contributor role for VNet1.
    D: Assign User1 the Network Contributor role for VNet1.
  answer: B
  user_answer: B
  user_result: correct
  user_reasoning: Selected Owner at the VNet1 resource scope; no further reasoning was provided.
  learning_note: |
    Assigning an Azure role requires `Microsoft.Authorization/roleAssignments/write`. Owner includes
    this permission; Contributor and Network Contributor do not. Assign the role at VNet1 scope to
    limit User1's authority to the required resource.
  explanation: |
    Correct answer: **B. Assign User1 the Owner role for VNet1.** Owner includes permission to
    create Azure role assignments. At VNet1 scope, User1 can assign Reader for that virtual network
    without receiving Owner permissions over RG1 or Subscription1.

    - **A and C:** Contributor can manage resources but cannot assign Azure RBAC roles.
    - **D:** Network Contributor can manage network resources but cannot assign Azure RBAC roles.
    - **Existing roles:** Reader and Security Reader are read-only. Security Admin manages security
      configuration but does not grant general Azure RBAC role-assignment permissions.

    In a current environment, Role Based Access Control Administrator or User Access Administrator
    at VNet1 scope would provide more focused access-management permissions, but neither role is an
    answer choice.

    [Microsoft Learn: Steps to assign an Azure role](https://learn.microsoft.com/en-us/azure/role-based-access-control/role-assignments-steps)
    [Microsoft Learn: Azure built-in privileged roles](https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/privileged)
- id: '054'
  skill: Manage Azure identities and governance
  sub-skill: Manage access to Azure resources
  question_type: hotspot
  tags:
