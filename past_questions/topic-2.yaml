  question: |
    Note: This question is part of a series of questions that present the same scenario.
    Each question in the series contains a unique solution that might meet the stated goals.
    Some question sets might have more than one correct solution, while others might not
    have a correct solution.

    After you answer a question in this section, you will NOT be able to return to it.
    As a result, these questions will not appear in the review screen.

    You have an Azure Active Directory (Azure AD) tenant named contoso.com.

    You have a CSV file that contains the names and email addresses of 500 external users.

    You need to create a guest user account in contoso.com for each of the 500 external users.

    Solution: You create a PowerShell script that runs the New-MgInvitation cmdlet for each external user.

    Does this meet the goal?
  choices:
    A: 'Yes'
    B: 'No'
  answer: A
  user_answer: A
  user_result: correct
  learning_note: |
    New-MgInvitation creates an external B2B guest object and an invitation redemption workflow.
    Importing a CSV and calling it for each external user supports bulk guest onboarding.
    New-MgUser does not perform this invitation workflow.
  explanation: |
    Correct answer: **A. Yes.** New-MgInvitation is the Microsoft Graph PowerShell cmdlet
    for inviting external users through Microsoft Entra B2B collaboration. A script can
    import the CSV and run the cmdlet for each of the 500 users, supplying each user's
    display name and email address plus an invitation redirect URL.

    The invitation creates the guest object in contoso.com; the external user subsequently
    redeems the invitation to access resources with their existing identity. UserType
    defaults to Guest. Sending an invitation email is controlled by SendInvitationMessage
    and is not required merely to create the guest object.

    Assume the script authenticates to contoso.com with the required invitation permissions
    and supplies valid cmdlet parameters. The number of users does not require a different
    cmdlet: the script repeats the invitation operation for each CSV entry.

    Remember: External B2B guests — New-MgInvitation; tenant-created accounts — New-MgUser.
