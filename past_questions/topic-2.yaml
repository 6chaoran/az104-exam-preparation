    | User1 | Member | Azure AD                        |
    | User2 | Member | Windows Server Active Directory |
    | User3 | Guest  | Microsoft account               |

    You need to modify the JobTitle and UsageLocation attributes for the users.

    For which users can you modify the attributes from Azure AD? Select the appropriate option
    for each attribute. Each correct selection is worth one point.
  choices:
    JobTitle:
      - User1 only
      - User1 and User2 only
      - User1 and User3 only
      - User1, User2, and User3
    UsageLocation:
      - User1 only
      - User1 and User2 only
      - User1 and User3 only
      - User1, User2, and User3
  answer:
    JobTitle: User1 and User3 only
    UsageLocation: User1, User2, and User3
  user_answer:
    JobTitle: User1, User2, and User3
    UsageLocation: User1 and User3 only
  user_result: incorrect
  user_reasoning: Selected all three users for JobTitle and excluded the synchronized User2 from UsageLocation; no further reasoning was provided.
  learning_note: |
    For a user synchronized from Windows Server Active Directory, identity, contact, and job
    information such as JobTitle is mastered on-premises and must be changed there. UsageLocation
    is a Microsoft Entra ID attribute and can be changed in the cloud for cloud users, guests, and
    synchronized users.
  explanation: |
    Correct selections: **JobTitle: User1 and User3 only; UsageLocation: User1, User2, and User3.**

