    role at root scope (`/`), allowing User1 to assign Azure roles at the tenant root management
    group. Subscription Owner applies below the root management group, so A and B are insufficient.
    Creating another management group in D does not grant rights on the tenant root.

    The question omits a final permission step: User Access Administrator can assign roles but
    does not itself grant `Microsoft.Authorization/policyAssignments/write`. To create a policy
    assignment at the tenant root, User1 must also have an Azure role with that permission at
    the root management group, such as Resource Policy Contributor. C is the enabling step among
    the offered choices.

