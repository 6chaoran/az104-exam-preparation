- id: '068'
  skill: Implement and manage virtual networking
  sub-skill: Configure secure access to virtual networks
  tags:
    - "exam topic: Implement and manage virtual networking"
    - Network security groups
    - Service tags
    - Azure Key Vault
    - Outbound rules
    - Least privilege
  question: |
    You have an Azure subscription that contains 10 virtual machines, a key vault named Vault1,
    and a network security group (NSG) named NSG1. All the resources are deployed to the East US
    Azure region.

    The virtual machines are protected by using NSG1. NSG1 is configured to block all outbound
    traffic to the internet.

    You need to ensure that the virtual machines can access Vault1. The solution must use the
    principle of least privilege and minimize administrative effort.

    What should you configure as the destination of the outbound security rule for NSG1?
  choices:
    A: An application security group.
    B: A service tag.
    C: An IP address range.
  answer: B
  user_answer: A
  user_result: incorrect
  user_reasoning: Selected an application security group; no further reasoning was provided.
  learning_note: |
    Use the `AzureKeyVault` service tag as the destination of an outbound NSG rule for Azure Key
    Vault. Microsoft maintains the IP prefixes represented by the tag, so the rule remains current
    as service addresses change. Application security groups represent VM network interfaces and
    do not represent Azure PaaS services.
  explanation: |
    Correct answer: **B. A service tag.** Configure the destination as the `AzureKeyVault` service
    tag. Because AzureKeyVault supports regional scope, use the East US regional form when it is
    available and appropriate to narrow the allowed destination ranges.

    An application security group groups Azure VM network interfaces and cannot represent Vault1.
    Manually specifying Key Vault IP address ranges creates unnecessary maintenance because those
    ranges can change, whereas Microsoft updates the service tag automatically.

    Key Vault authentication can also require outbound access to Microsoft Entra ID, represented
    by the `AzureActiveDirectory` service tag.

    [Microsoft Learn: Azure service tags](https://learn.microsoft.com/en-us/azure/virtual-network/service-tags-overview)
- id: '069'
  skill: Manage Azure identities and governance
  sub-skill: Manage Microsoft Entra users and groups
  tags:
    - "exam topic: Manage Azure identities and governance"
    - Microsoft Entra ID
    - Group-based licensing
    - Nested groups
    - Premium P2
  question: |
    You have an Azure AD tenant named adatum.com that contains the following groups:

    | Name   | Member of |
    |--------|-----------|
    | Group1 | None      |
    | Group2 | Group1    |
    | Group3 | Group2    |

    The tenant contains the following users:

    | Name  | Member of |
    |-------|-----------|
    | User1 | Group1    |
    | User2 | Group2    |
    | User3 | Group3    |
    | User4 | None      |

    You assign the Azure Active Directory Premium Plan 2 license to Group1 and User4.

    Which users are assigned the Azure Active Directory Premium Plan 2 license?
  choices:
    A: User4 only.
    B: User1 and User4 only.
    C: User1, User2, and User4 only.
    D: User1, User2, User3, and User4.
  answer: B
  user_answer: B
  user_result: correct
  user_reasoning: Selected User1 as the direct member of Group1 and User4 as the directly licensed user.
  learning_note: |
    Microsoft Entra group-based licensing does not support nested groups. A license assigned to a
    group applies to its direct user members, but it does not flow through member groups to their
    users. A user can also receive the same license through a direct assignment.
  explanation: |
    Correct answer: **B. User1 and User4 only.** User1 receives the license as a direct user member
    of Group1. User4 receives it through the direct license assignment.

    Group2 is nested in Group1, and Group3 is nested inside Group2. Because group-based licensing
    does not process nested groups, User2 and User3 do not inherit the license from Group1.

    [Microsoft Learn: Group-based licensing](https://learn.microsoft.com/en-us/entra/fundamentals/concept-group-based-licensing)
- id: '070'
  question_type: hotspot
  tags:
    - "exam topic: Manage Azure identities and governance"
    - Microsoft Entra entitlement management
    - Access packages
    - Connected organizations
    - External user lifecycle
    - Guest users
  question: |
    You have an Azure AD tenant named contoso.com.

    You have two external partner organizations named fabrikam.com and litwareinc.com. Fabrikam.com
    is configured as a connected organization.

    You create an access package named package1 with the following configuration:

    - Resource role: Group1, Member
    - Users who can request access: All configured connected organizations
    - Approval required: No
    - Access-package assignments expire after 365 days
    - Access reviews are not required

    External-user lifecycle settings are configured to block an external user from signing in when
    the user loses the last access-package assignment and to remove the external user 30 days later.

    For each statement, select Yes if it is true. Otherwise, select No.
  choices:
    Litwareinc.com users can be assigned to package1:
      - Yes
      - No
    After 365 days, fabrikam.com users will be removed from Group1:
      - Yes
      - No
    After 395 days, fabrikam.com users will be removed from the contoso.com tenant:
      - Yes
      - No
  answer:
    Litwareinc.com users can be assigned to package1: No
    After 365 days, fabrikam.com users will be removed from Group1: Yes
    After 395 days, fabrikam.com users will be removed from the contoso.com tenant: Yes
  user_answer:
    Litwareinc.com users can be assigned to package1: Yes
    After 365 days, fabrikam.com users will be removed from Group1: No
    After 395 days, fabrikam.com users will be removed from the contoso.com tenant: Yes
  user_result: partially_correct
  user_reasoning: Selected Yes, No, Yes; no further reasoning was provided.
  learning_note: |
    `All configured connected organizations` includes only organizations already configured in
    entitlement management. When an access-package assignment expires, entitlement management
    removes the package-provided group membership. If this was an external user's last assignment,
    the configured external-user lifecycle process then blocks sign-in and removes the governed
    guest after the configured delay.
  explanation: |
    Correct selections: **No; Yes; Yes.** Litwareinc.com is not a configured connected organization,
    so its users are outside the package policy's allowed scope. Fabrikam.com is configured, so its
    users can receive the package.

    On day 365, the package assignment expires and the user is removed from Group1, unless another
    access-package assignment independently supplies the same membership. After the user loses the
    last access-package assignment, sign-in is blocked and the lifecycle timer begins. Thirty days
    later, on day 395, the governed external guest account is removed from the tenant.

    The deletion behavior applies to external guests brought under entitlement-management lifecycle
    governance and assumes the user has no other access-package assignment.

    [Microsoft Learn: Create an access package](https://learn.microsoft.com/en-us/entra/id-governance/entitlement-management-access-package-create)
    [Microsoft Learn: Access-package resource roles](https://learn.microsoft.com/en-us/entra/id-governance/entitlement-management-access-package-resources)
    [Microsoft Learn: Govern external users](https://learn.microsoft.com/en-us/entra/id-governance/entitlement-management-external-users)
- id: '071'
  skill: Manage Azure identities and governance
  sub-skill: Manage access to Azure resources
  tags:
    - "exam topic: Manage Azure identities and governance"
    - Azure RBAC
    - Owner
    - Role assignments
  question: |
    You have an Azure subscription named Subscription1 that contains a virtual network named VNet1.
    VNet1 is in a resource group named RG1.

    Subscription1 has a user named User1. User1 has the following roles:

    - Reader
    - Security Admin
    - Security Reader

    You need to ensure that User1 can assign the Reader role for VNet1 to other users.

    What should you do?
  choices:
    A: Assign User1 the Network Contributor role for VNet1.
    B: Remove User1 from the Security Reader role for Subscription1. Assign User1 the Contributor role for RG1.
    C: Assign User1 the Owner role for VNet1.
    D: Assign User1 the Network Contributor role for RG1.
  answer: C
  user_answer: C
  user_result: correct
  learning_note: |
    Creating an Azure RBAC role assignment requires `Microsoft.Authorization/roleAssignments/write`.
    Owner includes this permission; Contributor and Network Contributor do not. The VNet1 scope
    limits the role-assignment authority to the virtual network.
  explanation: |
    Correct answer: **C. Assign User1 the Owner role for VNet1.** Owner allows User1 to create
    Azure RBAC role assignments at VNet1 scope, including assigning Reader to other users.

    - **A and D:** Network Contributor can manage network resources but cannot assign Azure roles.
    - **B:** Contributor cannot assign Azure roles. Removing Security Reader does not add that permission.
    - **Existing roles:** Reader and Security Reader are read-only. Security Admin does not grant
      general Azure RBAC role-assignment permission.

    [Microsoft Learn: Steps to assign an Azure role](https://learn.microsoft.com/en-us/azure/role-based-access-control/role-assignments-steps)
- id: '072'
  skill: Manage Azure identities and governance
  sub-skill: Manage access to Azure resources
  question_type: hotspot
  tags:
    - "exam topic: Manage Azure identities and governance"
    - Microsoft Entra groups
    - Role-assignable groups
    - Azure RBAC
    - Group nesting
  question: |
    You have an Azure subscription that contains the following users and group memberships:

    | User | Member of |
    | --- | --- |
    | User1 | Group1 |
    | User2 | Group2 |
    | User3 | Group3 |

    The groups are configured as follows:

    | Group | Type | Microsoft Entra roles can be assigned to the group |
    | --- | --- | --- |
    | Group1 | Security | Yes |
    | Group2 | Security | Yes |
    | Group3 | Microsoft 365 | Yes |

    In RG1's Access control (IAM), Group1 has the Owner role at RG1 scope. Another user
    has the Owner role inherited from the subscription.

    For each statement, select Yes if it is true. Otherwise, select No.
  choices:
    You can assign User2 the Owner role for RG1 by adding Group2 as a member of Group1:
      - Yes
      - No
    You can assign User3 the Owner role for RG1 by adding Group3 as a member of Group1:
      - Yes
      - No
    You can assign User3 the Owner role for RG1 by assigning the Owner role to Group3 for RG1:
      - Yes
      - No
  answer:
    You can assign User2 the Owner role for RG1 by adding Group2 as a member of Group1: No
    You can assign User3 the Owner role for RG1 by adding Group3 as a member of Group1: No
    You can assign User3 the Owner role for RG1 by assigning the Owner role to Group3 for RG1: Yes
  user_answer:
    You can assign User2 the Owner role for RG1 by adding Group2 as a member of Group1: Yes
    You can assign User3 the Owner role for RG1 by adding Group3 as a member of Group1: Yes
    You can assign User3 the Owner role for RG1 by assigning the Owner role to Group3 for RG1: No
  user_result: incorrect
  user_reasoning: Selected Yes, Yes, No; no further reasoning was provided.
  learning_note: |
    Role-assignable Microsoft Entra groups cannot contain other groups, so Group2 and Group3
    cannot be added to Group1. A direct Azure RBAC role assignment to Group3 at RG1 scope
    grants the role to its direct member User3. The role-assignable setting concerns Microsoft
    Entra directory roles, differs from Azure RBAC, and requires Entra ID P1 or P2 plus a
    Privileged Role Administrator to create.
  explanation: |
    Correct selections: **No; No; Yes.** Group1 has the role-assignable setting enabled.
    Microsoft Entra does not permit another group to be added as a member of a role-assignable
    group. Thus neither Group2 nor Group3 can be nested in Group1 to give their users Owner.

    Assigning the Azure RBAC Owner role directly to Group3 at RG1 scope gives its direct member
    User3 that role. The setting saying Microsoft Entra roles can be assigned to the group
    relates to directory roles; it does not itself assign the Azure RBAC Owner role.

    [Microsoft Learn: Role-assignable group restrictions](https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/groups-concept)
    [Microsoft Learn: Azure role assignments](https://learn.microsoft.com/en-us/azure/role-based-access-control/role-assignments)
- id: '073'
  skill: Manage Azure identities and governance
  sub-skill: Manage access to Azure resources
  tags:
    - "exam topic: Manage Azure identities and governance"
    - Azure RBAC
    - Owner
    - Role assignments
    - Scope
  question: |
    You have an Azure subscription named Subscription1 that contains a virtual network named VNet1.
    VNet1 is in a resource group named RG1.

    Subscription1 has a user named User1. User1 has the following roles:

    - Reader
    - Security Admin
    - Security Reader

    You need to ensure that User1 can assign the Reader role for VNet1 to other users.

    What should you do?
  choices:
    A: Remove User1 from the Security Reader role for Subscription1. Assign User1 the Contributor role for RG1.
    B: Assign User1 the Owner role for VNet1.
    C: Remove User1 from the Security Reader and Reader roles for Subscription1. Assign User1 the Contributor role for Subscription1.
    D: Assign User1 the Contributor role for VNet1.
  answer: B
  user_answer: B
  user_result: correct
  learning_note: |
    Azure RBAC role assignment requires `Microsoft.Authorization/roleAssignments/write`.
    Owner grants it; Contributor does not, regardless of assignment scope. Owner at VNet1
    scope gives User1 the required capability for that virtual network.
  explanation: |
    Correct answer: **B. Assign User1 the Owner role for VNet1.** Owner permits User1 to
    create Azure RBAC role assignments at VNet1 scope, including Reader assignments.

    - **A, C, and D:** Contributor cannot assign Azure RBAC roles, even at resource-group
      or subscription scope. Removing Reader or Security Reader does not change that.
    - **Existing roles:** Reader and Security Reader are read-only. Security Admin does not
      grant general Azure RBAC role-assignment permission.

    [Microsoft Learn: Steps to assign an Azure role](https://learn.microsoft.com/en-us/azure/role-based-access-control/role-assignments-steps)
- id: '074'
  skill: Implement and manage virtual networking
  sub-skill: Configure secure access to virtual networks
  tags:
    - "exam topic: Implement and manage virtual networking"
    - Azure Private Link
    - Private endpoints
    - Azure Storage
    - Forced tunneling
  question: |
    Your on-premises network contains a VPN gateway.

    You have an Azure subscription that contains the resources shown in the following table.

    | Name | Type | Description |
    | --- | --- | --- |
    | vgw1 | Virtual network gateway | Gateway for Site-to-Site VPN to the on-premises network |
    | storage1 | Storage account | Standard performance tier |
    | Vnet1 | Virtual network | Enabled forced tunneling |
    | VM1 | Virtual machine | Connected to Vnet1 |

    You need to ensure that all the traffic from VM1 to storage1 travels across the Microsoft backbone network.

    What should you configure?
  choices:
    A: Azure Application Gateway
    B: private endpoints
    C: a network security group (NSG)
    D: Azure Virtual WAN
  answer: B
  user_answer: C
  user_result: incorrect
  learning_note: |
    An NSG filters traffic using allow/deny rules; it does not select the route or keep traffic
    on the Microsoft backbone. A private endpoint gives a storage service a private IP in the
    virtual network and connects to it through Azure Private Link. Configure DNS so VM1 resolves
    the storage service hostname to the private endpoint IP.
  explanation: |
    Correct answer: **B. private endpoints.** A private endpoint assigns a private IP address
    from Vnet1 to the selected storage service. With DNS resolving the storage hostname to
    this private IP, VM1 connects through Azure Private Link over the Microsoft backbone.
    This avoids sending storage traffic through the forced-tunneled public endpoint path
    to the on-premises VPN gateway.

    - **A:** Application Gateway is an HTTP/HTTPS application load balancer; it does not provide
      private connectivity to an Azure Storage account.
    - **C:** An NSG allows or denies traffic. It does not establish Private Link or control routing.
    - **D:** Azure Virtual WAN connects networks and branches; it does not give storage1 a private
      endpoint in Vnet1.

    Create private endpoints for the storage services VM1 uses and configure their DNS records.
    Creating a private endpoint does not automatically disable the storage account's public endpoint.

    [Microsoft Learn: Use private endpoints for Azure Storage](https://learn.microsoft.com/en-us/azure/storage/common/storage-private-endpoints)
- id: '075'
  skill: Manage Azure identities and governance
  sub-skill: Manage access to Azure resources
  question_type: hotspot
  tags:
    - "exam topic: Manage Azure identities and governance"
    - Azure RBAC
    - Role assignment scope
    - Storage Account Contributor
    - Network security groups
  question: |
    You have an Azure subscription that contains a user named User1 and the resources shown
    in the following table.

    | Name | Type |
    | --- | --- |
    | RG1 | Resource group |
    | networkinterface1 | Virtual network interface |
    | NSG1 | Network security group (NSG) |

    NSG1 is associated to networkinterface1.

    User1 has role assignments for NSG1 as shown in the following table.

    | Role | Scope |
    | --- | --- |
    | Contributor | This resource |
    | Reader | Subscription (Inherited) |
    | Storage Account Contributor | Resource group (Inherited) |

    For each of the following statements, select Yes if the statement is true.
    Otherwise, select No. Each correct selection is worth one point.
  choices:
    User1 can create a storage account in RG1.:
      - Yes
      - No
    User1 can modify the DNS settings of networkinterface1.:
      - Yes
      - No
    User1 can create an inbound security rule to filter inbound traffic to networkinterface1.:
      - Yes
      - No
  answer:
    User1 can create a storage account in RG1.: Yes
    User1 can modify the DNS settings of networkinterface1.: No
    User1 can create an inbound security rule to filter inbound traffic to networkinterface1.: Yes
  user_answer:
    User1 can create a storage account in RG1.: Yes
    User1 can modify the DNS settings of networkinterface1.: No
    User1 can create an inbound security rule to filter inbound traffic to networkinterface1.: Yes
  user_result: correct
  learning_note: |
    Role determines what operations are allowed; scope determines where they are allowed.
    Contributor on NSG1 permits managing its security rules, but does not permit modifying
    the associated NIC. Storage Account Contributor at RG1 scope permits creating storage
    accounts in RG1. Reader does not restrict permissions granted by other roles.
  explanation: |
    Correct selections: **Yes; No; Yes.**

    - **Create a storage account in RG1 — Yes:** The inherited Storage Account Contributor
      assignment is at resource-group scope. It includes `Microsoft.Storage/storageAccounts/*`,
      permitting storage account creation and management in RG1.
    - **Modify networkinterface1 DNS settings — No:** DNS settings belong to the network
      interface. Contributor on NSG1 applies to NSG1 and its child resources, not to the
      separate NIC associated with it. Reader and Storage Account Contributor do not grant
      the required NIC write permission.
    - **Create an inbound security rule — Yes:** Security rules are child resources of NSG1.
      Contributor on NSG1 permits creating them. Because NSG1 is already associated with
      networkinterface1, the new rule filters inbound traffic to that NIC without requiring
      a change to the NIC itself.

    Azure RBAC permissions from multiple role assignments are additive. An association
    between resources does not extend a role assignment's scope to the associated resource.

    [Microsoft Learn: Understand Azure role assignments](https://learn.microsoft.com/en-us/azure/role-based-access-control/role-assignments)
    [Microsoft Learn: Storage Account Contributor](https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/storage#storage-account-contributor)
- id: '076'
  skill: Manage Azure identities and governance
  sub-skill: Manage access to Azure resources
  tags:
    - "exam topic: Manage Azure identities and governance"
    - Azure RBAC
    - User Access Administrator
    - Role assignments
    - Scope
  question: |
    You have an Azure subscription named Subscription1 that contains a virtual network named VNet1.
    VNet1 is in a resource group named RG1.

    Subscription1 has a user named User1. User1 has the following roles:

    - Reader
    - Security Admin
    - Security Reader

    You need to ensure that User1 can assign the Reader role for VNet1 to other users.

    What should you do?
  choices:
    A: Remove User1 from the Security Reader role for Subscription1. Assign User1 the Contributor role for RG1.
    B: Assign User1 the Access Administrator role for VNet1.
    C: Remove User1 from the Security Reader and Reader roles for Subscription1. Assign User1 the Contributor role for Subscription1.
    D: Assign User1 the Network Contributor role for RG1.
  answer: B
  user_answer: B
  user_result: correct
  learning_note: |
    The intended role in option B is User Access Administrator, the official Azure built-in
    role name. It permits managing access at the assigned scope. Contributor and Network
    Contributor manage resources but cannot create Azure RBAC role assignments.
  explanation: |
    Correct answer: **B. Assign User1 the Access Administrator role for VNet1.** The question
    abbreviates the official role name, **User Access Administrator**. Interpreting B as that
    role, assigning it at VNet1 scope allows User1 to assign Reader for that virtual network.
    Its `Microsoft.Authorization/*` permission includes `Microsoft.Authorization/roleAssignments/write`,
    which is required to create role assignments.

    - **A and C:** Contributor cannot assign Azure RBAC roles, regardless of whether its
      scope is a resource group or subscription. Removing Reader or Security Reader does
      not grant role-assignment permission.
    - **D:** Network Contributor can manage network resources but cannot assign Azure RBAC roles.
    - **Existing roles:** Reader, Security Admin, and Security Reader do not grant the required
      general Azure RBAC role-assignment permission.

    Contributor manages resources; User Access Administrator manages access; Owner can do both.
    Assigning User Access Administrator at VNet1 scope confines its authority to that resource
    and its children rather than all resources in RG1 or Subscription1.

    [Microsoft Learn: User Access Administrator](https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/privileged#user-access-administrator)
    [Microsoft Learn: Steps to assign an Azure role](https://learn.microsoft.com/en-us/azure/role-based-access-control/role-assignments-steps)
- id: '077'
  skill: Manage Azure identities and governance
  sub-skill: Manage access to Azure resources
  question_type: hotspot
  tags:
    - "exam topic: Manage Azure identities and governance"
    - Azure RBAC
    - Management groups
    - Role inheritance
    - User Access Administrator
    - Virtual Machine Contributor
  question: |
    You have three Azure subscriptions named Sub1, Sub2, and Sub3 that are linked to an Azure AD tenant.

    The tenant contains a user named User1, a security group named Group1, and a management group
    named MG1. User1 is a member of Group1.

    Sub1 and Sub2 are members of MG1. Sub1 contains a resource group named RG1.
    RG1 contains five Azure functions.

    You create the following role assignments for MG1:

    - Group1: Reader
    - User1: User Access Administrator

    You assign User1 the Virtual Machine Contributor role for Sub1 and Sub2.

    For each statement, select Yes if it is true. Otherwise, select No.
    Each correct selection is worth one point.
  choices:
    The Group1 members can view the configurations of the Azure functions.:
      - Yes
      - No
    User1 can assign the Owner role for RG1.:
      - Yes
      - No
    User1 can create a new resource group and deploy a virtual machine to the new group.:
      - Yes
      - No
  answer:
    The Group1 members can view the configurations of the Azure functions.: Yes
    User1 can assign the Owner role for RG1.: Yes
    User1 can create a new resource group and deploy a virtual machine to the new group.: No
  user_answer:
    The Group1 members can view the configurations of the Azure functions.: Yes
    User1 can assign the Owner role for RG1.: Yes
    User1 can create a new resource group and deploy a virtual machine to the new group.: No
  user_result: correct
  learning_note: |
    Azure RBAC assignments at management-group scope are inherited by descendant subscriptions,
    resource groups, and resources. User Access Administrator can assign Owner without holding
    Owner itself. Virtual Machine Contributor does not include resource-group creation permission.
    Evaluate the existing assignments without assuming that User1 first assigns additional roles.
  explanation: |
    Correct selections: **Yes; Yes; No**, based on the existing role assignments.

    - **View the Azure functions' configurations — Yes:** Group1's Reader assignment at MG1
      flows down through Sub1 to RG1 and its functions. Group1 members can view resource
      configuration through control-plane read permissions. This does not grant access to secrets.
    - **Assign Owner for RG1 — Yes:** User1 inherits User Access Administrator from MG1.
      This role includes `Microsoft.Authorization/*`, allowing role assignments at RG1 scope,
      including Owner. User1 does not need to hold Owner to assign it.
    - **Create a new resource group and deploy a VM — No:** Virtual Machine Contributor at
      Sub1 and Sub2 permits VM management but includes only resource-group read permission,
      not `Microsoft.Resources/subscriptions/resourceGroups/write`. User Access Administrator
      manages access and does not supply the missing resource-group creation permission.
      Therefore, User1 cannot complete both operations with the existing assignments.

    In practice, an unrestricted User Access Administrator could first assign themselves an
    additional role such as Contributor at subscription scope. The expected exam answer does
    not assume this extra role assignment. Sub3 does not inherit MG1's assignments because
    it is not a member of MG1. Azure AD is now called Microsoft Entra ID.

    [Microsoft Learn: Management groups](https://learn.microsoft.com/en-us/azure/governance/management-groups/overview)
    [Microsoft Learn: User Access Administrator](https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/privileged#user-access-administrator)
    [Microsoft Learn: Virtual Machine Contributor](https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/compute#virtual-machine-contributor)
- id: '078'
  skill: Implement and manage storage
  sub-skill: Configure access to storage
  tags:
    - "exam topic: Implement and manage storage"
    - Azure Files
    - Identity-based authentication
    - Share-level permissions
    - Azure RBAC
  question: |
    You have an Azure subscription that contains the resources shown in the following table.

    | Name | Description |
    | --- | --- |
    | share1 | File share in storage1 |
    | storage1 | Storage account |
    | User1 | Azure AD user |

    You need to assign User1 the Storage File Data SMB Share Contributor role for share1.

    What should you do first?
  choices:
    A: Enable identity-based data access for the file shares in storage1.
    B: Modify the security profile for the file shares in storage1.
    C: Select Default to Azure Active Directory authorization in the Azure portal for storage1.
    D: Configure Access control (IAM) for share1.
  answer: A
  user_answer: A
  user_result: correct
  learning_note: |
    The expected Azure Files setup order is to enable an identity source on the storage account,
    assign share-level RBAC permissions, and then configure directory/file ACLs as needed.
    An RBAC role assignment can technically exist before authentication is configured; enabling
    identity-based authentication is the prerequisite for usable identity-based SMB access.
  explanation: |
    Intended correct answer: **A. Enable identity-based data access for the file shares in storage1.**
    Microsoft documents enabling an identity source on the storage account before configuring
    share-level permissions for identity-based SMB access. Next, assign User1 the Storage File
    Data SMB Share Contributor role at share1 scope using Access control (IAM). Configure
    directory/file access control lists (ACLs) as needed for access to the files themselves.

    - **B:** The security profile controls SMB protocol and security settings; it does not
      enable the identity source or assign permissions to User1.
    - **C:** Defaulting the Azure portal to Azure AD authorization does not enable identity-based
      SMB authentication for Azure Files.
    - **D:** Access control (IAM) is where the role is assigned, but enabling identity-based
      authentication is the first step in the expected setup sequence.

    Wording caveat: Creating an Azure RBAC role assignment itself does not technically require
    the identity source to be enabled first. A is the expected answer when the question is
    interpreted as preparing usable identity-based SMB access, rather than only creating
    the role-assignment object. Azure AD is now called Microsoft Entra ID.

    [Microsoft Learn: Assign share-level permissions for Azure Files](https://learn.microsoft.com/en-us/azure/storage/files/storage-files-identity-assign-share-level-permissions)
    [Microsoft Learn: Azure Files identity-based authentication](https://learn.microsoft.com/en-us/azure/storage/files/storage-files-active-directory-overview)
- id: '080'
  skill: Manage Azure identities and governance
  sub-skill: Manage Microsoft Entra users and groups
  question_type: hotspot
  tags:
    - must-review
    - "exam topic: Manage Azure identities and governance"
    - Group-based licensing
    - Nested groups
    - Direct license assignments
    - Microsoft Entra ID
  question: |
    You have an Azure AD tenant named adatum.com that contains the groups shown in the following table.

    | Name | Type | Member of |
    | --- | --- | --- |
    | Group1 | Security | None |
    | Group2 | Security | Group1 |

    Adatum.com contains the users shown in the following table.

    | Name | Member of |
    | --- | --- |
    | User1 | Group1 |
    | User2 | Group2 |

    You assign an Azure Active Directory Premium P2 license to Group1 with the following
    assignment options, as shown in the exhibit:

    | Service plan | Setting |
    | --- | --- |
    | Azure Active Directory Premium P1 | Off |
    | Azure Active Directory Premium P2 | On |
    | Microsoft Azure Multi-Factor Authentication | On |
    | Microsoft Defender for Cloud Apps Discovery | Off |

    Group2 is NOT directly assigned a license.

    For each statement, select Yes if it is true. Otherwise, select No.
    Each correct selection is worth one point.
  choices:
    You can assign User1 the Microsoft Defender for Cloud Apps Discovery license.:
      - 'Yes'
      - 'No'
    You can remove the Azure Active Directory Premium P2 license from User1.:
      - 'Yes'
      - 'No'
    User2 is assigned the Azure Active Directory Premium P2.:
      - 'Yes'
      - 'No'
  answer:
    You can assign User1 the Microsoft Defender for Cloud Apps Discovery license.: 'Yes'
    You can remove the Azure Active Directory Premium P2 license from User1.: 'No'
    User2 is assigned the Azure Active Directory Premium P2.: 'No'
  user_answer:
    You can assign User1 the Microsoft Defender for Cloud Apps Discovery license.: 'No'
    You can remove the Azure Active Directory Premium P2 license from User1.: 'Yes'
    User2 is assigned the Azure Active Directory Premium P2.: 'No'
  user_result: partially_correct
  learning_note: |
    A service plan set to Off in a group assignment is not a deny: a direct assignment can
    enable that service for User1. A group-inherited license cannot be removed directly from
    the user while the source assignment and membership remain. Group-based licensing applies
    to direct user members only, so nested Group2 does not pass Group1's license to User2.
  explanation: |
    Correct selections: **Yes; No; No.** Your selections were **No; Yes; No**.

    - **Assign User1 Microsoft Defender for Cloud Apps Discovery — Yes:** User1 can receive
      a direct assignment of the product license with this service plan enabled, assuming
      licensing prerequisites and availability are satisfied. Off in Group1's assignment
      means that assignment does not grant the service; it does not prevent a direct
      assignment from enabling it. Direct and group-based assignments can coexist.
    - **Remove User1's Azure AD Premium P2 license — No:** User1 inherits this license from
      Group1. You cannot remove that inherited assignment directly on User1 while the group
      assignment and membership remain. Instead, remove User1 from Group1 or change the
      group's licensing. Changing the group assignment affects its other direct members too.
    - **User2 receives Azure AD Premium P2 — No:** User2 is a direct member of Group2, not
      Group1. Group-based licensing does not support nested groups, and Group2 has no license
      assignment of its own.

    Remember: Group Off is not a deny; inherited licenses are managed at their source;
    nested members receive no license from the parent group. Azure AD is now Microsoft Entra ID.

    [Microsoft Learn: Group-based licensing](https://learn.microsoft.com/en-us/entra/identity/users/licensing-group-advanced)
    [Microsoft Learn: Licensing PowerShell examples](https://learn.microsoft.com/en-us/entra/identity/users/licensing-powershell-graph-examples)
- id: '081'
  skill: Manage Azure identities and governance
  sub-skill: Manage Microsoft Entra users and groups
  question_type: hotspot
  tags:
    - must-review
    - "exam topic: Manage Azure identities and governance"
    - Microsoft Entra ID
    - Hybrid identities
    - User attributes
    - Source of authority
  question: |
    You have a hybrid deployment of Azure Active Directory (Azure AD) that contains the users
    shown in the following table.

    | Name | User type | On-premises sync enabled |
    | --- | --- | --- |
    | User1 | Member | No |
    | User2 | Member | Yes |
    | User3 | Guest | No |

    You need to modify the JobTitle and UsageLocation attributes for these users.

    For which users can you modify the attributes from Azure AD? Select the appropriate
    options in the answer area. Each correct selection is worth one point.
  choices:
    JobTitle:
      - User1 only
      - User1 and User2 only
      - User1 and User3 only
      - User1, User2, and User3
    UsageLocation:
      - User1 only
      - User1 and User2 only
      - User1 and User3 only
      - User1, User2, and User3
  answer:
    JobTitle: User1 and User3 only
    UsageLocation: User1, User2, and User3
  user_answer:
    JobTitle: User2 only
    UsageLocation: User1, User2, and User3
  user_result: partially_correct
  user_reasoning: Believed only on-premises-synchronized users could have attributes such as job title modified; selected all three users for usage location.
  learning_note: |
    The JobTitle reasoning was reversed: for a synchronized user, job information is managed
    in on-premises AD and then synchronized to Microsoft Entra ID. Cloud-managed users,
    including the unsynchronized guest in this scenario, can have JobTitle edited in Entra ID.
    UsageLocation is cloud-managed and can be edited there for all three users. The attempted
    JobTitle answer, User2 only, was not one of the offered choices.
  explanation: |
    Correct selections: **JobTitle — User1 and User3 only; UsageLocation — User1, User2, and User3.**

    - **User1:** This member is not synchronized from on-premises AD. Both attributes can
      be modified directly in Azure AD (now Microsoft Entra ID).
    - **User2:** This member is synchronized from on-premises AD. JobTitle is job information
      whose source of authority is on-premises AD, so edit it there and wait for synchronization.
      UsageLocation is a cloud-managed attribute and can be modified directly in Entra ID.
    - **User3:** This guest is not synchronized from on-premises AD. An appropriately authorized
      administrator can modify both attributes on the guest object in this tenant.

    The decisive clue is the question's wording, "from Azure AD." Synchronization does not
    make job information editable in the cloud; it makes on-premises AD the place to edit it.
    Guest status alone does not prevent an administrator from editing these profile attributes.
    Assume the administrator has the required permissions and the standard hybrid configuration.

    Remember: Synced job information — edit on-premises. Usage location — edit in the cloud.

    [Microsoft Learn: Manage user profile information](https://learn.microsoft.com/en-us/entra/fundamentals/how-to-manage-user-profile-info)
    [Microsoft Learn: Update a user](https://learn.microsoft.com/en-us/graph/api/user-update?view=graph-rest-1.0)
