    - Custom roles
    - Assignable scopes
    - Subscriptions
    - Administrative effort
  question: |
    You have two Azure subscriptions named Sub1 and Sub2.

    An administrator creates a custom role that has an assignable scope of a resource group named
    RG1 in Sub1.

    You need to ensure that you can apply the custom role to any resource group in Sub1 and Sub2.
    The solution must minimize administrative effort.

    What should you do?
  choices:
    A: Select the custom role and add Sub1 and Sub2 to the assignable scopes. Remove RG1 from the assignable scopes.
    B: Create a new custom role for Sub1. Create a new custom role for Sub2. Remove the role from RG1.
    C: Create a new custom role for Sub1 and add Sub2 to the assignable scopes. Remove the role from RG1.
    D: Select the custom role and add Sub1 to the assignable scopes. Remove RG1 from the assignable scopes. Create a new custom role for Sub2.
  answer: A
  user_answer: D
  user_result: incorrect
  user_reasoning: Selected separate custom-role coverage for Sub2; no further reasoning was provided.
  learning_note: |
    A single Azure custom role can list multiple subscriptions in `assignableScopes` when the
    subscriptions trust the same Microsoft Entra tenant. A subscription assignable scope makes the
    role available for assignment at that subscription and at its descendant resource groups and
    resources.
  explanation: |
    Correct answer: **A.** Update the existing custom role by replacing the RG1 assignable scope
    with the subscription scopes for both Sub1 and Sub2.

    Listing both subscriptions makes the same role available at every resource group in both
    subscriptions. Creating another custom role for Sub2, as proposed by D, duplicates the role and
    increases administrative effort unnecessarily.

    `assignableScopes` specifies where a role definition is available for assignment; it does not
    grant the role to anyone. Actual access still requires a role assignment to a security
    principal at the intended scope.

    [Microsoft Learn: Understand Azure role definitions](https://learn.microsoft.com/en-us/azure/role-based-access-control/role-definitions#assignablescopes)
