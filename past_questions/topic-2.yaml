  choices:
    A: Assign the Owner role for the Azure subscription to User1, and then modify the default conditional access policies.
    B: Assign the Owner role for the Azure subscription to User1, and then instruct User1 to configure access management for Azure resources.
    C: Assign the Global administrator role to User1, and then instruct User1 to configure access management for Azure resources.
    D: Create a new management group and delegate User1 as the owner of the new management group.
  answer: C
  user_answer: C
  user_result: correct
  user_reasoning: Selected Global administrator plus access management for Azure resources; no further reasoning was provided.
  learning_note: The tenant root management group is above subscriptions, so subscription Owner does not grant access there. A Global Administrator can enable Access management for Azure resources to receive User Access Administrator at root scope, then assign an Azure role with policy-assignment permissions, such as Resource Policy Contributor, at the tenant root management group.
  explanation: |
    Expected exam answer: **C.** User1 must be a Microsoft Entra Global Administrator to enable
