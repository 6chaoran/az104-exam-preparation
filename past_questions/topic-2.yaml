  question: |
    You have an Azure Active Directory (Azure AD) tenant named contoso.onmicrosoft.com.

    The User administrator role is assigned to a user named Admin1.

    An external partner has a Microsoft account that uses the user1@outlook.com sign-in.

    Admin1 attempts to invite the external partner to sign in to the Azure AD tenant and receives
    the following error message: `Unable to invite user user1@outlook.com "Generic authorization
    exception."`

    You need to ensure that Admin1 can invite the external partner to sign in to the Azure AD tenant.

    What should you do?
  choices:
    A: From the Users settings blade, modify the External collaboration settings.
    B: From the Custom domain names blade, add a custom domain.
    C: From the Organizational relationships blade, add an identity provider.
    D: From the Roles and administrators blade, assign the Security administrator role to Admin1.
  answer: A
  user_answer: C
  user_result: incorrect
  user_reasoning: Selected adding an identity provider; no further reasoning was provided.
  learning_note: A personal Microsoft account is supported for B2B guest invitations by default. Guest invite permissions and allowed or blocked domains are controlled in External collaboration settings. A User administrator can invite guests when the tenant settings permit it.
  explanation: |
    Correct answer: **A.** External collaboration settings control who can invite guest users and
    which email domains can be invited. Admin1 already has the User administrator role, so check
    and modify those settings to permit the invitation. In the current Microsoft Entra admin
    center, the path is Entra ID > External Identities > External collaboration settings.

    A personal Microsoft account such as user1@outlook.com is supported for B2B collaboration by
    default, so adding an identity provider is unnecessary. A custom domain concerns the tenant's
    own domain names. Assigning Security administrator does not address guest invite restrictions.

    The error alone does not identify which external collaboration restriction caused the failure;
    check both guest invite settings and any domain allow or block list.

    [Microsoft Learn: Configure external collaboration settings](https://learn.microsoft.com/en-us/entra/external-id/external-collaboration-settings-configure)
