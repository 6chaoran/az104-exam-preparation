- id: '042'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  tags:
    - "exam topic: Monitor and maintain Azure resources"
    - Log Analytics
    - KQL
    - Event table
    - Search operator
  question: |
    You have an Azure subscription named Subscription1 that contains an Azure Log Analytics
    workspace named Workspace1.

    You need to view the error events from a table named Event.

    Which query should you run in Workspace1?
  choices:
    A: 'Get-Event Event | where {$_.EventType == "error"}'
    B: 'Event | search "error"'
    C: 'select * from Event where EventType == "error"'
    D: 'search in (Event) * | where EventType=="error"'
  answer: B
  user_answer: D
  user_result: incorrect
  user_reasoning: Remembered that Log Analytics uses KQL and believed a KQL query must start with the search operator.
  learning_note: |
    A KQL query can start with a table name or with the search operator. Starting with the table
    name clearly limits the query scope: `Event | search "error"`. The Event table has columns such
    as EventLevel and EventLevelName, but it does not have an EventType column.
  explanation: |
    Correct answer: **B. `Event | search "error"`.** `Event` selects the table, and the pipe sends
    those rows to the search operator, which looks for the term `error` across the table's columns.

    - **A:** Uses PowerShell syntax rather than Kusto Query Language (KQL).
    - **C:** Uses SQL syntax rather than KQL.
    - **D:** `search in (Event) *` initially matches all rows, but the following filter references
      `EventType`, which is not a column in the Azure Monitor Event table.

    KQL does not have to begin with `search`. Queries commonly begin with a table name followed by
    piped operators. When the severity column is known, a more precise current-schema query would
    be `Event | where EventLevelName =~ "Error"`.

    [Microsoft Learn: Get started with log queries in Azure Monitor](https://learn.microsoft.com/en-us/azure/azure-monitor/logs/get-started-queries)
    [Microsoft Learn: Event table reference](https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/event)
- id: '043'
  skill: Implement and manage virtual networking
  sub-skill: Configure name resolution and load balancing
  tags:
    - "exam topic: Implement and manage virtual networking"
    - Azure DNS
    - Domain delegation
    - NS records
    - Domain registrar
  question: |
    You have a registered DNS domain named contoso.com.

    You create a public Azure DNS zone named contoso.com.

    You need to ensure that records created in the contoso.com zone are resolvable from the
    internet.

    What should you do?
  choices:
    A: Create NS records in contoso.com.
    B: Modify the SOA record in the DNS domain registrar.
    C: Create the SOA record in contoso.com.
    D: Modify the NS records in the DNS domain registrar.
  answer: D
  user_answer: A
  user_result: incorrect
  user_reasoning: Selected creating NS records inside the contoso.com Azure DNS zone.
  learning_note: |
    Azure automatically creates apex NS and SOA records when a public DNS zone is created. To make
    the registered domain resolve through Azure DNS, configure the Azure-assigned name servers at
    the domain registrar. The registrar delegates a registered domain; a parent DNS zone delegates
    a subdomain.
  explanation: |
    Correct answer: **D. Modify the NS records in the DNS domain registrar.** Creating the Azure DNS
    zone does not automatically change the public DNS delegation for the registered domain. Copy
    the four name servers assigned to the Azure DNS zone and configure them as the authoritative
    name servers through the registrar.

    - **A:** Azure creates the authoritative apex NS record set automatically. Creating additional
      NS records inside the same zone does not update the parent `.com` delegation.
    - **B:** The registrar uses NS settings for delegation. The SOA record is not the delegation
      mechanism.
    - **C:** Azure also creates the zone's SOA record automatically.

    This differs from subdomain delegation. A registered domain is delegated through its registrar,
    while a child zone is delegated by adding an NS record set to its parent DNS zone.

    [Microsoft Learn: Host your domain in Azure DNS](https://learn.microsoft.com/en-us/azure/dns/dns-delegate-domain-azure-dns)
    [Microsoft Learn: Azure DNS delegation overview](https://learn.microsoft.com/en-us/azure/dns/dns-domain-delegation)
- id: '044'
  skill: Implement and manage storage
  sub-skill: Configure access to storage
  question_type: hotspot
  tags:
    - "exam topic: Implement and manage storage"
    - Azure Files
    - Azure RBAC
    - AD DS authentication
    - Hybrid identities
  question: |
    You have an Azure subscription that contains a storage account named storage1. The subscription
    is linked to an Azure Active Directory (Azure AD) tenant named contoso.com that synchronizes
    with an on-premises Active Directory domain.

    The domain contains the following security principals:

    | Name      | Type     |
    |-----------|----------|
    | User1     | User     |
    | Computer1 | Computer |

    In Azure AD, you create a cloud-only user named User2.

    The storage1 account contains a file share named share1. Azure Files identity-based
    authentication is configured with `directoryServiceOptions` set to `AD`, and the Active
    Directory domain, NetBIOS domain, and forest are contoso.com.

    For each statement, select Yes if the statement is true. Otherwise, select No. Each correct
    selection is worth one point.
  choices:
    You can assign the Storage File Data SMB Share Contributor role to User1 for share1:
      - Yes
      - No
    You can assign the Storage File Data SMB Share Reader role to Computer1 for share1:
      - Yes
      - No
    You can assign the Storage File Data SMB Share Elevated Contributor role to User2 for share1:
      - Yes
      - No
  answer:
    You can assign the Storage File Data SMB Share Contributor role to User1 for share1: Yes
    You can assign the Storage File Data SMB Share Reader role to Computer1 for share1: No
    You can assign the Storage File Data SMB Share Elevated Contributor role to User2 for share1: Yes
  user_answer:
    You can assign the Storage File Data SMB Share Contributor role to User1 for share1: Yes
    You can assign the Storage File Data SMB Share Reader role to Computer1 for share1: Yes
    You can assign the Storage File Data SMB Share Elevated Contributor role to User2 for share1: Yes
  user_result: partially_correct
  user_reasoning: Selected Yes for all three role-assignment statements; no further reasoning was provided.
  learning_note: |
    Azure Files share-level RBAC roles can be assigned to Microsoft Entra security principals.
    Synced User1 and cloud-only User2 are Entra user objects, but the AD DS computer account does
    not synchronize as an assignable Entra RBAC principal. Also distinguish role assignment from
    SMB authentication: with AD DS as the identity source, cloud-only User2 cannot authenticate to
    the share even though an Azure RBAC assignment can be created for User2.
  explanation: |
    Correct selections: **Yes, No, Yes.**

    - **User1: Yes.** User1 is synchronized from AD DS to Microsoft Entra ID and can receive the
      Storage File Data SMB Share Contributor role at the share1 scope.
    - **Computer1: No.** An AD DS computer account does not synchronize to an assignable Microsoft
      Entra identity for Azure RBAC. Computer accounts can instead receive access through a default
      share-level permission, with file and directory access controlled by Windows ACLs.
    - **User2: Yes.** User2 is a Microsoft Entra user and can be selected for an Azure RBAC role
      assignment. However, creating the assignment does not mean User2 can authenticate to share1
      through the configured AD DS identity source. Cloud-only SMB authentication requires
      Microsoft Entra Kerberos.

    The statements ask whether each role can be assigned, so keep the RBAC-assignment question
    separate from whether the identity can authenticate and obtain effective file access.

    [Microsoft Learn: Assign share-level permissions for Azure Files](https://learn.microsoft.com/en-us/azure/storage/files/storage-files-identity-assign-share-level-permissions)
    [Microsoft Learn: Azure Files identity-based authentication overview](https://learn.microsoft.com/en-us/azure/storage/files/storage-files-active-directory-overview)
- id: '045'
  skill: Manage Azure identities and governance
  sub-skill: Manage access to Azure resources
  question_type: hotspot
  tags:
    - "exam topic: Manage Azure identities and governance"
    - Azure RBAC
    - Owner
    - Network Contributor
    - Security Admin
    - Virtual networks
  question: |
    You have an Azure subscription named Subscription1 that contains a virtual network named VNet1.

    You add the users shown in the following table:

    | User  | Role                |
    |-------|---------------------|
    | User1 | Owner               |
    | User2 | Security Admin      |
    | User3 | Network Contributor |

    Which users can perform each configuration? Select the appropriate option for each task. Each
    correct selection is worth one point.
  choices:
    Add a subnet to VNet1:
      - User1 only
      - User3 only
      - User1 and User3 only
      - User2 and User3 only
      - User1, User2, and User3
    Assign a user the Reader role to VNet1:
      - User1 only
      - User2 only
      - User3 only
      - User1 and User2 only
      - User2 and User3 only
      - User1, User2, and User3
  answer:
    Add a subnet to VNet1: User1 and User3 only
    Assign a user the Reader role to VNet1: User1 only
  user_answer:
    Add a subnet to VNet1: User1 and User3 only
    Assign a user the Reader role to VNet1: User1 only
  user_result: correct
  user_reasoning: Selected Owner and Network Contributor for subnet creation, and selected only Owner for assigning the Reader role.
  learning_note: |
    Owner can manage resources and assign Azure roles. Network Contributor can manage network
    resources, including subnets, but cannot assign Azure roles. Security Admin manages security
    configuration and does not grant general virtual-network management or role-assignment
    permissions.
  explanation: |
    Correct selections: **Add a subnet: User1 and User3 only; assign Reader: User1 only.**

    - **User1 — Owner:** Owner has full resource-management permissions and includes
      `Microsoft.Authorization/roleAssignments/write`, so User1 can perform both tasks.
    - **User2 — Security Admin:** Security Admin manages security policies, recommendations, and
      related security configuration. It does not grant permission to modify virtual networks or
      create general Azure role assignments.
    - **User3 — Network Contributor:** Network Contributor includes `Microsoft.Network/*`, so User3
      can add a subnet. It has only read access to Azure authorization information and cannot create
      role assignments.

    [Microsoft Learn: Azure built-in networking roles](https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/networking)
    [Microsoft Learn: Azure built-in privileged roles](https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/privileged)
    [Microsoft Learn: Azure built-in security roles](https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/security)
- id: '046'
  skill: Manage Azure identities and governance
  sub-skill: Manage Azure subscriptions and governance
  question_type: hotspot
  tags:
    - "exam topic: Manage Azure identities and governance"
    - Resource locks
    - Tags
    - Management groups
    - Scope
  question: |
    You have the following Azure resource hierarchy:

    Tenant Root Group → MG1 → Sub1 → RG1 → VM1

    You plan to track resource usage and prevent the deletion of resources.

    To which resources can you apply locks and tags? Select the appropriate option for each
    feature. Each correct selection is worth one point.
  choices:
    Locks:
      - RG1 and VM1 only
      - Sub1 and RG1 only
      - Sub1, RG1, and VM1 only
      - MG1, Sub1, RG1, and VM1 only
      - Tenant Root Group, MG1, Sub1, RG1, and VM1
    Tags:
      - RG1 and VM1 only
      - Sub1 and RG1 only
      - Sub1, RG1, and VM1 only
      - MG1, Sub1, RG1, and VM1 only
      - Tenant Root Group, MG1, Sub1, RG1, and VM1
  answer:
    Locks: Sub1, RG1, and VM1 only
    Tags: Sub1, RG1, and VM1 only
  user_answer:
    Locks: Tenant Root Group, MG1, Sub1, RG1, and VM1
    Tags: Tenant Root Group, MG1, Sub1, RG1, and VM1
  user_result: incorrect
  user_reasoning: Believed that both locks and tags could be applied at every level from the tenant root management group through the virtual machine.
  learning_note: |
    Azure management locks and tags can be applied to subscriptions, resource groups, and supported
    resources, but not to management groups, including the tenant root management group. Locks
    inherit down the resource hierarchy; tags do not automatically inherit without Azure Policy or
    Cost Management tag inheritance.
  explanation: |
    Correct selections: **Locks: Sub1, RG1, and VM1 only; Tags: Sub1, RG1, and VM1 only.**

    Management locks can be applied to subscriptions, resource groups, and individual resources.
    A lock at a parent scope is inherited by its child resources, but locks cannot be placed on
    management groups.

    Tags can be applied to subscriptions, resource groups, and resource types that support tags.
    Management groups, including the tenant root group, do not support tags. Unlike locks, tags on
    a subscription or resource group do not automatically flow to child resources. Use Azure
    Policy or Cost Management tag inheritance when inheritance is required.

    [Microsoft Learn: Lock Azure resources](https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources)
    [Microsoft Learn: Use tags to organize Azure resources](https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/tag-resources)
