  user_reasoning: Selected the Kusto Query Language search syntax.
  learning_note: |
    Log Analytics uses Kusto Query Language (KQL). `Table | search "term"` searches all columns in
    the specified table. For a known column, a more targeted query normally uses
    `Table | where Column == "value"`.
  explanation: |
    Correct answer: **B. `Event | search "error"`.** This is valid KQL and searches all columns in
    the Event table for the term `error`.

    Choice A uses SQL syntax, choice C uses the invalid `is` comparison syntax, and choice D uses
    PowerShell syntax. A targeted valid KQL alternative would be
    `Event | where EventType == "Error"`, but that query is not one of the choices.

    [Microsoft Learn: KQL search operator](https://learn.microsoft.com/en-us/kusto/query/search-operator)
- id: '064'
  skill: Manage Azure identities and governance
  sub-skill: Manage access to Azure resources
  tags:
    - "exam topic: Deploy and manage Azure compute resources"
    - Azure App Service
    - Azure RBAC
    - Website Contributor
    - Web Deploy
    - Least privilege
  question: |
    You have an Azure App Services web app named App1.

    You plan to deploy App1 by using Web Deploy.

    You need to ensure that the developers of App1 can use their Azure AD credentials to deploy
    content to App1. The solution must use the principle of least privilege.

    What should you do?
  choices:
    A: Assign the Owner role to the developers.
    B: Configure app-level credentials for FTPS.
    C: Assign the Website Contributor role to the developers.
    D: Configure user-level credentials for FTPS.
  answer: C
  user_answer: B
  user_result: incorrect
  user_reasoning: Selected app-level FTPS credentials; no further reasoning was provided.
  learning_note: |
    When developers must deploy by using their Microsoft Entra identities, grant an Azure RBAC role
    with the required App Service publishing permissions. Website Contributor supplies the needed
    website-management access with less privilege than Owner. App-level and user-level publishing
    credentials are separate basic-authentication credentials rather than Entra credentials.
  explanation: |
    Correct answer: **C. Assign the Website Contributor role to the developers.** This role permits
    developers to manage and deploy App Service websites while avoiding the broad resource and
    access-management authority of Owner.

    App-level and user-level FTPS credentials are deployment usernames and passwords. They do not
    satisfy the requirement to deploy with the developers' Azure AD credentials. App-level
    credentials are also generated automatically for each app rather than manually configured.

    [Microsoft Learn: Manage App Service deployment credentials](https://learn.microsoft.com/en-us/azure/app-service/deploy-configure-credentials)
- id: '065'
  skill: Manage Azure identities and governance
