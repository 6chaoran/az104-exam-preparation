  question: |
    This question is part of a series in which each question presents the same scenario with a
    different proposed solution.

    You have an Azure Active Directory (Azure AD) tenant named contoso.com.

    You have a CSV file that contains the names and email addresses of 500 external users.

    You need to create a guest user account in contoso.com for each of the 500 external users.

    Solution: From Azure AD in the Azure portal, you use the Bulk invite users operation.

    Does this meet the goal?
  choices:
    A: true
    B: false
  answer: A
  user_answer: A
  user_result: correct
  user_reasoning: Selected Yes; no further reasoning was provided.
  learning_note: |
    Use Bulk invite for external B2B guest users and Bulk create for internal member accounts. The
    bulk invitation workflow uses Microsoft's current CSV template, including each invitee's email
    address and a required redirection URL.
  explanation: |
    Correct answer: **A. Yes.** The Bulk invite users operation accepts a CSV file and creates an
    invitation for each external identity. After invitation, each identity is represented in the
    tenant as a Guest user.

    The CSV must follow the downloaded bulk-invite template. Required values include the email
    address to invite and the URL to which the user is redirected after accepting the invitation.
    Bulk create is intended for internal Member accounts and would not be the appropriate operation
