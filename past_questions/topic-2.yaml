- id: '038'
  skill: Manage Azure identities and governance
  sub-skill: Manage access to Azure resources
  tags:
    - "exam topic: Manage Azure identities and governance"
    - Managed identities
    - Azure RBAC
    - Virtual machines
    - First action
  question: |
    You have an Azure subscription named Subscription1 that contains an Azure virtual machine
    named VM1. VM1 is in a resource group named RG1.

    VM1 runs services that will be used to deploy resources to RG1.

    You need to ensure that a service running on VM1 can manage the resources in RG1 by using the
    identity of VM1.

    What should you do first?
  choices:
    A: From the Azure portal, modify the Managed Identity settings of VM1.
    B: From the Azure portal, modify the Access control (IAM) settings of RG1.
    C: From the Azure portal, modify the Access control (IAM) settings of VM1.
    D: From the Azure portal, modify the Policies settings of RG1.
  answer: A
  user_answer: A
  user_result: correct
  user_reasoning: Selected the Managed Identity settings of VM1; no further reasoning was provided.
  learning_note: |
    Enable VM1's system-assigned managed identity first so that Azure creates its service
    principal. Then assign that identity an appropriate Azure RBAC role at RG1 scope. Remember the
    sequence: create the identity, then grant it access.
  explanation: |
    Correct answer: **A. Modify the Managed Identity settings of VM1.** First enable a
    system-assigned managed identity on VM1. Azure then creates an identity that can be selected in
    an Azure role assignment.

    Next, open RG1's Access control (IAM) settings and assign the VM identity a role with the
    required resource-management permissions, such as Contributor. The service running on VM1 can
    then obtain an access token through the managed identity without storing credentials.

    - **B:** This is the required second step. The VM identity must exist before it can be selected
      for the role assignment.
    - **C:** VM1's IAM settings control access to VM1; they do not grant VM1 access to RG1.
    - **D:** Azure Policy evaluates and enforces resource configuration. It does not authenticate
      the service or grant resource-management permissions.

    [Microsoft Learn: Configure managed identities on Azure virtual machines](https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/how-to-configure-managed-identities)
    [Microsoft Learn: Use a VM managed identity to access Azure Resource Manager](https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/tutorial-windows-vm-access)
- id: '037'
  skill: Manage Azure identities and governance
  sub-skill: Manage access to Azure resources
  question_type: hotspot
  tags:
    - "exam topic: Manage Azure identities and governance"
    - Azure RBAC
    - Microsoft Entra roles
    - Elevate access
    - User Access Administrator
  question: |
    You have an Azure Active Directory (Azure AD) tenant that contains three Global Administrators
    named Admin1, Admin2, and Admin3. The tenant is associated with an Azure subscription.

    Access control for the subscription shows the following role assignment:

    | Name   | Role  | Scope         |
    |--------|-------|---------------|
    | Admin3 | Owner | This resource |

    You sign in to the Azure portal as Admin1. In the tenant properties, you set **Access
    management for Azure resources** to **Yes**. The portal indicates that Admin1 can manage access
    to all Azure subscriptions and management groups in the directory.

    For each statement, select Yes if the statement is true. Otherwise, select No. Each correct
    selection is worth one point.
  choices:
    Admin1 can add Admin2 as an owner of the subscription:
      - Yes
      - No
    Admin3 can add Admin2 as an owner of the subscription:
      - Yes
      - No
    Admin2 can create a resource group in the subscription:
      - Yes
      - No
  answer:
    Admin1 can add Admin2 as an owner of the subscription: Yes
    Admin3 can add Admin2 as an owner of the subscription: Yes
    Admin2 can create a resource group in the subscription: No
  user_answer:
    Admin1 can add Admin2 as an owner of the subscription: Yes
    Admin3 can add Admin2 as an owner of the subscription: Yes
    Admin2 can create a resource group in the subscription: No
  user_result: correct
  user_reasoning: Believed Admin1 was Owner of all subscriptions, Admin3 was Owner of the current subscription, and Admin2 lacked Owner or Contributor on the subscription.
  learning_note: |
    Enabling Access management for Azure resources does not make Admin1 an Owner. It grants Admin1
    User Access Administrator at root scope (`/`), allowing role assignments across subscriptions
    and management groups. A Microsoft Entra Global Administrator has no Azure resource-management
    permissions by default.
  explanation: |
    Correct selections: **Yes, Yes, No.**

    - **Admin1: Yes.** Setting Access management for Azure resources to Yes grants Admin1 the Azure
      User Access Administrator role at root scope (`/`). That permission is inherited by the
      associated subscriptions and allows Admin1 to assign the Owner role to Admin2. Admin1 does
      not become Owner of the subscriptions.
    - **Admin3: Yes.** Admin3 is Owner at this subscription's scope. Owner includes permission to
      create Azure role assignments, so Admin3 can assign Owner to Admin2 on the subscription.
    - **Admin2: No.** The Microsoft Entra Global Administrator role manages the directory and does
      not by itself grant permission to manage Azure subscription resources. Admin2 has no Azure
      RBAC role that permits creating a resource group.

    [Microsoft Learn: Elevate access to manage Azure subscriptions and management groups](https://learn.microsoft.com/en-us/azure/role-based-access-control/elevate-access-global-admin)
    [Microsoft Learn: Azure roles and Microsoft Entra roles](https://learn.microsoft.com/en-us/azure/role-based-access-control/rbac-and-directory-admin-roles)
- id: '039'
  skill: Manage Azure identities and governance
  sub-skill: Manage Azure subscriptions and governance
  tags:
    - "exam topic: Manage Azure identities and governance"
    - must-review
    - Resource locks
    - Recovery Services vault
    - Resource group deletion
    - First action
  question: |
    You have an Azure subscription that contains a resource group named TestRG. You use TestRG to
    validate an Azure deployment.

    TestRG contains the following resources:

    | Name  | Type                    | Description                                      |
    |-------|-------------------------|--------------------------------------------------|
    | VM1   | Virtual machine         | VM1 is running and backed up to Vault1 daily.    |
    | Vault1| Recovery Services vault | Vault1 includes all backups of VM1.              |
    | VNET1 | Virtual network         | VNET1 has a resource lock of type Delete.        |

    You need to delete TestRG.

    What should you do first?
  choices:
    A: Modify the backup configurations of VM1 and modify the resource lock type of VNET1.
    B: Remove the resource lock from VNET1 and delete all data in Vault1.
    C: Turn off VM1 and remove the resource lock from VNET1.
    D: Turn off VM1 and delete all data in Vault1.
  answer: B
  user_answer: A
  user_result: incorrect
  user_reasoning: Identified the VNET1 resource lock and the Recovery Services vault backup as the two deletion blockers, but selected modifying them rather than fully removing both blockers.
  learning_note: |
    Identifying the blockers is only the first reasoning step. To delete the resource group, remove
    the Delete lock and remove the protected item and recovery points from the Recovery Services
    vault. Merely modifying a lock or backup configuration does not guarantee that either deletion
    dependency is gone.
  explanation: |
    Correct answer: **B. Remove the resource lock from VNET1 and delete all data in Vault1.** The
    Delete (`CanNotDelete`) lock prevents VNET1 from being deleted when TestRG is deleted. Vault1
    also cannot be deleted while it contains VM1 as a protected item or retains its backup data.

    Remove the lock from VNET1. For VM1, stop backup protection and choose to delete the backup
    data, then remove any remaining vault dependencies. TestRG can be deleted after its resources
    are no longer protected from deletion.

    - **A:** Modifying the backup configuration does not necessarily remove the protected item and
      recovery points. Modifying the lock type also does not guarantee removal of the deletion
      blocker; a ReadOnly lock would still interfere with deletion.
    - **C:** Removing the lock addresses VNET1, but turning off VM1 does not empty Vault1.
    - **D:** Deleting the vault data addresses Vault1, but the lock still protects VNET1. Turning
      off VM1 is not required before deleting it.

    [Microsoft Learn: Delete an Azure Backup Recovery Services vault](https://learn.microsoft.com/en-us/azure/backup/backup-azure-delete-vault)
    [Microsoft Learn: Lock Azure resources](https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources)
