  question: |
    You have three offices and an Azure subscription that contains an Azure Active Directory
    (Azure AD) tenant.

    You need to grant user management permissions to a local administrator in each office.

    What should you use?
  choices:
    A: Azure AD roles
    B: Administrative units
    C: Access packages in Azure AD entitlement management
    D: Azure roles
  answer: B
  user_answer: A
  user_result: incorrect
