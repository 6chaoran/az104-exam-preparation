    - Bulk invitations
  question: |
    Note: This question is part of a series of questions that present the same scenario.
    Each question in the series contains a unique solution that might meet the stated goals.
    Some question sets might have more than one correct solution, while others might not
    have a correct solution.

    After you answer a question in this section, you will NOT be able to return to it.
    As a result, these questions will not appear in the review screen.

    You have an Azure Active Directory (Azure AD) tenant named contoso.com.

    You have a CSV file that contains the names and email addresses of 500 external users.

    You need to create a guest user account in contoso.com for each of the 500 external users.

    Solution: You create a PowerShell script that runs the New-MgUser cmdlet for each external user.

    Does this meet the goal?
  choices:
    A: 'Yes'
    B: 'No'
  answer: B
  user_answer: B
  user_result: correct
  user_reasoning: Selected No because the required accounts are guest users.
  learning_note: |
    Use New-MgInvitation to onboard external B2B guests from their names and email addresses.
    New-MgUser creates user accounts and does not perform the external invitation workflow.
    Setting UserType to Guest alone does not establish B2B invitation and redemption.
  explanation: |
    Correct answer: **B. No.** The proposed script uses New-MgUser, which creates user
    accounts rather than performing the external B2B invitation workflow required here.

    Import the CSV and run **New-MgInvitation** for each external user, supplying their
    display name, email address, and an invitation redirect URL. This creates the guest
    object in contoso.com and provides an invitation redemption workflow so the external
    user can authenticate with their existing identity. Sending an invitation email is
    controlled by the SendInvitationMessage parameter.

    New-MgUser can create an account with UserType set to Guest, but that classification
    alone does not establish an external B2B identity or perform invitation redemption.
    Evaluate the proposed solution as stated without assuming an additional invitation step.

    Remember: External B2B guests — New-MgInvitation; tenant-created accounts — New-MgUser.
    Azure AD is now called Microsoft Entra ID.

    [Microsoft Learn: Add a guest user with PowerShell](https://learn.microsoft.com/en-us/entra/external-id/b2b-quickstart-invite-powershell)
