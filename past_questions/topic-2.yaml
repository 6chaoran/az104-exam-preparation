- id: '048'
  skill: Manage Azure identities and governance
  sub-skill: Manage Azure subscriptions and governance
  question_type: hotspot
  tags:
    - "exam topic: Manage Azure identities and governance"
    - Azure Policy
    - Tags
    - Policy exclusions
    - Tag inheritance
  question: |
    You have an Azure subscription named Sub1 that contains the following resources:

    | Name     | Type            |
    |----------|-----------------|
    | RG1      | Resource group  |
    | storage1 | Storage account |
    | VNET1    | Virtual network |

    You assign an Azure policy with the following settings:

    - Scope: Sub1
    - Exclusion: Sub1/RG1/VNET1
    - Policy definition: Append a tag and its value to resources
    - Policy enforcement: Enabled
    - Tag name: Tag4
    - Tag value: value4

    You assign the following tags:

    | Resource | Tag                |
    |----------|--------------------|
    | Sub1     | Tag1: subscription |
    | RG1      | Tag2: IT           |
    | storage1 | Tag3: value1       |
    | VNET1    | Tag3: value2       |

    For each statement, select Yes if the statement is true. Otherwise, select No. Each correct
    selection is worth one point.
  choices:
    "RG1 has the Tag2: IT tag assigned only":
      - Yes
      - No
    "storage1 has the Tag1: subscription, Tag2: IT, Tag3: value1, and Tag4: value4 tags assigned":
      - Yes
      - No
    "VNET1 has the Tag2: IT and Tag3: value2 tags assigned only":
      - Yes
      - No
  answer:
    "RG1 has the Tag2: IT tag assigned only": Yes
    "storage1 has the Tag1: subscription, Tag2: IT, Tag3: value1, and Tag4: value4 tags assigned": No
    "VNET1 has the Tag2: IT and Tag3: value2 tags assigned only": No
  user_answer:
    "RG1 has the Tag2: IT tag assigned only": No
    "storage1 has the Tag1: subscription, Tag2: IT, Tag3: value1, and Tag4: value4 tags assigned": No
    "VNET1 has the Tag2: IT and Tag3: value2 tags assigned only": No
  user_result: partially_correct
  user_reasoning: Expected RG1 and storage1 to receive Tag4, expected storage1 to retain Tag3 plus Tag4, and expected excluded VNET1 to retain only Tag3.
  learning_note: |
    The built-in policy named "Append a tag and its value to resources" explicitly does not apply
    to resource groups; Azure provides a separate resource-group policy. Subscription and resource
    group tags also do not automatically inherit to resources. Policy exclusions prevent the
    policy from evaluating the excluded resource.
  explanation: |
    Correct selections: **Yes, No, No.**

    - **RG1: Yes.** RG1 keeps only `Tag2: IT`. The exact built-in definition selected in the
      question, **Append a tag and its value to resources**, does not apply to resource groups.
      Azure provides a separate definition named **Append a tag and its value to resource groups**.
    - **storage1: No.** storage1 receives `Tag4: value4` from the policy and retains
      `Tag3: value1`. It does not inherit Tag1 from Sub1 or Tag2 from RG1, so the four-tag statement
      is false.
    - **VNET1: No.** VNET1 is excluded from the policy and keeps `Tag3: value2`. It does not inherit
      RG1's Tag2, so the two-tag statement is false.

    This resource-group limitation is not described separately in the scenario. It is part of the
    documented behavior of the named built-in policy and is tested by the question.

    [Microsoft Learn: Policy definitions for tag compliance](https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/tag-policies)
    [Microsoft Learn: Use tags to organize Azure resources](https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/tag-resources)
