- id: 791
  question: |
    You have a Microsoft Entra tenant named Adatum and an Azure Subscription named Subscription1.
    Adatum contains a group named Developers. Subscription1 contains a resource group named Dev.
    You need to provide the Developers group with the ability to create Azure logic apps in the Dev
    resource group.
    Solution: On Dev, you assign the Contributor role to the Developers group.
    Does this meet the goal?
  choices:
    A: Yes
    B: No
  answer: A
  explanation:
    - https://docs.microsoft.com/en-us/azure/role-based-access-control/built-in-roles
    - https://docs.microsoft.com/en-us/azure/logic-apps/logic-apps-securing-a-logic-app

- id: 792
  question: |
    You have an Azure Storage account named storage1. You need to enable a user named User1 to list and regenerate storage account keys for storage1.
    Solution: You assign the Storage Account Encryption Scope Contributor Role to User1.
    Does this meet the goal?
  choices:
    A: Yes
    B: No
  answer: B
  explanation: |
    The Storage Account Encryption Scope Contributor role manages encryption scopes used for encrypting blobs. It does not grant permission to list or regenerate storage account access keys.
    To meet the requirement, assign User1 the Storage Account Key Operator Service Role on storage1. This role includes permissions to:
    - List storage account keys
    - Regenerate storage account keys
    The relevant permissions are:
    - Microsoft.Storage/storageAccounts/listkeys/action
    - Microsoft.Storage/storageAccounts/regeneratekey/action
    Therefore, the proposed role does not meet the goal. See Microsoft’s documentation on managing storage account keys and Azure built-in roles.

- id: 793
  question: |
    You have an Azure container registry named Registry1 that contains an image named image1. You receive an error message when you attempt to deploy a container instance by using image1. You need to be able to deploy a container instance by using image1.
    Solution: You set Admin user to Enable for Registry1.
    Does this meet the goal?
  choices:
    A: Yes
    B: No
  answer: A
  explanation: |
    Azure Container Registry images are usually private, so Azure Container Instances must authenticate to Registry1 before pulling image1.
    Enabling Admin user for Registry1 creates registry credentials—a username and password—that can be used by ACI to authenticate and pull the image. Microsoft also states that the admin account is required when deploying an image from the Azure portal directly to Azure Container Instances.
    The deployment must still use the generated credentials. Therefore, enabling the admin user meets the goal: A: Yes.
    Microsoft recommends managed identities or service principals for production scenarios; the admin account is a simple exam-friendly solution.

- id: 794
  question: |
    You have an Azure virtual machine named VM1. VM1 was deployed by using a custom Azure Resource Manager template named ARM1.json. You receive a notification that VM1 will be affected by maintenance. You need to move VM1 to a different host immediately.
    Solution: From the resource group blade, move VM1 to another subscription.
    Does this meet the goal?
  choices:
    A: Yes
    B: No
  answer: B
  explanation: |
    Moving VM1 to another subscription changes where Azure manages the resource. It does not move the VM to a different physical Azure host, so it does not address the maintenance requirement.
    To move the VM to another host immediately, use:
    VM1 → Help → Redeploy + reapply → Redeploy
    Redeploying shuts down the VM, moves it to a new Azure host, and starts it again. The custom ARM template is irrelevant to this operation.
    You can also use:
    az vm redeploy \
    --resource-group <resource-group> \
    --name VM1
    Be aware that data on temporary or ephemeral disks can be lost, and dynamic IP addresses may change. Microsoft: Redeploy an Azure VM to a new node

- id: 795
  question: |
    You have a Microsoft Entra tenant. You plan to create a group for each department at your company. You need to ensure that user and group permissions meet the following requirements:
    – When a new user is added to the tenant, the user is automatically added to their department’s group.
    – If a user transfers to a different department, their user permissions to department resources must be updated automatically.
    – The solution must minimize administrative effort.
    Which two actions should you perform? (Each correct answer presents part of the solution. Choose two.)
  choices:
    A:    Create a security group that has the Assigned membership type.
    B:    Create a Conditional Access policy.
    C:    Create an Azure Resource Manager (ARM) template.
    D:    Create a security group that has the Dynamic User membership type.
    E:    Update the user properties.
    F:    Create a CSV file and import the file.
  answer: DE
  explanation: |
    Correct answers: **D and E**

    - **D: Create a security group with the Dynamic User membership type.**  
      Configure a dynamic membership rule based on the user’s **Department** attribute, such as:

      `user.department -eq "Finance"`

      Microsoft Entra automatically adds or removes users as their attributes match the rule.

    - **E: Update the user properties.**  
      When a user transfers departments, update their **Department** property. Entra ID recalculates dynamic group membership and automatically moves the user to the correct department group.

    Why the others are incorrect:

    - **A:** Assigned groups require manual membership management.
    - **B:** Conditional Access controls access conditions; it does not automatically manage department group membership.
    - **C:** ARM templates deploy Azure resources, not dynamic user membership behavior.
    - **F:** CSV imports are manual and do not automatically respond to department changes.


- id: 796
  question: |
    You have an Azure subscription that contains two users named User1 and User2. You need to enable self-service password reset (SSPR) for User1. The solution must ensure that SSPR is disabled for User2. What should you do first?
  choices: 
    A:    Disable security defaults.
    B:    Create a group.
    C:    Create an authentication context.
    D:    Configure an Authentication methods policy.

  explanation: |
    Correct answer: **B: Create a group.**

    To enable self-service password reset (SSPR) for specific users while ensuring it is disabled for others, you should first create a group in Microsoft Entra ID (Azure AD). You can then add User1 to this group and configure SSPR settings to apply only to members of that group. User2 will not be added to the group, thus SSPR will remain disabled for them.

    Why the others are incorrect:
    - **A:** Disabling security defaults is not necessary for enabling SSPR for specific users.
    - **C:** Authentication contexts are used for conditional access policies, not for enabling SSPR.
    - **D:** Configuring an Authentication methods policy is part of the process but comes after creating the group and assigning users to it.


- id: 797
  question: |
    You have an Azure subscription that contains a virtual machine named VM1 and two users named User1 and User2. You assign User1 the Contributor role for VM1. Which two actions can User1 perform on VM1? (Each correct answer presents a complete solution. Choose two.)
  choices:
    A:    Configure a daily backup.
    B:    Assign User2 the Contributor role for VM1.
    C:    Assign User2 the Reader role for VM1.
    D:    Add a data disk.
    E:    Upload an image of VM1 to an Azure compute gallery.
  explanation: |
    Correct answers: **A and D**

    - **A. Configure a daily backup.**  
      A Contributor assigned directly to VM1 can configure Azure VM backup. Azure Backup documentation lists VM-level VM management permissions as sufficient for enabling backup.

    - **D. Add a data disk.**  
      Contributor provides full management access to the VM, including modifying its attached disks.

    The other options are incorrect:

    - **B and C:** Contributor cannot assign Azure RBAC roles; this requires roles such as Owner or User Access Administrator.
    - **E:** Uploading an image to an Azure Compute Gallery requires permissions on the gallery. Contributor does not include gallery-sharing or role-assignment permissions.

    [Microsoft Learn: Azure Backup RBAC requirements](https://learn.microsoft.com/en-us/azure/backup/backup-rbac-rs-vault) and [Azure role definitions](https://learn.microsoft.com/en-us/azure/role-based-access-control/rbac-and-directory-admin-roles).

- id: 798
  question: |
    You have an Azure subscription. Your company has three external partners. You plan to deploy 10 virtual machines that will be used by the partners. You need to ensure that you can track the partners’ use of the virtual machines by using Microsoft Cost Management. The solution must minimize administrative effort. What should you do first?

  choices:
    A:    Create a tag for each partner.
    B:    Define a virtual machine naming strategy.
    C:    Enable VM insights.
    D:    Create three host groups.
  explanation: |
    Correct answer: **A. Create a tag for each partner.**

    Create tags such as:

    - `Partner = PartnerA`
    - `Partner = PartnerB`
    - `Partner = PartnerC`

    Apply the appropriate tag to each VM. Microsoft Cost Management can then group or filter costs by tag, making it easy to track each partner’s usage with minimal administration.

    - **B:** Naming helps identify VMs but does not provide Cost Management cost categorization.
    - **C:** VM Insights monitors performance; it does not track costs.
    - **D:** Host groups organize VM placement, not cost reporting.


- id: 799
  question: |
    You have an Azure subscription. You plan to create a storage account named storage1. You need to configure a deny assignment for storage1. What should you use?

  choices:
    A:    Azure Policy
    B:    a landing zone
    C:    a deployment stack
    D:    an Azure Resource Manager (ARM) template

  explanation: |
    Correct answer: **C. Create a deployment stack.**

    Azure deployment stacks can apply **deny settings**, which create a deny assignment that prevents specified actions—such as modifying or deleting resources—even when a user has permissions through an Azure RBAC role.

    - **Azure Policy:** Can deny resource deployments or changes through policy effects, but it does not directly create an Azure RBAC deny assignment.
    - **Landing zone:** Provides an overall Azure governance and architecture structure.
    - **ARM template:** Defines and deploys resources but cannot directly create a deny assignment.

    [Microsoft Learn: Azure deny assignments](https://learn.microsoft.com/en-us/azure/role-based-access-control/deny-assignments)


- id: 800
  question: |
    You have an Azure subscription that contains three virtual machines named VM1, VM2, and VM3. All the virtual machines are in an availability set named AVSet1. You need to scale up VM1 to a new virtual machine size, but the intended size is unavailable. What should you do first?

  choices:
    A:    Create a proximity placement group.
    B:    Deallocate VM1.
    C:    Convert AvSet1 into a managed availability set.
    D:    Shut down VM3 and VM3.

  explanation: |
    Correct answer: **B. Deallocate VM1.**

    A VM may not show a desired size while it is running. Deallocating VM1 releases its current compute allocation and may make additional VM sizes available. You can then resize VM1 and start it again.

    If the size is still unavailable because the availability set’s current hardware cluster does not support it, deallocate **all VMs in AVSet1**—VM1, VM2, and VM3—before resizing.

    - **A:** Proximity placement groups do not make unavailable VM sizes available.
    - **C:** Converting the availability set is unnecessary.
    - **D:** Shutting down only VM2 and VM3 is not the initial step.

    [Microsoft Learn: Resize a virtual machine](https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/resize-vm)


- id: 801
  question: |
    You have a Standard Azure App Service plan named Plan1. You need to ensure that Plan1 will scale automatically when the CPU usage of the web app exceeds 80 percent. What should you select for Plan1?

  choices:
    A:    Automatic in the Scale up method settings.
    B:    Automatic in the Scale out method settings.
    C:    Premium P1 in the Scale up (App Service plan) settings.
    D:    Standard S1 in the Scale up (App Service plan) settings.
    E:    Manual in the Scale out method settings.

  explanation: |
    Correct answer: **B. Automatic in the Scale out method settings.**

    - **Scale out** adds more VM instances when demand increases.
    - Configure an autoscale rule so that when CPU usage exceeds **80%**, another instance is added.
    - **Scale up** changes the App Service plan’s pricing tier or VM size; it does not automatically respond to CPU usage.

    Therefore, select **Automatic** under **Scale out**.

    C and D are **Scale up** options:

    - **C: Premium P1** changes Plan1 to a larger/more capable pricing tier.
    - **D: Standard S1** keeps the plan at the Standard tier.

    Neither option configures automatic instance scaling based on CPU usage. The requirement is to add instances when CPU exceeds 80%, which is **scale out**, so the correct answer is **B**.


- id: 802
  question: |
    You have an Azure subscription. You need to create an Azure container instance named cont1. The solution must meet the following requirements:
    – Ensure that specific configuration parameters are applied to cont1 during the container startup.
    – Provide secure values to cont1 during the container startup.
    What should you configure for cont1?
  choices:
    A:    environment variables
    B:    a command override
    C:    tags
    D:    customer-managed keys
  explanation: |
    Correct answer: **A. Environment variables**

    Configure normal environment variables for startup parameters and **secure environment variables** for sensitive values such as passwords or connection strings. Secure values are passed to the container at startup and aren’t exposed in the container’s metadata.

    - **B:** Overrides the startup command.
    - **C:** Adds resource metadata.
    - **D:** Encrypts data with customer-managed keys but does not pass startup configuration values.

- id: 803
  question: |
    You plan to move a distributed on-premises app named App1 to an Azure subscription. After the planned move, App1 will be hosted on nine Azure virtual machines. You need to ensure that App1 always runs on at least eight virtual machines during planned Azure maintenance. What should you create?
  choices:
    A: one Availability Set that has 10 update domains and one fault domain
    B: one virtual machine scale set that has 12 virtual machine instances
    C: one virtual machine scale set that has 10 virtual machine instances
    D: one Availability Set that has three fault domains and one update domain

  explanation: |
    You’re correct: **C is the expected answer.** My earlier answer of A was incorrect.

    Create a VM Scale Set with **10 instances**. Azure distributes them across **five update domains**, so approximately two instances are affected when one update domain undergoes planned maintenance. The remaining **eight instances** continue running.

    The explanation should say **“update domains,” not “update zones.”**

    Why A is incorrect: an availability set with **one fault domain and 10 update domains** is not a valid configuration; Azure constrains the relationship between fault and update domains. Option B would overprovision with 12 instances.

    [Microsoft Learn: Availability sets](https://learn.microsoft.com/en-us/azure/virtual-machines/availability-set-overview) | [Microsoft Learn: Planned maintenance](https://learn.microsoft.com/en-us/azure/virtual-machines/maintenance-notifications)

- id: 804
  question: |
    You plan to automate the deployment of a virtual machine scale set that uses the Windows Server Datacenter image. You need to ensure that when the scale set virtual machines are provisioned, they have web server components installed. Which two actions should you perform? (Each correct answer presents part of the solution. Choose two.)
  choices:
    A: Create a new virtual machine scale set in the Azure portal.
    B: Upload a configuration script.
    C: Modify the extensionProfile section of the Azure Resource Manager template.
    D: Create an Azure policy.
    E: Create an automation account.
  answer: BC
  user_answer: AC
  user_result: partially_correct
  user_reasoning: Believed creating the VMSS was a required step and was unsure whether extensionProfile was used to add the Windows Server image.
  learning_note: Revisit automated ARM template deployment and the distinction between imageReference and extensionProfile.
  explanation: |
    Correct answers: **B and C**

    Upload a configuration script that installs the required web server components, such as the IIS Web Server role. Then modify the `extensionProfile` section of the Azure Resource Manager template to configure a VM extension, such as the Custom Script Extension or PowerShell DSC Extension, to download and run that script on the scale set instances.

    Because the extension is part of the scale set model, it runs when new virtual machines are provisioned and applies the configuration consistently.

    - **A:** The ARM template automates creation of the scale set. Creating one manually in the portal is unnecessary and does not install the web server components.
    - **D:** Azure Policy is not the standard mechanism for executing an installation script during VM provisioning.
    - **E:** An Azure Automation account is not required when a VM extension executes the configuration script.

    The Windows Server image is selected in `virtualMachineProfile.storageProfile.imageReference`. The `extensionProfile` does not select the operating system; it defines configuration or installation tasks that run inside each VM instance after provisioning.

    [Microsoft Learn: Create a Windows VM scale set with an ARM template](https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/quick-create-template-windows)

- id: 805
  question: |
    You have an Azure subscription. You create an Azure container registry and a container image. You need to push the container image to the container registry by using the Azure Command-Line Interface (CLI). You sign in to the container registry. Which action should you perform next?
  choices:
    A: Tag a container image with the name of the container registry's login server.
    B: List the images in the container registry.
    C: Deploy a container group.
    D: Configure a YAML file.
  answer: A
  user_answer: A
  user_result: correct
  user_reasoning: Selected tagging the image with the container registry login server as the next action after signing in.
  explanation: |
    Correct answer: **A. Tag a container image with the name of the container registry's login server.**

    After signing in to Azure Container Registry (ACR), tag the local image with the registry's fully qualified login server. The tag identifies the destination registry and repository. Then push the tagged image.

    The typical workflow is:

    1. Sign in: `az acr login --name <registry-name>`
    2. Tag: `docker tag <local-image>:<tag> <login-server>/<repository>:<tag>`
    3. Push: `docker push <login-server>/<repository>:<tag>`

    - **B:** Listing images is normally performed after the push to verify that the image is in the registry.
    - **C:** Deploying a container group runs an image in Azure Container Instances; it does not upload the image to ACR.
    - **D:** A YAML file can define a container deployment but is not required to tag or push an image.

    Exam memory aid: **Build or pull → Sign in → Tag → Push → Verify or deploy.**

    [Microsoft Learn: Create an Azure container registry and push an image using the Azure CLI](https://learn.microsoft.com/en-us/azure/container-registry/container-registry-get-started-azure-cli)

- id: 806
  question: |
    You have an Azure subscription that contains a storage account named storage1. You need to allow access to storage1 from selected networks and your home office. The solution must minimize administrative effort. What should you do first for storage1?
  choices:
    A: Add a private endpoint.
    B: Modify the Public network access settings.
    C: Select Internet routing.
    D: Modify the Access Control (IAM) settings.
  answer: B
  user_answer: B
  user_result: correct
  user_reasoning: Recognized that selected public network and IP rules meet the requirement with less administration than private connectivity.
  explanation: |
    Correct answer: **B. Modify the Public network access settings.**

    Configure Public network access as **Enabled from selected virtual networks and IP addresses**. You can then allow the required Azure virtual networks or subnets and add the home office's public IPv4 address or CIDR range to the storage firewall.

    Although the storage account continues to use its public endpoint, it is not open to every network. The firewall accepts traffic only from explicitly allowed networks and IP addresses.

    - **A:** A private endpoint provides access through a private IP address in a virtual network. The home office would also need private connectivity, such as a VPN or ExpressRoute, and appropriate DNS configuration. This requires more administrative effort.
    - **C:** Internet routing controls the network route used by storage traffic. It does not restrict which source networks can access the storage account.
    - **D:** Access Control (IAM) controls what an authenticated identity can do. It does not control the networks from which connections are accepted.

    Exam distinction: network settings determine whether a connection can reach the storage account; IAM, shared access signatures, and access keys determine what an authorized caller can do after reaching it.

    The home office must use a known public IPv4 address. If that address changes, the storage firewall rule must be updated.

    [Microsoft Learn: Azure Storage firewall and network access rules](https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security)

- id: 807
  question: |
    You have an Azure subscription that contains two peered virtual networks named VNet1 and VNet2. VNet1 has a VPN gateway that uses static routing. The on-premises network has a VPN connection that uses the VPN gateway of VNet1. You need to configure access for users on the on-premises network to connect to a virtual machine on VNet2. The solution must minimize costs. Which type of connectivity should you use?
  choices:
    A: Azure Firewall with a private IP address.
    B: Service chaining and user-defined routes (UDRs).
    C: Azure Application Gateway.
    D: ExpressRoute circuits to VNet2.
  answer: B
  user_answer: B
  user_result: correct
  user_reasoning: Recognized that VNet1 and VNet2 are peered, but assumed that they therefore share the same network access.
  learning_note: VNet peering provides direct VNet-to-VNet connectivity but is not automatically transitive to an on-premises network. Revisit service chaining, UDRs, and gateway transit.
  explanation: |
    Correct answer: **B. Service chaining and user-defined routes (UDRs).**

    VNet peering provides direct connectivity between resources in VNet1 and VNet2, but it does not automatically make connectivity transitive from the on-premises network through VNet1 to VNet2.

    Service chaining uses user-defined routes to direct traffic through a gateway or network virtual appliance in a peered virtual network. This solution reuses the existing VPN gateway and VNet peering, minimizing additional cost. The on-premises VPN device must also include VNet2's address space in the traffic routed through the VPN tunnel.

    - **A:** Azure Firewall can inspect and forward traffic, but it adds substantial recurring cost and is unnecessary solely to provide this connectivity.
    - **C:** Azure Application Gateway is a Layer 7 load balancer and reverse proxy for HTTP and HTTPS traffic. It does not provide general network routing between on-premises networks and VNet2.
    - **D:** ExpressRoute provides dedicated private connectivity but is considerably more expensive than reusing the existing VPN connection.

    Exam distinction: VNet peering is non-transitive by default. Gateway transit allows a peered VNet to use a supported gateway in another VNet, while service chaining and UDRs explicitly direct traffic through a gateway or network virtual appliance in a peered VNet.

    [Microsoft Learn: Azure Virtual Network peering](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-peering-overview)
