- id: '036'
  question: |
    You have an Azure Active Directory (Azure AD) tenant named contoso.onmicrosoft.com that contains
    100 user accounts. You purchase 10 Azure AD Premium P2 licenses for the tenant.

    You need to ensure that 10 users can use all the Azure AD Premium features. What should you do?
  choices:
    A: From the Licenses blade of Azure AD, assign a license.
    B: From the Groups blade of each user, invite the users to a group.
    C: From the Azure AD domain, add an enterprise application.
    D: From the Directory role blade of each user, modify the directory role.
  answer: A
  user_answer: A
  user_result: correct
  learning_note: Purchased Premium licenses must be assigned to the intended users. Group membership alone, enterprise applications, and directory roles do not assign licenses.
  explanation: |
    Correct answer: **A. From the Licenses blade of Azure AD, assign a license.**

    Assign the 10 purchased Premium P2 licenses to the 10 intended users. Buying licenses for the
    tenant does not automatically license particular users. Group-based licensing can also assign
    licenses, but merely adding users to a group does not do so unless the group has a license assigned.
    An enterprise application provides application access, while a directory role grants administrative
    permissions; neither gives a user a Premium P2 license.

    This legacy question uses Azure AD terminology. The current product name is Microsoft Entra ID.
    Current license assignment is managed through the Microsoft 365 admin center.

    [Microsoft Learn: Assign or unassign licenses for users](https://learn.microsoft.com/en-us/azure/active-directory/license-users-groups)
