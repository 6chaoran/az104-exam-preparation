- id: 001
  question: |
    Your company has several departments. Each department has a number of virtual machines (VMs).
    The company has an Azure subscription that contains a resource group named RG1. All VMs are
    located in RG1. You want to associate each VM with its respective department. What should you do?
  choices:
    A: Create Azure Management Groups for each department.
    B: Create a resource group for each department.
    C: Assign tags to the virtual machines.
    D: Modify the settings of the virtual machines.
  answer: C
  user_answer: C
  user_result: correct
  user_reasoning: Correctly selected tags as the way to associate each virtual machine with its respective department while keeping all VMs in RG1.
  learning_note: Azure tags are name-value pairs used to categorize resources by properties such as department, environment, owner, or cost center without changing the resource hierarchy.
  explanation: |
    Correct answer: **C. Assign tags to the virtual machines.**

    Add a tag such as `Department: Finance` or `Department: HR` to each VM. Tags provide metadata
    that can categorize and identify resources even when the resources remain in the same resource
    group.

    Management groups organize Azure subscriptions rather than individual virtual machines. Creating
    a resource group for every department would require moving the VMs and is unnecessary when the
    requirement is only to associate them with departments. Modifying VM settings does not provide a
    standard resource-classification mechanism.

    [Microsoft Learn: Use tags to organize your Azure resources and management hierarchy](https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/tag-resources)
- id: 002
  question: |
    Note: This question is included in a series of questions that depict the identical setup. However,
    every question has a distinctive result. Determine whether the solution satisfies the requirements.

    Your company has an Azure Active Directory (Azure AD) subscription. You want to implement an
    Azure AD Conditional Access policy. The policy must be configured to require members of the
    Global Administrators group to use Multi-Factor Authentication and an Azure AD-joined device when
    they connect to Azure AD from untrusted locations.

    Solution: You access the multi-factor authentication page to alter the user settings.

    Does the solution meet the goal?
  choices:
    A: Yes
    B: No
  answer: B
  user_answer: B
  user_result: correct
  user_reasoning: Correctly recognized that the requirement must be applied to the Global Administrators group rather than configured only through individual users' multi-factor authentication settings.
  learning_note: Per-user MFA cannot evaluate group or directory-role membership, trusted locations, and device state together. Use a Conditional Access policy when access requirements depend on these signals.
  explanation: |
    Correct answer: **B. No.**

    The multi-factor authentication page manages per-user MFA settings. It does not create a
    Conditional Access policy and cannot enforce all the required conditions, including the
    administrator assignment, untrusted location, and device state.

    Create a Conditional Access policy that targets the Global Administrator directory role, applies
    when users connect from locations outside the configured trusted named locations, and uses the
    required grant controls for MFA and the required device state.

    [Microsoft Learn: Conditional Access overview](https://learn.microsoft.com/en-us/entra/identity/conditional-access/overview)
- id: 003
  question: |
    Note: This question is included in a series of questions that depict the identical setup. However,
    every question has a distinctive result. Determine whether the solution satisfies the requirements.

    Your company has an Azure Active Directory (Azure AD) subscription. You want to implement an
    Azure AD Conditional Access policy. The policy must be configured to require members of the
    Global Administrators group to use Multi-Factor Authentication and an Azure AD-joined device when
    they connect to Azure AD from untrusted locations.

    Solution: You access the Azure portal to alter the session control of the Azure AD Conditional
    Access policy.

    Does the solution meet the goal?
  choices:
    A: Yes
    B: No
  answer: B
  user_answer: B
  user_result: correct
  user_reasoning: Correctly selected No because changing session controls does not enforce the required MFA and device conditions.
  learning_note: Conditional Access session controls govern the user's session after access is granted. Authentication and device requirements are configured with grant controls, while role and location targeting are configured under assignments and conditions.
  explanation: |
    Correct answer: **B. No.**

    Session controls manage aspects of a session after access is granted, such as sign-in frequency,
    persistent browser sessions, or application-enforced restrictions. They do not require users to
    complete MFA or use an Azure AD-joined device.

    The Conditional Access policy must target the Global Administrator role, apply to connections
    from locations outside the configured trusted locations, and use grant controls to enforce MFA
    and the required device state.

    [Microsoft Learn: Conditional Access session controls](https://learn.microsoft.com/en-us/entra/identity/conditional-access/concept-conditional-access-session)
- id: 004
  question: |
    Your company has an Azure Active Directory (Azure AD) subscription. You want to implement an
    Azure AD Conditional Access policy. The policy must be configured to require members of the
    Global Administrators group to use Multi-Factor Authentication and an Azure AD-joined device when
    they connect to Azure AD from untrusted locations.

    Solution: You access the Azure portal to alter the grant control of the Azure AD Conditional
    Access policy.

    Does the solution meet the goal?
  choices:
    A: Yes
    B: No
  answer: A
  user_answer: A
  user_result: correct
  user_reasoning: Correctly selected Yes because Conditional Access grant controls specify the authentication and device requirements that must be satisfied before access is granted.
  learning_note: Grant controls enforce access requirements such as MFA and an eligible device state. Assignments and conditions separately determine which users or roles, applications, and locations are covered by the policy.
  explanation: |
    Correct answer: **A. Yes.**

    Conditional Access grant controls define the requirements that users must satisfy before access
    is granted. They can require Multi-Factor Authentication and an appropriate device state, such as
    a compliant or hybrid Azure AD-joined device.

    The policy's assignments and conditions are used separately to target the Global Administrator
    role and connections from outside the configured trusted locations. Therefore, altering the grant
    controls is the appropriate way to enforce the stated MFA and device requirements.

    [Microsoft Learn: Conditional Access grant controls](https://learn.microsoft.com/en-us/entra/identity/conditional-access/concept-conditional-access-grant)

- id: 005
  question: |
    You are planning to deploy an Ubuntu Server virtual machine to your company's Azure subscription.
    You are required to implement a custom deployment that includes adding a particular trusted root certification authority (CA).
    Which of the following should you use to create the virtual machine?
  choices:
    A: The New-AzureRmVM cmdlet.
    B: The New-AzVM cmdlet.
    C: The Create-AzVM cmdlet.
    D: The az vm create command.
  answer: D
  user_answer: D
  user_result: correct
  user_reasoning: Guessed that the Azure CLI command was the appropriate method for the customized Ubuntu deployment.
  learning_note: For an Ubuntu VM that must be customized during first boot, associate `az vm create` with the `--custom-data` option and a cloud-init configuration. `Create-AzVM` is not a valid cmdlet, and `New-AzureRmVM` belongs to the retired AzureRM module.
  explanation: |
    Correct answer: **D. The `az vm create` command.**

    Use `az vm create` with the `--custom-data` option to pass a cloud-init configuration to the Ubuntu VM. The cloud-init file can place the required CA certificate on the machine and update Ubuntu's trusted certificate store during initial provisioning.

    - **A:** `New-AzureRmVM` belongs to the retired AzureRM PowerShell module and has been replaced by the Az module.
    - **B:** `New-AzVM` is the current PowerShell cmdlet for creating an Azure VM and can technically participate in a customized deployment when a VM configuration and extensions or user data are configured. However, it is not the intended answer here; the question targets the documented Linux cloud-init workflow exposed directly by `az vm create --custom-data`.
    - **C:** `Create-AzVM` is not a standard Azure PowerShell cmdlet. The valid cmdlet is `New-AzVM`.
    - **D:** `az vm create` directly supports the `--custom-data` parameter used to supply a cloud-init file for an Ubuntu VM.

    Windows Server nuance: Windows does not process Linux cloud-init configuration. For a Windows VM, use a Windows-compatible customization mechanism, such as the Custom Script Extension or PowerShell Desired State Configuration, to import the certificate into `Cert:\\LocalMachine\\Root`. Both Azure CLI and Azure PowerShell can deploy Windows VMs, so the creation command alone does not install the certificate.

    Exam memory aid: **Linux first-boot customization = cloud-init; Azure CLI passes it with `az vm create --custom-data`.**

    [Microsoft Learn: Overview of cloud-init support for Linux VMs in Azure](https://learn.microsoft.com/en-us/azure/virtual-machines/linux/using-cloud-init)

- id: 006
  question: |
    Note: This question is included in a series of questions that depict the identical setup. However,
    each question has a distinctive result. Determine whether the solution satisfies the requirements.

    Your company uses Multi-Factor Authentication when users are outside the office. The Per
    Authentication option has been configured as the usage model.

    After the company acquires a smaller business and adds its employees to Azure Active Directory
    (Azure AD), you are informed that these employees must also use Multi-Factor Authentication.
    To achieve this, the Per Enabled User setting must be used as the usage model.

    Solution: You reconfigure the existing usage model through the Azure portal.

    Does the solution meet the goal?
  choices:
    A: Yes
    B: No
  answer: B
  user_answer: B
  user_result: correct
  user_reasoning: Correctly determined that the existing MFA provider cannot be reconfigured from the Per Authentication usage model to Per Enabled User.
  learning_note: An MFA provider's usage model is fixed when the provider is created. Switching between Per Authentication and Per Enabled User requires a new provider rather than reconfiguring the existing one.
  explanation: |
    Correct answer: **B. No.**

    The usage model of an Azure Multi-Factor Authentication provider is selected when the provider
    is created. It cannot later be changed from **Per Authentication** to **Per Enabled User** by
    reconfiguring the existing provider in the Azure portal. A new MFA provider configured with the
    required usage model would be needed.

    - **Per Authentication:** Billing is based on the number of MFA requests performed against the tenant.
    - **Per Enabled User:** Billing is based on the number of users enabled or eligible to use MFA.

    This question uses legacy Azure Active Directory and consumption-based MFA provider terminology.
    In current environments, Microsoft Entra MFA is generally enforced through Conditional Access,
    security defaults, or per-user MFA.

    Exam memory aid: **An MFA provider's billing model is fixed at creation.**

    [Microsoft Learn: Microsoft Entra multifactor authentication providers](https://learn.microsoft.com/en-us/entra/identity/authentication/concept-mfa-authprovider)

- id: 007
  question: |
    Note: This question is included in a series of questions that depict the identical setup. However,
    each question has a distinctive result. Determine whether the solution satisfies the requirements.

    Your company's Azure solution uses Multi-Factor Authentication when users are outside the office.
    The Per Authentication option has been configured as the usage model.

    After the company acquires a smaller business and adds its employees to Azure Active Directory
    (Azure AD), you are informed that these employees must also use Multi-Factor Authentication.
    To achieve this, the Per Enabled User setting must be used as the usage model.

    Solution: You create a new Multi-Factor Authentication provider with a backup of the existing
    Multi-Factor Authentication provider data.

    Does the solution meet the goal?
  choices:
    A: Yes
    B: No
  answer: A
  user_answer: A
  user_result: correct
  user_reasoning: Correctly selected Yes because the historical procedure required creating a new MFA provider with the Per Enabled User model and migrating the existing MFA Server data.
  learning_note: Historically, changing an MFA provider's fixed usage model required backing up the MFA Server data, creating a new provider with the required model, restoring the data, and reactivating the server. This workflow is obsolete because Microsoft stopped allowing new MFA providers after September 1, 2018.
  explanation: |
    Historical exam answer: **A. Yes.**

    An existing Azure Multi-Factor Authentication provider could not be changed from **Per
    Authentication** to **Per Enabled User**. In the historical MFA Server workflow, the solution was
    to back up the existing MFA Server data, create a new MFA provider configured with the required
    usage model, restore the data, and reactivate the server using credentials from the new provider.
    Therefore, the proposed solution met the goal at the time this question was written.

    Current-product caveat: This procedure is obsolete. Effective September 1, 2018, Microsoft no
    longer permits the creation of new MFA providers. Existing providers can continue to operate, but
    this historical migration cannot be initiated today. Current deployments should use Microsoft
    Entra MFA with Conditional Access, security defaults, per-user MFA, or appropriate licenses.

    Exam memory aid: **Historically, a different MFA billing model required a new provider; the model
    of an existing provider could not be changed.**

    [Microsoft Learn: Microsoft Entra multifactor authentication providers](https://learn.microsoft.com/en-us/entra/identity/authentication/concept-mfa-authprovider)

- id: 008
  question: |
    Your company has an Azure Active Directory (Azure AD) tenant named weyland.com that is configured
    for hybrid coexistence with an on-premises Active Directory domain.

    You have a server named DirSync1 that is configured as a directory synchronization server. You
    create a new user account in the on-premises Active Directory. You need to replicate the user
    information to Azure AD immediately.

    Solution: You run the following PowerShell cmdlet:

    `Start-ADSyncSyncCycle -PolicyType Initial`

    Does the solution meet the goal?
  choices:
    A: Yes
    B: No
  answer: A
  user_answer: A
  user_result: correct
  user_reasoning: Correctly recognized that an Initial synchronization cycle starts immediately and includes the new on-premises user in the data synchronized to Azure AD.
  learning_note: Both Initial and Delta synchronization cycles start immediately and can synchronize a newly created user. Delta is more efficient for routine object changes, while Initial performs a full import and synchronization and is normally used after synchronization-rule changes.
  explanation: |
    Correct answer: **A. Yes.**

    `Start-ADSyncSyncCycle -PolicyType Initial` immediately triggers a full synchronization cycle.
    The cycle performs a full import, full synchronization, and export, so the new on-premises user
    is synchronized to Azure AD. The proposed solution therefore meets the stated goal.

    A Delta cycle would be the more efficient choice for this routine change:

    `Start-ADSyncSyncCycle -PolicyType Delta`

    A Delta cycle processes changes since the previous synchronization and is sufficient for a newly
    created user. However, the question asks whether the proposed Initial cycle works, not whether it
    is the most efficient approach.

    This question uses dated product names. Azure AD is now Microsoft Entra ID, and the relevant
    synchronization service is Microsoft Entra Connect Sync.

    Exam memory aid: **Delta for routine changes; Initial for a full synchronization. Both can be
    started immediately.**

    [Microsoft Learn: Microsoft Entra Connect ADSync PowerShell reference](https://learn.microsoft.com/en-us/entra/identity/hybrid/connect/reference-connect-adsync)

- id: 009
  question: |
    Your company has a Microsoft Azure subscription.
    The company has datacenters in Los Angeles and New York.
    You are configuring the two datacenters as geo-clustered sites for site resiliency.

    You need to recommend an Azure storage redundancy option. The data storage requirements are:

    - Data must be stored on multiple nodes.
    - Data must be stored on nodes in separate geographic locations.
    - Data must be readable from the secondary location as well as from the primary location.

    Which Azure storage redundancy option should you recommend?
  choices:
    A: Geo-redundant storage
    B: Read-access geo-redundant storage
    C: Zone-redundant storage
    D: Locally redundant storage
  answer: B
  user_answer: B
  user_result: correct
  user_reasoning: Correctly identified RA-GRS and selected option B, despite the question using the older wording "read-only geo-redundant storage."
  learning_note: RA-GRS replicates data to a secondary geographic region and exposes the secondary endpoint for read access. Standard GRS also replicates to another region, but clients cannot read from the secondary endpoint unless failover occurs.
  explanation: |
    Correct answer: **B. Read-access geo-redundant storage (RA-GRS).**

    RA-GRS stores multiple copies of the data in the primary region and asynchronously replicates
    the data to a secondary geographic region. It also provides a secondary endpoint that clients
    can use for read access, satisfying the requirement to read data from both locations.

    - **A:** GRS provides geographic replication, but the secondary endpoint is not available for
      client reads unless a failover occurs.
    - **C:** ZRS replicates across availability zones within a single region, not across separate
      geographic regions.
    - **D:** LRS keeps multiple copies within one physical location in the primary region.

    Exam memory aid: **If the secondary region must be readable before failover, choose RA-GRS.**

    [Microsoft Learn: Azure Storage redundancy](https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy)

- id: '010'
  question: |
    Note: This question is included in a series of questions that depict the identical setup. However,
    each question has a distinctive result. Determine whether the solution satisfies the requirements.

    Your company has an Azure subscription that includes a storage account, a resource group, a blob
    container, and a file share.

    A colleague named Jon Ross uses a single Azure Resource Manager (ARM) template to deploy a virtual
    machine and an additional Azure Storage account. You want to review the ARM template that Jon Ross
    used.

    Solution: You access the Virtual Machine blade.

    Does the solution meet the goal?
  choices:
    A: Yes
    B: No
  answer: B
  user_answer: B
  user_result: correct
  user_reasoning: Correctly recognized that the Virtual Machine blade does not provide the original deployment template containing both the VM and the additional storage account.
  learning_note: To inspect the ARM template used for a deployment, open the resource group's Deployments page and select the relevant deployment. Exporting a template from an individual resource shows its current configuration and related resources, not necessarily the original deployment template.
  explanation: |
    Correct answer: **B. No.**

    Accessing the Virtual Machine blade does not display the original ARM template Jon Ross used to
    deploy both the virtual machine and the additional storage account. A template exported from the
    VM represents the resource's current configuration and related dependencies; it is not necessarily
    identical to the original deployment template.

    To review the template used for the deployment, open the resource group, select **Deployments**,
    choose the relevant deployment, and view its template.

    Exam memory aid: **Original deployment template = Resource group > Deployments; current resource
    configuration = Export template.**

    [Microsoft Learn: View deployment history with Azure Resource Manager](https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/deployment-history)

