- id: '013'
  question: |
    Your company has three virtual machines (VMs) that are included in an availability set.

    You try to resize one of the VMs, which returns an allocation failure message. It is imperative
    that the VM is resized.

    Which action should you take?
  choices:
    A: Stop only one of the VMs.
    B: Stop two of the VMs.
    C: Stop all three VMs.
    D: Remove the VM that must be resized from the availability set.
  answer: C
  user_answer: C
  user_result: correct
  user_reasoning: Correctly remembered that all VMs in the availability set must be stopped and deallocated when an in-place resize fails because the requested size is unavailable on the current hardware cluster.
  learning_note: VMs in an availability set are placed together on a hardware cluster. If the requested size is unavailable there, stop and deallocate every VM in the availability set before resizing so Azure can move the set to a cluster that supports the required sizes.
  explanation: |
    Correct answer: **C. Stop all three VMs.**

    Virtual machines in an availability set are placed together on a hardware cluster. An allocation
    failure during an in-place resize can mean that the requested VM size is unavailable on the
    current cluster. Stop and deallocate all VMs in the availability set, resize the required VM, and
    then restart the VMs. This allows Azure to reallocate the set on hardware that supports the
    requested size.

    Stopping only one or two VMs does not release the allocation for the entire availability set.
    Removing the VM from the availability set is unnecessary and cannot be performed directly after
    the VM has been created without recreating it.

    Exam memory aid: **Availability-set resize allocation failure = deallocate every VM in the set.**

    [Microsoft Learn: Resize a virtual machine](https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/resize-vm)

- id: '014'
  question: |
    You have an Azure virtual machine (VM) that has a single data disk. You have been tasked with
    attaching this data disk to another Azure VM.

    You need to make sure that your strategy allows the virtual machines to be offline for the least
    amount of time possible.

    Which action should you take first?
  choices:
    A: Stop the VM that includes the data disk.
    B: Stop the VM to which the data disk must be attached.
    C: Detach the data disk.
    D: Delete the VM that includes the data disk.
  answer: C
  user_answer: C
  user_result: correct
  user_reasoning: Correctly remembered that Azure VMs support hot detachment and attachment of data disks, so the VMs do not need to be stopped first.
  learning_note: Azure data disks can be detached from and attached to running VMs. Before detaching a disk, stop applications that use it and unmount or take it offline inside the guest operating system to prevent data loss or corruption.
  explanation: |
    Correct answer: **C. Detach the data disk.**

    Azure supports hot attachment and detachment of data disks, so neither VM must be stopped. First
    ensure that applications are no longer using the disk and unmount or take it offline inside the
    guest operating system. Then detach it from the source VM and attach it to the destination VM.

    Stopping either VM would introduce unnecessary downtime, while deleting the source VM is not
    required to move its data disk.

    Exam memory aid: **Move a data disk with minimum downtime = unmount, detach, and attach without
    stopping the VMs.**

    [Microsoft Learn: Detach a data disk from a Windows virtual machine](https://learn.microsoft.com/en-us/azure/virtual-machines/windows/detach-disk)

- id: '015'
  question: |
    Your company has an Azure subscription.

    You need to deploy a number of Azure virtual machines (VMs) using Azure Resource Manager (ARM)
    templates. You have been informed that the VMs will be included in a single availability set.

    You must configure the ARM template so that as many VMs as possible remain accessible during a
    fabric failure or maintenance event.

    Which value should you configure for the `platformFaultDomainCount` property?
  choices:
    A: 10
    B: 30
    C: Minimum value
    D: Maximum value
  answer: D
  user_answer: B
  user_result: incorrect
  user_reasoning: Correctly reasoned that using more fault domains distributes VMs across more failure boundaries, but incorrectly assumed that 30 was the maximum fault-domain count.
  learning_note: Configure `platformFaultDomainCount` to the maximum value supported in the deployment region. Availability sets generally support two or three fault domains depending on the region; 30 is not a valid maximum. Fault domains isolate hardware failures, whereas update domains group VMs for planned maintenance.
  explanation: |
    Correct answer: **D. Maximum value.**

    Fault domains represent independent groups of underlying hardware that share a power source and
    network switch. Using the maximum fault-domain count supported by the region distributes the VMs
    across the greatest number of failure boundaries, minimizing how many are affected by a fabric
    failure.

    The reasoning that more fault domains provide better distribution is correct, but **30 is not the
    maximum fault-domain count**. Availability sets generally support two or three fault domains,
    depending on the Azure region. Fault domains should not be confused with update domains, which
    determine the groups of VMs that can undergo planned maintenance together.

    Exam memory aid: **For maximum availability, use the maximum supported fault-domain count.**

    [Microsoft Learn: Availability-set ARM template reference](https://learn.microsoft.com/en-us/azure/templates/microsoft.compute/2024-03-01/availabilitysets)

- id: '016'
  question: |
    Your company has an Azure subscription.

    You need to deploy a number of Azure virtual machines (VMs) using Azure Resource Manager (ARM)
    templates. You have been informed that the VMs will be included in a single availability set.

    You must configure the ARM template so that as many VMs as possible remain accessible during a
    fabric failure or maintenance event.

    Which value should you configure for the `platformUpdateDomainCount` property?
  choices:
    A: 10
    B: 20
    C: 30
    D: 40
  answer: B
  user_answer: C
  user_result: incorrect
  user_reasoning: Correctly reasoned that the maximum supported update-domain count should be used to minimize the number of VMs affected at once, but incorrectly recalled the maximum as 30 instead of 20.
  learning_note: An availability set supports up to 20 update domains. During planned maintenance, Azure restarts only one update domain at a time, so using more update domains distributes the VMs into smaller maintenance groups.
  explanation: |
    Correct answer: **B. 20.**

    Update domains are logical groups of VMs and underlying hardware that can be restarted together
    during planned Azure maintenance. Azure restarts only one update domain at a time. Configuring the
    maximum of 20 update domains therefore minimizes the number of VMs that might be unavailable
    simultaneously.

    Do not confuse update domains with fault domains. An availability set can have up to 20 update
    domains but generally only two or three fault domains, depending on the region.

    Exam memory aid: **Maximum fault domains = 3; maximum update domains = 20.**

    [Microsoft Learn: Availability sets overview](https://learn.microsoft.com/en-us/azure/virtual-machines/availability-set-overview)

- id: '017'
  question: |
    You downloaded an Azure Resource Manager (ARM) template that deploys multiple virtual machines
    (VMs). The template is based on an existing VM, but it must be adapted to reference an
    administrator password.

    You need to ensure that the password is not stored in plain text. You are preparing to create the
    necessary component.

    Which option should you create?
  choices:
    A: An Azure Key Vault
    B: An Azure Storage account
    C: Azure Active Directory Identity Protection
    D: An access policy
    E: An Azure policy
    F: A backup policy
  answer: A
  user_answer: A
  user_result: correct
  user_reasoning: Correctly selected Azure Key Vault as the service used to store the administrator password securely as a secret rather than in plain text.
  learning_note: Store the password as a Key Vault secret and reference it through a `secureString` ARM-template parameter. Enable the vault for template deployment and grant the deployment identity the required deployment permission. A separate Key Vault access policy is needed only for identities that directly manage secrets and may be replaced by Azure RBAC.
  explanation: |
    Correct answer: **A. An Azure Key Vault.**

    Store the administrator password as a secret in Azure Key Vault, then pass the secret to the ARM
    template through a `secureString` parameter. This prevents the password from being stored in
    plain text in the template or parameter file.

    For ARM to retrieve the secret, enable the vault for template deployment and ensure that the
    deployment identity has the `Microsoft.KeyVault/vaults/deploy/action` permission. An access policy
    is not another required selection in this question: access policies or Azure RBAC permissions are
    used when an identity must directly create, retrieve, or manage secrets. The storage account,
    Identity Protection, Azure Policy, and backup policy do not provide secret storage for this use
    case.

    Exam memory aid: **Secret value in an ARM deployment = Key Vault plus a `secureString` reference.**

    [Microsoft Learn: Use Azure Key Vault to pass a secure parameter value during deployment](https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/key-vault-parameter)

- id: '018'
  question: |
    Your company has an Azure Active Directory (Azure AD) tenant configured for hybrid coexistence
    with an on-premises Active Directory domain.

    The on-premises virtual environment consists of virtual machines (VMs) running on Windows Server
    2012 R2 Hyper-V host servers. You created PowerShell scripts to automate the configuration of
    newly created VMs and plan to create several new VMs.

    You need a solution that ensures the scripts run on the new VMs. Which solution should you use?
  choices:
    A: Configure a SetupComplete.cmd batch file in the `%WINDIR%\Setup\Scripts` directory.
    B: Configure a Group Policy Object (GPO) to run the scripts as logon scripts.
    C: Configure a Group Policy Object (GPO) to run the scripts as startup scripts.
    D: Place the scripts in a new virtual hard disk (VHD).
  answer: A
  user_answer: A
  user_result: correct
  user_reasoning: Correctly selected `SetupComplete.cmd`, which Windows Setup runs automatically after installation and which can invoke the PowerShell configuration scripts.
  learning_note: Windows Setup searches for `%WINDIR%\Setup\Scripts\SetupComplete.cmd` and runs it after setup finishes but before the sign-in screen appears. The batch file can invoke PowerShell scripts to perform one-time configuration of newly deployed Windows VMs.
  explanation: |
    Correct answer: **A. Configure a `SetupComplete.cmd` batch file in the
    `%WINDIR%\Setup\Scripts` directory.**

    Windows Setup automatically executes `SetupComplete.cmd` after installation completes and before
    the sign-in screen appears. The batch file can call the PowerShell scripts, ensuring each newly
    created VM receives its required configuration as part of the deployment process.

    A logon script requires a user to sign in. A GPO startup script depends on domain and Group Policy
    processing and can run again on later startups. Simply placing scripts on a VHD does not cause
    them to execute.

    Exam memory aid: **One-time configuration after Windows deployment = `SetupComplete.cmd`.**

    [Microsoft Learn: Add a custom script to Windows Setup](https://learn.microsoft.com/en-us/windows-hardware/manufacture/desktop/add-a-custom-script-to-windows-setup)

- id: '019'
  question: |
    Your company has an Azure Active Directory (Azure AD) tenant configured for hybrid coexistence
    with an on-premises Active Directory domain.

    You plan to deploy several new virtual machines (VMs) in Azure. The VMs will have the same
    operating system and custom software requirements.

    You configure a reference VM in the on-premises virtual environment and then generalize the VM to
    create an image. You need to upload the image to Azure so that it can be used when creating the
    new Azure VMs.

    Which PowerShell cmdlet should you use?
  choices:
    A: Add-AzVM
    B: Add-AzVhd
    C: Add-AzImage
    D: Add-AzImageDataDisk
  answer: B
  user_answer: B
  user_result: correct
  user_reasoning: Correctly selected `Add-AzVhd` to upload the VHD containing the generalized on-premises VM image to Azure.
  learning_note: "`Add-AzVhd` uploads an on-premises VHD to a managed disk or storage account in Azure. The uploaded generalized OS disk can then be used to create an Azure image resource and deploy multiple VMs with the same operating system and software configuration."
  explanation: |
    Correct answer: **B. `Add-AzVhd`.**

    `Add-AzVhd` uploads the VHD containing the generalized on-premises VM to Azure. After the upload,
    the generalized OS disk can be used to create an Azure managed image and deploy multiple VMs
    with the same configuration.

    `Add-AzVM` and `Add-AzImage` are not the appropriate VHD upload cmdlets.
    `Add-AzImageDataDisk` adds a data-disk definition to an image configuration object; it does not
    upload the source VHD.

    Exam memory aid: **Upload an on-premises VHD to Azure = `Add-AzVhd`.**

    [Microsoft Learn: Add-AzVhd](https://learn.microsoft.com/en-us/powershell/module/az.compute/add-azvhd)

- id: '020'
  question: |
    Your company has an Azure subscription that includes several Azure virtual machines (VMs), all
    of which are part of the same virtual network.

    Your company also has an on-premises Hyper-V server that hosts a VM named VM1. VM1 must be
    replicated to Azure.

    Which objects must be created to achieve this goal? Select all that apply.
  choices:
    A: Hyper-V site
    B: Storage account
    C: Azure Recovery Services vault
    D: Azure Traffic Manager instance
    E: Replication policy
    F: Endpoint
  answer:
    - A
    - B
    - C
    - E
  user_answer:
    - C
  user_result: incorrect
  user_reasoning: Correctly identified the Azure Recovery Services vault but omitted the Hyper-V site, storage account, and replication policy required by the Hyper-V-to-Azure Site Recovery workflow.
  learning_note: Hyper-V VM replication to Azure Site Recovery requires a Recovery Services vault, a Hyper-V site for registering the host, a storage account for replicated VM data, and a replication policy. Traffic Manager and an endpoint are not required for replication.
  explanation: |
    Correct selections: **A. Hyper-V site, B. Storage account, C. Azure Recovery Services vault,
    and E. Replication policy.**

    The Recovery Services vault stores Site Recovery metadata and configuration. The on-premises
    Hyper-V host is registered with a Hyper-V site. The storage account holds replicated VM data, and
    the replication policy defines settings such as replication frequency and recovery-point
    retention.

    Azure Traffic Manager and an endpoint are not required to replicate the VM. The question states
    that an Azure virtual network already exists, so a new virtual network is not another required
    selection.

    Exam memory aid: **Hyper-V to Azure Site Recovery = vault + Hyper-V site + storage account +
    replication policy.**

    [Microsoft Learn: Prepare Azure resources for Hyper-V disaster recovery](https://learn.microsoft.com/en-us/azure/site-recovery/tutorial-prepare-azure-for-hyperv)

- id: '021'
  question: |
    Note: This question is included in a series of questions that depict the identical setup. However,
    each question has a distinctive result. Determine whether the solution satisfies the requirements.

    Your company's Azure subscription includes two virtual networks named VirtualNetworkA and
    VirtualNetworkB. VirtualNetworkA includes a VPN gateway configured to use static routing. A
    site-to-site VPN connection exists between the company's on-premises network and VirtualNetworkA.

    You configure a point-to-site VPN connection to VirtualNetworkA from a Windows 10 workstation.
    After configuring virtual network peering between VirtualNetworkA and VirtualNetworkB, you confirm
    that the on-premises network can access VirtualNetworkB. However, the Windows 10 workstation
    cannot connect to VirtualNetworkB.

    You must ensure that the Windows 10 workstation can connect to VirtualNetworkB.

    Solution: You select **Allow gateway transit** on VirtualNetworkA.

    Does the solution meet the goal?
  choices:
    A: Yes
    B: No
  answer: B
  user_answer: A
  user_result: incorrect
  user_reasoning: Incorrectly selected Yes. Enabling gateway transit does not update the routes in the point-to-site VPN profile already installed on the Windows 10 workstation.
  learning_note: Point-to-site VPN clients must be downloaded and installed again after virtual-network peering is configured so that the new peered-network routes are included. Gateway transit controls use of a gateway across peering but does not refresh an existing client profile.
  explanation: |
    Correct answer: **B. No.**

    Selecting **Allow gateway transit** on VirtualNetworkA does not update the routes already present
    in the Windows 10 point-to-site VPN client profile. Because the virtual-network peering was added
    after the P2S connection was configured, the VPN client package must be downloaded and installed
    again so that it includes the route to VirtualNetworkB.

    Gateway transit normally uses complementary peering settings: **Allow gateway transit** on the
    VNet containing the gateway and **Use remote gateways** on the peered VNet. However, the scenario
    confirms that the on-premises network can already access VirtualNetworkB, indicating that the
    gateway path is functional. The workstation's stale P2S routes are the remaining problem.

    Exam memory aid: **Add VNet peering after configuring P2S = redownload the VPN client.**

    [Microsoft Learn: Create, change, or delete virtual-network peering](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-manage-peering)

- id: '022'
  question: |
    Note: This question is included in a series of questions that depict the identical setup. However,
    each question has a distinctive result. Determine whether the solution satisfies the requirements.

    Your company's Azure subscription includes two virtual networks named VirtualNetworkA and
    VirtualNetworkB. VirtualNetworkA includes a VPN gateway configured to use static routing. A
    site-to-site VPN connection exists between the company's on-premises network and VirtualNetworkA.

    You configure a point-to-site VPN connection to VirtualNetworkA from a Windows 10 workstation.
    After configuring virtual network peering between VirtualNetworkA and VirtualNetworkB, you confirm
    that the on-premises network can access VirtualNetworkB. However, the Windows 10 workstation
    cannot connect to VirtualNetworkB.

    You must ensure that the Windows 10 workstation can connect to VirtualNetworkB.

    Solution: You download and reinstall the VPN client configuration package on the Windows 10
    workstation.

    Does the solution meet the goal?
  choices:
    A: Yes
    B: No
  answer: A
  user_answer: A
  user_result: correct
  user_reasoning: Correctly selected Yes because reinstalling the point-to-site VPN client package updates the workstation with routes for the newly peered virtual network.
  learning_note: Point-to-site VPN clients do not automatically receive routes introduced by later virtual-network peering changes. Download and reinstall the client configuration package after peering is configured to install the new routes.
  explanation: |
    Correct answer: **A. Yes.**

    The point-to-site VPN client profile was created before VirtualNetworkA and VirtualNetworkB were
    peered, so it does not contain the route to VirtualNetworkB. Downloading and reinstalling the VPN
    client configuration package supplies the Windows 10 workstation with the updated routes and
    enables it to reach the peered virtual network.

    Exam memory aid: **Peering added after P2S configuration = download and reinstall the VPN client
    package.**

    [Microsoft Learn: Create, change, or delete virtual-network peering](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-manage-peering)

- id: '023'
  question: |
    Your company has virtual machines (VMs) hosted in Microsoft Azure. The VMs are located in a
    single Azure virtual network named VNet1.

    The company has users who work remotely and require access to the VMs on VNet1.

    What should you configure to provide access for the remote workers?
  choices:
    A: A Site-to-Site (S2S) VPN
    B: A VNet-to-VNet VPN
    C: A Point-to-Site (P2S) VPN
    D: DirectAccess on a Windows Server 2012 server VM
    E: A Multi-Site VPN
  answer: C
  user_answer: C
  user_result: correct
  user_reasoning: Correctly selected a Point-to-Site VPN, which connects individual remote users' devices securely to an Azure virtual network.
  learning_note: Use a Point-to-Site VPN when individual client computers need secure access to an Azure virtual network. Site-to-Site and Multi-Site VPNs connect entire on-premises networks, while VNet-to-VNet VPNs connect Azure virtual networks.
  explanation: |
    Correct answer: **C. Configure a Point-to-Site (P2S) VPN.**

    A P2S VPN establishes a secure connection from each remote worker's computer to the Azure VPN
    gateway for VNet1, allowing the user to access the VMs in the virtual network.

    A Site-to-Site VPN connects an entire on-premises network to Azure, a VNet-to-VNet VPN connects
    two Azure virtual networks, and a Multi-Site VPN connects multiple on-premises sites. DirectAccess
    on a Windows Server VM is not the appropriate Azure-native solution for this requirement.

    Exam memory aid: **Individual remote devices = P2S; an entire office network = S2S.**

    [Microsoft Learn: About Point-to-Site VPN](https://learn.microsoft.com/en-us/azure/vpn-gateway/point-to-site-about)

- id: '024'
  question: |
    Note: This question is included in a series of questions that depict the identical setup. However,
    each question has a distinctive result. Determine whether the solution satisfies the requirements.

    Your company has a Microsoft SQL Server Always On availability group configured on Azure virtual
    machines (VMs).

    You need to configure an Azure internal load balancer as a listener for the availability group.

    Solution: You create an HTTP health probe on port 1433.

    Does the solution meet the goal?
  choices:
    A: Yes
    B: No
  answer: B
  user_answer: B
  user_result: correct
  user_reasoning: Correctly recognized that a SQL Server Always On availability-group listener requires a TCP health probe rather than an HTTP probe.
  learning_note: Configure the internal load balancer with a TCP health probe on a dedicated port that is also configured on the availability-group cluster resource, commonly port 59999. Port 1433 is normally used for SQL Server listener and client traffic, not for the health probe.
  explanation: |
    Correct answer: **B. No.**

    An Azure internal load balancer for a SQL Server Always On availability-group listener should use
    a **TCP** health probe, not an HTTP probe. The probe should use a dedicated port configured on the
    availability-group cluster resource, commonly port 59999, rather than SQL Server's client
    connection port 1433.

    Exam memory aid: **SQL Always On internal load balancer = TCP probe on a dedicated probe port.**

    [Microsoft Learn: Configure an availability group listener for SQL Server on Azure VMs](https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/availability-group-load-balancer-portal-configure)

- id: '027'
  question: |
    Your company has two on-premises servers named SRV01 and SRV02. Developers have created an
    application that runs on SRV01. The application calls a service on SRV02 by IP address.

    You plan to migrate the application to Azure virtual machines (VMs). You have configured two VMs
    on a single subnet in an Azure virtual network.

    You need to configure the two VMs with static internal IP addresses.

    What should you do?
  choices:
    A: Run the New-AzureRmVMConfig PowerShell cmdlet.
    B: Run the Set-AzureSubnet PowerShell cmdlet.
    C: Modify the VM properties in the Azure Management Portal.
    D: Modify the IP properties in Windows Network and Sharing Center.
    E: Run the Set-AzureStaticVNetIP PowerShell cmdlet.
  answer: E
  user_answer: E
  user_result: correct
  user_reasoning: Correctly selected the Azure PowerShell cmdlet that assigns a static internal IP address to a VM in the legacy Azure deployment model.
  learning_note: Configure a VM's private IP address through Azure rather than manually inside the guest operating system. This question uses the legacy `Set-AzureStaticVNetIP` cmdlet; for current Azure Resource Manager VMs, configure static private IP allocation on the network interface's IP configuration.
  explanation: |
    Correct answer: **E. Run the `Set-AzureStaticVNetIP` PowerShell cmdlet.**

    In the legacy Azure deployment model used by this question, `Set-AzureStaticVNetIP` assigns a
    static internal IP address to a virtual machine. Azure then reserves and supplies that address to
    the VM.

    Do not configure the address manually in Windows Network and Sharing Center. Azure private IP
    assignments should be managed by the Azure platform. `New-AzureRmVMConfig` creates a VM
    configuration object, while `Set-AzureSubnet` associates a VM configuration with a subnet; neither
    assigns the required static internal address.

    In current Azure Resource Manager deployments, set the private IP allocation method to **Static**
    on each VM's network interface IP configuration by using the Azure portal, Azure CLI, or the Az
    PowerShell module.

    Exam memory aid: **Set the private IP in Azure, not inside the guest OS.**

    [Microsoft Learn: Configure private IP addresses for a virtual machine](https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/virtual-network-network-interface-addresses)

