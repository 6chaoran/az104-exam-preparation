- id: '028'
  question: |
    Your company has an Azure Active Directory (Azure AD) subscription.

    You need to deploy five virtual machines (VMs) to your company's virtual network subnet. The VMs
    will each have both a public and private IP address. Inbound and outbound security rules for all
    of these virtual machines must be identical.

    Which of the following is the least number of network interfaces needed for this configuration?
  choices:
    A: 5
    B: 10
    C: 20
    D: 40
  answer: A
  user_answer: A
  user_result: correct
  user_reasoning: Correctly determined that each of the five VMs needs only one network interface because a single NIC can provide the VM's private IP configuration and be associated with a public IP address.
  learning_note: Every Azure VM requires at least one NIC. A NIC receives a private IP address from the subnet, and a public IP resource can be associated with that NIC's IP configuration. Identical rules can be applied with a shared network security group, so extra NICs are unnecessary.
  explanation: |
    Correct answer: **A. 5.**

    Each virtual machine requires at least one network interface. A single NIC has a private IP
    configuration and can also be associated with a public IP address, so each VM does not require
    separate interfaces for its public and private addresses.

    The identical inbound and outbound rules can be defined in one network security group (NSG) and
    associated with the subnet or with the five NICs. This requirement does not increase the number
    of interfaces.

    Therefore, five VMs multiplied by one NIC per VM equals **five network interfaces**.

    Exam memory aid: **A public IP is associated with a NIC's IP configuration; it does not require a
    second NIC.**

    [Microsoft Learn: Network interfaces for Azure virtual machines](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-network-interface)

- id: '029'
  question: |
    Your company has an Azure Active Directory (Azure AD) subscription.

    You need to deploy five virtual machines (VMs) to your company's virtual network subnet. The VMs
    will each have both a public and private IP address. Inbound and outbound security rules for all
    of these virtual machines must be identical.

    Which of the following is the least number of network security groups needed for this configuration?
  choices:
    A: 4
    B: 3
    C: 2
    D: 1
  answer: D
  user_answer: D
  user_result: correct
  user_reasoning: Correctly determined that one shared network security group can provide identical inbound and outbound rules for all five VMs.
  learning_note: A network security group (NSG) can be associated with the subnet, applying the same rules to resources in that subnet. Public and private IP addresses do not require separate NSGs.
  explanation: |
    Correct answer: **D. 1.**

    Create one network security group (NSG) containing the required inbound and outbound rules and
    associate it with the subnet. The rules then apply consistently to all five VMs in that subnet.

    The VMs' public and private IP addresses do not require separate NSGs. An NSG can also be
    associated with individual NICs, but using one subnet-level NSG is the least amount needed here.

    Exam memory aid: **Identical rules for every VM in one subnet = one shared NSG.**

    [Microsoft Learn: Network security groups](https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview)

- id: '030'
  question: |
    Your company's Azure subscription includes Azure virtual machines (VMs) that run Windows Server
    2016. One of the VMs is backed up every day using Azure Backup Instant Restore.

    When the VM becomes infected with data-encrypting ransomware, you decide to recover the VM's files.

    Which of the following is TRUE in this scenario?
  choices:
    A: You can only recover the files to the infected VM.
    B: You can recover the files to any VM within the company's subscription.
    C: You can only recover the files to a new VM.
    D: You will not be able to recover the files.
  answer: B
  user_answer: B
  user_result: correct
  user_reasoning: Correctly recognized that Azure Backup Instant Restore supports recovering individual files to another VM in the subscription, which is useful when the original VM is infected.
  learning_note: Instant Restore allows individual files and folders to be recovered from a VM recovery point without restoring the entire VM. The recovered files can be copied to another compatible VM in the subscription.
  explanation: |
    Correct answer: **B. You can recover the files to any VM within the company's subscription.**

    Azure Backup Instant Restore lets you mount a VM recovery point and recover individual files and
    folders. The recovered files can be copied to another compatible VM, allowing recovery even when
    the original VM is infected with ransomware.

    You are not limited to the infected VM, required to create a new VM, or prevented from recovering
    the files. In practice, the target VM must meet the applicable operating-system and access
    requirements for the file-recovery workflow.

    Exam memory aid: **Instant Restore can recover individual files to another VM.**

    [Microsoft Learn: Restore files from an Azure VM backup](https://learn.microsoft.com/en-us/azure/backup/backup-azure-restore-files-from-vm)

- id: '031'
  question: |
    Your company's Azure subscription includes Azure virtual machines (VMs) that run Windows Server
    2016. One of the VMs is backed up every day using Azure Backup Instant Restore.

    When the VM becomes infected with data-encrypting ransomware, you are required to restore the VM.

    Which of the following actions should you take?
  choices:
    A: Restore the VM after deleting the infected VM.
    B: Restore the VM to any VM within the company's subscription.
    C: Restore the VM to a new Azure VM.
    D: Restore the VM to an on-premises Windows device.
  answer: C
  user_answer: C
  user_result: correct
  user_reasoning: Correctly selected restoring the recovery point as a new Azure VM so that the infected VM is not reused or overwritten during recovery.
  learning_note: Azure Backup can create a new VM from a recovery point. For ransomware recovery, restore a clean recovery point to a new VM and validate it before returning it to service.
  explanation: |
    Correct answer: **C. Restore the VM to a new Azure VM.**

    Select a recovery point created before the ransomware infection and use the **Create new VM**
    restore option. This creates a separate VM from the clean recovery point without depending on or
    overwriting the infected VM.

    Deleting the infected VM first is unnecessary and removes an asset that might be needed for
    investigation. A whole-VM restore does not restore the backup into an arbitrary existing VM or
    directly to an on-premises Windows device.

    Exam memory aid: **Ransomware-infected VM = restore a clean recovery point to a new Azure VM.**

    [Microsoft Learn: About the Azure Virtual Machine restore process](https://learn.microsoft.com/en-us/azure/backup/about-azure-vm-restore)

- id: '032'
  question: |
    You administer a solution in Azure that is currently experiencing performance issues.

    You need to find the cause of the performance issues by examining metrics from the Azure
    infrastructure.

    Which of the following tools should you use?
  choices:
    A: Azure Traffic Analytics
    B: Azure Monitor
    C: Azure Activity Log
    D: Azure Advisor
  answer: B
  user_answer: A
  user_result: incorrect
  user_reasoning: Selected Azure Traffic Analytics, but that service focuses on analyzing network traffic flows rather than general infrastructure performance metrics.
  learning_note: Azure Monitor collects, stores, and analyzes platform metrics for Azure resources. Use Traffic Analytics for network flow visibility, Activity Log for control-plane events, and Advisor for optimization recommendations.
  explanation: |
    Correct answer: **B. Azure Monitor.**

    Azure Monitor collects and analyzes numeric, time-series metrics from Azure resources. Metrics
    such as CPU utilization, disk operations, network throughput, and availability can help identify
    the cause of infrastructure performance problems.

    - **A:** Azure Traffic Analytics analyzes network flow logs and traffic patterns. It is useful
      when the investigation specifically concerns network traffic, but it is not the general tool
      for Azure infrastructure metrics.
    - **C:** Azure Activity Log records subscription-level control-plane events, such as resource
      creation or configuration changes, rather than resource performance metrics.
    - **D:** Azure Advisor analyzes configurations and usage telemetry to provide recommendations; it
      is not the primary metrics investigation tool.

    Exam memory aid: **Performance metrics = Azure Monitor.**

    [Microsoft Learn: Azure Monitor Metrics overview](https://learn.microsoft.com/en-us/azure/azure-monitor/essentials/data-platform-metrics)

- id: '033'
  question: |
    Your company has an Azure subscription that includes a Recovery Services vault.

    You want to use Azure Backup to schedule a backup of your company's virtual machines (VMs) to
    the Recovery Services vault.

    Which of the following VMs can you back up? Choose all that apply.
  choices:
    A: VMs that run Windows 10.
    B: VMs that run Windows Server 2012 or higher.
    C: VMs that have not been shut down.
    D: VMs that run Debian 8.2 or later.
    E: VMs that have been shut down.
  answer: A, B, C, D, E
  user_answer: A, B, C, D
  user_result: incorrect
  user_reasoning: Selected the listed operating systems and running VMs, but omitted shut-down VMs, which Azure Backup can also back up.
  learning_note: Azure VM backup supports both running and shut-down or deallocated VMs. A backup taken while the VM is shut down is crash-consistent rather than application-consistent. Operating system and agent support can vary by backup mode and version.
  explanation: |
    Correct answer: **A, B, C, D, and E.**

    Azure Backup can protect Azure VMs running the listed Windows and Linux operating systems,
    subject to the applicable operating system and agent requirements. It also backs up VMs whether
    they are running or shut down. A shut-down VM produces a crash-consistent snapshot because the
    guest operating system cannot coordinate an application-consistent backup while offline.

    Exam memory aid: **A VM does not need to be running for Azure Backup to back it up.**

    [Microsoft Learn: Support matrix for Azure VM backups](https://learn.microsoft.com/en-us/azure/backup/backup-support-matrix-iaas)

