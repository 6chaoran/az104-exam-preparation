    - AzCopy
  question: |
    Note: This question is part of a series of questions that present the same
    scenario. Each question in the series contains a unique solution that might
    meet the stated goals. Some question sets might have more than one correct
    solution, while others might not have a correct solution.

    After you answer a question in this section, you will NOT be able to return
    to it. As a result, these questions will not appear in the review screen.

    You deploy an Azure Kubernetes Service (AKS) cluster named AKS1.

    You need to deploy a YAML file to AKS1.

    Solution: From Azure CLI, you run azcopy.

    Does this meet the goal?
  choices:
    A: Yes
    B: No
  answer: B
  user_answer: B
  user_result: correct
  learning_note: |
    AzCopy transfers data to, from, or between Azure Storage accounts. Deploy
    Kubernetes YAML manifests to AKS with kubectl apply -f.
  explanation: |
    **B — No** is correct.

    AzCopy is a data-transfer utility for Azure Storage. It does not apply
    Kubernetes YAML manifests or create the Kubernetes resources they describe.
    Copying a YAML file to storage is not the same as deploying it to AKS.

    Configure kubectl to connect to AKS1, then apply the YAML file:

    ```bash
    az aks get-credentials --resource-group <resource-group> --name AKS1
    kubectl apply -f <file.yaml>
    ```

    **A — Yes** is incorrect because AzCopy cannot deploy Kubernetes resources.

    Remember: AzCopy transfers storage data; kubectl deploys Kubernetes manifests.

    [Microsoft Learn: Get started with AzCopy](https://learn.microsoft.com/en-us/azure/storage/common/storage-use-azcopy-v10)
    [Microsoft Learn: Deploy an AKS cluster using Azure CLI](https://learn.microsoft.com/en-us/azure/aks/learn/quick-kubernetes-deploy-cli)
- id: '004'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  tags:
    - "exam topic: Monitor and maintain Azure resources"
    - Azure Monitor
    - Log Analytics
    - Windows event logs
    - Log search alerts
    - Microsoft Monitoring Agent
  question: |
    Note: This question is part of a series of questions that present the same
    scenario. Each question in the series contains a unique solution that might
    meet the stated goals. Some question sets might have more than one correct
    solution, while others might not have a correct solution.

    After you answer a question in this section, you will NOT be able to return
    to it. As a result, these questions will not appear in the review screen.

    You have an Azure virtual machine named VM1 that runs Windows Server 2016.

    You need to create an alert in Azure when more than two error events are
    logged to the System event log on VM1 within an hour.

    Solution: You create an Azure storage account and configure shared access
    signatures (SASs). You install the Microsoft Monitoring Agent on VM1. You
    create an alert in Azure Monitor and specify the storage account as the source.

    Does that meet the goal?
  choices:
    A: Yes
    B: No
  answer: B
  user_answer: B
  user_result: correct
  learning_note: |
    Use a Log Analytics workspace to collect and query Windows event logs, then
    create a log search alert. A storage account and SAS tokens do not provide
    the required event-count alert source.
  explanation: |
    **B — No** is correct.

    The requirement is to count System error events from VM1 during a one-hour
    window and trigger an alert when the count exceeds two. Selecting a storage
    account as the alert source does not provide a query over VM1's Windows
    event logs. SAS tokens authorize access to storage data; they do not collect
    event logs or evaluate an event-count condition.

    The appropriate solution is to collect System error events into a Log
    Analytics workspace and create an Azure Monitor log search alert scoped to
    that workspace. Filter for VM1, the System log, and Error severity. Set the
    query time window to one hour and the matching-row count threshold to
    greater than two (three or more events).

    **A — Yes** is incorrect because installing an agent alone does not configure
    the necessary event collection, workspace destination, and log alert.

    This older question refers to the Microsoft Monitoring Agent (MMA), also
    called the Log Analytics agent. Current deployments use Azure Monitor Agent
    (AMA) with a data collection rule (DCR) to send Windows events to a Log
    Analytics workspace, where they are stored in the Event table.

    [Microsoft Learn: Collect Windows events with Azure Monitor Agent](https://learn.microsoft.com/en-us/azure/azure-monitor/vm/data-collection-windows-events)
    [Microsoft Learn: Create log search alerts](https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-create-log-alert-rule)
    [Microsoft Learn: Migrate to Azure Monitor Agent](https://learn.microsoft.com/en-us/azure/azure-monitor/agents/azure-monitor-agent-migration)
- id: '005'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  tags:
    - "exam topic: Deploy and manage Azure compute resources"
    - Virtual machine migration
    - Network interfaces
    - Virtual networks
    - Managed disks
  question: |
    HOTSPOT

    You have an Azure subscription named Subscription1. Subscription1 contains
    the resources in the following table.

    | Name | Type |
    |------|------|
    | RG1 | Resource group |
    | RG2 | Resource group |
    | VNet1 | Virtual network |
    | VNet2 | Virtual network |

    VNet1 is in RG1. VNet2 is in RG2. There is no connectivity between VNet1 and VNet2.

    An administrator named Admin1 creates an Azure virtual machine named VM1 in
    RG1. VM1 uses a disk named Disk1 and connects to VNet1.

    Admin1 then installs a custom application in VM1.

    You need to move the custom application to VNet2. The solution must minimize
    administrative effort.

    Which two actions should you perform? To answer, select the appropriate
    options in the answer area.

    NOTE: Each correct selection is worth one point.
  choices:
    First action:
      - Create a network interface in RG2.
      - Detach a network interface.
      - Delete VM1.
      - Move a network interface to RG2.
    Second action:
      - Attach a network interface.
      - Create a network interface in RG2.
      - Create a new virtual machine.
      - Move VM1 to RG2.
  answer:
    First action: Delete VM1.
    Second action: Create a new virtual machine.
  user_answer:
    First action: Detach a network interface.
    Second action: Attach a network interface.
  user_result: incorrect
  learning_note: |
    A VM must always have at least one NIC, and all its NICs must connect to the
    same VNet. To move this workload to a different VNet, preserve the existing
    disk and recreate the VM using that disk and a NIC connected to the target VNet.
    Moving a resource to another resource group does not change its VNet.
  explanation: |
    Correct selections:

    - **First action: Delete VM1.** Retain Disk1 when deleting the VM resource.
    - **Second action: Create a new virtual machine.** Reuse the existing OS disk
      containing the installed application and connect the new VM to VNet2.

    Reusing the disk preserves the operating system and installed application,
    avoiding an application reinstall. The expected solution assumes Disk1 is
    the OS disk containing the application; retain any required data disks too.
    In actual administration, check disk deletion settings before deleting the VM.

    **Why can't you detach the old NIC and attach a new NIC connected to VNet2?**

    Azure prevents both possible sequences:

    - **Detach the old NIC first:** VM1 would have no NIC. Azure requires a VM
      to always have at least one NIC, even when stopped and deallocated.
    - **Attach the VNet2 NIC first:** VM1 would have NICs in two different VNets.
      Azure requires all NICs attached to a VM to belong to the same VNet.

    Therefore, you cannot swap VM1's only NIC across VNets by changing the order.
    An existing NIC's VNet cannot be changed, although its subnet can be changed
    within that VNet.

    Retaining the OS disk, deleting the VM resource, and creating a new VM with
    that disk and a NIC in VNet2 avoids these restrictions. The installed
    application stays on the disk.

    Creating a NIC in RG2 alone does not move the application, and a resource
    group's location in the resource hierarchy does not determine VNet membership.
    Moving VM1 or its NIC to RG2 therefore does not reconnect it to VNet2.

    [Microsoft Learn: Add or remove VM network interfaces](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-network-interface-vm)
    [Microsoft Learn: Virtual networks and virtual machines](https://learn.microsoft.com/en-us/azure/virtual-network/network-overview)
- id: '006'
  skill: Deploy and manage Azure compute resources
  sub-skill: Automate deployment of resources by using Azure Resource Manager (ARM) templates or Bicep files
  tags:
    - "exam topic: Deploy and manage Azure compute resources"
    - ARM templates
    - Azure Key Vault
    - Secrets
    - Virtual machines
    - Access policies
  question: |
    You download an Azure Resource Manager template based on an existing virtual
    machine. The template will be used to deploy 100 virtual machines.

    You need to modify the template to reference an administrative password.
    You must prevent the password from being stored in plain text.

    What should you create to store the password?
  choices:
    A: an Azure Key Vault and an access policy
    B: an Azure Storage account and an access policy
    C: a Recovery Services vault and a backup policy
    D: Azure Active Directory (AD) Identity Protection and an Azure policy
  answer: A
  user_answer: A
  user_result: correct
  learning_note: |
    Store deployment passwords as Key Vault secrets and reference them from ARM
    parameters. A secureString parameter protects deployment handling but does
    not remove a plaintext password hard-coded in a template or parameter file.
  explanation: |
    **A — An Azure Key Vault and an access policy** is correct.

    Key Vault stores the administrative password as a secret. Reference the
    vault resource ID and secret name in the ARM parameter file, and declare
    the password parameter as secureString in the template. ARM retrieves the
    secret during deployment, so the deployment files do not contain the
    plaintext password. The same reference can support deploying 100 VMs.

    Access policies control direct access to secrets under the vault access
    policy permission model. For ARM to retrieve the secret during deployment,
    also enable enabledForTemplateDeployment on the vault and ensure the
    deploying identity has Microsoft.KeyVault/vaults/deploy/action permission.
    A secret access policy alone does not grant ARM deployment access, and a
    deploying user does not need direct secret access merely to use this reference.

    Why the other options are incorrect:

    - B: Azure Storage is for storing data, not the intended secret-management
      service for securely supplying an ARM deployment password.
    - C: Recovery Services vaults and backup policies manage backup and recovery,
      not deployment secrets.
    - D: Identity Protection detects identity risks, and Azure Policy enforces
      resource governance. Neither stores deployment passwords. Azure Active
      Directory is now named Microsoft Entra ID.

    Remember: Deployment password storage → Key Vault secret; secure parameter
    handling → secureString; ARM secret retrieval → template deployment access.

    [Microsoft Learn: Use Azure Key Vault to pass secure parameter values during deployment](https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/key-vault-parameter)
- id: '007'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure Azure App Service
  tags:
    - "exam topic: Deploy and manage Azure compute resources"
    - App Service plans
    - Runtime stacks
    - Windows
    - Linux
    - Azure regions
  question: |
    HOTSPOT

    You have the App Service plans shown in the following table.

    | Name | Operating system | Location |
    |------|------------------|----------|
    | ASP1 | Windows | West US |
    | ASP2 | Windows | Central US |
    | ASP3 | Linux | West US |

    You plan to create the Azure web apps shown in the following table.

    | Name | Runtime stack | Location |
    |------|---------------|----------|
    | WebApp1 | .NET Core 3.0 | West US |
    | WebApp2 | ASP.NET 4.7 | West US |

    You need to identify which App Service plans can be used for the web apps.

    What should you identify? To answer, select the appropriate options in the
    answer area.

    NOTE: Each correct selection is worth one point.
  choices:
    WebApp1:
      - ASP1 only
      - ASP3 only
      - ASP1 and ASP2 only
      - ASP1 and ASP3 only
      - ASP1, ASP2, and ASP3
    WebApp2:
      - ASP1 only
      - ASP3 only
      - ASP1 and ASP2 only
      - ASP1 and ASP3 only
      - ASP1, ASP2, and ASP3
  answer:
    WebApp1: ASP1 and ASP3 only
    WebApp2: ASP1 only
  user_answer:
    WebApp1: ASP1 and ASP3 only
    WebApp2: ASP1 only
  user_result: correct
  learning_note: |
    Check both region and operating-system compatibility. .NET Core runs on
    Windows and Linux; classic ASP.NET on .NET Framework requires Windows.
    A web app runs in the region of its App Service plan.
  explanation: |
    Both selections are correct:

    - **WebApp1: ASP1 and ASP3 only.** .NET Core 3.0 supports Windows and Linux.
      ASP1 and ASP3 are both in West US, matching WebApp1's required location.
    - **WebApp2: ASP1 only.** ASP.NET 4.7 uses the Windows-only .NET Framework.
      ASP1 is the only Windows plan in West US.

    ASP2 is in Central US, so it cannot satisfy the West US requirement for
    either app. ASP3 is in the correct region but uses Linux, so it cannot host
    WebApp2's classic ASP.NET runtime.

    Remember: Check region first, then runtime/OS compatibility. .NET Core is
    cross-platform; classic ASP.NET on .NET Framework requires Windows.

    This older question uses .NET Core 3.0, which is out of support. The expected
    exam answer reflects the runtime's Windows/Linux compatibility; use a
    supported runtime version for a new deployment today.

    [Microsoft Learn: App Service plans](https://learn.microsoft.com/en-us/azure/app-service/overview-hosting-plans)
    [Microsoft Learn: Deploy an ASP.NET web app](https://learn.microsoft.com/en-us/azure/app-service/quickstart-dotnetcore)
- id: '008'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  tags:
    - "exam topic: Deploy and manage Azure compute resources"
    - Virtual Machine Scale Sets
    - Autoscale
    - CPU thresholds
    - Instance limits
  question: |
    HOTSPOT

    You create a virtual machine scale set named Scale1. Scale1 is configured
    as shown in the following exhibit.

    | Setting | Value |
    |---------|-------|
    | Initial instance count | 4 |
    | Scaling policy | Custom |
    | Minimum number of VMs | 2 |
    | Maximum number of VMs | 20 |
    | Scale out: CPU threshold (%) | 80 |
    | Scale out: Duration in minutes | 5 |
    | Scale out: Number of VMs to increase by | 2 |
    | Scale in: CPU threshold (%) | 30 |
    | Scale in: Number of VMs to decrease by | 4 |
    | Collect diagnostic logs from Autoscale | Disabled |

    Use the drop-down menus to select the answer choice that completes each
    statement based on the information presented in the graphic.

    NOTE: Each correct selection is worth one point.

    1. If Scale1 is utilized at 85 percent for six minutes after it is deployed,
       Scale1 will be running [answer choice].
    2. If Scale1 is first utilized at 25 percent for six minutes after it is
       deployed, and then utilized at 50 percent for six minutes, Scale1 will
       be running [answer choice].
  choices:
    '85 percent for six minutes':
      - 2 virtual machines
      - 4 virtual machines
      - 6 virtual machines
      - 10 virtual machines
      - 20 virtual machines
    '25 percent for six minutes, then 50 percent for six minutes':
      - 2 virtual machines
      - 4 virtual machines
      - 6 virtual machines
      - 8 virtual machines
      - 10 virtual machines
  answer:
    '85 percent for six minutes': 6 virtual machines
    '25 percent for six minutes, then 50 percent for six minutes': 2 virtual machines
  user_answer:
    '85 percent for six minutes': 6 virtual machines
    '25 percent for six minutes, then 50 percent for six minutes': 2 virtual machines
  user_result: correct
  learning_note: |
    Evaluate each scenario independently from the initial count. Apply the
    scaling change within the minimum and maximum limits. CPU usage between
    the thresholds preserves the current count rather than resetting it to
    the initial count.
  explanation: |
    Both selections are correct: **6 virtual machines**, then **2 virtual machines**.

    Each statement starts independently from the initial count of four VMs.

    1. At 85 percent CPU for six minutes, the 80 percent scale-out threshold
       has been exceeded for the required five-minute duration. One scale-out
       action adds two VMs: 4 + 2 = 6.
    2. At 25 percent CPU, the scale-in condition is met. The rule requests a
       decrease of four VMs, but the minimum count is two, so Scale1 scales
       from four VMs to two rather than zero. At 50 percent CPU, neither the
       below-30-percent scale-in condition nor the above-80-percent scale-out
       condition is met. Scale1 therefore remains at two VMs.

    The initial count is the starting capacity, not a target that autoscale
    restores when CPU usage returns between the thresholds. The maximum of
    20 is a ceiling, not the count selected whenever scale-out is triggered.
    Disabling diagnostic logs does not disable autoscaling.

    These are the expected exam results under the simplified timing in the
    question. Actual scaling completion depends on metric evaluation,
    cooldowns, and VM provisioning time; the exhibit does not specify all
    of those settings.

    Remember: Start count → scaling change → enforce minimum/maximum limits.

    [Microsoft Learn: Autoscale Virtual Machine Scale Sets in the Azure portal](https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/virtual-machine-scale-sets-autoscale-portal)
    [Microsoft Learn: Understand autoscale settings](https://learn.microsoft.com/en-us/azure/azure-monitor/autoscale/autoscale-understanding-settings)
- id: '009'
  skill: Deploy and manage Azure compute resources
  sub-skill: Automate deployment of resources by using Azure Resource Manager (ARM) templates or Bicep files
  tags:
    - "exam topic: Deploy and manage Azure compute resources"
    - Virtual Machine Scale Sets
    - ARM templates
    - VM extensions
    - PowerShell DSC
    - IIS
  question: |
    You plan to automate the deployment of a virtual machine scale set that
    uses the Windows Server 2016 Datacenter image.

    You need to ensure that when the scale set virtual machines are provisioned,
    they have web server components installed.

    Which two actions should you perform? Each correct answer presents part
    of the solution.

    NOTE: Each correct selection is worth one point.
  choices:
    A: Upload a configuration script
    B: Create an automation account
    C: Create an Azure policy
    D: Modify the extensionProfile section of the Azure Resource Manager template
    E: Create a new virtual machine scale set in the Azure portal
  answer: AD
  user_answer: D
  user_result: partially_correct
  learning_note: |
    Selecting extensionProfile identifies how to run the installation, but the
    solution also needs an accessible configuration script defining what to
    install. This question requires two selections: A and D.
  explanation: |
    Correct answers: **A and D**. The attempted answer D is correct but incomplete.

    - A: Upload a configuration script that installs the required web server
      components, such as Internet Information Services (IIS), to a location
      the VM extension can access.
    - D: Modify extensionProfile in the scale set ARM template to configure
      the extension, script location, and execution settings. This applies
      the installation configuration to newly provisioned scale set VMs.

    Microsoft's Windows scale set ARM template example uses the PowerShell
    Desired State Configuration (DSC) extension to download a configuration
    script and run its InstallIIS configuration. A Custom Script Extension
    can also install software by downloading and executing a suitable script.

    Why the other options are incorrect:

    - B: An Automation account is not required to run the VM extension
      configured in the ARM template.
    - C: Creating an Azure policy alone does not provide the installation
      script and extension configuration needed by this solution.
    - E: Creating a scale set in the portal alone does not install the web
      server components and is not required for automated ARM deployment.

    Remember: Script = what to install; extensionProfile = how to run the
    installation on each VM. imageReference selects the OS image instead.

    [Microsoft Learn: Create a Windows Virtual Machine Scale Set with an Azure template](https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/quick-create-template-windows)
    [Microsoft Learn: Custom Script Extension for Windows](https://learn.microsoft.com/en-us/azure/virtual-machines/extensions/custom-script-windows)
- id: '010'
  skill: Deploy and manage Azure compute resources
  sub-skill: Provision and manage containers in the Azure portal
  tags:
    - "exam topic: Deploy and manage Azure compute resources"
    - Azure Kubernetes Service
    - Azure CLI
    - kubectl
    - Client installation
  question: |
    HOTSPOT

    You have an Azure Kubernetes Service (AKS) cluster named AKS1 and a computer
    named Computer1 that runs Windows 10. Computer1 has the Azure CLI installed.

    You need to install the kubectl client on Computer1.

    Which command should you run? To answer, select the appropriate options
    in the answer area.

    NOTE: Each correct selection is worth one point.

    Complete the command: [first selection] [second selection] install-cli
  choices:
    First selection:
      - az
      - docker
      - msiexec.exe
      - Install-Module
    Second selection:
      - aks
      - /package
      - '-name'
      - pull
  answer:
    First selection: az
    Second selection: aks
  user_answer:
    First selection: az
    Second selection: aks
  user_result: correct
  learning_note: |
    az aks install-cli installs kubectl locally. az aks get-credentials
    configures cluster access, and kubectl apply -f deploys a YAML manifest.
  explanation: |
    Both selections are correct: **az** and **aks**.

    The complete command is:

    ```bash
    az aks install-cli
    ```

    This Azure CLI command downloads and installs the kubectl Kubernetes
    command-line client on Computer1. The Azure CLI is already installed,
    so it can be used to install the Kubernetes client.

    The other selections do not form the required installation command:
    docker pull downloads container images, msiexec.exe /package installs
    Windows Installer packages, and Install-Module -name installs PowerShell
    modules. None completes the displayed install-cli command correctly.

    Keep these steps distinct:

    - Install the client: az aks install-cli.
    - Configure access to AKS1: az aks get-credentials --resource-group
      <resource-group> --name AKS1.
    - Deploy a Kubernetes YAML manifest: kubectl apply -f <file.yaml>.

    Remember: Install → connect → deploy.

    [Microsoft Learn: az aks install-cli](https://learn.microsoft.com/en-us/cli/azure/aks#az-aks-install-cli)
    [Microsoft Learn: Install the Kubernetes CLI](https://learn.microsoft.com/en-us/azure/aks/tutorial-kubernetes-deploy-cluster#install-the-kubernetes-cli)
- id: '011'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  tags:
    - "exam topic: Deploy and manage Azure compute resources"
    - Azure Automation State Configuration
    - Desired State Configuration
    - Configuration drift
    - Compliance monitoring
  question: |
    DRAG DROP

    You onboard 10 Azure virtual machines to Azure Automation State Configuration.

    You need to use Azure Automation State Configuration to manage the ongoing
    consistency of the virtual machine configurations.

    Which three actions should you perform in sequence? To answer, move the
    appropriate actions from the list of actions to the answer area and arrange
    them in the correct order.

    NOTE: More than one order of answer choices is correct. You will receive
    credit for any of the correct orders you select.
  choices:
    - Assign tags to the virtual machines
    - Check the compliance status of the node
    - Compile a configuration into a node configuration
    - Upload a configuration to Azure Automation State Configuration
    - Create a management group
  answer:
    - Upload a configuration to Azure Automation State Configuration
    - Compile a configuration into a node configuration
    - Check the compliance status of the node
  user_answer:
    - Assign tags to the virtual machines
    - Compile a configuration into a node configuration
    - Upload a configuration to Azure Automation State Configuration
  user_result: incorrect
  learning_note: |
    For compilation in Azure Automation, upload the DSC configuration first,
    compile it into a node configuration, and then check node compliance after
    assignment and application. Tags organize resources; they do not enforce
    guest OS configuration. Onboarding alone does not assign a node configuration.
  explanation: |
    Correct sequence from the available actions:

    1. **Upload a configuration to Azure Automation State Configuration.**
       The configuration is a PowerShell DSC definition of the desired state,
       such as requiring a Windows feature to be installed or a service to run.
    2. **Compile a configuration into a node configuration.** Compilation produces
       a Managed Object Format (MOF) document that a managed VM can consume.
    3. **Check the compliance status of the node.** Once the node has received
       and applied its assigned configuration, review whether it matches the
       desired state and investigate any drift or failures.

    The full operational workflow includes assigning the compiled node
    configuration to each managed node between compilation and checking status.
    That action is absent from the offered choices. The VMs are already onboarded,
    so registration does not need to be repeated. For automatic correction of
    drift, configure the DSC Local Configuration Manager to use ApplyAndAutoCorrect;
    ApplyAndMonitor detects drift without automatically correcting it.

    Your answer includes two relevant actions, but omits compliance checking and
    adds tags. **Assign tags** only adds resource metadata; it does not configure
    the operating system or enforce its desired state. **Create a management
    group** organizes subscriptions for governance and is unrelated to DSC node
    configuration.

    For the Azure Automation compilation workflow, uploading precedes compilation.
    Local compilation is also supported, followed by importing the resulting node
    configuration MOF file. That is different from uploading the source
    configuration named in this question; use upload → compile → check as the
    clearest supported sequence from these choices.

    Memory aid: **Upload the recipe → compile the instructions → check the result.**

    Azure Automation State Configuration is scheduled to retire on September 30,
    2027. Microsoft recommends Azure Machine Configuration for migration. This
    question tests the older State Configuration workflow.

    [Microsoft Learn: Configure machines to a desired state](https://learn.microsoft.com/en-us/azure/automation/tutorial-configure-servers-desired-state)
    [Microsoft Learn: Compile DSC configurations](https://learn.microsoft.com/en-us/azure/automation/automation-dsc-compile)
    [Microsoft Learn: State Configuration overview](https://learn.microsoft.com/en-us/azure/automation/automation-dsc-overview)
- id: '012'
  skill: Deploy and manage Azure compute resources
  sub-skill: Automate deployment of resources by using Azure Resource Manager (ARM) templates or Bicep files
  tags:
    - "exam topic: Deploy and manage Azure compute resources"
    - ARM templates
    - Resource location
    - Parameters
    - Variables
    - Virtual machines
  question: |
    You have an Azure Resource Manager template named Template1 that is used
    to deploy an Azure virtual machine.

    Template1 contains the following text:

    ```json
    "location": {
      "type": "String",
      "defaultValue": "eastus",
      "allowedValues": [
        "canadacentral",
        "eastus",
        "westeurope",
        "westus"
      ]
    }
    ```

    The variables section in Template1 contains the following text:

    ```json
    "location": "westeurope"
    ```

    The resources section in Template1 contains the following text:

    ```json
    "type": "Microsoft.Compute/virtualMachines",
    "apiVersion": "2018-10-01",
    "name": "[variables('vmName')]",
    "location": "westeurope",
    ```

    You need to deploy the virtual machine to the West US location by using
    Template1.

    What should you do?
  choices:
    A: Modify the location in the resources section to westus
    B: Select West US during the deployment
    C: Modify the location in the variables section to westus
  answer: A
  user_answer: A
  user_result: correct
  learning_note: |
    A hard-coded resource property does not automatically use a parameter or
    variable with the same name. Follow the actual expression in the resource
    declaration to determine which value controls deployment.
  explanation: |
    **A — Modify the location in the resources section to westus** is correct.

    The VM resource has a literal location value of westeurope. Change that
    resource property to:

    ```json
    "location": "westus"
    ```

    The location parameter and location variable are separate values. Neither
    controls this VM's location because the resource does not reference either
    one. Identical names do not create an automatic connection.

    - B: Selecting West US during deployment cannot override this hard-coded
      resource location. A parameter value only affects properties that use it.
    - C: Changing the location variable has no effect because the VM's location
      does not use [variables('location')].

    For a reusable template, the resource could instead use:

    ```json
    "location": "[parameters('location')]"
    ```

    That would allow the location parameter supplied during deployment to
    determine the VM's region, but it is not how the displayed template works.

    Remember: Follow the resource's expression; matching names do not connect
    parameters, variables, and resource properties.

    [Microsoft Learn: Set resource location in ARM template](https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/resource-location)
    [Microsoft Learn: Parameters in ARM templates](https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/parameters)
- id: '013'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure Azure App Service
  tags:
    - "exam topic: Deploy and manage Azure compute resources"
    - App Service plans
    - Deployment slots
    - Scale up
    - Scale out
    - Pricing tiers
  question: |
    You create an App Service plan named Plan1 and an Azure web app named webapp1.

    You discover that the option to create a staging slot is unavailable.

    You need to create a staging slot for Plan1.

    What should you do first?
  choices:
    A: From Plan1, scale up the App Service plan
    B: From webapp1, modify the Application settings
    C: From webapp1, add a custom domain
    D: From Plan1, scale out the App Service plan
  answer: A
  user_answer: D
  user_result: incorrect
  learning_note: |
    Scale up changes the App Service pricing tier and available features.
    Scale out changes the instance count without unlocking tier-dependent
    features. Staging slots require Standard, Premium, or Isolated.
  explanation: |
    **A — From Plan1, scale up the App Service plan** is correct. The attempted
    answer D does not enable staging slots.

    Deployment slots are supported in the Standard, Premium, and Isolated
    tiers. When the option is unavailable because of the current tier, first
    scale up Plan1 to a supported tier, such as Standard. Then create the
    staging slot under webapp1's Deployment slots page.

    Although the question says to create a slot for Plan1, deployment slots
    belong to the web app; its App Service plan determines feature availability.

    Why the other options are incorrect:

    - B: Application settings configure app behavior and do not unlock
      deployment slots in an unsupported pricing tier.
    - C: Adding a custom domain does not enable deployment slots.
    - D: Scaling out increases the number of VM instances serving the app.
      It does not change the pricing tier or add unavailable features.

    Scale up changes the tier, instance size, and available features. Scale
    out changes the instance count to handle more traffic.

    Remember: Need a feature → scale up. Need more instances → scale out.

    [Microsoft Learn: Set up staging environments in Azure App Service](https://learn.microsoft.com/en-us/azure/app-service/deploy-staging-slots)
    [Microsoft Learn: Scale up an app in Azure App Service](https://learn.microsoft.com/en-us/azure/app-service/manage-scale-up)
- id: '014'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  tags:
    - "exam topic: Deploy and manage Azure compute resources"
    - Availability sets
    - Update domains
    - Fault domains
    - Virtual machine scale sets
    - Ambiguous question
  question: |
    You plan to move a distributed on-premises app named App1 to an Azure subscription.

    After the planned move, App1 will be hosted on several Azure virtual machines.

    You need to ensure that App1 always runs on at least eight virtual machines
    during planned Azure maintenance.

    What should you create?
  choices:
    A: one virtual machine scale set that has 10 virtual machines instances
    B: one Availability Set that has three fault domains and one update domain
    C: one Availability Set that has 10 update domains and one fault domain
    D: one virtual machine scale set that has 12 virtual machines instances
  answer: C
  user_answer: C
  user_result: correct
  learning_note: |
    Planned maintenance is isolated by update domains; hardware failures are
    isolated by fault domains. Provision enough VMs to leave at least eight
    outside the largest update domain. The question omits the VM count for C
    and scale set orchestration details, so C is the expected answer rather
    than a uniquely established solution from the wording alone.
  explanation: |
    **C** is the expected answer: an availability set with 10 update domains
    and one fault domain.

    An update domain groups VMs that can restart together during planned Azure
    maintenance. Azure restarts only one update domain at a time. For example,
    deploying 10 VMs across 10 update domains leaves nine running when one domain
    restarts, satisfying the requirement of at least eight. Nine VMs in separate
    update domains would leave eight. The availability set itself does not create
    VMs, so sufficient VM capacity must also be provisioned.

    Fault domains separate shared hardware dependencies such as power and network
    switches. They address hardware failures rather than the planned-maintenance
    requirement. One fault domain does not protect against a failure of that domain.

    **B** has only one update domain, so all its VMs can restart together.

    **Question ambiguity:** A and D cannot be categorically dismissed. Under a
    regional Uniform scale set deployment balanced across five update domains,
    10 instances can leave eight available (10 minus two), and 12 can leave nine
    (12 minus three). Flexible orchestration uses fault-domain-based maintenance
    instead. The question specifies neither orchestration mode nor placement
    details, and C specifies no VM count. Preserve C as the supplied expected
    answer, but do not memorize that scale sets lack maintenance protection.

    Capacity calculations cover planned domain restarts assuming the remaining
    VMs and application are healthy; they are not an unconditional guarantee
    against simultaneous unrelated failures.

    Memory aid: **Update domains → planned maintenance; fault domains → hardware failures.**

    [Microsoft Learn: Availability sets overview](https://learn.microsoft.com/en-us/azure/virtual-machines/availability-set-overview)
    [Microsoft Learn: Scale set orchestration modes](https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/virtual-machine-scale-sets-orchestration-modes)
    [Microsoft Learn: Scale set FAQ](https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/virtual-machine-scale-sets-faq)
- id: '015'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  question: |
    Note: This question is part of a series of questions that present the same
    scenario. Each question in the series contains a unique solution that might
    meet the stated goals. Some question sets might have more than one correct
    solution, while others might not have a correct solution.

    After you answer a question in this section, you will NOT be able to return
    to it. As a result, these questions will not appear in the review screen.

    You have an Azure virtual machine named VM1 that runs Windows Server 2016.

    You need to create an alert in Azure when more than two error events are
    logged to the System event log on VM1 within an hour.

    Solution: You create an event subscription on VM1. You create an alert in
    Azure Monitor and specify VM1 as the source.

    Does this meet the goal?
  choices:
    A: Yes
    B: No
  answer: B
  user_answer: B
  user_result: correct
  learning_note: |
    A Windows event subscription forwards events to a Windows event collector;
    it does not configure ingestion into Azure Monitor Logs. Collect guest OS
    events into Log Analytics before creating an event-count log search alert.
  explanation: |
    **B — No** is correct.

    A Windows event subscription forwards selected Windows events to a Windows
    event collector. It does not automatically send VM1's System event log to
    Azure Monitor. Selecting VM1 as the alert source does not configure collection
    of guest operating system event logs either.

    To meet the goal, collect VM1's System error events into a Log Analytics
    workspace and create an Azure Monitor log search alert. Filter for VM1,
    the System log, and Error severity. Evaluate the matching event count over
    one hour and trigger when it is greater than two (three or more events).

    **A — Yes** is incorrect because the proposed solution does not configure
    the required event ingestion and event-count alert condition.

    Current deployments use Azure Monitor Agent (AMA) and a data collection
    rule (DCR) to send Windows events to a Log Analytics workspace. Older exam
    material may refer to the Microsoft Monitoring Agent or Log Analytics agent.

    Remember: Event forwarding alone does not configure Azure Monitor log collection.

    [Microsoft Learn: Collect Windows events with Azure Monitor Agent](https://learn.microsoft.com/en-us/azure/azure-monitor/vm/data-collection-windows-events)
    [Microsoft Learn: Create log search alerts](https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-create-log-alert-rule)
- id: '016'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  question: |
    Note: This question is part of a series of questions that present the same
    scenario. Each question in the series contains a unique solution that might
    meet the stated goals. Some question sets might have more than one correct
    solution, while others might not have a correct solution.

    After you answer a question in this section, you will NOT be able to return
    to it. As a result, these questions will not appear in the review screen.

    You have an Azure virtual machine named VM1. VM1 was deployed by using a
    custom Azure Resource Manager template named ARM1.json.

    You receive a notification that VM1 will be affected by maintenance.

    You need to move VM1 to a different host immediately.

    Solution: From the Overview blade, you move the virtual machine to a
    different subscription.

    Does this meet the goal?
  choices:
    A: Yes
    B: No
  answer: B
  user_answer: B
  user_result: correct
  user_reasoning: Selected No and proposed reallocating the VM by stopping and starting it.
  learning_note: |
    Moving a VM to another subscription changes its management scope, not its
    physical host. Redeploy explicitly moves a VM to a new host. A guest shutdown
    or restart does not release its allocation; stop (deallocate) and start
    permits reallocation but should not be treated as a guaranteed host change.
  explanation: |
    **B — No** is correct.

    Moving VM1 to a different subscription changes its Azure management scope,
    including subscription ownership and billing context. It does not move the
    running VM to a different physical host, so the proposed solution does not
    meet the maintenance requirement. Deployment through ARM1.json is incidental.

    Use **Redeploy** to move VM1 to a new Azure host. In the portal, open VM1,
    select **Redeploy + reapply**, and select **Redeploy**. Azure shuts down the
    VM, moves it to a new node, and powers it back on.

    The attempted answer B is correct, but the suggested stop/start alternative
    needs precision. Stopping inside the guest OS or restarting the VM does not
    deallocate it. Stop (deallocate) releases the compute allocation, and starting
    allocates compute again, but this should not be relied on to guarantee a
    different host. Redeploy is the explicit operation for that requirement.

    **A — Yes** is incorrect because a subscription move does not perform a
    physical host migration.

    Remember: Subscription move changes management scope; redeploy changes host.

    [Microsoft Learn: Redeploy a Windows VM to a new Azure node](https://learn.microsoft.com/en-us/troubleshoot/azure/virtual-machines/windows/redeploy-to-new-node-windows)
    [Microsoft Learn: Virtual Machines — Redeploy](https://learn.microsoft.com/en-us/rest/api/compute/virtual-machines/redeploy)
- id: '017'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  question: |
    Note: This question is part of a series of questions that present the same
    scenario. Each question in the series contains a unique solution that might
    meet the stated goals. Some question sets might have more than one correct
    solution, while others might not have a correct solution.

    After you answer a question in this section, you will NOT be able to return
    to it. As a result, these questions will not appear in the review screen.

    You have an Azure virtual machine named VM1. VM1 was deployed by using a
    custom Azure Resource Manager template named ARM1.json.

    You receive a notification that VM1 will be affected by maintenance.

    You need to move VM1 to a different host immediately.

    Solution: From the Redeploy blade, you click Redeploy.

    Does this meet the goal?
  choices:
    A: Yes
    B: No
  answer: A
  user_answer: A
  user_result: correct
  learning_note: |
    Redeploy explicitly moves an existing VM to a new Azure host. It shuts down
    the VM, migrates it to a new node, and powers it back on. The ARM template
    used for the original deployment does not change this behavior.
  explanation: |
    **A — Yes** is correct.

    Redeploy is the operation designed to move an existing virtual machine to
    a different Azure host. Azure shuts down VM1, moves it to a new node in the
    Azure infrastructure, and powers it back on. This initiates the host move
    immediately rather than waiting for the scheduled maintenance, although
    completing the redeployment takes time and involves downtime.

    The fact that VM1 was deployed through ARM1.json does not affect the answer.
    You do not need to edit or deploy the template again to change the host.

    **B — No** is incorrect because Redeploy directly performs the required
    host migration. Moving a VM to another subscription changes management scope;
    restarting a VM does not explicitly move it to another host.

    In the current portal, this action is under **Redeploy + reapply**. Choose
    **Redeploy** for the host move.

    Remember: Redeploy → new host.

    [Microsoft Learn: Redeploy a Windows VM to a new Azure node](https://learn.microsoft.com/en-us/troubleshoot/azure/virtual-machines/windows/redeploy-to-new-node-windows)
    [Microsoft Learn: Virtual Machines — Redeploy](https://learn.microsoft.com/en-us/rest/api/compute/virtual-machines/redeploy)
- id: '019'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure Azure App Service
  question: |
    You have an Azure subscription that contains a web app named webapp1.

    You need to add a custom domain named www.contoso.com to webapp1.

    What should you do first?
  choices:
    A: Create a DNS record
    B: Add a connection string
    C: Upload a certificate.
    D: Stop webapp1.
  answer: A
  user_answer: A
  user_result: correct
  learning_note: |
    Configure DNS to verify ownership and map the custom hostname before adding
    it to App Service. Use a CNAME for a subdomain such as www and a TXT record
    for ownership verification. A TLS certificate secures HTTPS afterward.
  explanation: |
    **A — Create a DNS record** is correct.

    Before adding www.contoso.com to webapp1, configure the required records
    with the DNS provider for contoso.com. App Service uses DNS to verify that
    you own the hostname, and DNS directs clients to the web app.

    For this subdomain, the usual records are:

    - **CNAME:** Name `www`, pointing to webapp1's actual default App Service
      hostname. Copy that hostname from the portal.
    - **TXT:** Name `asuid.www`, containing webapp1's custom domain verification ID.

    After the records propagate, validate and add www.contoso.com in webapp1's
    **Custom domains** page. Configure a TLS certificate and binding to secure
    the hostname with HTTPS. The app must also use a tier supporting custom domains.

    Why the other options are incorrect:

    - **B:** A connection string connects the app to a database or other service;
      it does not configure DNS or verify domain ownership.
    - **C:** A certificate secures HTTPS. Uploading one does not establish the
      DNS mapping or satisfy the domain-ownership prerequisite.
    - **D:** Stopping the app does not configure the custom domain and is unnecessary.

    Remember: DNS maps and verifies the hostname; TLS secures the connection.

    [Microsoft Learn: Set up an existing custom domain in App Service](https://learn.microsoft.com/en-us/azure/app-service/app-service-web-tutorial-custom-domain)
- id: '020'
  skill: Implement and manage virtual networking
  sub-skill: Configure and manage virtual networks in Azure
  question: |
    Note: This question is part of a series of questions that present the same
    scenario. Each question in the series contains a unique solution that might
    meet the stated goals. Some question sets might have more than one correct
    solution, while others might not have a correct solution.

    After you answer a question in this section, you will NOT be able to return
    to it. As a result, these questions will not appear in the review screen.

    You have an Azure subscription that contains the resources shown in the
    following table.

    | Name | Type | Region |
    |------|------|--------|
    | RG1 | Resource group | West US |
    | RG2 | Resource group | East Asia |
    | storage1 | Storage account | West US |
    | storage2 | Storage account | East Asia |
    | VM1 | Virtual machine | West US |
    | VNET1 | Virtual network | West US |
    | VNET2 | Virtual network | East Asia |

    VM1 connects to VNET1.

    You need to connect VM1 to VNET2.

    Solution: You move VM1 to RG2, and then you add a new network interface to VM1.

    Does this meet the goal?
  choices:
    A: Yes
    B: No
  answer: B
  user_answer: B
  user_result: correct
  learning_note: |
    Moving a VM to another resource group does not change its region. A VM,
    its NICs, and their virtual network must be in the same region, and all
    NICs attached to one VM must use the same virtual network.
  explanation: |
    **B — No** is correct.

    The proposed solution fails for two reasons:

    - **Moving VM1 to RG2 does not move it to East Asia.** A resource group's
      location is where its metadata is stored; resources in that group can
      have different locations. VM1 remains in West US after a resource-group
      move, while VNET2 is in East Asia.
    - **Adding a NIC cannot attach VM1 to VNET2.** A VM, its attached network
      interfaces (NICs), and their virtual network must be in the same region.
      Also, all NICs attached to a VM must connect to the same virtual network,
      although they can use different subnets within that network. VM1 cannot
      keep a NIC in VNET1 and add another in VNET2.

    **A — Yes** is incorrect because a resource-group move changes management
    organization, not the VM's region or virtual-network attachment.

    If the goal is communication with resources in VNET2 while VM1 stays in
    VNET1, global virtual network peering can connect the two regional networks,
    provided their address spaces do not overlap and routing and security rules
    allow the traffic. Peering does not change VM1's VNET membership.

    If the requirement is for VM1 to be directly attached to VNET2, migrate or
    recreate the VM in East Asia with networking configured for VNET2.

    Remember: Resource-group move ≠ region move; multiple NICs ≠ multiple VNets.

    [Microsoft Learn: Move resources to a new resource group or subscription](https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/move-resource-group-and-subscription)
    [Microsoft Learn: Add or remove VM network interfaces](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-network-interface-vm)
    [Microsoft Learn: Plan Azure virtual networks](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-vnet-plan-design-arm)
- id: '021'
  skill: Implement and manage virtual networking
  sub-skill: Configure and manage virtual networks in Azure
  question: |
    Note: This question is part of a series of questions that present the same
    scenario. Each question in the series contains a unique solution that might
    meet the stated goals. Some question sets might have more than one correct
    solution, while others might not have a correct solution.

    After you answer a question in this section, you will NOT be able to return
    to it. As a result, these questions will not appear in the review screen.

    You have an Azure subscription that contains the resources shown in the
    following table.

    | Name | Type | Region |
    |------|------|--------|
    | RG1 | Resource group | West US |
    | RG2 | Resource group | East Asia |
    | storage1 | Storage account | West US |
    | storage2 | Storage account | East Asia |
    | VM1 | Virtual machine | West US |
    | VNET1 | Virtual network | West US |
    | VNET2 | Virtual network | East Asia |

    VM1 connects to VNET1.

    You need to connect VM1 to VNET2.

    Solution: You delete VM1. You recreate VM1, and then you create a new network
    interface for VM1 and connect it to VNET2.

    Does this meet the goal?
  choices:
    A: Yes
    B: No
  answer: A
  user_answer: A
  user_result: correct
  learning_note: |
    Recreating a VM with a NIC in the target VNet can change its VNet attachment.
    Here the recreated VM and NIC must be in East Asia. Preserving its original
    workload requires migrating or copying its disks to that region. The question
    leaves these prerequisites and the NIC creation order implicit.
  explanation: |
    **A — Yes** is the expected answer, assuming VM1 is recreated in East Asia
    with its networking configured for VNET2.

    Recreating the VM allows its replacement network interface (NIC) to use a
    subnet in the target VNet. This differs from simply moving the existing VM
    to another resource group, which changes neither its region nor its VNet.

    **Important wording limitation:** VM1 originally resides in West US and
    VNET2 resides in East Asia. Deleting and recreating VM1 in West US would not
    satisfy the goal. The new VM and NIC must be deployed in East Asia. To retain
    the original workload, migrate or copy the required disks to East Asia;
    an existing West US managed disk cannot simply be attached to an East Asia VM.

    In practice, create the NIC in a VNET2 subnet before or during creation of
    the replacement VM, and use it when creating that VM. The question's phrase
    "recreate VM1, and then ... create a new network interface" is a simplified
    description, not a precise deployment sequence: a VM requires a NIC at creation,
    and it cannot retain a VNET1 NIC while attaching a VNET2 NIC.

    **B — No** is not the expected selection under the intended recreation-in-the-
    target-network interpretation. Taken literally without the regional and NIC
    prerequisites, however, the proposed steps are underspecified.

    Remember: Recreate in the target VNet and region; preserve the workload by
    migrating its disks and configuration.

    [Microsoft Learn: Azure VM move and migration FAQ](https://learn.microsoft.com/en-us/troubleshoot/azure/virtual-machines/windows/move-vm-resources-faq)
    [Microsoft Learn: Plan Azure virtual networks](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-vnet-plan-design-arm)
    [Microsoft Learn: Add or remove VM network interfaces](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-network-interface-vm)
- id: '023'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  question: |
    HOTSPOT

    You have an Azure subscription named Subscription1 that contains the quotas
    shown in the following table.

    | Quota | Location | Usage |
    |-------|----------|-------|
    | Standard BS Family vCPUs | West US | 0 of 20 |
    | Standard D Family vCPUs | West US | 0 of 20 |
    | Total Regional vCPUs | West US | 0 of 20 |

    You deploy virtual machines to Subscription1 as shown in the following table.

    | Name | Size | vCPUs | Location | Status |
    |------|------|-------|----------|--------|
    | VM1 | Standard_B2ms | 2 | West US | Running |
    | VM2 | Standard_B16ms | 16 | West US | Stopped (Deallocated) |

    You plan to deploy the virtual machines shown in the following table.

    | Name | Size | vCPUs |
    |------|------|-------|
    | VM3 | Standard_B2ms | 1 |
    | VM4 | Standard_D4s_v3 | 4 |
    | VM5 | Standard_B16ms | 16 |

    For each of the following statements, select Yes if the statement is true.
    Otherwise, select No.

    NOTE: Each correct selection is worth one point.
  choices:
    You can deploy VM3 to West US.:
      - 'Yes'
      - 'No'
    You can deploy VM4 to West US.:
      - 'Yes'
      - 'No'
    You can deploy VM5 to West US.:
      - 'Yes'
      - 'No'
  answer:
    You can deploy VM3 to West US.: 'Yes'
    You can deploy VM4 to West US.: 'No'
    You can deploy VM5 to West US.: 'No'
  user_answer:
    You can deploy VM3 to West US.: 'Yes'
    You can deploy VM4 to West US.: 'Yes'
    You can deploy VM5 to West US.: 'Yes'
  user_result: partially_correct
  learning_note: |
    Deallocated VMs still count toward vCPU quotas, even though compute billing
    stops. Check both the VM-family quota and total regional quota. VM1 and VM2
    use 18 of 20 regional vCPUs, leaving only two available.
  explanation: |
    Correct selections: **Yes, No, No.** The first attempted selection is correct.

    Azure vCPU quotas count both allocated and deallocated VMs. VM2 therefore
    still counts despite being Stopped (Deallocated). After the existing VMs
    are deployed, usage is 2 + 16 = **18 of 20** for both the B-family quota
    and the total West US regional quota. Only **two vCPUs remain**.

    Evaluate each proposed deployment against the existing VM1 and VM2:

    - **VM3 — Yes:** The table lists one vCPU, giving a total of 19, within
      both quotas. There is a source inconsistency: Standard_B2ms actually has
      two vCPUs, as also shown for VM1. Using the actual size gives 20, so the
      answer is still Yes. The table is preserved faithfully rather than altered.
    - **VM4 — No:** Adding four vCPUs gives a regional total of 22, exceeding
      20. Available quota in another VM family does not bypass the regional limit.
    - **VM5 — No:** Adding 16 vCPUs gives 34, exceeding both the B-family
      limit and the total regional limit.

    The initial 0-of-20 figures precede deployment of VM1 and VM2; they are not
    the remaining usage after those deployments. These answers concern quota
    eligibility, assuming the requested sizes are available in the region.

    Deallocating releases physical compute and stops compute charges, but it
    does not remove the VM from vCPU quota usage. Delete unneeded VMs or request
    the relevant quota increases to make room for additional deployments.

    Remember: Deallocated ≠ deleted; family quota AND regional quota must pass.

