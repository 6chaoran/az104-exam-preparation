- id: '091'
  skill: Deploy and manage Azure compute resources
  sub-skill: Automate deployment of resources by using Azure Resource Manager (ARM) templates or Bicep files
  question: |
    HOTSPOT

    You have an Azure subscription.

    You need to deploy a virtual machine by using an Azure Resource Manager
    (ARM) template.

    How should you complete the template? To answer, select the appropriate
    options in the answer area.

    NOTE: Each correct selection is worth one point.

    **Answer area — template excerpt**

    Ellipses represent omitted content and surrounding resource structure.

    ```json
    {
      "$schema": "https://schema.management.azure.com/schemas/2015-01-01/deploymentTemplate.json#",
      ...
      "type": "Microsoft.Compute/virtualMachines",
      ...
      "dependsOn": [
        "[[Blank 1]('Microsoft.Network/networkInterfaces/', 'VM1')]"
      ],
      "properties": {
        "storageProfile": {
          "[Blank 2]": {
            "publisher": "MicrosoftWindowsServer",
            "Offer": "WindowsServer",
            "sku": "2019-Datacenter",
            "version": "latest"
            ...
          }
        }
      }
    }
    ```
  choices:
    Blank 1:
      - reference
      - resourceId
      - Union
    Blank 2:
      - Array
      - Image
      - ImageReference
      - vhd
  answer:
    Blank 1: resourceId
    Blank 2: ImageReference
  user_answer:
    Blank 1: reference
    Blank 2: ImageReference
  user_result: partially_correct
  learning_note: |
    resourceId builds a resource identifier for an explicit dependsOn entry.
    reference retrieves runtime resource properties. imageReference selects the
    VM image using publisher, offer, sku, and version.
  explanation: |
    Correct selections: **resourceId** and **ImageReference**. Your second
    selection is correct; the first must change from reference to resourceId.

    dependsOn requires the resource name or ID of the dependency. Here,
    resourceId builds the ID of the network interface named VM1, so ARM waits
    for that NIC to finish deployment before deploying the VM.

    ```json
    "dependsOn": [
      "[resourceId('Microsoft.Network/networkInterfaces', 'VM1')]"
    ]
    ```

    reference retrieves runtime properties of a resource; it does not construct
    a resource ID. Although using reference by resource name in a resource's
    properties can establish an implicit dependency, that is different from
    supplying an ID in this explicit dependsOn array. union combines arrays
    or objects and does not identify the NIC dependency.

    imageReference describes the source image using publisher, offer, sku,
    and version. The values shown select Windows Server 2019 Datacenter.
    Array and Image are not the required storageProfile property, and vhd
    identifies a virtual hard disk location rather than a Marketplace image.

    The choices preserve the exhibit's capitalization. In a working template,
    use canonical imageReference and offer property names. The completed image
    section is:

    ```json
    "imageReference": {
      "publisher": "MicrosoftWindowsServer",
      "offer": "WindowsServer",
      "sku": "2019-Datacenter",
      "version": "latest"
    }
    ```

    Remember: resourceId identifies a resource; reference reads its properties;
    imageReference selects the operating system image.

    [Microsoft Learn: Resource dependencies](https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/define-resource-dependency)
    [Microsoft Learn: VM storageProfile imageReference](https://learn.microsoft.com/en-us/javascript/api/@azure/arm-compute/storageprofile)
- id: '092'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure Azure App Service
  question: |
    HOTSPOT

    You need to configure a new Azure App Service app named WebApp1.
    The solution must meet the following requirements:

    - WebApp1 must be able to verify a custom domain name of app.contoso.com.
    - WebApp1 must be able to automatically scale up to eight instances.
    - Costs and administrative effort must be minimized.

    Which pricing plan should you choose, and which type of record should you
    use to verify the domain? To answer, select the appropriate options in
    the answer area.

    NOTE: Each correct answer is worth one point.
  choices:
    Pricing plan:
      - Basic
      - Free
      - Shared
      - Standard
    Record type:
      - A
      - AAAA
      - PTR
      - TXT
  answer:
    Pricing plan: Standard
    Record type: TXT
  user_answer:
    Pricing plan: Standard
    Record type: TXT
  user_result: correct
  learning_note: |
    Standard supports rule-based autoscale and up to ten instances, satisfying
    the eight-instance requirement. TXT verifies custom domain ownership;
    CNAME or A records serve the separate purpose of mapping traffic.
  explanation: |
    Both selections are correct: **Standard** and **TXT**.

    Standard is the lowest tier among the listed choices that supports
    rule-based autoscale to eight instances, with a maximum of ten instances.
    Basic supports manual scaling up to three instances, so it cannot meet
    the requirement. Free and Shared do not provide this scale-out capability.
    Configure autoscale with a maximum instance count of eight.

    Create a TXT record named asuid.app in the contoso.com DNS zone, using
    WebApp1's custom domain verification ID as its value. The full record name
    is asuid.app.contoso.com. This proves ownership of app.contoso.com.

    Domain verification and traffic routing are separate tasks. A CNAME record
    for app pointing to the app's default hostname is normally used to route
    this subdomain to WebApp1. A records map names to IPv4 addresses, AAAA records
    map names to IPv6 addresses, and PTR records provide reverse DNS; TXT is
    the ownership-verification choice here.

    The phrase scale up to eight instances means scale out (increase instance
    count). Scale up technically means selecting a larger machine size or tier.
    This question concerns Azure Monitor rule-based autoscale, distinct from
    App Service's separate automatic scaling feature available on Premium tiers.

    Remember: eight instances with autoscale = Standard; verify ownership = TXT.

    [Microsoft Learn: App Service scaling FAQ](https://learn.microsoft.com/en-us/troubleshoot/azure/app-service/scaling-web-app-faq-new)
    [Microsoft Learn: Configure a custom domain](https://learn.microsoft.com/en-us/azure/app-service/app-service-web-tutorial-custom-domain)
