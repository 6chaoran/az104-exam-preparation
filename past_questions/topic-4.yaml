- id: '098'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure Azure App Service
  question: |
    You have an Azure AD tenant named contoso.com.

    You have an Azure subscription that contains an Azure App Service web app
    named App1 and an Azure key vault named KV1. KV1 contains a wildcard
    certificate for contoso.com.

    You have a user named user1@contoso.com that is assigned the Owner role
    for App1 and KV1.

    You need to configure App1 to use the wildcard certificate of KV1.

    What should you do first?
  choices:
    A: Create an access policy for KV1 and assign the Microsoft Azure App Service principal to the policy.
    B: Assign a managed user identity to App1.
    C: Configure KV1 to use the role-based access control (RBAC) authorization system.
    D: Create an access policy for KV1 and assign the policy to User1.
  answer: A
  user_answer: A
  user_result: correct
  learning_note: |
    Importing a Key Vault certificate into App Service requires vault read
    access for the Microsoft Azure App Service resource provider principal.
    App1's managed identity and User1's Owner role do not grant that principal access.
  explanation: |
    **A** is correct for the access-policy workflow offered in the question.
    Authorize the Microsoft Azure App Service service principal to read KV1
    before importing the certificate into App1. Grant Get permissions for
    both secrets and certificates. The certificate's private-key material is
    retrieved through its backing secret.

    The App Service resource provider uses this platform service principal
    (also called Microsoft.Azure.WebSites), rather than App1's managed identity,
    for the certificate import. After authorization, import the certificate
    from Key Vault and configure a TLS binding for the app's custom hostname.

    **B** assigns an identity to the app but does not authorize the platform
    principal that performs this import. App managed identities are relevant
    to other scenarios, such as Key Vault references in app settings.
    **C** only changes the vault permission model; it does not assign the
    required read permission to the App Service principal. An RBAC-based solution
    is supported when the appropriate certificate-reading role is also assigned.
    **D** grants permissions to User1 rather than the platform principal.
    User1's Owner role manages resources and permissions but does not automatically
    grant the App Service principal access to vault certificate or secret data.

    Azure AD is now called Microsoft Entra ID. Current deployments can authorize
    the App Service principal using either access policies or Key Vault RBAC;
    A remains the complete first-step option listed here.

    Remember: App Service TLS certificate import = authorize the App Service
    platform principal; app secret references = authorize the app's identity.

    [Microsoft Learn: Authorize App Service and import a Key Vault certificate](https://learn.microsoft.com/en-us/azure/app-service/configure-ssl-certificate)
    [Microsoft Learn: App identity for Key Vault references](https://learn.microsoft.com/en-us/azure/app-service/app-service-key-vault-references)
- id: '099'
  skill: Deploy and manage Azure compute resources
  sub-skill: Automate deployment of resources by using Azure Resource Manager (ARM) templates or Bicep files
  question: |
    You have an Azure subscription.

    You plan to deploy the resources shown in the following table.

    | Name | Type |
    | --- | --- |
    | IP1 | Microsoft.Network/publicIPAddresses |
    | NSG1 | Microsoft.Network/networkSecurityGroups |
    | VNET1 | Microsoft.Network/virtualNetworks |
    | NIC1 | Microsoft.Network/networkInterfaces |
    | VM1 | Microsoft.Compute/virtualMachines |

    You need to create a single Azure Resource Manager (ARM) template that
    will be used to deploy the resources.

    Which resource should be added to the dependsOn section for VM1?
  choices:
    A: VNET1
    B: NIC1
    C: IP1
    D: NSG1
  answer: B
  user_answer: B
  user_result: correct
  learning_note: |
    A VM directly depends on its NIC. The NIC's dependencies on the subnet/VNet,
    public IP, and associated NSG establish the upstream deployment order.
    Let dependencies cascade rather than repeating all of them on the VM.
  explanation: |
    **B — NIC1** is correct. VM1 attaches NIC1 in its networkProfile, so NIC1
    must exist before VM1 is deployed. Add NIC1's resource ID to VM1's dependsOn:

    ```json
    "dependsOn": [
      "[resourceId('Microsoft.Network/networkInterfaces', 'NIC1')]"
    ]
    ```

    For the intended configuration, NIC1 depends on VNET1's subnet, IP1, and
    NSG1 when those resources are referenced by the NIC configuration. ARM
    follows those dependencies before creating NIC1, then creates VM1.
    If NSG1 is associated with the subnet instead, configure that dependency
    on the corresponding subnet/VNet resource.

    **A, C, and D** are upstream networking resources rather than VM1's direct
    NIC dependency. Depending on only one of them would not ensure NIC1 exists.
    Repeating all upstream dependencies on VM1 is unnecessary when the template
    correctly expresses the dependency chain.

    resourceId constructs the ID; putting that ID in dependsOn establishes the
    deployment ordering. A resourceId expression alone does not create an
    implicit dependency in a JSON ARM template.

    Remember: networking resources first, then NIC, then VM.

    [Microsoft Learn: ARM resource dependency examples](https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/define-resource-dependency)
    [Microsoft Learn: Let dependencies cascade](https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/best-practices)
- id: '100'
  skill: Deploy and manage Azure compute resources
  sub-skill: Automate deployment of resources by using Azure Resource Manager (ARM) templates or Bicep files
  question: |
    You have an Azure subscription.

    You create the following Azure Resource Manager (ARM) template named Template.json.

    ```json
    {
      "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentTemplate.json#",
      "contentVersion": "1.0.0.0",
      "parameters": {},
      "variables": {},
      "resources": [
        {
          "type": "Microsoft.Resources/resourceGroups",
          "apiVersion": "2022-12-01",
          "location": "eastus",
          "name": "Marketing"
        }
      ],
      "outputs": {}
    }
    ```

    You need to deploy Template.json.

    Which PowerShell cmdlet should you run from Azure Cloud Shell?
  choices:
    A: New-AzSubscriptionDeployment
    B: New-AzManagementGroupDeployment
    C: New-AzResourceGroupDeployment
    D: New-AzTenantDeployment
  answer: A
  user_answer: A
  user_result: correct
  user_reasoning: Creating a resource group requires a subscription-level deployment.
  learning_note: |
    Choose deployment scope from the resource being created. Creating a resource
    group requires subscription scope; deploying resources into an existing
    resource group uses New-AzResourceGroupDeployment.
    The deployment's -Location stores deployment metadata; each resource's
    location property determines that resource's region.
  explanation: |
    **A — New-AzSubscriptionDeployment** is correct. The template creates the
    Marketing resource group in East US, so deploy it at subscription scope.
    New-AzDeployment is an alias for this subscription deployment cmdlet.

    ```powershell
    New-AzSubscriptionDeployment -Location eastus -TemplateFile ./Template.json
    ```

    B deploys at management group scope, C at resource group scope, and D at
    tenant scope. C is used to deploy resources into an existing resource group.

    The exhibit contains a schema mismatch: it shows the resource group
    deployment schema. For a subscription deployment, use:

    ```json
    "$schema": "https://schema.management.azure.com/schemas/2018-05-01/subscriptionDeploymentTemplate.json#"
    ```

    This defect does not change the intended cmdlet selection.

    [Microsoft Learn: Deploy ARM templates with Azure PowerShell](https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/deploy-powershell)
- id: '101'
  skill: Deploy and manage Azure compute resources
  sub-skill: Automate deployment of resources by using Azure Resource Manager (ARM) templates or Bicep files
  question: |
    You have an Azure subscription that contains a resource group named RG1.
    You plan to create a storage account named storage1.
    You have a Bicep file named File1.
    You need to modify File1 so that it can be used to automate the deployment
    of storage1 to RG1.
    Which property should you modify?
  choices:
    A: kind
    B: scope
    C: sku
    D: location
  answer: B
  user_answer: B
  user_result: correct
  learning_note: |
    Scope identifies the deployment target, such as a resource group. Location
    identifies the Azure region. A resource group's region does not require
    its resources to use that region.
  explanation: |
    **B — scope** is the intended answer. The requirement identifies RG1 as the
    deployment target. For a module deploying the storage account, set:

    ```bicep
    scope: resourceGroup('RG1')
    ```

    kind selects the storage account type, such as StorageV2. sku selects its
    performance and redundancy option, such as Standard_LRS. location selects
    the Azure region. None of these selects the destination resource group.

    The question omits File1, so the exact edit depends on its structure.
    scope belongs on a module when deploying a new storage account to a different
    resource group; it is not an arbitrary cross-resource-group property on a
    new storage account declaration. A resource-group-scoped file defaults to
    targetScope = 'resourceGroup', and the deployment command selects RG1.

    Remember: scope = deployment target; location = region.

    [Microsoft Learn: Bicep resource group deployments and module scope](https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/deploy-to-resource-group)
- id: '102'
  skill: Manage Azure identities and governance
  sub-skill: Manage Azure subscriptions and governance
  question: |
    HOTSPOT

    Your company purchases a new Azure subscription.
    You create a file named Deploy.json as shown in the following exhibit.

    ```json
    {
      "$schema": "https://schema.management.azure.com/schemas/2015-01-01/deploymentTemplate.json#",
      "contentVersion": "1.0.0.0",
      "parameters": {},
      "variables": {},
      "resources": [
        {
          "type": "Microsoft.Resources/resourceGroups",
          "apiVersion": "2018-05-01",
          "location": "eastus",
          "name": "[concat('RG', copyIndex())]",
          "copy": {
            "name": "copy",
            "count": 3
          }
        },
        {
          "type": "Microsoft.Resources/deployments",
          "apiVersion": "2021-04-01",
          "name": "lockDeployment",
          "resourceGroup": "RG1",
          "dependsOn": ["[resourceId('Microsoft.Resources/resourceGroups/', 'RG1')]"],
          "properties": {
            "mode": "Incremental",
            "template": {
              "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentTemplate.json#",
              "contentVersion": "1.0.0.0",
              "parameters": {},
              "variables": {},
              "resources": [
                {
                  "type": "Microsoft.Authorization/locks",
                  "apiVersion": "2016-09-01",
                  "name": "rgLock",
                  "properties": {
                    "level": "CanNotDelete"
                  }
                }
              ]
            }
          }
        },
        {
          "type": "Microsoft.Resources/deployments",
          "apiVersion": "2021-04-01",
          "name": "lockDeployment",
          "resourceGroup": "RG2",
          "dependsOn": ["[resourceId('Microsoft.Resources/resourceGroups/', 'RG2')]"],
          "properties": {
            "mode": "Incremental",
            "template": {
              "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentTemplate.json#",
              "contentVersion": "1.0.0.0",
              "parameters": {},
              "variables": {},
              "resources": [
                {
                  "type": "Microsoft.Authorization/locks",
                  "apiVersion": "2016-09-01",
                  "name": "rgLock",
                  "properties": {
                    "level": "ReadOnly"
                  }
                }
              ]
            }
          }
        }
      ],
      "outputs": {}
    }
    ```

    You connect to the subscription and run the following cmdlet.

    ```powershell
    New-AzDeployment -Location westus -TemplateFile "deploy.json"
    ```

    For each statement, select Yes if the statement is true. Otherwise, select No.
    NOTE: Each correct selection is worth one point.
  choices:
    You can deploy a virtual machine to RG1.:
      - Yes
      - No
    You can deploy a virtual machine to RG2.:
      - Yes
      - No
    You can manually create a resource group named RG3.:
      - Yes
      - No
  answer:
    You can deploy a virtual machine to RG1.: Yes
    You can deploy a virtual machine to RG2.: No
    You can manually create a resource group named RG3.: Yes
  user_answer:
    You can deploy a virtual machine to RG1.: Yes
    You can deploy a virtual machine to RG2.: No
    You can manually create a resource group named RG3.: Yes
  user_result: correct
  user_reasoning: |
    RG1 has a cannot-delete lock; RG2 has a read-only lock. The copy loop
    creates only RG0 through RG2, so RG3 can be created manually.
  learning_note: |
    CanNotDelete permits creation and updates but blocks deletion. ReadOnly
    blocks control-plane writes, including creating resources in a locked
    resource group. Resource group locks do not lock sibling resource groups
    or the subscription.
  explanation: |
    **Yes, No, Yes** is the intended answer, assuming the illustrated
    subscription deployment succeeds and the user has the required permissions.

    RG1 receives a CanNotDelete lock. It permits adding a VM and modifying
    resources, while preventing deletion.

    RG2 receives a ReadOnly lock. Resource group locks apply to resources
    within the group, so creating a VM in RG2 is blocked until the lock is removed.

    copyIndex() starts at 0. With count 3, the template creates RG0, RG1,
    and RG2. RG3 is available for manual creation, and the locks on RG1 and
    RG2 do not restrict creation of a separate resource group.

    The resource groups use eastus from the template. The cmdlet's westus
    value specifies the location of deployment metadata.

    The outer schema shown in the exhibit is a resource group deployment
    schema. A real subscription template should instead use
    https://schema.management.azure.com/schemas/2018-05-01/subscriptionDeploymentTemplate.json#.
    The nested resource group templates retain their resource group schema.

    [Microsoft Learn: Resource locks and inheritance](https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources)
    [Microsoft Learn: Subscription deployments](https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/deploy-to-subscription)
- id: '103'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  question: |
    You have an Azure subscription that contains the resources shown in the following table.

    | Name | Type | Resource group | Location |
    | --- | --- | --- | --- |
    | RG1 | Resource group | Not applicable | Central US |
    | RG2 | Resource group | Not applicable | West US |
    | VMSS1 | Virtual machine scale set | RG2 | West US |
    | Proximity1 | Proximity placement group | RG1 | West US |
    | Proximity2 | Proximity placement group | RG2 | Central US |
    | Proximity3 | Proximity placement group | RG1 | Central US |

    You need to configure a proximity placement group for VMSS1.

    Which proximity placement groups should you use?
  choices:
    A: Proximity2 only
    B: Proximity1, Proximity2, and Proximity3
    C: Proximity1 only
    D: Proximity1 and Proximity3 only
  answer: C
  user_answer: C
  user_result: correct
  learning_note: |
    A proximity placement group and its associated compute resources must be
    in the same Azure region. They can belong to different resource groups.
    Compare the resources' locations, not their resource groups' locations.
  explanation: |
    **C — Proximity1 only** is correct. VMSS1 is in West US, and Proximity1
    is the only proximity placement group in West US. Its placement in RG1
    does not prevent association with VMSS1 in RG2.

    Proximity2 is in Central US even though it shares RG2 with VMSS1.
    Proximity3 is also in Central US. Neither matches VMSS1's region, so
    A, B, and D include unsuitable groups.

    A proximity placement group brings compute resources physically close
    together to reduce network latency. It cannot bring resources in different
    regions into the same physical placement. Set the association on the scale
    set rather than separately on each instance.

    Remember: same resource region required; same resource group not required.

    [Microsoft Learn: Proximity placement groups for scale sets](https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/proximity-placement-groups)
    [Microsoft Learn: Proximity placement group resource definition](https://learn.microsoft.com/en-us/azure/templates/microsoft.compute/proximityplacementgroups)
- id: '104'
  tags:
    - must-review
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure Azure App Service
  question: |
    HOTSPOT

    You have an Azure subscription that contains the virtual networks shown
    in the following table.

    | Name | Subnet | Subnet-associated network security group (NSG) | Peered with |
    | --- | --- | --- | --- |
    | VNet1 | Subnet1 | NSG1 | VNet2 |
    | VNet2 | Subnet2 | NSG2 | VNet1 |

    The subscription contains the virtual machines shown in the following table.

    | Name | Connected to |
    | --- | --- |
    | VM1 | Subnet1 |
    | VM2 | Subnet2 |

    The subscription contains the Azure App Service web apps shown in the following table.

    | Name | Description |
    | --- | --- |
    | WebApp1 | Uses the Premium pricing tier and has virtual network integration with VNet1 |
    | WebApp2 | Uses the Isolated pricing tier and is deployed to Subnet2 |

    For each statement, select Yes if the statement is true. Otherwise, select No.
    NOTE: Each correct selection is worth one point.
  choices:
    WebApp1 can communicate with VM2.:
      - Yes
      - No
    NSG1 controls inbound traffic to WebApp1.:
      - Yes
      - No
    WebApp2 can communicate with VM1.:
      - Yes
      - No
  answer:
    WebApp1 can communicate with VM2.: Yes
    NSG1 controls inbound traffic to WebApp1.: No
    WebApp2 can communicate with VM1.: Yes
  user_answer:
    WebApp1 can communicate with VM2.: Yes
    NSG1 controls inbound traffic to WebApp1.: Yes
    WebApp2 can communicate with VM1.: No
  user_result: partially_correct
  user_reasoning: |
    WebApp2 is in Subnet2/VNet2 and VM1 is in VNet1. Even though the networks
    are peered, believed dependence on NSG1 and NSG2 means WebApp2 cannot
    communicate with VM1.
  learning_note: |
    Multitenant App Service VNet integration provides outbound access; inbound
    NSG rules on the integration subnet do not control inbound app requests.
    An Isolated App Service runs in an App Service Environment within a VNet.
    Peering enables connectivity in either direction, subject to NSGs and
    routing. An unspecified NSG is not evidence of a blocking rule.
  explanation: |
    **Yes, No, Yes** is the intended answer. Your first selection is correct;
    the second and third need correction.

    WebApp1 can make outbound calls through VNet integration to resources in
    peered VNet2, including VM2. This assumes appropriate peering settings,
    routes, NSG rules, and the VM's guest firewall and service configuration.

    NSG1 does not control inbound requests to WebApp1 merely because the app
    has VNet integration. Integration is for outbound connectivity. NSG1 can
    restrict outbound traffic from the integration subnet. App access
    restrictions or private endpoints can be used to control inbound access.

    WebApp2 uses the Isolated tier, meaning it runs in an App Service Environment
    within VNet2. It can communicate with VM1 through VNet peering. You are
    right that NSG2 outbound and NSG1 inbound rules matter, but no blocking
    rules are given. The same caveat applies to the first statement, so it
    does not justify answering No only for WebApp2.

    Treat the two Yes answers as connectivity capability, not a guarantee
    that every protocol is allowed by unknown security rules.

    There is also a scenario defect: an App Service Environment requires a
    dedicated subnet, so VM2 cannot actually share Subnet2 with that environment.
    In a real deployment, place VM2 in another subnet of VNet2. This does not
    change the intended VNet integration and peering concepts being tested.

    Remember: VNet integration = outbound access; Isolated environment = hosted
    inside a VNet; peering = connectivity subject to security rules.

    [Microsoft Learn: App Service VNet integration](https://learn.microsoft.com/en-us/azure/app-service/overview-vnet-integration)
    [Microsoft Learn: App Service Environment networking](https://learn.microsoft.com/en-us/azure/app-service/environment/networking)
- id: '106'
  skill: Deploy and manage Azure compute resources
  sub-skill: Provision and manage containers in the Azure portal
  question: |
    You have an Azure subscription that contains an Azure container registry named ContReg1.
    You enable the Admin user for ContReg1.
    Which username can you use to sign in to ContReg1?
  choices:
    A: root
    B: admin
    C: administrator
    D: ContReg1
  answer: D
  user_answer: A
  user_result: incorrect
  learning_note: |
    The Azure Container Registry admin account uses the registry name as its
    username. Enabling Admin user does not create a Linux root account or a
    username literally named admin or administrator.
  explanation: |
    **D — ContReg1** is correct. The registry's built-in admin account uses
    the registry name as its username and either of its two generated passwords.
    View the username under the registry's Settings > Access keys in the portal.

    Your answer root is option A. root is a Linux superuser account name;
    it is not this registry's authentication username. Similarly, admin and
    administrator are not the registry admin username.

    You can retrieve only the username without displaying passwords:

    ```azurecli
    az acr credential show --name ContReg1 --query username --output tsv
    ```

    Remember: ACR admin username = registry name.

    [Microsoft Learn: Admin account authentication](https://learn.microsoft.com/en-us/azure/container-registry/container-registry-authentication)
    [Microsoft Learn: Admin login using the registry name](https://learn.microsoft.com/en-us/powershell/module/az.containerregistry/connect-azcontainerregistry)
