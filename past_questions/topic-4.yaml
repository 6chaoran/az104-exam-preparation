- id: '072'
  skill: Monitor and maintain Azure resources
  sub-skill: Implement backup and recovery
  question: |
    You have an Azure subscription that contains the following resources:

    | Name | Type | Resource group | Location |
    | --- | --- | --- | --- |
    | Vault1 | Recovery Services vault | RG1 | East US |
    | VM1 | Virtual machine | RG1 | East US |
    | VM2 | Virtual machine | RG1 | West US |

    All virtual machines run Windows Server 2016.

    On VM1, you back up a folder named Folder1 as shown in the following exhibit.

    **Schedule Backup Wizard — Specify Backup Schedule (Files and Folders)**

    Schedule a backup every: Day (selected); Week (not selected).
    At following times (maximum allowed is three times a day):

    | First time | Second time | Third time |
    | --- | --- | --- |
    | 6:00 AM | 10:00 PM | None |

    You plan to restore the backup to a different virtual machine.
    You need to restore the backup to VM2.

    What should you do first?
  choices:
    A: From VM1, install the Windows Server Backup feature.
    B: From VM2, install the Microsoft Azure Recovery Services Agent.
    C: From VM1, install the Microsoft Azure Recovery Services Agent.
    D: From VM2, install the Windows Server Backup feature.
  answer: B
  user_answer: B
  user_result: correct
  learning_note: |
    For MARS file-and-folder recovery on another machine, install the MARS agent
    on the destination and register it with the same vault. The same-region
    requirement for Azure VM-level backup does not restrict this file recovery.
  explanation: |
    **B** is correct. The exhibit shows a Microsoft Azure Recovery Services
    (MARS) agent file-and-folder backup. Install the MARS agent on VM2 first,
    register it with Vault1, and use Recover Data with Another server selected
    to recover VM1's files. You need vault credentials and the encryption
    passphrase used for the source backup.

    VM2 being in West US does not prevent alternate-machine MARS file recovery
    from Vault1 in East US. This is different from backing up an entire Azure VM
    to a Recovery Services vault, which requires the VM and vault in the same region.

    **A and D** are incorrect because Windows Server Backup is not the recovery
    tool for this MARS backup. **C** targets the source machine, which already
    uses the agent to perform the illustrated backup.

    [Microsoft Learn: Install and register the MARS agent](https://learn.microsoft.com/en-us/azure/backup/install-mars-agent)
