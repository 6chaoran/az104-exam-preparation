- id: '047'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  question: |
    You have an Azure subscription named Subscription1.

    You deploy a Linux virtual machine named VM1 to Subscription1.

    You need to monitor the metrics and the logs of VM1.

    What should you use?
  choices:
    A: Azure HDInsight
    B: Azure Monitor Agent
    C: the AzurePerformanceDiagnostics extension
    D: Azure Analysis Services
  answer: B
  user_answer: A
  user_result: incorrect
  learning_note: |
    Azure Monitor Agent collects Linux VM guest OS logs and performance data
    according to data collection rules (DCRs). HDInsight is a big-data analytics
    service. Option B was updated from legacy LAD 3.0 at the user's request.
  explanation: |
    **B — Azure Monitor Agent (AMA)** is correct. Configure AMA with data
    collection rules to collect Linux guest performance counters and logs,
    including syslog, and send them to the configured monitoring destinations.
    The attempted answer A is incorrect.

    - **A:** HDInsight runs big-data analytics workloads; it is not the VM's
      guest monitoring agent.
    - **C:** AzurePerformanceDiagnostics is intended for performance diagnosis,
      rather than the general metrics-and-logs collection described here.
    - **D:** Azure Analysis Services provides analytical data models, rather
      than Linux VM monitoring.

    Option B has been modernized from the original Linux Diagnostic Extension
    (LAD) 3.0. Azure Diagnostics extensions retired on March 31, 2026; AMA with
    DCRs is the current replacement for collecting guest OS logs and performance
    data.

    [Microsoft Learn: Migrate from WAD/LAD to Azure Monitor Agent](https://learn.microsoft.com/en-us/azure/azure-monitor/agents/azure-monitor-agent-migration-wad-lad)
- id: '048'
  skill: Implement and manage virtual networking
  sub-skill: Configure secure access to virtual networks
  question: |
    HOTSPOT

    You have an Azure subscription named Subscription1. Subscription1 contains
    a virtual machine named VM1.

    You install and configure a web server and a DNS server on VM1.

    VM1 has the effective network security rules shown in the following exhibit:

    - Network interface: vm1441
    - Virtual network/subnet: VNET1/default
    - NIC public IP: 52.160.123.200
    - NIC private IP: 10.0.6.4
    - Accelerated networking: Disabled
    - Network security group: VM1-nsg, attached to network interface vm1441
    - Impacts: 0 subnets, 1 network interface

    Inbound port rules:

    | Priority | Name | Port | Protocol | Source | Destination | Action |
    |----------|------|------|----------|--------|-------------|--------|
    | 100 | Rule2 | 50-60 | Any | Any | Any | Deny |
    | 300 | RDP | 3389 | TCP | Any | Any | Allow |
    | 400 | Rule1 | 50-500 | Any | Any | Any | Allow |
    | 65000 | AllowVnetInBound | Any | Any | VirtualNetwork | VirtualNetwork | Allow |
    | 65001 | AllowAzureLoadBalancerInBound | Any | Any | AzureLoadBalancer | Any | Allow |
    | 65500 | DenyAllInBound | Any | Any | Any | Any | Deny |

    Use the drop-down menus to select the answer choice that completes each
    statement based on the information presented in the graphic.

    NOTE: Each correct selection is worth one point.
  choices:
    Internet users:
      - can connect to only the DNS server on VM1
      - can connect to only the web server on VM1
      - can connect to the web server and the DNS server on VM1
      - cannot connect to the web server and the DNS server on VM1
    If you delete Rule2, Internet users:
      - can connect to only the DNS server on VM1
      - can connect to only the web server on VM1
      - can connect to the web server and the DNS server on VM1
      - cannot connect to the web server and the DNS server on VM1
  answer:
    Internet users: can connect to only the web server on VM1
    If you delete Rule2, Internet users: can connect to the web server and the DNS server on VM1
  user_answer:
    Internet users: can connect to only the web server on VM1
    If you delete Rule2, Internet users: can connect to the web server and the DNS server on VM1
  user_result: correct
  learning_note: |
    NSG rules are evaluated from lowest priority number to highest, stopping
    at the first match. DNS uses port 53; HTTP and HTTPS use ports 80 and 443.
    A higher-priority deny can override a broader, lower-priority allow.
  explanation: |
    Both selections are correct, assuming the services use their standard ports
    and the guest firewall allows them.

    **Internet users can connect to only the web server.** Rule2 at priority
    100 denies ports 50–60 for any protocol, blocking DNS on port 53 over both
    UDP and TCP. Rule1 at priority 400 allows ports 50–500, including HTTP on
    TCP 80 and HTTPS on TCP 443. DNS matches Rule2 first, so Rule1 cannot allow it.

    **After deleting Rule2, Internet users can connect to both servers.**
    Rule1 now allows DNS port 53 as well as web ports 80 and 443.

    Azure processes rules by ascending priority number and stops at the first
    matching rule. The RDP rule on TCP 3389 does not affect either service.
    These answers describe new connections under the effective rules shown;
    NSG rule changes do not necessarily terminate existing connections.

    [Microsoft Learn: NSG rule processing order](https://learn.microsoft.com/en-us/troubleshoot/azure/virtual-network/virtual-network-troubleshoot-nsg-blocking-traffic)
- id: '049'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  question: |
    You plan to deploy three Azure virtual machines named VM1, VM2, and VM3.
    The virtual machines will host a web app named App1.

    You need to ensure that at least two virtual machines are available if a
    single Azure datacenter becomes unavailable.

    What should you deploy?
  choices:
    A: all three virtual machines in a single Availability Zone
    B: all virtual machines in a single Availability Set
    C: each virtual machine in a separate Availability Zone
    D: each virtual machine in a separate Availability Set
  answer: C
  user_answer: C
  user_result: correct
  learning_note: |
    Spread three VMs across three availability zones to retain two VMs after
    a single-zone outage. Availability sets spread VMs across fault and update
    domains but do not guarantee protection against a whole datacenter outage.
  explanation: |
    **C — each virtual machine in a separate Availability Zone** is correct.
    Availability zones are physically separate groups of datacenters within
    a region, with independent power, cooling, and networking. Place VM1 in
    zone 1, VM2 in zone 2, and VM3 in zone 3. An outage affecting one zone leaves
    the other two VMs available, satisfying the single-datacenter failure goal.

    - **A:** All three VMs share one zone, so a zone outage can affect all three.
    - **B:** An availability set protects against localized hardware failures
      and coordinates platform updates; it does not guarantee datacenter isolation.
    - **D:** Separate availability sets do not guarantee separate datacenters.

    Deploy in a region that supports three availability zones for the chosen
    VM size. Application traffic routing and data resilience must also support
    the surviving VMs for App1 to remain usable.

    [Microsoft Learn: Reliability in Azure Virtual Machines](https://learn.microsoft.com/en-us/azure/reliability/reliability-virtual-machines)
    [Microsoft Learn: Regions and availability zones](https://learn.microsoft.com/en-us/azure/well-architected/resiliency/regions-availability-zones)
- id: '050'
  tags:
    - must-review
  skill: Deploy and manage Azure compute resources
  sub-skill: Automate deployment of resources by using Azure Resource Manager (ARM) templates or Bicep files
  question: |
    You have an Azure virtual machine named VM1 that runs Windows Server 2019.

    You save VM1 as a template named Template1 to the Azure Resource Manager library.

    You plan to deploy a virtual machine named VM2 from Template1.

    What can you configure during the deployment of VM2?
  choices:
    A: operating system
    B: administrator username
    C: virtual machine size
    D: resource group
  answer: D
  user_answer: B
  user_result: incorrect
  learning_note: |
    The target resource group is selected as the deployment scope. VM settings
    can be changed at deployment only when exposed as template parameters;
    otherwise, edit the template first. Exported templates often hard-code settings.
  explanation: |
    **D — resource group** is the intended answer. You select the target resource
    group when deploying a resource-group-scoped ARM template. This selection
    does not require changing VM properties in the saved template.

    The attempted answer **B** is incorrect under the question's assumption of
    deploying the saved VM template without modifying its fixed properties.

    **A, B, and C** describe VM properties defined by the template. If these
    properties are hard-coded, you must edit or parameterize the template to
    change them. Simply saving a VM as a template does not guarantee that its
    operating system, administrator username, or size becomes a deployment input.

    The question omits Template1's actual parameters, so it is underspecified:
    a template can expose administrator username or VM size as parameters.
    Do not interpret this answer as a universal ARM restriction. Resource group
    is the deployment-scope choice that is independent of those VM parameters.

    [Microsoft Learn: Export templates in the Azure portal](https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/export-template-portal)
    [Microsoft Learn: Deploy ARM templates with PowerShell](https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/deploy-powershell)
- id: '051'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  question: |
    You have an Azure subscription that contains an Azure virtual machine named VM1. VM1 runs a financial reporting app named App1 that does not support multiple active instances.

    At the end of each month, CPU usage for VM1 peaks when App1 runs.

    You need to create a scheduled runbook to increase the processor performance of VM1 at the end of each month.

    What task should you include in the runbook?
  choices:
    A: Add the Azure Performance Diagnostics agent to VM1.
    B: Modify the VM size property of VM1.
    C: Add VM1 to a scale set.
    D: Increase the vCPU quota for the subscription.
    E: Add a Desired State Configuration (DSC) extension to VM1.
  answer: B
  user_answer: B
  user_result: correct
  learning_note: 'Scale up by resizing the existing VM when the application cannot
    support multiple active instances. Increasing subscription quota does not allocate
    more CPU to an existing VM. Resizing a running VM causes a restart.'
  explanation: |
    **B — Modify the VM size property of VM1** is correct. The scheduled runbook can resize VM1 to a suitable SKU with greater CPU capacity before the month-end workload. This is vertical scaling and retains a single active application instance.

    - **A:** Performance Diagnostics helps investigate performance problems; installing it does not increase allocated processor capacity.
    - **C:** Adding the VM to a scale set does not itself increase its CPU capacity. Scaling out with additional active instances conflicts with App1's limitation.
    - **D:** A quota increase raises the subscription's permitted capacity; it does not change VM1's allocated vCPUs.
    - **E:** DSC manages guest configuration; installing its extension does not resize the VM.

    Resizing a running VM causes a restart, and some size changes require deallocation. Schedule the resize before reporting begins and ensure the target SKU is available with sufficient quota. A later scheduled resize can return VM1 to its normal size to reduce costs.

    [Microsoft Learn: Resize a virtual machine](https://learn.microsoft.com/azure/virtual-machines/acu)
    [Microsoft Learn: Resize a VM with Azure PowerShell](https://learn.microsoft.com/en-us/azure/virtual-machines/windows/tutorial-manage-vm)
- id: '052'
  skill: Deploy and manage Azure compute resources
  sub-skill: Automate deployment of resources by using Azure Resource Manager (ARM) templates or Bicep files
  question: |
    You plan to deploy several Azure virtual machines that will run Windows
    Server 2019 in a virtual machine scale set by using an Azure Resource
    Manager template.

    You need to ensure that NGINX is available on all the virtual machines
    after they are deployed.

    What should you use?
  choices:
    A: Deployment Center in Azure App Service
    B: A Desired State Configuration (DSC) extension
    C: the New-AzConfigurationAssignment cmdlet
    D: a Microsoft Intune device configuration profile
  answer: B
  user_answer: B
  user_result: correct
  learning_note: |
    Include the DSC extension and a configuration that installs NGINX in the
    scale-set ARM template. The extension applies guest configuration to each
    VM instance; installing the extension alone does not install NGINX.
  explanation: |
    **B — A Desired State Configuration (DSC) extension** is correct.
    PowerShell DSC can declare and apply the required software configuration
    inside Windows VMs. Include the extension in the scale-set model and supply
    a DSC configuration that downloads, installs, and configures NGINX on each
    instance. Newly provisioned instances receive the same configuration.

    - **A:** App Service Deployment Center deploys applications to App Service,
      rather than installing software inside scale-set VMs.
    - **C:** New-AzConfigurationAssignment creates a Maintenance Configuration
      assignment; it does not install NGINX.
    - **D:** Intune device configuration profiles are not the scale-set ARM
      extension mechanism for installing this server application.

    DSC is the appropriate choice among the listed answers. A Custom Script
    Extension or a prepared VM image could also install the application, but
    neither is offered here.

    [Microsoft Learn: Deploy applications to a VM scale set](https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/virtual-machine-scale-sets-deploy-app)
    [Microsoft Learn: Windows scale set with an ARM template](https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/quick-create-template-windows)
- id: '053'
  skill: Deploy and manage Azure compute resources
  sub-skill: Provision and manage containers in the Azure portal
  question: |
    HOTSPOT

    You deploy an Azure Kubernetes Service (AKS) cluster that has the network
    profile shown in the following exhibit.

    | Setting | Value |
    |---------|-------|
    | Type (plugin) | Basic (Kubenet) |
    | Pod CIDR | 10.244.0.0/16 |
    | Service CIDR | 10.0.0.0/16 |
    | DNS service IP | 10.0.0.10 |
    | Docker bridge CIDR | 172.17.0.1/16 |
    | HTTP application routing | Disabled |

    Use the drop-down menus to select the answer choice that completes each
    statement based on the information presented in the graphic.

    NOTE: Each correct selection is worth one point.
  choices:
    Containers will be assigned an IP address in the following subnet:
      - 10.244.0.0/16
      - 10.0.0.0/16
      - 172.17.0.1/16
    Services in the AKS cluster will be assigned an IP address in the following subnet:
      - 10.244.0.0/16
      - 10.0.0.0/16
      - 172.17.0.1/16
  answer:
    Containers will be assigned an IP address in the following subnet: 10.244.0.0/16
    Services in the AKS cluster will be assigned an IP address in the following subnet: 10.0.0.0/16
  user_answer:
    Containers will be assigned an IP address in the following subnet: 10.244.0.0/16
    Services in the AKS cluster will be assigned an IP address in the following subnet: 10.0.0.0/16
  user_result: correct
  learning_note: |
    Pod CIDR supplies pod IP addresses; containers in the same pod share its
    network namespace and IP address. Service CIDR supplies virtual ClusterIP
    addresses, including the cluster DNS service IP. Neither range is the
    legacy Docker bridge range.
  explanation: |
    Both selections are correct:

    - **Containers: 10.244.0.0/16**, the Pod CIDR. More precisely, Kubernetes
      assigns an IP to each pod, and containers in that pod share the IP.
    - **Services: 10.0.0.0/16**, the Service CIDR used for ClusterIP addresses.
      The DNS service IP, 10.0.0.10, is an example within this range.

    Kubenet allocates smaller pod address blocks from the Pod CIDR to nodes.
    The Service CIDR is a virtual service address range, not an Azure VNet
    subnet. A LoadBalancer service can additionally have an external IP, which
    is separate from its ClusterIP.

    The legacy Docker bridge value 172.17.0.1/16 is reproduced from the exhibit;
    its underlying network prefix is 172.17.0.0/16. It is not the pod or service
    range requested by either statement. HTTP application routing being disabled
    does not change these IP allocations.

    [Microsoft Learn: Configure kubenet networking](https://learn.microsoft.com/en-us/azure/aks/configure-kubenet)
    [Microsoft Learn: AKS IP address planning](https://learn.microsoft.com/en-us/azure/aks/concepts-network-ip-address-planning)
- id: '054'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure Azure App Service
  question: |
    HOTSPOT

    You have the App Service plan shown in the following exhibit.

    Default profile: Auto created scale condition.
    Scale mode: Scale based on a metric.

    | Rule | Metric resource | CPU condition | Action |
    |------|-----------------|---------------|--------|
    | Scale out | homepage | (Maximum) CpuPercentage > 85 | Increase count by 1 |
    | Scale in | homepage | (Average) CpuPercentage < 30 | Decrease count by 1 |

    | Instance limit | Value |
    |----------------|-------|
    | Minimum | 1 |
    | Maximum | 5 |
    | Default | 1 |

    This scale condition is executed when none of the other scale conditions match.

    The scale-in settings are configured as follows:

    | Setting | Value |
    |---------|-------|
    | Operator | Less than |
    | Metric threshold | 30% |
    | Duration | 5 minutes |
    | Time grain | 1 minute |
    | Time grain statistic | Average |
    | Operation | Decrease count by |
    | Instance count | 1 |
    | Cool down | 5 minutes |

    The scale-out rule is configured with the same duration and cooldown time
    as the scale-in rule.

    Use the drop-down menus to select the answer choice that completes each
    statement based on the information presented in the graphic.

    NOTE: Each correct selection is worth one point.

    1. If after deployment CPU usage is 70 percent for one hour and then reaches
       90 percent for five minutes, at that time the total number of instances
       will be [answer choice].
    2. If after deployment the CPU maintains constant usage of 90 percent for
       one hour, and then the average CPU usage is below 25 percent for nine
       minutes, at that point the number of instances will be [answer choice].
  choices:
    Scenario 1 instance count: [1, 2, 3, 4, 5]
    Scenario 2 instance count: [1, 2, 3, 4, 5]
  answer:
    Scenario 1 instance count: 2
    Scenario 2 instance count: 4
  user_answer:
    Scenario 1 instance count: 2
    Scenario 2 instance count: 4
  user_result: correct
  user_reasoning: |
    The first scenario triggers scale-out. In the second scenario, an hour at
    90% reaches five instances, then five minutes below 25% triggers one scale-in.
  learning_note: |
    The intended exam calculation is 2 and 4. Distinguish the metric evaluation
    window from the cooldown after a scaling action. Sustained high CPU can
    trigger repeated scale-out actions up to the maximum instance count.
  explanation: |
    Both answers match the intended exam calculation:

    - **Scenario 1: 2 instances.** Start at one instance. CPU at 70% matches
      neither rule. The five-minute period at 90% triggers an increase by one.
    - **Scenario 2: 4 instances.** Sustained 90% CPU triggers repeated increases
      until the maximum of five instances is reached. Low CPU then satisfies
      the scale-in rule, removing one instance. Under the simplified timing
      used by the question, the next decrease cannot occur until the cooldown
      expires, beyond the nine-minute low-CPU period.

    Duration defines a rolling metric evaluation window; cooldown defines the
    wait after a scaling operation before another action is eligible. They
    serve different purposes.

    Real autoscale timing is less exact than this question implies. In
    particular, Maximum over a five-minute window can exceed 85% before CPU
    has remained high for a full five minutes. Evaluation timing, metric
    availability, provisioning, and scale-in flapping checks also affect the
    observed count. Treat 2 and 4 as the intended exam answers rather than a
    guaranteed production timeline at an exact minute boundary.

    [Microsoft Learn: Understand autoscale settings](https://learn.microsoft.com/en-au/azure/azure-monitor/autoscale/autoscale-understanding-settings)
    [Microsoft Learn: Autoscale best practices](https://learn.microsoft.com/en-us/azure/azure-monitor/autoscale/autoscale-best-practices)
- id: '055'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  question: |
    You have an Azure virtual machine named VM1 that runs Windows Server 2019.
    The VM was deployed using default drive settings.

    You sign in to VM1 as a user named User1 and perform the following actions:

    - Create files on drive C.
    - Create files on drive D.
    - Modify the screen saver timeout.
    - Change the desktop background.

    You plan to redeploy VM1.

    Which changes will be lost after you redeploy VM1?
  choices:
    A: the modified screen saver timeout
    B: the new desktop background
    C: the new files on drive D
    D: the new files on drive C
  answer: C
  user_answer: B
  user_result: incorrect
  learning_note: |
    With the default Windows VM layout in this question, C: is the persistent
    OS disk and D: is host-local temporary storage. Redeployment moves the VM
    to a new host and loses temporary disk data while retaining the OS disk
    and the user profile settings stored there.
  explanation: |
    **C — the new files on drive D** is correct. The attempted answer B is incorrect.

    Redeployment shuts down VM1, moves it to another Azure host, and starts it
    again. Data on the host-local temporary disk is lost. For the default
    Windows layout assumed here, that disk is **D:**.

    - **A:** The screen saver timeout is saved in the user's persistent profile
      configuration and remains after redeployment.
    - **B:** The desktop background setting also remains in the user profile
      on the persistent OS disk, assuming its image is stored persistently.
    - **D:** New files on C: remain because the ordinary OS disk is persistent.

    This is redeployment to another host, not reimaging Windows. Drive letters
    can be customized, and some VM sizes have no temporary disk. An explicitly
    configured ephemeral OS disk has different persistence behavior; the
    question assumes the default persistent OS disk and temporary D: drive.

    [Microsoft Learn: Redeploy a Windows VM](https://learn.microsoft.com/en-us/troubleshoot/azure/virtual-machines/windows/redeploy-to-new-node-windows)
    [Microsoft Learn: Windows VM temporary disk FAQ](https://learn.microsoft.com/en-us/azure/virtual-machines/windows/faq)
- id: '056'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  question: |
    You have an Azure subscription.

    You have an on-premises virtual machine named VM1. The settings for VM1
    are shown in the exhibit. (Click the Exhibit tab.)

    Settings for VM1 on LON-HOST1:

    | Setting | Value |
    |---------|-------|
    | BIOS | Boot from CD |
    | Security | Key Storage Drive disabled |
    | Memory | 32768 MB |
    | Processor | 8 virtual processors |
    | IDE Controller 0, Hard Drive | VM1.vhdx |
    | IDE Controller 1, DVD Drive | None |
    | SCSI Controller | Present |
    | Network Adapter | VNET1 |
    | Network Adapter | VNET2 |
    | COM 1 | None |
    | COM 2 | None |
    | Diskette Drive | None |
    | Name | VM1 |
    | Checkpoints | Production |

    Integration Services:

    | Service | Enabled |
    |---------|---------|
    | Operating system shutdown | Yes |
    | Time synchronization | Yes |
    | Data Exchange | Yes |
    | Heartbeat | Yes |
    | Backup (volume shadow copy) | Yes |
    | Guest services | No |

    You need to ensure that you can use the disks attached to VM1 as a template
    for Azure virtual machines.

    What should you modify on VM1?
  choices:
    A: the memory
    B: the network adapters
    C: the hard drive
    D: the processor
    E: Integration Services
  answer: C
  user_answer: E
  user_result: incorrect
  learning_note: |
    The exhibit's VM1.vhdx identifies the disk-format issue. For the standard
    Azure VM image upload path, convert to a fixed-size VHD. Changing Hyper-V
    Integration Services does not resolve a VHDX format mismatch.
  explanation: |
    **C — the hard drive** is correct. The attempted answer E is incorrect.

    The attached disk is **VM1.vhdx**. Azure's standard uploaded VM image disk
    format is a **fixed-size VHD**, so convert the disk from VHDX to VHD and
    ensure it uses fixed allocation and meets Azure's size alignment requirements.
    Hyper-V Manager's Edit Disk wizard or Convert-VHD can perform the conversion.
    Merely renaming the file extension does not convert the disk.

    **A and D:** Memory and CPU capacity are selected through the Azure VM size;
    these on-premises settings do not solve the disk-format issue.
    **B:** Azure networking is configured when deploying the VM; changing the
    on-premises adapters does not convert its disk.
    **E:** The unchecked Guest services option is a distractor. Enabling it does
    not make the VHDX disk a supported uploaded VHD image.

    Disk conversion is the tested requirement, not the complete image preparation
    process. A reusable generalized Windows image also requires appropriate OS
    preparation, including Sysprep. Some upload tools, such as Add-AzVHD with
    Hyper-V available, can perform the necessary conversion automatically.

    [Microsoft Learn: Prepare a Windows VHD for Azure](https://learn.microsoft.com/en-us/azure/virtual-machines/windows/prepare-for-upload-vhd-image)
- id: '057'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  question: |
    HOTSPOT

    You have an Azure subscription that contains a virtual machine scale set.
    The scale set contains four instances that have the following configurations:

    - Operating system: Windows Server 2016
    - Size: Standard_D1_v2

    You run the Get-AzVmss cmdlet as shown in the following exhibit:

    ```powershell
    (Get-AzVmss -Name WebProd -ResourceGroupName RG1).VirtualMachineProfile.OsProfile.WindowsConfiguration
    ```

    ```text
    ProvisionVMAgent        : True
    EnableAutomaticUpdates : False
    TimeZone               :
    AdditionalUnattendContent :
    WinRM                  :
    ```

    ```powershell
    Get-AzVmss -Name WebProd -ResourceGroupName RG1 | Select -ExpandProperty UpgradePolicy
    ```

    | Mode | RollingUpgradePolicy | AutomaticOSUpgradePolicy |
    |------|----------------------|--------------------------|
    | Automatic | | Microsoft.Azure.Management.Compute.Models.AutomaticOSUpgradePolicy |

    Use the drop-down menus to select the answer choice that completes each
    statement based on the information presented in the graphic.

    NOTE: Each correct selection is worth one point.

    1. When an administrator changes the virtual machine size, the size will be
       changed on up to [answer choice] virtual machines simultaneously.
    2. When a new build of the Windows Server 2016 image is released, the new
       build will be deployed to up to [answer choice] virtual machines simultaneously.
  choices:
    VM size changes simultaneously: [0, 1, 2, 4]
    New OS image build deployments simultaneously: [0, 1, 2, 4]
  answer:
    VM size changes simultaneously: 4
    New OS image build deployments simultaneously: 0
  user_answer:
    VM size changes simultaneously: 0
    New OS image build deployments simultaneously: 4
  user_result: incorrect
  learning_note: |
    Automatic upgrade mode applies scale-set model changes and can affect
    every instance at once. It does not automatically enable publisher OS
    image upgrades. EnableAutomaticUpdates controls guest Windows updates,
    not automatic OS image replacement.
  explanation: |
    The intended answers are **4, then 0**. Both attempted selections are incorrect.

    **VM size change: up to 4 simultaneously.** UpgradePolicy.Mode is Automatic.
    Azure automatically applies the updated scale-set model to existing instances,
    without the availability guarantees of rolling batches. All four instances
    can be affected at once.

    **New image build: 0 under the question's assumed default configuration.**
    A publisher releasing an image does not itself change the scale-set model.
    Automatic model upgrades and automatic OS image upgrades are separate settings.

    The exhibit is incomplete for proving the second answer: it displays an
    AutomaticOSUpgradePolicy object type, but not its EnableAutomaticOSUpgrade
    value. EnableAutomaticUpdates=False disables guest Windows automatic updates;
    it does not establish that automatic OS image upgrades are disabled. Indeed,
    Windows scale sets with automatic OS image upgrades require that value to be
    false. The intended 0 assumes OS image upgrades have not been explicitly enabled.

    If automatic OS image upgrades were enabled with the default batch settings,
    OS image rollout would use rolling batches of 20%, with at least one instance
    per batch. A four-instance scale set would upgrade one instance per batch,
    rather than all four simultaneously.

    [Microsoft Learn: Scale-set upgrade policy modes](https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/virtual-machine-scale-sets-upgrade-policy)
    [Microsoft Learn: Automatic OS image upgrades](https://learn.microsoft.com/th-th/azure/virtual-machine-scale-sets/virtual-machine-scale-sets-automatic-upgrade)
- id: '058'
  skill: Deploy and manage Azure compute resources
  sub-skill: Automate deployment of resources by using Azure Resource Manager (ARM) templates or Bicep files
  question: |
    You have an Azure subscription named Subscription1 that is used by several
    departments at your company. Subscription1 contains the resources in the
    following table:

    | Name | Type |
    |------|------|
    | storage1 | Storage account |
    | RG1 | Resource group |
    | container1 | Blob container |
    | share1 | File share |

    Another administrator deploys a virtual machine named VM1 and an Azure
    Storage account named storage2 by using a single Azure Resource Manager template.

    You need to view the template used for the deployment.

    From which blade can you view the template that was used for the deployment?
  choices:
    A: VM1
    B: RG1
    C: storage2
    D: container1
  answer: B
  user_answer: B
  user_result: correct
  learning_note: |
    To retrieve the original template, open the target resource group's
    Deployments, select the deployment, and select Template. Export template
    on a resource generates a snapshot of its current configuration instead.
  explanation: |
    **B — RG1** is correct under the question's intended assumption that the
    resources were deployed to RG1.

    Open **RG1 → Deployments → the relevant deployment → Template** to view
    the template used to deploy VM1 and storage2 together. Deployment history
    preserves the original deployment template rather than generating a new
    template from the current resource configuration.

    **A and C:** Exporting VM1 or storage2 creates a template representing the
    selected resource's current configuration; it is not the original combined
    deployment template. **D:** container1 is a blob container, not the
    resource-group deployment history blade.

    The question does not explicitly name the deployment's target resource
    group. RG1 is the only resource group listed and is the intended choice;
    in practice, inspect the group to which the template was actually deployed.

    [Microsoft Learn: Export a template from deployment history](https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/export-template-portal)
- id: '059'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure Azure App Service
  question: |
    You have an Azure web app named App1. App1 has the deployment slots shown in the following table:

    | Name | Function |
    |------|----------|
    | webapp1-prod | Production |
    | webapp1-test | Staging |

    In webapp1-test, you test several changes to App1.

    You back up App1.

    You swap webapp1-test for webapp1-prod and discover that App1 is experiencing performance issues.

    You need to revert to the previous version of App1 as quickly as possible.

    What should you do?
  choices:
    A: Redeploy App1
    B: Swap the slots
    C: Clone App1
    D: Restore the backup of App1
  answer: B
  user_answer: D
  user_result: incorrect
  learning_note: 'After a slot swap, staging holds the previous production version.
    Swap the same two slots again for the quickest rollback, provided staging has
    not been overwritten.'
  explanation: |
    **B — Swap the slots** is correct. The attempted answer D is incorrect for the requirement to revert as quickly as possible.

    After the first swap, webapp1-prod serves the updated version and webapp1-test holds the previous production version. Swapping the same two slots again returns that previous version to production without redeploying or restoring a backup.

    - **A:** Redeployment requires another deployment operation when the previous version is already available in staging.
    - **C:** Cloning creates another app and does not directly restore the existing production slot.
    - **D:** Backup restoration is unnecessary and slower than swapping back in this scenario. The mention of a backup is a distractor.

    This assumes the staging slot still holds the previous version. A slot swap does not undo changes to external databases or other shared data; those need a separate rollback strategy if changed.

    [Microsoft Learn: Roll back a slot swap](https://learn.microsoft.com/en-us/azure/app-service/deploy-staging-slots#roll-back-a-swap)
- id: '060'
  skill: Monitor and maintain Azure resources
  sub-skill: Implement backup and recovery
  question: |
    HOTSPOT

    You have an Azure subscription named Subscription1. Subscription1 contains
    two Azure virtual machines VM1 and VM2. VM1 and VM2 run Windows Server 2016.

    VM1 is backed up daily by Azure Backup without using the Azure Backup agent.

    VM1 is affected by ransomware that encrypts data.

    You need to restore the latest backup of VM1.

    To which location can you restore the backup? To answer, select the
    appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  choices:
    You can perform a file recovery of VM1 to:
      - VM1 only
      - VM1 or a new Azure virtual machine only
      - VM1 and VM2 only
      - A new Azure virtual machine only
      - Any Windows computer that has Internet connectivity
    You can restore VM1 to:
      - VM1 only
      - VM1 or a new Azure virtual machine only
      - VM1 and VM2 only
      - Any Windows computer that has Internet connectivity
  answer:
    You can perform a file recovery of VM1 to: Any Windows computer that has Internet connectivity
    You can restore VM1 to: VM1 or a new Azure virtual machine only
  user_answer:
    You can perform a file recovery of VM1 to: Any Windows computer that has Internet connectivity
    You can restore VM1 to: VM1 or a new Azure virtual machine only
  user_result: correct
  learning_note: |
    File recovery can mount recovery-point volumes on a compatible Windows
    computer, including an on-premises computer. Full VM restoration supports
    replacing the original VM's disks or creating a new Azure VM. Internet
    connectivity alone is not sufficient for file recovery; OS compatibility
    and the documented recovery script/network requirements also apply.
  explanation: |
    Both selections match the intended answers:

    - **File recovery: Any Windows computer that has Internet connectivity.**
      Download and run the recovery executable on a supported, compatible
      Windows computer to mount the backup volumes and copy the required files.
      The computer does not have to be the original VM or even an Azure VM.
    - **Full VM restore: VM1 or a new Azure virtual machine only.** Use Replace
      existing to restore the original VM's disks, or Create new to restore as
      a new Azure VM. The standard full-VM workflow does not directly overwrite
      the unrelated existing VM2.

    VM2's running state is not the reason it is excluded. Stopping VM2 does
    not make it a target for VM1's Replace existing restore: that workflow
    restores the original backed-up VM, VM1. Create new instead creates a VM
    with a name that does not already exist.

    There is a separate disk recovery workflow: restore VM1's disks, then
    manually attach the recovered disks to another compatible existing VM,
    potentially VM2. This does not mean the standard full-VM restore directly
    overwrites VM2. The exam answer concerns the standard VM restore workflow,
    not every possible use of recovered disks.

    The first choice is simplified exam wording. The recovery computer must
    meet the documented OS compatibility, permissions, iSCSI, and network access
    requirements; arbitrary Windows versions with Internet access are not all
    supported. For this Windows Server 2016 backup, choose a compatible OS.

    The backup described is Azure VM-level backup, rather than MARS agent
    file/folder backup. Ransomware encryption of guest files is not the same as
    Azure Disk Encryption. Successful recovery depends on selecting an intact
    recovery point from before the ransomware encrypted the data; the latest
    backup is useful only if it predates that damage.

    [Microsoft Learn: Recover files from Azure VM backups](https://learn.microsoft.com/en-us/azure/backup/backup-azure-restore-files-from-vm)
    [Microsoft Learn: Restore Azure VMs](https://learn.microsoft.com/en-us/azure/backup/backup-azure-arm-restore-vms)
- id: '061'
  skill: Monitor and maintain Azure resources
  sub-skill: Implement backup and recovery
  question: |
    You plan to back up an Azure virtual machine named VM1.

    You discover that the Backup Pre-Check status displays a status of Warning.

    What is a possible cause of the Warning status?
  choices:
    A: VM1 is stopped.
    B: VM1 does not have the latest version of the Azure VM Agent (WaAppAgent.exe)
      installed.
    C: VM1 has an unmanaged disk.
    D: A Recovery Services vault is unavailable.
  answer: B
  user_answer: D
  user_result: incorrect
  learning_note: 'Backup Pre-Check Warning indicates a configuration issue that might
    cause backup failures. An outdated Azure VM Agent is a documented example. Critical
    indicates an issue expected to cause failures.'
  explanation: |
    **B — VM1 does not have the latest Azure VM Agent installed** is correct. Microsoft identifies an outdated VM Agent as a possible cause of intermittent backup failures and a Warning precheck state. The attempted answer D is incorrect.

    Precheck states distinguish the severity of VM configuration issues:

    - **Passed:** No corrective action is indicated.
    - **Warning:** A configuration issue might cause a backup failure; corrective steps are recommended.
    - **Critical:** A configuration issue is expected to cause backup failures; corrective steps are required.

    **A:** Being stopped alone is not the documented Warning cause; stopped VMs can have crash-consistent backups. **C:** An unmanaged disk is not the agent-version warning being tested; historical Azure VM backup supported unmanaged disks, although current support and migration requirements should be checked. **D:** Vault unavailability is not the VM configuration warning described here.

    Inspect the precheck notification to identify the actual issue, and update the VM Agent when recommended. The Azure VM Agent is distinct from the MARS backup agent.

    [Microsoft Learn: Backup prechecks](https://learn.microsoft.com/th-th/azure/backup/backup-azure-manage-windows-server)
    [Microsoft Learn: VM backup troubleshooting](https://learn.microsoft.com/en-us/azure/backup/backup-azure-vms-troubleshoot)
- id: '063'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  question: |
    HOTSPOT

    You have an Azure subscription.
  
    You plan to use Azure Resource Manager templates to deploy 50 Azure virtual
    machines that will be part of the same availability set.

    You need to ensure that as many virtual machines as possible are available
    if the fabric fails or during servicing.

    How should you configure the template? To answer, select the appropriate
    options in the answer area.

    NOTE: Each correct selection is worth one point.

    ```json
    {
      "$schema": "https://schema.management.azure.com/schemas/2015-01-01/deploymentTemplate.json#",
      "contentVersion": "1.0.0.0",
      "parameters": {},
      "resources": [
        {
          "type": "Microsoft.Compute/availabilitySets",
          "name": "ha",
          "apiVersion": "2017-12-01",
          "location": "eastus",
          "properties": {
            "platformFaultDomainCount": "[answer choice]",
            "platformUpdateDomainCount": "[answer choice]"
          }
        }
      ]
    }
    ```
  choices:
    platformFaultDomainCount: [0, 1, 2, 3, 4]
    platformUpdateDomainCount: [10, 20, 25, 30, 40, 50]
  answer:
    platformFaultDomainCount: 3
    platformUpdateDomainCount: 20
  user_answer:
    platformFaultDomainCount: 4
    platformUpdateDomainCount: 50
  user_result: incorrect
  learning_note: |
    An availability set supports up to 3 fault domains and 20 update domains.
    Choose the highest supported counts to minimize how many VMs share one
    failure or maintenance domain. Domain counts are not equal to VM counts.
  explanation: |
    The correct selections are **3 fault domains and 20 update domains**.
    Both attempted values exceed the availability-set limits.

    Set the properties to numeric values:

    ```json
    "platformFaultDomainCount": 3,
    "platformUpdateDomainCount": 20
    ```

    **Fault domains** group VMs that share underlying power and network
    infrastructure. Spreading 50 VMs across three domains limits the impact of
    a single fault-domain failure. With balanced placement, the largest domain
    contains 17 VMs, leaving 33 unaffected by that domain's failure.

    **Update domains** group VMs that can be restarted together for planned
    maintenance. Only one update domain is serviced at a time. With 50 VMs
    across 20 domains, the largest group contains three VMs, leaving 47 outside
    the domain being serviced.

    Four fault domains and 50 update domains are not supported. For managed
    disks, the available fault-domain count varies by region between two and
    three; use the maximum supported in the target region. An availability set
    does not protect against a complete datacenter or region outage.

    [Microsoft Learn: Availability sets overview](https://learn.microsoft.com/en-gb/azure/virtual-machines/availability-set-overview)
    [Microsoft Learn: Template with 3 fault domains and 20 update domains](https://learn.microsoft.com/en-us/samples/azure/azure-quickstart-templates/availability-set-create-3fds-20uds/)
- id: '064'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  question: |
    Note: This question is part of a series of questions that present the same
    scenario. Each question in the series contains a unique solution that might
    meet the stated goals. Some question sets might have more than one correct
    solution, while others might not have a correct solution.

    After you answer a question in this section, you will NOT be able to return
    to it. As a result, these questions will not appear in the review screen.

    You have an Azure virtual machine named VM1 that runs Windows Server 2016.

    You need to create an alert in Azure when more than two error events are
    logged to the System event log on VM1 within an hour.

    Solution: You create an Azure Log Analytics workspace and configure the
    Agent configuration settings. You install the Microsoft Monitoring Agent
    on VM1. You create an alert in Azure Monitor and specify the Log Analytics
    workspace as the source.

    Does this meet the goal?
  choices:
    A: Yes
    B: No
  answer: A
  user_answer: A
  user_result: correct
  learning_note: |
    Collect System error events into Log Analytics, filter to VM1, and create
    a log search alert for more than two matching records in a one-hour window.
    The historical MMA configuration is replaced by Azure Monitor Agent and
    data collection rules for current deployments.
  explanation: |
    **A — Yes** is the intended historical answer. Workspace agent configuration
    can collect System error events from VM1 through Microsoft Monitoring Agent.
    A workspace-scoped Azure Monitor log search alert can count those records
    over one hour and trigger when the count is greater than two.

    Configure the alert to filter the Event table to VM1, EventLog equal to
    System, and EventLevel equal to 2 (Error). Use a one-hour evaluation window
    and a matching-record count threshold greater than 2. A workspace alone is
    insufficient unless collection and the alert condition are configured.

    **B** is incorrect under the historical scenario because the solution
    provides collection, storage, and log-based alerting for guest events.

    Microsoft Monitoring Agent (the legacy Log Analytics agent) retired on
    August 31, 2024. For a current deployment, install Azure Monitor Agent and
    associate a data collection rule that sends System error events to the
    Log Analytics workspace, then create the corresponding log search alert.
