    - **Image1: Azure Container Instances and App Services only.** Windows Server
      container images can run on ACI and App Service configured for Windows
      containers. Azure Container Apps does not support Windows images.
    - **Image2: Azure Container Instances, Azure Container Apps, and App Services.**
