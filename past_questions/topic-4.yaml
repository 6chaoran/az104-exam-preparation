- id: '001'
  skill: Deploy and manage Azure compute resources
  sub-skill: Provision and manage containers in the Azure portal
  tags:
    - "exam topic: Deploy and manage Azure compute resources"
    - Azure Kubernetes Service
    - Kubernetes manifests
    - Azure CLI
    - kubectl
  question: |
    Note: This question is part of a series of questions that present the same
    scenario. Each question in the series contains a unique solution that might
    meet the stated goals. Some question sets might have more than one correct
    solution, while others might not have a correct solution.

    After you answer a question in this section, you will NOT be able to return
    to it. As a result, these questions will not appear in the review screen.

    You deploy an Azure Kubernetes Service (AKS) cluster named AKS1.

    You need to deploy a YAML file to AKS1.

    Solution: From Azure CLI, you run az aks.

    Does this meet the goal?
  choices:
    A: Yes
    B: No
  answer: B
  user_answer: B
  user_result: correct
  learning_note: |
    Running az aks alone does not deploy a Kubernetes YAML manifest. Configure
    cluster access with az aks get-credentials, then deploy with kubectl apply -f.
  explanation: |
    **B — No** is correct.

    `az aks` is an Azure CLI command group for managing AKS clusters. Running
    the command group alone does not apply a YAML manifest to the cluster.

    Configure kubectl to connect to AKS1, then apply the YAML file:

    ```bash
    az aks get-credentials --resource-group <resource-group> --name AKS1
    kubectl apply -f <file.yaml>
    ```

    **A — Yes** is incorrect because the proposed solution does not include
    a command that deploys the Kubernetes resources defined in the YAML file.

    [Microsoft Learn: Deploy an AKS cluster using Azure CLI](https://learn.microsoft.com/en-us/azure/aks/learn/quick-kubernetes-deploy-cli)
