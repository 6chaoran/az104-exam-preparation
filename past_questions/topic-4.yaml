  choices:
    A: Instance1 only
    B: Instance2 only
    C: Instance1 and Instance2 only
    D: Instance3 and Instance4 only
  answer: D
  user_answer: D
  user_result: correct
  learning_note: |
    ACI multi-container groups support Linux containers only. Windows containers
    can run in single-container groups; do not interpret this as a ban on Windows
    containers in Azure Container Instances.
  explanation: |
    **D — Instance3 and Instance4 only** is the intended answer. Both instances
    run Linux and can be deployed together in an Azure Container Instances (ACI)
    multi-container group. Containers in a group share a host, local network,
    resources, and lifecycle.

    ACI supports both Linux and Windows containers, but multi-container groups
    support only Linux. Therefore, Instance1 and Instance2 cannot be combined
    into one multi-container group, even though both use Windows Server 2019.
    Windows and Linux containers cannot be mixed within one group.

    The wording is ambiguous: it does not explicitly say a multi-container group.
    A Windows container can run alone in a single-container group, so A and B
    are not inherently impossible deployments. D is the intended selection when
    the question asks which listed instances can be grouped together.

    Remember: ACI single container = Linux or Windows; multiple containers in
    one group = Linux only.

