- id: '024'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  question: |
    HOTSPOT

    You have an Azure subscription that contains an Azure Availability Set named
    WEBPROD-AS-USE2 as shown in the following exhibit.

    Command: `az vm availability-set list -g RG1`

    ```json
    [
      {
        "id": "/subscriptions/8372f433-2dcd-4361-b5ef-5b188fed87d0/resourceGroups/RG1/providers/Microsoft.Compute/availabilitySets/WEBPROD-AS-USE2",
        "location": "eastus2",
        "name": "WEBPROD-AS-USE2",
        "platformFaultDomainCount": 2,
        "platformUpdateDomainCount": 10,
        "proximityPlacementGroup": null,
        "resourceGroup": "RG1",
        "sku": {
          "capacity": null,
          "name": "Aligned",
          "tier": null
        },
        "statuses": null,
        "tags": {},
        "type": "Microsoft.Compute/availabilitySets",
        "virtualMachines": []
      }
    ]
    ```

    You add 14 virtual machines to WEBPROD-AS-USE2.

    Use the drop-down menus to select the answer choice that completes each
    statement based on the information presented in the graphic.

    NOTE: Each correct selection is worth one point.

    1. When Microsoft performs planned maintenance in East US 2, the maximum
       number of unavailable virtual machines will be [answer choice].
    2. If the server rack in the Azure datacenter that hosts WEBPROD-AS-USE2
       experiences a power failure, the maximum number of unavailable virtual
       machines will be [answer choice].
  choices:
    Maximum unavailable VMs during planned maintenance:
      - '2'
      - '7'
      - '10'
      - '14'
    Maximum unavailable VMs during a server rack power failure:
      - '2'
      - '7'
      - '10'
      - '14'
  answer:
    Maximum unavailable VMs during planned maintenance: '2'
    Maximum unavailable VMs during a server rack power failure: '7'
  user_answer:
    Maximum unavailable VMs during planned maintenance: '2'
    Maximum unavailable VMs during a server rack power failure: '7'
  user_result: correct
  learning_note: |
    Planned maintenance affects one update domain at a time; a rack power failure
    affects a fault domain. For 14 VMs across 10 update domains and two fault
    domains, the expected maximum affected counts are ceiling(14/10) = 2 and
    ceiling(14/2) = 7, respectively.
  explanation: |
    Correct selections: **2, 7.** Both attempted selections are correct.

    The exhibit configures **10 update domains** and **two fault domains**.
    After adding 14 VMs, use the domain type corresponding to each event:

    - **Planned maintenance — 2:** Azure restarts only one update domain at a
      time. The 14 VMs are distributed across 10 update domains: four domains
      contain two VMs each and six contain one each. The largest update domain
      therefore contains two VMs: ceiling(14 / 10) = 2.
    - **Rack power failure — 7:** Fault domains separate shared power and network
      dependencies. With 14 VMs distributed across two fault domains, each has
      seven VMs. A failure affecting one fault domain can make seven unavailable:
      ceiling(14 / 2) = 7.

    These are the expected counts for the question's balanced placement and
    single-domain event. Do not use the number of domains as the number of
    affected VMs, and do not swap update domains with fault domains.

    Remember: **Update domains → planned updates; fault domains → hardware faults.**

    [Microsoft Learn: Availability sets overview](https://learn.microsoft.com/en-us/azure/virtual-machines/availability-set-overview)
- id: '025'
  tags:
    - must-review
  skill: Implement and manage virtual networking
  sub-skill: Configure name resolution and load balancing
  question: |
    You deploy an Azure Kubernetes Service (AKS) cluster named Cluster1 that
    uses the IP addresses shown in the following table.

    | IP address | Assigned to |
    |------------|-------------|
    | 131.107.2.1 | Load balancer front end |
    | 192.168.10.2 | Kubernetes DNS service |
    | 172.17.7.1 | Docker bridge address |
    | 10.0.10.11 | Kubernetes cluster node |

    You need to provide internet users with access to the applications that
    run in Cluster1.

    Which IP address should you include in the DNS record for Cluster1?
  choices:
    A: 131.107.2.1
    B: 10.0.10.11
    C: 172.17.7.1
    D: 192.168.10.2
  answer: A
  user_answer: D
  user_result: incorrect
  learning_note: |
    Public DNS for an application must resolve to its internet-facing endpoint,
    here the load balancer front-end IP. The Kubernetes DNS service resolves
    names inside the cluster; its private service IP is not the application
    endpoint to publish in a public DNS record.
  explanation: |
    **A — 131.107.2.1** is correct. The attempted answer D is incorrect.

    Internet users need the application's public entry point. In this scenario,
    that is the load balancer front end at 131.107.2.1. Create a public DNS A
    record pointing the application hostname to that IP. The configured load
    balancer service or ingress then routes incoming traffic to the application.

    Why the other options are incorrect:

    - **B — 10.0.10.11:** This is a cluster node's private IP. Internet clients
      cannot directly reach it through public DNS.
    - **C — 172.17.7.1:** This is the Docker bridge address used for internal
      container networking in the older setup shown, not a public application endpoint.
    - **D — 192.168.10.2:** This is the private Kubernetes DNS service IP. It is
      used for name resolution inside the cluster. The IP of a DNS resolver is
      different from the IP that an application's public DNS record should return.

    All three distractors use private IPv4 address ranges. Publishing a private
    address in public DNS does not make it reachable over the internet.

    Remember: Public application DNS → public load balancer or ingress endpoint.
    Cluster DNS service → internal name resolution.

    [Microsoft Learn: AKS network services concepts](https://learn.microsoft.com/en-us/azure/aks/concepts-network-services)
    [Microsoft Learn: Use a static public IP with an AKS load balancer](https://learn.microsoft.com/en-us/azure/aks/static-ip)
- id: '026'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure Azure App Service
  question: |
    You have a deployment template named Template1 that is used to deploy
    10 Azure web apps.

    You need to identify what to deploy before you deploy Template1. The
    solution must minimize Azure costs.

    What should you identify?
  choices:
    A: five Azure Application Gateways
    B: one App Service plan
    C: 10 App Service plans
    D: one Azure Traffic Manager
    E: one Azure Application Gateway
  answer: B
  user_answer: B
  user_result: correct
  learning_note: |
    Multiple compatible web apps can share one App Service plan and its compute
    resources. An App Service plan supplies hosting capacity; Application Gateway
    and Traffic Manager provide traffic routing rather than web app hosting.
  explanation: |
    **B — one App Service plan** is correct.

    An App Service plan defines the compute resources used to run Azure web apps,
    including region, operating system, pricing tier, and instance count. The
    10 apps can reference one suitable shared plan rather than requiring a
    separate plan for each app.

    In dedicated compute tiers, apps in the same plan share its VM instances,
    and compute charges are based on those plan instances. Consolidating compatible
    apps onto one adequately sized plan can reduce cost. The question specifies
    no requirement for separate hosting, regions, operating systems, or independent
    scaling, so one plan is the appropriate prerequisite among the choices.

    Why the other options are incorrect:

    - **A and E:** Application Gateway routes HTTP/HTTPS traffic and can provide
      web application firewall capabilities. It does not supply App Service
      hosting capacity and is not required for this deployment.
    - **C:** Ten plans provide separate hosting capacity but are unnecessary for
      the stated requirements and do not meet the intended cost-minimization goal.
    - **D:** Traffic Manager provides DNS-based traffic routing between endpoints;
      it does not host the web apps.

    In an ARM template, web apps reference the plan through `serverFarmId`.
    A plan can also be created within the same deployment using the appropriate
    dependency order; this question asks which resource to deploy beforehand.

    Remember: Many web apps can share one App Service plan.

    [Microsoft Learn: Azure App Service plans](https://learn.microsoft.com/en-us/azure/app-service/overview-hosting-plans)
- id: '027'
  skill: Deploy and manage Azure compute resources
  sub-skill: Provision and manage containers in the Azure portal
  question: |
    HOTSPOT

    You plan to deploy an Azure container instance by using the following
    Azure Resource Manager template resource.

    ```json
    {
      "type": "Microsoft.ContainerInstance/containerGroups",
      "apiVersion": "2018-10-01",
      "name": "webprod",
      "location": "westus",
      "properties": {
        "containers": [
          {
            "name": "webprod",
            "properties": {
              "image": "microsoft/iis:nanoserver",
              "ports": [
                { "protocol": "TCP", "port": 80 }
              ],
              "environmentVariables": [],
              "resources": {
                "requests": { "memoryInGB": 1.5, "cpu": 1 }
              }
            }
          }
        ],
        "restartPolicy": "OnFailure",
        "ipAddress": {
          "ports": [
            { "protocol": "TCP", "port": 80 }
          ],
          "ip": "[parameters('IPAddress')]",
          "type": "Public"
        },
        "osType": "Windows"
      }
    }
    ```

    Use the drop-down menus to select the answer choice that completes each
    statement based on the information presented in the template.

    NOTE: Each correct selection is worth one point.

    1. Internet users [answer choice].
    2. If Internet Information Services (IIS) in the container fail, [answer choice].
  choices:
    Internet users:
      - can connect to the container from any device
      - cannot connect to the container
      - can only connect to the container from devices that run Windows
    If Internet Information Services (IIS) in the container fail:
      - the container will restart automatically
      - the container will only restart manually
      - the container must be redeployed
  answer:
    Internet users: can connect to the container from any device
    If Internet Information Services (IIS) in the container fail: the container will restart automatically
  user_answer:
    Internet users: can only connect to the container from devices that run Windows
    If Internet Information Services (IIS) in the container fail: the container will restart automatically
  user_result: partially_correct
  learning_note: |
    osType specifies the container's operating system, not the client's OS.
    Public TCP port 80 exposes the IIS website to HTTP clients on any OS.
    OnFailure restarts a container when its main process exits with a nonzero
    code; an unhealthy service alone does not necessarily trigger that policy.
  explanation: |
    Correct selections: **can connect to the container from any device** and
    **the container will restart automatically**. The second attempted selection
    is correct; the first incorrectly restricts clients to Windows.

    **Internet access:** The container group has a public IP and exposes TCP
    port 80 at both the container and group levels. IIS serves HTTP, so a client
    with network access and an HTTP-capable browser can connect from Windows,
    Linux, macOS, Android, or iOS. `osType: Windows` describes the container's
    runtime OS; it does not require visitors to use Windows.

    **Failure behavior:** `restartPolicy: OnFailure` automatically restarts a
    container when its main process terminates with a nonzero exit code. The
    question assumes the IIS failure causes that process failure. Manual restart
    or redeployment is therefore not the intended answer.

    In actual administration, OnFailure does not detect every unhealthy IIS
    condition: if IIS stops responding but the container's main process remains
    running, the restart policy alone will not trigger a restart.

    The exhibit uses an older image name and API version. Interpret its declared
    networking and restart settings for the exam; it is not a verified current
    deployment recipe.

    Remember: Server OS does not dictate client OS; OnFailure means restart
    after a failed process exit.

    [Microsoft Learn: Deploy and access a container application](https://learn.microsoft.com/en-us/azure/container-instances/container-instances-tutorial-deploy-app)
    [Microsoft Learn: Container restart policies](https://learn.microsoft.com/en-us/azure/container-instances/container-instances-restart-policy)
- id: '028'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  question: |
    You have an Azure subscription that contains a virtual machine named VM1.
    VM1 hosts a line-of-business application that is available 24 hours a day.
    VM1 has one network interface and one managed disk. VM1 uses the D4s v3 size.

    You plan to make the following changes to VM1:

    - Change the size to D8s v3.
    - Add a 500-GB managed disk.
    - Add the Puppet Agent extension.
    - Enable Desired State Configuration Management.

    Which change will cause downtime for VM1?
  choices:
    A: Enable Desired State Configuration Management
    B: Add a 500-GB managed disk
    C: Change the size to D8s v3
    D: Add the Puppet Agent extension
  answer: C
  user_answer: C
  user_result: correct
  learning_note: |
    Resizing a running Azure VM causes a restart and application downtime,
    even when staying within the same size family. Attaching a data disk and
    installing configuration-management extensions do not inherently require
    stopping the VM.
  explanation: |
    **C — Change the size to D8s v3** is correct.

    Changing a running VM's size causes it to restart. Moving from D4s v3 to
    D8s v3 changes its compute allocation, so VM1's application is unavailable
    during that restart even though both sizes belong to the same family.
    If the target size is unavailable on its current hardware cluster, the VM
    may also need to be stopped and deallocated before resizing.

    Why the other options are incorrect:

    - **A:** Enabling Desired State Configuration management does not inherently
      require a VM restart. A particular configuration applied afterward could
      require a reboot, but no such configuration is specified.
    - **B:** A new managed data disk can be attached to the running VM without
      stopping it. This is adding a disk, not resizing the OS disk.
    - **D:** Installing the Puppet Agent extension does not inherently require
      stopping the VM. Changes applied by the agent could affect services or
      require a reboot, but that is not part of the stated operation.

    The single NIC and existing managed disk are incidental details. The decisive
    change is the VM size update, which directly causes a restart.

    Remember: Resize running VM → restart → downtime.

    [Microsoft Learn: Resize an Azure virtual machine](https://learn.microsoft.com/en-us/azure/virtual-machines/resize-vm)
- id: '029'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure Azure App Service
  question: |
    You have an app named App1 that runs on an Azure web app named webapp1.

    The developers at your company upload an update of App1 to a Git repository
    named Git1.

    Webapp1 has the deployment slots shown in the following table.

    | Name | Function |
    |------|----------|
    | webapp1-prod | Production |
    | webapp1-test | Staging |

    You need to ensure that the App1 update is tested before the update is
    made available to users.

    Which two actions should you perform? Each correct answer presents part
    of the solution.

    NOTE: Each correct selection is worth one point.
  choices:
    A: Swap the slots
    B: Deploy the App1 update to webapp1-prod, and then test the update
    C: Stop webapp1-prod
    D: Deploy the App1 update to webapp1-test, and then test the update
    E: Stop webapp1-test
  answer: AD
  user_answer: D
  user_result: partially_correct
  learning_note: |
    This question requires two selections. Deploy and test in the staging slot,
    then swap staging with production to release the tested version. Selecting
    the staging deployment alone omits the production promotion step.
  explanation: |
    Correct answers: **A and D.** The attempted answer D is correct but incomplete;
    the question asks for two actions.

    Perform the actions in this order:

    1. **D:** Deploy the App1 update from Git1 to webapp1-test and test it using
       the staging slot's endpoint. Production continues serving the current version.
    2. **A:** After testing succeeds, swap the staging and production slots.
       The tested version is then served through the production endpoint.

    Deployment slots let you validate a new version before promoting it to
    production. A swap also places the previous production version in the
    staging slot, enabling a swap back if rollback is needed.

    Why the other options are incorrect:

    - **B:** Deploying directly to production exposes users to the update before
      validation, contrary to the requirement.
    - **C:** Stopping production interrupts user access and does not test or
      promote the update.
    - **E:** Stopping staging prevents testing there and does not release the update.

    Remember: Deploy to staging → test → swap to production.
    Always check the number of required answers in multi-select questions.

    [Microsoft Learn: Set up staging environments in App Service](https://learn.microsoft.com/en-us/azure/app-service/deploy-staging-slots)
- id: '030'
  tags:
    - must-review
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  question: |
    You have an Azure subscription named Subscription1 that has the following
    providers registered:

    - Authorization
    - Automation
    - Resources
    - Compute
    - KeyVault
    - Network
    - Storage
    - Billing
    - Web

    Subscription1 contains an Azure virtual machine named VM1 that has the
    following configurations:

    - Private IP address: 10.0.0.4 (dynamic)
    - Network security group (NSG): NSG1
    - Public IP address: None
    - Availability set: AVSet
    - Subnet: 10.0.0.0/24
    - Managed disks: No
    - Location: East US

    You need to record all the successful and failed connection attempts to VM1.

    Which three actions should you perform? Each correct answer presents part
    of the solution.

    NOTE: Each correct selection is worth one point.
  choices:
    A: Enable Azure Network Watcher in the East US Azure region.
    B: Add an Azure Network Watcher connection monitor.
    C: Register the MicrosoftLogAnalytics provider.
    D: Create an Azure Storage account.
    E: Register the Microsoft.Insights resource provider.
    F: Enable Azure Network Watcher flow logs.
  answer: DEF
  user_answer: ACF
  user_result: partially_correct
  learning_note: |
    Basic NSG flow logging requires a storage destination and Microsoft.Insights
    registration, not Log Analytics. Network Watcher is normally enabled
    automatically when a VNet is created. Provider registration does not mean
    a storage account already exists. Current new deployments use VNet flow logs.
  explanation: |
    Correct answers: **D, E, and F**, under the question's default Network
    Watcher auto-enablement assumption. Of the attempted selections A, C, F,
    only F is part of the expected three-action answer.

    - **D:** Create a suitable Azure Storage account as the destination for
      the flow-log records. Having the Storage resource provider registered
      permits storage resource deployment; it does not create a storage account.
    - **E:** Register Microsoft.Insights, which is required for NSG flow logging
      and is absent from the registered-provider list.
    - **F:** Enable flow logs for NSG1 to record traffic flows and the NSG's
      allow or deny decisions for traffic to and from VM1.

    Why the other options are not selected:

    - **A:** Network Watcher must be enabled in East US, but Azure normally
      enables it automatically when a virtual network is created or updated.
      VM1 already has a subnet, so the intended answer assumes this prerequisite
      is satisfied. If automatic enablement was explicitly disabled, it would
      also need to be enabled; the question does not specify that exception.
    - **B:** Connection Monitor performs configured connectivity tests between
      endpoints; it does not record all actual allowed and denied traffic flows.
    - **C:** Log Analytics is not required for basic NSG flow-log storage. The
      choice's MicrosoftLogAnalytics name is also not the current workspace
      provider name, Microsoft.OperationalInsights. Optional Traffic Analytics
      uses a Log Analytics workspace, but that is not requested here.

    The exam wording uses successful and failed connection attempts to mean
    allowed and denied network traffic. NSG flow logs do not prove that an
    application-level connection or authentication succeeded.

    **Current feature status:** New NSG flow logs cannot be created after
    June 30, 2025, and existing NSG flow logs retire on September 30, 2027.
    Use virtual network flow logs for new deployments. DEF is the expected
    answer for this older NSG flow-log question.

    Remember: Flow logs → Storage + Microsoft.Insights; Connection Monitor → probes.

    [Microsoft Learn: Manage NSG flow logs](https://learn.microsoft.com/en-us/azure/network-watcher/nsg-flow-logs-manage)
    [Microsoft Learn: Enable or disable Network Watcher](https://learn.microsoft.com/en-us/azure/network-watcher/network-watcher-create)
    [Microsoft Learn: NSG flow logs overview and retirement](https://learn.microsoft.com/en-us/azure/network-watcher/network-watcher-nsg-flow-logging-overview)
- id: '031'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  question: |
    You need to deploy an Azure virtual machine scale set that contains five
    instances as quickly as possible.

    What should you do?
  choices:
    A: Deploy five virtual machines. Modify the Availability Zones settings for each virtual machine.
    B: Deploy five virtual machines. Modify the Size setting for each virtual machine.
    C: Deploy one virtual machine scale set that is set to VM (virtual machines) orchestration mode.
    D: Deploy one virtual machine scale set that is set to ScaleSetVM orchestration mode.
  answer: D
  user_answer: C
  user_result: incorrect
  learning_note: |
    In this older question, ScaleSetVM mode provisions instances from a shared
    scale-set model, while VM mode refers to individually managed VMs. The
    expected answer is D. Modern Uniform and Flexible modes both support
    provisioning instances from a profile; do not infer Flexible requires
    manually deploying each VM today.
  explanation: |
    **D — Deploy one virtual machine scale set that is set to ScaleSetVM
    orchestration mode** is the expected answer for this older question.
    The attempted answer C is not the intended historical answer.

    ScaleSetVM mode creates the requested VM instances from the scale set's
    configuration model. Set the instance count to five and deploy the scale
    set, rather than creating and configuring five separate VMs.

    The historical VM mode focused on grouping individually managed standard
    Azure VMs. In the terminology and feature set used by this question, it
    was not the intended route to rapidly provision five identical instances
    from one shared model.

    - **A:** Changing availability-zone settings does not create a scale set.
    - **B:** Changing VM sizes does not create a scale set.
    - **C:** Uses the historical individually managed VM orchestration approach
      rather than the model-based deployment intended by the question.

    **Current terminology and limitation:** ScaleSetVM corresponds to today's
    Uniform approach, while the standard-VM approach evolved into Flexible
    orchestration. Modern Flexible scale sets also support a VM profile and
    automatic instance creation. Microsoft recommends Flexible for new scale
    sets, so this old question should not be read as a current claim that
    Uniform is always faster or that Flexible requires manual VM deployment.

    Remember for this question: ScaleSetVM → shared model → deploy five instances.

    [Microsoft Learn: Scale set orchestration modes](https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/virtual-machine-scale-sets-orchestration-modes)
    [Microsoft: Automatic scaling with Flexible orchestration](https://techcommunity.microsoft.com/blog/azurecompute/automatic-scaling-with-azure-virtual-machine-scale-sets-flexible-orchestraton-m/2730065)
- id: '032'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure Azure App Service
  question: |
    You plan to create the Azure web apps shown in the following table.

    | Name | Runtime stack |
    |------|---------------|
    | WebApp1 | .NET Core 3.1 (LTS) |
    | WebApp2 | ASP.NET V4.8 |
    | WebApp3 | PHP 7.3 |
    | WebApp4 | Ruby 2.6 |

    What is the minimum number of App Service plans you should create for
    the web apps?
  choices:
    A: '1'
    B: '2'
    C: '3'
    D: '4'
  answer: B
  user_answer: B
  user_result: correct
  user_reasoning: Selected two plans because the apps require both Linux and Windows hosting.
  learning_note: |
    An App Service plan has one operating system. Compatible apps with different
    runtime stacks can share a plan, but Windows and Linux apps require separate
    plans. ASP.NET Framework 4.8 needs Windows; the historical Ruby stack uses Linux.
  explanation: |
    **B — 2** is correct. The reasoning that one Windows plan and one Linux
    plan are needed is correct.

    An App Service plan defines its hosting operating system. Different runtime
    stacks can share a compatible plan, so four apps do not require four plans.
    Windows and Linux hosting cannot be combined in one plan.

    For the historical runtime offerings in this question:

    - **WebApp2 (ASP.NET 4.8):** Requires Windows because it uses .NET Framework.
    - **WebApp4 (Ruby 2.6):** Uses Linux hosting.
    - **WebApp1 (.NET Core 3.1):** Can use Windows or Linux and share the corresponding plan.
    - **WebApp3 (PHP 7.3):** Can share a compatible plan; for example, put it
      with WebApp4 on the Linux plan.

    An example minimum arrangement is a Windows plan for WebApp2 and a Linux
    plan for WebApp1, WebApp3, and WebApp4, assuming the apps use the same region
    and the plans have sufficient capacity.

    **A** cannot accommodate both required operating systems. **C and D** add
    unnecessary plans; a separate plan is not required for each programming language.

    These runtime versions are historical. The LTS label for .NET Core 3.1
    describes its original release status, not current support. For a real
    deployment, select currently supported runtimes or an appropriate container
    approach. This does not change the operating-system distinction being tested.

    Remember: Separate plans by required OS, not by programming language.

    [Microsoft Learn: Azure App Service plans](https://learn.microsoft.com/en-us/azure/app-service/overview-hosting-plans)
    [Microsoft Learn: Deploy ASP.NET apps to App Service](https://learn.microsoft.com/en-us/azure/app-service/quickstart-dotnetcore)
- id: '033'
  skill: Manage Azure identities and governance
  sub-skill: Manage Azure subscriptions and governance
  question: |
    HOTSPOT

    You have a pay-as-you-go Azure subscription that contains the virtual
    machines shown in the following table.

    | Name | Resource group | Daily cost |
    |------|----------------|------------|
    | VM1 | RG1 | 20 euros |
    | VM2 | RG2 | 30 euros |

    You create the budget shown in the following exhibit.

    | Budget setting | Value |
    |----------------|-------|
    | Name | Budget1 |
    | Scope | RG1 (Resource group) |
    | Filters | None |
    | Current spend | 5.93 EUR |
    | Amount | 1,000.00 EUR |
    | Budget period | Resets billing month |
    | Start date | 6/20/2019 |
    | End date | 6/19/2021 |

    Budget alerts:

    | % of budget | Amount | Action group | Action group notification |
    |-------------|--------|--------------|---------------------------|
    | 50% | €500 | AG1 | 1 Email |
    | 70% | €700 | AG2 | 1 SMS |
    | 100% | €1,000 | AG3 | 1 Azure app |

    Alert recipients (email): User1@Contoso.com.

    The AG1 action group contains a user named admin@contoso.com only.

    Use the drop-down menus to select the answer choice that completes each
    statement based on the information presented in the graphic.

    1. When the maximum amount in Budget1 is reached, [answer choice].
    2. Based on the current usage costs of the virtual machines, [answer choice].
  choices:
    When the maximum amount in Budget1 is reached:
      - VM1 and VM2 are turned off
      - VM1 and VM2 continue to run
      - VM1 is turned off, and VM2 continues to run
    Based on the current usage costs of the virtual machines:
      - no email notifications will be sent each month
      - one email notification will be sent each month
      - two email notifications will be sent each month
      - three email notifications will be sent each month
  answer:
    When the maximum amount in Budget1 is reached: VM1 and VM2 continue to run
    Based on the current usage costs of the virtual machines: two email notifications will be sent each month
  user_answer:
    When the maximum amount in Budget1 is reached: VM1 and VM2 continue to run
    Based on the current usage costs of the virtual machines: one email notification will be sent each month
  user_result: partially_correct
  user_reasoning: |
    Selected that both VMs continue to run. Calculated RG1 spending as 20 euros
    per day, approximately 600 euros per month, and therefore only the 50%
    threshold triggers; counted this as one email notification.
  learning_note: |
    A budget does not automatically stop resources. Budget scope excludes costs
    outside RG1. One crossed threshold can produce two emails: one to the direct
    budget recipient and one to the email receiver in the associated action group.
  explanation: |
    Correct selections: **VM1 and VM2 continue to run** and **two email
    notifications will be sent each month**. The first attempted selection is
    correct; the second misses the direct budget email recipient.

    **VM behavior:** A Cost Management budget monitors spending and triggers
    notifications. It does not impose a spending cap or automatically shut down
    VMs. The listed actions are email, SMS, and Azure app notifications; no
    resource-stop automation is configured. Both VMs therefore continue running,
    even if the budget amount is reached.

    **Scope and threshold:** Budget1 is scoped to RG1, so only VM1's cost is
    included. VM2 is in RG2 and is excluded. At €20 per day, a full 28–31-day
    billing month costs €560–€620, crossing €500 (50%) but not €700 (70%) or
    €1,000 (100%). The learner's scope and threshold calculation is correct.

    **Email count:** The 50% alert has two email destinations:

    - **User1@Contoso.com:** The direct budget alert recipient.
    - **admin@contoso.com:** The email receiver in AG1, which is also triggered.

    Thus one threshold event results in **two emails**, not one. AG1's email
    does not replace the direct budget recipient's notification. The higher
    thresholds are not crossed, so AG2 and AG3 are not triggered at these costs.

    Treat the historical start and end dates as the scenario's active budget
    period; this answer describes full billing months while the budget is active,
    not notifications after its expiration or a partial initial month.

    Remember: Budget ≠ spending cap; count direct recipients AND action-group emails.

    [Microsoft Learn: Create and manage budgets](https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/tutorial-acm-create-budgets)
    [Microsoft Learn: Monitor spending with cost alerts](https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/cost-mgt-alerts-monitor-usage-spending)
- id: '034'
  skill: Deploy and manage Azure compute resources
  sub-skill: Automate deployment of resources by using Azure Resource Manager (ARM) templates or Bicep files
  question: |
    Note: This question is part of a series of questions that present the same
    scenario. Each question in the series contains a unique solution that might
    meet the stated goals. Some question sets might have more than one correct
    solution, while others might not have a correct solution.

    After you answer a question in this section, you will NOT be able to return
    to it. As a result, these questions will not appear in the review screen.

    You have an Azure subscription named Subscription1. Subscription1 contains
    a resource group named RG1. RG1 contains resources that were deployed by
    using templates.

    You need to view the date and time when the resources were created in RG1.

    Solution: From the Subscriptions blade, you select the subscription, and
    then click Programmatic deployment.

    Does this meet the goal?
  choices:
    A: Yes
    B: No
  answer: B
  user_answer: A
  user_result: incorrect
  user_reasoning: Selected Yes and asked whether Programmatic deployment is now called Deployments.
  learning_note: |
    Programmatic deployment was a subscription Marketplace offer setting, not
    ARM deployment history. Use RG1's Deployments page to inspect template
    deployment timestamps and individual resource operations.
  explanation: |
    **B — No** is correct. The attempted answer A confuses two different features.

    The historical subscription **Programmatic deployment** page managed
    permission to deploy Marketplace offers programmatically, including offer
    terms and enablement. It did not show when RG1's resources were created.
    It is not simply the old name for the resource group's Deployments page.

    To inspect the template deployment history, open **Resource groups → RG1 →
    Deployments**, select the relevant deployment, and inspect its details and
    resource operations. Deployment operations provide timestamps for the
    individual resource operations.

    **A — Yes** is incorrect because the proposed page concerns Marketplace
    deployment settings rather than the required deployment history.

    A deployment can update existing resources as well as create new ones.
    To identify original creation, inspect the original deployment and its
    operations rather than assuming the newest deployment timestamp is the
    resource's creation time. History must still be retained to inspect it.

    Remember: RG1 → Deployments → deployment details and operation timestamps.

    [Microsoft Learn: View deployment history with Azure Resource Manager](https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/deployment-history)
- id: '035'
  skill: Implement and manage virtual networking
  sub-skill: Configure and manage virtual networks in Azure
  question: |
    Note: This question is part of a series of questions that present the same
    scenario. Each question in the series contains a unique solution that might
    meet the stated goals. Some question sets might have more than one correct
    solution, while others might not have a correct solution.

    After you answer a question in this section, you will NOT be able to return
    to it. As a result, these questions will not appear in the review screen.

    You have an Azure subscription that contains the resources shown in the
    following table.

    | Name | Type | Region |
    |------|------|--------|
    | RG1 | Resource group | West US |
    | RG2 | Resource group | East Asia |
    | storage1 | Storage account | West US |
    | storage2 | Storage account | East Asia |
    | VM1 | Virtual machine | West US |
    | VNET1 | Virtual network | West US |
    | VNET2 | Virtual network | East Asia |

    VM1 connects to VNET1.

    You need to connect VM1 to VNET2.

    Solution: You create a new network interface, and then you add the network
    interface to VM1.

    Does this meet the goal?
  choices:
    A: Yes
    B: No
  answer: B
  user_answer: B
  user_result: correct
  user_reasoning: Selected No because VM1 must be deleted and recreated in East Asia with networking connected to VNET2.
  learning_note: |
    Adding a NIC does not change the VM's region or allow attachment to a second
    VNet. Direct attachment to VNET2 requires a VM and NIC in East Asia. Global
    VNet peering can instead provide communication while VM1 stays in VNET1.
  explanation: |
    **B — No** is correct.

    The proposed NIC addition fails for two independent reasons:

    - VM1 is in West US, while VNET2 is in East Asia. A NIC must be in the
      same region as both its attached VM and its VNet.
    - All NICs attached to one VM must use the same VNet, although they can
      connect to different subnets within that VNet. VM1 cannot keep its VNET1
      NIC and attach another NIC in VNET2.

    **A — Yes** is incorrect because creating and attaching a new NIC does
    not overcome either restriction.

    The learner's suggested recreation in East Asia is a valid approach for
    direct attachment to VNET2. Create the target NIC in a VNET2 subnet and
    recreate or migrate the VM into East Asia using that NIC. Preserving the
    workload requires copying or migrating the disks and configuration to the
    target region; a West US managed disk cannot simply attach to an East Asia VM.
    Preserve the workload before deleting the original VM.

    If the requirement is only communication with resources in VNET2, global
    VNet peering can connect VNET1 and VNET2 without recreating VM1, provided
    address spaces do not overlap and routing and security rules permit access.
    Peering gives connectivity but does not change VM1's VNet membership.

    Remember: Multiple NICs can use multiple subnets, but only one VNet per VM.

    [Microsoft Learn: Add or remove VM network interfaces](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-network-interface-vm)
    [Microsoft Learn: Manage network interfaces](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-network-interface)
    [Microsoft Learn: Connect virtual networks with peering](https://learn.microsoft.com/en-us/azure/virtual-network/tutorial-connect-virtual-networks)
- id: '036'
  tags:
    - must-review
  skill: Manage Azure identities and governance
  sub-skill: Manage Microsoft Entra users and groups
  question: |
    You have an Azure Active Directory (Azure AD) tenant named adatum.com that
    contains the users shown in the following table.

    | Name | Role |
    |------|------|
    | User1 | None |
    | User2 | Global administrator |
    | User3 | Cloud device administrator |
    | User4 | Intune administrator |

    Adatum.com has the following configurations:

    - Users may join devices to Azure AD is set to User1.
    - Additional local administrators on Azure AD joined devices is set to None.

    You deploy Windows 10 to a computer named Computer1. User1 joins Computer1
    to adatum.com.

    You need to identify the local Administrator group membership on Computer1.

    Which users are members of the local Administrators group?
  choices:
    A: User1 only
    B: User2 only
    C: User1 and User2 only
    D: User1, User2, and User3 only
    E: User1, User2, User3, and User4
  answer: C
  user_answer: D
  user_result: incorrect
  learning_note: |
    Cloud Device Administrator manages device objects in the directory; it is
    different from Microsoft Entra Joined Device Local Administrator. In the
    question's default join behavior, the joining user and Global Administrator
    receive local admin access; Cloud Device Administrator and Intune Administrator
    do not automatically receive it.
  explanation: |
    **C — User1 and User2 only** is correct for the default join behavior in
    this historical question. The attempted answer D incorrectly includes User3.

    - **User1:** Performs the Azure AD join and becomes a local administrator
      on Computer1 by default, even without a directory administrator role.
    - **User2:** Has Global Administrator privileges, which provide local
      administrator access on Azure AD joined devices under the default behavior
      assumed by the question.
    - **User3:** Cloud Device Administrator permits management of device objects
      in the directory. It does not automatically grant local admin access to
      the Windows computer.
    - **User4:** Intune Administrator permits management through Intune. It does
      not automatically make the user a local administrator on managed devices.

    Setting Additional local administrators to None means no extra users are
    designated through that setting. It does not remove the joining user's or
    Global Administrator's default access. Users may join devices controls join
    permission; it is not a complete list of local administrators.

    **Role-name trap:** Cloud Device Administrator is different from Microsoft
    Entra Joined Device Local Administrator, which specifically grants local
    administrator access on joined Windows devices.

    Azure AD is now Microsoft Entra ID. Current device registration policy can
    configure whether the joining user and Global Administrator are added as
    local administrators. No override of the historical defaults is specified here.

    Remember: Directory device management ≠ Windows local administrator access.

    [Microsoft Learn: Manage local administrators on Entra joined devices](https://learn.microsoft.com/en-us/entra/identity/devices/assign-local-admin)
    [Microsoft Learn: Microsoft Entra built-in roles](https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/permissions-reference)
- id: '037'
  tags:
    - must-review
  skill: Manage Azure identities and governance
  sub-skill: Manage Azure subscriptions and governance
  question: |
    HOTSPOT

    You have Azure subscriptions named Subscription1 and Subscription2.

    Subscription1 has the following resource groups:

    | Name | Region | Lock type |
    |------|--------|-----------|
    | RG1 | West Europe | None |
    | RG2 | West Europe | Read Only |

    RG1 includes a web app named App1 in the West Europe location.

    Subscription2 contains the following resource groups:

    | Name | Region | Lock type |
    |------|--------|-----------|
    | RG3 | East Europe | Delete |
    | RG4 | Central US | None |

    For each of the following statements, select Yes if the statement is true.
    Otherwise, select No.

    NOTE: Each correct selection is worth one point.
  choices:
    App1 can be moved to RG2:
      - 'Yes'
      - 'No'
    App1 can be moved to RG3:
      - 'Yes'
      - 'No'
    App1 can be moved to RG4:
      - 'Yes'
      - 'No'
  answer:
    App1 can be moved to RG2: 'No'
    App1 can be moved to RG3: 'Yes'
    App1 can be moved to RG4: 'Yes'
  user_answer:
    App1 can be moved to RG2: 'No'
    App1 can be moved to RG3: 'No'
    App1 can be moved to RG4: 'No'
  user_result: partially_correct
  user_reasoning: |
    Selected No for RG2 because it has a Read Only lock. Selected No for RG3
    because the learner thought cross-subscription moves were not allowed.
    Also selected No for RG4 without providing further reasoning.
  learning_note: |
    Supported App Service resources can move between subscriptions when move
    prerequisites are met. A destination resource-group ReadOnly lock blocks
    the move; a CanNotDelete lock does not prohibit adding resources. Moving
    resource groups or subscriptions does not change the app's Azure region.
  explanation: |
    Correct selections: **No, Yes, Yes.** The first attempted selection and its
    Read Only lock reasoning are correct.

    - **RG2 — No:** A ReadOnly lock on the destination resource group blocks
      the resource move. Remove that lock before attempting the move.
    - **RG3 — Yes:** App Service supports cross-subscription moves, subject to
      its prerequisites. The exhibit's Delete lock means CanNotDelete: it
      prevents deletion but does not prohibit adding App1 to the group.
    - **RG4 — Yes:** Cross-subscription moves are supported, and RG4 has no lock.
      Its Central US location does not require App1 to relocate from West Europe.

    A resource group's region is where its metadata is stored. Its resources
    can be in other regions. App1 remains in West Europe after either supported
    move; moving between groups or subscriptions is not a regional migration.

    The expected Yes answers assume normal move prerequisites are met: both
    subscriptions belong to the same Microsoft Entra tenant, the caller has
    suitable permissions, required providers are registered, and App Service
    dependencies are included as required. Cross-subscription App Service moves
    have additional restrictions, including moving the associated plan and apps
    together and having no existing App Service resources in the destination
    group. The question does not specify a conflicting condition.

    The source exhibit says East Europe for RG3. Preserve that label as supplied;
    it is not a standard Azure public region name and does not affect the tested
    rule that a resource-group location need not match the app's location.

    Remember: ReadOnly blocks changes; CanNotDelete blocks deletion. A supported
    subscription move changes management scope, not region.

    [Microsoft Learn: Move resources to a new resource group or subscription](https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/move-resource-group-and-subscription)
    [Microsoft Learn: App Service move requirements](https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/move-limitations/app-service-move-limitations)
    [Microsoft Learn: Resource locks](https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources)
- id: '038'
  skill: Manage Azure identities and governance
  sub-skill: Manage Azure subscriptions and governance
  question: |
    HOTSPOT

    You have an Azure subscription named Subscription1 that contains the
    following resource group:

    - Name: RG1
    - Region: West US
    - Tag: `tag1`: `value1`

    You assign an Azure policy named Policy1 to Subscription1 by using the
    following configurations:

    - Exclusions: None
    - Policy definition: Append a tag and its value to resources
    - Assignment name: Policy1
    - Parameters:
      - Tag name: tag2
      - Tag value: value2

    After Policy1 is assigned, you create a storage account that has the
    following configuration:

    - Name: storage1
    - Location: West US
    - Resource group: RG1
    - Tags: `tag3`: `value3`

    You need to identify which tags are assigned to each resource.

    What should you identify? To answer, select the appropriate options in
    the answer area.

    NOTE: Each correct selection is worth one point.
  choices:
    Tags assigned to RG1:
      - '"tag1": "value1" only'
      - '"tag2": "value2" only'
      - '"tag1": "value1" and "tag2": "value2"'
    Tags assigned to storage1:
      - '"tag3": "value3" only'
      - '"tag1": "value1" and "tag3": "value3" only'
      - '"tag2": "value2" and "tag3": "value3" only'
      - '"tag1": "value1", "tag2": "value2", and "tag3": "value3"'
  answer:
    Tags assigned to RG1: '"tag1": "value1" only'
    Tags assigned to storage1: '"tag2": "value2" and "tag3": "value3" only'
  user_answer:
    Tags assigned to RG1: '"tag1": "value1" only'
    Tags assigned to storage1: '"tag2": "value2" and "tag3": "value3" only'
  user_result: correct
  learning_note: |
    Tags are not automatically inherited from resource groups. An append policy
    adds its configured tag to a matching create or update request, but assigning
    it does not retroactively modify existing resources. The resources policy
    is distinct from the policy that targets resource groups.
  explanation: |
    Both selections are correct:

    - **RG1:** `tag1: value1` only.
    - **storage1:** `tag2: value2` and `tag3: value3` only.

    RG1 already exists when Policy1 is assigned. Assignment of an append policy
    does not retroactively add a tag to existing resources. Also, this built-in
    resources policy uses Indexed mode, which excludes resource groups; tagging
    resource groups requires the corresponding resource-group policy.

    storage1 is created after assignment and is within the subscription policy's
    scope, with no exclusion. Policy1 appends `tag2: value2` during creation,
    while the explicitly supplied `tag3: value3` remains.

    storage1 does not receive `tag1: value1` because Azure resource tags are
    not automatically inherited from their resource group. Inheriting a group
    tag requires an explicit inheritance policy or another tagging operation.

    For current implementations, Microsoft recommends the modify effect for
    tag policies. Modify policies can remediate existing resources through a
    remediation task; the append effect in this question does not do that.

    Remember: Policy scope is inherited; resource-group tag values are not.

    [Microsoft Learn: Policy definitions for tags](https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/tag-policies)
    [Microsoft Learn: Append effect](https://learn.microsoft.com/en-us/azure/governance/policy/concepts/effect-append)
    [Microsoft: Built-in append-tag resource policy](https://github.com/Azure/azure-policy/blob/master/built-in-policies/policyDefinitions/Tags/ApplyTag_Append.json)
- id: '039'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  question: |
    HOTSPOT

    You have an Azure subscription named Subscription1.

    In Subscription1, you create an alert rule named Alert1.

    The Alert1 action group is configured as shown in the following exhibit.

    | Property | Value |
    |----------|-------|
    | ResourceGroupName | default-activitylogalerts |
    | GroupShortName | AG1 |
    | Enabled | True |
    | EmailReceivers | {Action1_ "EmailAction"} |
    | SmsReceivers | {Action1_ "SMSAction"} |
    | WebhookReceivers | {} |
    | Id | /subscriptions/a4fde29b-d56a-4f6c-8298-6c53cd0b720c/resourceGroups/default-activitylogalerts/providers/microsoft.insights/actionGroups/ActionGroup1 |
    | Name | ActionGroup1 |
    | Type | Microsoft.Insights/ActionGroups |
    | Location | Global |
    | Tags | {} |

    Alert1 alert criteria triggered every minute.

    Use the drop-down menus to select the answer choice that completes each
    statement based on the information presented in the graphic.

    NOTE: Each correct selection is worth one point.

    1. The number of email messages that Alert1 will send in an hour is [answer choice].
    2. The number of SMS messages that Alert2 will send in an hour is [answer choice].

    Source wording note: The second statement says Alert2, but the scenario
    defines only Alert1. Interpret Alert2 as a typo for Alert1.
  choices:
    Number of email messages in an hour:
      - '0'
      - '4'
      - '6'
      - '12'
      - '60'
    Number of SMS messages in an hour:
      - '0'
      - '4'
      - '6'
      - '12'
      - '60'
  answer:
    Number of email messages in an hour: '60'
    Number of SMS messages in an hour: '12'
  user_answer:
    Number of email messages in an hour: '60'
    Number of SMS messages in an hour: '60'
  user_result: partially_correct
  learning_note: |
    Alert frequency and notification frequency can differ. At one notification
    attempt per minute, email can deliver 60 per hour, below its 100-per-hour
    limit, while production SMS is limited to one per five minutes, or 12 per hour.
  explanation: |
    Correct selections: **60 emails and 12 SMS messages**. The first attempted
    selection is correct; the second overlooks SMS rate limiting.

    The enabled action group contains one email receiver and one SMS receiver.
    Assuming the rule fires and invokes the group once per minute, there are
    60 notification attempts per hour for each receiver.

    - **Email — 60:** The production limit is 100 emails per hour per email
      address per region. Sixty alert emails fit below that limit.
    - **SMS — 12:** Production SMS notifications are limited to one message
      every five minutes per phone number. Over one hour, 60 / 5 = 12.

    The screenshot's reference to Alert2 is a source typo: no Alert2 is defined.
    The intended calculation uses Alert1's action group for both statements.

    The scenario assumes repeated alert firing, not merely a condition remaining
    true. A stateful alert can suppress repeated actions while it stays fired;
    evaluating every minute does not universally imply one notification per minute.
    Also, these are production notification limits, not the action-group test limits.

    Remember: One alert per minute does not bypass the SMS five-minute limit.

    [Microsoft Learn: Azure Monitor notification service limits](https://learn.microsoft.com/en-us/azure/azure-monitor/fundamentals/service-limits)
    [Microsoft Learn: Action group notification rate limiting](https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/action-groups)
- id: '040'
  skill: Monitor and maintain Azure resources
  sub-skill: Implement backup and recovery
  question: |
    You have an Azure subscription named Subscription1 that contains the
    resources shown in the following table.

    | Name | Type | Region | Resource group |
    |------|------|--------|----------------|
    | RG1 | Resource group | West Europe | Not applicable |
    | RG2 | Resource group | North Europe | Not applicable |
    | Vault1 | Recovery Services vault | West Europe | RG1 |

    You create virtual machines in Subscription1 as shown in the following table.

    | Name | Resource group | Region | Operating system |
    |------|----------------|--------|------------------|
    | VM1 | RG1 | West Europe | Windows Server 2016 |
    | VM2 | RG1 | North Europe | Windows Server 2016 |
    | VM3 | RG2 | West Europe | Windows Server 2016 |
    | VMA | RG1 | West Europe | Ubuntu Server 18.04 |
    | VMB | RG1 | North Europe | Ubuntu Server 18.04 |
    | VMC | RG2 | West Europe | Ubuntu Server 18.04 |

    You plan to use Vault1 for the backup of as many virtual machines as possible.

    Which virtual machines can be backed up to Vault1?
  choices:
    A: VM1 only
    B: VM3 and VMC only
    C: VM1, VM2, VM3, VMA, VMB, and VMC
    D: VM1, VM3, VMA, and VMC only
    E: VM1 and VM3 only
  answer: D
  user_answer: D
  user_result: correct
  user_reasoning: Selected D because the backed-up VMs must be in the same region as the vault.
  learning_note: |
    Azure VM backup requires the Recovery Services vault and source VM to be
    in the same region. They can be in different resource groups. Both Windows
    and supported Linux VMs can be protected; cross-region restore is a separate feature.
  explanation: |
    **D — VM1, VM3, VMA, and VMC only** is correct. The learner correctly
    identified the same-region requirement.

    Vault1 is in West Europe. Azure VM backup requires the protected VM to be
    in the same region as its Recovery Services vault. Resource-group membership
    does not require the VM to be in the same group as the vault, and Azure
    Backup supports both Windows and supported Linux VMs.

    - **VM1 and VMA:** West Europe, RG1 — eligible.
    - **VM3 and VMC:** West Europe, RG2 — eligible despite the different group.
    - **VM2 and VMB:** North Europe — require a vault in North Europe.

    The location of RG2 does not change VM3 or VMC's West Europe location.
    A resource group can contain resources deployed in other regions.

    **A and B** omit eligible VMs. **C** includes the two North Europe VMs.
    **E** incorrectly excludes Linux VMs.

    Cross Region Restore can restore eligible replicated backup data in a
    secondary region. It does not remove the same-region requirement when
    configuring protection of the source VM.

    The operating-system versions reflect the historical scenario; a current
    deployment should verify the applicable VM backup support matrix.

    Remember: Match the VM's region to the vault's region, not its resource group.

    [Microsoft Learn: Create and configure Recovery Services vaults](https://learn.microsoft.com/en-us/azure/backup/backup-create-recovery-services-vault)
    [Microsoft Learn: Azure VM backup support matrix](https://learn.microsoft.com/en-us/azure/backup/backup-support-matrix-iaas)
- id: '041'
  skill: Deploy and manage Azure compute resources
  sub-skill: Provision and manage containers in the Azure portal
  question: |
    You have an Azure Kubernetes Service (AKS) cluster named AKS1.

    You need to configure cluster autoscaler for AKS1.

    Which two tools should you use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  choices:
    A: the kubectl command
    B: the az aks command
    C: the Set-AzVm cmdlet
    D: the Azure portal
    E: the Set-AzAks cmdlet
  answer: BD
  user_answer: BE
  user_result: partially_correct
  learning_note: |
    Configure managed AKS cluster autoscaling through AKS node-pool settings,
    using Azure CLI or the portal. kubectl autoscale typically configures pod
    scaling, not managed node scaling. Current Azure PowerShell also supports
    node autoscaling, so the older Set-AzAks distractor is version-sensitive.
  explanation: |
    **B and D** are the expected answers for this older question. The attempted
    selection B is correct; replace E with D for the expected answer pair.

    Cluster autoscaler changes the number of nodes in an AKS node pool according
    to scheduling demand, within configured minimum and maximum node counts.

    - **B:** Azure CLI supports `az aks update` and `az aks nodepool update`
      with `--enable-cluster-autoscaler`, `--min-count`, and `--max-count`.
    - **D:** In the Azure portal, open AKS1, select its node pool, and configure
      autoscaling with minimum and maximum node counts.
    - **A:** `kubectl autoscale` configures a Horizontal Pod Autoscaler, which
      changes pod replica counts. It does not enable the managed AKS cluster
      autoscaler on the Azure node pool.
    - **C:** A VM cmdlet does not configure the managed AKS node-pool autoscaler.
      Configure scaling through AKS rather than modifying its backing VMs directly.

    **PowerShell currency caveat:** Do not conclude that Azure PowerShell cannot
    configure cluster autoscaling. Current `Set-AzAksCluster` supports
    `-EnableNodeAutoScaling`, `-NodeMinCount`, and `-NodeMaxCount`, and
    `Update-AzAksNodePool` supports node-pool autoscaling. Option E uses an older
    command name, and its validity depends on module version and available
    parameters or aliases. The question's exactly-two-answer framing is dated;
    BD is its expected pair, rather than a claim that only two tools can do this today.

    Remember: Cluster autoscaler scales nodes; Horizontal Pod Autoscaler scales pods.

    [Microsoft Learn: Use the AKS cluster autoscaler](https://learn.microsoft.com/en-us/azure/aks/cluster-autoscaler)
    [Microsoft Learn: Set-AzAksCluster](https://learn.microsoft.com/en-us/powershell/module/az.aks/set-azakscluster)
    [Microsoft: AKS scaling through the portal and CLI](https://techcommunity.microsoft.com/blog/coreinfrastructureandsecurityblog/how-to-scale-apps-on-kubernetes/1699947/)
- id: '042'
  skill: Deploy and manage Azure compute resources
  sub-skill: Provision and manage containers in the Azure portal
  question: |
    You create the following resources in an Azure subscription:

    - An Azure Container Registry instance named Registry1
    - An Azure Kubernetes Service (AKS) cluster named Cluster1

    You create a container image named App1 on your administrative workstation.

    You need to deploy App1 to Cluster1.

    What should you do first?
  choices:
    A: Run the docker push command.
    B: Create an App Service plan.
    C: Run the az acr build command.
    D: Run the az aks create command.
  answer: A
  user_answer: A
  user_result: correct
  learning_note: |
    An existing locally built image must be published to a registry that AKS
    can access. docker push uploads the image; az acr build builds an image
    remotely from source. Publishing the image is separate from deploying the workload.
  explanation: |
    **A — Run the docker push command** is correct.

    App1 already exists as an image on the administrative workstation. Push it
    to Registry1 so Cluster1 can pull the image when creating the application's
    pods. Reference its fully qualified registry image name in the Kubernetes
    deployment manifest and ensure the cluster has permission to pull it.

    In practice, authenticate to Registry1 and tag the local image with the
    registry's actual login server and repository name before pushing. Among
    the listed choices, docker push is the required next step; it uploads the
    image rather than deploying the Kubernetes workload itself.

    Why the other options are incorrect:

    - **B:** An App Service plan hosts App Service apps and is not required for AKS.
    - **C:** az acr build builds an image in Azure Container Registry from a
      Dockerfile and source context. The image is already built locally, so
      uploading it with docker push is the intended action.
    - **D:** Cluster1 already exists. az aks create creates a cluster, not an
      application deployment inside an existing cluster.

    Remember: Build locally → push to registry → deploy to AKS → AKS pulls image.

    [Microsoft Learn: Push and pull images with Azure Container Registry](https://learn.microsoft.com/en-us/azure/container-registry/container-registry-get-started-docker-cli)
    [Microsoft Learn: Integrate ACR with AKS](https://learn.microsoft.com/en-us/azure/aks/cluster-container-registry-integration)
- id: '043'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  question: |
    You have an Azure subscription that contains the resources shown in the
    following table.

    | Name | Type | Resource group | Location |
    |------|------|----------------|----------|
    | RG1 | Resource group | Not applicable | Central US |
    | RG2 | Resource group | Not applicable | West US |
    | VMSS1 | Virtual machine scale set | RG2 | West US |
    | Proximity1 | Proximity placement group | RG1 | Central US |
    | Proximity2 | Proximity placement group | RG2 | West US |
    | Proximity3 | Proximity placement group | RG1 | Central US |

    You need to configure a proximity placement group for VMSS1.

    Which proximity placement groups should you use?
  choices:
    A: Proximity2 only
    B: Proximity1, Proximity2, and Proximity3
    C: Proximity1 only
    D: Proximity1 and Proximity3 only
  answer: A
  user_answer: D
  user_result: incorrect
  learning_note: |
    A proximity placement group must be in the same Azure region as the compute
    resources assigned to it. VMSS1 is in West US, so only Proximity2 qualifies.
    Proximity placement groups reduce physical distance and network latency;
    they do not connect compute resources across regions.
  explanation: |
    **A — Proximity2 only** is correct. The attempted answer D selects the
    two placement groups in the wrong region.

    A proximity placement group (PPG) constrains Azure compute placement so
    associated VMs are physically close together in the same datacenter,
    reducing network latency. The group and assigned compute resources must
    be in the same Azure region.

    VMSS1 is in **West US**:

    - **Proximity2:** West US — eligible.
    - **Proximity1 and Proximity3:** Central US — ineligible for VMSS1.

    Resource-group location is not the deciding rule; compare the actual
    location of VMSS1 with each proximity placement group's location.

    **B** includes the two incompatible Central US groups. **C and D** select
    only groups that are incompatible with VMSS1's West US region.

    For a scale set, configure the proximity placement group on the scale-set
    resource rather than separately on each VM instance. Assigning an existing
    scale set to a PPG requires stopping and deallocating its instances first.

    Remember: Proximity placement means physical closeness within a region.

    [Microsoft Learn: Proximity placement groups](https://learn.microsoft.com/en-us/azure/virtual-machines/co-location)
    [Microsoft Learn: Proximity placement groups for scale sets](https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/proximity-placement-groups)
- id: '044'
  skill: Deploy and manage Azure compute resources
  sub-skill: Automate deployment of resources by using Azure Resource Manager (ARM) templates or Bicep files
  question: |
    Note: This question is part of a series of questions that present the same
    scenario. Each question in the series contains a unique solution that might
    meet the stated goals. Some question sets might have more than one correct
    solution, while others might not have a correct solution.

    After you answer a question in this section, you will NOT be able to return
    to it. As a result, these questions will not appear in the review screen.

    You have an Azure subscription named Subscription1. Subscription1 contains
    a resource group named RG1. RG1 contains resources that were deployed by
    using templates.

    You need to view the date and time when the resources were created in RG1.

    Solution: From the Subscriptions blade, you select the subscription, and
    then click Resource providers.

    Does this meet the goal?
  choices:
    A: Yes
    B: No
  answer: B
  user_answer: B
  user_result: correct
  user_reasoning: |
    Go to RG1 and check Deployments to view the relevant deployment history.
  learning_note: |
    Resource providers shows provider namespaces and their registration status,
    not resource creation timestamps. For resources deployed through templates
    to RG1, inspect RG1's Deployments and the relevant deployment operations.
  explanation: |
    **B — No** is correct. Resource providers manages the registration of
    Azure service providers; it does not show when RG1's resources were created.

    Open **Resource groups → RG1 → Deployments**, select the original deployment,
    and inspect its details and deployment operations for timestamps. Later
    deployments may update existing resources, so the latest deployment timestamp
    does not necessarily represent their original creation time.

    **A** is incorrect because the proposed Resource providers page does not
    provide the required deployment history.

    [Microsoft Learn: Deployment history](https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/deployment-history)
- id: '045'
  skill: Deploy and manage Azure compute resources
  sub-skill: Automate deployment of resources by using Azure Resource Manager (ARM) templates or Bicep files
  question: |
