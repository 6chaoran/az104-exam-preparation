    ACI's single-container Windows support does not imply that Windows can use
    multi-container groups; those groups support Linux only. For App Service,
    choose the matching Windows or Linux hosting plan and a compatible base
    image. The question assumes supported image versions and architectures.
    The choice label App Services refers to Azure App Service.

    Remember: Container Apps = Linux; ACI and App Service = Windows or Linux.

