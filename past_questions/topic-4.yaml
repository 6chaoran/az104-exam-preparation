- id: '073'
  skill: Deploy and manage Azure compute resources
  sub-skill: Automate deployment of resources by using Azure Resource Manager (ARM) templates or Bicep files
  question: |
    HOTSPOT

    You have an Azure subscription.

    You need to use an Azure Resource Manager (ARM) template to create a virtual
    machine that will have multiple data disks.

    How should you complete the template? To answer, select the appropriate
    options in the answer area.

    NOTE: Each correct selection is worth one point.

    **Answer area — template excerpt**

    The ellipses represent omitted template content. Replace [Blank 1] with
    the property name and [Blank 2] with the function name.

    ```json
    {
      "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentTemplate.json#",
      "parameters": {
        "numberOfDataDisks": {
          "type": "int",
          "metadata": {
            "description": "The number of dataDisks to create."
          }
        },
        ...
      },
      "resources": [
        {
          "type": "Microsoft.Compute/virtualMachines",
          "apiVersion": "2017-03-30",
          ...
          "properties": {
            "storageProfile": {
              ...
              "[Blank 1]": [
                {
                  "name": "dataDisks",
                  "count": "[parameters('numberOfDataDisks')]",
                  "input": {
                    "diskSizeGB": 1023,
                    "lun": "[[Blank 2]('dataDisks')]",
                    "createOption": "Empty"
                  }
                }
              ]
            }
          }
        }
      ]
    }
    ```
  choices:
    Blank 1:
      - copy
      - copyIndex
      - dependsOn
    Blank 2:
      - copy
      - copyIndex
      - dependsOn
  answer:
    Blank 1: copy
    Blank 2: copyIndex
  user_answer:
    Blank 1: dependsOn
    Blank 2: copyIndex
  user_result: partially_correct
  learning_note: |
    Use copy to repeat a resource property and copyIndex('dataDisks') to obtain
    the named property's zero-based iteration index. dependsOn controls resource
    deployment order; it does not create a property loop.
  explanation: |
    **Blank 1: copy. Blank 2: copyIndex.** The supplied answer is partially
    correct: its first selection, dependsOn, must be corrected to copy.

    The copy array inside storageProfile defines a property loop named dataDisks.
    Its count comes from numberOfDataDisks, and input supplies the configuration
    for each data disk: 1023 GiB and createOption set to Empty.

    The completed LUN expression is "[copyIndex('dataDisks')]". It returns the
    current index of the named loop, starting at zero, so the disks receive
    distinct logical unit numbers (LUNs) such as 0, 1, and 2.

    copyIndex is a function, not the property used to declare the loop. copy
    declares repetition, not a function that returns a LUN. dependsOn declares
    resource dependencies and cannot repeat data disk properties or supply a LUN.

    Remember: copy defines the loop; copyIndex identifies the current iteration.

    [Microsoft Learn: Property iteration in ARM templates](https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/copy-properties)
- id: '074'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  question: |
    Note: This question is part of a series of questions that present the same
    scenario. Each question in the series contains a unique solution that might
    meet the stated goals. Some question sets might have more than one correct
    solution, while others might not have a correct solution.

    After you answer a question in this section, you will NOT be able to return
    to it. As a result, these questions will not appear in the review screen.

    You have an Azure subscription named Subscription1 that contains the
    resources shown in the following table.

    | Name | Type | Location | Resource group |
    | --- | --- | --- | --- |
    | RG1 | Resource group | East US | Not applicable |
    | RG2 | Resource group | West Europe | Not applicable |
    | RG3 | Resource group | North Europe | Not applicable |
    | VNET1 | Virtual network | Central US | RG1 |
    | VM1 | Virtual machine | West US | RG2 |

    Subscription1 also includes a virtual network named VNET2. VM1 connects to
    a virtual network named VNET2 by using a network interface named NIC1.

    You need to create a new network interface named NIC2 for VM1.

    Solution: You create NIC2 in RG1 and West US.

    Does this meet the goal?
  choices:
    A: Yes
    B: No
  answer: A
  user_answer: A
  user_result: correct
  user_reasoning: NIC must be in the same region as the VM, but the resource group can be different.
  learning_note: |
    NIC and VM regions must match; their resource groups can differ. A resource
    group's location does not restrict the regions of its resources. All NICs
    attached to one VM must connect to the same virtual network.
  explanation: |
    **A — Yes.** NIC2 is created in West US, matching VM1's region. NIC2 can
    belong to RG1 even though VM1 belongs to RG2. RG1's East US location is
    where resource group metadata is stored; it does not require resources
    within RG1 to be deployed in East US.

    Your reasoning is correct. The NIC must also be in the same subscription
    as VM1 and connect to VNET2, because every NIC attached to a VM must use
    the same virtual network. VNET1 being in RG1 does not force NIC2 to use it.
    VNET1 is in Central US and is not suitable for VM1 in West US.

    The intended answer assumes NIC2 is configured on a subnet of VNET2 and
    VM1 supports another NIC. To attach it to the existing VM, stop (deallocate)
    VM1 first. The proposed resource group and region meet the stated goal.

    **B** is incorrect because a different resource group is not a blocker.

    [Microsoft Learn: VM network interfaces and locations](https://learn.microsoft.com/en-us/azure/virtual-network/network-overview)
    [Microsoft Learn: Add NICs to VMs and constraints](https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-network-interface-vm)
- id: '077'
  skill: Deploy and manage Azure compute resources
  sub-skill: Automate deployment of resources by using Azure Resource Manager (ARM) templates or Bicep files
  question: |
    You develop the following Azure Resource Manager (ARM) template to create
    a resource group and deploy an Azure Storage account to the resource group.

    ```json
    {
      "$schema": "https://schema.management.azure.com/schemas/2015-01-01/deploymentTemplate.json#",
      "contentVersion": "1.0.0.0",
      "resources": [
        {
          "type": "Microsoft.Resources/resourceGroups",
          "apiVersion": "2018-05-01",
          "location": "eastus",
          "name": "RG1"
        },
        {
          "type": "Microsoft.Resources/deployments",
          "apiVersion": "2017-05-10",
          "name": "storageDeployment",
          "resourceGroup": "RG1",
          "dependsOn": [
            "[resourceId('Microsoft.Resources/resourceGroups/', 'RG1')]"
          ],
          "properties": {
            "mode": "Incremental",
            "template": {
              "$schema": "https://schema.management.azure.com/schemas/2015-01-01/deploymentTemplate.json#",
              "contentVersion": "1.0.0.0",
              "resources": [
                {
                  "type": "Microsoft.Storage/storageAccounts",
                  "apiVersion": "2017-10-01",
                  "name": "storage1",
                  "location": "eastus",
                  "kind": "StorageV2",
                  "sku": {
                    "name": "Standard_LRS"
                  }
                }
              ]
            }
          }
        }
      ]
    }
    ```

    Which cmdlet should you run to deploy the template?
  choices:
    A: New-AzResource
    B: New-AzResourceGroupDeployment
    C: New-AzTenantDeployment
    D: New-AzDeployment
  answer: D
  user_answer: B
  user_result: incorrect
  learning_note: |
    Choose the cmdlet from the outer template's scope. Creating a resource group
    requires a subscription deployment, even when a nested deployment creates
    a storage account inside that group. New-AzDeployment targets a subscription;
    New-AzResourceGroupDeployment targets an existing resource group.
  explanation: |
    **D — New-AzDeployment** is correct. The supplied answer B is incorrect.
    The outer template creates RG1 through Microsoft.Resources/resourceGroups,
    which is a subscription-level resource. New-AzDeployment runs at subscription
    scope; New-AzSubscriptionDeployment is its alias.

    The nested Microsoft.Resources/deployments resource targets RG1 through
    its resourceGroup property and creates storage1 inside that resource group.
    dependsOn makes this nested deployment wait until RG1 exists. The storage
    account's scope does not determine the scope of the outer deployment.

    **A** creates an individual resource rather than deploying this ARM template.
    **B** deploys a template into an existing resource group and cannot create
    the outer subscription-level resource group shown here.
    **C** targets tenant scope, whereas this template's outer scope is subscription.

    Example command for a corrected subscription template:

    ```powershell
    New-AzDeployment -Location eastus -TemplateFile ./template.json
    ```

    The exhibit has a schema inconsistency: the outer template uses the
    resource-group deployment schema. For a valid subscription template, change
    the outer $schema to
    https://schema.management.azure.com/schemas/2018-05-01/subscriptionDeploymentTemplate.json#.
    Keep the nested template's resource-group schema. The screenshot also omits
    quotation marks around schema URLs; they are restored in the transcription
    to make the example valid JSON. The intended cmdlet remains D.

    Remember: creating a resource group means deploying at subscription scope.

