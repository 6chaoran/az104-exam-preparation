- id: '065'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure virtual machines
  question: |
    HOTSPOT

    You have an Azure subscription.

    You deploy a virtual machine scale set that is configured as shown in the
    following exhibit.

    | Setting | Value |
    |---------|-------|
    | Initial instance count | 2 |
    | Scaling policy | Custom |
    | Minimum number of VMs | 1 |
    | Maximum number of VMs | 10 |
    | Scale-out CPU threshold | 75% |
    | Scale-out duration | 10 minutes |
    | Number of VMs to increase by | 1 |
    | Scale-in CPU threshold | 25% |
    | Number of VMs to decrease by | 1 |
    | Collect diagnostic logs from Autoscale | Disabled |
    | Scale-in policy | Default - balance across availability zones and fault domains, then delete V... |

    The scale-in policy description is truncated in the exhibit. Scale-in
    duration and cooldown settings are not displayed.

    Use the drop-down menus to select the answer choice that answers each
    question based on the information presented in the graphic.

    NOTE: Each correct selection is worth one point.

    1. At 9:00 AM, the scale set starts and CPU utilization is 90 percent for
       15 minutes. How many virtual machine instances will be running at 9:15 AM?
    2. At 10:00 AM, the scale set has five virtual machine instances running
       and CPU utilization falls to less than 15 percent for 60 minutes.
       How many virtual machine instances will be running at 11:00 AM?
  choices:
    Instance count at 9:15 AM: [2, 3, 4, 5]
    Instance count at 11:00 AM: [1, 2, 3, 4]
  answer:
    Instance count at 9:15 AM: 3
    Instance count at 11:00 AM: 1
  user_answer:
    Instance count at 9:15 AM: 3
    Instance count at 11:00 AM: 1
  user_result: correct
  user_reasoning: |
    Scale out once to three instances in the first scenario. Scale in to the
    minimum of one instance in the second scenario.
  learning_note: |
    The intended answers are 3 and 1: increase from the initial two instances
    by one, then repeatedly scale in during sustained low CPU until reaching
    the minimum. A metric duration is a rolling lookback window, not a fixed
    interval between scaling actions; cooldown is a separate setting.
  explanation: |
    Both selections match the intended exam calculation:

    - **9:15 AM: 3 instances.** The initial count is two. CPU at 90% exceeds
      the 75% threshold, and the intended timeline applies one increase after
      the ten-minute condition is met: 2 + 1 = 3.
    - **11:00 AM: 1 instance.** Starting at five, sustained CPU below 15% is
      below the 25% scale-in threshold. Repeated decreases of one reach the
      configured minimum of one, which prevents further scale-in.

    Disabling diagnostic logs does not disable autoscale. The scale-in policy
    determines which instances are removed rather than the minimum count.

    The exhibit does not show cooldowns or the scale-in duration, so the exact
    counts at clock boundaries are not guaranteed from these settings alone.
    Autoscale evaluates a rolling metric window and can act again after its
    cooldown; it does not necessarily wait another full ten-minute window.
    Metric ingestion, evaluation, provisioning, and flapping checks can also
    affect timing. The answers assume the simplified timing intended by the exam.

    [Microsoft Learn: Autoscale settings and cooldown](https://learn.microsoft.com/en-au/azure/azure-monitor/autoscale/autoscale-understanding-settings)
- id: '066'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure Azure App Service
  question: |
    You have web apps in the West US, Central US and East US Azure regions.

    You have the App Service plans shown in the following table.

    | Name | Operating system | Location | SKU and size |
    |------|------------------|----------|--------------|
    | ASP1 | Windows | West US | Standard S1 |
    | ASP2 | Linux | Central US | Premium V2 P1v2 |
    | ASP3 | Linux | East US | Premium V2 P1v2 |
    | ASP4 | Linux | East US | Premium V2 P1v2 |

    You plan to create an additional App Service plan named ASP5 that will use
    the Linux operating system.

    You need to identify in which of the currently used locations you can deploy ASP5.

    What should you recommend?
  choices:
    A: West US, Central US, or East US
    B: Central US only
    C: East US only
    D: West US only
  answer: A
  user_answer: A
  user_result: correct
  learning_note: |
    A new Linux App Service plan can be deployed in any of the listed regions.
    Existing plans do not reserve a region for one OS or prevent additional
    plans. Creating a new plan is different from moving an app between plans.
  explanation: |
    **A — West US, Central US, or East US** is correct. The existing plans'
    operating systems and counts do not restrict ASP5 to a particular region.
    ASP5 can use Linux in any of the three listed locations, subject to the
    selected SKU's regional availability and subscription capacity.

    ASP1 being Windows does not make West US a Windows-only region. ASP2–ASP4
    being Linux does not restrict new Linux plans to Central US or East US.
    Multiple App Service plans can exist in one region, as ASP3 and ASP4 illustrate.

    **B, C, and D** each unnecessarily restrict deployment to one location.

    This question creates a new plan. Moving an existing app to another plan
    has additional requirements, including compatible OS, region, resource group,
    and deployment unit. Those move requirements do not govern ASP5's creation.

    [Microsoft Learn: Create and manage an App Service plan](https://learn.microsoft.com/en-us/azure/app-service/app-service-plan-manage)
    [Microsoft Learn: App Service plan CLI](https://learn.microsoft.com/en-us/cli/azure/appservice/plan?view=azure-cli-latest)
- id: '068'
  skill: Deploy and manage Azure compute resources
  sub-skill: Automate deployment of resources by using Azure Resource Manager (ARM) templates or Bicep files
  question: |
    HOTSPOT

    You have an Azure subscription that contains the resources shown in the
    following table.

    | Name | Type |
    |------|------|
    | ManagementGroup1 | Management group |
    | RG1 | Resource group |
    | 9c8bc1cd-7655-4c66-b3ea-a8ee101d8f75 | Subscription ID |
    | Tag1 | Tag |

    In Azure Cloud Shell, you need to create a virtual machine by using an
    Azure Resource Manager (ARM) template.

    How should you complete the command? To answer, select the appropriate
    options in the answer area.

    NOTE: Each correct selection is worth one point.

    ```powershell
    $adminPassword = Read-Host -Prompt "Enter the administrator password" -AsSecureString
    [cmdlet choice] [scope choice] `
      -TemplateUri "https://raw.githubusercontent.com/Azure/azure-quickstart-templates/master/101-vm-simple-windows/azuredeploy.json" `
      -adminUsername LocalAdministrator -adminPassword $adminPassword -dnsLabelPrefix ContosoVM1
    ```
  choices:
    Cmdlet:
      - New-AzVm
      - New-AzResource
      - New-AzTemplateSpec
      - New-AzResourceGroupDeployment
    Scope argument:
      - -Tag Tag1
      - -ResourceGroupName RG1
      - -GroupName ManagementGroup1
      - -Subscription 9c8bc1cd-7655-4c66-b3ea-a8ee101d8f75
  answer:
    Cmdlet: New-AzResourceGroupDeployment
    Scope argument: -ResourceGroupName RG1
  user_answer:
    Cmdlet: New-AzResourceGroupDeployment
    Scope argument: -ResourceGroupName RG1
  user_result: correct
  learning_note: |
    New-AzResourceGroupDeployment deploys an ARM template at resource-group
    scope. ResourceGroupName selects the target group; TemplateUri supplies
    the template, and the additional template parameters configure its resources.
  explanation: |
    Both selections are correct. Complete the command with:

    ```powershell
    New-AzResourceGroupDeployment -ResourceGroupName RG1
    ```

    The remainder of the command supplies TemplateUri and the VM template's
    administrator username, secure password, and DNS label parameters. The
    selected subscription comes from the active Azure PowerShell context.

    **New-AzVM** creates a VM directly rather than deploying the supplied ARM
    template. **New-AzResource** creates an individual resource. **New-AzTemplateSpec**
    stores a reusable template spec; it does not deploy the VM from this URI.

    A tag does not identify the deployment scope. ManagementGroup1 is not the
    resource group receiving the VM, and the offered Subscription argument does
    not replace ResourceGroupName for this resource-group deployment command.

    The template URI is preserved from the historical exhibit. Verify that it
    still resolves and check its parameter names before executing a real deployment.
    Line continuations are represented using PowerShell backticks.

