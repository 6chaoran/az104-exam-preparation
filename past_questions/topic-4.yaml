  tags:
    - must-review
  skill: Deploy and manage Azure compute resources
  sub-skill: Provision and manage containers in the Azure portal
  question: |
    HOTSPOT

    You are creating an Azure Kubernetes Service (AKS) cluster as shown in the
    following exhibit.

    **Create Kubernetes cluster — Validation passed**

    | Section | Setting | Value |
    | --- | --- | --- |
    | Basics | Subscription | Visual Studio Premium with MSDN |
    | Basics | Resource group | RG1 |
    | Basics | Region | West Europe |
    | Basics | Kubernetes cluster name | AKS1 |
    | Basics | Kubernetes version | 1.20.9 |
    | Node pools | Node pools | 1 |
    | Node pools | Enable virtual nodes | Disabled |
    | Node pools | Enable virtual machine scale sets | Enabled |
    | Authentication | Authentication method | Service principal |
    | Authentication | Role-based access control (RBAC) | Enabled |
    | Authentication | AKS-managed Azure Active Directory | Disabled |
    | Authentication | Encryption type | (Default) Encryption at-rest with a platform-managed key |
    | Networking | Network configuration | Kubenet |
    | Networking | DNS name prefix | AKS1-dns |
    | Networking | Load balancer | Standard |
    | Networking | Private cluster | Disabled |
    | Networking | Authorized IP ranges | Disabled |
    | Networking | Network policy | None |
    | Networking | HTTP application routing | No |

    Complete the following statements by selecting the appropriate options.

    1. To ensure that you can create Windows containers in AKS1, you must
       [answer choice].
    2. To ensure that you can integrate AKS1 with an Azure container registry,
       you must modify the [answer choice] setting.
  choices:
    Windows containers:
      - enable virtual nodes
      - increase the number of node pools
      - modify the Kubernetes version setting
      - modify the Network configuration setting
    Azure container registry integration:
      - AKS-managed Azure Active Directory
      - Authentication method
      - Authorized IP ranges
      - Kubernetes version
      - Network configuration
  answer:
    Windows containers: modify the Network configuration setting
    Azure container registry integration: Authentication method
  user_answer:
    Windows containers: increase the number of node pools
    Azure container registry integration: Authentication method
  user_result: partially_correct
  learning_note: |
    Windows node pools require Azure CNI; kubenet is a blocker even if another
    node pool is added. Authentication method is the intended portal-integration
    answer, but a service principal can also access ACR when granted pull permissions.
  explanation: |
    Intended selections:

    - **Windows containers: modify the Network configuration setting.** The
      exhibit uses kubenet, which does not support Windows node pools. Select
      Azure CNI networking. A Windows user node pool is also required alongside
      the Linux system pool, but increasing the pool count alone leaves the
      kubenet incompatibility unresolved.
    - **Azure container registry integration: Authentication method.** The
      intended portal workflow switches from a service principal to managed
      identity for built-in registry integration. Grant the kubelet identity
      the appropriate image-pull role on the registry; switching identity alone
      does not grant access.

    Your first selection must be corrected; your second matches the intended
    answer. The second statement is overstated: changing authentication method
    is not universally required to use ACR. An AKS service principal can pull
    images when granted the appropriate registry permissions, such as AcrPull
    on a registry using RBAC Registry Permissions. Thus this answer is specific
    to the intended portal integration workflow, not a general ACR requirement.

    Virtual nodes do not resolve Windows node pool networking requirements.
    Kubernetes 1.20.9 supported Windows workloads historically, so changing its
    version is not the intended Windows-support fix. It is an obsolete version
    for a new deployment today; the question preserves an older portal exhibit.
    AKS-managed Azure Active Directory (now Microsoft Entra ID) governs user
    access to the cluster, not the node identity used to pull images. Authorized
    IP ranges restrict access to the Kubernetes API server. Neither the Kubernetes
    version nor network configuration grants registry pull permissions.

    For standard RBAC registries, managed-identity integration uses AcrPull.
    ABAC-enabled registries instead require Container Registry Repository Reader
    and a manual role assignment rather than the standard attach-acr workflow.

    [Microsoft Learn: Kubenet does not support Windows node pools](https://learn.microsoft.com/en-us/azure/aks/configure-kubenet)
