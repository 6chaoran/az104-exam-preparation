- id: '069'
  skill: Deploy and manage Azure compute resources
  sub-skill: Provision and manage containers in the Azure portal
  question: |
    Note: This question is part of a series of questions that present the same
    scenario. Each question in the series contains a unique solution that might
    meet the stated goals. Some question sets might have more than one correct
    solution, while others might not have a correct solution.

    After you answer a question in this section, you will NOT be able to return
    to it. As a result, these questions will not appear in the review screen.

    You deploy an Azure Kubernetes Service (AKS) cluster named AKS1.

    You need to deploy a YAML file to AKS1.

    Solution: From Azure Cloud Shell, you run az aks.

    Does this meet the goal?
  choices:
    A: Yes
    B: No
  answer: B
  user_answer: B
  user_result: correct
  user_reasoning: |
    The proposed replacement command was az aks create (entered as az ask create).
  learning_note: |
    The answer B is correct, but the replacement command should be kubectl apply
    -f manifest.yaml. az aks create provisions an AKS cluster; it does not deploy
    Kubernetes YAML resources to an existing cluster. Get credentials first if needed.
  explanation: |
    **B — No** is correct. Bare az aks is an Azure CLI command group, not a
    complete operation that submits the YAML file to the Kubernetes API.

    The suggested az aks create correction is also unsuitable: AKS1 already
    exists, and that command creates a cluster rather than applying a workload
    manifest. From Cloud Shell, configure the cluster connection and apply the file:

    ```bash
    az aks get-credentials --resource-group <AKS1-resource-group> --name AKS1
    kubectl apply -f manifest.yaml
    ```

    Replace the placeholders with the actual resource group and YAML filename.
    kubectl is available in Azure Cloud Shell. The active Kubernetes context
    must target AKS1, and the caller must have permission to create the resources.

    **A** is incorrect because the proposed command alone does not deploy the file.
    Specific Azure CLI features can invoke kubectl remotely, but bare az aks
    does not perform that operation.

    [Microsoft Learn: Connect to AKS and deploy an application](https://learn.microsoft.com/en-us/azure/aks/learn/quick-kubernetes-deploy-portal?tabs=azure-cli)
- id: '070'
  skill: Monitor and maintain Azure resources
  sub-skill: Monitor resources in Azure
  question: |
    Note: This question is part of a series of questions that present the same
    scenario. Each question in the series contains a unique solution that might
    meet the stated goals. Some question sets might have more than one correct
    solution, while others might not have a correct solution.

    After you answer a question in this section, you will NOT be able to return
    to it. As a result, these questions will not appear in the review screen.

    You have an Azure virtual machine named VM1 that runs Windows Server 2016.

    You need to create an alert in Azure when more than two error events are
    logged to the System event log on VM1 within an hour.

    Solution: You create an Azure Log Analytics workspace and configure the data
    settings. You add the Microsoft Monitoring Agent VM extension to VM1. You
    create an alert in Azure Monitor and specify the Log Analytics workspace
    as the source.

    Does this meet the goal?
  choices:
    A: true
    B: false
  answer: A
  user_answer: A
  user_result: correct
  learning_note: |
    Collect System error events into Log Analytics, filter to VM1, and create
    a log search alert for more than two matching records in a one-hour window.
    The historical MMA configuration is replaced by Azure Monitor Agent and
    data collection rules for current deployments.
  explanation: |
    **A — Yes** is the intended historical answer. Workspace data settings
    can collect System error events from VM1 through the Microsoft Monitoring Agent VM extension.
    A workspace-scoped Azure Monitor log search alert can count those records
    over one hour and trigger when the count is greater than two.

    Configure the alert to filter the Event table to VM1, EventLog equal to
    System, and EventLevel equal to 2 (Error). Use a one-hour evaluation window
    and a matching-record count threshold greater than 2. A workspace alone is
    insufficient unless collection and the alert condition are configured.

    **B** is incorrect under the historical scenario because the solution
    provides collection, storage, and log-based alerting for guest events.

    Microsoft Monitoring Agent (the legacy Log Analytics agent) retired on
    August 31, 2024. For a current deployment, install Azure Monitor Agent and
    associate a data collection rule that sends System error events to the
    Log Analytics workspace, then create the corresponding log search alert.
    The original question wording is preserved as a historical practice question.

    [Microsoft Learn: Collect Windows events with AMA](https://learn.microsoft.com/en-us/azure/azure-monitor/vm/data-collection-windows-events)
    [Microsoft Learn: Log Analytics agent retirement](https://learn.microsoft.com/en-us/azure/azure-monitor/vm/vminsights-migrate-agent)
