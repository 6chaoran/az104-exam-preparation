- id: '083'
  skill: Deploy and manage Azure compute resources
  sub-skill: Provision and manage containers in the Azure portal
  question: |
    HOTSPOT

    You have an Azure subscription that contains an Azure Kubernetes Service
    (AKS) cluster named Cluster1. Cluster1 hosts a node pool named Pool1 that
    has four nodes.

    You need to perform a coordinated upgrade of Cluster1. The solution must
    meet the following requirements:

    - Deploy two new nodes to perform the upgrade.
    - Minimize costs.

    How should you complete the command? To answer, select the appropriate
    options in the answer area.

    NOTE: Each correct selection is worth one point.

    ```azurecli
    az aks nodepool [Blank 1] -n pool1 -g RG1 --cluster-name cluster1 [Blank 2]
    ```
  choices:
    Blank 1:
      - add
      - get-updates
      - scale
      - updates
    Blank 2:
      - --max-count 2
      - --max-pods 2
      - --max-surge 2
      - --node-count 2
  answer:
    Blank 1: updates
    Blank 2: --max-surge 2
  user_answer:
    Blank 1: add
    Blank 2: --node-count 2
  user_result: incorrect
  learning_note: |
    max-surge configures temporary extra capacity during upgrades. node-count
    specifies the total desired pool size, not the number of extra upgrade nodes.
    Update an existing pool; add creates a new pool. The exhibit misspells update
    as updates.
  explanation: |
    Intended selections: **updates** (a typo for **update**) and **--max-surge 2**.
    Both supplied selections require correction. The screenshot has no valid
    spelling of the required subcommand: the real Azure CLI command is update,
    singular. The answer preserves the displayed option and flags this defect.

    Correct executable command:

    ```azurecli
    az aks nodepool update -n pool1 -g RG1 --cluster-name cluster1 --max-surge 2
    ```

    Pool1 already exists. update changes its upgrade settings; --max-surge 2
    allows two temporary additional nodes during a rolling upgrade. The pool
    can temporarily grow from four to six nodes and returns to its normal
    four-node size when the upgrade completes. This avoids keeping additional
    nodes permanently and meets the specified two-node surge requirement.

    This command configures the surge setting; it does not start the upgrade.
    Then initiate the coordinated cluster upgrade to the chosen supported
    Kubernetes version using az aks upgrade. The surge setting persists for
    future upgrades.

    add creates a new node pool and cannot create another Pool1 with the same
    name. get-updates lists available upgrades. scale changes normal pool size.
    --node-count 2 specifies a total of two nodes, not two additional nodes.
    --max-count 2 controls the autoscaler's upper node limit, while --max-pods 2
    limits pods per node. Neither configures upgrade surge capacity.

    Remember: normal capacity = node-count; temporary upgrade capacity = max-surge.

    [Microsoft Learn: AKS node pool CLI reference](https://learn.microsoft.com/en-us/cli/azure/aks/nodepool)
    [Microsoft Learn: Configure rolling upgrades and node surge](https://learn.microsoft.com/en-us/azure/aks/upgrade-aks-node-pools-rolling)
- id: '084'
  skill: Deploy and manage Azure compute resources
  sub-skill: Automate deployment of resources by using Azure Resource Manager (ARM) templates or Bicep files
  question: |
    HOTSPOT

    You have an Azure subscription.
    You create the following file named Deploy.json.

    ```json
    {
      "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentTemplate.json#",
      "contentVersion": "1.0.0.0",
      "parameters": {
        "location": {
          "type": "string",
          "defaultValue": "westus"
        }
      },
      "resources": [
        {
          "apiVersion": "2019-04-01",
          "type": "Microsoft.Storage/storageAccounts",
          "name": "[concat(copyIndex(),'storage', uniqueString(resourceGroup().id))]",
          "location": "[resourceGroup().location]",
          "sku": {
            "name": "Premium_LRS"
          },
          "kind": "StorageV2",
          "properties": {},
          "copy": {
            "name": "storagecopy",
            "count": 3
          }
        }
      ]
    }
    ```

    You connect to the subscription and run the following commands.

    ```powershell
    New-AzResourceGroup -Name RG1 -Location "centralus"
    New-AzResourceGroupDeployment -ResourceGroupName RG1 -TemplateFile "deploy.json"
    ```

    For each of the following statements, select Yes if the statement is true.
    Otherwise, select No.

    NOTE: Each correct selection is worth one point.
  choices:
    The commands will create four new resources.:
      - Yes
      - No
    The commands will create storage accounts in the West US Azure region.:
      - Yes
      - No
    The first storage account that is created will have a prefix of 0.:
      - Yes
      - No
  answer:
    The commands will create four new resources.: Yes
    The commands will create storage accounts in the West US Azure region.: No
    The first storage account that is created will have a prefix of 0.: Yes
  user_answer:
    The commands will create four new resources.: No
    The commands will create storage accounts in the West US Azure region.: No
    The first storage account that is created will have a prefix of 0.: Yes
  user_result: partially_correct
  user_reasoning: Counted three resources from the three copies; selected Central US because the accounts use the resource group location; identified copyIndex() as the reason for a prefix of 0.
  learning_note: |
    Count resources created by all commands: a new resource group plus three
    storage accounts gives four. Resource locations follow the expression used,
    not an unused location parameter. copyIndex() is zero-based; parallel copy
    deployment does not guarantee chronological creation order.
  explanation: |
    Intended answers: **Yes, No, Yes**. Your second and third answers match;
    the first must be corrected to Yes.

    1. **Yes.** The first command creates RG1, which is itself a subscription-level
       ARM resource. The second command creates three storage accounts because
       copy.count is 3. Total: one resource group plus three storage accounts.
       This assumes RG1 does not already exist, as intended by the question.
    2. **No.** Each storage account explicitly uses resourceGroup().location,
       which returns centralus for RG1. The location parameter defaults to westus
       but is never referenced by the storage resource. Resource groups do not
       generally force their members into the same region; this template explicitly
       chooses to use the group's location.
    3. **Yes, in the intended loop-order sense.** copyIndex() starts at 0, so the
       generated names begin with 0storage, 1storage, and 2storage, followed by the
       same resource-group-derived uniqueString suffix. The first iteration has
       prefix 0. However, resource copies deploy in parallel by default, so the
       statement does not guarantee which account finishes creation first.

    Remember: count every command; trace the actual location expression;
    copyIndex starts at zero.

    [Microsoft Learn: Resource iteration and copyIndex](https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/copy-resources)
    [Microsoft Learn: Resource groups as ARM resources](https://learn.microsoft.com/en-us/azure/templates/microsoft.resources/resourcegroups)
    [Microsoft Learn: Resource group scope functions](https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/template-functions-scope)
- id: '086'
  skill: Deploy and manage Azure compute resources
  sub-skill: Automate deployment of resources by using Azure Resource Manager (ARM) templates or Bicep files
  question: |
    HOTSPOT

    You have an Azure subscription that contains a resource group named RG1.

    You plan to use an Azure Resource Manager (ARM) template named template1
    to deploy resources. The solution must meet the following requirements:

    - Deploy new resources to RG1.
    - Remove all the existing resources from RG1 before deploying the new resources.

    How should you complete the command? To answer, select the appropriate
    options in the answer area.

    NOTE: Each correct selection is worth one point.

    ```powershell
    New-AzResourceGroupDeployment -TemplateUri "https://contoso.com/template1" -TemplateParameterFile params.json [Blank 1] RG1 -Mode [Blank 2]
    ```
  choices:
    Blank 1:
      - -Name
      - -QueryString
      - -ResourceGroupName
      - -Tag
    Blank 2:
      - All
      - Complete
      - Incremental
  answer:
    Blank 1: -ResourceGroupName
    Blank 2: Complete
  user_answer:
    Blank 1: -ResourceGroupName
    Blank 2: Complete
  user_result: correct
  learning_note: |
    ResourceGroupName selects the target group. Complete mode deletes resources
    absent from the template; Incremental retains them. Complete mode is not a
    guaranteed delete-everything-first operation and retains or updates existing
    resources that are also defined in the template.
  explanation: |
    Both selections match the intended answer: **-ResourceGroupName** and **Complete**.

    ```powershell
    New-AzResourceGroupDeployment -TemplateUri "https://contoso.com/template1" -TemplateParameterFile params.json -ResourceGroupName RG1 -Mode Complete
    ```

    -ResourceGroupName targets RG1. Complete mode deploys resources described by
    the template and deletes eligible existing resources in RG1 that are absent
    from the resolved template. Incremental mode retains resources absent from
    the template. All is not a valid deployment mode.

    -Name names the deployment rather than selecting the target resource group.
    -QueryString supplies a query string for a template URI, and -Tag specifies
    deployment tags; neither selects RG1.

    The question's wording is imprecise: Complete does not guarantee removal
    of all existing resources before creating new ones. Existing resources also
    included in the template are retained or updated, and deletion is part of
    deployment rather than a guaranteed preliminary wipe. The intended scenario
    assumes existing resources are omitted from the new template and eligible
    for deletion. Some child resource types have additional deletion rules.

    Current Microsoft guidance recommends deployment stacks for resource
    deletion as Complete mode is being gradually deprecated. Complete remains
    the intended choice among these historical exam options.

    Remember: Incremental keeps omitted resources; Complete deletes omitted resources.

    [Microsoft Learn: ARM deployment modes](https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/deployment-modes)
- id: '087'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure Azure App Service
  question: |
    HOTSPOT

    You have an Azure App Service web app named app1.
    You configure autoscaling as shown in the following exhibit.

    **Default — Auto created scale condition**

    | Setting | Value |
    | --- | --- |
    | Scale mode | Scale based on a metric |
    | Scale-out rule summary | (Average) CpuPercentage > 70; Increase count by 1 |
    | Minimum instances | 1 |
    | Maximum instances | 5 |
    | Default instances | 1 |
    | Schedule | Executed when none of the other scale conditions match |

    The portal recommends at least one scale-in rule; none is shown. It also
    states that the last or default recurrence rule cannot be deleted and that
    autoscale can instead be disabled.

    You configure the autoscale rule criteria as shown in the following exhibit.

    | Setting | Value |
    | --- | --- |
    | Time aggregation | Maximum |
    | Metric namespace | App Service plans standard metrics |
    | Metric name | CPU Percentage |
    | Dimension name | Instance |
    | Dimension operator | = |
    | Dimension values | All values |
    | Current displayed CpuPercentage (Maximum) | 1.67% |
    | Enable metric divide by instance count | Not selected |
    | Operator | Greater than |
    | Metric threshold to trigger scale action | 70% |
    | Duration | 10 minutes |
    | Time grain | 1 minute |
    | Time grain statistic | Average |
    | Operation | Increase count by |
    | Instance count | 1 |
    | Cool down | 5 minutes |

    The chart shows low recent CPU usage near zero and a dashed threshold line
    at 70%. The dimension note says multiple selected values are aggregated
    together rather than evaluated individually.

    Use the drop-down menus to answer each question based on the graphics.

    NOTE: Each correct selection is worth one point.
  choices:
    After CPU usage has reached 80 percent for 15 minutes, how many instances will be running?:
      - 1 instance
      - 2 instances
      - 3 instances
      - 4 instances
      - 5 instances
    Once the first scale-out instance is created, what is the minimum time before an additional instance is created?:
      - 1 minute
      - 5 minutes
      - 10 minutes
      - 15 minutes
  answer:
    After CPU usage has reached 80 percent for 15 minutes, how many instances will be running?: 4 instances
    Once the first scale-out instance is created, what is the minimum time before an additional instance is created?: 5 minutes
  user_answer:
    After CPU usage has reached 80 percent for 15 minutes, how many instances will be running?: 2 instances
    Once the first scale-out instance is created, what is the minimum time before an additional instance is created?: 5 minutes
  user_result: partially_correct
  user_reasoning: Expected one scale-out to two instances followed by a five-minute cooldown; identified cooldown as the minimum interval before another instance.
  learning_note: |
    Duration is a rolling metric lookback, not a mandatory ten-minute delay.
    Maximum aggregation can trigger when one sample exceeds the threshold.
    Sustained high CPU permits repeated scale-outs after each cooldown.
  explanation: |
    Under the usual simplified exam timing, the answers are **4 instances**
    and **5 minutes**. Your cooldown answer is correct; the instance count
    needs correction. Assume the app starts with one instance and its measured
    CPU remains at 80% despite scaling.

    Maximum aggregation selects the highest one-minute average in the preceding
    ten-minute window. A high sample can therefore trigger scale-out without
    waiting for ten continuous minutes above 70%. Duration is the lookback window,
    not a timer that restarts after each scaling action.

    Once the first high sample triggers a scale-out, the count grows from 1 to 2.
    After the five-minute cooldown, sustained high CPU allows 2 to 3, then after
    another cooldown 3 to 4. With the first sampled high metric arriving around
    minute 1, a simplified timeline is approximately minutes 1, 6, and 11,
    producing four instances by minute 15. The limit of five is a ceiling,
    not a target that is immediately reached.

    Five minutes is the configured minimum cooldown before this rule can initiate
    another scaling action. The one-minute time grain is metric sampling; the
    ten-minute duration is lookback; neither replaces the cooldown.

    **When does the ten-minute duration matter?** Every time autoscale evaluates
    whether the metric threshold is met, it examines the preceding ten minutes
    of samples. The aggregation determines how those samples are combined:

    | Time aggregation | Meaning for the ten-minute window |
    | --- | --- |
    | Maximum | Compare the highest sample with 70%; a brief spike can qualify. |
    | Average | Compare the average of the samples with 70%; a brief spike may not qualify. |
    | Minimum | Compare the lowest sample with 70%; all available samples must exceed 70%. |

    For example, with one minute at 80% and nine minutes at 20%, Maximum is
    80% and triggers, Average is 26% and does not trigger, and Minimum is 20%
    and does not trigger. These values assume ten equally weighted one-minute
    samples and the greater-than-70% threshold shown in the exhibit.

    With Maximum aggregation, a high sample can remain in the lookback window
    after CPU drops. It can still satisfy the rule when cooldown expires,
    potentially allowing another scale-out until that sample leaves the window.
    The window continues to roll forward during cooldown; it does not restart
    after a scaling action.

    Memory aid: the ten-minute duration asks whether recent CPU justifies
    scaling; the five-minute cooldown asks whether this rule can scale again yet.

    Timing caveat: the exhibit does not guarantee an exact real-world count at
    precisely minute 15. Evaluation timing, metric ingestion, scale-operation
    completion, starting capacity, and CPU changes affect the result. The default
    instance count alone does not prove current capacity. The four-instance answer
    uses the exam's implied initial capacity and simplified sampling assumptions.
    The summary says Average while the detailed rule specifies Maximum; this
    explanation follows the detailed criteria.

    [Microsoft Learn: Autoscale aggregation stages](https://learn.microsoft.com/en-us/azure/azure-monitor/autoscale/autoscale-best-practices)
    [Microsoft Learn: Autoscale lookback and cooldown settings](https://learn.microsoft.com/en-us/azure/azure-monitor/autoscale/autoscale-understanding-settings)
