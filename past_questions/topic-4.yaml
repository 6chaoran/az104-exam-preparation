- id: '078'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure Azure App Service
  question: |
    HOTSPOT

    You have an Azure App Service app named WebApp1 that contains two folders
    named Folder1 and Folder2.

    You need to configure a daily backup of WebApp1. The solution must ensure
    that Folder2 is excluded from the backup.

    What should you create first and what should you use to exclude Folder2?
    To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  choices:
    First create:
      - An Azure Storage account
      - A Backup vault
      - A Recovery Services vault
      - A resource group
    To exclude Folder2, use:
      - A _backup.filter file
      - A backup policy
      - A lock
      - A WebJob
  answer:
    First create: An Azure Storage account
    To exclude Folder2, use: A _backup.filter file
  user_answer:
    First create: A Recovery Services vault
    To exclude Folder2, use: A _backup.filter file
  user_result: partially_correct
  learning_note: |
    App Service custom scheduled backups use an Azure Storage account and blob
    container, rather than a Recovery Services vault. A _backup.filter file
    lists files and folders to exclude from custom backups.
  explanation: |
    Correct selections:

    - **First create: An Azure Storage account.** App Service custom backups
      are stored in a blob container in your storage account. Configure a daily
      custom backup schedule using this destination.
    - **To exclude Folder2, use: A _backup.filter file.** Place this file in
      %HOME%\site\wwwroot and list the excluded paths, one per line, relative
      to %HOME%.

    Your second selection is correct. Your first selection must be corrected
    from a Recovery Services vault to an Azure Storage account.

    If Folder2 is directly under wwwroot, the filter file contains:

    ```text
    \site\wwwroot\Folder2
    ```

    Partial backups with exclusions are supported for custom backups, including
    custom scheduled backups; they are not supported for App Service automatic
    backups. The exact filename is _backup.filter, including the leading underscore.

    A Recovery Services vault and a Backup vault serve other Azure Backup
    workloads and are not the destination for App Service custom backups.
    A resource group alone provides no backup storage. A backup policy does not
    provide the App Service folder exclusion list; a lock controls resource
    changes, and a WebJob runs background tasks rather than configuring these
    built-in backup exclusions.

    **Recovery Services vault versus App Service backup**

    Choose by what you are backing up. A VM or server workload points to a
    Recovery Services vault (RSV); an App Service web app uses its own backup feature.

    | Distinction | Recovery Services vault | App Service custom backup |
    | --- | --- | --- |
    | What it protects | Azure VMs, Azure file shares, SQL/SAP HANA in VMs, and server files through MARS | Web app files and configuration |
    | Backup destination | Managed through the vault | Blob container in your Azure Storage account |
    | Schedule and retention | Azure Backup policies | App Service backup settings |
    | Folder exclusions | Depend on the workload or agent | _backup.filter |
    | Typical exam clue | Back up VM1 or use the MARS agent | Back up WebApp1 or exclude a website folder |

    These are separate backup mechanisms. A Recovery Services vault is not a
    universal destination for every Azure backup.

    For this question, follow the clues:

    1. WebApp1 means App Service backup.
    2. Daily schedule plus folder exclusion means a custom scheduled backup.
    3. The custom backup destination requires a storage account.
    4. Exclude Folder2 through _backup.filter.

    App Service also provides automatic backups on supported tiers. Those do
    not require your own storage account, but do not support folder exclusions.

    Remember: VM → vault. Web app custom backup → blob. Exclude web folders → filter.

    [Microsoft Learn: Azure Backup workload support](https://learn.microsoft.com/en-us/azure/backup/backup-support-matrix)
    [Microsoft Learn: Back up an App Service app and configure partial backups](https://learn.microsoft.com/en-us/azure/app-service/manage-backup)
- id: '079'
  skill: Deploy and manage Azure compute resources
  sub-skill: Automate deployment of resources by using Azure Resource Manager (ARM) templates or Bicep files
  question: |
    You plan to deploy several Azure virtual machines that will run Windows
    Server 2019 in a virtual machine scale set by using an Azure Resource
    Manager template.

    You need to ensure that NGINX is available on all the virtual machines
    after they are deployed.

    What should you use?
  choices:
    A: the Publish-AzVMDscConfiguration cmdlet
    B: Azure Application Insights
    C: Azure Custom Script Extension
    D: a Microsoft Endpoint Manager device configuration profile
  answer: C
  user_answer: C
  user_result: correct
  learning_note: |
    Custom Script Extension downloads and runs installation scripts on VM
    instances. Include it in the scale set's ARM configuration to install
    software on each instance after provisioning. Publishing a DSC package
    alone does not apply its configuration to the VMs.
  explanation: |
    **C — Azure Custom Script Extension** is correct. It downloads and runs
    scripts for post-deployment configuration and software installation.
    Configure the Windows Custom Script Extension in the scale set template
    to execute a PowerShell script that installs and configures NGINX on each
    VM instance, including newly provisioned instances.

    For Windows, the extension publisher is Microsoft.Compute and its type
    is CustomScriptExtension. In a Uniform scale set ARM template, define it
    under properties.virtualMachineProfile.extensionProfile.extensions.
    The script must install the Windows version of NGINX and configure startup
    if the application must run automatically.

    **A** publishes a Desired State Configuration (DSC) script package; it does
    not by itself execute the configuration on all instances. DSC with a properly
    configured DSC extension can install software, but publishing alone is not
    the complete solution offered here.
    **B** monitors application performance and telemetry; it does not install NGINX.
    **D** is a device-management configuration mechanism rather than the ARM VM
    extension used to install software during scale set provisioning.

    Remember: install software after VM deployment = Custom Script Extension.

    [Microsoft Learn: Custom Script Extension for Windows](https://learn.microsoft.com/en-us/azure/virtual-machines/extensions/custom-script-windows)
    [Microsoft Learn: Deploy applications to a scale set](https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/virtual-machine-scale-sets-deploy-app)
- id: '080'
  skill: Deploy and manage Azure compute resources
  sub-skill: Automate deployment of resources by using Azure Resource Manager (ARM) templates or Bicep files
  question: |
    HOTSPOT

    You have an Azure subscription. The subscription contains a virtual machine
    that runs Windows 10.

    You need to join the virtual machine to an Active Directory domain.

    How should you complete the Azure Resource Manager (ARM) template? To answer,
    select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.

    **Answer area — template excerpt**

    Replace [Blank 1] with the resource type and [Blank 2] with the property
    containing the domain password.

    ```json
    {
      "apiVersion": "2017-03-30",
      "type": "[Blank 1]",
      "name": "[concat(parameters('VName'), '/joindomain')]",
      "location": "[parameter('location')]",
      "properties": {
        "publisher": "Microsoft.Compute",
        "type": "JsonADDomainExtension",
        "typeHandlerVersion": "1.3",
        "autoUpgradeMinorVersion": true,
        "settings": {
          "Name": "[parameters('domainName')]",
          "User": "[parameters('domainusername')]",
          "Restart": "true",
          "Options": "3"
        },
        "[Blank 2]": {
          "Password": "[parameters('domainPassword')]"
        }
      }
    }
    ```
  choices:
    Blank 1:
      - Extensions
      - Microsoft.Compute/VirtualMachines
      - Microsoft.Compute/virtualMachines/extensions
    Blank 2:
      - ProtectedSettings
      - Settings
      - Statuses
  answer:
    Blank 1: Microsoft.Compute/virtualMachines/extensions
    Blank 2: ProtectedSettings
  user_answer:
    Blank 1: Microsoft.Compute/virtualMachines/extensions
    Blank 2: ProtectedSettings
  user_result: correct
  learning_note: |
    Domain join is performed by JsonADDomainExtension, deployed as a VM extension
    child resource. Put passwords in protectedSettings rather than public settings.
    The ARM resource type and the extension handler type are separate fields.
  explanation: |
    Both selections are correct: **Microsoft.Compute/virtualMachines/extensions**
    and **ProtectedSettings** (the dropdown label). Your abbreviated answer is
    recorded using the corresponding full option names.

    The outer type identifies a VM extension child resource. The name combines
    the parent VM name with /joindomain. Inside properties, type identifies the
    specific extension handler, JsonADDomainExtension, published by Microsoft.Compute.
    This handler joins the Windows VM to an Active Directory domain.

    Public settings contain the domain name, username, restart instruction, and
    join options. The password belongs in protectedSettings, which is encrypted
    for delivery to the VM and decrypted there. Declare domainPassword as a
    secureString parameter in the surrounding template as well.

    Extensions alone is not the fully qualified resource type.
    Microsoft.Compute/VirtualMachines describes the VM itself rather than its
    extension. Settings is for public configuration, while Statuses reports
    extension state rather than supplying a secret.

    The exhibit's location expression contains a typo: parameter('location')
    should be parameters('location'). Use the canonical lower-camel-case ARM
    property protectedSettings in a working template; the choices above preserve
    the screenshot's capitalization.

    Successful domain join also requires connectivity and DNS resolution to the
    domain controllers and an account authorized to join computers to the domain.

    Remember: outer type = VM extension resource; inner type = extension handler;
    password = protectedSettings.

