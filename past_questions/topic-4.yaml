    You deploy an Azure Kubernetes Service (AKS) cluster named AKS1.

    You need to deploy a YAML file to AKS1.

    Solution: From Azure CLI, you run the kubectl client.

    Does this meet the goal?
  choices:
    A: Yes
    B: No
  answer: A
  user_answer: B
  user_result: incorrect
  learning_note: |
    kubectl is the Kubernetes client used to apply YAML manifests to AKS.
    Distinguish managing the Azure cluster with az aks from deploying Kubernetes
    resources inside the cluster with kubectl.
  explanation: |
    **A — Yes** is the expected answer. The supplied answer B has been preserved
    in user_answer, but corrected in answer based on the documented deployment
    workflow.

    The question identifies the kubectl client as the deployment tool. Once
    configured to connect to AKS1, it can deploy the YAML manifest with:

    ```bash
    az aks get-credentials --resource-group <resource-group> --name AKS1
    kubectl apply -f <file.yaml>
    ```

    **B — No** is incorrect under this interpretation because kubectl is the
    appropriate client for deploying Kubernetes resources from YAML manifests.
    The wording is abbreviated: literally running kubectl without a subcommand
    only displays help and does not deploy anything. The expected exam reading
    is using the client to deploy the file, rather than invoking a bare command.

    Remember: az aks manages the Azure cluster; kubectl manages Kubernetes
    resources within the cluster.

    [Microsoft Learn: Deploy an AKS cluster using Azure CLI](https://learn.microsoft.com/en-us/azure/aks/learn/quick-kubernetes-deploy-cli)
- id: '003'
  skill: Deploy and manage Azure compute resources
  sub-skill: Provision and manage containers in the Azure portal
  tags:
