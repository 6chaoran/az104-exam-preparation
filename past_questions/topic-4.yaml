- id: '095'
  skill: Deploy and manage Azure compute resources
  sub-skill: Automate deployment of resources by using Azure Resource Manager (ARM) templates or Bicep files
  question: |
    HOTSPOT

    You have an Azure subscription that contains the resource groups shown
    in the following table.

    | Name | Location |
    | --- | --- |
    | RG1 | East US |
    | RG2 | West US |

    You create the following Azure Resource Manager (ARM) template named deploy.json.

    ```json
    {
      "$schema": "https://schema.management.azure.com/schemas/2015-01-01/deploymentTemplate.json#",
      "contentVersion": "1.0.0.0",
      "parameters": {},
      "variables": {},
      "resources": [
        {
          "type": "Microsoft.Resources/resourceGroups",
          "apiVersion": "2018-05-01",
          "location": "eastus",
          "name": "[concat('RG', copyIndex())]",
          "copy": {
            "name": "copy",
            "count": 4
          }
        }
      ],
      "outputs": {}
    }
    ```

    You deploy the template by running the following cmdlet.

    ```powershell
    New-AzSubscriptionDeployment -Location westus -TemplateFile deploy.json
    ```

    For each statement, select Yes if the statement is true. Otherwise, select No.

    NOTE: Each correct selection is worth one point.
  choices:
    The template creates a resource group named RG0 in the East US Azure region.:
      - Yes
      - No
    The template creates four new resource groups.:
      - Yes
      - No
    The template creates a resource group named RG3 in the West US Azure region.:
      - Yes
      - No
  answer:
    The template creates a resource group named RG0 in the East US Azure region.: Yes
    The template creates four new resource groups.: No
    The template creates a resource group named RG3 in the West US Azure region.: No
  user_answer:
    The template creates a resource group named RG0 in the East US Azure region.: No
    The template creates four new resource groups.: Yes
    The template creates a resource group named RG3 in the West US Azure region.: Yes
  user_result: incorrect
  user_reasoning: Believed the cmdlet's location setting overrides the template's resource location.
  learning_note: |
    Subscription deployment Location controls deployment metadata storage, not
    resource locations. A four-iteration loop targets RG0 through RG3, but RG1
    and RG2 already exist. RG2's immutable location conflicts with eastus, so
    the deployment has an additional failure condition.
  explanation: |
    Intended template-reading answers: **Yes, No, No**. All three supplied
    selections require correction.

    1. **Yes.** copyIndex() starts at zero, so the first generated name is RG0.
       Its resource location is explicitly eastus.
    2. **No.** The loop targets RG0, RG1, RG2, and RG3. RG1 and RG2 already exist,
       so these are not four new groups. Only RG0 and RG3 are new names.
    3. **No.** RG3's resource location is eastus, not westus.

    -Location westus on New-AzSubscriptionDeployment specifies where Azure stores
    the deployment record. It does not override the hard-coded location in the
    resource definition. The parameters object is empty, so this is also not a
    template parameter override.

    The exhibit has two defects that prevent treating these answers as guaranteed
    outcomes of a successful run. The outer schema should be the subscription
    deployment schema:
    https://schema.management.azure.com/schemas/2018-05-01/subscriptionDeploymentTemplate.json#.
    Also, RG2 already exists in West US, while the loop attempts to deploy RG2
    with location East US. A resource group's location cannot be changed, so
    this conflict causes a deployment error. ARM deployments are not atomic;
    do not assume exactly which other resources will be created before failure.
    The Yes for RG0 expresses the intended name and location, not a guarantee
    that this defective deployment completes successfully.

    Remember: deployment location stores the deployment record; resource
    location determines the resource's region. Copy count is the number of
    targeted instances, not necessarily the number of newly created resources.

    [Microsoft Learn: Subscription deployment location](https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/deploy-to-subscription)
    [Microsoft Learn: Resource group location cannot be changed](https://learn.microsoft.com/en-us/azure/templates/microsoft.resources/2016-09-01/resourcegroups)
    [Microsoft Learn: Resource copy loops](https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/copy-resources)
- id: '096'
  skill: Deploy and manage Azure compute resources
  sub-skill: Create and configure Azure App Service
  question: |
    You have an Azure App Service app named App1 that contains two running instances.

    You have an autoscale rule configured as shown in the following exhibit.

    | Setting | Value |
    | --- | --- |
    | Metric namespace | Standard metrics |
    | Metric name | Memory Percentage |
    | Dimension name | Instance |
    | Dimension operator | = |
    | Dimension values | All values |
    | Displayed MemoryPercentage (Average) | 39.28% |
    | Enable metric divide by instance count | Not selected |
    | Operator | Greater than |
    | Metric threshold to trigger scale action | 70% |
    | Duration | 15 minutes |
    | Time grain | 1 minute |
    | Time grain statistic | Average |
    | Time aggregation | Average |
    | Operation | Increase count by |
    | Instance count | 1 |
    | Cool down | 5 minutes |

    The chart shows recent memory usage near 39% and a dashed threshold at 70%.
    The dimension note states that autoscale aggregates the metric across
    selected values rather than evaluating each value individually.

    For the Instance limits scale condition setting, you set Maximum to 5.

    During a 30-minute period, App1 uses 80 percent of the available memory.

    What is the maximum number of instances for App1 during the 30-minute period?
  choices:
    A: '2'
    B: '3'
    C: '4'
    D: '5'
  answer: D
  user_answer: B
  user_result: incorrect
  user_reasoning: Expected a first scale-out after 15 minutes from two to three instances, followed by five minutes of cooldown and only ten minutes toward another required 15-minute duration.
  learning_note: |
    Autoscale duration is a rolling lookback and does not restart after scaling
    or pause during cooldown. Sustained high memory can trigger another scale-out
    after the five-minute cooldown, until the maximum instance limit is reached.
  explanation: |
    **D — 5** is correct under the question's assumption that measured memory
    stays at 80% throughout the 30-minute period and scale operations finish
    in time. Your answer B relies on treating Duration as a fresh timer after
    each cooldown; that is not how the rolling metric window works.

    Even using a conservative simplified timeline where the first action occurs
    at minute 15, App1 can scale from 2 to 3 at minute 15, from 3 to 4 at minute
    20, and from 4 to 5 at minute 25. Five is the configured maximum.

    The first action can occur earlier than minute 15: Average aggregation
    compares the rolling 15-minute average with 70%, rather than requiring every
    sample to exceed 70%. If earlier samples were around 39%, roughly twelve
    one-minute samples at 80% would lift that average above 70%. The precise
    first action depends on actual preceding metrics and evaluation timing.

    After cooldown, the engine still examines the preceding 15 minutes, which
    include high-memory samples collected before, during, and after the earlier
    scale-out. It does not wait five minutes and then collect a fresh 15-minute
    set. Repeated actions are possible while that rolling average remains high.

    A ignores the triggered rule, B stops after one action, and C stops after
    two actions despite enough time for another action in the simplified scenario.
    Real counts depend on metric ingestion, provisioning time, and how memory
    changes as instances are added; five is the maximum permitted and achievable
    under the stated sustained-load scenario, not a provisioning-time guarantee.

    Remember: Duration = rolling lookback; cooldown = minimum interval between
    actions; Maximum = ceiling on instance count.

    [Microsoft Learn: Autoscale lookback, aggregation, and cooldown](https://learn.microsoft.com/en-us/azure/azure-monitor/autoscale/autoscale-understanding-settings)
- id: '097'
  skill: Deploy and manage Azure compute resources
  sub-skill: Provision and manage containers in the Azure portal
  question: |
